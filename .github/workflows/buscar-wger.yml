# TEMPORÁRIO: busca candidatos de figura no wger para os exercícios sem imagem.
# A rede da sessão na nuvem não alcança wger.de; a do Actions alcança.
# Sai do repositório antes de ir para o main.
name: Buscar wger

on:
  push:
    branches: ["claude/**"]

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Candidatos
        run: node .github/buscar-wger.js

          uid: novoUid(),
          exercicioId: it.exercicioId,
          obs: it.obs || "",
          conjunto: it.conjunto || null,   // bi-set/tri-set definido na ficha
          descanso: it.descanso || null,   // descanso próprio deste exercício
          sugerido: sug || null,
          series: montarSeries(ex, it.series, it.reps, sug),
        };
      }),
    });
    setAba("sessao");
    // Quem já usou o Jarvis não quer ligar o microfone a cada treino. O toque em
    // "Treinar" é o gesto que o navegador exige para abrir o microfone.
    if (vozRef.current.preferido && !vozAtiva) ligarVoz();
  };

  const iniciarSessao = (treino) => {
    if (!treino.itens.length) { avisar("Esta ficha ainda não tem exercícios. Edite a ficha primeiro."); return; }
    if (sessao && sessao.treinoId === treino.id) { setAba("sessao"); return; }
    if (sessao) {
      pedirConfirmacao("Você já tem um treino em andamento (" + sessao.nome + "). Começar outro vai descartá-lo. Continuar?", () => comecarSessao(treino));
      return;
    }
    comecarSessao(treino);
  };

  const iniciarTreinoLivre = () => {
    const comecar = () => {
      const hoje = new Date().toLocaleDateString("pt-BR", { weekday: "long" });
      setSessao({
        treinoId: "livre-" + Date.now(),
        nome: "Treino livre (" + hoje + ")",
        inicio: Date.now(),
        itens: [],
      });
      setAba("sessao");
      registrarEvento("treino-livre-iniciado");
      if (vozRef.current.preferido && !vozAtiva) ligarVoz();
    };
    if (sessao) {
      pedirConfirmacao("Você já tem um treino em andamento (" + sessao.nome + "). Começar um treino livre vai descartá-lo. Continuar?", comecar);
      return;
    }
    comecar();
  };

  // Funcional não é ficha: não tem carga para sugerir e as repetições variam
  // muito de um movimento para o outro. Mas vira uma sessão comum assim que
  // começa — e por isso histórico, nível, conquistas e recordes funcionam sem
  // precisar de nada novo.
  const iniciarFuncional = (ids) => {
    if (!ids || !ids.length) return;
    const hoje = new Date().toLocaleDateString("pt-BR", { weekday: "long" });
    const treino = {
      id: "func-" + Date.now(),
      nome: "Funcional (" + hoje + ")",
      itens: ids.map((id) => {
        const s = SUGESTAO_FUNCIONAL[id] || { series: 3, reps: 12, descanso: 45 };
        return { uid: novoUid(), exercicioId: id, series: s.series, reps: s.reps, obs: "", descanso: s.descanso || null, conjunto: null };
      }),
    };
    const comecar = () => { comecarSessao(treino); registrarEvento("funcional-iniciado"); };
    if (sessao) {
      pedirConfirmacao("Você já tem um treino em andamento (" + sessao.nome + "). Começar o funcional vai descartá-lo. Continuar?", comecar);
      return;
    }
    comecar();
  };

  // Cada frase ouvida passa por aqui: nome do assistente, interpretação e
  // encaminhamento. Fica depois de iniciarSessao de propósito — comandos de
  // voz podem começar um treino.
  const tratarFala = (bruto, alternativas) => {
    // Sem isto, qualquer exceção no caminho deixa o Jarvis mudo sem explicação,
    // e quem está na academia não tem como saber se o microfone morreu.
    try { tratarFalaInterno(bruto, alternativas); }
    catch (e) { anotarDiario(bruto, "ERRO: " + (e && e.message)); mostrarVoz(bruto, "Tive um problema para processar isso. Pode repetir?", false); }
  };
  const tratarFalaInterno = (bruto, alternativas) => {
    const norm = normalizarFala(bruto);
    if (!norm) return;
    // Na escola tudo é exercício de laboratório: a frase chega inteira, com ou
    // sem o nome dele, e nada é gravado em treino nenhum.
    if (aba === "escolaVoz" && acoesEscola.current.receber) {
      const d0 = depoisDeJarvis(norm);
      anotarDiario(bruto, "escola: avaliando a lição");
      acoesEscola.current.receber(bruto, d0 === null ? norm : d0, d0 !== null);
      return;
    }

    // Durante a aula o vocabulário muda de sentido: "pausa" é pausar a aula, e
    // não começar um descanso; "pula" é pular o bloco, e não trocar de exercício.
    // Por isso a aula responde antes do interpretador geral.
    if (CONTROLE_AULA) {
      const dA = depoisDeJarvis(norm);
      const r = CONTROLE_AULA.comando(dA === null ? norm : dA);
      if (r) { anotarDiario(bruto, "aula: " + r.acao); mostrarVoz(bruto, r.resposta, true); return; }
    }

    const naSessao = !!(sessao && acoesVoz.current && acoesVoz.current.vivo);
    const ctxVoz = { descansando: descansando, naSessao: naSessao };

    // Com música alta e ferro batendo, a transcrição certa raramente é a
    // primeira. O reconhecedor manda até cinco palpites e, até aqui, quatro
    // iam para o lixo. Vale mais o palpite que vira comando COM o nome dele.
    const palpites = [norm];
    (alternativas || []).slice(1).forEach((a) => {
      const n = normalizarFala(a);
      if (n && palpites.indexOf(n) < 0) palpites.push(n);
    });
    let depois = depoisDeJarvis(norm);
    let corpo = depois === null ? norm : depois;
    let c = corpo ? interpretarVoz(corpo, ctxVoz) : null;
    let ouvido = bruto;
    if (!(c && depois !== null)) {
      for (let k = 1; k < palpites.length; k++) {
        const d = depoisDeJarvis(palpites[k]);
        const corpoK = d === null ? palpites[k] : d;
        const cK = corpoK ? interpretarVoz(corpoK, ctxVoz) : null;
        if (!cK) continue;
        const melhor = !c || (d !== null && depois === null);
        if (!melhor) continue;
        c = cK; depois = d; corpo = corpoK; ouvido = (alternativas || [])[k] || palpites[k];
        anotarDiario(ouvido, "entendido por outra alternativa do microfone");
        if (depois !== null) break;
      }
    }
    const comNome = depois !== null;
    const naJanela = Date.now() <= janelaSeguir.current;

    // Só o nome, sem comando. Ele fica de orelha em pé, mas CALADO: se
    // respondesse falando, a pergunta que vem logo em seguida cairia dentro da
    // janela em que o microfone ignora a própria voz dele — e sumiria.
    if (!c && comNome && !corpo) {
      anotarDiario(bruto, "só o nome — janela aberta por 25s");
      setVozParcial("");
      setVozUltima({ ouvi: bruto, resposta: "Estou ouvindo. Pode perguntar.", ok: true, t: Date.now() });
      janelaSeguir.current = Date.now() + 25000;
      return;
    }

    if (!c) {
      // Sem o nome dele, frase que não é comando é conversa de academia:
      // fecha a janela e fica quieto, em vez de responder a quem não falou com ele.
      // A janela NÃO se fecha aqui. Era o que matava o comando seguinte: o
      // primeiro pedaço da frase ("anota", "anota aí") não é comando, fechava a
      // janela, e a frase completa chegava depois, já trancada do lado de fora.
      if (!comNome) { anotarDiario(bruto, "sem o nome e não é comando — ignorado (conversa)"); return; }
      anotarDiario(bruto, "nome reconhecido, mas não virou comando");
      mostrarVoz(bruto, "Não entendi. Toque no ? do microfone para ver o que dá para falar.", false);
      return;
    }
    // Fora da janela e sem o nome, só pergunta passa (ver PERGUNTA_SEGURA)
    if (!comNome && !naJanela && !PERGUNTA_SEGURA[c.tipo]) {
      anotarDiario(bruto, "“" + (ROTULO_TIPO[c.tipo] || c.tipo) + "” precisa do nome dele — ignorado");
      return;
    }
    // A observação é texto para ler depois: precisa dos acentos e das maiúsculas
    // que a normalização tirou.
    c.cru = ouvido;
    anotarDiario(ouvido, "entendido: " + (ROTULO_TIPO[c.tipo] || c.tipo) + (comNome ? " (com o nome)" : " (sem o nome)"));
    registrarEvento("jarvis-comando");

    if (c.tipo === "ajuda") {
      // Quem pergunta no meio do treino está com o celular no bolso: a resposta
      // principal é falada, e a lista na tela é o complemento.
      if (!c.assunto) setAjudaVoz(true);
      mostrarVoz(bruto, AJUDA_FALADA[c.assunto || "geral"] || AJUDA_FALADA.geral, true);
      return;
    }
    if (c.tipo === "escola") {
      setAjudaVoz(false);
      setAba("escolaVoz");
      mostrarVoz(bruto, "Vamos praticar. Eu mostro a frase, você repete, e eu digo o que entendi. Nada é anotado aqui.", true);
      return;
    }
    if (c.tipo === "mudo") { setVoz((v) => ({ ...v, falar: false })); mostrarVoz(bruto, "Certo, respondo só na tela.", true); return; }
    if (c.tipo === "desligar") {
      mostrarVoz(bruto, "Até logo.", true);
      setTimeout(desligarVoz, 1600);
      return;
    }
    if (c.tipo === "boraTreinar") {
      // Aceitar a sugestão do dia sem repetir o nome da ficha. Se já houver
      // treino em andamento, "bora" é só voltar para ele.
      if (sessao) {
        setAba("sessao");
        mostrarVoz(bruto, "Voltando para " + sessao.nome + ".", true);
        return;
      }
      const sug = responderConsulta({ tipo: "sugestaoHoje" }, {
        historico: historico, todos: todos, exPorId: exPorId,
        treinos: treinos, medidas: medidas, meta: meta,
      });
      const rec = recuperacaoMuscular(historico, exPorId);
      const prontos = rec.filter((g) => g.estado === "pronto").slice(0, 2);
      const alvoG = prontos.length ? prontos : rec.slice(0, 2);
      let melhorF = null, melhorP = 0;
      treinos.forEach((t) => {
        if (!t.itens || !t.itens.length) return;
        let p = 0;
        t.itens.forEach((it) => {
          const e = exPorId(it.exercicioId);
          if (e && alvoG.some((g) => g.id === e.grupo)) p++;
        });
        if (p > melhorP) { melhorP = p; melhorF = t; }
      });
      if (!melhorF) {
        iniciarTreinoLivre();
        mostrarVoz(bruto, "Não achei ficha para hoje. Comecei um treino livre.", true);
        return;
      }
      iniciarSessao(melhorF);
      mostrarVoz(bruto, "Bora! " + melhorF.nome + ". " + (sug ? sug.fala.split(". ")[0] + "." : ""), true);
      return;
    }
    if (c.tipo === "aula") {
      const alvoN = semAcento(c.frase || "");
      const achada = AULAS.find((a) => alvoN.indexOf(semAcento(a.nome)) >= 0);
      if (!achada) {
        setAba("funcional");
        mostrarVoz(bruto, "Qual aula? Tem " + AULAS.map((a) => a.nome).join(", ") + ".", true);
        return;
      }
      setAulaPedida(achada);
      setAba("funcional");
      mostrarVoz(bruto, "Aula " + achada.nome + ". " + duracaoAula(achada) + " minutos. Prepare-se.", true);
      return;
    }
    if (c.tipo === "iniciarTreino") {
      const pedido = (c.nome || "").trim();
      if (/\blivre\b/.test(pedido) || (!pedido && !treinos.length)) {
        iniciarTreinoLivre();
        mostrarVoz(bruto, "Treino livre começando. Vá ditando os exercícios.", true);
        return;
      }
      const fichas = treinos.filter((t) => t.itens && t.itens.length);
      if (!fichas.length) { mostrarVoz(bruto, "Você ainda não tem ficha com exercícios. Diga: Jarvis, treino livre.", false); return; }
      let escolhida = null;
      if (pedido) {
        const alvoN = semAcento(pedido);
        escolhida = fichas.find((t) => semAcento(t.nome) === alvoN) ||
          fichas.find((t) => semAcento(t.nome).indexOf(alvoN) >= 0) ||
          fichas.find((t) => alvoN.indexOf(semAcento(t.nome)) >= 0) ||
          (alvoN.length === 1 ? fichas.find((t) => new RegExp("\\b" + alvoN + "\\b").test(semAcento(t.nome))) : null);
      }
      if (!escolhida) {
        mostrarVoz(bruto, "Qual ficha? Você tem: " + fichas.slice(0, 4).map((t) => t.nome).join(", ") + ".", false);
        setAba("treinos");
        return;
      }
      iniciarSessao(escolhida);
      mostrarVoz(bruto, "Começando " + escolhida.nome + ". Pode ditar as séries.", true);
      return;
    }

    if (naSessao) {
      if (aba !== "sessao") setAba("sessao");
      const r = acoesVoz.current.executar(c);
      if (r) { mostrarVoz(bruto, r.fala, r.ok); return; }
      // o que a sessão não resolve pode ser uma pergunta sobre o histórico
    }

    // Perguntar "qual meu recorde no supino" ou "o que eu treino hoje" não
    // devia exigir um treino aberto — são perguntas sobre o que já aconteceu.
    const resposta = responderConsulta(c, {
      historico: historico, todos: todos, exPorId: exPorId,
      treinos: treinos, medidas: medidas, meta: meta,
    });
    if (resposta) { anotarDiario("", "respondi: " + resposta.fala.slice(0, 70)); mostrarVoz(bruto, resposta.fala, resposta.ok); return; }

    const primeira = treinos.find((t) => t.itens && t.itens.length);
    mostrarVoz(bruto, "Para isso preciso de um treino em andamento. Diga: Jarvis, começa o treino " +
      (primeira ? primeira.nome : "livre") + ".", false);
  };
  tratarFalaRef.current = tratarFala;

  const finalizarSessao = () => {
    const feitas = sessao.itens.reduce((a, it) => a + it.series.filter((s) => s.feito).length, 0);
    if (!feitas) {
      avisar("Marque pelo menos uma série com ✓ antes de finalizar o treino.");
      return;
    }
    const registro = {
      id: String(Date.now()),
      nome: sessao.nome,
      data: new Date().toISOString(),
      // O relógio conta desde o início da sessão; o teto de 5h evita que um treino
      // esquecido aberto vire "480 min" e distorça as médias.
      duracaoMin: Math.max(1, Math.min(300, Math.round((Date.now() - sessao.inicio) / 60000))),
      itens: sessao.itens.map((it) => ({
        exercicioId: it.exercicioId,
        obs: it.obs || "",
        // preserva o formato: isometria grava segundos, e o aquecimento fica
        // marcado para continuar fora do volume e dos recordes no histórico
        series: it.series.filter((s) => s.feito).map((s) => {
          const nova = ehCardio(s) ? { segundos: s.segundos, vel: s.vel, incl: s.incl || "0" }
            : ehTempo(s) ? { segundos: s.segundos } : { peso: s.peso, reps: s.reps };
          if (ehAquecimento(s)) nova.aquec = true;
          return nova;
        }),
      })).filter((it) => it.series.length > 0),
    };
    // O batimento do treino entra no registro. Um número por treino diz mais do
    // que o gráfico minuto a minuto que ninguém abre depois.
    const resumoBpm = resumoCardioRef.current ? resumoCardioRef.current.fechar() : null;
    if (resumoBpm) registro.bpm = resumoBpm;
    resumoCardioRef.current = criarResumoCardio();
    // Salva as observações de volta na ficha (altura do banco, polia etc. ficam guardadas).
    // Casa pelo exercício, e não pela posição: dá para adicionar e remover exercícios
    // durante o treino, o que desalinharia os índices e gravaria a obs no lugar errado.
    const obsPorEx = {}, descansoPorEx = {};
    sessao.itens.forEach((it) => {
      obsPorEx[it.exercicioId] = it.obs || "";
      if (it.descanso) descansoPorEx[it.exercicioId] = it.descanso;
    });
    setTreinos(treinos.map((t) => {
      if (t.id !== sessao.treinoId) return t;
      return {
        ...t,
        itens: t.itens.map((it) => {
          if (!Object.prototype.hasOwnProperty.call(obsPorEx, it.exercicioId)) return it;
          const novo = { ...it, obs: obsPorEx[it.exercicioId] };
          // o descanso ajustado durante o treino fica valendo para as próximas vezes
          if (descansoPorEx[it.exercicioId]) novo.descanso = descansoPorEx[it.exercicioId];
          return novo;
        }),
      };
    }));
    setSessao(null);
    guardarTreino(registro);
  };

  // Tudo que acontece depois que um treino vira registro: guardar, somar,
  // comparar, comemorar e contar em voz alta. A aula de circuito entra por aqui
  // também — ela não tem ficha nem sessão, mas o resumo, os recordes, as
  // conquistas e o nível são exatamente os mesmos.
  const guardarTreino = (registro, evento) => {
    setHistorico([registro, ...historico]);
    setAba("historico");
    const st = statsTreino(registro);
    const nRec = contarRecordesNovos(historico, registro);
    const comp = compararAnterior([registro, ...historico], registro);
    registrarEvento(evento || "treino-concluido");
    let msg = "Treino concluído! 🎉\n\n";
    if (st.volume > 0) msg += "🏋️ " + fmtKg(st.volume) + " de volume total\n";
    msg += st.series + " " + plural(st.series, "série", "séries") + (st.reps > 0 ? " · " + st.reps + " " + plural(st.reps, "repetição", "repetições") : "") + " · " + st.exercicios + " " + plural(st.exercicios, "exercício", "exercícios") + "\n";
    if (st.segundos > 0) msg += "⏳ " + st.segundos + "s de isometria\n";
    // A esteira com a conta de gasto do ACSM, com o peso de quem treina
    let kcalCardio = 0;
    (registro.itens || []).forEach((it) => {
      const e = exPorId(it.exercicioId);
      if (exCardio(e)) kcalCardio += resumoCardio(it.series, pesoCorporal, e.cardio === "corrida").kcal;
    });
    if (st.cardioMin > 0) msg += "🏃 Esteira: " + num1(st.cardioKm) + " km em " + Math.round(st.cardioMin) + " min · ~" + Math.round(kcalCardio) + " kcal\n";
    if (st.seriesAquec > 0) msg += "(mais " + st.seriesAquec + " " + plural(st.seriesAquec, "série", "séries") + " de aquecimento, fora da conta)\n";
    msg += "⏱ " + registro.duracaoMin + " min";
    if (st.densidade > 0) msg += " · " + st.densidade + " kg/min · carga máx. " + st.cargaMax + " kg";
    if (comp) msg += "\n" + (comp.pct >= 0 ? "▲ +" : "▼ ") + comp.pct + "% de volume vs. o treino anterior";
    if (nRec > 0) msg += "\n🏆 " + nRec + " " + plural(nRec, "recorde pessoal batido", "recordes pessoais batidos") + "!";
    // Conquistas destravadas por este treino (antes só apareciam caladas na tela inicial)
    const antes = calcularEstatisticas(historico);
    const depois = calcularEstatisticas([registro, ...historico]);
    const novas = CONQUISTAS.filter((c) => c.cond(depois) && !c.cond(antes));
    if (novas.length) {
      msg += "\n\n🎖 " + plural(novas.length, "Nova conquista", "Novas conquistas") + ": " +
        novas.map((c) => c.icone + " " + c.nome).join(", ");
    }
    // O resumo na tela exige parar e ler. Falado, chega enquanto a pessoa guarda
    // a anilha — e é o momento em que o número do volume significa alguma coisa.
    if (vozAtiva) {
      let dito = "Treino fechado. " + st.series + " " + plural(st.series, "série", "séries") +
        " em " + registro.duracaoMin + " " + plural(registro.duracaoMin, "minuto", "minutos") + ". ";
      if (st.volume > 0) dito += fmtPeso(st.volume) + " movidos. ";
      if (st.cardioMin > 0) dito += num1(st.cardioKm) + " quilômetros de esteira. ";
      if (comp) dito += (comp.pct >= 0 ? "Mais " : "Menos ") + Math.abs(comp.pct) + " por cento de volume que o treino anterior. ";
      if (nRec > 0) dito += nRec + " " + plural(nRec, "recorde pessoal", "recordes pessoais") + "! ";
      if (novas.length) dito += plural(novas.length, "Nova conquista", "Novas conquistas") + ": " + novas.map((x) => x.nome).join(", ") + ". ";
      setTimeout(() => responderVoz(dito, true), 600);
    }

    const abrirResumo = () => setModal({
      msg: msg,
      storyTreino: {
        nome: registro.nome, series: st.series, reps: st.reps, volume: st.volume,
        duracao: registro.duracaoMin, densidade: st.densidade, cargaMax: st.cargaMax, recordes: nRec,
      },
    });

    // Subir de nível merece o palco só para ele: o resumo entra depois da festa.
    const nvAntes = nivelDe(antes), nvDepois = nivelDe(depois);
    if (nvDepois.indice > nvAntes.indice) {
      registrarEvento("subiu-de-nivel");
      celebrar({
        icone: nvDepois.icone,
        titulo: "Você subiu de nível",
        destaque: "Nível " + nvDepois.indice + "\n" + nvDepois.nome,
        detalhe: nvDepois.proximo
          ? "Próxima parada: " + nvDepois.proximo.icone + " " + nvDepois.proximo.nome
          : "Você chegou ao topo da tabela. 👑",
      });
      setTimeout(abrirResumo, 3600);
    } else {
      setTimeout(abrirResumo, 250);
    }
  };

  // ---- backup em arquivo: um toque, e o arquivo vai para o Downloads ----
  const baixarBackup = async () => {
    // As fotos vão dentro do arquivo: um backup que não leva tudo é uma armadilha.
    // Isso engorda o arquivo, e é por isso que o texto copiável não as inclui.
    const fotosDados = {};
    for (const f of fotos) {
      try {
        const blob = await lerFoto(f.id);
        if (blob) fotosDados[f.id] = await blobParaBase64(blob);
      } catch (e) {}
    }
    // As fotos dos aparelhos vão junto: é o dado que não existe em catálogo
    // nenhum, e trocar de celular sem elas apagaria o álbum da academia.
    const fotosEx = {};
    for (const e of customEx) {
      if (!e.foto) continue;
      try {
        const blob = await lerFoto(chaveFotoEx(e.id));
        if (blob) fotosEx[e.id] = await blobParaBase64(blob);
      } catch (err) {}
    }

    const arq = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    const id = trocaFotoRef.current;
    trocaFotoRef.current = null;
    if (!arq || !id) return;
    try {
      const b = await reduzirImagem(arq, 720, 0.72);
      await guardarFotoEx(id, b);
      // o cache guarda o endereço antigo: sem esquecer, a tela mostraria a foto velha
      esquecerFotoEx(id);
      setCustomEx((prev) => prev.map((e) => (e.id === id ? { ...e, foto: true } : e)));
    } catch (e) {
      avisar("Não consegui usar essa imagem. Tente fotografar de novo.");
    }
  };

  const abas = [
    { id: "inicio", nome: "Início", icone: "⌂" },
    { id: "exercicios", nome: "Exercícios", icone: "💪" },
    { id: "treinos", nome: "Fichas", icone: "▤" },
    { id: "historico", nome: "Histórico", icone: "◷" },
  ];
  const titulos = { inicio: "Treino Livre", exercicios: "Exercícios", treinos: "Meus treinos", historico: "Histórico", editarTreino: "Editar ficha", sessao: "Treino", novoExercicio: "Novo exercício", assistente: "Assistente", editarHistorico: "Corrigir treino", ajustes: "Ajustes", escolaVoz: "Escola do Jarvis", funcional: "Treino funcional" };

  if (!carregado) {
    return <div style={{ ...S.app, display: "flex", alignItems: "center", justifyContent: "center" }}>Carregando...</div>;
  }

  // A portaria fica DEPOIS de todos os hooks e de todos os efeitos: quem chegou
  // por um link de ficha tem o conteúdo lido normalmente, e o convite para
  // adicionar aparece assim que a porta abre. Trocar isso por um desvio mais
  // acima faria o link compartilhado morrer na porta.
  if (abertura) return <Abertura onFim={() => setAbertura(false)} />;

  if (!entrou) {
    return <Portaria temDados={historico.length > 0 || treinos.length > 0}
      podeInstalar={!!promptInstalar} onInstalar={instalarApp} onCopiarLink={copiarLink}
      onEntrar={liberarPortaria} />;
  }

  return (
    <div style={S.app}>
      <Header titulo={titulos[aba]} tema={tema}
        onTema={() => setTema(tema === "escuro" ? "claro" : "escuro")}
        onAjustes={() => setAba(aba === "ajustes" ? "inicio" : "ajustes")} />
      <div style={{ paddingTop: 14 }}>
        {aba === "inicio" && (
          <TelaInicio programas={programas} treinos={treinos} historico={historico}
            meta={meta} exPorId={exPorId} avisoBackup={avisoBackup} onBaixarBackup={baixarBackup}
            onAbrirGrupo={(g) => { setGrupoAberto(g); setExercicioAberto(null); setAba("exercicios"); }}
            onAbrirProgresso={() => { setSecaoHistorico("stats"); setAba("historico"); }}
            onTreinar={iniciarSessao}
            onCriarPrograma={criarPrograma}
            onAssistente={() => setAba("assistente")}
            onTreinoLivre={iniciarTreinoLivre}
            onFuncional={() => setAba("funcional")}
            onEscolaVoz={() => setAba("escolaVoz")}
            convite={convite}
            onSeguir={() => {
              registrarEvento("seguiu-instagram");
              setConvite(false);
              window.open(LINK_INSTAGRAM, "_blank", "noopener");
            }}
            onDispensarConvite={() => setConvite(false)}
            onCopiarLink={copiarLink}
            onInstalar={baixarApp} instalado={JA_INSTALADO} />
        )}
        {aba === "ajustes" && (
          <TelaAjustes tema={tema} onTema={() => setTema(tema === "escuro" ? "claro" : "escuro")}
            som={som} setSom={setSom} descanso={descanso} setDescanso={setDescanso}
            meta={meta} setMeta={setMeta} lembrete={lembrete} setLembrete={setLembrete}
            avisar={avisar} ultimoBackup={ultimoBackup} totalEx={todos.length} historico={historico}
            onBaixarBackup={baixarBackup} onRestaurarArquivo={restaurarDeArquivo}
            onExportar={exportarDados} onImportar={importarDados}
            onInstalar={baixarApp} instalado={JA_INSTALADO}
            pedirAvisoDescanso={pedirAvisoDescanso}
            voz={voz} setVoz={setVoz} vozAtiva={vozAtiva}
            onAlternarVoz={() => (vozAtiva ? desligarVoz() : ligarVoz())}
            onAjudaVoz={() => setAjudaVoz(true)}
            onEscolaVoz={() => setAba("escolaVoz")}
            onDiagnosticoVoz={() => setDiagVoz(true)} onAtualizar={atualizarApp}
            onVoltar={() => setAba("inicio")} />
        )}
        {aba === "assistente" && (
          <TelaAssistente onGerar={gerarTreinoAssistente} onCancelar={() => setAba("inicio")} />
        )}
        {aba === "funcional" && (
          <TelaFuncional todos={todos} exPorId={exPorId} som={som} vozCfg={voz}
            aulaInicial={aulaPedida} onAulaAberta={() => setAulaPedida(null)} sessaoAtiva={!!sessao}
            vozAtiva={vozAtiva} onLigarVoz={ligarVoz}
            onAlternarContagem={() => setVoz((v) => ({ ...v, contarAlto: v.contarAlto === false }))}
            onVoltar={() => setAba("inicio")}
            onComecar={(ids) => iniciarFuncional(ids)}
            onConcluirAula={(registro) => guardarTreino(registro, "aula-concluida")} />
        )}
        {aba === "escolaVoz" && (
          <EscolaJarvis acoes={acoesEscola} ouvindo={vozAtiva} vozBarra={voz.barra} todos={todos}
            onLigarVoz={ligarVoz} onDesligarVoz={desligarVoz} onFalar={falarJarvis}
            onSair={() => setAba(sessao ? "sessao" : "inicio")} />
        )}
        {aba === "exercicios" && (
          <TelaExercicios todos={todos} exPorId={exPorId} historico={historico}
            grupoAberto={grupoAberto} setGrupoAberto={setGrupoAberto}
            exercicioAberto={exercicioAberto} setExercicioAberto={setExercicioAberto}
            onNovoExercicio={() => { setBaseNovoEx(null); setAba("novoExercicio"); }}
            onVariacao={criarVariacao} onTrocarFoto={trocarFotoEx}
            onExcluirCustom={excluirCustomEx} />
        )}
        {aba === "novoExercicio" && (
          <FormNovoExercicio key={baseNovoEx ? baseNovoEx.id : "novo"}
            grupoSugerido={grupoAberto} base={baseNovoEx} avisar={avisar}
            onSalvar={salvarCustomEx}
            onCancelar={() => { setBaseNovoEx(null); setAba("exercicios"); }} />
        )}
        {aba === "treinos" && (
          <TelaTreinos programas={programas} treinos={treinos} exPorId={exPorId}
            progAberto={progAberto} setProgAberto={setProgAberto}
            pedirConfirmacao={pedirConfirmacao}
            onTreinar={iniciarSessao}
            onNovaFicha={novaFicha}
            onEditar={(t) => { setEditandoTreino(JSON.parse(JSON.stringify(t))); setAba("editarTreino"); }}
            onExcluirFicha={(id) => setTreinos(treinos.filter((x) => x.id !== id))}
            onCompartilharFicha={compartilharFicha}
            onNovoPrograma={criarPrograma}
            onRenomearPrograma={renomearPrograma}
            onExcluirPrograma={excluirPrograma}
            onCompartilharPrograma={compartilharPrograma}
            onDuplicarFicha={duplicarFicha}
            onDuplicarPrograma={duplicarPrograma}
            onAssistente={() => setAba("assistente")}
            onTreinoLivre={iniciarTreinoLivre} />
        )}
        {aba === "editarTreino" && editandoTreino && (
          <TelaEditarTreino key={editandoTreino.id} treinoInicial={editandoTreino} todos={todos} avisar={avisar}
            onSalvar={salvarTreino}
            onCancelar={() => { setEditandoTreino(null); setAba("treinos"); }} />
        )}
        {aba === "sessao" && sessao && (
          <TelaSessao sessao={sessao} setSessao={setSessao} exPorId={exPorId} todos={todos} pedirConfirmacao={pedirConfirmacao}
            historico={historico} celebrar={celebrar}
            descanso={descanso} setDescanso={setDescanso}
            som={som} setSom={setSom}
            acoesVoz={acoesVoz} vozAtiva={vozAtiva} vozBarra={voz.barra} vozAnimado={voz.animado !== false}
            pesoCorporal={pesoCorporal}
            bpm={bpm} cardioEstado={cardioEstado}
            vozCfg={voz} contarAlto={voz.contarAlto !== false}
            onAlternarContagem={() => setVoz((v) => ({ ...v, contarAlto: v.contarAlto === false }))}
            autoSerie={voz.autoSerie !== false}
            onAlternarAuto={() => setVoz((v) => ({ ...v, autoSerie: v.autoSerie === false }))}
            onConectarCardio={conectarCardio} onDesconectarCardio={desconectarCardio}
            onDescansando={setDescansando} responderVoz={responderVoz}
            dicas={dicas} onDicaVista={marcarDica}
            onLigarVoz={ligarVoz} onEscolaVoz={() => setAba("escolaVoz")}
            onFinalizar={finalizarSessao}
            onVoltar={() => setAba("inicio")}
            onDescartar={() => { setSessao(null); setAba("inicio"); }} />
        )}
        {aba === "historico" && (
          <TelaHistorico historico={historico} exPorId={exPorId}
            onExcluir={excluirHistorico} onStory={storyDeTreino} pedirConfirmacao={pedirConfirmacao}
            onEditar={(hh) => { setEditandoHistorico(hh); setAba("editarHistorico"); }}
            medidas={medidas} onSalvarMedida={salvarMedida} onExcluirMedida={excluirMedida} avisar={avisar}
            fotos={fotos} onAdicionarFoto={adicionarFoto} onExcluirFoto={excluirFoto}
            meta={meta} setMeta={setMeta} secaoInicial={secaoHistorico}
            onStoryProgresso={storyProgresso} onDesafiar={desafiarAmigo} />
        )}
        {aba === "editarHistorico" && editandoHistorico && (
          <TelaEditarHistorico key={editandoHistorico.id} registro={editandoHistorico} exPorId={exPorId} avisar={avisar}
            onSalvar={salvarHistoricoEditado}
            onCancelar={() => { setEditandoHistorico(null); setAba("historico"); }} />
        )}
      </div>

      {modal && (
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.75)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}
          onClick={() => setModal(null)}>
          <div role="dialog" aria-modal="true" aria-label={String(modal.msg || "Aviso").split("\n")[0]}
            style={{ ...S.card, width: "100%", maxWidth: 340, marginBottom: 0, borderColor: "var(--borda2)" }}
            onClick={(e) => e.stopPropagation()}>
            <div style={{ fontSize: 15, lineHeight: 1.6, marginBottom: 16, whiteSpace: "pre-line" }}>{modal.msg}</div>
            {modal.prompt && (
              <input placeholder={modal.prompt} defaultValue={modal.valor || ""} autoFocus aria-label={modal.prompt}
                onChange={(e) => { importRef.current = e.target.value; }}
                style={{ ...S.input, marginBottom: 12 }} />
            )}
            {modal.storyTreino && (
              <button style={{ ...S.btn, marginBottom: 10 }} onClick={async () => {
                const st = modal.storyTreino;
                setModal(null);
                const blob = await gerarImagemStory(linhasStoryTreino(st));
                compartilharImagem(blob, "Treino concluído no Treino Livre! 💪 " + LINK_APP, avisar);
              }}>📸 Compartilhar no story</button>
            )}
            {modal.texto && (
              <React.Fragment>
                <textarea readOnly value={modal.texto} onFocus={(e) => e.target.select()}
                  aria-label="Conteúdo para copiar"
                  style={{ ...S.input, minHeight: 130, fontSize: 11, marginBottom: 10, fontFamily: "monospace" }} />
                <button style={{ ...S.btnGhost, marginBottom: 12, color: copiado ? "var(--ok)" : "var(--texto)", borderColor: copiado ? "var(--ok)" : "var(--borda2)" }}
                  onClick={async () => {
                    try {
                      await navigator.clipboard.writeText(modal.texto);
                      setCopiado(true);
                      setTimeout(() => setCopiado(false), 2500);
                    } catch (err) {}
                  }}>
                  {copiado ? "✓ Copiado!" : "📋 Copiar"}
                </button>
              </React.Fragment>
            )}
            {modal.importar && (
              <textarea placeholder="Cole o código do backup aqui..." autoFocus
                aria-label="Código do backup"
                onChange={(e) => { importRef.current = e.target.value; }}
                style={{ ...S.input, minHeight: 130, fontSize: 11, marginBottom: 12, fontFamily: "monospace" }} />
            )}
            <div style={{ display: "flex", gap: 10 }}>
              {modal.onSim ? (
                <React.Fragment>
                  <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => setModal(null)}>Cancelar</button>
                  <button style={{ ...S.btn, flex: 1, background: modal.positivo ? GRAD : "#ED4956", color: "#FFFFFF" }}
                    onClick={() => { const f = modal.onSim; setModal(null); f(); }}>{modal.labelSim || (modal.positivo ? "Adicionar" : "Confirmar")}</button>
                </React.Fragment>
              ) : (
                <button style={{ ...S.btn, flex: 1 }} onClick={() => setModal(null)}>OK</button>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Escondido: só existe para o botão "Restaurar de arquivo" abrir o seletor */}
      <input ref={arquivoRef} type="file" accept="application/json,.json" onChange={aoEscolherArquivo}
        style={{ display: "none" }} tabIndex={-1} aria-hidden="true" />
      {/* Escondido: serve ao “Trocar a foto do aparelho” do detalhe do exercício */}
      <input ref={fotoExRef} type="file" accept="image/*" capture="environment" onChange={aoEscolherFotoEx}
        style={{ display: "none" }} tabIndex={-1} aria-hidden="true" />

      <Celebracao festa={festa} onFechar={fecharFesta} />
      {comoInstalar && <ComoInstalar onFechar={() => setComoInstalar(false)} onCopiarLink={copiarLink} />}

      {versaoNova && (
        <div role="status" style={{ position: "fixed", left: 12, right: 12, zIndex: 47,
          top: "calc(10px + env(safe-area-inset-top))" }}>
          <div style={{ background: "var(--card)", border: "1px solid #E1306C", borderRadius: 14,
            padding: "12px 14px", boxShadow: "0 6px 20px rgba(0,0,0,0.5)",
            display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13.5, fontWeight: 800, lineHeight: 1.4 }}>Tem versão nova do app</div>
              <div style={{ fontSize: 11.5, color: "var(--cinza)", marginTop: 2 }}>
                Esta é a {VERSAO_APP}. Disponível: {versaoNova}.
              </div>
            </div>
            <button onClick={atualizarApp}
              style={{ background: GRAD, color: "#FFFFFF", border: "none", borderRadius: 10,
                padding: "10px 14px", fontWeight: 900, fontSize: 13, cursor: "pointer", whiteSpace: "nowrap" }}>
              Atualizar
            </button>
          </div>
        </div>
      )}

      {/* Fica por cima de tudo e não tem botão de fechar, de propósito: quem
          está treinando sem saber que nada está sendo salvo precisa tropeçar
          nisso. O único caminho daqui é baixar o backup. */}
      {semGravar && (
        <div role="alert" style={{ position: "fixed", left: 0, right: 0, top: 0, zIndex: 70,
          background: "#7A0F1B", borderBottom: "2px solid #ED4956", color: "#FFFFFF",
          padding: "calc(10px + env(safe-area-inset-top)) 14px 12px", boxShadow: "0 6px 20px rgba(0,0,0,0.5)" }}>
          <div style={{ fontSize: 14.5, fontWeight: 900, marginBottom: 5 }}>
            ⚠ Seus treinos não estão sendo salvos
          </div>
          <div style={{ fontSize: 12.5, lineHeight: 1.55, marginBottom: 10, opacity: 0.92 }}>
            Este navegador recusou gravar os dados. Costuma ser janela anônima, armazenamento
            cheio ou o navegador de dentro de outro app. Baixe o backup agora — ao fechar esta
            aba, o que você fez aqui se perde.
          </div>
          <button onClick={baixarBackup}
            style={{ width: "100%", border: "none", borderRadius: 12, padding: "12px 10px",
              background: "#FFFFFF", color: "#7A0F1B", fontWeight: 900, fontSize: 14.5, cursor: "pointer" }}>
            ⬇ Baixar backup agora
          </button>
        </div>
      )}

      <PainelJarvis disponivel={VOZ_OUVE} ligado={vozAtiva} estado={vozEstado}
        parcial={vozParcial} ultima={vozUltima} descansando={descansando}
        naSessao={aba === "sessao"} escondido={aba === "escolaVoz"} noToque={noToque}
        pos={botaoVoz} onMover={setBotaoVoz}
        onAlternar={() => (vozAtiva ? desligarVoz() : ligarVoz())}
        onAjuda={() => setAjudaVoz(true)} />

      {avisoToque && (
        <div role="status" style={{ position: "fixed", left: 12, right: 12, zIndex: 46,
          bottom: "calc(150px + env(safe-area-inset-bottom))" }}>
          <div style={{ background: "var(--card)", border: "1px solid var(--obs)", borderRadius: 14,
            padding: "14px 16px", boxShadow: "0 6px 20px rgba(0,0,0,0.5)" }}>
            <div style={{ fontSize: 14, fontWeight: 800, color: "var(--obs)", marginBottom: 6 }}>
              🔇 Os bipes eram deste aparelho
            </div>
            <div style={{ fontSize: 12.5, color: "var(--cinza)", lineHeight: 1.6, marginBottom: 12 }}>
              Ele estava reiniciando o microfone a cada pausa — é o que apita e o que
              corta as frases longas no meio. Mudei para <b>toque para falar</b>:
              toque no microfone, fale o comando, e ele responde. Um toque por frase.
            </div>
            <button style={S.btnGhost} onClick={() => setAvisoToque(false)}>Entendi</button>
          </div>
        </div>
      )}
      <ModalAjudaJarvis aberto={ajudaVoz} onFechar={() => setAjudaVoz(false)}
        onEscola={() => { setAjudaVoz(false); setAba("escolaVoz"); }}
        onDiagnostico={() => { setAjudaVoz(false); setDiagVoz(true); }}
        falaLigada={voz.falar} onAlternarFala={() => setVoz((v) => ({ ...v, falar: !v.falar }))} />
      <ModalDiagnosticoJarvis aberto={diagVoz} ligado={vozAtiva} estado={vozEstado} voz={voz} noToque={noToque}
        onFechar={() => setDiagVoz(false)} />

      {desfazer && (
        <div role="status" style={{ position: "fixed", left: 12, right: 12, zIndex: 16,
          bottom: "calc(" + (sessao && aba !== "sessao" ? 132 : 72) + "px + env(safe-area-inset-bottom))" }}>
          <div style={{ background: "var(--card)", border: "1px solid var(--borda2)", borderRadius: 12, padding: "12px 14px",
            display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, boxShadow: "0 4px 16px rgba(0,0,0,0.45)" }}>
            <span style={{ fontSize: 13 }}>Treino excluído do histórico.</span>
            <button onClick={restaurarExcluido}
              style={{ background: "none", border: "none", color: "#E1306C", fontWeight: 900, fontSize: 13, cursor: "pointer", whiteSpace: "nowrap", padding: "4px 2px" }}>
              Desfazer
            </button>
          </div>
        </div>
      )}

      {sessao && aba !== "sessao" && (
        <div style={{ position: "fixed", bottom: "calc(72px + env(safe-area-inset-bottom))", left: 12, right: 12, zIndex: 15 }}>
          <button onClick={() => setAba("sessao")}
            style={{ ...S.btn, boxShadow: "0 4px 16px rgba(0,0,0,0.5)", border: "2px solid var(--bg)" }}>
            ▶ Continuar treino — {sessao.nome}
          </button>
        </div>
      )}

      <nav aria-label="Navegação principal"
        style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "var(--bg2)", borderTop: "1px solid var(--borda)", display: "flex", padding: "8px 0", paddingBottom: "calc(14px + env(safe-area-inset-bottom))", zIndex: 10 }}>
        {abas.map((a) => (
          <button key={a.id} onClick={() => { setAba(a.id); setGrupoAberto(null); setExercicioAberto(null); setProgAberto(null); if (a.id === "historico") setSecaoHistorico("treinos"); }}
            aria-current={aba === a.id ? "page" : undefined} aria-label={a.nome}
            style={{ flex: 1, background: "none", border: "none", cursor: "pointer", color: aba === a.id ? "#E1306C" : "var(--cinza)", fontWeight: aba === a.id ? 900 : 600 }}>
            <div aria-hidden="true" style={{ fontSize: 18 }}>{a.icone}</div>
            <div aria-hidden="true" style={{ fontSize: 11, marginTop: 2 }}>{a.nome}</div>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TreinoLivre />);

// Modo offline: depois da primeira visita, o app abre mesmo sem internet.
// (localhost entra na lista para dar pra testar o modo offline antes de publicar)
const ehLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
if ("serviceWorker" in navigator && (location.protocol === "https:" || ehLocal)) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
<!-- Contador de visitas (GoatCounter): só o dono do painel vê os números. Sem cookies, compatível com LGPD. -->
<script data-goatcounter="https://treinolivre.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>

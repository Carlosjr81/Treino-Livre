// ---------- GAMIFICAÇÃO ----------
function diaStr(x) { const dd = new Date(x); return dd.getFullYear() + "-" + (dd.getMonth() + 1) + "-" + dd.getDate(); }
function calcularEstatisticas(historico) {
  const dias = {};
  let volumeTotal = 0;
  historico.forEach((h) => {
    dias[diaStr(h.data)] = true;
    (h.itens || []).forEach((it) => (it.series || []).forEach((s) => {
      volumeTotal += (parseFloat(s.peso) || 0) * (parseInt(s.reps) || 0);
    }));
  });
  const um = 86400000;
  let streak = 0;
  let cursor = new Date();
  if (!dias[diaStr(cursor)]) cursor = new Date(cursor.getTime() - um);
  while (dias[diaStr(cursor)]) { streak++; cursor = new Date(cursor.getTime() - um); }
  const agora = Date.now();
  let treinosSemana = 0, volumeSemana = 0;
  historico.forEach((h) => {
    if (agora - new Date(h.data).getTime() <= 7 * um) {
      treinosSemana++;
      (h.itens || []).forEach((it) => (it.series || []).forEach((s) => {
        volumeSemana += (parseFloat(s.peso) || 0) * (parseInt(s.reps) || 0);
      }));
    }
  });
  return { total: historico.length, streak, volumeTotal: Math.round(volumeTotal), treinosSemana, volumeSemana: Math.round(volumeSemana) };
}

// ---------- IMAGEM PARA STORY (gerada no aparelho) ----------
function gerarImagemStory(linhas) {
  const cv = document.createElement("canvas");
  cv.width = 1080; cv.height = 1920;
  const c = cv.getContext("2d");
  c.fillStyle = "#010101"; c.fillRect(0, 0, 1080, 1920);
  const faixa = (y) => {
    c.fillStyle = "#E1306C";
    for (let x = 40; x < 1000; x += 52) {
      c.beginPath(); c.moveTo(x, y + 22); c.lineTo(x + 22, y + 22); c.lineTo(x + 44, y); c.lineTo(x + 22, y); c.closePath(); c.fill();
    }
  };
  c.textAlign = "center";
  c.fillStyle = "#F2F0EC"; c.font = "900 62px sans-serif"; c.fillText("TREINO LIVRE", 540, 130);
  faixa(165);
  let y = 380;
  linhas.forEach((l) => {
    c.fillStyle = l.cor || "var(--texto)";
    c.font = "bold " + (l.tam || 56) + "px sans-serif";
    c.fillText(l.t, 540, y);
    y += (l.tam || 56) + (l.esp || 44);
  });
  faixa(1680);
  c.fillStyle = "#E1306C"; c.font = "bold 42px sans-serif"; c.fillText("carlosjr81.github.io/Treino-Livre", 540, 1780);
  c.fillStyle = "#A8A8A9"; c.font = "30px sans-serif"; c.fillText("App gratuito · por Carlos Jr · @carlos.jr.81", 540, 1840);
  return new Promise((res) => cv.toBlob(res, "image/png"));
}
async function compartilharImagem(blob, texto, avisarFn) {
  try {
    const file = new File([blob], "treino-livre.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: texto });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "treino-livre.png";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);

}

// ---------------- SOM (Web Audio) ----------------
let audioCtx = null;
function beep(freq, dur, vol) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.value = vol || 0.25;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

  { id: "puxada-supinada", grupo: "costas", nome: "Puxada alta com pegada supinada", en: "reverse grip lat pulldown", equip: "Polia alta", musc: { p: ["dorsal"], s: ["biceps"] }, passos: ["Segure a barra com as palmas viradas para você, na largura dos ombros.", "Puxe a barra até a parte superior do peito.", "Suba controlado alongando o dorsal."], dica: "A pegada supinada envolve mais o bíceps e a parte baixa do dorsal." },
  { id: "puxada-amplitude", grupo: "costas", nome: "Puxada alta com amplitude total", en: "lat pulldown", equip: "Polia alta", musc: { p: ["dorsal"], s: ["biceps", "trapezio"] }, passos: ["Segure a barra e deixe o corpo alongar totalmente no topo.", "Puxe até o peito levando os cotovelos para baixo.", "Suba devagar até o alongamento completo, deixando as escápulas subirem."], dica: "O alongamento total no topo é o diferencial: não encurte o movimento." },
  { id: "remada-deltoide", grupo: "costas", nome: "Remada com barra para deltoide posterior", en: "rear delt row", equip: "Barra", musc: { p: ["ombros"], s: ["dorsal", "trapezio", "biceps"] }, passos: ["Incline o tronco com a barra pendurada e pegada bem aberta.", "Puxe a barra em direção ao peito com os cotovelos abertos.", "Desça controlado."], dica: "Cotovelos altos e abertos jogam o trabalho para o deltoide posterior." },
  { id: "remada-invertida", grupo: "costas", nome: "Remada curvada com pegada invertida", en: "reverse grip bent over row", equip: "Barra", musc: { p: ["dorsal"], s: ["biceps", "trapezio", "lombar"] }, passos: ["Incline o tronco com a coluna neutra e pegada supinada.", "Puxe a barra em direção ao abdômen.", "Desça controlado até estender."], dica: "A pegada invertida enfatiza a parte baixa do dorsal e o bíceps." },

  { id: "agachamento", grupo: "pernas", nome: "Agachamento livre", en: "squat", equip: "Barra", musc: { p: ["quadriceps", "gluteos"], s: ["posteriores", "lombar", "abdomen"] }, passos: ["Apoie a barra no trapézio e pés na largura dos ombros.", "Desça empurrando o quadril para trás até as coxas ficarem paralelas ao chão.", "Suba empurrando o chão com o pé inteiro."], dica: "Joelhos apontam na direção dos pés durante todo o movimento." },
  { id: "agachamento-smith", grupo: "pernas", nome: "Agachamento no Smith", en: "smith machine squat", equip: "Aparelho Smith", musc: { p: ["quadriceps", "gluteos"], s: ["posteriores"] }, passos: ["Posicione a barra do Smith no trapézio e destrave.", "Desça controlado até as coxas ficarem paralelas ao chão.", "Suba empurrando o chão, sem travar os joelhos."], dica: "Pés levemente à frente da barra deixam o movimento mais confortável." },
  { id: "agachamento-hack", grupo: "pernas", nome: "Agachamento no hack", en: "hack squat", equip: "Máquina hack", musc: { p: ["quadriceps"], s: ["gluteos"] }, passos: ["Posicione os ombros nos apoios e pés na plataforma.", "Desça até ~90° de joelho ou um pouco abaixo.", "Suba sem travar os joelhos."], dica: "Pés mais à frente na plataforma aliviam os joelhos." },
  { id: "agachamento-goblet", grupo: "pernas", nome: "Agachamento goblet", en: "goblet squat", equip: "Halter ou kettlebell", musc: { p: ["quadriceps", "gluteos"], s: ["abdomen"] }, passos: ["Segure o peso junto ao peito com as duas mãos.", "Agache mantendo o tronco ereto e cotovelos entre os joelhos.", "Suba empurrando o chão."], dica: "Excelente para aprender a técnica do agachamento." },
  { id: "agachamento-bulgaro", grupo: "pernas", nome: "Agachamento búlgaro", en: "bulgarian split squat", equip: "Halteres e banco", musc: { p: ["quadriceps", "gluteos"], s: ["posteriores"] }, passos: ["Apoie o peito do pé de trás no banco.", "Desça flexionando a perna da frente até ~90°.", "Suba empurrando com o pé da frente inteiro."], dica: "Passo mais longo foca glúteo; mais curto foca quadríceps." },
  { id: "leg-press", grupo: "pernas", nome: "Leg press 45°", en: "leg press", equip: "Máquina", musc: { p: ["quadriceps"], s: ["gluteos", "posteriores"] }, passos: ["Posicione os pés na plataforma na largura dos ombros.", "Desça controlado até ~90° de joelho.", "Empurre a plataforma sem travar os joelhos no final."], dica: "Não tire a lombar do encosto ao descer." },
  { id: "cadeira-extensora", grupo: "pernas", nome: "Cadeira extensora", en: "leg extension", equip: "Máquina", musc: { p: ["quadriceps"], s: [] }, passos: ["Ajuste o rolo na frente dos tornozelos.", "Estenda os joelhos até quase completar.", "Desça controlando a volta."], dica: "Segure 1 segundo no topo para maior ativação do quadríceps." },
  { id: "mesa-flexora", grupo: "pernas", nome: "Mesa/cadeira flexora", en: "leg curl", equip: "Máquina", musc: { p: ["posteriores"], s: ["panturrilha"] }, passos: ["Posicione o rolo atrás dos tornozelos.", "Flexione os joelhos trazendo o rolo em direção aos glúteos.", "Retorne devagar sem soltar o peso."], dica: "Mantenha o quadril firme no banco durante todo o movimento." },
  { id: "stiff", grupo: "pernas", nome: "Stiff", en: "stiff leg deadlift", equip: "Barra ou halteres", musc: { p: ["posteriores", "gluteos"], s: ["lombar"] }, passos: ["Em pé, segure o peso à frente das coxas.", "Desça empurrando o quadril para trás com joelhos quase estendidos.", "Suba contraindo posteriores e glúteos."], dica: "Desça só até onde a coluna se mantém neutra." },
  { id: "afundo", grupo: "pernas", nome: "Afundo com halteres", en: "lunge", equip: "Halteres", musc: { p: ["quadriceps", "gluteos"], s: ["posteriores"] }, passos: ["Dê um passo à frente segurando um halter em cada mão.", "Desça até o joelho de trás quase tocar o chão.", "Empurre com a perna da frente para voltar."], dica: "Tronco ereto; o joelho da frente não precisa passar muito do pé." },
  { id: "cadeira-adutora", grupo: "pernas", nome: "Cadeira adutora", en: "hip adduction", equip: "Máquina", musc: { p: ["adutores"], s: [] }, passos: ["Sente com as pernas abertas nos suportes.", "Feche as pernas contra a resistência.", "Abra devagar controlando o retorno."], dica: "Trabalha a parte interna da coxa; evite cargas exageradas no início." },
  { id: "panturrilha", grupo: "pernas", nome: "Panturrilha em pé", en: "standing calf raise", equip: "Máquina ou degrau", musc: { p: ["panturrilha"], s: [] }, passos: ["Apoie a ponta dos pés na plataforma.", "Suba o máximo que conseguir na ponta dos pés.", "Desça alongando bem abaixo da linha do degrau."], dica: "Faça pausa de 1s em cima e embaixo; evite quicar." },
  { id: "panturrilha-sentado", grupo: "pernas", nome: "Panturrilha sentado", en: "seated calf raise", equip: "Máquina", musc: { p: ["panturrilha"], s: [] }, passos: ["Sente com o apoio sobre as coxas e pontas dos pés na plataforma.", "Eleve os calcanhares o máximo possível.", "Desça alongando devagar."], dica: "Com o joelho dobrado o foco vai para o sóleo." },
  { id: "panturrilha-leg-press", grupo: "pernas", nome: "Panturrilha no leg press", en: "calf press leg press", equip: "Leg press", musc: { p: ["panturrilha"], s: [] }, passos: ["No leg press, apoie só as pontas dos pés na base da plataforma.", "Empurre com as pontas dos pés estendendo os tornozelos.", "Volte alongando a panturrilha sem soltar o peso."], dica: "Joelhos quase estendidos e movimento só de tornozelo." },

  { id: "desenvolvimento", grupo: "ombros", nome: "Desenvolvimento com halteres", en: "dumbbell shoulder press", equip: "Halteres", musc: { p: ["ombros"], s: ["triceps", "trapezio"] }, passos: ["Sente com os halteres na altura das orelhas, palmas à frente.", "Empurre para cima até quase estender os cotovelos.", "Desça controlado até a altura inicial."], dica: "Não arqueie a lombar; mantenha o core firme." },
  { id: "desenvolvimento-arnold", grupo: "ombros", nome: "Desenvolvimento Arnold", en: "arnold press", equip: "Halteres", musc: { p: ["ombros"], s: ["triceps"] }, passos: ["Comece com os halteres à frente do rosto, palmas viradas para você.", "Empurre para cima girando as palmas para frente durante a subida.", "Desça desfazendo o giro."], dica: "O giro trabalha as três porções do deltoide no mesmo movimento." },
  { id: "desenvolvimento-militar", grupo: "ombros", nome: "Desenvolvimento militar", en: "overhead press", equip: "Barra", musc: { p: ["ombros"], s: ["triceps", "abdomen"] }, passos: ["Em pé, segure a barra na altura das clavículas.", "Empurre para cima passando a cabeça levemente à frente no topo.", "Desça controlado até a posição inicial."], dica: "Glúteos e abdômen contraídos evitam compensar com a lombar." },
  { id: "desenvolvimento-maquina", grupo: "ombros", nome: "Desenvolvimento na máquina", en: "machine shoulder press", equip: "Máquina", musc: { p: ["ombros"], s: ["triceps"] }, passos: ["Ajuste o banco para as manoplas ficarem na altura dos ombros.", "Empurre para cima sem travar os cotovelos.", "Retorne devagar."], dica: "Trajetória guiada: boa para focar carga com segurança." },
  { id: "elevacao-lateral", grupo: "ombros", nome: "Elevação lateral", en: "lateral raise", equip: "Halteres", musc: { p: ["ombros"], s: ["trapezio"] }, passos: ["Em pé, halteres ao lado do corpo, cotovelos levemente flexionados.", "Eleve os braços até a linha dos ombros.", "Desça devagar resistindo ao peso."], dica: "Suba como se derramasse uma jarra: mindinho levemente para cima." },
  { id: "elevacao-frontal", grupo: "ombros", nome: "Elevação frontal", en: "front raise", equip: "Halteres ou anilha", musc: { p: ["ombros"], s: ["peito"] }, passos: ["Segure o peso à frente das coxas.", "Eleve à frente até a altura dos ombros.", "Retorne controlando."], dica: "Evite balançar o corpo; menos carga e mais controle." },
  { id: "crucifixo-inverso", grupo: "ombros", nome: "Crucifixo inverso", en: "reverse fly", equip: "Halteres ou máquina", musc: { p: ["ombros"], s: ["trapezio", "dorsal"] }, passos: ["Incline o tronco à frente com halteres pendurados.", "Abra os braços para os lados apertando as escápulas.", "Volte devagar."], dica: "Foca o deltóide posterior; use carga leve e amplitude completa." },
  { id: "crucifixo-polia", grupo: "ombros", nome: "Crucifixo invertido na polia (amplitude total)", en: "cable reverse fly", equip: "Polia dupla", musc: { p: ["ombros"], s: ["trapezio", "dorsal"] }, passos: ["Em pé, cruze os cabos segurando a manopla oposta em cada mão.", "Abra os braços para trás na linha dos ombros.", "Volte controlado cruzando os cabos à frente."], dica: "A polia mantém tensão na amplitude toda; capriche na abertura final." },
  { id: "remada-alta", grupo: "ombros", nome: "Remada alta (erguida)", en: "upright row", equip: "Barra, halteres ou cabo", musc: { p: ["ombros", "trapezio"], s: ["biceps"] }, passos: ["Segure o peso à frente das coxas com pegada na largura dos ombros.", "Puxe em direção ao queixo levando os cotovelos para cima.", "Desça controlado."], dica: "Suba só até a linha do peito se sentir desconforto no ombro." },
  { id: "face-pull", grupo: "ombros", nome: "Face pull", en: "face pull", equip: "Polia com corda", musc: { p: ["ombros"], s: ["trapezio"] }, passos: ["Ajuste a polia na altura do rosto e segure a corda.", "Puxe em direção ao rosto abrindo os cotovelos para os lados.", "Retorne devagar."], dica: "Excelente para deltóide posterior e saúde dos ombros." },
  { id: "encolhimento", grupo: "ombros", nome: "Encolhimento de ombros", en: "shrug", equip: "Halteres ou barra", musc: { p: ["trapezio"], s: ["antebraco"] }, passos: ["Segure o peso ao lado do corpo, braços estendidos.", "Eleve os ombros em direção às orelhas.", "Desça alongando o trapézio."], dica: "Não gire os ombros; o movimento é só para cima e para baixo." },

  { id: "rosca-direta", grupo: "biceps", nome: "Rosca direta (barra W)", en: "barbell curl", equip: "Barra ou barra W", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Em pé, segure a barra com pegada supinada na largura dos ombros.", "Flexione os cotovelos levando a barra até os ombros.", "Desça controlado até estender."], dica: "Cotovelos colados ao tronco; não balance o corpo." },
  { id: "rosca-alternada", grupo: "biceps", nome: "Rosca alternada", en: "dumbbell curl", equip: "Halteres", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Segure um halter em cada mão ao lado do corpo.", "Suba um braço girando a palma para cima durante a subida.", "Desça e repita com o outro braço."], dica: "No banco inclinado o bíceps trabalha ainda mais alongado." },
  { id: "rosca-martelo", grupo: "biceps", nome: "Rosca martelo", en: "hammer curl", equip: "Halteres", musc: { p: ["biceps", "antebraco"], s: [] }, passos: ["Segure os halteres com as palmas viradas uma para a outra.", "Flexione os cotovelos mantendo a pegada neutra.", "Desça devagar."], dica: "Trabalha também o antebraço e o braquial." },
  { id: "rosca-scott", grupo: "biceps", nome: "Rosca no banco Scott", en: "preacher curl", equip: "Banco Scott e barra W", musc: { p: ["biceps"], s: [] }, passos: ["Apoie os braços no banco com as axilas encaixadas no topo.", "Flexione até a contração máxima.", "Desça controlado sem estender totalmente."], dica: "Não solte o peso na descida; é onde mora o estímulo." },
  { id: "rosca-concentrada", grupo: "biceps", nome: "Rosca concentrada", en: "concentration curl", equip: "Halter e banco", musc: { p: ["biceps"], s: [] }, passos: ["Sentado, apoie o cotovelo na parte interna da coxa.", "Flexione o braço até a contração máxima.", "Desça devagar até quase estender."], dica: "Isolamento total: zero impulso do corpo." },
  { id: "rosca-polia", grupo: "biceps", nome: "Rosca na polia baixa", en: "cable curl", equip: "Polia baixa", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Segure a barra da polia com pegada supinada.", "Flexione os cotovelos até a contração.", "Desça resistindo à tração do cabo."], dica: "A polia mantém tensão constante em toda a amplitude." },
  { id: "rosca-inversa", grupo: "biceps", nome: "Rosca inversa", en: "reverse curl", equip: "Barra ou barra W", musc: { p: ["antebraco"], s: ["biceps"] }, passos: ["Segure a barra com as palmas viradas para baixo.", "Flexione os cotovelos até a altura do peito.", "Desça controlado."], dica: "Foca antebraços e braquial; use menos carga que na rosca direta." },
  { id: "rosca-spider", grupo: "biceps", nome: "Rosca inclinada deitada (spider)", en: "spider curl", equip: "Banco inclinado e barra", musc: { p: ["biceps"], s: [] }, passos: ["Deite de bruços no banco inclinado com os braços pendurados.", "Flexione os cotovelos até a contração máxima.", "Desça devagar até quase estender."], dica: "O tronco apoiado elimina qualquer impulso: isolamento puro." },
  { id: "rosca-polia-alta", grupo: "biceps", nome: "Rosca na polia alta (sobre a cabeça)", en: "overhead cable curl", equip: "Polia dupla alta", musc: { p: ["biceps"], s: [] }, passos: ["Segure as manoplas com os braços abertos na altura dos ombros.", "Flexione os cotovelos trazendo as mãos em direção à cabeça.", "Estenda controlado sem baixar os cotovelos."], dica: "Ótimo para o pico do bíceps; mantenha os cotovelos altos e fixos." },

  { id: "triceps-polia", grupo: "triceps", nome: "Tríceps na polia (puxada alta)", en: "triceps pushdown", equip: "Polia alta com barra", musc: { p: ["triceps"], s: [] }, passos: ["Segure a barra com os cotovelos colados ao tronco.", "Estenda os braços empurrando a barra para baixo.", "Volte até ~90° sem mover os cotovelos."], dica: "Os cotovelos são a dobradiça: só o antebraço se move." },
  { id: "triceps-corda", grupo: "triceps", nome: "Tríceps corda", en: "rope pushdown", equip: "Polia com corda", musc: { p: ["triceps"], s: [] }, passos: ["Segure a corda com pegada neutra.", "Estenda os braços abrindo a corda no final.", "Retorne controlado."], dica: "A abertura no final aumenta a contração da cabeça lateral." },
  { id: "triceps-testa", grupo: "triceps", nome: "Tríceps testa", en: "lying triceps extension", equip: "Barra W e banco", musc: { p: ["triceps"], s: [] }, passos: ["Deitado, segure a barra acima do peito.", "Flexione os cotovelos descendo a barra em direção à testa.", "Estenda de volta ao topo."], dica: "Cotovelos apontando para o teto o tempo inteiro." },
  { id: "triceps-frances", grupo: "triceps", nome: "Tríceps francês (sentado)", en: "overhead triceps extension", equip: "Halter", musc: { p: ["triceps"], s: [] }, passos: ["Segure um halter com as duas mãos acima da cabeça.", "Desça o peso atrás da cabeça flexionando os cotovelos.", "Estenda de volta ao topo."], dica: "Cotovelos apontando para frente, próximos da cabeça." },
  { id: "triceps-coice", grupo: "triceps", nome: "Tríceps coice (kickback)", en: "triceps kickback", equip: "Halter", musc: { p: ["triceps"], s: [] }, passos: ["Incline o tronco com o cotovelo elevado e colado ao corpo.", "Estenda o antebraço para trás até a extensão total.", "Retorne sem baixar o cotovelo."], dica: "Contração máxima acontece no final; segure 1 segundo." },
  { id: "supino-fechado", grupo: "triceps", nome: "Supino com pegada fechada", en: "close grip bench press", equip: "Barra e banco", musc: { p: ["triceps"], s: ["peito", "ombros"] }, passos: ["Deite no banco com pegada um pouco mais estreita que os ombros.", "Desça a barra até a parte baixa do peito com cotovelos junto ao corpo.", "Empurre de volta focando o tríceps."], dica: "Composto pesado para tríceps; não feche demais a pegada." },
  { id: "mergulho-banco", grupo: "triceps", nome: "Mergulho no banco", en: "bench dips", equip: "Banco", musc: { p: ["triceps"], s: ["peito", "ombros"] }, passos: ["Apoie as mãos na borda do banco atrás do corpo.", "Desça flexionando os cotovelos até ~90°.", "Empurre de volta até estender."], dica: "Quanto mais longe os pés, mais difícil fica." },
  { id: "triceps-invertido", grupo: "triceps", nome: "Tríceps na polia com pegada invertida", en: "reverse grip pushdown", equip: "Polia alta", musc: { p: ["triceps"], s: ["antebraco"] }, passos: ["Segure a barra com as palmas viradas para cima.", "Estenda os braços empurrando para baixo.", "Volte controlado sem mover os cotovelos."], dica: "A pegada invertida enfatiza a cabeça medial do tríceps." },

  { id: "abdominal-supra", grupo: "abdomen", nome: "Abdominal supra", en: "crunch", equip: "Peso corporal", musc: { p: ["abdomen"], s: [] }, passos: ["Deite com os joelhos flexionados e mãos atrás da cabeça.", "Eleve o tronco tirando as escápulas do chão.", "Desça controlado."], dica: "Não puxe o pescoço; olhe para o teto." },
  { id: "abdominal-infra", grupo: "abdomen", nome: "Abdominal infra na paralela", en: "hanging knee raise", equip: "Paralelas ou barra fixa", musc: { p: ["abdomen"], s: ["obliquos", "antebraco"] }, passos: ["Suspenda o corpo com os antebraços ou mãos apoiados.", "Eleve os joelhos em direção ao peito.", "Desça devagar sem balançar."], dica: "Para dificultar, suba com as pernas estendidas." },
  { id: "abdominal-obliquo", grupo: "abdomen", nome: "Abdominal oblíquo (bicicleta)", en: "bicycle crunch", equip: "Peso corporal", musc: { p: ["obliquos"], s: ["abdomen"] }, passos: ["Deite e leve o cotovelo em direção ao joelho oposto.", "Alterne os lados em movimento de pedalada.", "Mantenha o ritmo controlado."], dica: "Gire o tronco, não apenas o cotovelo." },
  { id: "prancha", grupo: "abdomen", nome: "Prancha isométrica", en: "plank", equip: "Peso corporal", musc: { p: ["abdomen"], s: ["obliquos", "lombar", "ombros"] }, passos: ["Apoie antebraços e pontas dos pés no chão.", "Mantenha o corpo em linha reta contraindo abdômen e glúteos.", "Segure pelo tempo definido."], dica: "Se o quadril cair ou subir, encerre a série: qualidade > tempo." },
  { id: "prancha-lateral", grupo: "abdomen", nome: "Prancha lateral", en: "side plank", equip: "Peso corporal", musc: { p: ["obliquos"], s: ["abdomen", "ombros"] }, passos: ["Apoie um antebraço no chão com o corpo de lado.", "Eleve o quadril até o corpo formar uma linha reta.", "Segure pelo tempo definido e troque o lado."], dica: "Foca os oblíquos; não deixe o quadril ceder." },
  { id: "elevacao-pernas", grupo: "abdomen", nome: "Elevação de pernas", en: "leg raise", equip: "Peso corporal", musc: { p: ["abdomen"], s: ["quadriceps"] }, passos: ["Deite com as mãos ao lado do corpo.", "Eleve as pernas estendidas até 90°.", "Desça devagar sem tocar o chão."], dica: "Pressione a lombar contra o chão o tempo todo." },
  { id: "abdominal-polia", grupo: "abdomen", nome: "Abdominal na polia", en: "cable crunch", equip: "Polia alta com corda", musc: { p: ["abdomen"], s: ["obliquos"] }, passos: ["Ajoelhe de frente para a polia segurando a corda junto à cabeça.", "Flexione o tronco levando os cotovelos em direção aos joelhos.", "Suba controlando a volta."], dica: "O movimento vem do abdômen enrolando, não do quadril." },

// ---------------- IMAGENS DO WGER (banco aberto, licença CC BY-SA 4.0) ----------------
const cacheImg = {};
async function buscarImagemWger(termo) {
  const r = await fetch("https://wger.de/api/v2/exercise/search/?language=english&format=json&term=" + encodeURIComponent(termo));
  const j = await r.json();
  const sugestoes = j.suggestions || [];
  const hit = sugestoes.find((s) => s.data && s.data.image) || sugestoes[0];
  if (!hit || !hit.data) return null;
  let url = hit.data.image ? "https://wger.de" + hit.data.image : null;
  if (hit.data.base_id) {
    try {
      const r2 = await fetch("https://wger.de/api/v2/exerciseimage/?format=json&exercise_base=" + hit.data.base_id);
      const j2 = await r2.json();
      const main = (j2.results || []).find((i) => i.is_main) || (j2.results || [])[0];
      if (main && main.image) url = main.image;
    } catch (e) {}
  }
  return url;
}

function ImagemExercicio({ ex }) {
  const [url, setUrl] = useState(cacheImg[ex.id] !== undefined ? cacheImg[ex.id] : null);
  const [status, setStatus] = useState(cacheImg[ex.id] !== undefined ? (cacheImg[ex.id] ? "ok" : "erro") : "carregando");

  useEffect(() => {
    let vivo = true;
    if (cacheImg[ex.id] !== undefined) {
      setUrl(cacheImg[ex.id]);
      setStatus(cacheImg[ex.id] ? "ok" : "erro");
      return;
    }
    (async () => {
      try {
        const u = await buscarImagemWger(ex.en || ex.nome);
        cacheImg[ex.id] = u;
        if (vivo) { setUrl(u); setStatus(u ? "ok" : "erro"); }
      } catch (e) {
        cacheImg[ex.id] = null;
        if (vivo) setStatus("erro");
      }
    })();
    return () => { vivo = false; };
  }, [ex.id]);

  if (status === "carregando") {
    return <div style={{ fontSize: 13, color: "var(--cinza)", padding: "8px 0" }}>Carregando imagem de demonstração...</div>;
  }
  if (status === "erro" || !url) {
    return (
      <div style={{ fontSize: 13, color: "var(--cinza)", padding: "8px 0" }}>
        Sem imagem disponível para este exercício — use o botão de vídeo abaixo.
      </div>
    );
  }
  return (
    <div style={{ margin: "4px 0 6px" }}>
      <div style={{ background: "#FFFFFF", borderRadius: 12, padding: 8, textAlign: "center" }}>
        <img src={url} alt={"Demonstração: " + ex.nome} style={{ maxWidth: "100%", maxHeight: 240, borderRadius: 8 }}
          onError={() => { cacheImg[ex.id] = null; setStatus("erro"); }} />
      </div>
      <div style={{ fontSize: 11, color: "var(--cinza)", marginTop: 6, lineHeight: 1.5 }}>
        Imagem: comunidade <a href="https://wger.de" target="_blank" rel="noreferrer">wger.de</a> · Licença{" "}
        <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.pt-br" target="_blank" rel="noreferrer">CC BY-SA 4.0</a>
      </div>
    </div>
  );
}

// ---------------- GRÁFICO DE EVOLUÇÃO ----------------
function GraficoEvolucao({ historico, exPorId }) {
  const idsComDados = [];
  const vistos = {};
  historico.forEach((h) => h.itens.forEach((it) => {
    const temPeso = it.series.some((s) => parseFloat(s.peso) > 0);
    if (temPeso && !vistos[it.exercicioId] && exPorId(it.exercicioId)) {
      vistos[it.exercicioId] = true;
      idsComDados.push(it.exercicioId);
    }
  }));

  const [exSel, setExSel] = useState(idsComDados[0] || "");
  const [metrica, setMetrica] = useState("max");

  useEffect(() => {
    if ((!exSel || !vistos[exSel]) && idsComDados.length) setExSel(idsComDados[0]);
  }, [historico.length]);

  if (idsComDados.length === 0) {
    return (
      <div style={S.card}>
        <div style={S.label}>Evolução</div>
        <div style={{ color: "var(--cinza)", fontSize: 14, marginTop: 8 }}>
          Conclua treinos registrando os pesos para ver seu gráfico de evolução aqui.
        </div>
      </div>
    );
  }

  const ordenado = [...historico].sort((a, b) => new Date(a.data) - new Date(b.data));
  const pontos = [];
  ordenado.forEach((h) => {
    const it = h.itens.find((x) => x.exercicioId === exSel);
    if (!it) return;
    let valor = 0;
    if (metrica === "max") {
      it.series.forEach((sr) => { const pz = parseFloat(sr.peso) || 0; if (pz > valor) valor = pz; });
    } else {
      it.series.forEach((sr) => { valor += (parseFloat(sr.peso) || 0) * (parseInt(sr.reps) || 0); });
    }
    if (valor > 0) pontos.push({ data: new Date(h.data), valor });
  });

  const W = 320, H = 150, x0 = 34, x1 = 310, y0 = 118, y1 = 16;
  let svg = null;
  if (pontos.length >= 2) {
    const vmin = Math.min(...pontos.map((pt) => pt.valor));
    const vmax = Math.max(...pontos.map((pt) => pt.valor));
    const range = vmax - vmin || 1;
    const px = (i) => x0 + (i / (pontos.length - 1)) * (x1 - x0);
    const py = (v) => y0 - ((v - vmin) / range) * (y0 - y1);
    const linha = pontos.map((pt, i) => px(i).toFixed(1) + "," + py(pt.valor).toFixed(1)).join(" ");
    const fmtData = (d) => d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
    svg = (
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }}>
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={x0} x2={x1} y1={y0 - f * (y0 - y1)} y2={y0 - f * (y0 - y1)} stroke="var(--borda)" strokeWidth="1" />
        ))}
        <text x={x0 - 4} y={y1 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{vmax}</text>
        <text x={x0 - 4} y={y0 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{vmin}</text>
        <polyline points={linha} fill="none" stroke="#E1306C" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        {pontos.map((pt, i) => (
          <circle key={i} cx={px(i)} cy={py(pt.valor)} r="3.5" fill="#ED4956" stroke="var(--bg)" strokeWidth="1" />
        ))}
        <text x={x0} y={H - 4} fill="var(--cinza)" fontSize="10">{fmtData(pontos[0].data)}</text>
        <text x={x1} y={H - 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{fmtData(pontos[pontos.length - 1].data)}</text>
      </svg>
    );
  }

  const primeiro = pontos[0], ultimo = pontos[pontos.length - 1];
  const melhor = pontos.length ? Math.max(...pontos.map((pt) => pt.valor)) : 0;
  const unidade = metrica === "max" ? "kg" : "kg (vol.)";

  return (
    <div style={S.card}>
      <div style={{ ...S.label, marginBottom: 10 }}>Evolução do treino</div>

      <select value={exSel} onChange={(e) => setExSel(e.target.value)}
        style={{ ...S.input, marginBottom: 10, fontWeight: 700 }}>
        {idsComDados.map((id) => {
          const e = exPorId(id);
          return <option key={id} value={id}>{e ? e.nome : id}</option>;
        })}
      </select>

      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        {[["max", "Carga máxima"], ["volume", "Volume total"]].map(([m, nomeM]) => (
          <button key={m} onClick={() => setMetrica(m)}
            style={{
              flex: 1, border: "1px solid", borderColor: metrica === m ? "#E1306C" : "var(--borda2)",
              background: metrica === m ? "#E1306C22" : "transparent",
              color: metrica === m ? "#E1306C" : "var(--cinza)",
              borderRadius: 8, padding: "8px 10px", fontWeight: 800, fontSize: 12, cursor: "pointer",
            }}>
            {nomeM}
          </button>
        ))}
      </div>

      {pontos.length >= 2 ? (
        <React.Fragment>
          {svg}
          <div style={{ display: "flex", gap: 12, marginTop: 10 }}>
            <Resumo num={(primeiro ? primeiro.valor : 0) + unidadeCurta(metrica)} txt="início" />
            <Resumo num={(ultimo ? ultimo.valor : 0) + unidadeCurta(metrica)} txt="último" />
            <Resumo num={melhor + unidadeCurta(metrica)} txt="recorde" />
          </div>
        </React.Fragment>
      ) : (
        <div style={{ color: "var(--cinza)", fontSize: 13 }}>
          Registre pelo menos 2 treinos com este exercício para ver a linha de evolução.
        </div>
      )}
    </div>
  );
}
function unidadeCurta(metrica) { return metrica === "max" ? "kg" : ""; }

                  <div style={{ width: "100%", height: "100%", borderRadius: "50%", background: "var(--bg)", border: "3px solid var(--bg)", boxSizing: "border-box", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30, fontWeight: 900, color: corGrupo(g) }}>

function FormNovoExercicio({ grupoSugerido, onSalvar, onCancelar, avisar }) {
  const [nome, setNome] = useState("");
  const [grupo, setGrupo] = useState(grupoSugerido || "peito");
  const [equip, setEquip] = useState("");
  const [passosTxt, setPassosTxt] = useState("");
  const [dica, setDica] = useState("");
  const [musc, setMusc] = useState({});

  const cicloMusc = (id) => {
    setMusc((m) => {
      const atual = m[id];
      const novo = { ...m };
      if (!atual) novo[id] = "p";
      else if (atual === "p") novo[id] = "s";
      else delete novo[id];
      return novo;
    });
  };

  const salvar = () => {
    if (!nome.trim()) { avisar("Digite o nome do exercício."); return; }
    const passos = passosTxt.split("\n").map((p) => p.trim()).filter(Boolean);
    const p = Object.keys(musc).filter((k) => musc[k] === "p");
    const s = Object.keys(musc).filter((k) => musc[k] === "s");
    onSalvar({
      id: "custom-" + Date.now(),
      custom: true,
      nome: nome.trim(),
      grupo,
      equip: equip.trim(),
      musc: { p, s },
      passos,
      dica: dica.trim(),
    });
  };

  const p = Object.keys(musc).filter((k) => musc[k] === "p");
  const s = Object.keys(musc).filter((k) => musc[k] === "s");

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onCancelar}>← Cancelar</button>
      <div style={S.card}>
        <div style={{ ...S.label, marginBottom: 8 }}>Nome do exercício *</div>
        <input style={S.input} placeholder="Ex.: Remada na barra fixa australiana"
          value={nome} onChange={(e) => setNome(e.target.value)} />

        <div style={{ ...S.label, margin: "16px 0 8px" }}>Grupo muscular</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {GRUPOS.map((g) => (
            <button key={g.id} onClick={() => setGrupo(g.id)}
              style={{
                border: "1px solid", borderColor: grupo === g.id ? corGrupo(g) : "var(--borda2)",
                background: grupo === g.id ? corGrupo(g) + "22" : "transparent",
                color: grupo === g.id ? corGrupo(g) : "var(--cinza)",
                borderRadius: 8, padding: "8px 12px", fontWeight: 800, fontSize: 13, cursor: "pointer",
              }}>
              {g.nome}
            </button>
          ))}
        </div>

        <div style={{ ...S.label, margin: "16px 0 4px" }}>Músculos trabalhados (opcional)</div>
        <div style={{ fontSize: 12, color: "var(--cinza)", marginBottom: 8 }}>
          Toque 1x = direto (vermelho) · 2x = indireto (amarelo) · 3x = remove
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {Object.keys(MUSCULOS).map((id) => {
            const estado = musc[id];
            const cor = estado ? corMuscTxt(estado) : "var(--cinza)";
            return (
              <button key={id} onClick={() => cicloMusc(id)}
                style={{
                  border: "1px solid", borderColor: estado ? cor : "var(--borda2)",
                  background: estado ? cor + "22" : "transparent",
                  color: cor, borderRadius: 8, padding: "7px 10px", fontWeight: 700, fontSize: 12, cursor: "pointer",
                }}>
                {MUSCULOS[id]}
              </button>
            );
          })}
        </div>
        {(p.length > 0 || s.length > 0) && (
          <div style={{ marginTop: 14 }}>
            <MapaMuscular p={p} s={s} />
          </div>
        )}

        <div style={{ ...S.label, margin: "16px 0 8px" }}>Equipamento (opcional)</div>
        <input style={S.input} placeholder="Ex.: Halteres, máquina, elástico..."
          value={equip} onChange={(e) => setEquip(e.target.value)} />

        <div style={{ ...S.label, margin: "16px 0 8px" }}>Como executar (opcional, um passo por linha)</div>
        <textarea style={{ ...S.input, minHeight: 90, resize: "vertical", fontFamily: "inherit" }}
          placeholder={"Posicione-se...\nExecute o movimento...\nRetorne controlado..."}
          value={passosTxt} onChange={(e) => setPassosTxt(e.target.value)} />

        <div style={{ ...S.label, margin: "16px 0 8px" }}>Dica (opcional)</div>
        <input style={S.input} placeholder="Ex.: Mantenha o core firme"
          value={dica} onChange={(e) => setDica(e.target.value)} />

        <button style={{ ...S.btn, marginTop: 18 }} onClick={salvar}>Salvar exercício</button>
      </div>
    </div>
  );
}

function TelaTreinos({ programas, treinos, exPorId, progAberto, setProgAberto, onTreinar, onNovaFicha, onEditar, onExcluirFicha, onCompartilharFicha, onNovoPrograma, onRenomearPrograma, onExcluirPrograma, onCompartilharPrograma, onAssistente, pedirConfirmacao }) {
  // Dentro de um treino: lista de fichas
  if (progAberto) {
    const prog = programas.find((p) => p.id === progAberto);
    if (!prog) { setProgAberto(null); return null; }
    const fichas = treinos.filter((t) => t.programaId === prog.id);
    return (
      <div style={{ padding: "0 18px" }}>
        <button style={S.voltar} onClick={() => setProgAberto(null)}>← Todos os treinos</button>
        <div style={{ fontSize: 24, fontWeight: 900, marginBottom: 12 }}>{prog.nome}</div>
        <button style={{ ...S.btn, marginBottom: 14 }} onClick={() => onNovaFicha(prog.id)}>+ Nova ficha neste treino</button>
        {fichas.length === 0 && (
          <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)" }}>
            Nenhuma ficha aqui ainda. Crie a primeira (ex.: Treino A - Peito).
          </div>
        )}
        {fichas.map((t) => (
          <div key={t.id} style={S.card}>
            <div style={{ fontWeight: 900, fontSize: 18 }}>{t.nome}</div>
            <div style={{ color: "var(--cinza)", fontSize: 13, margin: "4px 0 12px" }}>
              {t.itens.map((it) => { const e = exPorId(it.exercicioId); return e ? e.nome : null; }).filter(Boolean).join(" · ") || "Sem exercícios"}
            </div>
            <button style={{ ...S.btn, marginBottom: 8 }} onClick={() => onTreinar(t)}>▶ Treinar</button>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => onEditar(t)}>Editar</button>
              <button style={{ ...S.btnGhost, flex: 1, color: "#E1306C", borderColor: "#E1306C66" }} onClick={() => onCompartilharFicha(t)}>📤 Enviar</button>
              <button style={{ ...S.btnGhost, flex: 1, color: "var(--perigo)", borderColor: "var(--perigo-borda)" }}
                onClick={() => pedirConfirmacao("Excluir esta ficha?", () => onExcluirFicha(t.id))}>Excluir</button>
            </div>
          </div>
        ))}

  // Lista de treinos (programas)

    <div style={{ padding: "0 18px" }}>
      <button style={{ ...S.btn, marginBottom: 10 }} onClick={onNovoPrograma}>+ Novo treino</button>
      <button style={{ ...S.btnGhost, marginBottom: 14, color: "#E1306C", borderColor: "#E1306C66" }} onClick={onAssistente}>
        🧭 Montar treino pra mim (assistente)
      </button>
      {programas.length === 0 && (
        <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)" }}>
          Crie seu primeiro treino: ele agrupa suas fichas (ex.: "Treino Iniciante" com fichas A, B e C).
        </div>
      )}
      {programas.map((p) => {
        const fichas = treinos.filter((t) => t.programaId === p.id);
        return (
          <div key={p.id} style={S.card}>
            <div style={{ fontWeight: 900, fontSize: 19 }}>📋 {p.nome}</div>
            <div style={{ color: "var(--cinza)", fontSize: 13, margin: "4px 0 12px" }}>
              {fichas.length} ficha(s){fichas.length ? ": " + fichas.map((f) => f.nome).join(" · ") : ""}
            </div>
            <button style={{ ...S.btn, marginBottom: 8 }} onClick={() => setProgAberto(p.id)}>Abrir fichas</button>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => onRenomearPrograma(p)}>Renomear</button>
              <button style={{ ...S.btnGhost, flex: 1, color: "#E1306C", borderColor: "#E1306C66" }} onClick={() => onCompartilharPrograma(p)}>📤 Enviar</button>
              <button style={{ ...S.btnGhost, flex: 1, color: "var(--perigo)", borderColor: "var(--perigo-borda)" }} onClick={() => onExcluirPrograma(p)}>Excluir</button>
            </div>
          </div>

      })}

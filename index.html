// Escola do Jarvis: a pessoa fala de verdade e vê o que ele entendeu, sem
// nada ser gravado. Ler uma lista de comandos não ensina ninguém a falar com
// o app; errar de graça, sim.
function EscolaJarvis({ acoes, ouvindo, vozBarra, todos, onLigarVoz, onDesligarVoz, onFalar, onSair }) {
  const [i, setI] = useState(0);
  const [ouvido, setOuvido] = useState("");
  const [veredito, setVeredito] = useState(null);  // { ok, texto }
  const [digitado, setDigitado] = useState("");
  const [feitas, setFeitas] = useState({});
  const licao = LICOES_JARVIS[i];
  const ultima = i >= LICOES_JARVIS.length - 1;

  const avaliar = (bruto, corpo, comNome) => {
    setOuvido(bruto);
    const c = interpretarVoz(corpo, {});
    if (!c) {
      setVeredito({ ok: false, texto: "Não reconheci nenhum comando nessa frase. Fale um pouco mais devagar." });
      return;
    }
    const ex = c.frase ? acharExercicio(c.frase, todos, []) : null;
    const ctx = { comNome: comNome, barra: parseFloat(vozBarra) || 0, ex: ex };
    if (licao.confere(c, ctx)) {
      const resumo = licao.resumo ? licao.resumo(c, ctx) : (ROTULO_TIPO[c.tipo] || c.tipo);
      setVeredito({ ok: true, texto: "Entendi: " + resumo });
      setFeitas((f) => Object.assign({}, f, { [licao.id]: true }));
      if (onFalar) onFalar("Isso! Entendi: " + resumo);
      return;
    }
    const aviso = licao.errado && licao.errado(c, ctx);
    setVeredito({ ok: false, texto: aviso || ("Entendi como “" + (ROTULO_TIPO[c.tipo] || c.tipo) + "”. Não é o comando desta lição — tente de novo.") });
  };

  // O raiz entrega as frases ouvidas aqui, do mesmo jeito que entrega na sessão
  if (acoes) acoes.current = { receber: avaliar };
  useEffect(() => () => { if (acoes) acoes.current = {}; }, [acoes]);

  const irPara = (n) => { setI(n); setOuvido(""); setVeredito(null); setDigitado(""); };
  const testarDigitado = () => {
    const t = digitado.trim();
    if (!t) return;
    const norm = normalizarFala(t);
    const depois = depoisDeJarvis(norm);
    avaliar(t, depois === null ? norm : depois, depois !== null);
  };
  const quantas = Object.keys(feitas).length;

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onSair}>← Sair da escola</button>

      <div style={{ ...S.card, borderColor: "#E1306C44" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <div>
            <div style={S.label}>Escola do Jarvis</div>
            <div style={{ fontWeight: 900, fontSize: 18, marginTop: 2 }}>Lição {i + 1} de {LICOES_JARVIS.length}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 22, fontWeight: 900, color: "#E1306C" }}>{quantas}/{LICOES_JARVIS.length}</div>
            <div style={{ fontSize: 11, color: "var(--cinza)" }}>acertos</div>
          </div>
        </div>
        <div style={{ height: 6, background: "var(--borda)", borderRadius: 3, marginTop: 12, overflow: "hidden" }}
          role="progressbar" aria-valuenow={quantas} aria-valuemin={0} aria-valuemax={LICOES_JARVIS.length}
          aria-label="Comandos aprendidos">
          <div style={{ height: "100%", width: (quantas / LICOES_JARVIS.length) * 100 + "%", background: GRAD_LINHA, borderRadius: 3, transition: "width .35s ease" }} />
        </div>
        <div style={{ fontSize: 12, color: "var(--cinza)", lineHeight: 1.6, marginTop: 12 }}>
          Aqui nada é anotado e nenhum treino é alterado. É só para você ouvir como ele entende.
        </div>
        {ouvindo && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginTop: 12 }}>
            <span style={{ fontSize: 13, fontWeight: 800, color: "var(--ok)" }}>🎤 Ouvindo — pode falar</span>
            <button onClick={onDesligarVoz}
              style={{ background: "none", border: "none", color: "var(--cinza)", fontWeight: 800, fontSize: 12, cursor: "pointer", padding: 0 }}>
              desligar
            </button>
          </div>
        )}
      </div>

      {!ouvindo && (
        <div style={{ ...S.card, borderColor: "var(--obs)" }}>
          <div style={{ fontSize: 14, lineHeight: 1.6, marginBottom: 12 }}>
            O microfone está desligado. Ligue para praticar falando — ou use o campo de texto
            no fim da lição, que funciona igual.
          </div>
          <button style={S.btn} onClick={onLigarVoz}>🎤 Ligar o Jarvis</button>
        </div>
      )}

      <div style={S.card}>
        <div style={S.label}>{licao.titulo}</div>
        <div style={{ fontSize: 13, color: "var(--cinza)", lineHeight: 1.6, margin: "8px 0 16px" }}>{licao.porque}</div>

        <div style={{ ...S.label, marginBottom: 8 }}>Diga em voz alta</div>
        <div style={{ border: "2px solid #E1306C", background: "#E1306C15", borderRadius: 16, padding: "18px 16px", marginBottom: 10 }}>
          <div style={{ fontSize: 21, fontWeight: 900, color: "#E1306C", lineHeight: 1.35 }}>“{licao.diga}”</div>
          {licao.dica && <div style={{ fontSize: 12, color: "var(--obs)", fontWeight: 800, marginTop: 8 }}>{licao.dica}</div>}
        </div>
        <button style={{ ...S.btnGhost, marginBottom: 16 }} onClick={() => onFalar && onFalar(licao.diga)}>
          🔊 Ouvir como se diz
        </button>

        {ouvido && (
          <div style={{ marginBottom: 12 }}>
            <div style={S.label}>Ele ouviu</div>
            <div style={{ fontSize: 15, fontStyle: "italic", color: "var(--texto)", marginTop: 4, lineHeight: 1.5 }}>“{ouvido}”</div>
          </div>
        )}

        {veredito && (
          <div role="status" style={{
            border: "1px solid " + (veredito.ok ? "var(--ok)" : "var(--obs)"),
            background: veredito.ok ? "var(--ok-bg)" : "#C7A94B18",
            borderRadius: 14, padding: "14px 14px", marginBottom: 14,
          }}>
            <div style={{ fontSize: 15, fontWeight: 800, color: veredito.ok ? "var(--ok)" : "var(--obs)", lineHeight: 1.5 }}>
              {veredito.ok ? "✓ " : "🤔 "}{veredito.texto}
            </div>
          </div>
        )}

        {veredito && veredito.ok && !ultima && (
          <button style={{ ...S.btn, marginBottom: 10 }} onClick={() => irPara(i + 1)}>Próxima lição →</button>
        )}
        {veredito && veredito.ok && ultima && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 16, fontWeight: 900, marginBottom: 8 }}>🎓 Você passou por todos os comandos.</div>
            <div style={{ fontSize: 13, color: "var(--cinza)", lineHeight: 1.6, marginBottom: 12 }}>
              No treino, se esquecer algum, é só perguntar: <b>“Jarvis, quais são os principais comandos?”</b>
            </div>
            <button style={S.btn} onClick={onSair}>Voltar e treinar de verdade</button>
          </div>
        )}

        <div style={{ display: "flex", gap: 10 }}>
          <button style={{ ...S.btnGhost, flex: 1 }} disabled={i === 0}
            onClick={() => irPara(Math.max(0, i - 1))}>← Anterior</button>
          <button style={{ ...S.btnGhost, flex: 1 }} disabled={ultima}
            onClick={() => irPara(Math.min(LICOES_JARVIS.length - 1, i + 1))}>Pular →</button>
        </div>
      </div>

      {/* Sem microfone (iPhone, navegador antigo) ainda dá para aprender a forma da frase */}
      <div style={S.card}>
        <div style={S.label}>Ou escreva para testar</div>
        <div style={{ fontSize: 12, color: "var(--cinza)", lineHeight: 1.5, margin: "6px 0 10px" }}>
          Passa pelo mesmo interpretador da voz. Serve para conferir se uma frase sua seria entendida.
        </div>
        <input style={{ ...S.input, marginBottom: 10 }} value={digitado}
          placeholder={licao.diga}
          aria-label="Frase para testar"
          onChange={(e) => setDigitado(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") testarDigitado(); }} />
        <button style={S.btnGhost} onClick={testarDigitado}>Testar a frase</button>
      </div>

      <div style={{ ...S.card, borderStyle: "dashed" }}>
        <div style={S.label}>Todas as lições</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 10 }}>
          {LICOES_JARVIS.map((l, n) => (
            <button key={l.id} onClick={() => irPara(n)} aria-pressed={n === i}
              style={{ border: "1px solid " + (n === i ? "#E1306C" : feitas[l.id] ? "var(--ok)" : "var(--borda2)"),
                background: n === i ? "#E1306C22" : "transparent",
                color: n === i ? "#E1306C" : feitas[l.id] ? "var(--ok)" : "var(--cinza)",
                borderRadius: 20, padding: "7px 12px", fontWeight: 800, fontSize: 12, cursor: "pointer" }}>
              {feitas[l.id] ? "✓ " : ""}{l.titulo}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// A tela do scanner. Fica POR CIMA da tela de treino, e não numa aba própria:
// assim ela usa o mesmo caminho de registrar série que o botão ✓ e a voz usam —
// descanso, recorde e festa saem de graça, sem nenhuma lógica duplicada.
function ScannerEyes({ aberto, ex, repsAlvo, pesoAtual, pesoCorporal, serieNum, serieTotal, som, bpm,
  vozCfg, contarAlto, onAlternarContagem, autoSerie, onAlternarAuto,
  livre, exPorId, onGuardarLivre, onRegistrar, onFechar }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const fluxoRef = useRef(null);
  const contadorRef = useRef(null);
  const lacoRef = useRef(0);
  const [fase, setFase] = useState("carregando");   // carregando | pronto | erro
  const [erro, setErro] = useState("");
  const [reps, setReps] = useState(0);
  const [peso, setPeso] = useState(pesoAtual || "");
  const [vendo, setVendo] = useState(false);
  const [sinal, setSinal] = useState("");
  const [frente, setFrente] = useState(false);
  const inicioRef = useRef(0);
  const [segundos, setSegundos] = useState(0);
  // Em ref, e não em closure: o laço de contagem é montado uma vez, e ligar ou
  // desligar a voz no meio da série precisa valer na repetição seguinte.
  const contarAltoRef = useRef(contarAlto);
  contarAltoRef.current = contarAlto;
  const vozRef2 = useRef(vozCfg);
  vozRef2.current = vozCfg;
  const tecnicoRef = useRef(null);
  const posturaRef = useRef(null);
  const [dica, setDica] = useState(null);     // { texto, tipo, em }
  const alvoRef = useRef(0);
  alvoRef.current = parseInt(repsAlvo) || 0;
  // Bateu o número combinado, a série está feita: insistir num toque na tela
  // depois disso é pedir para a pessoa interromper o treino para confirmar o
  // óbvio. Ela fecha sozinha em quatro segundos, e dá para cancelar nesse meio
  // tempo — porque quem quer fazer duas a mais também tem razão.
  const [fechando, setFechando] = useState(0);
  const autoRef = useRef(autoSerie);
  autoRef.current = autoSerie;
  const canceladoRef = useRef(false);
  const repsRef = useRef(0);
  const pesoRef = useRef("");
  const [medidas, setMedidas] = useState(null);   // ritmo, tempo sob tensão e lados
  // Modo livre: ninguém escolheu exercício nenhum. Ele olha alguns segundos e
  // diz de qual movimento aquilo mais se parece — escrito, com botão para
  // trocar. Adivinhar e contar calado seria pior do que não adivinhar.
  const [movLivre, setMovLivre] = useState(null);
  const [palpite, setPalpite] = useState(null);
  const [escolhendo, setEscolhendo] = useState(false);
  const [guardados, setGuardados] = useState([]);
  const livreRef = useRef(livre);
  livreRef.current = livre;
  const movRef = useRef(null);
  movRef.current = movLivre;
  const t0Ref = useRef(0);
  // Enquadramento: a contagem só começa depois que o corpo está no quadro, e a
  // voz guia até lá. Sem isso, quem usa a câmera de trás não tem como saber que
  // está fora — e descobre depois da série inteira não ter contado nada.
  const [enquadrado, setEnquadrado] = useState(false);
  const [guia, setGuia] = useState(null);          // { chave, texto, seta }
  const prontoRef = useRef(false);
  const okDesdeRef = useRef(0);
  const entrouEnquadraRef = useRef(0);
  const faladoRef = useRef({ chave: "", em: 0 });
  const [confirmou, setConfirmou] = useState(false);

  useEffect(() => { setPeso(pesoAtual || ""); }, [pesoAtual, aberto]);
  pesoRef.current = peso;

  // Montar o contador é uma função, e não código solto dentro do efeito, porque
  // no modo livre ele é trocado no meio: o movimento só é descoberto depois de
  // alguns segundos de câmera, e aí o perfil certo entra no lugar do automático.
  const montarContador = (exAlvo) => {
    setReps(0);
    repsRef.current = 0;
    setFechando(0);
    canceladoRef.current = false;
    tecnicoRef.current = criarTecnico();
    posturaRef.current = criarPostura(exAlvo);
    setDica(null);
    // Exercício de máquina o contador descobre sozinho. Movimento funcional tem
    // forma conhecida, e dizer qual é rende uma contagem muito melhor — é a
    // diferença entre contar o salto e contar o balanço do braço durante o salto.
    const perfil = (exAlvo && exAlvo.func && MOV_FUNCIONAIS[exAlvo.func]) || null;
    if (perfil && perfil.dica) setDica({ texto: perfil.dica, tipo: "dica", em: Date.now() });
    contadorRef.current = criarContador({
      perfil: perfil,
      preferidos: (exAlvo && EYES_PREFERENCIA[exAlvo.grupo]) || [],
      aoContar: (n, q) => {
        // O bipe é o retorno que chega sem olhar: a pessoa está de costas para
        // o celular na maior parte dos exercícios.
        if (som) beep(1200, 0.05, 0.12);
        try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) {}

        // O comentário aparece na tela mesmo com o som desligado: quem treina
        // sem fone também merece saber que a amplitude está caindo.
        const alvoN = alvoRef.current;
        repsRef.current = n;
        if (contadorRef.current) setMedidas(contadorRef.current.estado());
        if (alvoN > 0 && n >= alvoN && autoRef.current && !canceladoRef.current) setFechando(4);
        // Postura vence o técnico, e por uma razão simples: amplitude curta custa
        // resultado, joelho caindo para dentro custa joelho.
        const fPostura = posturaRef.current ? posturaRef.current.fecharRepeticao(n) : null;
        const frase = fPostura || (tecnicoRef.current ? tecnicoRef.current.comentar(n, q, alvoN) : null);
        if (frase) setDica({
          texto: frase,
          tipo: fPostura || (q && (q.caindo || q.rapida)) ? "corrige" : "elogia",
          em: Date.now(),
        });

        if (!contarAltoRef.current) return;
        // Número seco e rápido, como um parceiro contando. A última ganha a
        // palavra que encerra a série, porque é a informação que muda o que fazer.
        const cfg = vozRef2.current || {};
        const fim = alvoN > 0 && n >= alvoN;
        const voz = {
          falar: true,
          vozNome: cfg.vozNome,
          velocidade: Math.min(1.6, (cfg.velocidade || 1.1) + 0.25),
          animado: cfg.animado,
        };
        jarvisFalar(fim ? n + ". Completou." : String(n), voz);
        // Em fila: entra depois do número em vez de cortá-lo. E num tom um
        // pouco mais calmo, porque é frase e não contagem.
        if (frase) {
          jarvisFalar(frase, {
            falar: true,
            vozNome: cfg.vozNome,
            velocidade: cfg.velocidade || 1.1,
            animado: cfg.animado,
            fila: true,
          });
        }
      },
    });
  };

  // ---- liga e desliga a câmera junto com a tela ----
  useEffect(() => {
    if (!aberto) return;
    let vivo = true;
    setFase("carregando");
    setErro("");
    setReps(0);
    repsRef.current = 0;
    setFechando(0);
    setMedidas(null);
    canceladoRef.current = false;
    setEnquadrado(false);
    setConfirmou(false);
    setGuia(null);
    prontoRef.current = false;
    okDesdeRef.current = 0;
    entrouEnquadraRef.current = 0;
    faladoRef.current = { chave: "", em: 0 };
    setMovLivre(null);
    setPalpite(null);
    setGuardados([]);
    movRef.current = null;
    t0Ref.current = 0;
    inicioRef.current = Date.now();
    montarContador(ex);

    (async () => {
      let detector;
      try {
        detector = await carregarEyes();
      } catch (e) {
        if (!vivo) return;
        setFase("erro");
        setErro("Não consegui baixar o reconhecimento de movimento. Ele tem uns 8 MB e precisa de internet só na primeira vez.");
        return;
      }
      if (!vivo) return;
      let fluxo;
      try {
        fluxo = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: frente ? "user" : { ideal: "environment" }, width: { ideal: 960 } },
          audio: false,
        });
      } catch (e) {
        if (!vivo) return;
        setFase("erro");
        setErro("Preciso da câmera para contar as repetições. Toque no cadeado ao lado do endereço e libere a câmera para este site.");
        return;
      }
      if (!vivo) { fluxo.getTracks().forEach((t) => t.stop()); return; }
      fluxoRef.current = fluxo;
      const v = videoRef.current;
      if (!v) return;
      v.srcObject = fluxo;
      try { await v.play(); } catch (e) {}
      setFase("pronto");
      ligarTravaTela();

      // ---- o laço: detecta, desenha, conta ----
      let ultimo = 0;
      const quadro = () => {
        if (!vivo) return;
        lacoRef.current = requestAnimationFrame(quadro);
        const agora = performance.now();
        // 24 quadros por segundo bastam para contar e poupam bateria
        if (agora - ultimo < 41) return;
        ultimo = agora;
        const vid = videoRef.current, cv = canvasRef.current;
        if (!vid || !cv || vid.readyState < 2) return;
        let res;
        try { res = detector.detectForVideo(vid, agora); } catch (e) { return; }
        const lm = res && res.landmarks && res.landmarks[0];
        const ctx = cv.getContext("2d");
        if (cv.width !== vid.videoWidth) { cv.width = vid.videoWidth; cv.height = vid.videoHeight; }
        ctx.clearRect(0, 0, cv.width, cv.height);
        if (!lm) { setVendo(false); return; }
        setVendo(true);

        // esqueleto
        ctx.lineWidth = Math.max(3, cv.width / 160);
        ctx.strokeStyle = "#7CFF3C";
        ctx.fillStyle = "#7CFF3C";
        EYES_OSSOS.forEach((o) => {
          const a = lm[o[0]], b = lm[o[1]];
          if (!visivel(a) || !visivel(b)) return;
          ctx.beginPath();
          ctx.moveTo(a.x * cv.width, a.y * cv.height);
          ctx.lineTo(b.x * cv.width, b.y * cv.height);
          ctx.stroke();
        });
        const r = Math.max(4, cv.width / 110);
        EYES_PONTOS.forEach((i) => {
          const p = lm[i];
          if (!visivel(p)) return;
          ctx.beginPath();
          ctx.arc(p.x * cv.width, p.y * cv.height, r, 0, Math.PI * 2);
          ctx.fill();
        });

        // ---- enquadramento: roda antes de qualquer contagem ----
        if (!prontoRef.current) {
          if (!entrouEnquadraRef.current) entrouEnquadraRef.current = agora;
          // Exercício sentado não mostra os pés, e máquina encostada na parede não
          // mostra o corpo inteiro. Sem esta saída, o enquadramento viraria uma
          // porta trancada justamente nos exercícios mais comuns da academia.
          if (agora - entrouEnquadraRef.current > 12000) {
            prontoRef.current = true;
            setEnquadrado(true);
            if (contadorRef.current) contadorRef.current.zerar();
            if (posturaRef.current) posturaRef.current.zerar();
            const cfg0 = vozRef2.current || {};
            jarvisFalar("Não consegui confirmar o enquadramento. Vou contar assim mesmo.", {
              falar: true, vozNome: cfg0.vozNome, velocidade: cfg0.velocidade || 1.1, animado: false,
            });
            return;
          }
          const g = avaliarEnquadramento(lm);
          setGuia(g);
          // A voz repete só quando a instrução muda, ou de três em três
          // segundos. Guia que fala sem parar vira ruído e atrapalha quem está
          // tentando se posicionar de costas para o celular.
          const f = faladoRef.current;
          if (g.fala && (g.chave !== f.chave || agora - f.em > 3000)) {
            faladoRef.current = { chave: g.chave, em: agora };
            const cfg = vozRef2.current || {};
            jarvisFalar(g.fala, {
              falar: true, vozNome: cfg.vozNome,
              velocidade: cfg.velocidade || 1.1, animado: false,
            });
          }
          if (g.ok) {
            if (!okDesdeRef.current) okDesdeRef.current = agora;
            // Um segundo e meio parado no lugar certo: sem essa espera, passar
            // andando pelo quadro já liberaria a contagem.
            if (agora - okDesdeRef.current > 1500) {
              prontoRef.current = true;
              setEnquadrado(true);
              setConfirmou(true);
              setTimeout(() => setConfirmou(false), 1200);
              if (som) beep(1500, 0.16, 0.18);
              try { if (navigator.vibrate) navigator.vibrate([40, 60, 40]); } catch (e) {}
              // A referência do contador recomeça aqui: o que ele mediu enquanto
              // a pessoa andava para se posicionar não é repetição de nada.
              if (contadorRef.current) contadorRef.current.zerar();
              if (posturaRef.current) posturaRef.current.zerar();
            }
          } else {
            okDesdeRef.current = 0;
          }
          return;
        }

        if (posturaRef.current) posturaRef.current.medir(lm);
        const info = contadorRef.current.processar(lm, agora);
        if (info.contou) setReps(info.total);
        if (info.sinal) setSinal(info.sinal);

        // Cinco segundos é o tempo de três ou quatro repetições — menos que isso
        // e o palpite sai de meio movimento, que é como errar de propósito.
        if (livreRef.current && !movRef.current) {
          if (!t0Ref.current) t0Ref.current = agora;
          else if (agora - t0Ref.current > 5000) {
            const p = adivinharMovimento(contadorRef.current.faixas());
            if (p) { t0Ref.current = 0; setPalpite(p); setMovLivre(p.id); }
            else t0Ref.current = agora - 3200;   // volta a tentar daqui a 1,8 s
          }
        }
      };
      lacoRef.current = requestAnimationFrame(quadro);
    })();

    return () => {
      vivo = false;
      cancelAnimationFrame(lacoRef.current);
      if (fluxoRef.current) {
        // Sem isto a luz da câmera fica acesa depois de fechar a tela — e com
        // razão a pessoa desinstala o app.
        fluxoRef.current.getTracks().forEach((t) => t.stop());
        fluxoRef.current = null;
      }
      desligarTravaTela();
    };
  }, [aberto, frente, ex, som]);

  // A dica fica cinco segundos e sai: é um aviso, não um letreiro. A dica de
  // forma do movimento funcional fica um pouco mais: ela aparece antes da
  // primeira repetição, quando a pessoa ainda está se posicionando.
  useEffect(() => {
    if (!dica) return;
    const t = setTimeout(() => setDica(null), dica.tipo === "dica" ? 8000 : 5000);
    return () => clearTimeout(t);
  }, [dica]);

  // Movimento escolhido (adivinhado ou trocado na mão): o contador é refeito
  // com o perfil certo e a conta recomeça do zero. Contar com o perfil errado
  // os primeiros segundos e somar depois daria um número que não existiu.
  useEffect(() => {
    if (!livre || !movLivre) return;
    const e = exPorId ? exPorId(movLivre) : null;
    montarContador(e || null);
    const cfg = vozRef2.current || {};
    const nome = e ? nomeFalado(e.nome) : "";
    jarvisFalar((palpite && !palpite.seguro ? "Parece " : "") + nome + ". Contando.", {
      falar: true, vozNome: cfg.vozNome, velocidade: cfg.velocidade || 1.1, animado: cfg.animado,
    });
  }, [movLivre]);

  // A contagem regressiva do fechamento automático. Um bipe por segundo: é o
  // aviso que chega sem olhar, e é o que torna o cancelamento possível.
  useEffect(() => {
    if (fechando <= 0) return;
    if (som) beep(fechando === 1 ? 1500 : 800, 0.07, 0.1);
    const t = setTimeout(() => {
      if (fechando > 1) { setFechando(fechando - 1); return; }
      setFechando(0);
      onRegistrar(repsRef.current, pesoRef.current);
    }, 1000);
    return () => clearTimeout(t);
  }, [fechando]);

  // cronômetro da série, para as calorias
  useEffect(() => {
    if (!aberto || fase !== "pronto") return;
    const iv = setInterval(() => setSegundos(Math.round((Date.now() - inicioRef.current) / 1000)), 1000);
    return () => clearInterval(iv);
  }, [aberto, fase]);

  if (!aberto) return null;

  const alvo = parseInt(repsAlvo) || 0;
  const completou = alvo > 0 && reps >= alvo;
  // No modo livre o exercício é o que foi descoberto; no normal é o da ficha.
  const exAtual = livre ? (movLivre && exPorId ? exPorId(movLivre) : null) : ex;
  // A seta aponta para onde o corpo tem de andar NA TELA. Com a câmera da
  // frente a imagem é espelhada, então o lado da tela é o contrário do lado da
  // imagem — e uma seta trocada manda a pessoa para fora do quadro.
  const ladoSeta = !guia ? null
    : guia.seta === "maisX" ? (frente ? "esq" : "dir")
    : guia.seta === "menosX" ? (frente ? "dir" : "esq") : null;
  const classeAlvo = guia && guia.seta === "aproxima" ? "eq-cresce"
    : guia && guia.seta === "afasta" ? "eq-encolhe" : "";

  const checagens = (exAtual && exAtual.func && POSTURA_POR_MOV[exAtual.func]) ||
    (exAtual && POSTURA_POR_GRUPO[exAtual.grupo]) || [];
  // Quem já sabe onde se põe não devia esperar o aval de ninguém — e, se o
  // reconhecimento estiver com dificuldade naquele ângulo, este botão é a
  // diferença entre usar e desinstalar.
  const pularEnquadramento = () => {
    prontoRef.current = true;
    setEnquadrado(true);
    if (contadorRef.current) contadorRef.current.zerar();
    if (posturaRef.current) posturaRef.current.zerar();
  };

  const guardarLivre = () => {
    if (reps > 0 && movLivre && onGuardarLivre) {
      onGuardarLivre(movLivre, reps);
      setGuardados((g) => g.concat({ id: movLivre, reps: reps }));
    }
    setPalpite(null);
    setMovLivre(null);
    movRef.current = null;
    t0Ref.current = 0;
    montarContador(null);
  };
  const vistaPedida = checagens.indexOf("valgo") >= 0 ? "frente" : "perfil";
  const ajustar = (d) => {
    const n = Math.max(0, reps + d);
    setReps(n);
    repsRef.current = n;
    // Mexer na conta à mão é dizer "ainda não acabei": o fechamento some e não
    // volta nesta série.
    setFechando(0);
    canceladoRef.current = true;
    setDica(null);
    if (contadorRef.current) contadorRef.current.ajustar(n);
    if (posturaRef.current) posturaRef.current.zerar();
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "#000000", zIndex: 60, display: "flex", flexDirection: "column" }}>
      {/* a imagem */}
      <div style={{ position: "relative", flex: 1, overflow: "hidden", background: "#000000" }}>
        <video ref={videoRef} playsInline muted
          style={{ width: "100%", height: "100%", objectFit: "cover", transform: frente ? "scaleX(-1)" : "none" }} />
        <canvas ref={canvasRef}
          style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover",
            transform: frente ? "scaleX(-1)" : "none", pointerEvents: "none" }} />

        {/* calorias e tempo, como no canto do aparelho */}
        <div style={{ position: "absolute", top: "calc(10px + env(safe-area-inset-top))", left: 12,
          background: "rgba(0,0,0,0.55)", borderRadius: 12, padding: "8px 12px" }}>
          <div style={{ fontSize: 20, fontWeight: 900, color: "#FFFFFF", lineHeight: 1.1 }}>
            {caloriasEstimadas(segundos, pesoCorporal)} <span style={{ fontSize: 12, color: "#FF6B6B" }}>kcal</span>
          </div>
          <div style={{ fontSize: 11, color: "rgba(255,255,255,0.75)" }}>{Math.floor(segundos / 60)}:{(segundos % 60) < 10 ? "0" : ""}{segundos % 60}</div>
          {bpm && (
            <div style={{ fontSize: 19, fontWeight: 900, color: "#FFFFFF", marginTop: 4 }}>
              {bpm} <span style={{ fontSize: 13, color: "#ED4956" }}>❤</span>
            </div>
          )}
        </div>

        <button onClick={onFechar} aria-label="Fechar o scanner"
          style={{ position: "absolute", top: "calc(10px + env(safe-area-inset-top))", right: 12,
            width: 42, height: 42, borderRadius: 21, border: "none", background: "rgba(0,0,0,0.55)",
            color: "#FFFFFF", fontSize: 20, fontWeight: 900, cursor: "pointer" }}>✕</button>

        {/* Enquanto enquadra, este botão ganha nome: com a câmera de trás a pessoa
            não vê a tela, e trocar para a da frente é o que permite ver as setas.
            Escondido atrás de um ícone, ninguém achava. */}
        <button onClick={() => setFrente((f) => !f)}
          aria-label={frente ? "Usar a câmera de trás" : "Usar a câmera da frente"}
          style={{ position: "absolute", top: "calc(60px + env(safe-area-inset-top))", right: 12,
            height: 42, borderRadius: 21, border: "none", background: "rgba(0,0,0,0.55)",
            color: "#FFFFFF", fontSize: enquadrado ? 17 : 13, fontWeight: 800,
            padding: enquadrado ? 0 : "0 14px", width: enquadrado ? 42 : "auto", cursor: "pointer" }}>
          {enquadrado ? "⟲" : (frente ? "⟲ câmera de trás" : "⟲ câmera da frente")}
        </button>

        {/* Contar alto é o retorno que serve de costas para a tela — mas em
            academia cheia nem sempre é bem-vindo. Por isso o botão fica aqui,
            à mão, e não escondido nos ajustes. */}
        <button onClick={onAlternarContagem}
          aria-pressed={!!contarAlto}
          aria-label={contarAlto ? "Desligar a contagem em voz alta" : "Ligar a contagem em voz alta"}
          style={{ position: "absolute", top: "calc(110px + env(safe-area-inset-top))", right: 12,
            minWidth: 42, height: 42, borderRadius: 21, border: "none",
            background: contarAlto ? "rgba(124,255,60,0.85)" : "rgba(0,0,0,0.55)",
            color: contarAlto ? "#0A2A00" : "#FFFFFF", fontSize: 15, fontWeight: 900,
            padding: "0 12px", cursor: "pointer" }}>
          {contarAlto ? "🔊 1,2,3" : "🔇"}
        </button>

        <button onClick={onAlternarAuto}
          aria-pressed={!!autoSerie}
          aria-label={autoSerie ? "Desligar o fechamento automático da série" : "Ligar o fechamento automático da série"}
          style={{ position: "absolute", top: "calc(160px + env(safe-area-inset-top))", right: 12,
            minWidth: 42, height: 42, borderRadius: 21, border: "none",
            background: autoSerie ? "rgba(47,212,138,0.85)" : "rgba(0,0,0,0.55)",
            color: autoSerie ? "#042016" : "#FFFFFF", fontSize: 14, fontWeight: 900,
            padding: "0 12px", cursor: "pointer" }}>
          {autoSerie ? "⏱ auto" : "⏱ off"}
        </button>

        {/* O palpite aparece escrito, sempre. Ele pode errar — e quando erra, o
            botão de trocar tem de estar à mão, não escondido num menu. */}
        {livre && fase === "pronto" && (
          <div style={{ position: "absolute", left: 12, right: 12, top: "calc(10px + env(safe-area-inset-top))",
            display: "flex", justifyContent: "center", pointerEvents: "none" }}>
            <div style={{ pointerEvents: "auto", maxWidth: 300,
              background: movLivre ? "rgba(47,212,138,0.92)" : "rgba(0,0,0,0.7)",
              color: movLivre ? "#042016" : "#FFFFFF", borderRadius: 14, padding: "9px 13px",
              textAlign: "center", fontSize: 13.5, fontWeight: 900, lineHeight: 1.35 }}>
              {movLivre
                ? (palpite && !palpite.seguro ? "Parece " : "") + (exAtual ? exAtual.nome : "")
                : (vendo ? "Procurando o movimento..." : "Apoie o celular e apareça inteiro")}
              <button onClick={() => setEscolhendo(true)}
                style={{ display: "block", margin: "5px auto 0", border: "none", background: "transparent",
                  color: movLivre ? "#042016" : "#7CFF3C", fontSize: 12, fontWeight: 800,
                  textDecoration: "underline", cursor: "pointer", padding: 0 }}>
                {movLivre ? "não é isso? trocar" : "escolher na mão"}
              </button>
            </div>
          </div>
        )}

        {escolhendo && (
          <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.88)", zIndex: 3,
            overflowY: "auto", padding: "calc(16px + env(safe-area-inset-top)) 16px 20px" }}>
            <div style={{ color: "#FFFFFF", fontSize: 16, fontWeight: 900, marginBottom: 12 }}>Qual movimento?</div>
            {EXERCICIOS.filter((e) => e.funcional).map((e) => (
              <button key={e.id}
                onClick={() => { setEscolhendo(false); setPalpite(null); movRef.current = e.id; setMovLivre(e.id); }}
                style={{ width: "100%", display: "flex", alignItems: "center", gap: 11, marginBottom: 7,
                  background: e.id === movLivre ? "rgba(124,255,60,0.16)" : "rgba(255,255,255,0.07)",
                  border: "1px solid " + (e.id === movLivre ? "#7CFF3C" : "rgba(255,255,255,0.16)"),
                  borderRadius: 12, padding: "9px 11px", color: "#FFFFFF", fontSize: 14,
                  fontWeight: 800, textAlign: "left", cursor: "pointer" }}>
                <BonecoFuncional id={e.func} tamanho={34} cor="#7CFF3C" />
                {e.nome}
              </button>
            ))}
            <button onClick={() => setEscolhendo(false)}
              style={{ ...S.btnGhost, marginTop: 8, color: "#FFFFFF", borderColor: "rgba(255,255,255,0.4)" }}>
              Voltar e deixar ele descobrir
            </button>
          </div>
        )}

        {/* ---- guia de enquadramento, antes de contar ---- */}
        {fase === "pronto" && !enquadrado && (
          <React.Fragment>
            <div className={classeAlvo} style={{ position: "absolute", inset: "6% 16%",
              border: "2px dashed rgba(255,255,255,0.4)", borderRadius: 20, pointerEvents: "none" }} />

            {ladoSeta && (
              <div className="eq-seta" aria-hidden="true"
                style={{ position: "absolute", top: "50%", left: ladoSeta === "esq" ? 8 : "auto",
                  right: ladoSeta === "dir" ? 8 : "auto", fontSize: 92, lineHeight: 1,
                  color: "#7CFF3C", textShadow: "0 0 20px rgba(0,0,0,0.9)", pointerEvents: "none" }}>
                {ladoSeta === "esq" ? "◀" : "▶"}
              </div>
            )}

            <div role="status" style={{ position: "absolute", left: 10, right: 10,
              bottom: 84, textAlign: "center", pointerEvents: "none" }}>
              <div style={{ display: "inline-block", background: "rgba(0,0,0,0.7)", borderRadius: 16,
                padding: "11px 18px", color: "#FFFFFF", fontSize: 20, fontWeight: 900, lineHeight: 1.25 }}>
                {guia ? guia.texto : "Procurando você..."}
                <span style={{ display: "block", fontSize: 12, fontWeight: 700, color: "rgba(255,255,255,0.72)", marginTop: 5 }}>
                  Vou avisar por voz quando estiver certo
                </span>
              </div>
            </div>

            <button onClick={pularEnquadramento}
              style={{ position: "absolute", left: "50%", bottom: 22, transform: "translateX(-50%)",
                border: "1px solid rgba(255,255,255,0.45)", background: "rgba(0,0,0,0.6)", color: "#FFFFFF",
                borderRadius: 22, padding: "11px 20px", fontSize: 14, fontWeight: 800, cursor: "pointer" }}>
              Já estou na posição
            </button>
          </React.Fragment>
        )}

        {/* a confirmação: a moldura verde é o que a pessoa vê de longe, e o bipe
            é o que ela ouve quando está de costas para o celular */}
        {confirmou && (
          <div className="eq-confirma" aria-hidden="true"
            style={{ position: "absolute", inset: 0, pointerEvents: "none",
              border: "12px solid #7CFF3C", boxShadow: "inset 0 0 70px rgba(124,255,60,0.6)" }} />
        )}

        {/* o contador grande, que é o que a pessoa olha de longe */}
        {fase === "pronto" && (
          <div style={{ position: "absolute", right: 14, bottom: 14, textAlign: "center",
            background: completou ? "rgba(47,212,138,0.9)" : "rgba(0,0,0,0.6)",
            borderRadius: 60, width: 118, height: 118, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center", border: "3px solid " + (completou ? "#2FD48A" : "rgba(255,255,255,0.35)") }}>
            <div style={{ fontSize: 44, fontWeight: 900, color: "#FFFFFF", lineHeight: 1 }}>{reps}</div>
            {alvo > 0 && <div style={{ fontSize: 15, fontWeight: 800, color: "rgba(255,255,255,0.8)" }}>de {alvo}</div>}
          </div>
        )}

        {/* avisos de estado, sempre em linguagem de quem está treinando */}
        {fase === "carregando" && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", padding: 28 }}>
            <div style={{ textAlign: "center", color: "#FFFFFF" }}>
              <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 8 }}>Preparando o reconhecimento...</div>
              <div style={{ fontSize: 13, color: "rgba(255,255,255,0.7)", lineHeight: 1.6 }}>
                Na primeira vez ele baixa uns 8 MB. Depois disso funciona sem internet.
              </div>
            </div>
          </div>
        )}
        {fase === "erro" && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", padding: 28 }}>
            <div style={{ textAlign: "center", color: "#FFFFFF" }}>
              <div style={{ fontSize: 34, marginBottom: 10 }}>📷</div>
              <div style={{ fontSize: 14, lineHeight: 1.7 }}>{erro}</div>
              <button style={{ ...S.btnGhost, marginTop: 18, color: "#FFFFFF", borderColor: "rgba(255,255,255,0.4)" }}
                onClick={onFechar}>Voltar e marcar na mão</button>
            </div>
          </div>
        )}
        {fase === "pronto" && dica && (
          <div role="status" style={{ position: "absolute", left: 14, right: 160, bottom: 150,
            background: dica.tipo === "corrige" ? "rgba(237,73,86,0.92)"
              : dica.tipo === "dica" ? "rgba(0,0,0,0.78)" : "rgba(124,255,60,0.92)",
            color: dica.tipo === "elogia" ? "#0A2A00" : "#FFFFFF",
            borderRadius: 14, padding: "12px 14px", fontSize: 16, fontWeight: 900, lineHeight: 1.35 }}>
            {dica.tipo === "corrige" ? "⚠ " : dica.tipo === "dica" ? "◎ " : "✓ "}{dica.texto}
          </div>
        )}
        {fechando > 0 && (
          <button onClick={() => { setFechando(0); canceladoRef.current = true; }}
            style={{ position: "absolute", left: 14, right: 14, bottom: 150, border: "none",
              background: "rgba(47,212,138,0.95)", color: "#042016", borderRadius: 14,
              padding: "14px 14px", fontSize: 15.5, fontWeight: 900, cursor: "pointer", textAlign: "left" }}>
            ✓ Série completa. Registrando em {fechando}…
            <span style={{ display: "block", fontSize: 12.5, fontWeight: 700, marginTop: 3, opacity: 0.8 }}>
              Toque aqui se ainda vai fazer mais.
            </span>
          </button>
        )}
        {/* Dizer qual vista ele precisa é o que torna a correção possível: valgo
            de joelho não existe de perfil, e quadril fora da linha não existe de
            frente. Sem este aviso a checagem simplesmente nunca rodaria. */}
        {fase === "pronto" && vendo && !dica && posturaRef.current && posturaRef.current.ativo && (
          <div style={{ position: "absolute", left: 14, bottom: 150,
            background: "rgba(0,0,0,0.6)", borderRadius: 12, padding: "8px 11px",
            color: "rgba(255,255,255,0.85)", fontSize: 12, fontWeight: 700 }}>
            ◎ Olhando a forma · fique {vistaPedida === "perfil" ? "de lado" : "de frente"}
          </div>
        )}
        {fase === "pronto" && !vendo && (
          <div style={{ position: "absolute", left: 12, right: 150, bottom: 18,
            background: "rgba(0,0,0,0.6)", borderRadius: 12, padding: "10px 12px", color: "#FFFFFF", fontSize: 13, lineHeight: 1.5 }}>
            Não estou te vendo. Apoie o celular de pé, uns 2 metros de distância, com o corpo inteiro na tela.
          </div>
        )}
      </div>

      {/* a barra de registro, igual à da ficha: é para onde a contagem vai */}
      <div style={{ background: "var(--bg2)", borderTop: "1px solid var(--borda)", padding: "12px 14px",
        paddingBottom: "calc(14px + env(safe-area-inset-bottom))" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 10 }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 900, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {exAtual ? exAtual.nome : (livre ? "Procurando o movimento..." : "Exercício")}
            </div>
            <div style={{ fontSize: 11, color: "var(--cinza)" }}>
              {livre
                ? (guardados.length ? guardados.length + " " + plural(guardados.length, "movimento guardado", "movimentos guardados") : "Modo livre")
                : "Série " + serieNum + " de " + serieTotal}
              {sinal ? " · lendo " + nomeDoSinal(sinal) : ""}
            </div>
            {medidas && medidas.ritmo > 0 && (
              <div style={{ fontSize: 11, color: "var(--cinza2)", marginTop: 3 }}>
                ⏱ {String(medidas.ritmo).replace(".", ",")}s por repetição · {medidas.tut}s sob tensão
                {medidas.lados && medidas.lados.length === 2 &&
                  " · " + medidas.lados[0].total + " / " + medidas.lados[1].total +
                  (Math.abs(medidas.lados[0].total - medidas.lados[1].total) > 2 ? " ⚠ desigual" : "")}
              </div>
            )}
          </div>
          <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
            <button onClick={() => ajustar(-1)} aria-label="Tirar uma repetição"
              style={{ width: 38, height: 38, borderRadius: 10, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 17, cursor: "pointer" }}>−</button>
            <button onClick={() => ajustar(1)} aria-label="Somar uma repetição"
              style={{ width: 38, height: 38, borderRadius: 10, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 17, cursor: "pointer" }}>+</button>
          </div>
        </div>
        {livre ? (
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <button onClick={onFechar}
              style={{ flex: 1, background: "transparent", color: "var(--texto)",
                border: "1px solid var(--borda2)", borderRadius: 12, padding: "14px 10px",
                fontWeight: 800, fontSize: 14, cursor: "pointer" }}>
              Encerrar
            </button>
            <button onClick={guardarLivre} disabled={reps <= 0 || !movLivre}
              style={{ flex: 2.2, border: "none", borderRadius: 12, padding: "14px 10px",
                fontWeight: 900, fontSize: 15, color: "#FFFFFF",
                background: reps > 0 && movLivre ? "linear-gradient(45deg,#1FA463,#2FD48A)" : "var(--borda)",
                cursor: reps > 0 && movLivre ? "pointer" : "default" }}>
              ✓ Guardar {reps > 0 ? reps + " e ir para o próximo" : ""}
            </button>
          </div>
        ) : (
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <input type="number" inputMode="decimal" value={peso} placeholder="peso"
            aria-label="Peso em quilos desta série"
            onChange={(e) => setPeso(e.target.value)}
            style={{ ...S.inputMini, flex: 1 }} />
          <button
            onClick={() => onRegistrar(reps, peso)}
            disabled={reps <= 0}
            style={{ flex: 2.4, background: reps > 0 ? "linear-gradient(45deg,#1FA463,#2FD48A)" : "var(--borda)",
              color: "#FFFFFF", border: "none", borderRadius: 12, padding: "14px 10px",
              fontWeight: 900, fontSize: 15, cursor: reps > 0 ? "pointer" : "default" }}>
            ✓ Registrar {reps > 0 ? reps + (reps === 1 ? " rep" : " reps") : "série"}
          </button>
        </div>
        )}
      </div>
    </div>
  );
}

// ---------------- FIGURAS DO MOVIMENTO FUNCIONAL ----------------

// O boneco de duas poses: o CSS alterna a opacidade das duas e o movimento
// aparece. Sem requestAnimationFrame — numa aula o celular tem coisa melhor a
// fazer, e animação de CSS continua rodando com a tela em economia.
function Esqueleto({ p, cor }) {
  const L = (a, b) => <line key={a + b} x1={p[a][0]} y1={p[a][1]} x2={p[b][0]} y2={p[b][1]} />;
  return (
    <g stroke={cor} strokeWidth="7" strokeLinecap="round" fill="none">
      <circle cx={p.cab[0]} cy={p.cab[1]} r="11" fill={cor} stroke="none" />
      {L("om", "qua")}
      {L("om", "coE")}{L("coE", "puE")}
      {L("om", "coD")}{L("coD", "puD")}
      {L("qua", "joE")}{L("joE", "peE")}
      {L("qua", "joD")}{L("joD", "peD")}
    </g>
  );
}

function BonecoFuncional({ id, tamanho, cor }) {
  const poses = POSES_FUNCIONAIS[id];
  if (!poses) return null;
  const c = cor || "#7CFF3C";
  const alt = tamanho || 170;
  return (
    <svg viewBox="0 0 120 160" width={(alt * 120) / 160} height={alt} aria-hidden="true"
      style={{ display: "block", overflow: "visible" }}>
      <line x1="2" y1="152" x2="118" y2="152" stroke="rgba(255,255,255,0.18)" strokeWidth="3" strokeLinecap="round" />
      <g className="boneco-a"><Esqueleto p={poses[0]} cor={c} /></g>
      <g className="boneco-b"><Esqueleto p={poses[1]} cor={c} /></g>
    </svg>
  );
}

// ---------------- AULAS EM CIRCUITO ----------------
// Uma ficha diz o que fazer; uma aula conduz. A diferença é o relógio: aqui
// ninguém decide quando trocar de exercício — a voz avisa, a figura mostra e a
// pessoa só precisa se mexer. É o formato que faz treinar na sala de casa sem
// travar a cada dois minutos pensando no que vem agora.
// A aula roda dentro da tela funcional, mas a fala chega no componente raiz,
// quatro níveis acima. Um ponteiro só, trocado quando o player entra e sai, em
// vez de descer callbacks por toda a árvore — é o mesmo arranjo de TEMA_APP, e
// pelo mesmo motivo: existe no máximo uma aula por vez.
let CONTROLE_AULA = null;

const PREPARO_AULA = 10;
const AULAS = [
  { id: "express", nome: "Express", icone: "⏱", nivel: "Iniciante", voltas: 2, descanso: 20, entreVoltas: 45,
    desc: "Curtinha, sem salto nenhum alto. Boa para o primeiro dia.",
    blocos: [{ ex: "polichinelo", seg: 40 }, { ex: "agachamento-salto", seg: 30 }, { ex: "flexao", seg: 30 }, { ex: "escalador", seg: 30 }] },
  { id: "queima", nome: "Queima", icone: "🔥", nivel: "Intermediário", voltas: 3, descanso: 20, entreVoltas: 60,
    desc: "Três voltas puxadas. O burpee abre cada uma delas.",
    blocos: [{ ex: "burpee", seg: 30 }, { ex: "joelhos-altos", seg: 40 }, { ex: "agachamento-salto", seg: 30 }, { ex: "abdominal-remador", seg: 30 }] },
  { id: "luta", nome: "Luta", icone: "🥊", nivel: "Intermediário", voltas: 4, descanso: 10, entreVoltas: 30,
    desc: "Blocos curtos no ritmo do boxe: soco, chute e pernas.",
    blocos: [{ ex: "socos-ar", seg: 20 }, { ex: "chute-frontal", seg: 20 }, { ex: "joelhos-altos", seg: 20 }, { ex: "skater", seg: 20 }] },
  { id: "potencia", nome: "Potência", icone: "🚀", nivel: "Avançado", voltas: 3, descanso: 25, entreVoltas: 75,
    desc: "Salto com descanso de verdade entre as séries. Potência não se treina cansado.",
    blocos: [{ ex: "salto-vertical", seg: 20 }, { ex: "afundo-alternado", seg: 40 }, { ex: "skater", seg: 30 }, { ex: "agachamento-salto", seg: 30 }] },
  { id: "silencio", nome: "Sem barulho", icone: "🤫", nivel: "Iniciante", voltas: 3, descanso: 20, entreVoltas: 50,
    desc: "Nenhum salto: dá para fazer em apartamento, à noite, sem incomodar ninguém.",
    blocos: [{ ex: "flexao", seg: 30 }, { ex: "abdominal-remador", seg: 30 }, { ex: "escalador", seg: 40 }, { ex: "afundo-alternado", seg: 40 }] },
];

// O roteiro é a aula esticada no tempo: preparo, exercício, descanso, exercício...
// Deixar isso pronto antes de começar é o que permite dizer "depois: burpee"
// sem o player ter de adivinhar nada.
function montarRoteiro(a) {
  const r = [{ tipo: "prepara", seg: PREPARO_AULA, ex: a.blocos[0].ex, volta: 1 }];
  for (let v = 1; v <= a.voltas; v++) {
    a.blocos.forEach((b, k) => {
      r.push({ tipo: "exercicio", ex: b.ex, seg: b.seg, volta: v });
      const ultimo = k === a.blocos.length - 1;
      if (ultimo && v === a.voltas) return;
      r.push({
        tipo: "descanso", volta: v,
        seg: ultimo ? a.entreVoltas : a.descanso,
        ex: ultimo ? a.blocos[0].ex : a.blocos[k + 1].ex,
      });
    });
  }
  return r;
}
const duracaoAula = (a) => Math.round(montarRoteiro(a).reduce((s, p) => s + p.seg, 0) / 60);

// Frases do meio do bloco. Variam de propósito: ouvir "continue assim" pela
// décima vez na mesma aula faz a voz virar paisagem.
const FRASES_AULA = [
  "Segura o ritmo.", "Isso. Assim mesmo.", "Metade. Não para agora.",
  "Respira e continua.", "Tá indo bem.", "Aguenta mais um pouco.",
  "Capricha na forma.", "Força aí.",
];

function PlayerAula({ aula, exPorId, som, vozCfg, onSair, onConcluir }) {
  const roteiro = useMemo(() => montarRoteiro(aula), [aula]);
  const [i, setI] = useState(0);
  const [resta, setResta] = useState(roteiro[0].seg);
  const [pausado, setPausado] = useState(false);
  const inicioRef = useRef(Date.now());
  const feitosRef = useRef([]);
  const fraseRef = useRef(0);
  const passo = roteiro[i];
  const ex = passo && passo.ex ? exPorId(passo.ex) : null;
  const perfil = ex && ex.func ? MOV_FUNCIONAIS[ex.func] : null;

  const falar = (txt) => jarvisFalar(txt, {
    falar: true,
    vozNome: vozCfg && vozCfg.vozNome,
    velocidade: (vozCfg && vozCfg.velocidade) || 1.1,
    animado: vozCfg ? vozCfg.animado : true,
  });

  // Durante a aula as mãos estão ocupadas e o celular está longe: é exatamente
  // a situação em que a voz vale mais. O vocabulário fica aqui, junto de quem
  // sabe executar — o raiz só pergunta se há aula e repassa a frase.
  useEffect(() => {
    CONTROLE_AULA = {
      comando(f) {
        if (/\b(pausa|pausar|pausado|espera|calma|para a aula|parar a aula)\b/.test(f)) {
          setPausado(true);
          return { acao: "pausar", resposta: "Aula pausada." };
        }
        if (/\b(continua|continuar|retoma|retomar|voltei|segue|seguir|bora|vamos)\b/.test(f)) {
          setPausado(false);
          return { acao: "continuar", resposta: "Voltando." };
        }
        if (/\b(pula|pular|proximo|proxima|passa|passar)\b/.test(f)) {
          avancar();
          return { acao: "pular", resposta: "Pulando." };
        }
        if (/\b(quanto falta|falta quanto|quanto tempo|como estou|em que bloco)\b/.test(f)) {
          const nome = ex ? nomeFalado(ex.nome) : "";
          return {
            acao: "situacao",
            resposta: descanso
              ? "Descanso. " + resta + " segundos, e depois " + nome + "."
              : nome + ", " + resta + " segundos. Volta " + passo.volta + " de " + aula.voltas + ".",
          };
        }
        if (/\b(sair da aula|encerra a aula|encerrar a aula|acabou|chega|desisto|parar tudo)\b/.test(f)) {
          onSair();
          return { acao: "sair", resposta: "Aula encerrada." };
        }
        return null;
      },
    };
    return () => { CONTROLE_AULA = null; };
  });

  // A tela não pode apagar no meio da aula: o celular fica apoiado longe e
  // ninguém vai atravessar a sala para acordá-lo a cada bloco.
  useEffect(() => {
    ligarTravaTela();
    return () => {
      desligarTravaTela();
      try { window.speechSynthesis.cancel(); } catch (e) {}
    };
  }, []);

  // ---- anuncia cada bloco ----
  useEffect(() => {
    if (!passo) return;
    setResta(passo.seg);
    const nome = ex ? nomeFalado(ex.nome) : "";
    if (passo.tipo === "prepara") {
      falar("Aula " + aula.nome + ". Prepare-se. Começamos com " + nome + ".");
    } else if (passo.tipo === "exercicio") {
      if (som) beep(1200, 0.09, 0.16);
      falar(nome + ". " + passo.seg + " segundos. Vai!");
    } else {
      if (som) beep(680, 0.14, 0.13);
      falar("Descanso. Depois: " + nome + ".");
    }
  }, [i]);

  // ---- o relógio ----
  useEffect(() => {
    if (pausado || !passo) return;
    const t = setInterval(() => setResta((s) => (s <= 0 ? 0 : s - 1)), 1000);
    return () => clearInterval(t);
  }, [pausado, i]);

  const avancar = () => {
    if (!passo) return;
    if (passo.tipo === "exercicio") feitosRef.current.push({ ex: passo.ex, seg: passo.seg });
    if (i >= roteiro.length - 1) { terminar(); return; }
    setI(i + 1);
  };

  const terminar = () => {
    const porEx = {};
    feitosRef.current.forEach((b) => { (porEx[b.ex] = porEx[b.ex] || []).push({ segundos: b.seg }); });
    const itens = Object.keys(porEx).map((id) => ({ exercicioId: id, obs: "", series: porEx[id] }));
    if (!itens.length) { onSair(); return; }
    if (som) beep(1500, 0.3, 0.2);
    falar("Aula concluída. Mandou bem!");
    onConcluir({
      id: String(Date.now()),
      nome: "Aula: " + aula.nome,
      data: new Date().toISOString(),
      duracaoMin: Math.max(1, Math.min(300, Math.round((Date.now() - inicioRef.current) / 60000))),
      itens: itens,
    });
  };

  // ---- a contagem regressiva e o que ela dispara ----
  useEffect(() => {
    if (pausado || !passo) return;
    if (resta <= 0) { avancar(); return; }
    // Os três últimos segundos apitam: é o aviso que chega de costas para a tela.
    if (resta <= 3 && som) beep(resta === 1 ? 1500 : 900, 0.07, 0.12);
    if (passo.tipo !== "exercicio") return;
    if (resta === 10 && passo.seg >= 28) falar("Últimos dez.");
    else if (resta === Math.round(passo.seg / 2) && passo.seg >= 26) {
      falar(FRASES_AULA[fraseRef.current++ % FRASES_AULA.length]);
    }
  }, [resta]);

  if (!passo) return null;
  const descanso = passo.tipo === "descanso";
  const preparo = passo.tipo === "prepara";
  const pct = passo.seg > 0 ? (resta / passo.seg) * 100 : 0;
  const cor = descanso ? "#2FD48A" : preparo ? "#FFC107" : "#7CFF3C";
  const feitos = roteiro.slice(0, i).filter((p) => p.tipo === "exercicio").length;
  const totalBlocos = roteiro.filter((p) => p.tipo === "exercicio").length;

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 70, background: "#0A0A0A", color: "#FFFFFF",
      display: "flex", flexDirection: "column", paddingTop: "env(safe-area-inset-top)" }}>
      {/* cabeçalho: onde estou na aula */}
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 16px 6px" }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 15, fontWeight: 900, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {aula.icone} Aula {aula.nome}
          </div>
          <div style={{ fontSize: 11.5, color: "rgba(255,255,255,0.6)", marginTop: 2 }}>
            Volta {passo.volta} de {aula.voltas} · bloco {Math.min(feitos + 1, totalBlocos)} de {totalBlocos}
          </div>
        </div>
        <button onClick={onSair} aria-label="Sair da aula"
          style={{ width: 40, height: 40, borderRadius: 20, border: "none", background: "rgba(255,255,255,0.12)",
            color: "#FFFFFF", fontSize: 18, fontWeight: 900, cursor: "pointer" }}>✕</button>
      </div>

      {/* a barra de progresso da aula inteira, fininha */}
      <div style={{ height: 4, background: "rgba(255,255,255,0.12)", margin: "0 16px", borderRadius: 2 }}>
        <div style={{ height: "100%", width: (totalBlocos ? (feitos / totalBlocos) * 100 : 0) + "%",
          background: "#E1306C", borderRadius: 2, transition: "width .4s ease" }} />
      </div>

      {/* o miolo: a figura é o que responde "o que eu faço agora" */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center",
        justifyContent: "center", padding: "10px 18px", textAlign: "center", minHeight: 0 }}>
        {descanso ? (
          <React.Fragment>
            <div style={{ fontSize: 15, fontWeight: 900, color: "#2FD48A", letterSpacing: 1.5, textTransform: "uppercase" }}>Descanso</div>
            <div style={{ fontSize: 13, color: "rgba(255,255,255,0.65)", margin: "14px 0 10px" }}>Depois vem</div>
            <div style={{ opacity: 0.75 }}><BonecoFuncional id={ex && ex.func} tamanho={120} cor="#FFFFFF" /></div>
            <div style={{ fontSize: 19, fontWeight: 900, marginTop: 10 }}>{ex ? ex.nome : ""}</div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <BonecoFuncional id={ex && ex.func} tamanho={preparo ? 130 : 175} cor={cor} />
            <div style={{ fontSize: 22, fontWeight: 900, marginTop: 14, lineHeight: 1.2 }}>{ex ? ex.nome : ""}</div>
            {perfil && perfil.dica && (
              <div style={{ fontSize: 13, color: "rgba(255,255,255,0.62)", marginTop: 8, lineHeight: 1.5, maxWidth: 340 }}>
                {perfil.dica}
              </div>
            )}
            {preparo && <div style={{ fontSize: 13, color: "#FFC107", fontWeight: 800, marginTop: 12 }}>Prepare-se</div>}
          </React.Fragment>
        )}
      </div>

      {/* o relógio grande, legível do outro lado da sala */}
      <div style={{ padding: "0 18px" }}>
        <div style={{ fontSize: 76, fontWeight: 900, lineHeight: 1, textAlign: "center", color: cor,
          fontVariantNumeric: "tabular-nums" }}>{resta}</div>
        <div style={{ height: 8, background: "rgba(255,255,255,0.14)", borderRadius: 4, marginTop: 12, overflow: "hidden" }}>
          <div style={{ height: "100%", width: pct + "%", background: cor, borderRadius: 4, transition: "width .9s linear" }} />
        </div>
      </div>

      {/* pausar é obrigatório: toca o telefone, cai o halter, a vida acontece */}
      <div style={{ display: "flex", gap: 10, padding: "16px 18px", paddingBottom: "calc(18px + env(safe-area-inset-bottom))" }}>
        <button onClick={() => setI(Math.max(0, i - 1))} aria-label="Bloco anterior"
          style={{ width: 56, borderRadius: 14, border: "1px solid rgba(255,255,255,0.25)", background: "transparent",
            color: "#FFFFFF", fontSize: 17, cursor: "pointer" }}>⏮</button>
        <button onClick={() => setPausado((p) => !p)}
          style={{ flex: 1, borderRadius: 14, border: "none", padding: "16px 10px", fontWeight: 900, fontSize: 16,
            background: pausado ? "linear-gradient(45deg,#4CD137,#7CFF3C)" : "rgba(255,255,255,0.14)",
            color: pausado ? "#0A2A00" : "#FFFFFF", cursor: "pointer" }}>
          {pausado ? "▶ Continuar" : "⏸ Pausar"}
        </button>
        <button onClick={avancar} aria-label="Pular este bloco"
          style={{ width: 56, borderRadius: 14, border: "1px solid rgba(255,255,255,0.25)", background: "transparent",
            color: "#FFFFFF", fontSize: 17, cursor: "pointer" }}>⏭</button>
      </div>
    </div>
  );
}

// ---------------- TREINO FUNCIONAL ----------------
// Quantas repetições fazem sentido em cada movimento. Funcional não se mede em
// quilos: burpee de 10 é série dura, polichinelo de 10 é respirar fundo. Sem
// isto o app sugeriria 3×12 para tudo, que é errado nos dois sentidos.
const SUGESTAO_FUNCIONAL = {
  "polichinelo": { series: 3, reps: 30, descanso: 30 },
  "burpee": { series: 3, reps: 10, descanso: 75 },
  "agachamento-salto": { series: 3, reps: 12, descanso: 60 },
  "salto-vertical": { series: 4, reps: 6, descanso: 90 },
  "afundo-alternado": { series: 3, reps: 16, descanso: 60 },
  "joelhos-altos": { series: 3, reps: 30, descanso: 40 },
  "socos-ar": { series: 3, reps: 30, descanso: 40 },
  "chute-frontal": { series: 3, reps: 16, descanso: 45 },
  "skater": { series: 3, reps: 16, descanso: 45 },
  "abdominal-remador": { series: 3, reps: 15, descanso: 45 },
  "flexao": { series: 3, reps: 12, descanso: 60 },
  "escalador": { series: 3, reps: 20, descanso: 45 },
  "afundo": { series: 3, reps: 12, descanso: 60 },
  "afundo-reverso": { series: 3, reps: 12, descanso: 60 },
};

// Circuitos prontos. Escolher 4 exercícios numa lista de 14 é trabalho; tocar
// em "Aquecer" não é. O mesmo motivo pelo qual existe o assistente de fichas.
const CIRCUITOS = [
  { id: "aquecer", nome: "Aquecer", icone: "🔥", tempo: "5 min",
    desc: "Para antes do treino de musculação: sobe a frequência sem cansar.",
    ids: ["polichinelo", "joelhos-altos", "afundo-alternado"] },
  { id: "queima", nome: "Queima rápida", icone: "⚡", tempo: "12 min",
    desc: "Circuito curto e puxado, sem equipamento nenhum.",
    ids: ["burpee", "agachamento-salto", "escalador", "polichinelo"] },
  { id: "potencia", nome: "Potência", icone: "🚀", tempo: "15 min",
    desc: "Saltos com descanso de verdade entre as séries.",
    ids: ["salto-vertical", "agachamento-salto", "skater"] },
  { id: "luta", nome: "Luta", icone: "🥊", tempo: "10 min",
    desc: "Socos e chutes no ar, no ritmo do boxe.",
    ids: ["socos-ar", "chute-frontal", "joelhos-altos"] },
  { id: "corpo", nome: "Só o peso do corpo", icone: "🤸", tempo: "12 min",
    desc: "Dá para fazer na sala de casa, em silêncio.",
    ids: ["flexao", "abdominal-remador", "escalador", "afundo-alternado"] },
];

function TelaFuncional({ todos, exPorId, som, vozCfg, aulaInicial, onAulaAberta,
  vozAtiva, onLigarVoz, sessaoAtiva, onAlternarContagem, onComecar, onConcluirAula, onVoltar }) {
  const [aula, setAula] = useState(null);
  // Começar a aula é o gesto que o navegador exige para abrir o microfone — e
  // sem microfone não dá para dizer "pausa" com as mãos no chão.
  const abrirAula = (a) => {
    setAula(a);
    if (!vozAtiva && onLigarVoz) onLigarVoz();
  };
  useEffect(() => {
    if (!aulaInicial) return;
    abrirAula(aulaInicial);
    if (onAulaAberta) onAulaAberta();
  }, [aulaInicial]);
  const [sel, setSel] = useState([]);
  const [demo, setDemo] = useState(null);
  // Modo livre: sem escolher nada antes. Ele descobre o movimento, conta, e a
  // pessoa só diz "guardei" e parte para o próximo.
  const [livre, setLivre] = useState(false);
  const livreInicio = useRef(0);
  const feitosLivre = useRef([]);
  const lista = useMemo(() => todos.filter((e) => e.funcional), [todos]);
  const alternar = (id) => setSel((s) => (s.indexOf(id) >= 0 ? s.filter((x) => x !== id) : s.concat(id)));
  const total = sel.reduce((a, id) => {
    const s = SUGESTAO_FUNCIONAL[id] || { series: 3 };
    return a + s.series;
  }, 0);

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onVoltar}>‹ Voltar</button>

      <div style={{ ...S.card, borderColor: "#7CFF3C55" }}>
        <div style={{ ...S.label, color: "#7CFF3C" }}>◉ Jarvis Eyes Scan</div>
        <div style={{ fontSize: 18, fontWeight: 900, margin: "6px 0 8px" }}>

// ---------------- META DA SEMANA ----------------
function MetaSemanal({ historico, meta, setMeta }) {
  const feitos = volumeSemanal(historico, 1)[0].treinos;
  const pct = meta > 0 ? Math.min(100, (feitos / meta) * 100) : 0;
  const R = 34, C = 2 * Math.PI * R;
  const bateu = feitos >= meta;
  return (
    <div style={{ ...S.card, display: "flex", alignItems: "center", gap: 16 }}>
      <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true" style={{ flexShrink: 0 }}>
        <circle cx="42" cy="42" r={R} fill="none" stroke="var(--borda)" strokeWidth="9" />
        <circle cx="42" cy="42" r={R} fill="none" stroke={bateu ? "var(--ok)" : "#E1306C"} strokeWidth="9"
          strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C - (C * pct) / 100}
          transform="rotate(-90 42 42)" style={{ transition: "stroke-dashoffset .6s ease" }} />
        <text x="42" y="47" textAnchor="middle" fontSize="20" fontWeight="900" fill="var(--texto)">{feitos}</text>
      </svg>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={S.label}>Meta da semana</div>
        <div style={{ fontSize: 15, fontWeight: 800, margin: "4px 0 2px" }}>
          {bateu ? "Meta batida! 🎉" : feitos + " de " + meta + " " + plural(meta, "treino", "treinos")}
        </div>
        <div style={{ fontSize: 12, color: "var(--cinza)" }}>
          {bateu
            ? "Tudo que vier agora é lucro."
            : "Faltam " + (meta - feitos) + " " + plural(meta - feitos, "treino", "treinos") + " até domingo."}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10 }}>
          <button onClick={() => setMeta(Math.max(1, meta - 1))} aria-label="Diminuir a meta semanal"
            style={{ width: 32, height: 32, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 17, cursor: "pointer" }}>−</button>
          <span style={{ fontSize: 12, color: "var(--cinza)" }}>meta: <b style={{ color: "var(--texto)" }}>{meta}x</b> por semana</span>
          <button onClick={() => setMeta(Math.min(14, meta + 1))} aria-label="Aumentar a meta semanal"
            style={{ width: 32, height: 32, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 17, cursor: "pointer" }}>+</button>
        </div>
      </div>
    </div>
  );
}

// ---------------- LEMBRETE DE TREINO ----------------
function CartaoLembrete({ lembrete, setLembrete, avisar }) {
  const suportaNotificacao = typeof Notification !== "undefined";
  const [permissao, setPermissao] = useState(suportaNotificacao ? Notification.permission : "unsupported");

  const ligar = async () => {
    if (!suportaNotificacao) {
      avisar("Este navegador não permite avisos. O lembrete vai aparecer dentro do app quando você abrir.");
      setLembrete({ ...lembrete, ativo: true });
      return;
    }
    let p = Notification.permission;
    if (p === "default") p = await Notification.requestPermission();
    setPermissao(p);
    if (p !== "granted") {
      avisar("Você não autorizou os avisos. Para receber lembretes, libere as notificações do Treino Livre nas configurações do navegador.");
      return;
    }
    setLembrete({ ...lembrete, ativo: true });
    registrarEvento("lembrete-ativado");
  };

  const alternarDia = (n) => {
    const dias = lembrete.dias.includes(n) ? lembrete.dias.filter((d) => d !== n) : [...lembrete.dias, n].sort();
    setLembrete({ ...lembrete, dias });
  };

  return (
    <div style={S.card}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <div style={{ minWidth: 0 }}>
          <div style={S.label}>🔔 Lembrete de treino</div>
          <div style={{ fontSize: 13, color: "var(--cinza)", marginTop: 4, lineHeight: 1.5 }}>
            {lembrete.ativo ? "Ligado para " + lembrete.hora : "Um empurrão nos dias que você escolher."}
          </div>
        </div>
        <button onClick={() => (lembrete.ativo ? setLembrete({ ...lembrete, ativo: false }) : ligar())}
          aria-pressed={lembrete.ativo} aria-label={lembrete.ativo ? "Desligar o lembrete" : "Ligar o lembrete"}
          style={{
            width: 54, height: 30, borderRadius: 15, flexShrink: 0, cursor: "pointer", position: "relative",
            border: "1px solid " + (lembrete.ativo ? "#E1306C" : "var(--borda2)"),
            background: lembrete.ativo ? GRAD : "var(--input)", transition: "background .2s",
          }}>
          <span aria-hidden="true" style={{
            position: "absolute", top: 3, left: lembrete.ativo ? 27 : 3, width: 22, height: 22,
            borderRadius: "50%", background: "#FFFFFF", transition: "left .2s", boxShadow: "0 1px 3px rgba(0,0,0,.3)",
          }} />
        </button>
      </div>

      {lembrete.ativo && (
        <React.Fragment>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 14 }}>
            <span style={{ fontSize: 13, color: "var(--cinza)" }}>Horário</span>
            <input type="time" value={lembrete.hora} aria-label="Horário do lembrete"
              onChange={(e) => setLembrete({ ...lembrete, hora: e.target.value || "18:00" })}
              style={{ ...S.input, width: "auto", flex: "0 0 auto", padding: "9px 12px", fontWeight: 800 }} />
          </div>
          <div style={{ ...S.label, fontSize: 10, margin: "14px 0 8px" }}>Dias</div>
          <div style={{ display: "flex", gap: 6 }}>
            {DIAS_SEMANA.map((d) => {
              const on = lembrete.dias.includes(d.n);
              return (
                <button key={d.n} onClick={() => alternarDia(d.n)} aria-pressed={on}

                  style={{

            {permissao === "granted"

// ---------------- SÉRIES DA SEMANA POR GRUPO ----------------
// O app já sabia quantas séries de cada grupo você fez. Faltava dizer se isso
// é pouco ou suficiente — é o que transforma o dado em orientação.
const FAIXA_SERIES = { min: 10, max: 20 };
function seriesSemanaisPorGrupo(historico, exPorId) {
  const inicio = segundaDaSemana(new Date()).getTime();
  const acc = {};
  historico.forEach((h) => {
    if (new Date(h.data).getTime() < inicio) return;
    (h.itens || []).forEach((it) => {
      const e = exPorId(it.exercicioId);
      if (!e || e.cardio) return;
      // aquecimento não conta como série de trabalho
      const n = (it.series || []).filter(serieConta).length;
      acc[e.grupo] = (acc[e.grupo] || 0) + n;
    });
  });
  return GRUPOS.map((g) => ({ id: g.id, nome: g.nome, series: acc[g.id] || 0 }))
    .sort((a, b) => b.series - a.series);
}

function VolumeRecomendado({ historico, exPorId }) {
  const lista = seriesSemanaisPorGrupo(historico, exPorId);
  const teto = Math.max(FAIXA_SERIES.max + 4, ...lista.map((x) => x.series));
  const situacao = (n) => {
    if (n === 0) return { txt: "não treinou", cor: "var(--cinza2)" };
    if (n < FAIXA_SERIES.min) return { txt: "abaixo da faixa", cor: "var(--obs)" };
    if (n <= FAIXA_SERIES.max) return { txt: "na faixa", cor: "var(--ok)" };
    return { txt: "acima da faixa", cor: "var(--perigo)" };
  };
  return (
    <div style={S.card}>
      <div style={S.label}>Séries desta semana por grupo</div>
      <div style={{ fontSize: 12, color: "var(--cinza)", margin: "6px 0 14px", lineHeight: 1.5 }}>
        A faixa de <b>{FAIXA_SERIES.min} a {FAIXA_SERIES.max} séries por semana</b> é a referência mais citada
        para ganho de massa. É um guia, não uma regra: o que importa é a tendência ao longo das semanas.
      </div>
      {lista.map((g) => {
        const s = situacao(g.series);
        const cor = corGrupo(GRUPOS.find((x) => x.id === g.id));
        return (
          <div key={g.id} style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 5 }}>
              <span style={{ fontWeight: 700 }}>{g.nome}</span>
              <span style={{ color: s.cor, fontWeight: 700 }}>{g.series} {plural(g.series, "série", "séries")} · {s.txt}</span>
            </div>
            {/* a faixa recomendada aparece como uma zona clara atrás da barra */}
            <div style={{ position: "relative", height: 10, borderRadius: 5, background: "var(--borda)", overflow: "hidden" }}>
              <div aria-hidden="true" style={{
                position: "absolute", top: 0, bottom: 0,
                left: (FAIXA_SERIES.min / teto) * 100 + "%",
                width: ((FAIXA_SERIES.max - FAIXA_SERIES.min) / teto) * 100 + "%",
                background: "var(--ok)", opacity: 0.22,
              }} />
              <div style={{ position: "relative", height: "100%", width: Math.min(100, (g.series / teto) * 100) + "%", background: cor, borderRadius: 5 }} />
            </div>
          </div>
        );
      })}
      <div style={{ fontSize: 11, color: "var(--cinza2)", marginTop: 4, lineHeight: 1.5 }}>
        A zona verde clara marca a faixa recomendada. Séries de aquecimento não entram na conta.
      </div>
    </div>
  );
}

// ---------------- CONQUISTAS POR CATEGORIA ----------------
function PainelConquistas({ est, onStory }) {
  const [aberto, setAberto] = useState(false);
  const ganhas = CONQUISTAS.filter((c) => c.cond(est));

    <div style={{ ...S.card, borderColor: "#ED495644" }}>

// ---------------- FAIXA COMPACTA DE PROGRESSO ----------------
// A tela inicial tinha 14 cartões e virou uma parede. O progresso detalhado
// mudou para Histórico > Números; aqui fica só o resumo, que leva até lá.
function FaixaProgresso({ est, historico, meta, onAbrirProgresso }) {
  const n = nivelDe(est);
  const feitos = volumeSemanal(historico, 1)[0].treinos;
  const bateu = feitos >= meta;
  const R = 22, C = 2 * Math.PI * R;
  const pct = meta > 0 ? Math.min(100, (feitos / meta) * 100) : 0;
  return (
    <button type="button" onClick={onAbrirProgresso}
      aria-label={"Ver seu progresso. Nível " + n.indice + ", " + n.nome + ". " + feitos + " de " + meta + " treinos nesta semana."}
      style={{ ...S.card, width: "100%", textAlign: "left", font: "inherit", color: "var(--texto)", cursor: "pointer", display: "flex", alignItems: "center", gap: 14 }}>
      <span aria-hidden="true" style={{ fontSize: 30, lineHeight: 1, flexShrink: 0 }}>{n.icone}</span>
      <span style={{ flex: 1, minWidth: 0 }}>
        <span style={{ display: "block", ...S.label }}>Nível {n.indice}</span>
        <span style={{ display: "block", fontSize: 16, fontWeight: 900, marginTop: 2 }}>{n.nome}</span>
        <span style={{ display: "block", height: 6, background: "var(--borda)", borderRadius: 3, marginTop: 8, overflow: "hidden" }}>
          <span style={{ display: "block", height: "100%", width: Math.max(3, n.pct) + "%", background: GRAD_LINHA, borderRadius: 3 }} />
        </span>
        <span style={{ display: "block", fontSize: 11, color: "var(--cinza)", marginTop: 6 }}>
          🔥 {est.streak} {plural(est.streak, "dia", "dias")} · ver progresso ›
        </span>
      </span>
      <svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true" style={{ flexShrink: 0 }}>
        <circle cx="27" cy="27" r={R} fill="none" stroke="var(--borda)" strokeWidth="6" />
        <circle cx="27" cy="27" r={R} fill="none" stroke={bateu ? "var(--ok)" : "#E1306C"} strokeWidth="6"
          strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C - (C * pct) / 100}
          transform="rotate(-90 27 27)" />
        <text x="27" y="32" textAnchor="middle" fontSize="16" fontWeight="900" fill="var(--texto)">{feitos}</text>
      </svg>
    </button>
  );
}

          <div style={{ ...S.label, color: "#ED4956" }}>⚠ Faça um backup</div>

          <button style={S.btn} onClick={onBaixarBackup}>⬇ Baixar backup agora</button>

      {/* O Chrome oferece a instalação num diálogo; o iPhone NUNCA oferece. Por isso

          diálogo, ele ensina o caminho à mão. Era a maior parte do "não consegui
          instalar". */}

          <div style={S.label}>📲 Instalar na tela inicial</div>

      {!historico.length && (
        <BemVindo onAssistente={onAssistente} onFuncional={onFuncional} onEscolaVoz={onEscolaVoz} />

// ---------------- PRIMEIRO CONTATO ----------------

// ---------------- AJUSTES ----------------
// Tudo que é configuração saiu da tela inicial e veio para cá, atrás da engrenagem.
// Escolher a voz importa mais do que parece: a voz padrão do Android lê
// "80 quilos por 10" de um jeito robótico, e a natural soa como alguém falando
// com você. Tocar num nome já faz a voz se apresentar — ninguém escolhe no escuro.
function SeletorVoz({ voz, setVoz }) {
  const [vozes, setVozes] = useState(() => vozesPtBr());
  useEffect(() => {
    if (!VOZ_FALA) return;
    const atualizar = () => setVozes(vozesPtBr().slice());
    atualizar();
    // A lista chega vazia na primeira chamada e o evento nem sempre dispara
    const t1 = setTimeout(atualizar, 300);
    const t2 = setTimeout(atualizar, 1200);
    try { window.speechSynthesis.addEventListener("voiceschanged", atualizar); } catch (e) {}
    return () => {
      clearTimeout(t1); clearTimeout(t2);
      try { window.speechSynthesis.removeEventListener("voiceschanged", atualizar); } catch (e) {}
    };
  }, []);

  const provar = (cfg) => jarvisFalar(cfg.animado !== false
    ? "Boa! Anotei supino reto, 80 quilos por 10. Descanso de um minuto e meio."
    : "Anotei: supino reto, 80 quilos por 10. Descanso de um minuto e meio.", cfg);
  const escolher = (nome) => {
    const nova = { ...voz, vozNome: nome };
    setVoz(nova);
    provar(nova);
  };
  const VELOCIDADES = [[0.9, "Devagar"], [1.1, "Normal"], [1.3, "Rápido"]];

  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ ...S.label, marginBottom: 8 }}>Voz do Jarvis</div>
      {vozes.length === 0 ? (
        <div style={{ fontSize: 12, color: "var(--cinza2)", lineHeight: 1.5 }}>
          Este aparelho só tem a voz padrão do sistema. No Android, dá para instalar outras
          em Configurações › Idioma › Saída de texto para voz.
        </div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
          {[{ name: null, rotulo: "Padrão" }].concat(vozes.map((v) => ({ name: v.name, rotulo: nomeCurtoVoz(v) })))
            .map((o) => {
              const on = (voz.vozNome || null) === o.name;
              return (
                <button key={o.name || "padrao"} onClick={() => escolher(o.name)} aria-pressed={on}
                  aria-label={"Usar a voz " + o.rotulo + " e ouvir uma amostra"}
                  style={{ border: "1px solid " + (on ? "#E1306C" : "var(--borda2)"),
                    background: on ? "#E1306C22" : "transparent",
                    color: on ? "#E1306C" : "var(--texto)",
                    borderRadius: 20, padding: "8px 13px", fontWeight: 800, fontSize: 12.5, cursor: "pointer" }}>
                  {on ? "🔊 " : ""}{o.rotulo}
                </button>
              );
            })}
        </div>
      )}
      <div style={{ fontSize: 11, color: "var(--cinza2)", marginTop: 8, lineHeight: 1.5 }}>
        Toque num nome para ouvir como ele confirma uma série.
      </div>

      <div style={{ ...S.label, margin: "14px 0 8px" }}>Velocidade da fala</div>
      <div style={{ display: "flex", gap: 7 }}>
        {VELOCIDADES.map((vv) => {
          const on = Math.abs((voz.velocidade || 1.1) - vv[0]) < 0.05;
          return (
            <button key={vv[0]} aria-pressed={on}
              onClick={() => { const nova = { ...voz, velocidade: vv[0] }; setVoz(nova); provar(nova); }}
              style={{ flex: 1, border: "1px solid " + (on ? "#E1306C" : "var(--borda2)"),
                background: on ? "#E1306C22" : "transparent",
                color: on ? "#E1306C" : "var(--texto)",
                borderRadius: 12, padding: "10px 8px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
              {vv[1]}
            </button>
          );
        })}
      </div>
    </div>
  );
}

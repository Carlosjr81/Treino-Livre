  { id: "encolhimento-halteres", grupo: "ombros", nome: "Encolhimento com halteres", en: "Shrugs, Dumbbells", equip: "Halteres", musc: { p: ["trapezio"], s: ["antebraco"] }, passos: ["Segure um halter em cada mão ao lado do corpo.","Eleve os ombros em direção às orelhas.","Desça devagar até alongar o trapézio."], dica: "Com halteres ao lado do corpo a amplitude é maior que com a barra à frente." },
  { id: "arranco-halter", grupo: "ombros", nome: "Arranco com halter (snatch)", en: "dumbbell snatch", equip: "Halter", musc: { p: ["ombros"], s: ["trapezio","gluteos","posteriores","abdomen"] }, passos: ["Com o halter entre as pernas, empurre o quadril para trás e segure o peso.","Estenda quadril e joelhos com força puxando o halter rente ao corpo.","Receba o peso acima da cabeça com o braço estendido."], dica: "Movimento de potência: prefira carga moderada e séries curtas, priorizando a técnica." },
  { id: "giro-anilha", grupo: "ombros", nome: "Giro de anilha (bus driver)", en: "Bus Drivers", equip: "Anilha", musc: { p: ["ombros"], s: ["antebraco"] }, passos: ["Segure uma anilha com as duas mãos, braços estendidos à frente na altura dos ombros.","Gire a anilha como um volante, levando uma mão para cima e outra para baixo.","Volte ao centro e gire para o outro lado."], dica: "Anilha leve já basta: o desafio é manter os braços estendidos durante toda a série." },
  { id: "face-pull-elastico", grupo: "ombros", nome: "Face pull com elástico", en: "Face pulls with yellow/green band", equip: "Elástico", musc: { p: ["ombros"], s: ["trapezio"] }, passos: ["Prenda o elástico na altura do rosto e segure uma ponta em cada mão.","Puxe em direção ao rosto abrindo os cotovelos para os lados.","Retorne devagar controlando o elástico."], dica: "Perfeito para aquecer o ombro antes do treino de peito ou como exercício em casa." },
  { id: "rosca-barra-w", grupo: "biceps", nome: "Rosca com barra W", en: "Biceps Curls With SZ-bar", equip: "Barra W", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Segure a barra W nas pegadas anguladas, braços estendidos.","Flexione os cotovelos levando a barra até os ombros.","Desça controlado até estender."], dica: "A angulação da barra W alivia o punho de quem sente desconforto na barra reta." },
  { id: "rosca-alternada-sentado", grupo: "biceps", nome: "Rosca alternada sentado", en: "Alternating Biceps Curls With Dumbbell", equip: "Halteres e banco", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Sente no banco com um halter em cada mão ao lado do corpo.","Suba um braço girando a palma para cima durante a subida.","Desça devagar e repita com o outro braço."], dica: "Sentado fica impossível dar impulso com o corpo: o bíceps trabalha sozinho." },
  { id: "rosca-martelo-alternada", grupo: "biceps", nome: "Rosca martelo alternada", en: "Alternating dumbbell hammer curl", equip: "Halteres", musc: { p: ["biceps","antebraco"], s: [] }, passos: ["Segure os halteres com as palmas viradas uma para a outra.","Flexione um cotovelo mantendo a pegada neutra.","Desça devagar e alterne o braço."], dica: "Pegada neutra ativa o braquial, o músculo que empurra o bíceps para cima e engrossa o braço." },
  { id: "rosca-martelo-polia", grupo: "biceps", nome: "Rosca martelo na polia", en: "Hammercurls on Cable", equip: "Polia baixa com corda", musc: { p: ["biceps","antebraco"], s: [] }, passos: ["Segure a corda da polia baixa com pegada neutra.","Flexione os cotovelos até a contração máxima.","Desça resistindo à tração do cabo."], dica: "A corda permite abrir as mãos no topo e apertar ainda mais o antebraço." },
  { id: "rosca-polia-barra-reta", grupo: "biceps", nome: "Rosca na polia com barra reta", en: "Straight Bar Cable Curls", equip: "Polia baixa com barra", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Segure a barra da polia baixa com pegada supinada, na largura dos ombros.","Flexione os cotovelos até a barra chegar perto do peito.","Desça controlado sem deixar os cotovelos irem à frente."], dica: "Tensão constante do começo ao fim: o cabo não alivia em nenhum ponto da amplitude." },
  { id: "rosca-concentrada-polia", grupo: "biceps", nome: "Rosca concentrada na polia", en: "Cable Concentration Curl", equip: "Polia baixa", musc: { p: ["biceps"], s: [] }, passos: ["Sente ao lado da polia baixa e apoie o cotovelo na parte interna da coxa.","Flexione o braço até a contração máxima.","Estenda devagar resistindo ao cabo."], dica: "Junta o isolamento da rosca concentrada com a tensão contínua da polia." },
  { id: "rosca-trx", grupo: "biceps", nome: "Rosca na fita de suspensão", en: "Biceps with TRX", equip: "Fitas de suspensão", musc: { p: ["biceps"], s: ["abdomen"] }, passos: ["Segure as alças com as palmas para cima e incline o corpo para trás.","Flexione os cotovelos trazendo as mãos até a testa.","Estenda os braços devagar voltando à inclinação inicial."], dica: "Ajuste a dificuldade andando com os pés: mais deitado, mais pesado." },
  { id: "rosca-punho-barra", grupo: "biceps", nome: "Rosca de punho com barra", en: "Barbell Wrist Curl", equip: "Barra e banco", musc: { p: ["antebraco"], s: [] }, passos: ["Sente e apoie os antebraços nas coxas com as palmas para cima e os punhos livres.","Flexione os punhos elevando a barra.","Desça deixando a barra rolar até os dedos."], dica: "Antebraço forte melhora a pegada em todos os exercícios de puxar." },
  { id: "rosca-punho-invertida", grupo: "biceps", nome: "Rosca de punho invertida", en: "Forearm Curls (underhand grip)", equip: "Barra ou halteres", musc: { p: ["antebraco"], s: [] }, passos: ["Apoie os antebraços nas coxas com as palmas viradas para baixo.","Eleve o dorso das mãos flexionando os punhos para cima.","Desça devagar até alongar."], dica: "Trabalha a parte de cima do antebraço, que a rosca de punho comum não alcança." },
  { id: "rosca-aberta", grupo: "biceps", nome: "Rosca com pegada aberta", en: "Dumbbell wide bicep curls", equip: "Halteres", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Segure os halteres com os braços afastados do corpo e as palmas para cima.","Flexione os cotovelos mantendo os braços abertos.","Desça controlado até estender."], dica: "A pegada aberta joga o estímulo para a cabeça curta do bíceps." },
  { id: "rosca-desenvolvimento", grupo: "biceps", nome: "Rosca com desenvolvimento", en: "Dumbbell bicep curl to press", equip: "Halteres", musc: { p: ["biceps","ombros"], s: ["triceps"] }, passos: ["Faça uma rosca completa até os halteres chegarem aos ombros.","Gire as palmas para frente e empurre acima da cabeça.","Desça pelo mesmo caminho até os braços estendidos."], dica: "Dois exercícios numa repetição só: bom para treinos curtos e para casa." },
  { id: "triceps-frances-barra", grupo: "triceps", nome: "Tríceps francês com barra", en: "Barbell Triceps Extension", equip: "Barra e banco", musc: { p: ["triceps"], s: [] }, passos: ["Sente e segure a barra acima da cabeça com os braços estendidos.","Desça a barra atrás da cabeça flexionando só os cotovelos.","Estenda de volta até o topo."], dica: "A posição acima da cabeça alonga a cabeça longa do tríceps, que o pushdown não pega." },
  { id: "triceps-polia-extensao", grupo: "triceps", nome: "Extensão de tríceps na polia", en: "Triceps Extensions on Cable", equip: "Polia alta", musc: { p: ["triceps"], s: [] }, passos: ["Segure a barra da polia alta com os cotovelos colados ao tronco.","Estenda os braços empurrando para baixo até a extensão total.","Volte até ~90° sem mover os cotovelos."], dica: "Segure meio segundo embaixo, com o braço estendido: é o pico da contração." },
  { id: "triceps-polia-cruzado", grupo: "triceps", nome: "Tríceps cruzado na polia alta", en: "High-Cable Cross Tricep Extention - NB", equip: "Polia dupla alta", musc: { p: ["triceps"], s: [] }, passos: ["De pé entre as polias altas, segure a manopla oposta com cada mão.","Estenda os braços para os lados e para baixo, cruzando à frente do corpo.","Retorne devagar sem baixar os cotovelos."], dica: "O cruzamento coloca o tríceps em um ângulo diferente do pushdown tradicional." },
  { id: "triceps-chao", grupo: "triceps", nome: "Mergulho no chão (floor dips)", en: "Floor dips", equip: "Peso corporal", musc: { p: ["triceps"], s: ["peito","ombros"] }, passos: ["Sente no chão com as mãos apoiadas atrás do quadril e joelhos dobrados.","Eleve o quadril e desça flexionando os cotovelos para trás.","Empurre o chão até estender os braços."], dica: "Versão sem equipamento nenhum: dá para fazer em casa ou no meio do treino." },
  { id: "abdominal-com-peso", grupo: "abdomen", nome: "Abdominal com peso", en: "Weighted Crunch", equip: "Anilha ou halter", musc: { p: ["abdomen"], s: [] }, passos: ["Deite com os joelhos dobrados segurando uma anilha sobre o peito.","Eleve o tronco tirando as escápulas do chão.","Desça controlado sem relaxar no final."], dica: "Abdômen também responde a carga: com peso dá para trabalhar na faixa de 10 a 15 repetições." },
  { id: "abdominal-inclinado", grupo: "abdomen", nome: "Abdominal no banco inclinado", en: "Incline Crunches", equip: "Banco inclinado", musc: { p: ["abdomen"], s: ["obliquos"] }, passos: ["Deite no banco inclinado com os pés presos no apoio.","Enrole a coluna elevando o tronco em direção aos joelhos.","Desça devagar mantendo a tensão."], dica: "Quanto maior a inclinação, mais difícil fica: comece num ângulo confortável." },
  { id: "abdominal-negativo", grupo: "abdomen", nome: "Abdominal negativo", en: "Negative Crunches", equip: "Peso corporal", musc: { p: ["abdomen"], s: [] }, passos: ["Sente com os joelhos dobrados e os braços à frente.","Desça o tronco para trás bem devagar, contando até quatro.","Volte à posição sentada e repita."], dica: "A fase de descida é onde mora o estímulo: quanto mais lento, mais difícil." },
  { id: "abdominal-lateral", grupo: "abdomen", nome: "Abdominal lateral no chão", en: "Side Crunch", equip: "Peso corporal", musc: { p: ["obliquos"], s: ["abdomen"] }, passos: ["Deite de lado com os joelhos dobrados e a mão atrás da cabeça.","Eleve o tronco lateralmente contraindo o oblíquo.","Desça devagar e complete a série antes de trocar o lado."], dica: "Amplitude curta, contração forte: o oblíquo não precisa de movimento grande." },
  { id: "flexao-lateral-halter", grupo: "abdomen", nome: "Flexão lateral com halter", en: "Dumbbell Side Bend", equip: "Halter", musc: { p: ["obliquos"], s: ["lombar"] }, passos: ["Em pé, segure um halter em uma das mãos ao lado do corpo.","Incline o tronco para o lado do peso, descendo o halter pela perna.","Volte contraindo o oblíquo do lado oposto."], dica: "Segure o peso em um lado só: com halteres nos dois, um anula o outro." },
  { id: "elevacao-joelhos-barra", grupo: "abdomen", nome: "Elevação de joelhos na barra fixa", en: "Leg raises pull up bar", equip: "Barra fixa", musc: { p: ["abdomen"], s: ["obliquos","antebraco"] }, passos: ["Pendure-se na barra fixa com os braços estendidos.","Eleve os joelhos em direção ao peito enrolando o quadril.","Desça devagar sem balançar o corpo."], dica: "Se o corpo balançar, você está usando impulso: desça mais devagar e reduza a amplitude." },
  { id: "elevacao-pernas-declinado", grupo: "abdomen", nome: "Elevação de pernas no banco declinado", en: "Decline Bench Leg Raise", equip: "Banco declinado", musc: { p: ["abdomen"], s: ["obliquos"] }, passos: ["Deite no banco declinado segurando o apoio atrás da cabeça.","Eleve as pernas estendidas até o quadril sair do banco.","Desça devagar sem tocar o banco com os pés."], dica: "A inclinação aumenta bastante a dificuldade em relação à elevação no chão." },
  { id: "hollow-hold", grupo: "abdomen", nome: "Hollow hold (barquinho)", en: "Hollow Hold", tempo: true, equip: "Peso corporal", musc: { p: ["abdomen"], s: ["obliquos","quadriceps"] }, passos: ["Deite de barriga para cima com braços estendidos atrás da cabeça.","Eleve pernas e ombros do chão formando uma banana com o corpo.","Segure a posição com a lombar colada ao chão."], dica: "Se a lombar descolar do chão, aproxime as pernas do corpo até ela voltar a encostar." },
  { id: "prancha-toque-ombro", grupo: "abdomen", nome: "Prancha com toque no ombro", en: "Plank Shoulder Taps", equip: "Peso corporal", musc: { p: ["abdomen"], s: ["obliquos","ombros"] }, passos: ["Fique em prancha alta com os pés afastados na largura do quadril.","Toque o ombro oposto com uma das mãos sem girar o quadril.","Apoie de volta e alterne os lados."], dica: "O objetivo é o quadril não balançar: se rodar, afaste mais os pés." },
  { id: "pallof-press", grupo: "abdomen", nome: "Pallof press (antirrotação)", en: "Pallof Press", equip: "Polia ou elástico", musc: { p: ["obliquos","abdomen"], s: ["ombros"] }, passos: ["De lado para a polia, segure a manopla com as duas mãos junto ao peito.","Estenda os braços à frente resistindo à força que puxa você para o lado.","Volte as mãos ao peito sem deixar o tronco girar."], dica: "Aqui o abdômen trabalha impedindo o movimento: quanto mais parado o tronco, melhor." },
  { id: "abdominal-canivete-sentado", grupo: "abdomen", nome: "Canivete sentado", en: "Seated Knee Tuck", equip: "Banco", musc: { p: ["abdomen"], s: ["obliquos","quadriceps"] }, passos: ["Sente na ponta do banco segurando as bordas, tronco inclinado para trás.","Traga os joelhos em direção ao peito enrolando o quadril.","Estenda as pernas à frente sem tocar o chão."], dica: "Estenda as pernas o máximo possível para aumentar a dificuldade." },
  { id: "giro-medicine-ball", grupo: "abdomen", nome: "Giro com medicine ball", en: "Medicine ball twist", equip: "Medicine ball", musc: { p: ["obliquos"], s: ["abdomen"] }, passos: ["Sente com o tronco inclinado para trás e os pés elevados.","Segure a bola e gire o tronco levando-a de um lado ao outro.","Mantenha o abdômen contraído durante todo o movimento."], dica: "Gire o tronco inteiro, não só os braços: os ombros precisam acompanhar a bola." },
  { id: "abdominal-roda-barra", grupo: "abdomen", nome: "Rollout com barra", en: "Barbell Ab Rollout", equip: "Barra com anilhas", musc: { p: ["abdomen"], s: ["obliquos","lombar","ombros"] }, passos: ["Ajoelhe segurando a barra no chão à frente dos joelhos.","Role a barra à frente estendendo o corpo sem deixar o quadril cair.","Volte contraindo o abdômen."], dica: "Vá só até onde consegue voltar sem arquear a lombar: amplitude aumenta com o tempo." },
  { id: "passaro-cachorro", grupo: "abdomen", nome: "Prancha alternada (bird dog)", en: "Bird Dog", equip: "Peso corporal", musc: { p: ["abdomen","lombar"], s: ["gluteos","ombros"] }, passos: ["Fique em quatro apoios com as mãos sob os ombros.","Estenda um braço à frente e a perna oposta para trás.","Volte ao apoio e alterne os lados."], dica: "Segure 2 segundos com o corpo estável: é mais eficaz que fazer rápido." },
  { id: "rotacao-tronco", grupo: "abdomen", nome: "Rotação de tronco na polia", en: "Torso Twist", equip: "Polia", musc: { p: ["obliquos"], s: ["abdomen"] }, passos: ["De lado para a polia, segure a manopla com as duas mãos e braços estendidos.","Gire o tronco para o lado oposto levando as mãos junto.","Volte controlado sem deixar o cabo puxar você."], dica: "O giro vem do tronco e do quadril juntos, com os braços apenas acompanhando." },
  { id: "ponte-gluteo", grupo: "gluteos", nome: "Ponte de glúteo no chão", en: "Glute Bridge", equip: "Peso corporal", musc: { p: ["gluteos"], s: ["posteriores","lombar"] }, passos: ["Deite de barriga para cima com joelhos dobrados e pés no chão.","Eleve o quadril até o corpo formar uma linha reta dos joelhos aos ombros.","Contraia o glúteo no topo e desça devagar."], dica: "Empurre com os calcanhares: com a ponta do pé quem trabalha é a coxa." },
  { id: "elevacao-pelvica-halter", grupo: "gluteos", nome: "Elevação pélvica com halter", en: "Dumbbell Hip Thrust", equip: "Halter e banco", musc: { p: ["gluteos"], s: ["posteriores","abdomen"] }, passos: ["Apoie as costas no banco com um halter sobre o quadril.","Eleve o quadril até o tronco ficar paralelo ao chão.","Desça controlado sem encostar o glúteo no chão."], dica: "Versão prática para quando a barra de hip thrust está ocupada." },
  { id: "coice-ajoelhado", grupo: "gluteos", nome: "Coice ajoelhado", en: "Kneeling kickbacks", equip: "Peso corporal ou caneleira", musc: { p: ["gluteos"], s: ["posteriores"] }, passos: ["Fique em quatro apoios com o joelho flexionado a 90°.","Eleve a perna empurrando o calcanhar em direção ao teto.","Desça sem apoiar o joelho no chão."], dica: "Não arqueie a lombar para subir mais: o movimento é curto e vem do quadril." },
  { id: "coice-halter", grupo: "gluteos", nome: "Coice com halter no joelho", en: "Dumbbell donkey kick", equip: "Halter", musc: { p: ["gluteos"], s: ["posteriores"] }, passos: ["Em quatro apoios, encaixe um halter na dobra do joelho.","Eleve a perna mantendo o joelho dobrado e o halter preso.","Desça controlado sem soltar o peso."], dica: "Contraia o glúteo por 1 segundo no topo de cada repetição." },
  { id: "coice-elastico", grupo: "gluteos", nome: "Coice com elástico", en: "rubber band glute kickback", equip: "Elástico", musc: { p: ["gluteos"], s: ["posteriores"] }, passos: ["Prenda o elástico no tornozelo e no ponto fixo à frente.","Estenda a perna para trás contra a resistência.","Volte devagar sem deixar o elástico puxar você."], dica: "Exercício de casa: o elástico dá tensão crescente, mais forte no fim do movimento." },
  { id: "extensao-gluteo-polia", grupo: "gluteos", nome: "Extensão de quadril na polia", en: "Cable glute extension", equip: "Polia baixa com caneleira", musc: { p: ["gluteos"], s: ["posteriores"] }, passos: ["De frente para a polia, prenda a caneleira no tornozelo e segure o apoio.","Estenda a perna para trás contraindo o glúteo.","Volte controlado sem apoiar o pé no chão."], dica: "Tronco firme e lombar neutra: só a perna se move." },
  { id: "terra-romeno-halteres", grupo: "gluteos", nome: "Peso morto romeno com halteres", en: "Dumbbell Romanian Deadlift", equip: "Halteres", musc: { p: ["gluteos","posteriores"], s: ["lombar"] }, passos: ["Em pé, segure um halter em cada mão à frente das coxas.","Empurre o quadril para trás descendo os halteres pelas pernas.","Suba contraindo glúteos e posteriores."], dica: "Os halteres passam rente às pernas: se afastarem do corpo, a lombar sofre." },
  { id: "terra-sumo-halter", grupo: "gluteos", nome: "Levantamento terra sumô com halter", en: "Dumbbell sumo deadlift", equip: "Halter ou kettlebell", musc: { p: ["gluteos","adutores"], s: ["quadriceps","lombar"] }, passos: ["Pés bem afastados com as pontas para fora e o halter entre as pernas.","Desça o quadril mantendo o tronco ereto e segure o peso.","Suba estendendo quadril e joelhos, apertando os glúteos."], dica: "Empurre os joelhos para fora durante toda a subida." },
  { id: "press-gluteo-unilateral", grupo: "gluteos", nome: "Press de glúteo unilateral", en: "Single-leg side glute press", equip: "Máquina", musc: { p: ["gluteos"], s: ["posteriores","quadriceps"] }, passos: ["Posicione um pé na plataforma da máquina, com o outro livre.","Empurre a plataforma estendendo o quadril e o joelho.","Volte controlado até sentir o glúteo alongar."], dica: "Uma perna por vez corrige diferenças de força entre os lados." },
  // Aparelhos de academia grande: linhas articuladas (Hammer Strength, Panatta,
  // Cybex, Life Fitness). O wger quase não tem figura de máquina articulada: só
  // cinco casaram com o mesmo movimento; os outros ficam com o botão de vídeo.
  { id: "supino-articulado", grupo: "peito", nome: "Supino reto articulado (iso-lateral)", en: "Iso-Lateral Bench Press", equip: "Máquina articulada", musc: { p: ["peito"], s: ["triceps", "ombros"] }, passos: ["Ajuste o banco para as pegadas ficarem na linha do meio do peito.", "Empurre os braços da máquina até quase estender os cotovelos.", "Volte devagar até sentir o peito alongar, sem tirar as escápulas do banco."], dica: "Cada braço tem sua alavanca: dá para fazer unilateral e achar a diferença entre os lados." },
  { id: "supino-inclinado-articulado", grupo: "peito", nome: "Supino inclinado articulado", en: "Iso-Lateral Incline Press", equip: "Máquina articulada", musc: { p: ["peito"], s: ["ombros", "triceps"] }, passos: ["Sente com as costas apoiadas e as pegadas na altura da parte de cima do peito.", "Empurre para cima e à frente seguindo o arco da máquina.", "Desça controlado até as mãos chegarem perto dos ombros."], dica: "O arco da alavanca já converge: não force as mãos a se juntarem no topo." },
  { id: "supino-super-inclinado", grupo: "peito", nome: "Supino super inclinado articulado", en: "Iso-Lateral Super Incline Press", equip: "Máquina articulada", musc: { p: ["peito", "ombros"], s: ["triceps"] }, passos: ["Sente quase na vertical, pegadas na altura da clavícula.", "Empurre para cima até os cotovelos quase estenderem.", "Desça devagar mantendo o peito aberto."], dica: "É o meio-termo entre supino inclinado e desenvolvimento: ótimo para a parte de cima do peito." },
  { id: "supino-amplo-articulado", grupo: "peito", nome: "Supino aberto articulado (wide chest)", en: "Iso-Lateral Wide Chest", equip: "Máquina articulada", musc: { p: ["peito"], s: ["ombros", "triceps"] }, passos: ["Sente com as pegadas mais abertas que os ombros.", "Empurre à frente sentindo o peito contrair.", "Volte devagar até um bom alongamento do peitoral."], dica: "A pegada aberta tira trabalho do tríceps e põe no peito." },
  { id: "supino-convergente", grupo: "peito", nome: "Supino sentado convergente", en: "Converging Chest Press", equip: "Máquina", musc: { p: ["peito"], s: ["triceps", "ombros"] }, passos: ["Ajuste o banco para as pegadas ficarem na altura do meio do peito.", "Empurre à frente: as alavancas se aproximam no fim do movimento.", "Volte devagar sem deixar as placas baterem."], dica: "A convergência imita o supino com halteres, com a segurança da máquina." },
  { id: "crucifixo-articulado", grupo: "peito", nome: "Crucifixo articulado (chest fly de anilhas)", en: "Plate Loaded Chest Fly", equip: "Máquina articulada", musc: { p: ["peito"], s: ["ombros"] }, passos: ["Sente com os cotovelos levemente dobrados e apoiados nas almofadas ou pegadas.", "Feche os braços à frente do peito num abraço largo.", "Abra devagar até sentir o peito alongar."], dica: "Pense em levar os cotovelos um ao outro, não as mãos." },
  { id: "puxada-articulada", grupo: "costas", nome: "Puxada frontal articulada", en: "Iso-Lateral Front Lat Pulldown", equip: "Máquina articulada", musc: { p: ["dorsal"], s: ["biceps", "trapezio"] }, passos: ["Sente com as coxas presas sob o apoio e segure as pegadas no alto.", "Puxe os cotovelos para baixo e para trás, levando o peito à frente.", "Suba devagar até os braços quase estenderem."], dica: "Unilateral funciona muito bem aqui: um braço por vez dá mais amplitude." },
  { id: "remada-baixa-articulada", grupo: "costas", nome: "Remada baixa articulada", en: "Iso-Lateral Low Row", equip: "Máquina articulada", musc: { p: ["dorsal"], s: ["biceps", "trapezio", "lombar"] }, passos: ["Sente com o peito no apoio e segure as pegadas baixas.", "Puxe os cotovelos para trás, rente ao corpo, até as mãos chegarem ao quadril.", "Volte devagar deixando as escápulas se abrirem."], dica: "Puxar na direção do quadril trabalha mais o grande dorsal." },
  { id: "remada-alta-articulada", grupo: "costas", nome: "Remada alta articulada (high row)", en: "Iso-Lateral High Row", equip: "Máquina articulada", musc: { p: ["dorsal"], s: ["trapezio", "biceps", "ombros"] }, passos: ["Sente com o peito no apoio e as pegadas acima da cabeça, à frente.", "Puxe para baixo e para trás num arco até as mãos chegarem perto dos ombros.", "Volte devagar até os braços estenderem."], dica: "É o meio do caminho entre puxada e remada: pega a parte de cima das costas." },
  { id: "remada-dy", grupo: "costas", nome: "Remada D.Y. articulada (Dorian Yates)", en: "Iso-Lateral D.Y. Row", equip: "Máquina articulada", musc: { p: ["dorsal"], s: ["biceps", "trapezio"] }, passos: ["Fique com o peito no apoio e segure as pegadas em pronação.", "Puxe os cotovelos para trás e para baixo, na direção do quadril.", "Volte devagar até sentir as costas alongarem."], dica: "Imita a remada curvada com pegada supinada do Dorian Yates, sem carga na lombar." },
  { id: "remada-cavalinho-apoiada", grupo: "costas", nome: "Remada cavalinho com peito apoiado", en: "Chest Supported T-Bar Row", equip: "Máquina", musc: { p: ["dorsal"], s: ["trapezio", "biceps", "ombros"] }, passos: ["Deite de bruços no apoio inclinado e segure as pegadas.", "Puxe a carga até os cotovelos passarem a linha do tronco.", "Desça devagar até os braços estenderem."], dica: "O peito apoiado tira a lombar da jogada: dá para focar só nas costas." },
  { id: "remada-meadows", grupo: "costas", nome: "Remada Meadows (landmine unilateral)", en: "Meadows Row", equip: "Barra no landmine", musc: { p: ["dorsal"], s: ["trapezio", "biceps", "ombros"] }, passos: ["Fique de lado para a ponta da barra, tronco inclinado e mão no apoio do joelho.", "Puxe a ponta da barra com uma mão, levando o cotovelo para cima e para trás.", "Desça devagar até alongar bem as costas."], dica: "Pegue na própria barra, logo atrás das anilhas, em pronação." },
  { id: "pullover-maquina", grupo: "costas", nome: "Pullover na máquina", en: "Pullover Machine", equip: "Máquina", musc: { p: ["dorsal"], s: ["peito", "triceps"] }, passos: ["Sente com os cotovelos apoiados nas almofadas, braços acima da cabeça.", "Leve os cotovelos para baixo num arco até a barra chegar à barriga.", "Volte devagar até sentir o dorsal alongar."], dica: "Trabalha o dorsal sem o bíceps limitar: bom para pré-exaustão antes das puxadas." },
  { id: "remada-seal", grupo: "costas", nome: "Remada no banco alto (seal row)", en: "Seal Row", equip: "Barra ou halteres e banco alto", musc: { p: ["dorsal"], s: ["trapezio", "biceps", "ombros"] }, passos: ["Deite de bruços num banco alto, braços pendurados com a carga.", "Puxe a carga até o banco, levando os cotovelos para trás.", "Desça devagar até os braços estenderem."], dica: "Sem impulso possível: é a remada mais honesta que existe." },
  { id: "agachamento-pendulo", grupo: "pernas", nome: "Agachamento pêndulo", en: "Pendulum Squat", equip: "Máquina", musc: { p: ["quadriceps"], s: ["gluteos", "adutores"] }, passos: ["Encaixe os ombros nas almofadas e os pés no meio da plataforma.", "Desça devagar seguindo o arco da máquina até os joelhos passarem bem dos 90°.", "Suba empurrando pelo meio do pé, sem travar os joelhos."], dica: "O arco mantém o tronco em pé: é o agachamento que mais isola o quadríceps." },
  { id: "agachamento-cinto", grupo: "pernas", nome: "Agachamento com cinto (belt squat)", en: "Belt Squat", equip: "Máquina", musc: { p: ["quadriceps", "gluteos"], s: ["adutores", "posteriores"] }, passos: ["Prenda o cinto no quadril e suba na plataforma com os pés na largura dos ombros.", "Desça com o tronco em pé até as coxas ficarem paralelas ou abaixo.", "Suba empurrando o chão, quadril e joelhos juntos."], dica: "A carga vai direto no quadril: agachamento pesado sem carregar a coluna." },
  { id: "agachamento-v-squat", grupo: "pernas", nome: "Agachamento V-squat", en: "V-Squat", equip: "Máquina", musc: { p: ["quadriceps"], s: ["gluteos"] }, passos: ["Encaixe os ombros nas almofadas, de frente para a máquina, pés na plataforma.", "Desça devagar até as coxas passarem da paralela.", "Suba sem travar os joelhos no topo."], dica: "Pés mais à frente puxam para o glúteo; mais atrás, para o quadríceps." },
  { id: "hack-reverso", grupo: "pernas", nome: "Hack invertido (de frente para a máquina)", en: "Reverse Hack Squat", equip: "Máquina hack", musc: { p: ["gluteos", "quadriceps"], s: ["posteriores"] }, passos: ["Fique de frente para o encosto do hack, peito apoiado e ombros sob as almofadas.", "Desça levando o quadril para trás até as coxas ficarem paralelas.", "Suba empurrando pelos calcanhares."], dica: "Virar de frente leva o trabalho para glúteo e posteriores." },
  { id: "leg-press-horizontal", grupo: "pernas", nome: "Leg press horizontal (sentado)", en: "Seated Leg Press", equip: "Máquina", musc: { p: ["quadriceps"], s: ["gluteos", "posteriores"] }, passos: ["Sente com as costas apoiadas e os pés no meio da plataforma.", "Empurre até as pernas quase estenderem, sem travar os joelhos.", "Volte devagar até os joelhos chegarem perto do peito."], dica: "Bom para quem sente a lombar no leg 45°: a lombar fica mais protegida." },
  { id: "leg-press-articulado", grupo: "pernas", nome: "Leg press articulado (unilateral)", en: "Iso-Lateral Leg Press", equip: "Máquina articulada", musc: { p: ["quadriceps"], s: ["gluteos", "posteriores"] }, passos: ["Sente com cada pé em uma plataforma independente.", "Empurre com as duas pernas ou com uma de cada vez.", "Volte devagar sem deixar o quadril sair do banco."], dica: "Uma perna por vez revela a mais fraca, que a outra costuma esconder." },
  { id: "extensora-unilateral", grupo: "pernas", nome: "Cadeira extensora unilateral (articulada)", en: "Iso-Lateral Leg Extension", equip: "Máquina articulada", musc: { p: ["quadriceps"], s: [] }, passos: ["Sente com o joelho alinhado ao eixo da máquina e o rolo sobre o tornozelo.", "Estenda uma perna até ficar reta, segurando um segundo no topo.", "Desça devagar e troque de perna."], dica: "Comece pela perna mais fraca e faça o mesmo número com a outra." },
  { id: "agachamento-sissy", grupo: "pernas", nome: "Agachamento sissy (no banco sissy)", en: "Sissy Squat", equip: "Banco sissy ou peso corporal", musc: { p: ["quadriceps"], s: ["abdomen"] }, passos: ["Prenda os tornozelos no apoio e fique em pé com o corpo reto.", "Incline para trás dobrando só os joelhos, joelhos à frente.", "Volte à posição em pé contraindo as coxas."], dica: "Desça só até onde o joelho aguenta sem dor; amplitude vem com o tempo." },
  { id: "panturrilha-horizontal", grupo: "pernas", nome: "Panturrilha horizontal na máquina", en: "Horizontal Calf Raise", equip: "Máquina", musc: { p: ["panturrilha"], s: [] }, passos: ["Sente com as costas apoiadas e a ponta dos pés na plataforma.", "Empurre com a ponta dos pés o mais longe que conseguir.", "Volte devagar até alongar bem a panturrilha."], dica: "Segure um segundo no alongamento: é ali que a panturrilha mais cresce." },
  { id: "panturrilha-burrinho", grupo: "pernas", nome: "Panturrilha burrinho (donkey)", en: "Donkey Calf Raise", equip: "Máquina", musc: { p: ["panturrilha"], s: [] }, passos: ["Incline o tronco à frente com o quadril sob a almofada e a ponta dos pés no degrau.", "Suba nas pontas dos pés o mais alto possível.", "Desça devagar até alongar bem."], dica: "Com o quadril dobrado, o músculo trabalha mais alongado que na panturrilha em pé." },
  { id: "terra-hexagonal", grupo: "pernas", nome: "Levantamento terra com barra hexagonal", en: "Trap Bar Deadlift", equip: "Barra hexagonal", musc: { p: ["quadriceps", "gluteos"], s: ["posteriores", "lombar", "trapezio"] }, passos: ["Entre no meio da barra e segure as pegadas laterais.", "Com o peito alto, empurre o chão e suba estendendo quadril e joelhos juntos.", "Desça controlado, mantendo as costas neutras."], dica: "A carga fica na linha do corpo: é o terra mais fácil de aprender sem machucar a lombar." },
  { id: "flexao-nordica", grupo: "pernas", nome: "Flexão nórdica (nordic curl)", en: "Nordic Hamstring Curl", equip: "Peso corporal ou apoio para os pés", musc: { p: ["posteriores"], s: ["gluteos"] }, passos: ["Ajoelhe com os tornozelos presos e o corpo reto do joelho à cabeça.", "Incline à frente o mais devagar que conseguir, resistindo com os posteriores.", "Apoie as mãos no chão no fim e volte empurrando de leve."], dica: "Um dos melhores exercícios para prevenir lesão de posterior de coxa." },
  { id: "glute-ham", grupo: "pernas", nome: "Elevação glúteo-posterior (GHD)", en: "Glute Ham Raise", equip: "Banco GHD", musc: { p: ["posteriores", "gluteos"], s: ["lombar", "panturrilha"] }, passos: ["Prenda os pés no apoio com os joelhos logo atrás da almofada.", "Desça o tronco até ficar paralelo ao chão.", "Suba dobrando os joelhos e contraindo glúteos e posteriores."], dica: "Combina extensão de quadril e flexão de joelho: trabalha o posterior inteiro." },
  { id: "elevacao-pelvica-maquina", grupo: "gluteos", nome: "Elevação pélvica na máquina (hip thrust)", en: "Hip Thrust Machine", equip: "Máquina", musc: { p: ["gluteos"], s: ["posteriores"] }, passos: ["Apoie as costas no encosto e prenda o cinto ou a almofada sobre o quadril.", "Suba o quadril até o tronco ficar alinhado com as coxas.", "Segure um segundo contraindo o glúteo e desça devagar."], dica: "Sem barra para equilibrar: dá para focar só em contrair o glúteo." },
  { id: "elevacao-pelvica-em-pe", grupo: "gluteos", nome: "Elevação pélvica em pé na máquina", en: "Standing Hip Thrust", equip: "Máquina", musc: { p: ["gluteos"], s: ["posteriores"] }, passos: ["Fique em pé com o quadril encostado na almofada e o tronco inclinado à frente.", "Leve o quadril à frente até ficar em pé, contraindo o glúteo.", "Volte devagar inclinando o tronco."], dica: "Sem deitar nem montar barra: a elevação pélvica que se faz em segundos." },
  { id: "gluteo-maquina", grupo: "gluteos", nome: "Glúteo na máquina (coice)", en: "Glute Kickback Machine", equip: "Máquina", musc: { p: ["gluteos"], s: ["posteriores"] }, passos: ["Apoie o peito e os braços na máquina e encaixe um pé na plataforma.", "Empurre a perna para trás e para cima até o quadril estender.", "Volte devagar sem deixar a carga bater."], dica: "Não arqueie a lombar no fim: o movimento termina quando o quadril estende." },
  { id: "multi-hip-abducao", grupo: "gluteos", nome: "Abdução em pé na máquina (multi-hip)", en: "Standing Hip Abduction Machine", equip: "Máquina", musc: { p: ["gluteos"], s: [] }, passos: ["Fique em pé de lado para a máquina com o rolo do lado de fora da coxa.", "Afaste a perna para o lado sem inclinar o tronco.", "Volte devagar e troque de lado."], dica: "Segure no apoio e mantenha o quadril parado: só a perna se mexe." },
  { id: "desenvolvimento-articulado", grupo: "ombros", nome: "Desenvolvimento articulado (iso-lateral)", en: "Iso-Lateral Shoulder Press", equip: "Máquina articulada", musc: { p: ["ombros"], s: ["triceps", "trapezio"] }, passos: ["Sente com as costas apoiadas e as pegadas na altura dos ombros.", "Empurre para cima até os cotovelos quase estenderem.", "Desça devagar até as mãos voltarem à altura do queixo."], dica: "Um braço por vez ajuda a nivelar a força entre os lados." },
  { id: "encolhimento-maquina", grupo: "ombros", nome: "Encolhimento na máquina", en: "Plate Loaded Shrug", equip: "Máquina articulada", musc: { p: ["trapezio"], s: ["antebraco"] }, passos: ["Fique entre as pegadas com os ombros sob as almofadas ou braços estendidos.", "Suba os ombros em direção às orelhas.", "Segure um segundo e desça devagar."], dica: "Não gire os ombros: só sobe e desce." },
  { id: "desenvolvimento-landmine", grupo: "ombros", nome: "Desenvolvimento no landmine (unilateral)", en: "Landmine Press", equip: "Barra no landmine", musc: { p: ["ombros"], s: ["peito", "triceps", "abdomen"] }, passos: ["Segure a ponta da barra na altura do ombro, em pé ou ajoelhado.", "Empurre para cima e à frente até o braço estender.", "Desça devagar até a ponta voltar ao ombro."], dica: "O arco da barra poupa o ombro de quem sente dor no desenvolvimento comum." },
  { id: "elevacao-y-polia", grupo: "ombros", nome: "Elevação em Y na polia", en: "Cable Y Raise", equip: "Polia dupla baixa", musc: { p: ["ombros"], s: ["trapezio"] }, passos: ["Segure os cabos cruzados à frente do quadril, vindos das polias baixas.", "Suba os braços abertos em Y até um pouco acima da cabeça.", "Desça devagar até cruzar de novo."], dica: "Carga leve: o deltoide lateral e o trapézio inferior trabalham sem o trapézio de cima roubar." },
  { id: "rosca-maquina", grupo: "biceps", nome: "Rosca na máquina", en: "Biceps Curl Machine", equip: "Máquina", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Sente com os braços apoiados e os cotovelos alinhados ao eixo da máquina.", "Flexione os cotovelos até as mãos chegarem perto dos ombros.", "Desça devagar até quase estender os braços."], dica: "O eixo alinhado ao cotovelo mantém a tensão no bíceps o movimento inteiro." },
  { id: "rosca-bayesian", grupo: "biceps", nome: "Rosca Bayesian na polia (atrás do corpo)", en: "Bayesian Cable Curl", equip: "Polia baixa", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["De costas para a polia baixa, dê um passo à frente segurando o cabo com o braço atrás do corpo.", "Flexione o cotovelo sem deixar ele ir para a frente.", "Volte devagar até o braço estender atrás do corpo."], dica: "O braço atrás do corpo alonga o bíceps: carga leve e amplitude total." },
  { id: "triceps-maquina", grupo: "triceps", nome: "Tríceps na máquina (extensão sentado)", en: "Triceps Extension Machine", equip: "Máquina", musc: { p: ["triceps"], s: [] }, passos: ["Sente com os braços apoiados e os cotovelos alinhados ao eixo da máquina.", "Estenda os cotovelos até os braços ficarem retos.", "Volte devagar até os antebraços passarem da linha de 90°."], dica: "Mantenha os cotovelos parados no apoio: só o antebraço se mexe." },
  { id: "mergulho-maquina", grupo: "triceps", nome: "Mergulho na máquina (dip sentado)", en: "Seated Dip Machine", equip: "Máquina", musc: { p: ["triceps"], s: ["peito", "ombros"] }, passos: ["Sente e segure as pegadas ao lado do corpo, cotovelos dobrados.", "Empurre para baixo até os braços estenderem.", "Volte devagar até os cotovelos passarem de 90°."], dica: "Tronco ereto foca o tríceps; inclinado à frente puxa o peito." },
  { id: "abdominal-maquina", grupo: "abdomen", nome: "Abdominal na máquina", en: "Ab Crunch Machine", equip: "Máquina", musc: { p: ["abdomen"], s: ["obliquos"] }, passos: ["Sente, prenda os pés e segure as pegadas ou apoie o peito na almofada.", "Enrole o tronco à frente contraindo o abdômen.", "Volte devagar sem deixar a carga bater."], dica: "Expire ao descer o tronco: o abdômen contrai mais." },
  { id: "rotacao-tronco-maquina", grupo: "abdomen", nome: "Rotação de tronco na máquina", en: "Rotary Torso Machine", equip: "Máquina", musc: { p: ["obliquos"], s: ["abdomen"] }, passos: ["Sente com as pernas presas e o peito contra a almofada.", "Gire o tronco para um lado de forma controlada.", "Volte ao centro devagar e faça o outro lado."], dica: "Carga leve e movimento lento: rotação com impulso é pedir dor na lombar." },
  // Esteira: a série é de tempo, como a da prancha, com velocidade e inclinação
  // a mais. "cardio" diz se a conta de gasto é de caminhada ou de corrida, e
  // "padrao" é o que entra na ficha antes de existir histórico.
  { id: "esteira-caminhada", grupo: "pernas", nome: "Caminhada na esteira", en: "Treadmill Walking", tempo: true, cardio: "caminhada", padrao: { min: 30, vel: 5.5, incl: 1 }, equip: "Esteira", musc: { p: ["quadriceps", "panturrilha"], s: ["gluteos", "posteriores"] }, passos: ["Suba com a esteira parada e segure nas laterais só para começar.", "Aumente a velocidade aos poucos até um passo firme, em que ainda dá para conversar.", "Solte as mãos e caminhe com o tronco ereto, pisando com o calcanhar e rolando até a ponta do pé."], dica: "Segurar no painel tira peso das pernas e derruba o gasto pela metade: mãos livres." },
  { id: "esteira-inclinada", grupo: "pernas", nome: "Caminhada inclinada na esteira", en: "Incline Treadmill Walking", tempo: true, cardio: "caminhada", padrao: { min: 20, vel: 5, incl: 10 }, equip: "Esteira", musc: { p: ["gluteos", "panturrilha"], s: ["quadriceps", "posteriores"] }, passos: ["Comece plano por 2 minutos para aquecer.", "Suba a inclinação aos poucos até 8% a 15%, mantendo uma velocidade de caminhada.", "Passos curtos, tronco levemente à frente e sem se pendurar no painel."], dica: "Gasta perto de uma corrida leve com bem menos impacto nos joelhos." },
  { id: "esteira-corrida", grupo: "pernas", nome: "Corrida na esteira", en: "Treadmill Running", tempo: true, cardio: "corrida", padrao: { min: 20, vel: 9, incl: 1 }, equip: "Esteira", musc: { p: ["quadriceps", "panturrilha"], s: ["gluteos", "posteriores", "abdomen"] }, passos: ["Aqueça caminhando de 3 a 5 minutos.", "Suba a velocidade até o ritmo de corrida, com passadas curtas e o pé caindo embaixo do corpo.", "Nos últimos minutos, desça a velocidade para voltar à calma antes de parar."], dica: "Deixe 1% de inclinação: compensa a falta de vento e deixa o esforço igual ao da rua." },
  { id: "polichinelo", grupo: "pernas", nome: "Polichinelo (jumping jack)", en: "Jumping Jacks", equip: "Peso corporal", func: "polichinelo", funcional: true, musc: { p: ["quadriceps", "panturrilha"], s: ["ombros", "abdomen"] }, passos: ["Em pé, pés juntos e braços ao lado do corpo.", "Salte abrindo as pernas na linha dos ombros e levando os braços acima da cabeça.", "Salte de volta à posição inicial em ritmo constante."], dica: "É o aquecimento mais simples que existe: dois minutos já sobem a frequência cardíaca." },
  { id: "burpee", grupo: "pernas", nome: "Burpee", en: "Burpees", equip: "Peso corporal", func: "burpee", funcional: true, musc: { p: ["quadriceps", "gluteos"], s: ["peito", "ombros", "abdomen"] }, passos: ["Agache e apoie as mãos no chão.", "Jogue os pés para trás até a posição de prancha e desça o peito.", "Volte os pés para junto das mãos e suba num salto com os braços estendidos."], dica: "O exercício mais completo e mais odiado do funcional. Dez bem feitos valem mais que trinta arrastados." },
  { id: "agachamento-salto", grupo: "pernas", nome: "Agachamento com salto (jump squat)", en: "Jump Squats", equip: "Peso corporal", func: "agachamento-salto", funcional: true, musc: { p: ["quadriceps", "gluteos"], s: ["panturrilha", "abdomen"] }, passos: ["Agache até a coxa ficar paralela ao chão.", "Suba explodindo e saia do chão.", "Aterrisse amortecendo com os joelhos e já desça para a repetição seguinte."], dica: "A aterrissagem é a parte que protege o joelho: caia com o pé inteiro e dobre." },
  { id: "salto-vertical", grupo: "pernas", nome: "Salto vertical", en: "Vertical Jump", equip: "Peso corporal", func: "salto-vertical", funcional: true, musc: { p: ["quadriceps", "panturrilha"], s: ["gluteos"] }, passos: ["Em pé, flexione levemente os joelhos levando os braços para trás.", "Salte o mais alto que conseguir estendendo o corpo todo.", "Aterrisse amortecendo e repita."], dica: "Mede potência, não resistência: séries curtas, de 5 a 8 saltos, com descanso de verdade." },
  { id: "afundo-alternado", grupo: "pernas", nome: "Afundo alternado (lunge alternado)", en: "Alternating Lunges", equip: "Peso corporal ou halteres", func: "afundo-alternado", funcional: true, musc: { p: ["quadriceps", "gluteos"], s: ["posteriores", "abdomen"] }, passos: ["Dê um passo longo à frente com uma perna.", "Desça até o joelho de trás quase tocar o chão, tronco ereto.", "Empurre com a perna da frente para voltar e repita trocando de lado."], dica: "Cada passada conta uma repetição: o scanner soma os dois lados." },
  { id: "joelhos-altos", grupo: "pernas", nome: "Joelhos altos (high knees)", en: "High Knees", equip: "Peso corporal", func: "joelhos-altos", funcional: true, musc: { p: ["quadriceps", "panturrilha"], s: ["abdomen"] }, passos: ["Corra parado elevando os joelhos até a altura do quadril.", "Mantenha o tronco ereto e o abdômen firme.", "Pisada leve, na ponta do pé, em ritmo rápido."], dica: "É corrida parada: conte por tempo (30 a 45 segundos) tanto quanto por repetição." },

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ---------------- ARMAZENAMENTO ----------------
const memoria = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return memoria[k] != null ? memoria[k] : null; } },
  // **Falhar em silêncio aqui apaga treinos.** Quando o localStorage recusa a
  // escrita — cota cheia, janela anônima, armazenamento bloqueado, navegador
  // embutido — o app guardava na memória e seguia se comportando como se tivesse
  // salvado: marcava a série, mostrava o histórico, comemorava o recorde. A
  // pessoa só descobria ao reabrir, com tudo perdido e sem nunca ter visto um
  // aviso. Num app em que os dados vivem só no aparelho, isso é o pior que pode
  // acontecer — então a falha agora é devolvida e vira um aviso que não some.
  set(k, v) {
    try { localStorage.setItem(k, v); return true; }
    catch (e) { memoria[k] = v; return false; }
  },
};
const STORAGE_KEY = "treinolivre:v1";
const LINK_APP = "https://carlosjr81.github.io/Treino-Livre/";
// Quem fez. Fica numa constante porque aparece em cinco lugares, e um @ errado
// num story já publicado não tem como ser corrigido.
const INSTAGRAM = "carlos.jr.81";
const LINK_INSTAGRAM = "https://instagram.com/" + INSTAGRAM;
// Qual versão está rodando neste aparelho. Aparece nos ajustes e no
// diagnóstico do Jarvis — sem isso não há como saber, olhando um relato, se o
// defeito ainda existe ou se o conserto só não chegou. Já custou caro uma vez.
// SOBE A CADA PUBLICAÇÃO, junto com o versao.json e o cache do sw.js.
const VERSAO_APP = "2026-10-14e";
// Navegadores embutidos (Instagram, Facebook, WhatsApp etc.) costumam apagar os dados salvos
// Rodando como app instalado: nao faz sentido oferecer instalacao a quem ja
// instalou, e e o unico jeito de saber, porque nao existe API de "esta instalado".
const JA_INSTALADO = (() => {
  try {
    return window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;
  } catch (e) { return false; }
})();
const NAVEGADOR_INAPP = /Instagram|FBAN|FBAV|FB_IAB|Line\/|; wv\)/i.test(navigator.userAgent || "");

// Base64 de texto UTF-8. Substitui escape/unescape (obsoletos) mantendo
// exatamente o mesmo formato dos links já compartilhados por aí.
function b64Codificar(texto) {
  const bytes = new TextEncoder().encode(texto);
  let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64Decodificar(b64) {
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

// Identificador estável por item de lista. Sem ele o React usa a posição como
// chave e, ao remover um exercício do meio, os campos de peso/reps sobem uma linha.
let seqUid = 0;
const novoUid = () => "u" + Date.now().toString(36) + (seqUid++).toString(36);

// Registra eventos anônimos de uso (apenas contagem, sem dados pessoais)
function registrarEvento(nome) {
  try {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ path: nome, title: nome, event: true });
    }
  } catch (e) {}
}

// ---------------- FOTOS DE PROGRESSO ----------------
// Foto não cabe no localStorage (o limite é de poucos MB e é compartilhado com
// todo o resto), então as imagens moram no IndexedDB. No registro principal fica
// só a lista de datas, que é leve.
const BANCO_FOTOS = "treinolivre-fotos";
const LOJA_FOTOS = "fotos";
function abrirBancoFotos() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error("sem indexedDB")); return; }
    const req = indexedDB.open(BANCO_FOTOS, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(LOJA_FOTOS)) db.createObjectStore(LOJA_FOTOS);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error || new Error("falhou ao abrir"));
  });
}
async function comLojaFotos(modo, fn) {
  const db = await abrirBancoFotos();
  return new Promise((res, rej) => {
    const tx = db.transaction(LOJA_FOTOS, modo);
    const loja = tx.objectStore(LOJA_FOTOS);
    let req;
    try { req = fn(loja); } catch (e) { rej(e); return; }
    // "result" existe na requisicao mesmo quando vem vazio: sem essa checagem,
    // ler uma foto inexistente devolvia o objeto da requisicao em vez de undefined.
    tx.oncomplete = () => res(req && "result" in req ? req.result : undefined);
    tx.onerror = () => rej(tx.error || new Error("falhou a transação"));
  });
}
const guardarFoto = (id, blob) => comLojaFotos("readwrite", (loja) => loja.put(blob, id));
const lerFoto = (id) => comLojaFotos("readonly", (loja) => loja.get(id));
const apagarFoto = (id) => comLojaFotos("readwrite", (loja) => loja.delete(id));

// ---- Foto do aparelho (exercício criado pelo usuário) ----
// Mesma loja do IndexedDB das fotos de progresso, com chave própria: evita
// abrir um segundo banco e subir a versão do que já está no aparelho de todo mundo.
const chaveFotoEx = (id) => "exfoto-" + id;
const guardarFotoEx = (id, blob) => guardarFoto(chaveFotoEx(id), blob);
const apagarFotoEx = (id) => apagarFoto(chaveFotoEx(id));

// A mesma foto aparece na lista, na miniatura da sessão e na demonstração.
// Criar um endereço novo a cada render vazaria memória e releria o banco sem
// necessidade — por isso o endereço é resolvido uma vez e fica guardado.
const FOTOS_EX = {};        // id -> url, ou null quando já procurei e não existe
const pedidosFotoEx = {};   // id -> promessa em andamento
function carregarFotoEx(id) {
  if (FOTOS_EX[id] !== undefined) return Promise.resolve(FOTOS_EX[id]);
  if (pedidosFotoEx[id]) return pedidosFotoEx[id];
  pedidosFotoEx[id] = lerFoto(chaveFotoEx(id))
    .then((blob) => {
      FOTOS_EX[id] = blob ? URL.createObjectURL(blob) : null;
      delete pedidosFotoEx[id];
      return FOTOS_EX[id];
    })
    .catch(() => { FOTOS_EX[id] = null; delete pedidosFotoEx[id]; return null; });
  return pedidosFotoEx[id];
}
function esquecerFotoEx(id) {
  if (FOTOS_EX[id]) { try { URL.revokeObjectURL(FOTOS_EX[id]); } catch (e) {} }
  delete FOTOS_EX[id];
  delete pedidosFotoEx[id];
}

// Reduz a foto antes de guardar: 1080px de lado maior já é mais do que suficiente
// para comparar, e evita encher o aparelho com arquivos de 5 MB da câmera.
// A foto de progresso quer detalhe (1080px); a do aparelho só precisa ser
// reconhecível de relance (720px e compressão maior), e vai ficar guardada às
// dezenas. Daí a qualidade virar parâmetro.
function reduzirImagem(arquivo, ladoMax, qualidade) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(arquivo);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const escala = Math.min(1, ladoMax / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * escala);
      cv.height = Math.round(img.height * escala);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob((b) => (b ? res(b) : rej(new Error("falhou ao converter"))), "image/jpeg", qualidade || 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("não é uma imagem")); };
    img.src = url;
  });
}
const blobParaBase64 = (blob) => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(String(fr.result).split(",")[1] || "");
  fr.onerror = () => rej(fr.error);
  fr.readAsDataURL(blob);
});
function base64ParaBlob(b64, tipo) {
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return new Blob([bytes], { type: tipo || "image/jpeg" });
}

// ---------- GAMIFICAÇÃO ----------
function diaStr(x) { const dd = new Date(x); return dd.getFullYear() + "-" + (dd.getMonth() + 1) + "-" + dd.getDate(); }
function calcularEstatisticas(historico) {
  const dias = {};
  let volumeTotal = 0;
  // números que alimentam nível e conquistas
  let maiorCarga = 0, maiorDuracao = 0;
  let melhorSeriesTreino = 0, melhorVolumeTreino = 0;
  let treinouDeManha = false, treinouDeNoite = false, treinouFimDeSemana = false;
  const exercicios = {}, grupos = {}, semanas = {};

  historico.forEach((h) => {
    dias[diaStr(h.data)] = true;
    const d = new Date(h.data);
    const hora = d.getHours(), diaSemana = d.getDay();
    if (hora < 7) treinouDeManha = true;
    if (hora >= 22) treinouDeNoite = true;
    if (diaSemana === 0 || diaSemana === 6) treinouFimDeSemana = true;
    if ((h.duracaoMin || 0) > maiorDuracao) maiorDuracao = h.duracaoMin || 0;
    const chaveSemana = segundaDaSemana(h.data).getTime();
    semanas[chaveSemana] = (semanas[chaveSemana] || 0) + 1;

    let volTreino = 0, seriesTreino = 0;
    (h.itens || []).forEach((it) => {
      exercicios[it.exercicioId] = true;
      const g = GRUPO_POR_EXERCICIO[it.exercicioId];
      if (g) grupos[g] = true;
      (it.series || []).forEach((s) => {
        if (!serieConta(s)) return;
        seriesTreino += 1;
        if (ehTempo(s)) return;
        const p = cargaDe(s), r = repsDe(s);
        volumeTotal += p * r;
        volTreino += p * r;
        if (p > maiorCarga) maiorCarga = p;
      });
    });
    if (volTreino > melhorVolumeTreino) melhorVolumeTreino = volTreino;
    if (seriesTreino > melhorSeriesTreino) melhorSeriesTreino = seriesTreino;
  });

  const um = 86400000;
  let streak = 0;
  let cursor = new Date();
  if (!dias[diaStr(cursor)]) cursor = new Date(cursor.getTime() - um);
  while (dias[diaStr(cursor)]) { streak++; cursor = new Date(cursor.getTime() - um); }
  const agora = Date.now();
  let treinosSemana = 0, volumeSemana = 0;
  historico.forEach((h) => {
    if (agora - new Date(h.data).getTime() <= 7 * um) {
      treinosSemana++;
      (h.itens || []).forEach((it) => (it.series || []).forEach((s) => {
        if (serieConta(s)) volumeSemana += cargaDe(s) * repsDe(s);
      }));
    }
  });

  // recordes pessoais: total e o melhor treino isolado
  const porTreino = calcularRecordes(historico);
  let recordes = 0, melhorRecordesTreino = 0;
  Object.keys(porTreino).forEach((idT) => {
    let n = 0;
    Object.keys(porTreino[idT]).forEach((idE) => {
      const r = porTreino[idT][idE];
      if (r.peso || r.volume) n += 1;
    });
    recordes += n;
    if (n > melhorRecordesTreino) melhorRecordesTreino = n;
  });

  const contagens = Object.keys(semanas).map((k) => semanas[k]);
  return {
    total: historico.length, streak,
    volumeTotal: Math.round(volumeTotal),
    treinosSemana, volumeSemana: Math.round(volumeSemana),
    maiorCarga, maiorDuracao,
    melhorSeriesTreino, melhorVolumeTreino: Math.round(melhorVolumeTreino),
    treinouDeManha, treinouDeNoite, treinouFimDeSemana,
    exerciciosDistintos: Object.keys(exercicios).length,
    gruposDistintos: Object.keys(grupos).length,
    semanasAtivas: contagens.length,
    melhorSemana: contagens.length ? Math.max(...contagens) : 0,
    recordes, melhorRecordesTreino,
  };
}

// ---------- LEITURA DE UMA SÉRIE ----------
// Aquecimento existe para preparar a articulação; contá-lo no volume e nos
// recordes inflaria os números do treino. Fica registrado, mas fora das contas.
const ehAquecimento = (s) => !!(s && s.aquec);
// Isometria (prancha, cadeirinha) se mede em segundos e não tem tonelagem:
// somar "0 kg × 12" ali era gravar um dado errado.
const ehTempo = (s) => !!(s && s.segundos !== undefined && s.segundos !== null && s.segundos !== "");
const segundosDe = (s) => (ehTempo(s) ? parseInt(s.segundos) || 0 : 0);
const cargaDe = (s) => (ehTempo(s) ? 0 : parseFloat(s.peso) || 0);
const repsDe = (s) => (ehTempo(s) ? 0 : parseInt(s.reps) || 0);
// O que entra nas contas de volume, recorde e carga máxima
const serieConta = (s) => !ehAquecimento(s);

// ---------- ESTEIRA ----------
// A série da esteira é uma série de tempo com velocidade (km/h) e inclinação (%)
// a mais: { segundos, vel, incl }. Por continuar sendo de tempo, tudo o que já
// sabia lidar com a prancha — volume, recorde, histórico, evolução — funciona
// sem saber que esteira existe. Só o que é próprio dela olha os campos a mais.
const ehCardio = (s) => ehTempo(s) && s.vel !== undefined && s.vel !== null && s.vel !== "";
const exCardio = (ex) => !!(ex && ex.cardio);
const numDe = (v) => parseFloat(String(v === undefined || v === null ? "" : v).replace(",", ".")) || 0;
// Gasto pela equação do ACSM para esteira, a referência dos fisiologistas:
// caminhando, VO2 = 0,1·v + 1,8·v·i + 3,5; correndo, 0,2·v + 0,9·v·i + 3,5
// (v em metros por minuto, i em fração). Correr gasta o dobro por metro na
// horizontal, então errar o tipo dobra o número: acima de 7 km/h é corrida
// sempre, e entre 6 e 7 vale o que a pessoa escolheu.
function medirCardio(s, pesoKg, correndo) {
  const min = segundosDe(s) / 60;
  const vel = numDe(s.vel), incl = numDe(s.incl);
  const km = (vel * min) / 60;
  const v = (vel * 1000) / 60, i = incl / 100;
  const corre = vel >= 7 || (!!correndo && vel >= 6);
  const vo2 = vel <= 0 ? 3.5 : corre ? 0.2 * v + 0.9 * v * i + 3.5 : 0.1 * v + 1.8 * v * i + 3.5;
  const met = vo2 / 3.5;
  const kcal = ((met * 3.5 * (parseFloat(pesoKg) || 75)) / 200) * min;
  return { min, vel, incl, km, ritmo: vel > 0 ? 60 / vel : 0, met, kcal, corre };
}
// Faixas da OMS: abaixo de 3 MET é leve e não conta para a meta da semana;
// de 6 para cima é vigoroso e conta em dobro.
const intensidadeCardio = (met) => (met >= 6 ? "vigorosa" : met >= 3 ? "moderada" : "leve");
// 6 km/h é "10:00 /km": quem corre pensa em ritmo, não em velocidade
function fmtRitmo(minPorKm) {
  if (!minPorKm || !isFinite(minPorKm)) return "—";
  let m = Math.floor(minPorKm), s = Math.round((minPorKm - m) * 60);
  if (s === 60) { m += 1; s = 0; }
  return m + ":" + String(s).padStart(2, "0") + " /km";
}
const num1 = (n) => (Math.round((n || 0) * 10) / 10).toLocaleString("pt-BR");
// "30 min a 6 km/h, 5% (3 km)"
function textoCardio(s) {
  const m = medirCardio(s);
  return Math.round(m.min) + " min a " + num1(m.vel) + " km/h" + (m.incl ? ", " + num1(m.incl) + "%" : "") +
    (m.km >= 0.05 ? " (" + num1(m.km) + " km)" : "");
}
// O mesmo, do jeito que se fala
function falaCardio(s) {
  const m = medirCardio(s);
  return Math.round(m.min) + " minutos a " + num1(m.vel) + " por hora" + (m.incl ? ", inclinação " + num1(m.incl) : "");
}
// Soma das séries de esteira de um exercício. Várias séries são um intervalado
// (5 minutos andando, 2 correndo...): a intensidade é a média pesada pelo tempo.
function resumoCardio(series, pesoKg, correndo) {
  const r = { min: 0, km: 0, kcal: 0, met: 0, series: 0 };
  (series || []).forEach((s) => {
    if (!serieConta(s) || !ehCardio(s)) return;
    const m = medirCardio(s, pesoKg, correndo);
    if (!m.min) return;
    r.min += m.min; r.km += m.km; r.kcal += m.kcal; r.met += m.met * m.min; r.series += 1;
  });
  r.met = r.min ? r.met / r.min : 0;
  r.vel = r.min ? r.km / (r.min / 60) : 0;
  r.ritmo = r.vel > 0 ? 60 / r.vel : 0;
  r.intensidade = intensidadeCardio(r.met);
  return r;
}
// Minutos de cardio da semana na conta da OMS: 150 de moderado, ou 75 de
// vigoroso, que valem em dobro. Caminhada leve não entra.
const META_CARDIO_SEMANA = 150;
function cardioDaSemana(historico, exPorId, inicioMs, pesoKg) {
  const r = { moderado: 0, vigoroso: 0 };
  (historico || []).forEach((h) => {
    if (new Date(h.data).getTime() < inicioMs) return;
    (h.itens || []).forEach((it) => {
      const e = exPorId(it.exercicioId);
      (it.series || []).forEach((s) => {
        if (!serieConta(s) || !ehCardio(s)) return;
        const m = medirCardio(s, pesoKg, e && e.cardio === "corrida");
        if (m.met >= 6) r.vigoroso += m.min;
        else if (m.met >= 3) r.moderado += m.min;
      });
    });
  });
  r.equivalente = r.moderado + 2 * r.vigoroso;
  return r;
}

// ---------- ESTATÍSTICAS DE UM TREINO ----------
// Volume = soma de peso x repetições de todas as séries concluídas
function statsTreino(h) {
  let volume = 0, series = 0, reps = 0, cargaMax = 0, segundos = 0, seriesAquec = 0, cardioMin = 0, cardioKm = 0;
  (h.itens || []).forEach((it) => (it.series || []).forEach((s) => {
    if (ehAquecimento(s)) { seriesAquec += 1; return; }
    series += 1;
    // esteira é série de tempo, mas não é isometria: 20 minutos de corrida não
    // são "1200s de isometria"
    if (ehCardio(s)) { const m = medirCardio(s); cardioMin += m.min; cardioKm += m.km; return; }
    if (ehTempo(s)) { segundos += segundosDe(s); return; }
    const p = cargaDe(s), r = repsDe(s);
    volume += p * r; reps += r;
    if (p > cargaMax) cargaMax = p;
  }));
  const dur = h.duracaoMin || 0;
  return {
    volume: Math.round(volume), series, reps, segundos, seriesAquec, cardioMin, cardioKm,
    exercicios: (h.itens || []).length,
    cargaMax,
    densidade: dur ? Math.round(volume / dur) : 0,
    repsPorSerie: series ? Math.round((reps / series) * 10) / 10 : 0,
  };
}
// 1RM estimado pela fórmula de Epley
function est1RM(peso, reps) {
  const p = parseFloat(peso) || 0, r = parseInt(reps) || 0;
  if (!p || !r) return 0;
  return Math.round(p * (1 + r / 30));
}
function melhor1RM(it) {
  let m = 0;
  (it.series || []).forEach((s) => {
    if (!serieConta(s) || ehTempo(s)) return;
    const v = est1RM(s.peso, s.reps); if (v > m) m = v;
  });
  return m;
}
function volumeItem(it) {
  let v = 0;
  (it.series || []).forEach((s) => { if (serieConta(s)) v += cargaDe(s) * repsDe(s); });
  return Math.round(v);
}
// Segundos segurados num exercício isométrico
function tempoItem(it) {
  let t = 0;
  (it.series || []).forEach((s) => { if (serieConta(s)) t += segundosDe(s); });
  return t;
}
// Um item é "de tempo" quando alguma série registrada está em segundos
const itemDeTempo = (it) => (it.series || []).some(ehTempo);
function fmtKg(kg) {
  return Math.round(kg || 0).toLocaleString("pt-BR") + " kg";
}
// Número curto com no máximo uma casa decimal (42,5 e não 42.5)
const fmtNum = (n) => (Math.round((parseFloat(n) || 0) * 10) / 10).toLocaleString("pt-BR");
// Versão compacta, para totais acumulados
function fmtPeso(kg) {
  const v = Math.round(kg || 0);
  if (v >= 10000) return (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " t";
  return v.toLocaleString("pt-BR") + " kg";
}
// Comparações para dar escala ao volume levantado
const EQUIVALENCIAS = [
  { kg: 5, nome: "melancias", icone: "🍉" },
  { kg: 20, nome: "galões de água", icone: "💧" },
  { kg: 80, nome: "geladeiras", icone: "🧊" },
  { kg: 150, nome: "motos", icone: "🏍" },
  { kg: 450, nome: "bois", icone: "🐂" },
  { kg: 1000, nome: "carros populares", icone: "🚗" },
  { kg: 5000, nome: "elefantes", icone: "🐘" },
  { kg: 12000, nome: "ônibus", icone: "🚌" },
  { kg: 41000, nome: "aviões (Boeing 737)", icone: "✈️" },
];
function equivalencia(kg) {
  if (!kg || kg < 10) return null;
  let escolhida = EQUIVALENCIAS[0];
  EQUIVALENCIAS.forEach((e) => { if (kg / e.kg >= 2) escolhida = e; });
  const qtd = kg / escolhida.kg;
  const num = qtd >= 10 ? Math.round(qtd).toLocaleString("pt-BR") : (Math.round(qtd * 10) / 10).toLocaleString("pt-BR");
  return escolhida.icone + " o mesmo que " + num + " " + escolhida.nome;
}
// Compara com o treino anterior de mesmo nome
function compararAnterior(historico, h) {
  const ord = [...historico].sort((a, b) => new Date(b.data) - new Date(a.data));
  const idx = ord.findIndex((x) => x.id === h.id);
  if (idx < 0) return null;
  const ant = ord.slice(idx + 1).find((x) => x.nome === h.nome);
  if (!ant) return null;
  const va = statsTreino(ant).volume;
  const vh = statsTreino(h).volume;
  if (!va) return null;
  return { pct: Math.round(((vh - va) / va) * 100), anterior: va, data: ant.data };
}
// Marca recordes pessoais por exercício (carga e volume), ignorando a estreia
function calcularRecordes(historico) {
  const ord = [...historico].sort((a, b) => new Date(a.data) - new Date(b.data));
  const bestPeso = {}, bestVol = {}, out = {};
  ord.forEach((h) => {
    out[h.id] = {};
    (h.itens || []).forEach((it) => {
      const id = it.exercicioId;
      let pMax = 0;
      // isometria compara por segundos; o resto, por carga
      (it.series || []).forEach((s) => {
        if (!serieConta(s)) return;
        const p = ehTempo(s) ? segundosDe(s) : cargaDe(s);
        if (p > pMax) pMax = p;
      });
      const vol = itemDeTempo(it) ? tempoItem(it) : volumeItem(it);
      const estreia = bestPeso[id] === undefined;
      out[h.id][id] = {
        peso: !estreia && pMax > 0 && pMax > bestPeso[id],
        volume: !estreia && vol > 0 && vol > bestVol[id],
      };
      if (estreia || pMax > bestPeso[id]) bestPeso[id] = pMax;
      if (estreia || vol > bestVol[id]) bestVol[id] = vol;
    });
  });
  return out;
}
function contarRecordesNovos(historico, registro) {
  // "melhor marca" do exercício: carga para peso livre, segundos para isometria
  const marca = (it) => {
    let m = 0;
    (it.series || []).forEach((s) => {
      if (!serieConta(s)) return;
      const v = ehTempo(s) ? segundosDe(s) : cargaDe(s);
      if (v > m) m = v;
    });
    return m;
  };
  const melhorAntes = {};
  historico.forEach((h) => (h.itens || []).forEach((it) => {
    const m = marca(it);
    if (melhorAntes[it.exercicioId] === undefined || m > melhorAntes[it.exercicioId]) melhorAntes[it.exercicioId] = m;
  }));
  let n = 0;
  (registro.itens || []).forEach((it) => {
    const m = marca(it);
    if (melhorAntes[it.exercicioId] !== undefined && m > melhorAntes[it.exercicioId]) n += 1;
  });
  return n;
}
// Volume por grupo muscular (usa o grupo principal do exercício)
function volumePorGrupo(historico, exPorId, desdeMs) {
  const acc = {};
  historico.forEach((h) => {
    if (desdeMs && new Date(h.data).getTime() < desdeMs) return;
    (h.itens || []).forEach((it) => {
      const e = exPorId(it.exercicioId);
      const g = e ? e.grupo : "outros";
      acc[g] = (acc[g] || 0) + volumeItem(it);
    });
  });
  return Object.keys(acc)
    .map((g) => ({ id: g, nome: (GRUPOS.find((x) => x.id === g) || {}).nome || "Outros", volume: acc[g] }))
    .filter((x) => x.volume > 0)
    .sort((a, b) => b.volume - a.volume);
}
// Agrupa o volume por semana (semanas começando na segunda-feira)
function segundaDaSemana(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  const dow = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - dow);
  return x;
}
function volumeSemanal(historico, nSemanas) {
  const base = segundaDaSemana(new Date());
  const semanas = [];
  for (let i = nSemanas - 1; i >= 0; i--) {
    const ini = new Date(base.getTime() - i * 7 * 86400000);
    semanas.push({ ini, volume: 0, treinos: 0 });
  }
  historico.forEach((h) => {
    const ini = segundaDaSemana(h.data).getTime();
    const alvo = semanas.find((s) => s.ini.getTime() === ini);
    if (alvo) { alvo.volume += statsTreino(h).volume; alvo.treinos += 1; }
  });
  return semanas;
}

// ---------- NÍVEL DO ATLETA ----------
// A experiência mistura constância (treinos), esforço (tonelagem) e evolução
// (recordes), para que nem só quem levanta muito nem só quem aparece sempre suba.
function xpDe(est) {
  return Math.round(est.total * 120 + est.volumeTotal / 60 + est.streak * 40 + (est.recordes || 0) * 60);
}
const NIVEIS = [
  { xp: 0, nome: "Novato", icone: "🌱" },
  { xp: 400, nome: "Iniciante", icone: "🐣" },
  { xp: 1200, nome: "Frequentador", icone: "🎒" },
  { xp: 2600, nome: "Ritmo firme", icone: "🏃" },
  { xp: 5000, nome: "Puxador de ferro", icone: "🔩" },
  { xp: 9000, nome: "Veterano", icone: "🛡" },
  { xp: 15000, nome: "Marombeiro", icone: "💪" },
  { xp: 24000, nome: "Máquina", icone: "⚙️" },
  { xp: 38000, nome: "Monstro", icone: "🦍" },
  { xp: 60000, nome: "Lenda da academia", icone: "👑" },
];
function nivelDe(est) {
  const xp = xpDe(est);
  let i = 0;
  for (let k = 0; k < NIVEIS.length; k++) if (xp >= NIVEIS[k].xp) i = k;
  const atual = NIVEIS[i];
  const proximo = NIVEIS[i + 1] || null;
  const base = atual.xp;
  const alvo = proximo ? proximo.xp : atual.xp;
  const pct = proximo ? Math.max(0, Math.min(100, ((xp - base) / (alvo - base)) * 100)) : 100;
  return { xp, indice: i + 1, nome: atual.nome, icone: atual.icone, proximo, faltam: proximo ? alvo - xp : 0, pct };
}

// ---------- RECORDES E ÚLTIMA EXECUÇÃO ----------
// Melhor carga, melhor volume e melhor 1RM já feitos em cada exercício.
function recordesPorExercicio(historico) {
  const m = {};
  historico.forEach((h) => {
    (h.itens || []).forEach((it) => {
      const r = m[it.exercicioId] || { peso: 0, reps: 0, volume: 0, e1rm: 0, segundos: 0, tempo: false };
      let vol = 0;
      (it.series || []).forEach((s) => {
        if (!serieConta(s)) return;
        if (ehTempo(s)) {
          r.tempo = true;
          const sg = segundosDe(s);
          if (sg > r.segundos) r.segundos = sg;
          return;
        }
        const p = cargaDe(s), rp = repsDe(s);
        vol += p * rp;
        if (p > r.peso) { r.peso = p; r.reps = rp; }
        const rm = est1RM(s.peso, s.reps);
        if (rm > r.e1rm) r.e1rm = rm;
      });
      if (vol > r.volume) r.volume = Math.round(vol);
      m[it.exercicioId] = r;
    });
  });
  return m;
}
// Séries feitas na última vez em que este exercício apareceu no histórico.
function ultimaExecucao(historico, exercicioId) {
  const ord = [...historico].sort((a, b) => new Date(b.data) - new Date(a.data));
  for (const h of ord) {
    const it = (h.itens || []).find((x) => x.exercicioId === exercicioId);
    if (it && (it.series || []).length) return { series: it.series, data: h.data };
  }
  return null;
}
// Sugere a carga de hoje: repete a da última vez e propõe subir quando todas as
// séries saíram com as repetições combinadas — que é como a sobrecarga progressiva
// funciona na prática, sem precisar lembrar de nada.
const PASSO_CARGA = (peso) => (peso >= 60 ? 5 : peso >= 20 ? 2.5 : 1);
function sugerirCarga(historico, exercicioId, repsAlvo) {
  const ult = ultimaExecucao(historico, exercicioId);
  if (!ult) return null;
  const validas = ult.series.filter(serieConta);
  if (!validas.length) return null;

  // Esteira: repete velocidade e inclinação da última vez. Subir sozinho não:
  // na esteira quem decide se hoje é dia de forçar é o fôlego, não a planilha.
  if (validas.every(ehCardio)) {
    const u = validas[validas.length - 1];
    return { cardio: true, tempo: true, subiu: false, segundos: segundosDe(u), vel: u.vel, incl: u.incl || "0" };
  }
  // Isometria: a progressão é em segundos, subindo 5s quando a última vez fechou
  if (validas.every(ehTempo)) {
    let maior = 0;
    validas.forEach((s) => { const t = segundosDe(s); if (t > maior) maior = t; });
    if (!maior) return null;
    const todasIguais = validas.every((s) => segundosDe(s) >= maior);
    return todasIguais
      ? { segundos: maior + 5, subiu: true, anterior: maior, tempo: true }
      : { segundos: maior, subiu: false, anterior: maior, tempo: true };
  }

  let melhor = 0, repsNoMelhor = 0;
  validas.forEach((s) => {
    const p = cargaDe(s);
    if (p > melhor) { melhor = p; repsNoMelhor = repsDe(s); }
  });
  if (!melhor) return null;
  const alvo = parseInt(repsAlvo) || 0;
  const bateuTudo = alvo > 0 && validas.length > 0 &&
    validas.every((s) => cargaDe(s) >= melhor && repsDe(s) >= alvo);
  if (bateuTudo) {
    return { peso: melhor + PASSO_CARGA(melhor), subiu: true, anterior: melhor, reps: repsNoMelhor };
  }
  return { peso: melhor, subiu: false, anterior: melhor, reps: repsNoMelhor };
}

// Monta as séries de um exercício ao iniciar o treino. Isometria entra em
// segundos; o resto, em peso e repetições, já com a carga sugerida.
function montarSeries(ex, qtdSeries, repsAlvo, sug) {
  const n = Math.max(1, parseInt(qtdSeries) || 1);
  // Esteira: na ficha, "repetições" são os minutos. Velocidade e inclinação vêm
  // da última vez; sem histórico, do padrão do exercício.
  if (exCardio(ex)) {
    const p = ex.padrao || {};
    const ant = sug && sug.cardio ? sug : null;
    const min = parseInt(repsAlvo) || (ant ? Math.round(ant.segundos / 60) : 0) || p.min || 30;
    return Array.from({ length: n }, () => ({
      segundos: String(min * 60),
      vel: String(ant ? ant.vel : p.vel || 6),
      incl: String(ant ? ant.incl || 0 : p.incl || 0),
      feito: false,
    }));
  }
  const isometria = !!(ex && ex.tempo);
  if (isometria) {
    const seg = sug && sug.segundos ? String(sug.segundos) : "30";
    return Array.from({ length: n }, () => ({ segundos: seg, feito: false }));
  }
  return Array.from({ length: n }, () => ({
    peso: sug && sug.peso ? String(sug.peso) : "",
    reps: String(repsAlvo || ""),
    feito: false,
  }));
}

// Onde cai a próxima frase do Jarvis, e de que série fala o "Próxima:" do fim
// do descanso. Antes era a primeira série pendente da ficha inteira: quem pulava
// o hack e ia para a flexora ouvia "próxima: agachamento no hack" a cada série,
// e o que ditasse sem dizer o aparelho iria parar no hack.
// Agora segue o exercício em que a pessoa está (focoEi): enquanto ele tem série
// pendente, é ele; acabou, o próximo da lista depois dele; e só então os que
// ficaram para trás. No bi-set a vez é do parceiro com menos séries feitas.
function alvoDaSessao(itens, focoEi) {
  if (!itens || !itens.length) return null;
  const pendente = (it) => it.series.findIndex((s) => !s.feito);
  const feitas = (it) => it.series.filter((s) => s.feito).length;
  if (focoEi !== null && focoEi !== undefined && itens[focoEi]) {
    const c = itens[focoEi].conjunto;
    if (c) {
      let ini = focoEi, fim = focoEi;
      while (ini > 0 && itens[ini - 1].conjunto === c) ini--;
      while (fim + 1 < itens.length && itens[fim + 1].conjunto === c) fim++;
      let melhor = -1;
      for (let i = ini; i <= fim; i++) {
        if (pendente(itens[i]) < 0) continue;
        if (melhor < 0 || feitas(itens[i]) < feitas(itens[melhor])) melhor = i;
      }
      if (melhor >= 0) return { ei: melhor, si: pendente(itens[melhor]) };
    } else {
      const si = pendente(itens[focoEi]);
      if (si >= 0) return { ei: focoEi, si: si };
    }
    for (let k = 1; k < itens.length; k++) {
      const i = (focoEi + k) % itens.length;
      const si = pendente(itens[i]);
      if (si >= 0) return { ei: i, si: si };
    }
    return { ei: focoEi, si: itens[focoEi].series.length };
  }
  for (let i = 0; i < itens.length; i++) {
    const si = pendente(itens[i]);
    if (si >= 0) return { ei: i, si: si };
  }
  const ult = itens.length - 1;
  return { ei: ult, si: itens[ult].series.length };
}

// ---------- RECUPERAÇÃO POR GRUPO MUSCULAR ----------
// Quantos dias desde a última vez que cada grupo foi treinado. Serve para
// responder "o que eu treino hoje?" sem precisar abrir o histórico.
function recuperacaoMuscular(historico, exPorId) {
  const ultimoDia = {};
  historico.forEach((h) => {
    const t = new Date(h.data).getTime();
    (h.itens || []).forEach((it) => {
      const e = exPorId(it.exercicioId);
      if (!e || e.cardio) return;
      if (!ultimoDia[e.grupo] || t > ultimoDia[e.grupo]) ultimoDia[e.grupo] = t;
    });
  });
  const agora = Date.now();
  return GRUPOS.map((g) => {
    const t = ultimoDia[g.id];
    const dias = t == null ? null : Math.floor((agora - t) / 86400000);
    let estado = "pronto";
    if (dias !== null && dias < 1) estado = "descansando";
    else if (dias !== null && dias < 2) estado = "quase";
    return { id: g.id, nome: g.nome, dias, estado };
  }).sort((a, b) => {
    const va = a.dias === null ? 999 : a.dias;
    const vb = b.dias === null ? 999 : b.dias;
    return vb - va;
  });
}

function gerarImagemStory(linhas) {
  const cv = document.createElement("canvas");
  cv.width = 1080; cv.height = 1920;
  const c = cv.getContext("2d");
  c.fillStyle = "#010101"; c.fillRect(0, 0, 1080, 1920);
  const faixa = (y) => {
    c.fillStyle = "#E1306C";
    for (let x = 40; x < 1000; x += 52) {
      c.beginPath(); c.moveTo(x, y + 22); c.lineTo(x + 22, y + 22); c.lineTo(x + 44, y); c.lineTo(x + 22, y); c.closePath(); c.fill();
    }
  };
  c.textAlign = "center";
  c.fillStyle = "#F2F0EC"; c.font = "900 62px sans-serif"; c.fillText("TREINO LIVRE", 540, 130);
  faixa(165);
  let y = 380;
  linhas.forEach((l) => {
    c.fillStyle = l.cor || "#F2F0EC";
    c.font = "bold " + (l.tam || 56) + "px sans-serif";
    c.fillText(l.t, 540, y);
    y += (l.tam || 56) + (l.esp || 44);
  });
  faixa(1680);
  c.fillStyle = "#E1306C"; c.font = "bold 40px sans-serif"; c.fillText("carlosjr81.github.io/Treino-Livre", 540, 1764);
  c.fillStyle = "#A8A8A9"; c.font = "28px sans-serif"; c.fillText("App gratuito, feito por", 540, 1818);
  c.fillStyle = "#F2F0EC"; c.font = "900 52px sans-serif"; c.fillText("@" + INSTAGRAM, 540, 1878);
  return new Promise((res) => cv.toBlob(res, "image/png"));
}
async function compartilharImagem(blob, texto, avisarFn) {
  try {
    const file = new File([blob], "treino-livre.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: texto });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob);

// ---------------- SOM (Web Audio) ----------------
let audioCtx = null;
function beep(freq, dur, vol) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.value = vol || 0.25;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

// Várias notas agendadas no relógio do próprio áudio. Com a tela apagada o
// navegador atrasa todo setTimeout para no mínimo um segundo, e uma melodia
// montada com ele saía picotada; o relógio do Web Audio não atrasa. Devolve
// a função que cala o que ainda não tocou.
function melodia(notas) {
  const osc = [];
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime + 0.05;
    notas.forEach(([freq, quando, dur, vol]) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.3, t0 + quando);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + quando + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + quando);
      o.stop(t0 + quando + dur);
      osc.push(o);
    });
  } catch (e) {}
  return () => osc.forEach((o) => { try { o.stop(); } catch (e) {} });
}

// Sem servidor não existe push de verdade. O que funciona é: (a) avisar enquanto
// o app está aberto e (b) no Android, com o app instalado, pedir ao sistema uma
// verificação periódica em segundo plano (periodicSync). Nos aparelhos que não
// suportam, o lembrete só aparece quando o app é aberto.
const CACHE_CONFIG = "treinolivre-config";
async function guardarConfigLembrete(cfg) {
  try {
    const c = await caches.open(CACHE_CONFIG);
    await c.put("/config-lembrete", new Response(JSON.stringify(cfg), { headers: { "Content-Type": "application/json" } }));
  } catch (e) {}
}
async function pedirVerificacaoPeriodica(ativo) {
  try {
    const reg = await navigator.serviceWorker.ready;
    if (!reg.periodicSync) return false;
    if (!ativo) { await reg.periodicSync.unregister("lembrete-treino").catch(() => {}); return false; }
    const st = await navigator.permissions.query({ name: "periodic-background-sync" });
    if (st.state !== "granted") return false;
    await reg.periodicSync.register("lembrete-treino", { minInterval: 6 * 3600 * 1000 });
    return true;
  } catch (e) { return false; }
}

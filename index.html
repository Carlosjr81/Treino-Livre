// ---------------- EVOLUÇÃO DE UM EXERCÍCIO ----------------
// "Estou melhorando no supino?" é a pergunta que faz alguém abrir um app de
// treino num sábado à tarde, e até aqui o app não respondia: o dado estava
// todo no histórico, mas a única forma de ver era rolar treino por treino.
//
// Uma sessão vira um ponto. A carga do ponto é a **maior carga daquela sessão**,
// não a média: progressão de força se lê pelo topo, e a média despenca só porque
// a pessoa fez uma série leve no fim.
function seriesDoExercicio(historico, exId) {
  const pontos = [];
  (historico || []).forEach((h) => {
    const itens = (h.itens || []).filter((it) => it.exercicioId === exId);
    if (!itens.length) return;
    let cargaMax = 0, volume = 0, reps = 0, series = 0, seg = 0, melhor1RM = 0;
    const feitas = [];
    itens.forEach((it) => {
      (it.series || []).forEach((s) => {
        if (!serieConta(s)) return;      // aquecimento não entra em progressão
        series += 1;
        if (ehTempo(s)) { seg += segundosDe(s); feitas.push(segundosDe(s) + "s"); return; }
        const c = cargaDe(s), r = repsDe(s);
        reps += r;
        volume += c * r;
        if (c > cargaMax) cargaMax = c;
        const um = est1RM(c, r);
        if (um > melhor1RM) melhor1RM = um;
        feitas.push(c + "×" + r);
      });
    });
    if (!series) return;
    pontos.push({
      data: new Date(h.data), nome: h.nome,
      cargaMax: cargaMax, volume: volume, reps: reps, series: series,
      segundos: seg, um: melhor1RM, feitas: feitas,
    });
  });
  return pontos.sort((a, b) => a.data - b.data);
}

function GraficoEvolucaoEx({ pontos, campo, unidade }) {
  const vals = pontos.map((p) => p[campo]);
  if (pontos.length < 2 || !vals.some((v) => v > 0)) {
    return (
      <div style={{ fontSize: 13, color: "var(--cinza)", padding: "10px 0", lineHeight: 1.6 }}>
        Faça este exercício em pelo menos dois treinos para a linha aparecer.
      </div>
    );
  }
  const W = 320, H = 140, x0 = 42, x1 = 310, y0 = 108, y1 = 14;
  const vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
  const faixa = vmax - vmin || 1;
  const px = (i) => x0 + (i / (pontos.length - 1)) * (x1 - x0);
  const py = (v) => y0 - ((v - vmin) / faixa) * (y0 - y1);
  const linha = pontos.map((p, i) => px(i).toFixed(1) + "," + py(p[campo]).toFixed(1)).join(" ");
  const fmt = (d) => d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  const dif = Math.round((vals[vals.length - 1] - vals[0]) * 10) / 10;
  return (
    <React.Fragment>
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }} aria-hidden="true">
        <line x1={x0} y1={y0} x2={x1} y2={y0} stroke="var(--borda)" strokeWidth="1" />
        <text x="4" y={y1 + 4} fontSize="10" fill="var(--cinza2)">{Math.round(vmax)}</text>
        <text x="4" y={y0 + 4} fontSize="10" fill="var(--cinza2)">{Math.round(vmin)}</text>
        <polyline points={linha} fill="none" stroke="#E1306C" strokeWidth="2.5"
          strokeLinecap="round" strokeLinejoin="round" />
        {pontos.map((p, i) => (
          <circle key={i} cx={px(i)} cy={py(p[campo])} r={i === pontos.length - 1 ? 4.5 : 3} fill="#E1306C" />
        ))}
        <text x={x0} y={H - 6} fontSize="10" fill="var(--cinza2)">{fmt(pontos[0].data)}</text>
        <text x={x1} y={H - 6} fontSize="10" fill="var(--cinza2)" textAnchor="end">{fmt(pontos[pontos.length - 1].data)}</text>
      </svg>
      <div style={{ fontSize: 12.5, color: "var(--cinza)", marginTop: 4 }}>
        {dif > 0 ? "▲ +" + dif + " " + unidade + " desde a primeira vez"
          : dif < 0 ? "▼ " + dif + " " + unidade + " desde a primeira vez"
            : "Igual à primeira vez"}
      </div>
    </React.Fragment>
  );
}

function EvolucaoExercicio({ ex, historico, onVoltar }) {
  const [campo, setCampo] = useState("cargaMax");
  const pontos = useMemo(() => seriesDoExercicio(historico, ex.id), [historico, ex.id]);
  const g = grupoPorId(ex.grupo);
  const porTempo = pontos.length > 0 && pontos.every((p) => p.segundos > 0 && p.cargaMax === 0);

  if (!pontos.length) {
    return (
      <div style={{ padding: "0 18px" }}>
        <button style={S.voltar} onClick={onVoltar}>← Voltar</button>
        <div style={{ ...S.card, textAlign: "center" }}>
          <div style={{ fontSize: 34, marginBottom: 10 }} aria-hidden="true">📈</div>
          <div style={{ fontSize: 16, fontWeight: 900, marginBottom: 8 }}>Ainda sem histórico aqui</div>
          <div style={{ fontSize: 13.5, color: "var(--cinza)", lineHeight: 1.65 }}>
            Faça <b>{ex.nome}</b> num treino e esta tela passa a mostrar a carga subindo, o volume
            de cada sessão e o seu recorde.
          </div>
        </div>
      </div>
    );
  }

  const ultimo = pontos[pontos.length - 1];
  const recorde = pontos.reduce((a, p) => Math.max(a, p.cargaMax), 0);
  const melhorVol = pontos.reduce((a, p) => Math.max(a, p.volume), 0);
  const melhorUm = pontos.reduce((a, p) => Math.max(a, p.um), 0);
  const totalSeries = pontos.reduce((a, p) => a + p.series, 0);
  const campos = porTempo
    ? [["segundos", "Tempo total", "s"]]
    : [["cargaMax", "Carga máxima", "kg"], ["volume", "Volume", "kg"], ["reps", "Repetições", "reps"]];
  const atual = campos.find((c) => c[0] === campo) || campos[0];

  const caixa = (titulo, valor, cor) => (
    <div style={{ flex: "1 1 80px", minWidth: 80, background: "var(--bg2)", border: "1px solid var(--borda)",
      borderRadius: 12, padding: "10px 11px" }}>
      <div style={{ fontSize: 17, fontWeight: 900, color: cor || "var(--texto)" }}>{valor}</div>
      <div style={{ fontSize: 10, color: "var(--cinza)", textTransform: "uppercase", letterSpacing: 0.4, marginTop: 2 }}>{titulo}</div>
    </div>
  );

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onVoltar}>← Voltar</button>

      <div style={{ ...S.card, borderLeft: "4px solid " + corGrupo(g) }}>
        <div style={{ ...S.label, color: corGrupo(g) }}>Sua evolução</div>
        <div style={{ fontSize: 19, fontWeight: 900, margin: "6px 0 14px", lineHeight: 1.25 }}>{ex.nome}</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {porTempo
            ? caixa("Melhor tempo", Math.max.apply(null, pontos.map((p) => p.segundos)) + "s", "#E1306C")
            : caixa("Recorde", recorde + " kg", "#E1306C")}
          {!porTempo && caixa("1RM estimado", melhorUm + " kg")}
          {caixa("Treinos", pontos.length)}
          {caixa("Séries", totalSeries)}
        </div>
      </div>

      <div style={S.card}>
        {campos.length > 1 && (
          <div style={{ display: "flex", gap: 7, marginBottom: 12 }}>
            {campos.map((c) => {
              const on = c[0] === atual[0];
              return (
                <button key={c[0]} onClick={() => setCampo(c[0])} aria-pressed={on}
                  style={{ flex: 1, border: "1px solid " + (on ? "#E1306C" : "var(--borda2)"),
                    background: on ? "#E1306C22" : "transparent", color: on ? "#E1306C" : "var(--texto)",
                    borderRadius: 11, padding: "9px 6px", fontWeight: 800, fontSize: 12.5, cursor: "pointer" }}>
                  {c[1]}
                </button>
              );
            })}
          </div>
        )}
        <GraficoEvolucaoEx pontos={pontos} campo={atual[0]} unidade={atual[2]} />
      </div>

      <div style={S.card}>
        <div style={S.label}>Treino a treino</div>
        <div style={{ fontSize: 12, color: "var(--cinza)", margin: "6px 0 12px", lineHeight: 1.5 }}>
          Do mais recente para o mais antigo. Séries de aquecimento não entram na conta.
        </div>
        {pontos.slice().reverse().slice(0, 12).map((p, i) => (
          <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start",
            padding: "9px 0", borderTop: i ? "1px solid var(--borda)" : "none" }}>
            <div style={{ fontSize: 11.5, color: "var(--cinza)", width: 54, flexShrink: 0, paddingTop: 2 }}>
              {p.data.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13.5, fontWeight: 800, lineHeight: 1.4 }}>{p.feitas.join("  ·  ")}</div>
              <div style={{ fontSize: 11.5, color: "var(--cinza)", marginTop: 2 }}>
                {p.volume > 0 ? fmtKg(p.volume) + " de volume" : p.segundos + "s no total"}
                {p.cargaMax === recorde && p.cargaMax > 0 ? "  🏆 recorde" : ""}
              </div>
            </div>
          </div>
        ))}
      </div>

      <div style={{ fontSize: 12, color: "var(--cinza2)", lineHeight: 1.6, padding: "0 2px 10px" }}>
        O 1RM estimado vem da fórmula de Epley e serve de referência, não de meta:
        ninguém precisa testar uma repetição máxima para saber que está progredindo.
      </div>
    </div>
  );
}

function DetalheExercicio({ ex, historico, onVoltar, onVariacao, onTrocarFoto }) {
  const [vendoEvolucao, setVendoEvolucao] = useState(false);
  // Quantas vezes este exercício já foi feito: o botão só promete evolução
  // quando existe evolução para mostrar.
  const vezes = useMemo(
    () => (historico || []).filter((hh) => (hh.itens || []).some((it) => it.exercicioId === ex.id)).length,
    [historico, ex.id]
  );
  if (vendoEvolucao) {
    return <EvolucaoExercicio ex={ex} historico={historico} onVoltar={() => setVendoEvolucao(false)} />;
  }
  const g = grupoPorId(ex.grupo);
  const p = (ex.musc && ex.musc.p) || [];
  const s = (ex.musc && ex.musc.s) || [];
  const temMapa = p.length > 0 || s.length > 0;

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onVoltar}>← Voltar</button>
      <div style={{ ...S.card, borderLeft: "4px solid " + corGrupo(g) }}>
        <div style={{ ...S.label, color: corGrupo(g) }}>{g.nome}{ex.equip ? " · " + ex.equip : ""}</div>
        <div style={{ fontSize: 22, fontWeight: 900, margin: "6px 0 10px" }}>
          {ex.nome}
          {ex.custom && <span style={S.tagCustom}>Meu</span>}
        </div>

        {/* "Estou melhorando neste exercício?" é a pergunta que traz alguém ao app
            fora do dia de treino. O dado sempre esteve no histórico; faltava a tela. */}
        <button onClick={() => setVendoEvolucao(true)} disabled={!vezes}
          style={{ width: "100%", marginBottom: 12, padding: "11px 12px", borderRadius: 12,
            border: "1px solid " + (vezes ? "#E1306C66" : "var(--borda)"),
            background: vezes ? "#E1306C14" : "transparent",
            color: vezes ? "#E1306C" : "var(--cinza2)",
            fontWeight: 800, fontSize: 13, cursor: vezes ? "pointer" : "default" }}>
          {vezes
            ? "📈 Minha evolução · " + vezes + " " + plural(vezes, "treino", "treinos")
            : "📈 Faça este exercício para ver sua evolução aqui"}
        </button>

        <ImagemExercicio ex={ex} />

        {ex.custom && onTrocarFoto && (
          <button style={{ ...S.btnGhost, marginTop: 4, marginBottom: 4, fontSize: 13 }} onClick={() => onTrocarFoto(ex)}>
            📷 {ex.foto ? "Trocar a foto do aparelho" : "Fotografar o aparelho"}
          </button>
        )}

        {temMapa && (
          <React.Fragment>
            <div style={{ ...S.label, margin: "14px 0 10px" }}>Músculos trabalhados</div>
            <MapaMuscular p={p} s={s} />
            <div style={{ fontSize: 13, lineHeight: 1.6, margin: "12px 0 16px" }}>
              {p.length > 0 && (
                <div><span style={{ color: corMuscTxt("p"), fontWeight: 800 }}>Direto: </span>{p.map((m) => MUSCULOS[m]).join(", ")}</div>
              )}
              {s.length > 0 && (
                <div><span style={{ color: corMuscTxt("s"), fontWeight: 800 }}>Indireto: </span>{s.map((m) => MUSCULOS[m]).join(", ")}</div>
              )}
            </div>
          </React.Fragment>
        )}

        <button style={{ ...S.btnGhost, marginBottom: 16, borderColor: "#E1306C66", color: "#E1306C" }} onClick={() => abrirVideoDe(ex.nome)}>
          ▶ Ver demonstração em vídeo
        </button>

        {ex.passos && ex.passos.length > 0 && (
          <React.Fragment>
            <div style={S.label}>Execução</div>
            <ol style={{ margin: "8px 0 16px", paddingLeft: 20, lineHeight: 1.6, fontSize: 15 }}>
              {ex.passos.map((pp, i) => <li key={i} style={{ marginBottom: 6 }}>{pp}</li>)}
            </ol>
          </React.Fragment>
        )}
        {ex.dica && (
          <div style={{ background: "var(--bg)", borderRadius: 10, padding: 12, fontSize: 14, lineHeight: 1.5 }}>
            <span style={{ color: "#E1306C", fontWeight: 800 }}>Dica: </span>{ex.dica}
          </div>
        )}
      </div>
      <BotaoVariacao ex={ex} onVariacao={onVariacao} />
    </div>
  );
}

function TelaExercicios({ todos, exPorId, historico, grupoAberto, setGrupoAberto, exercicioAberto, setExercicioAberto, onNovoExercicio, onExcluirCustom, onVariacao, onTrocarFoto }) {
  const [busca, setBusca] = useState("");
  const [equip, setEquip] = useState(null);   // família de equipamento escolhida

  // Se o exercício aberto sumiu (custom excluído), cai de volta na lista em vez
  // de alterar estado durante o render.
  const exAberto = exercicioAberto ? exPorId(exercicioAberto) : null;
  if (exAberto) {
    return <DetalheExercicio ex={exAberto} historico={historico} onVoltar={() => setExercicioAberto(null)}
      onVariacao={onVariacao} onTrocarFoto={onTrocarFoto} />;
  }

  const fam = equip ? FAMILIAS_EQUIP.find((f) => f.id === equip) : null;
  const porEquip = (lista) => (fam ? lista.filter((e) => naFamilia(e, fam)) : lista);
  // A busca olha nome E equipamento: "halteres" e "polia" passam a achar coisa.
  const alvo = semAcento(busca.trim());
  const buscando = alvo.length > 0;
  const resultados = buscando
    ? porEquip(todos.filter((e) => semAcento(e.nome).includes(alvo) || semAcento(e.equip).includes(alvo)))
    : [];

  if (grupoAberto && !buscando) {
    const g = grupoPorId(grupoAberto);
    const lista = porEquip(todos.filter((e) => e.grupo === grupoAberto));
    return (
      <div style={{ padding: "0 18px" }}>
        <button style={S.voltar} onClick={() => setGrupoAberto(null)}>← Grupos</button>
        <div style={{ fontSize: 24, fontWeight: 900, textTransform: "uppercase", marginBottom: 12, color: corGrupo(g) }}>{g.nome}</div>
        {lista.map((ex) => (
          <CardExercicio key={ex.id} ex={ex} onAbrir={() => setExercicioAberto(ex.id)} onExcluir={onExcluirCustom} />
        ))}
        <button style={{ ...S.btnGhost, marginTop: 4 }} onClick={onNovoExercicio}>+ Criar exercício próprio</button>
      </div>
    );
  }

  return (
    <div style={{ padding: "0 18px" }}>
      <input style={{ ...S.input, marginBottom: 10 }} placeholder="Buscar por nome ou equipamento..."
        type="search" aria-label="Buscar exercício por nome ou equipamento"
        value={busca} onChange={(e) => setBusca(e.target.value)} />

      {/* Filtro por equipamento: serve para quem treina em casa ou tem a academia cheia.
          O título e o "exerc." ao lado do número existem porque, sem eles, a fileira
          de nomes com números soltos não diz do que se trata. */}
      <div style={{ ...S.card, padding: "14px 14px 10px", marginBottom: 14 }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 10 }}>
          <div style={S.label}>Filtrar por equipamento</div>
          {equip && (
            <button onClick={() => setEquip(null)} aria-label="Limpar o filtro de equipamento"
              style={{ background: "none", border: "none", color: "#E1306C", fontWeight: 800, fontSize: 12, cursor: "pointer", padding: 0, whiteSpace: "nowrap" }}>
              ✕ limpar filtro
            </button>
          )}
        </div>
        <div style={{ fontSize: 12, color: "var(--cinza)", margin: "6px 0 12px", lineHeight: 1.5 }}>
          {equip
            ? "Mostrando só os exercícios de " + (FAMILIAS_EQUIP.find((f) => f.id === equip) || {}).nome + "."
            : "Toque no que você tem disponível. Serve para treinar em casa ou quando o aparelho está ocupado."}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
          {FAMILIAS_EQUIP.map((f) => {
            const on = equip === f.id;
            const qtd = todos.filter((e) => naFamilia(e, f)).length;
            return (
              <button key={f.id} onClick={() => setEquip(on ? null : f.id)} aria-pressed={on}
                aria-label={f.nome + ", " + qtd + " " + plural(qtd, "exercício", "exercícios")}
                style={{
                  border: "1px solid " + (on ? "#E1306C" : "var(--borda2)"),
                  background: on ? "#E1306C22" : "transparent",
                  color: on ? "#E1306C" : "var(--texto)",
                  borderRadius: 20, padding: "8px 13px", fontWeight: 800, fontSize: 12.5, cursor: "pointer",
                }}>
                {f.nome}
                <span style={{ color: on ? "#E1306C" : "var(--cinza)", fontWeight: 700 }}> · {qtd} exerc.</span>
              </button>
            );
          })}
        </div>
      </div>

      <button style={{ ...S.btn, marginBottom: 14 }} onClick={onNovoExercicio}>+ Criar exercício próprio</button>

      {buscando ? (
        <React.Fragment>
          <div style={{ ...S.label, marginBottom: 8 }}>{resultados.length} resultado(s)</div>
          {resultados.map((ex) => (
            <CardExercicio key={ex.id} ex={ex} onAbrir={() => setExercicioAberto(ex.id)} onExcluir={onExcluirCustom} />
          ))}
          {resultados.length === 0 && (
            <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)" }}>
              Nenhum exercício com esse nome. Toque em "Criar exercício próprio" para adicioná-lo.
            </div>
          )}
        </React.Fragment>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 14, marginTop: 6 }}>
          {GRUPOS.map((g) => {
            const qtd = porEquip(todos.filter((e) => e.grupo === g.id)).length;
            return (
              <button key={g.id} type="button" onClick={() => setGrupoAberto(g.id)}
                aria-label={g.nome + ", " + qtd + " " + plural(qtd, "exercício", "exercícios")}
                style={{ cursor: "pointer", textAlign: "center", background: "none", border: "none", padding: 0, font: "inherit" }}>
                <span aria-hidden="true" style={{ display: "block", width: 82, height: 82, margin: "0 auto", borderRadius: "50%", padding: 3, background: "linear-gradient(45deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5)", boxSizing: "border-box" }}>
                  <span style={{ width: "100%", height: "100%", borderRadius: "50%", background: "var(--bg)", border: "3px solid var(--bg)", boxSizing: "border-box", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30, fontWeight: 900, color: corGrupo(g) }}>
                    {g.nome[0]}
                  </span>
                </span>
                <span aria-hidden="true" style={{ display: "block", fontSize: 12, fontWeight: 700, marginTop: 7, color: "var(--texto)" }}>{g.nome}</span>
                <span aria-hidden="true" style={{ display: "block", fontSize: 10, color: "var(--cinza)", marginTop: 1 }}>{qtd} exerc.</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

// "base" é um exercício parecido: tudo vem preenchido e só a foto e o nome
// precisam de ajuste. É o que torna viável cadastrar as três remadas da
// academia em vez de desistir na segunda.
// "Remada baixa" -> "Remada baixa 2" -> "Remada baixa 3". Sugerir o número
// seguinte poupa o trabalho de inventar nome para a segunda máquina igual.
function proximoNomeVariacao(nome) {
  const m = String(nome || "").match(/^(.*?)\s*(\d+)$/);
  if (m) return m[1] + " " + (parseInt(m[2]) + 1);
  return String(nome || "") + " 2";
}

function FormNovoExercicio({ grupoSugerido, base, onSalvar, onCancelar, avisar }) {
  const [nome, setNome] = useState(base ? proximoNomeVariacao(base.nome) : "");
  const [grupo, setGrupo] = useState((base && base.grupo) || grupoSugerido || "peito");
  const [equip, setEquip] = useState((base && base.equip) || "");
  const [passosTxt, setPassosTxt] = useState(base && base.passos ? base.passos.join("\n") : "");
  const [dica, setDica] = useState((base && base.dica) || "");
  const [musc, setMusc] = useState(() => {
    const m = {};
    if (base && base.musc) {
      (base.musc.p || []).forEach((k) => { m[k] = "p"; });
      (base.musc.s || []).forEach((k) => { m[k] = "s"; });
    }
    return m;
  });
  const [foto, setFoto] = useState(null);        // blob já reduzido
  const [previa, setPrevia] = useState(null);    // endereço só para mostrar
  const [ocupado, setOcupado] = useState(false);
  const camRef = useRef(null);

  // O endereço de prévia é temporário: sem devolver, cada foto trocada vaza
  useEffect(() => () => { if (previa) { try { URL.revokeObjectURL(previa); } catch (e) {} } }, [previa]);

  const aoEscolherFoto = async (ev) => {
    const arq = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!arq) return;
    setOcupado(true);
    try {
      // 720px e compressão maior: a foto só precisa ser reconhecível de
      // relance, e vão ser dezenas delas no aparelho e dentro do backup.
      const b = await reduzirImagem(arq, 720, 0.72);
      if (previa) { try { URL.revokeObjectURL(previa); } catch (e) {} }
      setFoto(b);
      setPrevia(URL.createObjectURL(b));
    } catch (e) {
      avisar("Não consegui usar essa imagem. Tente fotografar de novo.");
    }
    setOcupado(false);
  };

  const cicloMusc = (id) => {
    setMusc((m) => {
      const atual = m[id];
      const novo = { ...m };
      if (!atual) novo[id] = "p";
      else if (atual === "p") novo[id] = "s";
      else delete novo[id];
      return novo;
    });
  };

  const salvar = async () => {
    if (!nome.trim()) { avisar("Digite o nome do exercício."); return; }
    if (ocupado) return;
    const passos = passosTxt.split("\n").map((p) => p.trim()).filter(Boolean);
    const p = Object.keys(musc).filter((k) => musc[k] === "p");
    const s = Object.keys(musc).filter((k) => musc[k] === "s");
    const id = "custom-" + Date.now();
    // A foto vai para o IndexedDB ANTES de o exercício existir na lista: se
    // gravar ao contrário, um erro aqui deixaria um exercício prometendo uma
    // foto que não existe.
    let temFoto = false;
    if (foto) {
      setOcupado(true);
      try { await guardarFotoEx(id, foto); temFoto = true; }
      catch (e) { avisar("Não consegui guardar a foto, mas o exercício foi criado."); }
      setOcupado(false);
    }
    onSalvar({
      id: id,
      custom: true,
      nome: nome.trim(),
      grupo,
      equip: equip.trim(),
      musc: { p, s },
      passos,
      dica: dica.trim(),
      foto: temFoto,
    });
  };

  const p = Object.keys(musc).filter((k) => musc[k] === "p");
  const s = Object.keys(musc).filter((k) => musc[k] === "s");

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onCancelar}>← Cancelar</button>

      {base && (
        <div style={{ ...S.card, borderColor: "#E1306C44", marginBottom: 12 }}>
          <div style={S.label}>Variação de</div>
          <div style={{ fontSize: 15, fontWeight: 800, marginTop: 4 }}>{base.nome}</div>
          <div style={{ fontSize: 12, color: "var(--cinza)", marginTop: 6, lineHeight: 1.5 }}>
            Grupo, músculos e passos já vieram copiados. Ajuste o nome, bata a foto da
            máquina da sua academia e salve.
          </div>
        </div>
      )}

      {/* A foto fica em primeiro lugar porque é por ela que se reconhece o
          aparelho: a lista de exercícios vira um álbum das máquinas da academia. */}
      <div style={S.card}>
        <div style={{ ...S.label, marginBottom: 8 }}>📷 Foto do aparelho</div>
        {previa ? (
          <React.Fragment>
            <div style={{ background: "var(--input)", borderRadius: 12, overflow: "hidden", marginBottom: 10 }}>
              <img src={previa} alt="Prévia da foto do aparelho"
                style={{ width: "100%", maxHeight: 260, objectFit: "cover", display: "block" }} />
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => camRef.current && camRef.current.click()}>
                Trocar a foto
              </button>
              <button style={{ ...S.btnGhost, flex: 1, color: "var(--perigo)", borderColor: "var(--perigo-borda)" }}
                onClick={() => { setFoto(null); setPrevia(null); }}>
                Remover
              </button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div style={{ fontSize: 13, color: "var(--cinza)", lineHeight: 1.6, marginBottom: 12 }}>
              Nem todo aparelho está em catálogo nenhum. Fotografe a máquina e você reconhece
              na hora, mesmo entre três remadas parecidas.
            </div>
            <button style={S.btn} disabled={ocupado}
              onClick={() => camRef.current && camRef.current.click()}>
              {ocupado ? "Preparando..." : "📷 Fotografar o aparelho"}
            </button>
            <div style={{ fontSize: 11, color: "var(--cinza2)", marginTop: 8, lineHeight: 1.5 }}>
              Opcional. A foto fica só neste aparelho e vai junto no backup em arquivo.
            </div>
          </React.Fragment>
        )}
        <input ref={camRef} type="file" accept="image/*" capture="environment"
          onChange={aoEscolherFoto} style={{ display: "none" }} tabIndex={-1} aria-hidden="true" />
      </div>

      <div style={S.card}>

  );

function TelaTreinos({ programas, treinos, exPorId, progAberto, setProgAberto, onTreinar, onNovaFicha,
  onEditar, onExcluirFicha, onCompartilharFicha, onNovoPrograma, onRenomearPrograma, onExcluirPrograma,
  onCompartilharPrograma, onDuplicarFicha, onDuplicarPrograma, onAssistente, onTreinoLivre, pedirConfirmacao }) {
  // Dentro de um treino: lista de fichas. Se o programa aberto foi excluído,
  // cai de volta na lista em vez de alterar estado durante o render.
  const prog = progAberto ? programas.find((p) => p.id === progAberto) : null;
  if (prog) {
    const fichas = treinos.filter((t) => t.programaId === prog.id);
    return (
      <div style={{ padding: "0 18px" }}>
        <button style={S.voltar} onClick={() => setProgAberto(null)}>← Todos os treinos</button>
        <div style={{ fontSize: 24, fontWeight: 900, marginBottom: 12 }}>{prog.nome}</div>
        <button style={{ ...S.btn, marginBottom: 14 }} onClick={() => onNovaFicha(prog.id)}>+ Nova ficha neste treino</button>
        {fichas.length === 0 && (
          <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)" }}>
            Nenhuma ficha aqui ainda. Crie a primeira (ex.: Treino A - Peito).
          </div>
        )}
        {fichas.map((t) => (
          <div key={t.id} style={S.card}>
            <div style={{ fontWeight: 900, fontSize: 18 }}>{t.nome}</div>
            <div style={{ color: "var(--cinza)", fontSize: 13, margin: "4px 0 12px" }}>
              {t.itens.map((it) => { const e = exPorId(it.exercicioId); return e ? e.nome : null; }).filter(Boolean).join(" · ") || "Sem exercícios"}
            </div>
            <button style={{ ...S.btn, marginBottom: 8 }} onClick={() => onTreinar(t)}>▶ Treinar</button>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => onEditar(t)}>Editar</button>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => onDuplicarFicha(t)}
                aria-label={"Duplicar a ficha " + t.nome}>⧉ Duplicar</button>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...S.btnGhost, flex: 1, color: "#E1306C", borderColor: "#E1306C66" }} onClick={() => onCompartilharFicha(t)}>📤 Enviar</button>
              <button style={{ ...S.btnGhost, flex: 1, color: "var(--perigo)", borderColor: "var(--perigo-borda)" }}

            </div>

      </div>

  // Lista de treinos (programas)
  return (
    <div style={{ padding: "0 18px" }}>
      <button style={{ ...S.btn, marginBottom: 10 }} onClick={onNovoPrograma}>+ Novo treino</button>
      <button style={{ ...S.btnGhost, marginBottom: 10, color: "#E1306C", borderColor: "#E1306C66" }} onClick={onAssistente}>
        🧭 Montar treino pra mim (assistente)
      </button>
      <button style={{ ...S.btnGhost, marginBottom: 14, fontWeight: 800 }} onClick={onTreinoLivre}>
        🏋️ Treino livre (montar na hora)
      </button>
      {programas.length === 0 && (
        <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)" }}>
          Crie seu primeiro treino: ele agrupa suas fichas (ex.: "Treino Iniciante" com fichas A, B e C).
        </div>
      )}
      {programas.map((p) => {
        const fichas = treinos.filter((t) => t.programaId === p.id);
        return (
          <div key={p.id} style={S.card}>
            <div style={{ fontWeight: 900, fontSize: 19 }}>📋 {p.nome}</div>
            <div style={{ color: "var(--cinza)", fontSize: 13, margin: "4px 0 12px" }}>
              {fichas.length} ficha(s){fichas.length ? ": " + fichas.map((f) => f.nome).join(" · ") : ""}
            </div>
            <button style={{ ...S.btn, marginBottom: 8 }} onClick={() => setProgAberto(p.id)}>Abrir fichas</button>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => onRenomearPrograma(p)}>Renomear</button>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => onDuplicarPrograma(p)}
                aria-label={"Duplicar o treino " + p.nome}>⧉ Duplicar</button>

              <button style={{ ...S.btnGhost, flex: 1, color: "#E1306C", borderColor: "#E1306C66" }} onClick={() => onCompartilharPrograma(p)}>📤 Enviar</button>

function TelaEditarTreino({ treinoInicial, todos, onSalvar, onCancelar, avisar }) {
  // Cada item ganha um identificador estável para que remover um do meio da lista
  // não desloque os campos de séries/repetições dos itens seguintes.
  const [t, setT] = useState(() => ({
    ...treinoInicial,
    itens: (treinoInicial.itens || []).map((it) => ({ ...it, uid: it.uid || novoUid() })),
  }));
  const [busca, setBusca] = useState("");

  const salvar = () => {
    if (!t.nome.trim()) { avisar("Dê um nome para a ficha (ex.: Treino A - Peito e Tríceps)"); return; }
    onSalvar(t);
  };
  const addEx = (id) => {
    const e = todos.find((x) => x.id === id);
    const p = e && e.cardio ? e.padrao || {} : null;
    setT({ ...t, itens: [...t.itens, { uid: novoUid(), exercicioId: id, series: p ? 1 : 3, reps: p ? p.min || 30 : 12, obs: "" }] });
  };
  const rmEx = (i) => setT({ ...t, itens: t.itens.filter((_, idx) => idx !== i) });
  const exCardioId = (id) => exCardio(todos.find((x) => x.id === id));
  const upItem = (i, campo, val) => setT({ ...t, itens: t.itens.map((it, idx) => (idx === i ? { ...it, [campo]: val } : it)) });
  // Reordenar: bi-set só faz sentido entre exercícios vizinhos, então mover
  // itens de lugar é o que permite montar o conjunto que a pessoa quer.
  const moverItem = (i, delta) => {
    const j = i + delta;
    if (j < 0 || j >= t.itens.length) return;
    const copia = [...t.itens];
    const tmp = copia[i]; copia[i] = copia[j]; copia[j] = tmp;
    setT({ ...t, itens: copia });
  };
  // Liga/desliga o agrupamento deste item com o de baixo (bi-set / tri-set)
  const alternarConjunto = (i) => {
    if (i >= t.itens.length - 1) return;
    const a = t.itens[i], b = t.itens[i + 1];
    const juntos = a.conjunto && a.conjunto === b.conjunto;
    const copia = [...t.itens];
    if (juntos) {
      // desfaz só a ligação com o de baixo; quem vem depois continua junto do b
      const idAntigo = a.conjunto;
      const novoId = "cj" + novoUid();
      for (let k = i + 1; k < copia.length && copia[k].conjunto === idAntigo; k++) {
        copia[k] = { ...copia[k], conjunto: novoId };
      }
      // se o de cima ficou sozinho no conjunto, limpa a marca
      const aindaTem = copia.some((x, k) => k !== i && x.conjunto === idAntigo);
      if (!aindaTem) copia[i] = { ...copia[i], conjunto: null };
      const bSozinho = copia.filter((x) => x.conjunto === novoId).length < 2;
      if (bSozinho) copia.forEach((x, k) => { if (x.conjunto === novoId) copia[k] = { ...x, conjunto: null }; });
    } else {
      const id = a.conjunto || b.conjunto || "cj" + novoUid();
      copia[i] = { ...a, conjunto: id };
      copia[i + 1] = { ...b, conjunto: id };
    }
    setT({ ...t, itens: copia });
  };

  const filtrados = todos.filter((e) => e.nome.toLowerCase().includes(busca.toLowerCase()));
  const exPorId = (id) => todos.find((e) => e.id === id);

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onCancelar}>← Cancelar</button>
      <input style={{ ...S.input, marginBottom: 14, fontWeight: 800 }} placeholder="Nome da ficha (ex.: Treino A)"
        aria-label="Nome da ficha"
        value={t.nome} onChange={(e) => setT({ ...t, nome: e.target.value })} />

      <div style={S.label}>Exercícios da ficha</div>
      <div style={{ margin: "8px 0 16px" }}>
        {t.itens.length === 0 && <div style={{ color: "var(--cinza)", fontSize: 14, padding: "8px 0" }}>Adicione exercícios da lista abaixo.</div>}
        {t.itens.map((it, i) => {
          const e = exPorId(it.exercicioId);
          const nomeEx = e ? e.nome : "Exercício removido";
          const proximo = t.itens[i + 1];
          const juntoComProximo = !!(it.conjunto && proximo && proximo.conjunto === it.conjunto);
          const juntoComAnterior = !!(it.conjunto && i > 0 && t.itens[i - 1].conjunto === it.conjunto);
          return (
            <div key={it.uid || i}
              style={{
                ...S.card, padding: 12,
                ...(it.conjunto ? { borderLeft: "3px solid #E1306C", marginBottom: juntoComProximo ? 4 : 12 } : {}),
              }}>
              {it.conjunto && !juntoComAnterior && (
                <div style={{ ...S.label, color: "#E1306C", fontSize: 10, marginBottom: 8 }}>
                  ⛓ {t.itens.filter((x) => x.conjunto === it.conjunto).length >= 3 ? "Tri-set" : "Bi-set"}
                </div>
              )}
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <MiniaturaExercicio ex={e} tamanho={40} />
                <div style={{ fontWeight: 800, fontSize: 15, flex: 1, minWidth: 0 }}>{nomeEx}</div>
                <button aria-label={"Mover " + nomeEx + " para cima"} disabled={i === 0} onClick={() => moverItem(i, -1)}
                  style={{ background: "none", border: "1px solid var(--borda2)", borderRadius: 7, width: 28, height: 28, color: i === 0 ? "var(--borda2)" : "var(--texto)", fontSize: 13, cursor: i === 0 ? "default" : "pointer" }}>▲</button>
                <button aria-label={"Mover " + nomeEx + " para baixo"} disabled={i === t.itens.length - 1} onClick={() => moverItem(i, 1)}
                  style={{ background: "none", border: "1px solid var(--borda2)", borderRadius: 7, width: 28, height: 28, color: i === t.itens.length - 1 ? "var(--borda2)" : "var(--texto)", fontSize: 13, cursor: "pointer" }}>▼</button>
                <button aria-label={"Tirar " + nomeEx + " da ficha"}
                  style={{ background: "none", border: "none", color: "var(--perigo)", fontSize: 18, cursor: "pointer" }} onClick={() => rmEx(i)}>✕</button>
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ ...S.label, fontSize: 10 }}>Séries</div>
                  <input type="number" style={S.inputMini} value={it.series} min={1}
                    aria-label={"Número de séries de " + nomeEx}
                    onChange={(ev) => upItem(i, "series", Math.max(1, parseInt(ev.target.value) || 1))} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ ...S.label, fontSize: 10 }}>{exCardioId(it.exercicioId) ? "Minutos" : "Repetições"}</div>
                  <input type="number" style={S.inputMini} value={it.reps} min={1}
                    aria-label={(exCardioId(it.exercicioId) ? "Minutos de " : "Número de repetições de ") + nomeEx}
                    onChange={(ev) => upItem(i, "reps", Math.max(1, parseInt(ev.target.value) || 1))} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ ...S.label, fontSize: 10 }}>Descanso</div>
                  <select style={{ ...S.inputMini, padding: "10px 4px" }} value={it.descanso || 0}
                    aria-label={"Descanso de " + nomeEx}
                    onChange={(ev) => upItem(i, "descanso", parseInt(ev.target.value) || null)}>
                    <option value={0}>geral</option>
                    {[30, 45, 60, 90, 120, 150, 180, 240].map((sg) => (
                      <option key={sg} value={sg}>{Math.floor(sg / 60)}:{sg % 60 < 10 ? "0" : ""}{sg % 60}</option>
                    ))}
                  </select>
                </div>
              </div>
              {i < t.itens.length - 1 && (
                <button onClick={() => alternarConjunto(i)} aria-pressed={juntoComProximo}
                  style={{
                    marginTop: 10, width: "100%", padding: "8px 10px", borderRadius: 9, cursor: "pointer",
                    border: "1px solid " + (juntoComProximo ? "#E1306C" : "var(--borda2)"),
                    background: juntoComProximo ? "#E1306C18" : "transparent",
                    color: juntoComProximo ? "#E1306C" : "var(--cinza)",
                    fontWeight: 800, fontSize: 12,
                  }}>
                  {juntoComProximo ? "⛓ em conjunto com o de baixo — toque para separar" : "⛓ juntar com o de baixo (bi-set)"}
                </button>
              )}
            </div>
          );
        })}
      </div>

      <button style={{ ...S.btn, marginBottom: 18 }} onClick={salvar}>Salvar ficha</button>

      <div style={S.label}>Adicionar exercício</div>
      <input style={{ ...S.input, margin: "8px 0 10px" }} placeholder="Buscar exercício..."
        type="search" aria-label="Buscar exercício para adicionar à ficha"
        value={busca} onChange={(e) => setBusca(e.target.value)} />
      {filtrados.slice(0, LIMITE_LISTA).map((ex) => (
        <div key={ex.id} style={{ ...S.card, padding: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 14 }}>
              {ex.nome}{ex.custom && <span style={S.tagCustom}>Meu</span>}
            </div>
            <div style={{ fontSize: 12, color: corGrupo(grupoPorId(ex.grupo)) }}>{grupoPorId(ex.grupo).nome}</div>
          </div>
          <button aria-label={"Adicionar " + ex.nome + " à ficha"}
            style={{ background: GRAD, color: "#FFFFFF", border: "none", borderRadius: 10, width: 34, height: 34, fontWeight: 900, fontSize: 18, cursor: "pointer" }}
            onClick={() => addEx(ex.id)}>+</button>
        </div>
      ))}
      {filtrados.length > LIMITE_LISTA && (
        <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)", fontSize: 13 }}>
          Mostrando os primeiros {LIMITE_LISTA} de {filtrados.length} exercícios.
          Use a busca acima para encontrar os demais.
        </div>
      )}
    </div>
  );
}

// ---------------- SESSÃO: registro + cronômetro com som + observações + vídeo ----------------
// O diagnóstico da esteira, dentro do cartão do exercício no treino. Responde
// o que quem sai da esteira quer saber: quanto andou, em que ritmo, quanto
// gastou, se aquilo foi treino ou passeio, e como está a semana.
function PainelCardio({ it, ex, historico, exPorId, pesoCorporal }) {
  const corre = !!(ex && ex.cardio === "corrida");
  const feitas = it.series.filter((s) => s.feito);
  const prevista = !feitas.length;
  const r = resumoCardio(prevista ? it.series : feitas, pesoCorporal, corre);
  const semana = cardioDaSemana(historico, exPorId, segundaDaSemana(new Date()).getTime(), pesoCorporal);
  // o de hoje ainda não está no histórico: soma o que já foi feito agora
  const hoje = prevista ? 0 : r.met >= 6 ? 2 * r.min : r.met >= 3 ? r.min : 0;
  const naSemana = Math.round(semana.equivalente + hoje);
  const pct = Math.min(100, Math.round((naSemana / META_CARDIO_SEMANA) * 100));
  const ult = ultimaExecucao(historico, it.exercicioId);
  const antes = ult ? resumoCardio(ult.series, pesoCorporal, corre) : null;
  if (!r.min) return null;
  const corInt = r.intensidade === "vigorosa" ? "var(--perigo)" : r.intensidade === "moderada" ? "var(--ok)" : "var(--obs)";
  const nota = r.intensidade === "leve"
    ? "Ainda não conta para a meta da OMS: suba a velocidade ou a inclinação até a respiração acelerar."
    : r.intensidade === "vigorosa"
    ? "Cada minuto vale dois na meta da OMS."
    : "Conta para a meta da OMS.";
  const medias = it.series.filter((s) => (prevista || s.feito) && ehCardio(s));
  const inclMedia = medias.length ? medias.reduce((a, s) => a + numDe(s.incl), 0) / medias.length : 0;
  let dica = null;
  if (corre && inclMedia < 1) dica = "Deixe 1% de inclinação: compensa a falta de vento e deixa o esforço igual ao da rua.";
  else if (!corre && inclMedia >= 8) dica = "Caminhada inclinada gasta perto de uma corrida leve, com bem menos impacto nos joelhos.";
  else if (!corre && r.vel >= 6.5) dica = "Acima de 6,5 km/h, trotar costuma ser mais natural que caminhar.";
  return (
    <div style={{ margin: "4px 0 10px", padding: "10px 12px", borderRadius: 12, background: "var(--bg2)", border: "1px solid var(--borda2)", fontSize: 12, lineHeight: 1.5 }}>
      <div style={{ ...S.label, fontSize: 10, marginBottom: 4 }}>{prevista ? "Previsto para hoje" : "Feito até agora"}</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: "2px 14px", fontWeight: 900, fontSize: 15 }}>
        <span>{num1(r.km)} km</span>
        <span>{fmtRitmo(r.ritmo)}</span>
        <span>~{Math.round(r.kcal)} kcal</span>
      </div>
      <div style={{ marginTop: 4 }}>
        <span style={{ color: corInt, fontWeight: 800 }}>Intensidade {r.intensidade}</span>
        <span style={{ color: "var(--cinza)" }}> ({num1(r.met)} MET). {nota}</span>
      </div>
      <div style={{ marginTop: 8 }}>
        <div style={{ display: "flex", justifyContent: "space-between", color: "var(--cinza)" }}>
          <span>Cardio na semana</span>
          <span style={{ fontWeight: 800, color: "var(--texto)" }}>{naSemana} de {META_CARDIO_SEMANA} min</span>
        </div>
        <div style={{ height: 6, borderRadius: 3, background: "var(--borda2)", marginTop: 3, overflow: "hidden" }}>
          <div style={{ width: pct + "%", height: "100%", background: GRAD }} />
        </div>
      </div>
      {antes && antes.min > 0 && (
        <div style={{ marginTop: 6, color: "var(--cinza)" }}>
          Última vez: {num1(antes.km)} km em {Math.round(antes.min)} min ({fmtRitmo(antes.ritmo)})
          {!prevista && Math.abs(r.km - antes.km) >= 0.05 && (
            <span style={{ fontWeight: 800, color: r.km > antes.km ? "var(--ok)" : "var(--cinza)" }}>
              {" · hoje " + (r.km > antes.km ? "+" : "−") + num1(Math.abs(r.km - antes.km)) + " km"}
            </span>
          )}
        </div>
      )}
      {dica && <div style={{ marginTop: 6, color: "var(--obs)" }}>💡 {dica}</div>}
      <div style={{ marginTop: 6, fontSize: 10, color: "var(--cinza2)" }}>
        Distância e ritmo saem do tempo e da velocidade. Calorias pela equação do ACSM
        {pesoCorporal ? " com " + num1(pesoCorporal) + " kg" : " com 75 kg — registre seu peso em Histórico › Corpo para acertar a conta"}.
      </div>
    </div>
  );
}

function TelaSessao({ sessao, setSessao, exPorId, todos, historico, celebrar, descanso, setDescanso, som, setSom, onFinalizar, onDescartar, onVoltar, pedirConfirmacao, pesoCorporal,
  bpm, cardioEstado, onConectarCardio, onDesconectarCardio, vozCfg, contarAlto, onAlternarContagem,
  autoSerie, onAlternarAuto,
  acoesVoz, vozAtiva, vozBarra, vozAnimado, onDescansando, responderVoz,
  dicas, onDicaVista, onLigarVoz, onEscolaVoz }) {
  // Recorde e última execução de cada exercício: servem de referência ao lado de
  // cada série e permitem festejar o recorde no instante em que ele acontece.
  const recordes = useMemo(() => recordesPorExercicio(historico), [historico]);
  const ultimas = useMemo(() => {
    const m = {};
    [...historico]
      .sort((a, b) => new Date(b.data) - new Date(a.data))
      .forEach((h) => (h.itens || []).forEach((it) => {
        if (!m[it.exercicioId] && (it.series || []).length) m[it.exercicioId] = it.series;
      }));
    return m;
  }, [historico]);
  const prFestejado = useRef({});
  // O cronômetro de isometria marca a série ao acabar; a ref evita depender
  // de marcarSerie nas dependências do efeito (que mudaria a cada tecla).
  const marcarSerieRef = useRef(() => {});

  const [mostrarAdd, setMostrarAdd] = useState(false);
  const [demo, setDemo] = useState(null);        // exercício aberto na demonstração
  const [trocando, setTrocando] = useState(null); // índice do exercício sendo substituído
  const [crono, setCrono] = useState(null);       // isometria em andamento: { ei, si, fim }
  const [restaCrono, setRestaCrono] = useState(0);
  const [buscaEx, setBuscaEx] = useState("");
  const [fimDescanso, setFimDescanso] = useState(null);
  const [totalDescanso, setTotalDescanso] = useState(descanso);
  const [agora, setAgora] = useState(Date.now());
  const [avisou, setAvisou] = useState(false);
  const ultimoBipe = useRef(null);
  // Com a tela apagada o Android cala a síntese de voz da página, mas o som
  // continua (os bipes dos últimos segundos chegavam, a frase não). Então a
  // frase espera a tela acender, e o que avisa na hora é a melodia.
  const falaPendente = useRef(null);
  const calarToque = useRef(null);
  const falarRef = useRef(() => {});
  const [calouNoFundo, setCalouNoFundo] = useState(false);

  useEffect(() => {
    if (!fimDescanso) return;
    const iv = setInterval(() => setAgora(Date.now()), 250);
    return () => clearInterval(iv);
  }, [fimDescanso]);

  useEffect(() => { if (onDescansando) onDescansando(!!fimDescanso); }, [fimDescanso, onDescansando]);
  useEffect(() => () => { if (onDescansando) onDescansando(false); }, [onDescansando]);

  const restante = fimDescanso ? Math.max(0, Math.ceil((fimDescanso - agora) / 1000)) : 0;
  const acabou = fimDescanso && restante === 0;

  // Bipes de contagem regressiva (3, 2, 1)
  useEffect(() => {
    if (!fimDescanso || acabou) return;
    if (restante <= 3 && restante > 0 && ultimoBipe.current !== restante) {
      ultimoBipe.current = restante;
      if (som) beep(880, 0.12, 0.25);
    }
  }, [restante, fimDescanso, acabou, som]);

  falarRef.current = (frase) => {
    if (vozAtiva && responderVoz) responderVoz(frase, true);
    else narrarVoz(frase, vozCfg);
  };
  // A tela acendeu: cala a repetição da melodia e diz o que ficou guardado.
  // Depois de três minutos a frase já não é notícia, e não é dita.
  useEffect(() => {
    const aoVoltar = () => {
      if (document.visibilityState !== "visible") return;
      if (calarToque.current) { calarToque.current(); calarToque.current = null; }
      const p = falaPendente.current;
      falaPendente.current = null;
      if (p && Date.now() - p.t < 180000) setTimeout(() => falarRef.current(p.frase), 400);
    };
    document.addEventListener("visibilitychange", aoVoltar);
    return () => document.removeEventListener("visibilitychange", aoVoltar);
  }, []);
  useEffect(() => () => { if (calarToque.current) calarToque.current(); }, []);

  // Som + vibração de finalização
  useEffect(() => {
    if (acabou && !avisou) {
      setAvisou(true);
      if (som) {
        beep(660, 0.22, 0.3);
        setTimeout(() => beep(990, 0.45, 0.3), 240);
      }
      try { if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch (e) {}
      // Com o celular no bolso, o bipe diz "acabou" mas não diz o que vem agora.
      // Essa é a frase que evita tirar o telefone do bolso entre as séries — e
      // ela não pode depender do microfone estar ligado: falar e ouvir são
      // coisas diferentes, e quem treina de fone quer o retorno de qualquer jeito.
      const prox = alvo ? " Próxima: série " + (alvo.si + 1) + " de " + nomeDoItem(alvo.ei) + "." : "";
      const frase = (vozAnimado ? animo(ANIMO_VOLTA, "volta") + " Descanso fechado." : "Descanso concluído.") + prox;
      const escondido = typeof document !== "undefined" && document.visibilityState !== "visible";
      setCalouNoFundo(escondido);
      if (escondido) {
        falaPendente.current = { frase: frase, t: Date.now() };
        if (som) calarToque.current = melodia(TOQUE_VOLTA);
      } else if (vozAtiva && responderVoz) responderVoz(frase, true);
      else narrarVoz(frase, vozCfg);
      // E se a tela estiver apagada ou o app atrás de outro, o áudio pode nem
      // tocar: a notificação é o que atravessa isso.
      avisarEmSegundoPlano("Acabou o descanso", alvo ? "Próxima: " + nomeDoItem(alvo.ei) : "Volta para a série.");
    }
  }, [acabou, avisou, som]);

  // Cronômetro da isometria: conta os segundos da prancha e marca a série no fim.
  // Sem isso a pessoa precisa de um cronômetro à parte para fazer um exercício
  // que o próprio app manda "segurar pelo tempo definido".
  useEffect(() => {
    if (!crono) return;
    // Numa prancha de 60 segundos a pessoa está de cara para o chão e não vê a
    // tela. Saber que passou da metade é o que faz aguentar o resto.
    const total = Math.max(1, Math.round((crono.fim - crono.inicio) / 1000) || 0);
    const avisado = {};
    const tick = () => {
      const resta = Math.max(0, Math.ceil((crono.fim - Date.now()) / 1000));
      setRestaCrono(resta);
      if (vozAtiva && responderVoz) {
        const meio = Math.round(total / 2);
        if (total >= 24 && resta === meio && !avisado.meio) { avisado.meio = true; responderVoz("Metade.", true); }
        else if (total >= 16 && resta === 10 && !avisado.dez) { avisado.dez = true; responderVoz("Faltam 10 segundos. Segura.", true); }
      }
      if (resta <= 3 && resta > 0 && som) beep(880, 0.1, 0.22);
      if (resta === 0) {
        if (som) { beep(660, 0.2, 0.3); setTimeout(() => beep(990, 0.4, 0.3), 220); }
        try { if (navigator.vibrate) navigator.vibrate([250, 100, 250]); } catch (e) {}
        const alvo = crono;
        setCrono(null);
        marcarSerieRef.current(alvo.ei, alvo.si);
      }
    };
    tick();
    const iv = setInterval(tick, 1000);
    return () => clearInterval(iv);
  }, [crono, som, vozAtiva, responderVoz]);

  // Segura a tela acesa enquanto o descanso corre e devolve o controle ao terminar
  useEffect(() => {
    if (!fimDescanso || acabou) { desligarTravaTela(); return; }
    ligarTravaTela();
    // o sistema solta a trava sozinho quando o app vai para segundo plano: ao voltar, repõe
    const aoVoltar = () => {
      if (document.visibilityState === "visible") {
        ligarTravaTela();
        try { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); } catch (e) {}
      }
    };
    document.addEventListener("visibilitychange", aoVoltar);
    return () => {
      document.removeEventListener("visibilitychange", aoVoltar);
      desligarTravaTela();
    };
  }, [fimDescanso, acabou]);

  // Cada exercício pode ter seu próprio descanso: 45s numa rosca e 3min num
  // agachamento não são a mesma coisa. Sem valor próprio, vale o descanso geral.
  const descansoDe = (it) => (it && it.descanso ? it.descanso : descanso);
  const mudarDescansoDe = (ei, delta) => {
    const atual = descansoDe(sessao.itens[ei]);
    const novo = Math.max(15, Math.min(600, atual + delta));
    setSessao({ ...sessao, itens: sessao.itens.map((it, i) => (i === ei ? { ...it, descanso: novo } : it)) });
  };

  const iniciarDescanso = (segundos) => {
    const seg = segundos || descanso;
    setTotalDescanso(seg);
    setFimDescanso(Date.now() + seg * 1000);
    setAvisou(false);
    ultimoBipe.current = null;
    if (som) beep(520, 0.08, 0.15); // clique de início (também "desbloqueia" o áudio no celular)
  };
  const esticarDescanso = (seg) => {
    const s = Math.max(5, Math.round(seg || 15));
    setFimDescanso((f) => (f ? f + s * 1000 : Date.now() + s * 1000));
    setTotalDescanso((tt) => tt + s);
    setAvisou(false);
    ultimoBipe.current = null;
  };
  const mais15 = () => esticarDescanso(15);
  const fecharDescanso = () => { setFimDescanso(null); setAvisou(false); ultimoBipe.current = null; };

  const upSerie = (ei, si, campo, val) => {
    const itens = sessao.itens.map((it, i) =>
      i !== ei ? it : { ...it, series: it.series.map((s, j) => (j !== si ? s : { ...s, [campo]: val })) }
    );
    setSessao({ ...sessao, itens });
    // O foco mudava só pela voz: quem marcava a flexora no ✓ continuava com o
    // alvo parado no primeiro exercício pendente da ficha.
    if (ei !== focoEi) setFocoEi(ei);
  };

  const upObs = (ei, val) => {
    const itens = sessao.itens.map((it, i) => (i !== ei ? it : { ...it, obs: val }));
    setSessao({ ...sessao, itens });
  };

  // Adiciona uma série extra no exercício, repetindo o peso/reps da última
  const addSerie = (ei) => {
    const itens = sessao.itens.map((it, i) => {
      if (i !== ei) return it;
      const ult = it.series[it.series.length - 1];
      // repete o formato da última série: segundos na isometria, peso/reps no resto
      if (ult && ehTempo(ult)) {
        const extra = ehCardio(ult) ? { vel: ult.vel, incl: ult.incl } : {};
        return { ...it, series: [...it.series, { segundos: ult.segundos || "30", ...extra, feito: false }] };
      }
      const base = ult || { peso: "", reps: "12" };
      return { ...it, series: [...it.series, { peso: base.peso || "", reps: base.reps || "12", feito: false }] };
    });
    setSessao({ ...sessao, itens });
  };

  // Remove a última série (não deixa ficar sem nenhuma)
  const rmSerie = (ei) => {
    const itens = sessao.itens.map((it, i) => {
      if (i !== ei || it.series.length <= 1) return it;
      return { ...it, series: it.series.slice(0, -1) };
    });
    setSessao({ ...sessao, itens });
  };

  // Adiciona um exercício novo no meio do treino (treino livre).
  // Já entra com a carga da última vez, para não precisar lembrar de nada.
  const addExercicio = (idEx) => {
    const sug = sugerirCarga(historico, idEx, 12);
    setSessao({
      ...sessao,
      itens: [...sessao.itens, {
        uid: novoUid(), exercicioId: idEx, obs: "",
        sugerido: sug || null,
        series: montarSeries(exPorId(idEx), 1, exCardio(exPorId(idEx)) ? null : 12, sug),
      }],
    });
    setBuscaEx("");
    setMostrarAdd(false);
  };

  // Remove um exercício inteiro do treino
  const rmExercicio = (ei) => {
    const ex = exPorId(sessao.itens[ei].exercicioId);
    pedirConfirmacao("Remover " + (ex ? ex.nome : "este exercício") + " do treino?", () => {
      setSessao({ ...sessao, itens: sessao.itens.filter((_, i) => i !== ei) });
    });
  };

  // Aparelho ocupado? Troca o exercício por outro do mesmo grupo, preferindo
  // os que usam o mesmo equipamento, e mantém a estrutura de séries.
  const alternativasPara = (idEx) => {
    const ex = exPorId(idEx);
    if (!ex) return [];
    const jaNoTreino = {};
    sessao.itens.forEach((it) => { jaNoTreino[it.exercicioId] = true; });
    const mesmoEquip = (e) => (e.equip || "").toLowerCase() === (ex.equip || "").toLowerCase();
    return todos
      .filter((e) => e.grupo === ex.grupo && e.id !== idEx && !jaNoTreino[e.id])
      .sort((a, b) => (mesmoEquip(b) ? 1 : 0) - (mesmoEquip(a) ? 1 : 0) || a.nome.localeCompare(b.nome));
  };
  const substituirExercicio = (ei, novoId) => {
    const item = sessao.itens[ei];
    const sug = sugerirCarga(historico, novoId, parseInt(item.series[0] && item.series[0].reps) || 12);
    setSessao({
      ...sessao,
      itens: sessao.itens.map((it, i) => (i !== ei ? it : {
        ...it,
        exercicioId: novoId,
        obs: "",
        sugerido: sug || null,
        // as séries são mantidas em quantidade, mas a carga passa a ser a do exercício novo
        series: montarSeries(exPorId(novoId), it.series.length, (it.series[0] && it.series[0].reps) || 12, sug),
      })),
    });
    setTrocando(null);
  };

  const alternarAquecimento = (ei, si) => {
    const atual = !!sessao.itens[ei].series[si].aquec;
    upSerie(ei, si, "aquec", !atual);
  };
  const iniciarIsometria = (ei, si) => {
    const seg = parseInt(sessao.itens[ei].series[si].segundos) || 0;
    if (seg <= 0) return;
    if (som) beep(520, 0.08, 0.15);
    setRestaCrono(seg);
    setCrono({ ei, si, inicio: Date.now(), fim: Date.now() + seg * 1000 });
  };

  const marcarSerie = (ei, si) => {
    const item = sessao.itens[ei];
    const serie = item.series[si];
    const jaFeita = serie.feito;
    upSerie(ei, si, "feito", !jaFeita);
    if (jaFeita) return;
    // Em bi-set/tri-set não se descansa no meio: o cronômetro só começa depois
    // da série do último exercício do conjunto.
    const seguinte = sessao.itens[ei + 1];
    const noMeioDoConjunto = !!(item.conjunto && seguinte && seguinte.conjunto === item.conjunto);
    if (!noMeioDoConjunto) iniciarDescanso(descansoDe(item));
    // Confirmar em voz o que acabou de ser anotado: com o celular no bolso, o ✓
    // na tela não existe. Frase curta de propósito — é confirmação, não relatório.
    const quantas = item.series.length;
    const seg = noMeioDoConjunto ? 0 : descansoDe(item) || descanso;
    narrarVoz(
      "Série " + (si + 1) + " de " + quantas + " anotada." +
      (seg ? " Descanso de " + textoDuracao(seg) + "." : " Emenda no próximo."),
      vozCfg
    );
    // O ✓ na tela também merece a comemoração falada quando o Jarvis está ouvindo
    const recorde = conferirRecorde(item, serie);
    if (recorde && vozAtiva && responderVoz) responderVoz(recorde, true);
    else if (recorde) narrarVoz(recorde, vozCfg, true);
  };

  // Festeja o recorde no instante em que ele acontece. Fica numa função à parte
  // porque a série pode ser marcada pelo botão ✓ ou ditada ao Jarvis, e os dois
  // caminhos precisam festejar igual.
  // Devolve a frase do recorde (ou nada). Quem chamou decide se fala: ditar a
  // série e comemorar são duas falas que não podem atropelar uma à outra.
  const conferirRecorde = (item, serie) => {
    // Aquecimento não bate recorde: ele existe para preparar, não para medir.
    if (ehAquecimento(serie)) return null;

    const rec = recordes[item.exercicioId];
    const ex = exPorId(item.exercicioId);
    if (!rec) return null;

    // Na esteira, ficar mais tempo não é "segurar mais": o recorde de tempo fica
    // no selo "mais longo", sem festa de prancha.
    if (ehCardio(serie)) return null;
    // Isometria compara segundos; o resto compara carga.
    if (ehTempo(serie)) {
      const seg = segundosDe(serie);
      const chaveT = item.uid + ":t" + seg;
      if (seg > 0 && rec.segundos > 0 && seg > rec.segundos && !prFestejado.current[chaveT]) {
        prFestejado.current[chaveT] = true;
        if (som) setTimeout(() => { beep(784, 0.12, 0.28); setTimeout(() => beep(1175, 0.3, 0.28), 130); }, 120);
        celebrar({
          icone: "🏆",
          titulo: "Novo recorde pessoal",
          destaque: (ex ? ex.nome : "Exercício") + "\n" + seg + " segundos",
          detalhe: "Seu melhor era " + rec.segundos + "s. Você segurou " + (seg - rec.segundos) + "s mais!",
        });
        return "Recorde! " + seg + " segundos em " + (ex ? nomeFalado(ex.nome) : "isometria") + ". Seu melhor era " + rec.segundos + ".";
      }
      return null;
    }

    const peso = cargaDe(serie);
    const reps = repsDe(serie);
    const chave = item.uid + ":" + peso;
    if (peso > 0 && reps > 0 && rec.peso > 0 && peso > rec.peso && !prFestejado.current[chave]) {
      prFestejado.current[chave] = true;
      const ganho = Math.round((peso - rec.peso) * 10) / 10;
      if (som) setTimeout(() => { beep(784, 0.12, 0.28); setTimeout(() => beep(1175, 0.3, 0.28), 130); }, 120);
      celebrar({
        icone: "🏆",
        titulo: "Novo recorde pessoal",
        destaque: (ex ? ex.nome : "Exercício") + "\n" + peso + " kg × " + reps,
        detalhe: "Seu melhor era " + rec.peso + " kg. Você subiu " + ganho.toLocaleString("pt-BR") + " kg!",
      });
      return "Recorde pessoal! " + fmtNum(peso) + " quilos em " + (ex ? nomeFalado(ex.nome) : "exercício") +
        ". Seu melhor era " + fmtNum(rec.peso) + ". Subiu " + fmtNum(ganho) + ".";
    }
    return null;
  };
  marcarSerieRef.current = marcarSerie;

  // ---------- JARVIS DENTRO DO TREINO ----------
  // O ouvinte mora no componente raiz, mas marcar série, cronometrar o descanso
  // e trocar exercício só existe aqui. As funções são penduradas numa ref
  // durante o render — o mesmo caminho do marcarSerieRef logo acima.
  const [focoEi, setFocoEi] = useState(null);
  const [scanner, setScanner] = useState(false);   // câmera contando repetições
  const ultimoAnotado = useRef(null);

  // O "alvo" é onde a próxima frase vai cair. É o que permite dizer só
  // "Jarvis, 80 por 10", sem repetir o nome do exercício. Ver alvoDaSessao.
  const alvo = useMemo(() => alvoDaSessao(sessao.itens, focoEi), [sessao, focoEi]);

  const nomeDoItem = (ei) => {
    const it = sessao.itens[ei];
    const ex = it && exPorId(it.exercicioId);
    return ex ? nomeFalado(ex.nome) : "exercício";
  };
  const irPara = (ei) => {
    const it = sessao.itens[ei];
    if (!it) return;
    setFocoEi(ei);
    setTimeout(() => {
      try {
        const el = document.getElementById("item-" + it.uid);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      } catch (e) {}
    }, 60);
  };
  const descreverItem = (ei) => {
    const it = sessao.itens[ei];
    if (!it) return "";
    const falta = it.series.filter((s) => !s.feito).length;
    let txt = nomeDoItem(ei) + ". " + (falta ? falta + " " + plural(falta, "série", "séries") + " pela frente" : "todas as séries já marcadas");
    if (it.sugerido && it.sugerido.peso) txt += ". Comece com " + fmtNum(it.sugerido.peso) + " quilos";
    else if (it.sugerido && it.sugerido.segundos) txt += ". Tente " + it.sugerido.segundos + " segundos";
    else {
      const u = ultimas[it.exercicioId];
      if (u && u.length) {
        const s0 = u[0];
        txt += ". Última vez: " + (ehCardio(s0) ? falaCardio(s0) : ehTempo(s0) ? segundosDe(s0) + " segundos" : fmtNum(s0.peso) + " quilos por " + repsDe(s0));
      }
    }
    return txt + ".";
  };

  // "40 de cada lado" só vira 2×40 + barra onde existe barra para somar.
  // No leg press ou na polia, a conta é só o dobro — e a resposta sempre diz a
  // soma em voz alta, para o erro aparecer na hora.
  const temBarraParaSomar = (ex) => {
    const eq = semAcento(ex && ex.equip);
    return eq.indexOf("barra") >= 0 && eq.indexOf("fixa") < 0;
  };

  const anotarPorVoz = (c) => {
    let itens = sessao.itens.slice();
    let ei = -1;
    let dito = acharExercicio(c.frase, todos, itens.map((it) => it.exercicioId));
    // "Corri 20 minutos a 9 por hora" sem falar "esteira" é a esteira da ficha,
    // ou uma nova: caminhada ou corrida pela velocidade dita.
    if (c.cardio && !exCardio(dito)) {
      const naFicha = itens.find((it) => exCardio(exPorId(it.exercicioId)));
      dito = naFicha ? exPorId(naFicha.exercicioId) : exPorId((parseFloat(c.vel) || 0) >= 7 ? "esteira-corrida" : "esteira-caminhada");
    }
    if (dito) {
      ei = itens.findIndex((it) => it.exercicioId === dito.id);
      if (ei < 0) {
        // Falou um exercício que não está no treino: entra agora, já com a série
        const sug = sugerirCarga(historico, dito.id, c.reps || 12);
        itens = itens.concat([{ uid: novoUid(), exercicioId: dito.id, obs: "", sugerido: sug || null, series: montarSeries(dito, 1, exCardio(dito) ? (c.segundos ? Math.round(c.segundos / 60) : null) : c.reps || 12, sug) }]);
        ei = itens.length - 1;
      }
    } else if (alvo) ei = alvo.ei;
    if (ei < 0) return { ok: false, fala: "O treino está vazio. Diga: Jarvis, adiciona supino reto." };

    const item = itens[ei];
    const ex = exPorId(item.exercicioId);
    const isometria = !!(ex && ex.tempo);
    let series = item.series.slice();
    let si = series.findIndex((s) => !s.feito);
    if (si < 0) {
      const ult = series[series.length - 1] || {};
      series = series.concat([isometria || ehTempo(ult)
        ? { segundos: ult.segundos || "", ...(ehCardio(ult) ? { vel: ult.vel, incl: ult.incl } : {}), feito: false }
        : { peso: ult.peso || "", reps: ult.reps || "", feito: false }]);
      si = series.length - 1;
    }
    const base = series[si];
    const valores = {};
    let extra = "";
    if (exCardio(ex)) {
      const seg = c.segundos != null ? c.segundos : parseInt(base.segundos) || 0;
      if (!seg) return { ok: false, fala: "Quantos minutos? Diga, por exemplo: 30 minutos a 6 por hora." };
      valores.segundos = String(Math.round(seg));
      if (c.vel != null) valores.vel = String(c.vel);
      if (c.incl != null) valores.incl = String(c.incl);
      if (!numDe(c.vel != null ? c.vel : base.vel)) return { ok: false, fala: "Qual a velocidade? Diga, por exemplo: 30 minutos a 6 por hora." };
    } else if (isometria) {
      const seg = c.segundos != null ? c.segundos : (c.reps != null ? c.reps : parseInt(base.segundos) || 0);
      if (!seg) return { ok: false, fala: "Quantos segundos você segurou?" };
      valores.segundos = String(Math.round(seg));
    } else {
      let peso = c.peso;
      if (peso != null && c.porLado) {
        const barra = temBarraParaSomar(ex) ? (parseFloat(vozBarra) || 0) : 0;
        const total = peso * 2 + barra;
        extra = " " + fmtNum(peso) + " de cada lado" + (barra ? " mais a barra de " + fmtNum(barra) : "") + " dá " + fmtNum(total) + ".";
        peso = total;
      }
      const reps = c.reps != null ? c.reps : parseInt(base.reps) || 0;
      if (!reps) return { ok: false, fala: "Faltou a repetição. Diga, por exemplo: 80 por 10." };
      valores.reps = String(Math.round(reps));
      if (peso != null) valores.peso = String(Math.round(peso * 100) / 100);
    }
    if (c.aquecimento) valores.aquec = true;

    const nova = Object.assign({}, base, valores, { feito: true });
    series[si] = nova;
    itens[ei] = Object.assign({}, item, { series: series });
    setSessao(Object.assign({}, sessao, { itens: itens }));
    setFocoEi(ei);
    ultimoAnotado.current = { uid: item.uid, si: si };

    // Daqui em diante é o mesmo caminho do botão ✓: descanso e recorde.
    const seguinte = itens[ei + 1];
    const noMeioDoConjunto = !!(item.conjunto && seguinte && seguinte.conjunto === item.conjunto);
    const segDescanso = descansoDe(item);
    if (!noMeioDoConjunto) iniciarDescanso(segDescanso);
    const recorde = conferirRecorde(itens[ei], nova);

    const feito = exCardio(ex)
      ? (() => {
        const m = medirCardio(Object.assign({}, base, valores), pesoCorporal, ex.cardio === "corrida");
        return falaCardio(Object.assign({}, base, valores)) + ". " + num1(m.km) + " quilômetros, cerca de " + Math.round(m.kcal) + " calorias";
      })()
      : isometria
      ? valores.segundos + " segundos"
      : (valores.peso ? fmtNum(valores.peso) + " quilos por " + valores.reps : valores.reps + " repetições");
    const restantes = series.filter((s) => !s.feito).length;
    // A confirmação diz SEMPRE o que entendeu — exercício, carga e repetições —
    // porque o reconhecimento erra e é ouvindo o número de volta que dá para pegar.
    const nomeEx = ex ? nomeFalado(ex.nome) : "exercício";
    let fala = vozAnimado
      ? animo(ANIMO_ANOTOU, "anotou") + " Anotei " + nomeEx + ", " + feito + "." + extra
      : "Anotei: " + nomeEx + ", " + feito + "." + extra;
    if (c.aquecimento) fala += " Contei como aquecimento.";
    // No modo direto a pessoa escolheu respostas enxutas: a posição da série já
    // está na tela, e ouvi-la vinte vezes por treino cansa.
    if (vozAnimado) fala += " Série " + (si + 1) + " de " + series.length + ".";
    if (noMeioDoConjunto) fala += " Emenda no próximo, sem descanso.";
    else fala += " Descanso de " + tempoFalado(segDescanso) + ".";
    if (!restantes && series.length > 1) fala += " Esse exercício terminou.";
    // O recorde vem na frente: é a notícia boa, e atrasá-la seria desperdiçá-la.
    if (recorde) fala = recorde + " " + fala;
    return { ok: true, fala: fala };
  };

  const desfazerPorVoz = () => {
    let ei = -1, si = -1;
    const marca = ultimoAnotado.current;
    if (marca) {
      const i = sessao.itens.findIndex((it) => it.uid === marca.uid);
      const s = i >= 0 && sessao.itens[i].series[marca.si];
      if (s && s.feito) { ei = i; si = marca.si; }
    }
    if (ei < 0) {
      for (let i = sessao.itens.length - 1; i >= 0 && ei < 0; i--) {
        for (let j = sessao.itens[i].series.length - 1; j >= 0; j--) {
          if (sessao.itens[i].series[j].feito) { ei = i; si = j; break; }
        }
      }
    }
    if (ei < 0) return { ok: false, fala: "Não há nenhuma série marcada para apagar." };
    upSerie(ei, si, "feito", false);
    fecharDescanso();
    ultimoAnotado.current = null;
    setFocoEi(ei);
    return { ok: true, fala: "Desmarquei a série " + (si + 1) + " de " + nomeDoItem(ei) + ". Pode ditar de novo." };
  };

  // O scanner conta; quem grava é o mesmo anotarPorVoz de sempre. A contagem
  // entra como repetições da série da vez, com o peso que estiver na barra.
  const registrarDoScanner = (repsContadas, pesoDito) => {
    const r = anotarPorVoz({
      tipo: "anotar",
      peso: pesoDito !== "" && pesoDito != null ? parseFloat(pesoDito) : null,
      reps: parseInt(repsContadas) || null,
      segundos: null, porLado: false, aquecimento: false, frase: "",
    });
    setScanner(false);
    if (r && responderVoz) responderVoz(r.fala, r.ok);
    return r;
  };

  const executarVoz = (c) => {
    const itens = sessao.itens;
    const idsNoTreino = itens.map((it) => it.exercicioId);
    switch (c.tipo) {
      case "descanso": {
        const padrao = alvo ? descansoDe(itens[alvo.ei]) : descanso;
        const seg = Math.max(5, Math.min(1800, c.segundos || padrao));
        iniciarDescanso(seg);
        return { ok: true, fala: "Descansando " + tempoFalado(seg) + ". Eu aviso na hora de voltar." };
      }
      case "pularDescanso":
        if (!fimDescanso) return { ok: false, fala: "Não tem descanso correndo agora." };
        fecharDescanso();
        return { ok: true, fala: "Descanso encerrado. Bora." };
      case "esticarDescanso": {
        const s = Math.max(5, Math.min(600, c.segundos || 15));
        esticarDescanso(s);
        return { ok: true, fala: "Mais " + tempoFalado(s) + "." };
      }
      case "anotar": return anotarPorVoz(c);
      case "desfazer": return desfazerPorVoz();
      case "maisSerie": {
        if (!itens.length) return { ok: false, fala: "O treino está vazio." };
        // "mais uma série de cadeira flexora" tem destino próprio
        const ditoS = c.frase ? acharExercicio(c.frase, todos, idsNoTreino) : null;
        let eiS = ditoS ? itens.findIndex((it) => it.exercicioId === ditoS.id) : -1;
        if (eiS < 0) eiS = alvo ? alvo.ei : itens.length - 1;
        addSerie(eiS);
        irPara(eiS);
        return { ok: true, fala: "Mais uma série em " + nomeDoItem(eiS) + "." };
      }
      case "irExercicio": {
        const destino = acharExercicio(c.frase, todos, idsNoTreino);
        if (!destino) return { ok: false, fala: "Para qual exercício? Diga o nome, por exemplo: Jarvis, vai para o leg press." };
        const jaTem = itens.findIndex((it) => it.exercicioId === destino.id);
        if (jaTem >= 0) { irPara(jaTem); return { ok: true, fala: descreverItem(jaTem) }; }
        // Pediu um exercício que não está na ficha: entra agora, no fim
        addExercicio(destino.id);
        setFocoEi(itens.length);
        return { ok: true, fala: nomeFalado(destino.nome) + " não estava no treino. Adicionei no fim e já estou nele." };
      }
      case "repetir": {
        if (!alvo) return { ok: false, fala: "O treino está vazio." };
        const itR = itens[alvo.ei];
        const ultR = itR.series.slice().reverse().find((s) => s.feito);
        if (!ultR) return { ok: false, fala: "Ainda não há série marcada aqui para repetir." };
        return anotarPorVoz({
          tipo: "anotar",
          peso: ehTempo(ultR) ? null : (ultR.peso !== "" && ultR.peso != null ? parseFloat(ultR.peso) : null),
          reps: ehTempo(ultR) ? null : (parseInt(ultR.reps) || null),
          segundos: ehTempo(ultR) ? segundosDe(ultR) : null,
          porLado: false, aquecimento: !!ultR.aquec, frase: "",
        });
      }
      case "observacao": {
        // Altura do banco, pegada, número do pino: o detalhe que se esquece entre
        // um treino e outro e que hoje só dá para escrever com o dedo.
        if (!alvo) return { ok: false, fala: "O treino está vazio." };
        const mObs = String(c.cru || "").match(/observa\S*\s*(?:que|:|,)?\s*(.+)$/i);
        const txtObs = (mObs && mObs[1] ? mObs[1] : "").trim().replace(/^[:,\s]+/, "");
        if (txtObs.length < 2) return { ok: false, fala: "O que eu anoto na observação?" };
        const atualObs = itens[alvo.ei].obs || "";
        upObs(alvo.ei, atualObs ? atualObs + " · " + txtObs : txtObs);
        irPara(alvo.ei);
        return { ok: true, fala: "Anotei em " + nomeDoItem(alvo.ei) + ": " + txtObs };
      }
      case "corrigir": {
        // Mexe na última série MARCADA, que é a que acabou de ser ditada errada.
        let eiC = -1, siC = -1;
        const marcaC = ultimoAnotado.current;
        if (marcaC) {
          const i = itens.findIndex((it) => it.uid === marcaC.uid);
          const s = i >= 0 && itens[i].series[marcaC.si];
          if (s && s.feito) { eiC = i; siC = marcaC.si; }
        }
        if (eiC < 0) {
          for (let i = itens.length - 1; i >= 0 && eiC < 0; i--) {
            for (let j = itens[i].series.length - 1; j >= 0; j--) {
              if (itens[i].series[j].feito) { eiC = i; siC = j; break; }
            }
          }
        }
        if (eiC < 0) return { ok: false, fala: "Não há série marcada para corrigir." };
        const campoC = c.campo || "peso";
        upSerie(eiC, siC, campoC, String(c.valor));
        irPara(eiC);
        const comoC = campoC === "peso" ? fmtNum(c.valor) + " quilos"
          : campoC === "reps" ? c.valor + " repetições" : c.valor + " segundos";
        return { ok: true, fala: "Corrigi para " + comoC + " na série " + (siC + 1) + " de " + nomeDoItem(eiC) + "." };
      }
      case "scanner": {
        if (!alvo) return { ok: false, fala: "O treino está vazio. Adicione um exercício primeiro." };
        irPara(alvo.ei);
        setScanner(true);
        return { ok: true, fala: "Scanner aberto. Apoie o celular de pé, com o corpo inteiro na tela." };
      }
      case "tempoDescanso": {
        if (!fimDescanso) return { ok: true, fala: "Não tem descanso correndo agora." };
        const resta = Math.max(0, Math.ceil((fimDescanso - Date.now()) / 1000));
        return { ok: true, fala: resta <= 0 ? "Acabou. Pode ir." : "Faltam " + tempoFalado(resta) + "." };
      }
      case "proximo": {
        if (!itens.length) return { ok: false, fala: "O treino está vazio." };
        const base = alvo ? alvo.ei : -1;
        const prox = Math.min(itens.length - 1, base + 1);
        if (prox === base) return { ok: false, fala: "Esse já é o último exercício do treino." };
        irPara(prox);
        return { ok: true, fala: "Agora: " + descreverItem(prox) };
      }
      case "anterior": {
        if (!itens.length) return { ok: false, fala: "O treino está vazio." };
        const base = alvo ? alvo.ei : 0;
        if (base <= 0) return { ok: false, fala: "Esse já é o primeiro exercício." };
        irPara(base - 1);
        return { ok: true, fala: "Voltando para: " + descreverItem(base - 1) };
      }
      case "adicionar": {
        const novo = acharExercicio(c.frase, todos, []);
        if (!novo) return { ok: false, fala: "Não achei esse exercício. Fale o nome como está na lista." };
        const ja = itens.findIndex((it) => it.exercicioId === novo.id);
        if (ja >= 0) { irPara(ja); return { ok: true, fala: nomeFalado(novo.nome) + " já está no treino. Pode ditar a série." }; }
        addExercicio(novo.id);
        setFocoEi(itens.length);
        const sug = sugerirCarga(historico, novo.id, 12);
        return { ok: true, fala: "Adicionei " + nomeFalado(novo.nome) + "." + (sug && sug.peso ? " Da última vez foram " + fmtNum(sug.anterior) + " quilos." : "") };
      }
      case "trocar": {
        if (!alvo) return { ok: false, fala: "Não há exercício para trocar." };
        const atual = itens[alvo.ei];
        const pedido = acharExercicio(c.frase, todos, []);
        if (pedido && pedido.id !== atual.exercicioId && !idsNoTreino.some((id) => id === pedido.id)) {
          substituirExercicio(alvo.ei, pedido.id);
          irPara(alvo.ei);
          return { ok: true, fala: "Troquei " + nomeDoItem(alvo.ei) + " por " + nomeFalado(pedido.nome) + "." };
        }
        const opcoes = alternativasPara(atual.exercicioId);
        if (!opcoes.length) return { ok: false, fala: "Não achei outro exercício desse grupo fora do treino." };
        setTrocando(alvo.ei);
        irPara(alvo.ei);
        const tres = opcoes.slice(0, 3).map((e) => nomeFalado(e.nome));
        return { ok: true, fala: "No lugar de " + nomeDoItem(alvo.ei) + ": " + tres.join(", ") + ". Diga: Jarvis, troca por " + tres[0] + "." };
      }
      case "recorde": {
        const ex = acharExercicio(c.frase, todos, idsNoTreino) || (alvo ? exPorId(itens[alvo.ei].exercicioId) : null);
        if (!ex) return { ok: false, fala: "Recorde de qual exercício?" };
        const r = recordes[ex.id];
        if (!r || (!r.peso && !r.segundos)) return { ok: true, fala: "Ainda não há recorde em " + nomeFalado(ex.nome) + ". O de hoje vai ser o primeiro." };
        if (ex.cardio) return { ok: true, fala: "Seu maior tempo em " + nomeFalado(ex.nome) + " é de " + Math.round(r.segundos / 60) + " minutos." };
        if (ex.tempo || (r.tempo && !r.peso)) return { ok: true, fala: "Seu recorde em " + nomeFalado(ex.nome) + " é " + r.segundos + " segundos." };
        return { ok: true, fala: "Seu recorde em " + nomeFalado(ex.nome) + " é " + fmtNum(r.peso) + " quilos" + (r.reps ? " por " + r.reps + " repetições" : "") + "." };
      }
      case "ultimaVez": {
        const ex = acharExercicio(c.frase, todos, idsNoTreino) || (alvo ? exPorId(itens[alvo.ei].exercicioId) : null);
        if (!ex) return { ok: false, fala: "De qual exercício?" };
        const u = ultimas[ex.id];
        if (!u || !u.length) return { ok: true, fala: "Não encontrei " + nomeFalado(ex.nome) + " no seu histórico. Hoje é a estreia." };
        const txt = u.slice(0, 4).map((s) => (ehCardio(s) ? falaCardio(s) : ehTempo(s) ? segundosDe(s) + " segundos" : fmtNum(s.peso) + " por " + repsDe(s))).join(", ");
        return { ok: true, fala: "Da última vez em " + nomeFalado(ex.nome) + ": " + txt + "." };
      }
      case "situacao": {

<!--
  As bibliotecas vêm com "integrity": se o servidor da CDN for adulterado, o navegador
  recusa o arquivo em vez de executá-lo. O "?v=3" no fim do endereço existe porque a
  versão anterior do app guardou esses mesmos arquivos em cache sem permissão de leitura
  (resposta opaca), e uma resposta opaca não pode ser conferida pelo integrity — o
  endereço novo simplesmente não encontra o cache velho e busca uma cópia verificável.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js?v=3"
  integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js?v=3"
  integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js?v=3"
  integrity="sha384-1qlE7MZPM2pHD/pBZCU/yB8UCP52RYL8bge/qNdfNBCWToySp8/M+JL2waXU4hjJ" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #000000; --bg2: #0A0A0A; --card: #121212;
    --borda: #262626; --borda2: #363636;
    --texto: #F2F0EB; --cinza: #A8A8A8; --cinza2: #949AA3;
    --perigo: #F58E8E; --perigo-borda: #F58E8E55;
    --aviso-bg: #2A1512; --ok: #4ADE80; --ok-bg: #173B1E;
    --obs: #C7A94B; --input: #000000;
    --mapa-bg: #0B0B0B; --mapa-txt: #E8E8E8;
    --marca: #E1306C;
  }
  [data-tema="claro"] {
    --bg: #FFFFFF; --bg2: #FFFFFF; --card: #FFFFFF;
    --borda: #DBDBDB; --borda2: #C4C4C4;
    --texto: #262626; --cinza: #6B6B6B; --cinza2: #6E6E6E;
    --perigo: #C62828; --perigo-borda: #C6282855;
    --aviso-bg: #FFF1EF; --ok: #1B7F3B; --ok-bg: #E8F7EC;
    --obs: #8A6D00; --input: #FAFAFA;
    --mapa-bg: #1A1A1A; --mapa-txt: #F0F0F0;
    --marca: #C21E58;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  * { -webkit-tap-highlight-color: transparent; }
  a { color: #8ECDF5; }
  [data-tema="claro"] a { color: #00376B; }
  select { appearance: none; -webkit-appearance: none; }

  /* Foco visível para quem navega pelo teclado */
  :focus-visible { outline: 3px solid #E1306C; outline-offset: 2px; border-radius: 6px; }

  /* Tela de carregamento enquanto o app é preparado (evita tela em branco) */
  #carregando {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: var(--bg); color: #A8A8A8;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #carregando .marca {
    font-size: 27px; font-weight: 900; letter-spacing: -0.5px;
    background-image: linear-gradient(45deg, #F58529, #DD2A7B, #8134AF);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #carregando .barra { width: 140px; height: 4px; border-radius: 2px; background: #262626; overflow: hidden; }
  #carregando .barra i { display: block; width: 40%; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5);
    animation: desliza 1.1s ease-in-out infinite; }
  @keyframes desliza { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  @media (prefers-reduced-motion: reduce) {
    #carregando .barra i { animation: none; width: 100%; }
    * { transition: none !important; }
  }

  /* Celebração de recorde e de conquista */
  @keyframes confete {
    0%   { transform: translate3d(0, -12vh, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate3d(var(--desvio, 0), 96vh, 0) rotate(var(--giro, 540deg)); opacity: 0; }
  }
  @keyframes surge {
    0%   { transform: scale(0.6); opacity: 0; }
    55%  { transform: scale(1.06); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes pulsa {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.14); }
  }
  /* Anel que sai do microfone enquanto o Jarvis ouve: sem um sinal vivo na
     tela não dá para saber se ele está escutando ou se morreu calado. */
  @keyframes ondaJarvis {
    0%   { transform: scale(1); opacity: .55; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  .jarvis-onda {
    position: absolute; inset: 0; border-radius: 50%; border: 2px solid #E1306C;
    animation: ondaJarvis 1.8s ease-out infinite; pointer-events: none;
  }
  .jarvis-onda.atraso { animation-delay: .9s; }
  @keyframes entraJarvis {
    0%   { transform: translateY(-14px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .jarvis-faixa { animation: entraJarvis 220ms ease-out both; }
  .confete-peca {
    position: fixed; top: 0; width: 9px; height: 15px; border-radius: 2px;
    animation: confete linear forwards; pointer-events: none; z-index: 60;
  }
  .celebra-cartao { animation: surge 380ms cubic-bezier(.2,.8,.3,1.2) both; }
  .celebra-icone { animation: pulsa 900ms ease-in-out 380ms 2 both; display: inline-block; }
  @media (prefers-reduced-motion: reduce) {
    .confete-peca { display: none; }
    .celebra-cartao, .celebra-icone, .jarvis-onda, .jarvis-faixa { animation: none; }
  }
</style>
</head>

<script>
/* Dados puros, fora do script que o Babel compila: são 100 KB que não têm JSX
   nenhum e não precisam passar por compilador. Com eles aqui dentro, o script
   compilado passava de 500 KB e o Babel desistia de otimizar — o que se paga em
   segundos de espera toda vez que o app abre no celular.
   Continuam editáveis à mão, no mesmo arquivo, como tudo neste projeto. */
// ---------------- BIBLIOTECA DE EXERCÍCIOS (conteúdo original) ----------------
const EXERCICIOS = [
  { id: "supino-reto", grupo: "peito", nome: "Supino reto com barra", en: "Bench Press", equip: "Barra e banco", musc: { p: ["peito"], s: ["triceps", "ombros"] }, passos: ["Deite no banco com os pés firmes no chão e a barra alinhada aos olhos.", "Desça a barra controlada até tocar levemente o meio do peito.", "Empurre a barra para cima até estender os cotovelos, sem travar."], dica: "Mantenha as escápulas retraídas durante todo o movimento." },
  { id: "supino-halteres", grupo: "peito", nome: "Supino reto com halteres", en: "Benchpress Dumbbells", equip: "Halteres e banco", musc: { p: ["peito"], s: ["triceps", "ombros"] }, passos: ["Deite no banco com um halter em cada mão na altura do peito.", "Empurre os halteres para cima até quase se tocarem.", "Desça controlado até a altura do peito."], dica: "Halteres exigem mais estabilidade e dão maior amplitude que a barra." },
  { id: "supino-inclinado", grupo: "peito", nome: "Supino inclinado com halteres", en: "Incline Bench Press - Dumbbell", equip: "Halteres e banco inclinado", musc: { p: ["peito"], s: ["ombros", "triceps"] }, passos: ["Ajuste o banco entre 30° e 45° e segure um halter em cada mão.", "Desça os halteres até a altura do peito, cotovelos a ~45° do tronco.", "Suba unindo levemente os halteres no topo."], dica: "Não bata os halteres no topo; mantenha tensão no peitoral." },
  { id: "supino-declinado", grupo: "peito", nome: "Supino declinado", en: "Decline Bench Press Barbell", equip: "Barra e banco declinado", musc: { p: ["peito"], s: ["triceps"] }, passos: ["Deite no banco declinado com os pés presos no apoio.", "Desça a barra até a parte inferior do peito.", "Empurre de volta ao topo controlando a trajetória."], dica: "Enfatiza a porção inferior do peitoral; use amplitude confortável." },
  { id: "supino-maquina", grupo: "peito", nome: "Supino na máquina", en: "Chest Press", equip: "Máquina", musc: { p: ["peito"], s: ["triceps", "ombros"] }, passos: ["Ajuste o banco para as manoplas ficarem na altura do meio do peito.", "Empurre à frente até quase estender os cotovelos.", "Retorne devagar sem deixar o peso bater."], dica: "Boa opção para iniciantes aprenderem o padrão de empurrar com segurança." },
  { id: "crucifixo", grupo: "peito", nome: "Crucifixo no banco", en: "Fly With Dumbbells", equip: "Halteres e banco", musc: { p: ["peito"], s: ["ombros"] }, passos: ["Deite com os halteres estendidos acima do peito, cotovelos levemente flexionados.", "Abra os braços em arco até sentir alongar o peitoral.", "Retorne pelo mesmo arco apertando o peito."], dica: "Imagine abraçar uma árvore: o cotovelo não muda de ângulo." },
  { id: "crucifixo-inclinado", grupo: "peito", nome: "Crucifixo inclinado (fly com giro)", en: "incline dumbbell fly", equip: "Halteres e banco inclinado", musc: { p: ["peito"], s: ["ombros"] }, passos: ["No banco inclinado, abra os braços em arco com halteres.", "Suba fechando o arco; se quiser, gire as palmas no topo.", "Desça alongando o peitoral superior."], dica: "O giro no topo aumenta a contração da porção superior do peito." },
  { id: "peck-deck", grupo: "peito", nome: "Voador (peck deck)", en: "Butterfly", equip: "Máquina", musc: { p: ["peito"], s: ["ombros"] }, passos: ["Sente com as costas apoiadas e antebraços ou mãos nos apoios.", "Feche os braços à frente apertando o peitoral.", "Abra devagar até sentir leve alongamento."], dica: "Segure 1 segundo na contração máxima antes de abrir." },
  { id: "crossover", grupo: "peito", nome: "Crossover na polia", en: "Cable Cross-over", equip: "Polia dupla", musc: { p: ["peito"], s: ["ombros"] }, passos: ["Segure as manoplas com as polias na posição alta.", "Puxe os cabos para frente e para baixo cruzando levemente as mãos.", "Retorne devagar controlando a abertura."], dica: "Incline o tronco levemente à frente e mantenha-o fixo." },
  { id: "flexao", grupo: "peito", nome: "Flexão de braços", en: "Push-Up", equip: "Peso corporal", musc: { p: ["peito"], s: ["triceps", "ombros", "abdomen"] }, passos: ["Apoie mãos no chão na largura dos ombros, corpo em linha reta.", "Desça o peito até quase tocar o chão.", "Empurre o chão até estender os braços."], dica: "Contraia o abdômen para não deixar o quadril cair." },
  { id: "paralelas-peito", grupo: "peito", nome: "Mergulho nas paralelas", en: "Dips", equip: "Barras paralelas", musc: { p: ["peito", "triceps"], s: ["ombros"] }, passos: ["Suspenda o corpo nas barras com os braços estendidos.", "Incline o tronco à frente e desça flexionando os cotovelos.", "Suba até estender os braços."], dica: "Tronco inclinado foca o peito; tronco reto foca o tríceps." },

  { id: "puxada-frente", grupo: "costas", nome: "Puxada alta frontal", en: "lat pulldown", equip: "Polia alta", musc: { p: ["dorsal"], s: ["biceps", "trapezio"] }, passos: ["Segure a barra com pegada aberta e sente com as coxas travadas.", "Puxe a barra até a parte superior do peito, levando os cotovelos para baixo.", "Retorne controlando até estender os braços."], dica: "Pense em puxar com os cotovelos, não com as mãos." },
  { id: "puxada-triangulo", grupo: "costas", nome: "Puxada alta com triângulo", en: "Close-grip Lat Pull Down", equip: "Polia alta", musc: { p: ["dorsal"], s: ["biceps"] }, passos: ["Segure o triângulo com pegada neutra e fechada.", "Puxe até a altura do peito mantendo o tronco levemente inclinado.", "Suba alongando bem o dorsal."], dica: "A pegada fechada permite maior amplitude na parte final." },
  { id: "barra-fixa", grupo: "costas", nome: "Barra fixa", en: "Pull-ups", equip: "Barra fixa", musc: { p: ["dorsal"], s: ["biceps", "antebraco"] }, passos: ["Segure a barra com pegada aberta, braços estendidos.", "Puxe o corpo até o queixo passar a barra.", "Desça controlado até estender quase por completo."], dica: "Se estiver difícil, use elástico de assistência ou graviton." },
  { id: "remada-curvada", grupo: "costas", nome: "Remada curvada com barra", en: "Bent Over Rowing", equip: "Barra", musc: { p: ["dorsal", "trapezio"], s: ["biceps", "lombar"] }, passos: ["Incline o tronco a ~45° com a coluna neutra e joelhos semiflexionados.", "Puxe a barra em direção ao abdômen.", "Desça controlado até estender os braços."], dica: "Não deixe a lombar arredondar; trave o core." },
  { id: "remada-baixa", grupo: "costas", nome: "Remada baixa com triângulo", en: "Seated Cable Row", equip: "Polia baixa", musc: { p: ["dorsal"], s: ["biceps", "trapezio"] }, passos: ["Sente com os joelhos semiflexionados e segure o triângulo.", "Puxe até o abdômen mantendo o tronco ereto.", "Volte alongando bem as costas."], dica: "Evite balançar o tronco para gerar impulso." },
  { id: "remada-unilateral", grupo: "costas", nome: "Remada unilateral (serrote)", en: "One Arm Bent Row", equip: "Halter e banco", musc: { p: ["dorsal"], s: ["biceps", "trapezio"] }, passos: ["Apoie joelho e mão do mesmo lado no banco, costas paralelas ao chão.", "Puxe o halter em direção ao quadril.", "Desça alongando sem girar o tronco."], dica: "Puxe em direção ao bolso, não ao ombro." },
  { id: "remada-cavalinho", grupo: "costas", nome: "Remada cavalinho", en: "Rowing, T-bar", equip: "Barra T ou landmine", musc: { p: ["dorsal", "trapezio"], s: ["biceps", "lombar"] }, passos: ["Posicione-se sobre a barra com o tronco inclinado e coluna neutra.", "Puxe a barra em direção ao abdômen.", "Desça controlado até estender."], dica: "Ótima para carga alta com menos estresse na lombar que a curvada." },
  { id: "levantamento-terra", grupo: "costas", nome: "Levantamento terra", en: "Deadlifts", equip: "Barra", musc: { p: ["lombar", "gluteos", "posteriores"], s: ["dorsal", "trapezio", "antebraco", "quadriceps"] }, passos: ["Pés na largura do quadril, barra sobre o meio dos pés.", "Segure a barra, peito alto, e suba estendendo quadril e joelhos juntos.", "Desça empurrando o quadril para trás com a coluna neutra."], dica: "A barra sobe colada às pernas do início ao fim." },
  { id: "pulldown", grupo: "costas", nome: "Puxada com braços retos (pulldown)", en: "Straight-Arm Pulldown (Cable)", equip: "Polia alta", musc: { p: ["dorsal"], s: ["triceps"] }, passos: ["Em pé, segure a barra com os braços quase estendidos.", "Puxe a barra até as coxas em um arco, sem dobrar os cotovelos.", "Retorne devagar até a altura dos ombros."], dica: "Ótimo para sentir o latíssimo trabalhando isolado." },
  { id: "hiperextensao", grupo: "costas", nome: "Hiperextensão lombar", en: "Hyperextensions", equip: "Banco romano", musc: { p: ["lombar"], s: ["gluteos", "posteriores"] }, passos: ["Apoie o quadril no banco com os pés presos.", "Desça o tronco flexionando o quadril.", "Suba até alinhar o tronco com as pernas, sem passar."], dica: "Movimento controlado; não hiperestenda no topo." },
  { id: "puxada-supinada", grupo: "costas", nome: "Puxada alta com pegada supinada", en: "reverse grip lat pulldown", equip: "Polia alta", musc: { p: ["dorsal"], s: ["biceps"] }, passos: ["Segure a barra com as palmas viradas para você, na largura dos ombros.", "Puxe a barra até a parte superior do peito.", "Suba controlado alongando o dorsal."], dica: "A pegada supinada envolve mais o bíceps e a parte baixa do dorsal." },
  { id: "puxada-amplitude", grupo: "costas", nome: "Puxada alta com amplitude total", en: "lat pulldown", equip: "Polia alta", musc: { p: ["dorsal"], s: ["biceps", "trapezio"] }, passos: ["Segure a barra e deixe o corpo alongar totalmente no topo.", "Puxe até o peito levando os cotovelos para baixo.", "Suba devagar até o alongamento completo, deixando as escápulas subirem."], dica: "O alongamento total no topo é o diferencial: não encurte o movimento." },
  { id: "remada-deltoide", grupo: "costas", nome: "Remada com barra para deltoide posterior", en: "rear delt row", equip: "Barra", musc: { p: ["ombros"], s: ["dorsal", "trapezio", "biceps"] }, passos: ["Incline o tronco com a barra pendurada e pegada bem aberta.", "Puxe a barra em direção ao peito com os cotovelos abertos.", "Desça controlado."], dica: "Cotovelos altos e abertos jogam o trabalho para o deltoide posterior." },
  { id: "remada-invertida", grupo: "costas", nome: "Remada curvada com pegada invertida", en: "Bent Over Rowing Reverse", equip: "Barra", musc: { p: ["dorsal"], s: ["biceps", "trapezio", "lombar"] }, passos: ["Incline o tronco com a coluna neutra e pegada supinada.", "Puxe a barra em direção ao abdômen.", "Desça controlado até estender."], dica: "A pegada invertida enfatiza a parte baixa do dorsal e o bíceps." },

  { id: "agachamento", grupo: "pernas", nome: "Agachamento livre", en: "Barbell Full Squat", equip: "Barra", musc: { p: ["quadriceps", "gluteos"], s: ["posteriores", "lombar", "abdomen"] }, passos: ["Apoie a barra no trapézio e pés na largura dos ombros.", "Desça empurrando o quadril para trás até as coxas ficarem paralelas ao chão.", "Suba empurrando o chão com o pé inteiro."], dica: "Joelhos apontam na direção dos pés durante todo o movimento." },
  { id: "agachamento-smith", grupo: "pernas", nome: "Agachamento no Smith", en: "Smith machine squat", equip: "Aparelho Smith", musc: { p: ["quadriceps", "gluteos"], s: ["posteriores"] }, passos: ["Posicione a barra do Smith no trapézio e destrave.", "Desça controlado até as coxas ficarem paralelas ao chão.", "Suba empurrando o chão, sem travar os joelhos."], dica: "Pés levemente à frente da barra deixam o movimento mais confortável." },
  { id: "agachamento-hack", grupo: "pernas", nome: "Agachamento no hack", en: "Pendular hack", equip: "Máquina hack", musc: { p: ["quadriceps"], s: ["gluteos"] }, passos: ["Posicione os ombros nos apoios e pés na plataforma.", "Desça até ~90° de joelho ou um pouco abaixo.", "Suba sem travar os joelhos."], dica: "Pés mais à frente na plataforma aliviam os joelhos." },
  { id: "agachamento-goblet", grupo: "pernas", nome: "Agachamento goblet", en: "Dumbbell Goblet Squat", equip: "Halter ou kettlebell", musc: { p: ["quadriceps", "gluteos"], s: ["abdomen"] }, passos: ["Segure o peso junto ao peito com as duas mãos.", "Agache mantendo o tronco ereto e cotovelos entre os joelhos.", "Suba empurrando o chão."], dica: "Excelente para aprender a técnica do agachamento." },
  { id: "agachamento-bulgaro", grupo: "pernas", nome: "Agachamento búlgaro", en: "Bulgarian Squat with Dumbbells", equip: "Halteres e banco", musc: { p: ["quadriceps", "gluteos"], s: ["posteriores"] }, passos: ["Apoie o peito do pé de trás no banco.", "Desça flexionando a perna da frente até ~90°.", "Suba empurrando com o pé da frente inteiro."], dica: "Passo mais longo foca glúteo; mais curto foca quadríceps." },
  { id: "leg-press", grupo: "pernas", nome: "Leg press 45°", en: "Leg Press", equip: "Máquina", musc: { p: ["quadriceps"], s: ["gluteos", "posteriores"] }, passos: ["Posicione os pés na plataforma na largura dos ombros.", "Desça controlado até ~90° de joelho.", "Empurre a plataforma sem travar os joelhos no final."], dica: "Não tire a lombar do encosto ao descer." },
  { id: "cadeira-extensora", grupo: "pernas", nome: "Cadeira extensora", en: "Leg Extension", equip: "Máquina", musc: { p: ["quadriceps"], s: [] }, passos: ["Ajuste o rolo na frente dos tornozelos.", "Estenda os joelhos até quase completar.", "Desça controlando a volta."], dica: "Segure 1 segundo no topo para maior ativação do quadríceps." },
  { id: "mesa-flexora", grupo: "pernas", nome: "Mesa/cadeira flexora", en: "Leg Curls (sitting)", equip: "Máquina", musc: { p: ["posteriores"], s: ["panturrilha"] }, passos: ["Posicione o rolo atrás dos tornozelos.", "Flexione os joelhos trazendo o rolo em direção aos glúteos.", "Retorne devagar sem soltar o peso."], dica: "Mantenha o quadril firme no banco durante todo o movimento." },
  { id: "stiff", grupo: "pernas", nome: "Stiff", en: "stiff leg deadlift", equip: "Barra ou halteres", musc: { p: ["posteriores", "gluteos"], s: ["lombar"] }, passos: ["Em pé, segure o peso à frente das coxas.", "Desça empurrando o quadril para trás com joelhos quase estendidos.", "Suba contraindo posteriores e glúteos."], dica: "Desça só até onde a coluna se mantém neutra." },
  { id: "afundo", grupo: "pernas", nome: "Afundo com halteres", en: "Lunges", equip: "Halteres", musc: { p: ["quadriceps", "gluteos"], s: ["posteriores"] }, passos: ["Dê um passo à frente segurando um halter em cada mão.", "Desça até o joelho de trás quase tocar o chão.", "Empurre com a perna da frente para voltar."], dica: "Tronco ereto; o joelho da frente não precisa passar muito do pé." },
  { id: "cadeira-adutora", grupo: "pernas", nome: "Cadeira adutora", en: "Seated Hip Adduction", equip: "Máquina", musc: { p: ["adutores"], s: [] }, passos: ["Sente com as pernas abertas nos suportes.", "Feche as pernas contra a resistência.", "Abra devagar controlando o retorno."], dica: "Trabalha a parte interna da coxa; evite cargas exageradas no início." },
  { id: "panturrilha", grupo: "pernas", nome: "Panturrilha em pé", en: "Standing Calf Raises", equip: "Máquina ou degrau", musc: { p: ["panturrilha"], s: [] }, passos: ["Apoie a ponta dos pés na plataforma.", "Suba o máximo que conseguir na ponta dos pés.", "Desça alongando bem abaixo da linha do degrau."], dica: "Faça pausa de 1s em cima e embaixo; evite quicar." },
  { id: "panturrilha-sentado", grupo: "pernas", nome: "Panturrilha sentado", en: "seated calf raise", equip: "Máquina", musc: { p: ["panturrilha"], s: [] }, passos: ["Sente com o apoio sobre as coxas e pontas dos pés na plataforma.", "Eleve os calcanhares o máximo possível.", "Desça alongando devagar."], dica: "Com o joelho dobrado o foco vai para o sóleo." },
  { id: "panturrilha-leg-press", grupo: "pernas", nome: "Panturrilha no leg press", en: "Calf Press Using Leg Press Machine", equip: "Leg press", musc: { p: ["panturrilha"], s: [] }, passos: ["No leg press, apoie só as pontas dos pés na base da plataforma.", "Empurre com as pontas dos pés estendendo os tornozelos.", "Volte alongando a panturrilha sem soltar o peso."], dica: "Joelhos quase estendidos e movimento só de tornozelo." },

  { id: "desenvolvimento", grupo: "ombros", nome: "Desenvolvimento com halteres", en: "Shoulder Press, Dumbbells", equip: "Halteres", musc: { p: ["ombros"], s: ["triceps", "trapezio"] }, passos: ["Sente com os halteres na altura das orelhas, palmas à frente.", "Empurre para cima até quase estender os cotovelos.", "Desça controlado até a altura inicial."], dica: "Não arqueie a lombar; mantenha o core firme." },
  { id: "desenvolvimento-arnold", grupo: "ombros", nome: "Desenvolvimento Arnold", en: "arnold press", equip: "Halteres", musc: { p: ["ombros"], s: ["triceps"] }, passos: ["Comece com os halteres à frente do rosto, palmas viradas para você.", "Empurre para cima girando as palmas para frente durante a subida.", "Desça desfazendo o giro."], dica: "O giro trabalha as três porções do deltoide no mesmo movimento." },
  { id: "desenvolvimento-militar", grupo: "ombros", nome: "Desenvolvimento militar", en: "Overhead Barbell Press", equip: "Barra", musc: { p: ["ombros"], s: ["triceps", "abdomen"] }, passos: ["Em pé, segure a barra na altura das clavículas.", "Empurre para cima passando a cabeça levemente à frente no topo.", "Desça controlado até a posição inicial."], dica: "Glúteos e abdômen contraídos evitam compensar com a lombar." },
  { id: "desenvolvimento-maquina", grupo: "ombros", nome: "Desenvolvimento na máquina", en: "Shoulder Press, on Machine", equip: "Máquina", musc: { p: ["ombros"], s: ["triceps"] }, passos: ["Ajuste o banco para as manoplas ficarem na altura dos ombros.", "Empurre para cima sem travar os cotovelos.", "Retorne devagar."], dica: "Trajetória guiada: boa para focar carga com segurança." },
  { id: "elevacao-lateral", grupo: "ombros", nome: "Elevação lateral", en: "Lateral Raises", equip: "Halteres", musc: { p: ["ombros"], s: ["trapezio"] }, passos: ["Em pé, halteres ao lado do corpo, cotovelos levemente flexionados.", "Eleve os braços até a linha dos ombros.", "Desça devagar resistindo ao peso."], dica: "Suba como se derramasse uma jarra: mindinho levemente para cima." },
  { id: "elevacao-frontal", grupo: "ombros", nome: "Elevação frontal", en: "Front Raises", equip: "Halteres ou anilha", musc: { p: ["ombros"], s: ["peito"] }, passos: ["Segure o peso à frente das coxas.", "Eleve à frente até a altura dos ombros.", "Retorne controlando."], dica: "Evite balançar o corpo; menos carga e mais controle." },
  { id: "crucifixo-inverso", grupo: "ombros", nome: "Crucifixo inverso", en: "Rear Delt Raises", equip: "Halteres ou máquina", musc: { p: ["ombros"], s: ["trapezio", "dorsal"] }, passos: ["Incline o tronco à frente com halteres pendurados.", "Abra os braços para os lados apertando as escápulas.", "Volte devagar."], dica: "Foca o deltóide posterior; use carga leve e amplitude completa." },
  { id: "crucifixo-polia", grupo: "ombros", nome: "Crucifixo invertido na polia (amplitude total)", en: "cable reverse fly", equip: "Polia dupla", musc: { p: ["ombros"], s: ["trapezio", "dorsal"] }, passos: ["Em pé, cruze os cabos segurando a manopla oposta em cada mão.", "Abra os braços para trás na linha dos ombros.", "Volte controlado cruzando os cabos à frente."], dica: "A polia mantém tensão na amplitude toda; capriche na abertura final." },
  { id: "remada-alta", grupo: "ombros", nome: "Remada alta (erguida)", en: "Upright Row, on Multi Press", equip: "Barra, halteres ou cabo", musc: { p: ["ombros", "trapezio"], s: ["biceps"] }, passos: ["Segure o peso à frente das coxas com pegada na largura dos ombros.", "Puxe em direção ao queixo levando os cotovelos para cima.", "Desça controlado."], dica: "Suba só até a linha do peito se sentir desconforto no ombro." },
  { id: "face-pull", grupo: "ombros", nome: "Face pull", en: "face pull", equip: "Polia com corda", musc: { p: ["ombros"], s: ["trapezio"] }, passos: ["Ajuste a polia na altura do rosto e segure a corda.", "Puxe em direção ao rosto abrindo os cotovelos para os lados.", "Retorne devagar."], dica: "Excelente para deltóide posterior e saúde dos ombros." },
  { id: "encolhimento", grupo: "ombros", nome: "Encolhimento de ombros", en: "Shoulder Shrug", equip: "Halteres ou barra", musc: { p: ["trapezio"], s: ["antebraco"] }, passos: ["Segure o peso ao lado do corpo, braços estendidos.", "Eleve os ombros em direção às orelhas.", "Desça alongando o trapézio."], dica: "Não gire os ombros; o movimento é só para cima e para baixo." },

  { id: "rosca-direta", grupo: "biceps", nome: "Rosca direta (barra W)", en: "Biceps Curls With Barbell", equip: "Barra ou barra W", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Em pé, segure a barra com pegada supinada na largura dos ombros.", "Flexione os cotovelos levando a barra até os ombros.", "Desça controlado até estender."], dica: "Cotovelos colados ao tronco; não balance o corpo." },
  { id: "rosca-alternada", grupo: "biceps", nome: "Rosca alternada", en: "Alternating bicep curls", equip: "Halteres", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Segure um halter em cada mão ao lado do corpo.", "Suba um braço girando a palma para cima durante a subida.", "Desça e repita com o outro braço."], dica: "No banco inclinado o bíceps trabalha ainda mais alongado." },
  { id: "rosca-martelo", grupo: "biceps", nome: "Rosca martelo", en: "Hammer Curls", equip: "Halteres", musc: { p: ["biceps", "antebraco"], s: [] }, passos: ["Segure os halteres com as palmas viradas uma para a outra.", "Flexione os cotovelos mantendo a pegada neutra.", "Desça devagar."], dica: "Trabalha também o antebraço e o braquial." },
  { id: "rosca-scott", grupo: "biceps", nome: "Rosca no banco Scott", en: "Preacher Curls", equip: "Banco Scott e barra W", musc: { p: ["biceps"], s: [] }, passos: ["Apoie os braços no banco com as axilas encaixadas no topo.", "Flexione até a contração máxima.", "Desça controlado sem estender totalmente."], dica: "Não solte o peso na descida; é onde mora o estímulo." },
  { id: "rosca-concentrada", grupo: "biceps", nome: "Rosca concentrada", en: "concentration curl", equip: "Halter e banco", musc: { p: ["biceps"], s: [] }, passos: ["Sentado, apoie o cotovelo na parte interna da coxa.", "Flexione o braço até a contração máxima.", "Desça devagar até quase estender."], dica: "Isolamento total: zero impulso do corpo." },
  { id: "rosca-polia", grupo: "biceps", nome: "Rosca na polia baixa", en: "Biceps Curl With Cable", equip: "Polia baixa", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Segure a barra da polia com pegada supinada.", "Flexione os cotovelos até a contração.", "Desça resistindo à tração do cabo."], dica: "A polia mantém tensão constante em toda a amplitude." },
  { id: "rosca-inversa", grupo: "biceps", nome: "Rosca inversa", en: "Reverse Grip Barbell Curls", equip: "Barra ou barra W", musc: { p: ["antebraco"], s: ["biceps"] }, passos: ["Segure a barra com as palmas viradas para baixo.", "Flexione os cotovelos até a altura do peito.", "Desça controlado."], dica: "Foca antebraços e braquial; use menos carga que na rosca direta." },
  { id: "rosca-spider", grupo: "biceps", nome: "Rosca inclinada deitada (spider)", en: "spider curl", equip: "Banco inclinado e barra", musc: { p: ["biceps"], s: [] }, passos: ["Deite de bruços no banco inclinado com os braços pendurados.", "Flexione os cotovelos até a contração máxima.", "Desça devagar até quase estender."], dica: "O tronco apoiado elimina qualquer impulso: isolamento puro." },
  { id: "rosca-polia-alta", grupo: "biceps", nome: "Rosca na polia alta (sobre a cabeça)", en: "overhead cable curl", equip: "Polia dupla alta", musc: { p: ["biceps"], s: [] }, passos: ["Segure as manoplas com os braços abertos na altura dos ombros.", "Flexione os cotovelos trazendo as mãos em direção à cabeça.", "Estenda controlado sem baixar os cotovelos."], dica: "Ótimo para o pico do bíceps; mantenha os cotovelos altos e fixos." },

  { id: "triceps-polia", grupo: "triceps", nome: "Tríceps na polia (puxada alta)", en: "Triceps Pushdown", equip: "Polia alta com barra", musc: { p: ["triceps"], s: [] }, passos: ["Segure a barra com os cotovelos colados ao tronco.", "Estenda os braços empurrando a barra para baixo.", "Volte até ~90° sem mover os cotovelos."], dica: "Os cotovelos são a dobradiça: só o antebraço se move." },
  { id: "triceps-corda", grupo: "triceps", nome: "Tríceps corda", en: "Tricep Rope Pushdowns", equip: "Polia com corda", musc: { p: ["triceps"], s: [] }, passos: ["Segure a corda com pegada neutra.", "Estenda os braços abrindo a corda no final.", "Retorne controlado."], dica: "A abertura no final aumenta a contração da cabeça lateral." },
  { id: "triceps-testa", grupo: "triceps", nome: "Tríceps testa", en: "Skullcrusher SZ-bar", equip: "Barra W e banco", musc: { p: ["triceps"], s: [] }, passos: ["Deitado, segure a barra acima do peito.", "Flexione os cotovelos descendo a barra em direção à testa.", "Estenda de volta ao topo."], dica: "Cotovelos apontando para o teto o tempo inteiro." },
  { id: "triceps-frances", grupo: "triceps", nome: "Tríceps francês (sentado)", en: "Overhead Triceps Extension", equip: "Halter", musc: { p: ["triceps"], s: [] }, passos: ["Segure um halter com as duas mãos acima da cabeça.", "Desça o peso atrás da cabeça flexionando os cotovelos.", "Estenda de volta ao topo."], dica: "Cotovelos apontando para frente, próximos da cabeça." },
  { id: "triceps-coice", grupo: "triceps", nome: "Tríceps coice (kickback)", en: "triceps kickback", equip: "Halter", musc: { p: ["triceps"], s: [] }, passos: ["Incline o tronco com o cotovelo elevado e colado ao corpo.", "Estenda o antebraço para trás até a extensão total.", "Retorne sem baixar o cotovelo."], dica: "Contração máxima acontece no final; segure 1 segundo." },
  { id: "supino-fechado", grupo: "triceps", nome: "Supino com pegada fechada", en: "Bench Press Narrow Grip", equip: "Barra e banco", musc: { p: ["triceps"], s: ["peito", "ombros"] }, passos: ["Deite no banco com pegada um pouco mais estreita que os ombros.", "Desça a barra até a parte baixa do peito com cotovelos junto ao corpo.", "Empurre de volta focando o tríceps."], dica: "Composto pesado para tríceps; não feche demais a pegada." },
  { id: "mergulho-banco", grupo: "triceps", nome: "Mergulho no banco", en: "Dips Between Two Benches", equip: "Banco", musc: { p: ["triceps"], s: ["peito", "ombros"] }, passos: ["Apoie as mãos na borda do banco atrás do corpo.", "Desça flexionando os cotovelos até ~90°.", "Empurre de volta até estender."], dica: "Quanto mais longe os pés, mais difícil fica." },
  { id: "triceps-invertido", grupo: "triceps", nome: "Tríceps na polia com pegada invertida", en: "reverse grip pushdown", equip: "Polia alta", musc: { p: ["triceps"], s: ["antebraco"] }, passos: ["Segure a barra com as palmas viradas para cima.", "Estenda os braços empurrando para baixo.", "Volte controlado sem mover os cotovelos."], dica: "A pegada invertida enfatiza a cabeça medial do tríceps." },

  { id: "abdominal-supra", grupo: "abdomen", nome: "Abdominal supra", en: "Crunches", equip: "Peso corporal", musc: { p: ["abdomen"], s: [] }, passos: ["Deite com os joelhos flexionados e mãos atrás da cabeça.", "Eleve o tronco tirando as escápulas do chão.", "Desça controlado."], dica: "Não puxe o pescoço; olhe para o teto." },
  { id: "abdominal-infra", grupo: "abdomen", nome: "Abdominal infra na paralela", en: "Knee Raises", equip: "Paralelas ou barra fixa", musc: { p: ["abdomen"], s: ["obliquos", "antebraco"] }, passos: ["Suspenda o corpo com os antebraços ou mãos apoiados.", "Eleve os joelhos em direção ao peito.", "Desça devagar sem balançar."], dica: "Para dificultar, suba com as pernas estendidas." },
  { id: "abdominal-obliquo", grupo: "abdomen", nome: "Abdominal oblíquo (bicicleta)", en: "bicycle crunch", equip: "Peso corporal", musc: { p: ["obliquos"], s: ["abdomen"] }, passos: ["Deite e leve o cotovelo em direção ao joelho oposto.", "Alterne os lados em movimento de pedalada.", "Mantenha o ritmo controlado."], dica: "Gire o tronco, não apenas o cotovelo." },
  { id: "prancha", grupo: "abdomen", nome: "Prancha isométrica", en: "Plank", tempo: true, equip: "Peso corporal", musc: { p: ["abdomen"], s: ["obliquos", "lombar", "ombros"] }, passos: ["Apoie antebraços e pontas dos pés no chão.", "Mantenha o corpo em linha reta contraindo abdômen e glúteos.", "Segure pelo tempo definido."], dica: "Se o quadril cair ou subir, encerre a série: qualidade > tempo." },
  { id: "prancha-lateral", grupo: "abdomen", nome: "Prancha lateral", en: "Side Plank (Core L1)", tempo: true, equip: "Peso corporal", musc: { p: ["obliquos"], s: ["abdomen", "ombros"] }, passos: ["Apoie um antebraço no chão com o corpo de lado.", "Eleve o quadril até o corpo formar uma linha reta.", "Segure pelo tempo definido e troque o lado."], dica: "Foca os oblíquos; não deixe o quadril ceder." },
  { id: "elevacao-pernas", grupo: "abdomen", nome: "Elevação de pernas", en: "Leg Raises, Lying", equip: "Peso corporal", musc: { p: ["abdomen"], s: ["quadriceps"] }, passos: ["Deite com as mãos ao lado do corpo.", "Eleve as pernas estendidas até 90°.", "Desça devagar sem tocar o chão."], dica: "Pressione a lombar contra o chão o tempo todo." },
  { id: "abdominal-polia", grupo: "abdomen", nome: "Abdominal na polia", en: "cable crunch", equip: "Polia alta com corda", musc: { p: ["abdomen"], s: ["obliquos"] }, passos: ["Ajoelhe de frente para a polia segurando a corda junto à cabeça.", "Flexione o tronco levando os cotovelos em direção aos joelhos.", "Suba controlando a volta."], dica: "O movimento vem do abdômen enrolando, não do quadril." },

  { id: "elevacao-pelvica", grupo: "gluteos", nome: "Elevação pélvica", en: "hip thrust", equip: "Barra e banco", musc: { p: ["gluteos"], s: ["posteriores", "lombar"] }, passos: ["Apoie as costas no banco com a barra sobre o quadril.", "Eleve o quadril até o tronco ficar paralelo ao chão.", "Contraia o glúteo no topo e desça controlado."], dica: "Queixo levemente para baixo; não hiperestenda a lombar." },
  { id: "agachamento-sumo", grupo: "gluteos", nome: "Agachamento sumô", en: "sumo squat", equip: "Halter ou kettlebell", musc: { p: ["gluteos", "adutores"], s: ["quadriceps"] }, passos: ["Pés bem afastados com pontas para fora, peso entre as pernas.", "Desça o quadril mantendo o tronco ereto.", "Suba apertando os glúteos."], dica: "Empurre os joelhos para fora durante toda a descida." },
  { id: "terra-romeno", grupo: "gluteos", nome: "Peso morto romeno", en: "Romanian Deadlift", equip: "Barra ou halteres", musc: { p: ["gluteos", "posteriores"], s: ["lombar"] }, passos: ["Em pé, segure o peso à frente das coxas.", "Empurre o quadril para trás descendo o peso pelas pernas.", "Suba contraindo glúteos e posteriores."], dica: "Joelhos semiflexionados e fixos; o movimento é do quadril." },
  { id: "bom-dia", grupo: "gluteos", nome: "Bom dia", en: "Good Morning", equip: "Barra", musc: { p: ["gluteos", "posteriores"], s: ["lombar"] }, passos: ["Apoie a barra no trapézio como no agachamento.", "Incline o tronco à frente empurrando o quadril para trás.", "Suba contraindo glúteos e lombar."], dica: "Comece com carga bem leve para dominar a técnica." },
  { id: "coice-polia", grupo: "gluteos", nome: "Coice na polia (kickback)", en: "glute kickback", equip: "Polia baixa com caneleira", musc: { p: ["gluteos"], s: ["posteriores"] }, passos: ["Prenda a caneleira no tornozelo e apoie as mãos na máquina.", "Estenda a perna para trás contraindo o glúteo.", "Volte controlado sem apoiar o pé."], dica: "Movimento curto e forte; não balance a lombar." },
  { id: "abducao", grupo: "gluteos", nome: "Cadeira abdutora", en: "Machine Hip Abduction", equip: "Máquina", musc: { p: ["gluteos"], s: [] }, passos: ["Sente com as pernas apoiadas nos suportes.", "Abra as pernas contra a resistência.", "Feche devagar sem bater o peso."], dica: "Inclinar o tronco à frente aumenta a ativação do glúteo médio." },

  // ---- BIBLIOTECA AMPLIADA: clássicos da musculação ----
  { id: "supino-inclinado-barra", grupo: "peito", nome: "Supino inclinado com barra", en: "Incline Bench Press - Barbell", equip: "Barra e banco inclinado", musc: { p: ["peito"], s: ["ombros", "triceps"] }, passos: ["Deite no banco inclinado (30-45°) com a barra alinhada à parte alta do peito.", "Desça controlado até tocar levemente o peitoral superior.", "Empurre de volta sem travar os cotovelos."], dica: "Clássico para a porção superior do peito; pegada um pouco mais aberta que os ombros." },
  { id: "crossover-baixo", grupo: "peito", nome: "Crossover baixo (polia baixa)", en: "Low-Cable Cross-Over - NB", equip: "Polia dupla baixa", musc: { p: ["peito"], s: ["ombros"] }, passos: ["Segure as manoplas com as polias na posição baixa.", "Eleve os cabos à frente em arco até a altura do peito.", "Retorne controlado."], dica: "O arco de baixo para cima enfatiza a porção superior do peitoral." },
  { id: "flexao-declinada", grupo: "peito", nome: "Flexão com pés elevados", en: "Push-Ups | Decline", equip: "Peso corporal e banco", musc: { p: ["peito"], s: ["ombros", "triceps", "abdomen"] }, passos: ["Apoie os pés no banco e as mãos no chão.", "Desça o peito em direção ao chão com o corpo reto.", "Empurre até estender os braços."], dica: "Pés elevados aumentam a dificuldade e o foco na parte superior do peito." },
  { id: "pullover-halter", grupo: "peito", nome: "Pullover com halter", en: "Cross-Bench Dumbbell Pullovers", equip: "Halter e banco", musc: { p: ["peito"], s: ["dorsal", "triceps"] }, passos: ["Deite no banco segurando um halter acima do peito com as duas mãos.", "Desça o peso em arco por trás da cabeça, alongando o tronco.", "Retorne pelo mesmo arco até acima do peito."], dica: "Movimento clássico que trabalha peito e dorsal ao mesmo tempo." },

  { id: "remada-maquina", grupo: "costas", nome: "Remada na máquina", en: "Seated Row (Machine)", equip: "Máquina", musc: { p: ["dorsal"], s: ["biceps", "trapezio"] }, passos: ["Ajuste o banco com o peito apoiado no suporte.", "Puxe as manoplas levando os cotovelos para trás.", "Retorne controlado alongando as costas."], dica: "O apoio de peito elimina o impulso: ótima para aprender a puxar." },
  { id: "remada-australiana", grupo: "costas", nome: "Remada australiana (invertida)", en: "Inverted Rows", equip: "Barra baixa ou Smith", musc: { p: ["dorsal"], s: ["biceps", "trapezio", "abdomen"] }, passos: ["Deite sob a barra e segure-a com o corpo reto e calcanhares no chão.", "Puxe o peito até a barra.", "Desça controlado mantendo o corpo alinhado."], dica: "Quanto mais horizontal o corpo, mais difícil fica." },
  { id: "puxada-unilateral", grupo: "costas", nome: "Puxada unilateral na polia", en: "single arm lat pulldown", equip: "Polia alta", musc: { p: ["dorsal"], s: ["biceps"] }, passos: ["Segure uma manopla na polia alta com um braço.", "Puxe o cotovelo em direção ao quadril.", "Suba alongando bem antes da próxima repetição."], dica: "Trabalhar um lado por vez ajuda a corrigir assimetrias." },

  { id: "agachamento-frontal", grupo: "pernas", nome: "Agachamento frontal", en: "Front Squats", equip: "Barra", musc: { p: ["quadriceps"], s: ["gluteos", "abdomen", "lombar"] }, passos: ["Apoie a barra na frente dos ombros com os cotovelos altos.", "Agache mantendo o tronco o mais vertical possível.", "Suba empurrando o chão."], dica: "A barra na frente joga o foco para o quadríceps e exige core forte." },
  { id: "passada", grupo: "pernas", nome: "Passada caminhando", en: "Dumbbell Lunges Walking", equip: "Halteres", musc: { p: ["quadriceps", "gluteos"], s: ["posteriores", "abdomen"] }, passos: ["Dê um passo à frente e desça até o joelho de trás quase tocar o chão.", "Empurre com a perna da frente e traga a de trás para o próximo passo.", "Alterne as pernas caminhando."], dica: "Passos mais longos ativam mais o glúteo." },
  { id: "subida-banco", grupo: "pernas", nome: "Subida no banco (step-up)", en: "Step-ups", equip: "Banco e halteres", musc: { p: ["quadriceps", "gluteos"], s: ["posteriores"] }, passos: ["Apoie um pé inteiro no banco.", "Suba empurrando com a perna de cima, sem impulsionar com a de baixo.", "Desça controlado e repita."], dica: "Todo o trabalho vem da perna que está no banco." },
  { id: "terra-sumo", grupo: "pernas", nome: "Levantamento terra sumô", en: "Sumo Deadlift", equip: "Barra", musc: { p: ["gluteos", "quadriceps", "adutores"], s: ["lombar", "trapezio", "antebraco"] }, passos: ["Pés bem afastados com pontas para fora e pegada por dentro dos joelhos.", "Suba estendendo quadril e joelhos com o peito alto.", "Desça controlado mantendo a barra próxima ao corpo."], dica: "A postura mais ereta alivia a lombar em relação ao terra convencional." },
  { id: "agachamento-parede", grupo: "pernas", nome: "Agachamento na parede (isometria)", en: "wall sit", tempo: true, equip: "Peso corporal", musc: { p: ["quadriceps"], s: ["gluteos"] }, passos: ["Apoie as costas na parede e desça até as coxas ficarem paralelas ao chão.", "Mantenha a posição pelo tempo definido.", "Suba deslizando pela parede."], dica: "Excelente para iniciantes criarem resistência de pernas." },

  { id: "elevacao-lateral-cabo", grupo: "ombros", nome: "Elevação lateral na polia", en: "Cable Lateral Raises (Single Arm)", equip: "Polia baixa", musc: { p: ["ombros"], s: ["trapezio"] }, passos: ["Fique de lado para a polia baixa e segure a manopla com a mão de fora.", "Eleve o braço até a linha do ombro.", "Desça resistindo à tração do cabo."], dica: "A polia mantém tensão desde o início do movimento." },

  { id: "rosca-21", grupo: "biceps", nome: "Rosca 21", en: "21s bicep curl", equip: "Barra", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Faça 7 repetições da posição estendida até a metade.", "Faça 7 repetições da metade até o topo.", "Finalize com 7 repetições completas."], dica: "Técnica clássica de intensidade: use menos carga que na rosca direta." },
  { id: "rosca-inclinada", grupo: "biceps", nome: "Rosca no banco inclinado", en: "incline dumbbell curl", equip: "Halteres e banco inclinado", musc: { p: ["biceps"], s: [] }, passos: ["Sente no banco inclinado com os braços pendurados atrás da linha do tronco.", "Flexione os cotovelos sem trazê-los à frente.", "Desça alongando totalmente o bíceps."], dica: "O alongamento extra na descida é o diferencial deste exercício." },
  { id: "rosca-punho", grupo: "biceps", nome: "Rosca de punho (antebraço)", en: "Barbell Wrist Curl", equip: "Barra ou halteres", musc: { p: ["antebraco"], s: [] }, passos: ["Apoie os antebraços nas coxas com as palmas para cima e os punhos livres.", "Flexione os punhos elevando o peso.", "Desça deixando o peso rolar até os dedos."], dica: "Fortalece a pegada: ajuda em todos os exercícios de puxar." },

  { id: "triceps-unilateral", grupo: "triceps", nome: "Tríceps unilateral na polia", en: "single arm tricep pushdown", equip: "Polia alta", musc: { p: ["triceps"], s: [] }, passos: ["Segure a manopla com uma mão e o cotovelo colado ao tronco.", "Estenda o braço até embaixo.", "Retorne controlado sem mover o cotovelo."], dica: "Um braço por vez para corrigir diferenças de força." },
  { id: "triceps-testa-halteres", grupo: "triceps", nome: "Tríceps testa com halteres", en: "dumbbell skull crusher", equip: "Halteres e banco", musc: { p: ["triceps"], s: [] }, passos: ["Deitado, segure um halter em cada mão acima do peito com pegada neutra.", "Flexione os cotovelos descendo os halteres ao lado da cabeça.", "Estenda de volta ao topo."], dica: "A pegada neutra dos halteres é mais confortável para os cotovelos que a barra." },

  { id: "giro-russo", grupo: "abdomen", nome: "Giro russo", en: "Russian Twist", equip: "Anilha ou halter", musc: { p: ["obliquos"], s: ["abdomen"] }, passos: ["Sente com o tronco levemente inclinado para trás e pés elevados.", "Gire o tronco levando o peso de um lado ao outro.", "Mantenha o abdômen contraído o tempo todo."], dica: "Gire o tronco inteiro, não apenas os braços." },
  { id: "abdominal-roda", grupo: "abdomen", nome: "Rollout (roda abdominal)", en: "Ab wheel", equip: "Roda abdominal ou barra", musc: { p: ["abdomen"], s: ["obliquos", "lombar", "ombros"] }, passos: ["Ajoelhe segurando a roda no chão à frente dos joelhos.", "Role à frente estendendo o corpo sem deixar o quadril cair.", "Volte contraindo o abdômen."], dica: "Vá só até onde consegue manter a lombar neutra." },
  { id: "abdominal-declinado", grupo: "abdomen", nome: "Abdominal no banco declinado", en: "decline sit up", equip: "Banco declinado", musc: { p: ["abdomen"], s: ["obliquos"] }, passos: ["Prenda os pés no banco declinado.", "Suba o tronco enrolando a coluna.", "Desça controlado sem relaxar no final."], dica: "Segure uma anilha no peito para progredir na carga." },
  { id: "escalador", grupo: "abdomen", nome: "Escalador (mountain climber)", en: "mountain climber", equip: "Peso corporal", musc: { p: ["abdomen"], s: ["obliquos", "ombros", "quadriceps"] }, passos: ["Em posição de prancha alta, traga um joelho em direção ao peito.", "Alterne as pernas em ritmo constante.", "Mantenha o quadril baixo e o core firme."], dica: "Também eleva a frequência cardíaca: bom para finalizar o treino." },

  { id: "coice-solo", grupo: "gluteos", nome: "Coice no solo (4 apoios)", en: "quadruped hip extension", equip: "Peso corporal ou caneleira", musc: { p: ["gluteos"], s: ["posteriores"] }, passos: ["Em quatro apoios, mantenha o joelho flexionado a 90°.", "Eleve a perna empurrando o calcanhar para o teto.", "Desça sem apoiar o joelho no chão."], dica: "Contraia o glúteo no topo por 1 segundo em cada repetição." },
  { id: "ponte-unilateral", grupo: "gluteos", nome: "Elevação pélvica unilateral", en: "single leg hip thrust", equip: "Peso corporal ou banco", musc: { p: ["gluteos"], s: ["posteriores", "abdomen"] }, passos: ["Na posição de elevação pélvica, estenda uma perna à frente.", "Eleve o quadril com a perna de apoio.", "Desça controlado e complete a série antes de trocar."], dica: "Versão avançada: dobra o estímulo em cada glúteo." },
  { id: "abducao-solo", grupo: "gluteos", nome: "Abdução deitada (solo)", en: "side lying leg raise", equip: "Peso corporal ou caneleira", musc: { p: ["gluteos"], s: [] }, passos: ["Deite de lado com o corpo alinhado.", "Eleve a perna de cima estendida até ~45°.", "Desça controlado sem apoiar totalmente."], dica: "Foca o glúteo médio: importante para estabilidade do quadril." },

  // ---- BIBLIOTECA AMPLIADA v2: variacoes de maquina, halteres, polia e peso corporal ----
  { id: "supino-halteres-neutro", grupo: "peito", nome: "Supino com pegada neutra (hex press)", en: "Dumbbell Hex Press", equip: "Halteres e banco", musc: { p: ["peito"], s: ["triceps","ombros"] }, passos: ["Deite no banco com os halteres juntos sobre o peito, palmas viradas uma para a outra.","Empurre para cima mantendo os halteres pressionados um contra o outro.","Desça devagar sem afastar os pesos."], dica: "A pressão entre os halteres mantém o peitoral contraído do começo ao fim da série." },
  { id: "supino-chao", grupo: "peito", nome: "Supino no chão com halteres", en: "Dumbbell Floor Press", equip: "Halteres", musc: { p: ["peito"], s: ["triceps"] }, passos: ["Deite no chão com os joelhos dobrados e um halter em cada mão.","Desça até os cotovelos tocarem o chão de leve.","Empurre para cima até estender os braços."], dica: "O chão limita a descida e poupa o ombro: boa opção para quem sente desconforto no supino comum." },
  { id: "supino-smith-inclinado", grupo: "peito", nome: "Supino inclinado no Smith", en: "Smith Machine Slight Incline Press", equip: "Aparelho Smith e banco", musc: { p: ["peito"], s: ["ombros","triceps"] }, passos: ["Ajuste o banco numa inclinação leve, entre 15° e 30°, sob a barra do Smith.","Destrave a barra e desça até a parte alta do peito.","Empurre de volta sem travar os cotovelos."], dica: "A trajetória guiada deixa você focar na carga sem se preocupar em equilibrar a barra." },
  { id: "supino-maquina-declinado", grupo: "peito", nome: "Supino declinado na máquina", en: "Hammerstrength Decline Chest Press", equip: "Máquina", musc: { p: ["peito"], s: ["triceps"] }, passos: ["Ajuste o banco para as manoplas ficarem na altura da parte baixa do peito.","Empurre à frente e levemente para baixo até quase estender os cotovelos.","Retorne controlando a volta do peso."], dica: "Enfatiza a porção inferior do peitoral com bem menos exigência de equilíbrio que a barra." },
  { id: "supino-inclinado-maquina", grupo: "peito", nome: "Supino inclinado na máquina", en: "Incline Bench Press - MP", equip: "Máquina", musc: { p: ["peito"], s: ["ombros","triceps"] }, passos: ["Sente na máquina com as costas bem apoiadas no encosto inclinado.","Empurre as manoplas para cima e à frente até quase estender os braços.","Desça devagar até sentir o peito alongar."], dica: "Ótima para treinar o peito superior com segurança quando não há parceiro para observar." },
  { id: "crucifixo-maquina", grupo: "peito", nome: "Crucifixo na máquina", en: "Machine chest fly", equip: "Máquina", musc: { p: ["peito"], s: ["ombros"] }, passos: ["Sente com as costas apoiadas e segure as manoplas com os braços abertos.","Feche os braços à frente em arco, apertando o peito no final.","Abra devagar até sentir o alongamento, sem deixar o peso bater."], dica: "Diferente do supino, aqui o peitoral trabalha sozinho: use carga que permita controlar a abertura." },
  { id: "crucifixo-polia-sentado", grupo: "peito", nome: "Crucifixo sentado na polia", en: "Seated Cable chest fly", equip: "Polia dupla e banco", musc: { p: ["peito"], s: ["ombros"] }, passos: ["Sente entre as polias e segure uma manopla em cada mão, braços abertos.","Junte as mãos à frente do peito descrevendo um arco.","Volte devagar resistindo à tração dos cabos."], dica: "O cabo mantém tensão constante, inclusive na parte final do movimento, onde a máquina costuma aliviar." },
  { id: "pullover-polia-alta", grupo: "peito", nome: "Pullover na polia alta", en: "High-pulley pullover", equip: "Polia alta com corda", musc: { p: ["peito","dorsal"], s: ["triceps"] }, passos: ["De pé, de frente para a polia alta, segure a corda com os braços quase estendidos.","Puxe para baixo em arco até as mãos chegarem à altura do quadril.","Retorne devagar sem dobrar os cotovelos."], dica: "Incline o tronco um pouco à frente e mantenha-o parado: só os ombros se movem." },
  { id: "flexao-diamante", grupo: "peito", nome: "Flexão diamante (pegada fechada)", en: "Close-grip Press-ups", equip: "Peso corporal", musc: { p: ["triceps","peito"], s: ["ombros"] }, passos: ["Apoie as mãos no chão formando um triângulo com polegares e indicadores.","Desça o peito até quase tocar as mãos, cotovelos rentes ao corpo.","Empurre o chão até estender os braços."], dica: "Quanto mais fechada a pegada, mais o tríceps assume o trabalho." },
  { id: "flexao-explosiva", grupo: "peito", nome: "Flexão explosiva", en: "explosive push ups", equip: "Peso corporal", musc: { p: ["peito"], s: ["triceps","ombros"] }, passos: ["Comece na posição de flexão com o corpo alinhado.","Desça controlado e suba com força suficiente para as mãos saírem do chão.","Amorteça a queda dobrando os cotovelos e emende a próxima repetição."], dica: "Treina potência: prefira séries curtas, de 3 a 6 repetições, com qualidade total." },
  { id: "flexao-palmas", grupo: "peito", nome: "Flexão com palmas", en: "Clap Push-UP", equip: "Peso corporal", musc: { p: ["peito"], s: ["triceps","ombros","abdomen"] }, passos: ["Na posição de flexão, desça o peito até perto do chão.","Suba explosivamente e bata as palmas no ar.","Volte as mãos ao chão e amorteça a descida."], dica: "Só tente depois de fazer flexões explosivas com folga: a aterrissagem exige punho e ombro preparados." },
  { id: "flexao-com-peso", grupo: "peito", nome: "Flexão com peso nas costas", en: "Weighted push-ups", equip: "Anilha ou colete", musc: { p: ["peito"], s: ["triceps","ombros","abdomen"] }, passos: ["Peça para colocarem uma anilha no meio das suas costas, ou use um colete de peso.","Desça o peito até quase tocar o chão mantendo o corpo reto.","Empurre até estender os braços sem deixar o quadril subir."], dica: "É como progredir na flexão depois que o peso do corpo virou fácil demais." },
  { id: "flexao-hindu", grupo: "peito", nome: "Flexão hindu", en: "Hindu Pushups", equip: "Peso corporal", musc: { p: ["peito","ombros"], s: ["triceps","lombar"] }, passos: ["Comece com o quadril alto, corpo em V invertido e mãos no chão.","Mergulhe o peito para frente e para baixo, passando rente ao chão.","Termine com o peito aberto e os braços estendidos, quadril baixo."], dica: "Um movimento só, fluido: trabalha peito e ombros e ainda solta a coluna." },
  { id: "flexao-pino", grupo: "peito", nome: "Flexão em pino (parada de mão)", en: "Handstand Pushup", equip: "Parede", musc: { p: ["ombros"], s: ["triceps","peito","abdomen"] }, passos: ["Fique de cabeça para baixo com os pés apoiados na parede e mãos no chão.","Desça flexionando os cotovelos até a cabeça quase tocar o chão.","Empurre de volta até estender os braços."], dica: "Exercício avançado: comece com a versão de pique, com os pés num banco, antes de ir para a parede." },
  { id: "barra-fixa-supinada", grupo: "costas", nome: "Barra fixa supinada (chin up)", en: "Chin Up", equip: "Barra fixa", musc: { p: ["dorsal","biceps"], s: ["antebraco","abdomen"] }, passos: ["Segure a barra com as palmas viradas para você, na largura dos ombros.","Puxe o corpo até o queixo passar a barra.","Desça controlado até quase estender os braços."], dica: "A pegada supinada envolve muito mais o bíceps: costuma ser a barra mais fácil para começar." },
  { id: "remada-maquina-fechada", grupo: "costas", nome: "Remada na máquina com pegada fechada", en: "Rowing seated, narrow grip", equip: "Máquina", musc: { p: ["dorsal"], s: ["biceps","trapezio"] }, passos: ["Sente com o peito apoiado e segure as manoplas com pegada estreita.","Puxe levando os cotovelos rentes ao corpo, bem para trás.","Volte alongando as costas sem soltar o peso de uma vez."], dica: "A pegada fechada joga o trabalho para a parte central das costas e a espessura do dorsal." },
  { id: "remada-unilateral-polia", grupo: "costas", nome: "Remada unilateral na polia", en: "Unilateral Cable row", equip: "Polia baixa", musc: { p: ["dorsal"], s: ["biceps","trapezio"] }, passos: ["Sente ou fique de pé de frente para a polia e segure a manopla com um braço.","Puxe o cotovelo para trás até a mão chegar ao lado do tronco.","Estenda o braço à frente deixando a escápula alongar."], dica: "Trabalhar um lado por vez permite girar levemente o tronco e ganhar amplitude." },
  { id: "remada-banco-inclinado", grupo: "costas", nome: "Remada com peito apoiado no banco", en: "Incline Chest-Supported Dumbbell Row", equip: "Halteres e banco inclinado", musc: { p: ["dorsal","trapezio"], s: ["biceps","ombros"] }, passos: ["Deite de bruços num banco inclinado, com um halter em cada mão pendurado.","Puxe os halteres em direção ao quadril apertando as escápulas.","Desça controlado até estender os braços."], dica: "O peito apoiado elimina qualquer impulso e poupa a lombar: costas isoladas de verdade." },
  { id: "remada-trx", grupo: "costas", nome: "Remada na fita de suspensão (TRX)", en: "TRX Rows", equip: "Fitas de suspensão", musc: { p: ["dorsal"], s: ["biceps","abdomen","trapezio"] }, passos: ["Segure as alças e incline o corpo para trás com os braços estendidos.","Puxe o peito em direção às mãos mantendo o corpo em linha reta.","Desça devagar até estender os braços de novo."], dica: "Quanto mais deitado você fica, mais difícil: dá para ajustar a dificuldade só andando com os pés." },
  { id: "terra-rack", grupo: "costas", nome: "Levantamento terra parcial (rack)", en: "Rack Deadlift", equip: "Barra e suportes", musc: { p: ["dorsal","lombar"], s: ["trapezio","gluteos","antebraco"] }, passos: ["Apoie a barra nos suportes na altura dos joelhos.","Segure a barra, peito alto, e estenda o quadril até ficar em pé.","Desça a barra de volta aos suportes com a coluna neutra."], dica: "Amplitude menor permite mais carga que o terra completo, com menos exigência de mobilidade." },
  { id: "terra-kettlebell", grupo: "costas", nome: "Levantamento terra com kettlebell", en: "Kettlebell deadlifts", equip: "Kettlebell", musc: { p: ["lombar","gluteos","posteriores"], s: ["dorsal","trapezio"] }, passos: ["Posicione o kettlebell entre os pés, na largura do quadril.","Empurre o quadril para trás, segure a alça e suba estendendo quadril e joelhos.","Desça levando o quadril para trás com a coluna neutra."], dica: "Excelente para aprender o padrão do terra antes de partir para a barra." },
  { id: "puxada-neutra", grupo: "costas", nome: "Puxada com pegada neutra", en: "Neutral-grip chest pulldown", equip: "Polia alta com barra neutra", musc: { p: ["dorsal"], s: ["biceps","trapezio"] }, passos: ["Segure a barra com as palmas viradas uma para a outra.","Puxe até a parte alta do peito, levando os cotovelos para baixo e para trás.","Suba controlado deixando as escápulas alongarem."], dica: "A pegada neutra é a mais confortável para quem sente o ombro nas outras puxadas." },
  { id: "puxada-supinada-fechada", grupo: "costas", nome: "Puxada supinada com pegada fechada", en: "Close-grip supinated lat pulldown", equip: "Polia alta", musc: { p: ["dorsal"], s: ["biceps"] }, passos: ["Segure a barra com as palmas viradas para você e as mãos próximas.","Puxe até o peito mantendo os cotovelos colados ao tronco.","Suba alongando bem o dorsal."], dica: "Combina dorsal e bíceps: bom para fechar o treino de costas com boa amplitude." },
  { id: "pulldown-corda", grupo: "costas", nome: "Pullover na polia com corda", en: "Rope Pullover/row", equip: "Polia alta com corda", musc: { p: ["dorsal"], s: ["triceps","trapezio"] }, passos: ["De pé, segure a corda com os braços estendidos acima da cabeça.","Puxe a corda para baixo e para trás em arco, abrindo as pontas no final.","Retorne devagar sem dobrar os cotovelos."], dica: "A corda permite abrir as mãos no fim do movimento e apertar mais o dorsal." },
  { id: "remada-alta-curvada", grupo: "costas", nome: "Remada alta curvada (bent high pull)", en: "Bent High Pulls", equip: "Barra ou halteres", musc: { p: ["trapezio","ombros"], s: ["dorsal","biceps"] }, passos: ["Incline o tronco à frente com a barra pendurada e coluna neutra.","Puxe a barra em direção ao peito com os cotovelos altos e abertos.","Desça controlado até estender os braços."], dica: "Trabalha trapézio e deltoide posterior juntos: use carga moderada para não roubar com a lombar." },
  { id: "remada-prancha", grupo: "costas", nome: "Remada na prancha", en: "Single Arm Plank to Row", equip: "Halteres", musc: { p: ["dorsal"], s: ["abdomen","obliquos","biceps"] }, passos: ["Fique em prancha alta com uma mão em cada halter, pés afastados.","Puxe um halter em direção ao quadril sem girar o quadril.","Devolva ao chão e repita com o outro braço."], dica: "Metade costas, metade abdômen: o desafio é manter o quadril imóvel enquanto puxa." },
  { id: "agachamento-caixa", grupo: "pernas", nome: "Agachamento na caixa", en: "Box squat", equip: "Barra e caixa ou banco", musc: { p: ["quadriceps","gluteos"], s: ["posteriores"] }, passos: ["Posicione uma caixa atrás de você na altura que deixa a coxa paralela ao chão.","Desça empurrando o quadril para trás até sentar de leve na caixa.","Suba empurrando o chão, sem quicar no apoio."], dica: "A caixa ensina a profundidade certa e dá confiança para descer sem medo." },
  { id: "agachamento-frontal-halter", grupo: "pernas", nome: "Agachamento frontal com halteres", en: "Dumbbell Front Squat", equip: "Halteres", musc: { p: ["quadriceps"], s: ["gluteos","abdomen"] }, passos: ["Apoie um halter em cada ombro, cotovelos apontados à frente.","Agache mantendo o tronco o mais vertical possível.","Suba empurrando o chão com o pé inteiro."], dica: "Com o peso à frente, o quadríceps assume o trabalho e o tronco precisa ficar ereto." },
  { id: "agachamento-lateral", grupo: "pernas", nome: "Agachamento lateral com halter", en: "Dumbbell Side Squat", equip: "Halter", musc: { p: ["quadriceps","adutores"], s: ["gluteos"] }, passos: ["Em pé, segure um halter junto ao peito e dê um passo largo para o lado.","Agache sobre a perna que se afastou, deixando a outra estendida.","Empurre o chão para voltar ao centro e troque o lado."], dica: "Trabalha a parte interna da coxa e a mobilidade do quadril, que o agachamento comum não pega." },
  { id: "agachamento-pistol", grupo: "pernas", nome: "Agachamento unilateral (pistol)", en: "Pistol Squat", equip: "Peso corporal", musc: { p: ["quadriceps","gluteos"], s: ["posteriores","abdomen"] }, passos: ["Fique sobre uma perna com a outra estendida à frente.","Desça devagar sobre a perna de apoio até o quadril chegar perto do calcanhar.","Suba empurrando o chão sem apoiar a outra perna."], dica: "Comece segurando um apoio ou sentando num banco alto até ganhar equilíbrio e força." },
  { id: "agachamento-smith-unilateral", grupo: "pernas", nome: "Agachamento afundo no Smith", en: "Smith Machine Split Squat", equip: "Aparelho Smith", musc: { p: ["quadriceps","gluteos"], s: ["posteriores"] }, passos: ["Posicione um pé à frente e outro atrás, sob a barra do Smith.","Desça flexionando a perna da frente até o joelho de trás quase tocar o chão.","Suba empurrando com o pé da frente inteiro."], dica: "A barra guiada tira a preocupação com equilíbrio e deixa você focar na perna que trabalha." },
  { id: "agachamento-isometrico", grupo: "pernas", nome: "Agachamento isométrico até a falha", en: "Isometric Squat to Failure", tempo: true, equip: "Peso corporal", musc: { p: ["quadriceps"], s: ["gluteos","abdomen"] }, passos: ["Desça até as coxas ficarem paralelas ao chão.","Segure a posição com o peito alto e os joelhos alinhados aos pés.","Aguente o máximo que conseguir mantendo a postura."], dica: "Ótimo finalizador de treino de pernas: quando a postura piorar, encerre a série." },
  { id: "afundo-reverso", grupo: "pernas", nome: "Afundo reverso (passo atrás)", en: "Reverse lunges", equip: "Halteres ou peso corporal", musc: { p: ["quadriceps","gluteos"], s: ["posteriores"] }, passos: ["Em pé, dê um passo para trás com uma perna.","Desça até o joelho de trás quase tocar o chão.","Empurre com a perna da frente para voltar em pé."], dica: "O passo para trás protege mais o joelho da frente que o afundo tradicional." },
  { id: "afundo-atras-barra", grupo: "pernas", nome: "Afundo com passo atrás na barra", en: "Barbell Step Back Lunge", equip: "Barra", musc: { p: ["quadriceps","gluteos"], s: ["posteriores","abdomen"] }, passos: ["Apoie a barra no trapézio como no agachamento.","Dê um passo longo para trás e desça até o joelho quase tocar o chão.","Empurre com a perna da frente para retornar."], dica: "Faça todas as repetições de uma perna antes de trocar: o equilíbrio fica melhor." },
  { id: "afundo-lateral-deslizante", grupo: "pernas", nome: "Afundo lateral deslizante", en: "Sliding Lateral Lunge", equip: "Peso corporal ou disco deslizante", musc: { p: ["quadriceps","adutores"], s: ["gluteos"] }, passos: ["Em pé, deslize um pé para o lado mantendo a perna estendida.","Agache sobre a perna de apoio, quadril para trás.","Puxe o pé de volta ao centro contraindo a parte interna da coxa."], dica: "Movimento controlado: a perna que desliza é a que trabalha na volta." },
  { id: "leg-press-pes-juntos", grupo: "pernas", nome: "Leg press com pés juntos", en: "Leg Presses (narrow)", equip: "Máquina", musc: { p: ["quadriceps"], s: ["gluteos"] }, passos: ["Posicione os pés juntos e no centro da plataforma.","Desça controlado até ~90° de joelho.","Empurre sem travar os joelhos no final."], dica: "Pés juntos e baixos na plataforma jogam o foco para a parte externa do quadríceps." },
  { id: "hack-maquina", grupo: "pernas", nome: "Leg press na máquina hack", en: "Leg Press on Hackenschmidt Machine", equip: "Máquina hack", musc: { p: ["quadriceps"], s: ["gluteos"] }, passos: ["Apoie os ombros nos suportes e os pés na plataforma.","Desça até o joelho formar cerca de 90°.","Suba empurrando a plataforma sem travar os joelhos."], dica: "Costas totalmente apoiadas: dá para usar bastante carga sem sobrecarregar a lombar." },
  { id: "flexora-em-pe", grupo: "pernas", nome: "Flexora em pé (unilateral)", en: "Leg Curls (standing)", equip: "Máquina", musc: { p: ["posteriores"], s: ["panturrilha"] }, passos: ["Em pé na máquina, encaixe o rolo atrás do tornozelo de uma perna.","Flexione o joelho levando o calcanhar em direção ao glúteo.","Desça devagar sem deixar o peso bater."], dica: "Uma perna por vez expõe diferenças de força entre os lados que a mesa flexora esconde." },
  { id: "flexora-deitada", grupo: "pernas", nome: "Mesa flexora deitada", en: "Leg Curls (laying)", equip: "Máquina", musc: { p: ["posteriores"], s: ["panturrilha"] }, passos: ["Deite de bruços com o rolo atrás dos tornozelos.","Flexione os joelhos trazendo os calcanhares aos glúteos.","Retorne devagar mantendo o quadril colado no banco."], dica: "Se o quadril subir do banco, diminua a carga: é sinal de que os posteriores não estão aguentando." },
  { id: "panturrilha-sentado-halter", grupo: "pernas", nome: "Panturrilha sentado com halter", en: "Seated Dumbbell Calf Raise", equip: "Halter e banco", musc: { p: ["panturrilha"], s: [] }, passos: ["Sente com o halter apoiado sobre as coxas, perto dos joelhos.","Apoie as pontas dos pés num degrau e eleve os calcanhares ao máximo.","Desça alongando bem abaixo da linha do apoio."], dica: "Dá para fazer em qualquer academia, mesmo sem a máquina de panturrilha sentado." },
  { id: "panturrilha-dupla", grupo: "pernas", nome: "Panturrilha em pé com as duas pernas", en: "Double Leg Calf Raise", equip: "Peso corporal ou halteres", musc: { p: ["panturrilha"], s: [] }, passos: ["Fique com as pontas dos pés num degrau e os calcanhares livres.","Suba o máximo que conseguir na ponta dos pés.","Desça devagar até sentir a panturrilha alongar."], dica: "Panturrilha responde a repetição alta: séries de 15 a 25 costumam funcionar melhor." },
  { id: "terra-unilateral", grupo: "pernas", nome: "Levantamento terra unilateral", en: "Single-Leg Deadlift with Dumbbell", equip: "Halter", musc: { p: ["posteriores","gluteos"], s: ["lombar","abdomen"] }, passos: ["Em pé sobre uma perna, segure um halter na mão oposta.","Incline o tronco à frente levando a perna livre para trás, como uma gangorra.","Volte contraindo o glúteo da perna de apoio."], dica: "Mantenha o quadril nivelado: se abrir para o lado, o exercício perde o efeito." },
  { id: "kettlebell-swing", grupo: "pernas", nome: "Balanço com kettlebell (swing)", en: "Kettlebell Swing", equip: "Kettlebell", musc: { p: ["gluteos","posteriores"], s: ["lombar","abdomen","ombros"] }, passos: ["Segure o kettlebell com as duas mãos e leve-o entre as pernas empurrando o quadril para trás.","Estenda o quadril com força para lançar o peso até a altura do peito.","Deixe o kettlebell voltar entre as pernas e emende o próximo balanço."], dica: "A força vem do quadril, não dos braços: eles só acompanham o peso." },
  { id: "nordico-reverso", grupo: "pernas", nome: "Nórdico reverso", en: "Reverse Nordic Curl", equip: "Peso corporal", musc: { p: ["quadriceps"], s: ["abdomen"] }, passos: ["Ajoelhe com o corpo ereto e o abdômen contraído.","Incline o tronco para trás devagar, mantendo o quadril estendido.","Volte à posição inicial usando a força da coxa."], dica: "Vá só até onde consegue voltar sem impulso: a amplitude aumenta com as semanas." },
  { id: "desenvolvimento-barra-sentado", grupo: "ombros", nome: "Desenvolvimento sentado com barra", en: "Shoulder Press, Barbell", equip: "Barra e banco", musc: { p: ["ombros"], s: ["triceps","trapezio"] }, passos: ["Sente no banco com encosto e segure a barra na altura das clavículas.","Empurre para cima até quase estender os cotovelos.","Desça controlado até a altura do queixo."], dica: "O encosto tira a lombar da jogada e permite mais carga que o desenvolvimento em pé." },
  { id: "desenvolvimento-unilateral", grupo: "ombros", nome: "Desenvolvimento unilateral com halter", en: "Single-arm dumbbell shoulder press", equip: "Halter", musc: { p: ["ombros"], s: ["triceps","abdomen"] }, passos: ["Segure um halter na altura da orelha, com o outro braço livre.","Empurre para cima até estender o cotovelo.","Desça devagar sem inclinar o tronco para o lado."], dica: "Um braço por vez obriga o abdômen a trabalhar para manter o tronco parado." },
  { id: "desenvolvimento-smith", grupo: "ombros", nome: "Desenvolvimento no Smith", en: "Smith Press", equip: "Aparelho Smith", musc: { p: ["ombros"], s: ["triceps"] }, passos: ["Sente sob a barra do Smith com o banco em posição vertical.","Destrave a barra e desça até a altura do queixo.","Empurre para cima sem travar os cotovelos."], dica: "Trajetória guiada: boa opção para levar o ombro à falha com segurança." },
  { id: "desenvolvimento-barra-w", grupo: "ombros", nome: "Desenvolvimento militar com barra W", en: "Military Press mit SZ-Bar", equip: "Barra W", musc: { p: ["ombros"], s: ["triceps","abdomen"] }, passos: ["Segure a barra W nas pegadas anguladas, na altura do peito.","Empurre acima da cabeça até estender os braços.","Desça controlado até as clavículas."], dica: "A barra angulada é mais gentil com o punho que a barra reta." },
  { id: "desenvolvimento-arremesso", grupo: "ombros", nome: "Desenvolvimento com impulso (push press)", en: "Push Press", equip: "Barra", musc: { p: ["ombros"], s: ["triceps","quadriceps","gluteos"] }, passos: ["Com a barra nas clavículas, flexione levemente os joelhos.","Estenda as pernas com força e use o impulso para empurrar a barra acima da cabeça.","Desça a barra controlada até as clavículas."], dica: "O impulso das pernas permite usar mais carga que o desenvolvimento estrito." },
  { id: "elevacao-lateral-maquina", grupo: "ombros", nome: "Elevação lateral na máquina", en: "Machine Lateral Raise", equip: "Máquina", musc: { p: ["ombros"], s: ["trapezio"] }, passos: ["Sente com os braços encaixados nos apoios laterais.","Eleve os braços até a linha dos ombros.","Desça devagar resistindo ao peso."], dica: "Sem precisar estabilizar o halter, dá para sentir melhor o deltoide lateral trabalhando." },
  { id: "crucifixo-inverso-polia", grupo: "ombros", nome: "Crucifixo inverso na polia", en: "Cable Rear Delt Fly", equip: "Polia dupla", musc: { p: ["ombros"], s: ["trapezio","dorsal"] }, passos: ["De pé entre as polias, cruze os cabos e segure a manopla oposta em cada mão.","Abra os braços para trás na linha dos ombros.","Volte controlado cruzando os cabos à frente."], dica: "Deltoide posterior é o mais esquecido do ombro: capriche na abertura e use carga leve." },
  { id: "crucifixo-inverso-banco", grupo: "ombros", nome: "Crucifixo inverso no banco inclinado", en: "Incline Bench Reverse Fly", equip: "Halteres e banco inclinado", musc: { p: ["ombros"], s: ["trapezio","dorsal"] }, passos: ["Deite de bruços num banco inclinado com um halter em cada mão.","Abra os braços para os lados até a linha dos ombros.","Desça devagar sem deixar o peso cair."], dica: "O peito apoiado impede o impulso: o deltoide posterior trabalha sozinho." },
  { id: "elevacao-posterior-sentado", grupo: "ombros", nome: "Elevação posterior sentado", en: "Seated rear delt rise", equip: "Halteres e banco", musc: { p: ["ombros"], s: ["trapezio"] }, passos: ["Sente na ponta do banco e incline o tronco sobre as coxas.","Com um halter em cada mão, abra os braços para os lados.","Desça devagar mantendo o tronco inclinado."], dica: "Posição simples que você monta em qualquer canto da academia com dois halteres." },
  { id: "remada-alta-halteres", grupo: "ombros", nome: "Remada alta com halteres", en: "Upright Row w/ Dumbbells", equip: "Halteres", musc: { p: ["ombros","trapezio"], s: ["biceps"] }, passos: ["Segure um halter em cada mão à frente das coxas.","Puxe os halteres para cima levando os cotovelos acima das mãos.","Desça controlado até estender os braços."], dica: "Com halteres o punho fica livre para girar, o que costuma incomodar menos o ombro." },
  { id: "remada-alta-barra-w", grupo: "ombros", nome: "Remada alta com barra W", en: "Upright Row, SZ-bar", equip: "Barra W", musc: { p: ["ombros","trapezio"], s: ["biceps"] }, passos: ["Segure a barra W nas pegadas anguladas, à frente das coxas.","Puxe até a altura do peito com os cotovelos apontando para cima.","Desça devagar até estender os braços."], dica: "Suba só até onde não sentir pinçamento no ombro: nem todo mundo chega ao queixo." },
  { id: "encolhimento-barra", grupo: "ombros", nome: "Encolhimento com barra", en: "Shrugs, Barbells", equip: "Barra", musc: { p: ["trapezio"], s: ["antebraco"] }, passos: ["Segure a barra à frente das coxas com os braços estendidos.","Eleve os ombros em direção às orelhas o máximo que conseguir.","Desça alongando o trapézio."], dica: "Segure 1 segundo no topo: encolhimento rápido demais quase não estimula nada." },
  { id: "encolhimento-halteres", grupo: "ombros", nome: "Encolhimento com halteres", en: "Shrugs, Dumbbells", equip: "Halteres", musc: { p: ["trapezio"], s: ["antebraco"] }, passos: ["Segure um halter em cada mão ao lado do corpo.","Eleve os ombros em direção às orelhas.","Desça devagar até alongar o trapézio."], dica: "Com halteres ao lado do corpo a amplitude é maior que com a barra à frente." },
  { id: "arranco-halter", grupo: "ombros", nome: "Arranco com halter (snatch)", en: "dumbbell snatch", equip: "Halter", musc: { p: ["ombros"], s: ["trapezio","gluteos","posteriores","abdomen"] }, passos: ["Com o halter entre as pernas, empurre o quadril para trás e segure o peso.","Estenda quadril e joelhos com força puxando o halter rente ao corpo.","Receba o peso acima da cabeça com o braço estendido."], dica: "Movimento de potência: prefira carga moderada e séries curtas, priorizando a técnica." },
  { id: "giro-anilha", grupo: "ombros", nome: "Giro de anilha (bus driver)", en: "Bus Drivers", equip: "Anilha", musc: { p: ["ombros"], s: ["antebraco"] }, passos: ["Segure uma anilha com as duas mãos, braços estendidos à frente na altura dos ombros.","Gire a anilha como um volante, levando uma mão para cima e outra para baixo.","Volte ao centro e gire para o outro lado."], dica: "Anilha leve já basta: o desafio é manter os braços estendidos durante toda a série." },
  { id: "face-pull-elastico", grupo: "ombros", nome: "Face pull com elástico", en: "Face pulls with yellow/green band", equip: "Elástico", musc: { p: ["ombros"], s: ["trapezio"] }, passos: ["Prenda o elástico na altura do rosto e segure uma ponta em cada mão.","Puxe em direção ao rosto abrindo os cotovelos para os lados.","Retorne devagar controlando o elástico."], dica: "Perfeito para aquecer o ombro antes do treino de peito ou como exercício em casa." },
  { id: "rosca-barra-w", grupo: "biceps", nome: "Rosca com barra W", en: "Biceps Curls With SZ-bar", equip: "Barra W", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Segure a barra W nas pegadas anguladas, braços estendidos.","Flexione os cotovelos levando a barra até os ombros.","Desça controlado até estender."], dica: "A angulação da barra W alivia o punho de quem sente desconforto na barra reta." },
  { id: "rosca-alternada-sentado", grupo: "biceps", nome: "Rosca alternada sentado", en: "Alternating Biceps Curls With Dumbbell", equip: "Halteres e banco", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Sente no banco com um halter em cada mão ao lado do corpo.","Suba um braço girando a palma para cima durante a subida.","Desça devagar e repita com o outro braço."], dica: "Sentado fica impossível dar impulso com o corpo: o bíceps trabalha sozinho." },
  { id: "rosca-martelo-alternada", grupo: "biceps", nome: "Rosca martelo alternada", en: "Alternating dumbbell hammer curl", equip: "Halteres", musc: { p: ["biceps","antebraco"], s: [] }, passos: ["Segure os halteres com as palmas viradas uma para a outra.","Flexione um cotovelo mantendo a pegada neutra.","Desça devagar e alterne o braço."], dica: "Pegada neutra ativa o braquial, o músculo que empurra o bíceps para cima e engrossa o braço." },
  { id: "rosca-martelo-polia", grupo: "biceps", nome: "Rosca martelo na polia", en: "Hammercurls on Cable", equip: "Polia baixa com corda", musc: { p: ["biceps","antebraco"], s: [] }, passos: ["Segure a corda da polia baixa com pegada neutra.","Flexione os cotovelos até a contração máxima.","Desça resistindo à tração do cabo."], dica: "A corda permite abrir as mãos no topo e apertar ainda mais o antebraço." },
  { id: "rosca-polia-barra-reta", grupo: "biceps", nome: "Rosca na polia com barra reta", en: "Straight Bar Cable Curls", equip: "Polia baixa com barra", musc: { p: ["biceps"], s: ["antebraco"] }, passos: ["Segure a barra da polia baixa com pegada supinada, na largura dos ombros.","Flexione os cotovelos até a barra chegar perto do peito.","Desça controlado sem deixar os cotovelos irem à frente."], dica: "Tensão constante do começo ao fim: o cabo não alivia em nenhum ponto da amplitude." },
  { id: "rosca-concentrada-polia", grupo: "biceps", nome: "Rosca concentrada na polia", en: "Cable Concentration Curl", equip: "Polia baixa", musc: { p: ["biceps"], s: [] }, passos: ["Sente ao lado da polia baixa e apoie o cotovelo na parte interna da coxa.","Flexione o braço até a contração máxima.","Estenda devagar resistindo ao cabo."], dica: "Junta o isolamento da rosca concentrada com a tensão contínua da polia." },
  { id: "rosca-trx", grupo: "biceps", nome: "Rosca na fita de suspensão", en: "Biceps with TRX", equip: "Fitas de suspensão", musc: { p: ["biceps"], s: ["abdomen"] }, passos: ["Segure as alças com as palmas para cima e incline o corpo para trás.","Flexione os cotovelos trazendo as mãos até a testa.","Estenda os braços devagar voltando à inclinação inicial."], dica: "Ajuste a dificuldade andando com os pés: mais deitado, mais pesado." },
  { id: "rosca-punho-barra", grupo: "biceps", nome: "Rosca de punho com barra", en: "Barbell Wrist Curl", equip: "Barra e banco", musc: { p: ["antebraco"], s: [] }, passos: ["Sente e apoie os antebraços nas coxas com as palmas para cima e os punhos livres.","Flexione os punhos elevando a barra.","Desça deixando a barra rolar até os dedos."], dica: "Antebraço forte melhora a pegada em todos os exercícios de puxar." },

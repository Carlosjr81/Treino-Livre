function TelaEditarTreino({ treinoInicial, todos, onSalvar, onCancelar, avisar }) {
  // Cada item ganha um identificador estável para que remover um do meio da lista
  // não desloque os campos de séries/repetições dos itens seguintes.
  const [t, setT] = useState(() => ({
    ...treinoInicial,
    itens: (treinoInicial.itens || []).map((it) => ({ ...it, uid: it.uid || novoUid() })),
  }));
  const [busca, setBusca] = useState("");

  const salvar = () => {
    if (!t.nome.trim()) { avisar("Dê um nome para a ficha (ex.: Treino A - Peito e Tríceps)"); return; }
    onSalvar(t);
  };
  const addEx = (id) => setT({ ...t, itens: [...t.itens, { uid: novoUid(), exercicioId: id, series: 3, reps: 12, obs: "" }] });
  const rmEx = (i) => setT({ ...t, itens: t.itens.filter((_, idx) => idx !== i) });
  const upItem = (i, campo, val) => setT({ ...t, itens: t.itens.map((it, idx) => (idx === i ? { ...it, [campo]: val } : it)) });
  // Reordenar: bi-set só faz sentido entre exercícios vizinhos, então mover
  // itens de lugar é o que permite montar o conjunto que a pessoa quer.
  const moverItem = (i, delta) => {
    const j = i + delta;
    if (j < 0 || j >= t.itens.length) return;
    const copia = [...t.itens];
    const tmp = copia[i]; copia[i] = copia[j]; copia[j] = tmp;
    setT({ ...t, itens: copia });
  };
  // Liga/desliga o agrupamento deste item com o de baixo (bi-set / tri-set)
  const alternarConjunto = (i) => {
    if (i >= t.itens.length - 1) return;
    const a = t.itens[i], b = t.itens[i + 1];
    const juntos = a.conjunto && a.conjunto === b.conjunto;
    const copia = [...t.itens];
    if (juntos) {
      // desfaz só a ligação com o de baixo; quem vem depois continua junto do b
      const idAntigo = a.conjunto;
      const novoId = "cj" + novoUid();
      for (let k = i + 1; k < copia.length && copia[k].conjunto === idAntigo; k++) {
        copia[k] = { ...copia[k], conjunto: novoId };
      }
      // se o de cima ficou sozinho no conjunto, limpa a marca
      const aindaTem = copia.some((x, k) => k !== i && x.conjunto === idAntigo);
      if (!aindaTem) copia[i] = { ...copia[i], conjunto: null };
      const bSozinho = copia.filter((x) => x.conjunto === novoId).length < 2;
      if (bSozinho) copia.forEach((x, k) => { if (x.conjunto === novoId) copia[k] = { ...x, conjunto: null }; });
    } else {
      const id = a.conjunto || b.conjunto || "cj" + novoUid();
      copia[i] = { ...a, conjunto: id };
      copia[i + 1] = { ...b, conjunto: id };
    }
    setT({ ...t, itens: copia });
  };

  const filtrados = todos.filter((e) => e.nome.toLowerCase().includes(busca.toLowerCase()));
  const exPorId = (id) => todos.find((e) => e.id === id);

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onCancelar}>← Cancelar</button>
      <input style={{ ...S.input, marginBottom: 14, fontWeight: 800 }} placeholder="Nome da ficha (ex.: Treino A)"
        aria-label="Nome da ficha"
        value={t.nome} onChange={(e) => setT({ ...t, nome: e.target.value })} />

      <div style={S.label}>Exercícios da ficha</div>
      <div style={{ margin: "8px 0 16px" }}>
        {t.itens.length === 0 && <div style={{ color: "var(--cinza)", fontSize: 14, padding: "8px 0" }}>Adicione exercícios da lista abaixo.</div>}
        {t.itens.map((it, i) => {
          const e = exPorId(it.exercicioId);
          const nomeEx = e ? e.nome : "Exercício removido";
          const proximo = t.itens[i + 1];
          const juntoComProximo = !!(it.conjunto && proximo && proximo.conjunto === it.conjunto);
          const juntoComAnterior = !!(it.conjunto && i > 0 && t.itens[i - 1].conjunto === it.conjunto);
          return (
            <div key={it.uid || i}
              style={{
                ...S.card, padding: 12,
                ...(it.conjunto ? { borderLeft: "3px solid #E1306C", marginBottom: juntoComProximo ? 4 : 12 } : {}),
              }}>
              {it.conjunto && !juntoComAnterior && (
                <div style={{ ...S.label, color: "#E1306C", fontSize: 10, marginBottom: 8 }}>
                  ⛓ {t.itens.filter((x) => x.conjunto === it.conjunto).length >= 3 ? "Tri-set" : "Bi-set"}
                </div>
              )}
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <MiniaturaExercicio ex={e} tamanho={40} />
                <div style={{ fontWeight: 800, fontSize: 15, flex: 1, minWidth: 0 }}>{nomeEx}</div>
                <button aria-label={"Mover " + nomeEx + " para cima"} disabled={i === 0} onClick={() => moverItem(i, -1)}
                  style={{ background: "none", border: "1px solid var(--borda2)", borderRadius: 7, width: 28, height: 28, color: i === 0 ? "var(--borda2)" : "var(--texto)", fontSize: 13, cursor: i === 0 ? "default" : "pointer" }}>▲</button>
                <button aria-label={"Mover " + nomeEx + " para baixo"} disabled={i === t.itens.length - 1} onClick={() => moverItem(i, 1)}
                  style={{ background: "none", border: "1px solid var(--borda2)", borderRadius: 7, width: 28, height: 28, color: i === t.itens.length - 1 ? "var(--borda2)" : "var(--texto)", fontSize: 13, cursor: "pointer" }}>▼</button>
                <button aria-label={"Tirar " + nomeEx + " da ficha"}
                  style={{ background: "none", border: "none", color: "var(--perigo)", fontSize: 18, cursor: "pointer" }} onClick={() => rmEx(i)}>✕</button>
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ ...S.label, fontSize: 10 }}>Séries</div>
                  <input type="number" style={S.inputMini} value={it.series} min={1}
                    aria-label={"Número de séries de " + nomeEx}
                    onChange={(ev) => upItem(i, "series", Math.max(1, parseInt(ev.target.value) || 1))} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ ...S.label, fontSize: 10 }}>Repetições</div>
                  <input type="number" style={S.inputMini} value={it.reps} min={1}
                    aria-label={"Número de repetições de " + nomeEx}
                    onChange={(ev) => upItem(i, "reps", Math.max(1, parseInt(ev.target.value) || 1))} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ ...S.label, fontSize: 10 }}>Descanso</div>
                  <select style={{ ...S.inputMini, padding: "10px 4px" }} value={it.descanso || 0}
                    aria-label={"Descanso de " + nomeEx}
                    onChange={(ev) => upItem(i, "descanso", parseInt(ev.target.value) || null)}>
                    <option value={0}>geral</option>
                    {[30, 45, 60, 90, 120, 150, 180, 240].map((sg) => (
                      <option key={sg} value={sg}>{Math.floor(sg / 60)}:{sg % 60 < 10 ? "0" : ""}{sg % 60}</option>
                    ))}
                  </select>
                </div>
              </div>
              {i < t.itens.length - 1 && (
                <button onClick={() => alternarConjunto(i)} aria-pressed={juntoComProximo}
                  style={{
                    marginTop: 10, width: "100%", padding: "8px 10px", borderRadius: 9, cursor: "pointer",
                    border: "1px solid " + (juntoComProximo ? "#E1306C" : "var(--borda2)"),
                    background: juntoComProximo ? "#E1306C18" : "transparent",
                    color: juntoComProximo ? "#E1306C" : "var(--cinza)",
                    fontWeight: 800, fontSize: 12,
                  }}>
                  {juntoComProximo ? "⛓ em conjunto com o de baixo — toque para separar" : "⛓ juntar com o de baixo (bi-set)"}
                </button>
              )}
            </div>
          );
        })}
      </div>

      <button style={{ ...S.btn, marginBottom: 18 }} onClick={salvar}>Salvar ficha</button>

      <div style={S.label}>Adicionar exercício</div>
      <input style={{ ...S.input, margin: "8px 0 10px" }} placeholder="Buscar exercício..."
        type="search" aria-label="Buscar exercício para adicionar à ficha"
        value={busca} onChange={(e) => setBusca(e.target.value)} />
      {filtrados.slice(0, LIMITE_LISTA).map((ex) => (
        <div key={ex.id} style={{ ...S.card, padding: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 14 }}>
              {ex.nome}{ex.custom && <span style={S.tagCustom}>Meu</span>}
            </div>
            <div style={{ fontSize: 12, color: corGrupo(grupoPorId(ex.grupo)) }}>{grupoPorId(ex.grupo).nome}</div>
          </div>
          <button aria-label={"Adicionar " + ex.nome + " à ficha"}
            style={{ background: GRAD, color: "#FFFFFF", border: "none", borderRadius: 10, width: 34, height: 34, fontWeight: 900, fontSize: 18, cursor: "pointer" }}
            onClick={() => addEx(ex.id)}>+</button>
        </div>
      ))}
      {filtrados.length > LIMITE_LISTA && (
        <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)", fontSize: 13 }}>
          Mostrando os primeiros {LIMITE_LISTA} de {filtrados.length} exercícios.
          Use a busca acima para encontrar os demais.
        </div>
      )}
    </div>
  );
}

// ---------------- SESSÃO: registro + cronômetro com som + observações + vídeo ----------------
function TelaSessao({ sessao, setSessao, exPorId, todos, historico, celebrar, descanso, setDescanso, som, setSom, onFinalizar, onDescartar, onVoltar, pedirConfirmacao, pesoCorporal,
  bpm, cardioEstado, onConectarCardio, onDesconectarCardio, vozCfg, contarAlto, onAlternarContagem,
  acoesVoz, vozAtiva, vozBarra, vozAnimado, onDescansando, responderVoz }) {
  // Recorde e última execução de cada exercício: servem de referência ao lado de
  // cada série e permitem festejar o recorde no instante em que ele acontece.
  const recordes = useMemo(() => recordesPorExercicio(historico), [historico]);
  const ultimas = useMemo(() => {
    const m = {};
    [...historico]
      .sort((a, b) => new Date(b.data) - new Date(a.data))
      .forEach((h) => (h.itens || []).forEach((it) => {
        if (!m[it.exercicioId] && (it.series || []).length) m[it.exercicioId] = it.series;
      }));
    return m;
  }, [historico]);
  const prFestejado = useRef({});
  // O cronômetro de isometria marca a série ao acabar; a ref evita depender
  // de marcarSerie nas dependências do efeito (que mudaria a cada tecla).
  const marcarSerieRef = useRef(() => {});

  const [mostrarAdd, setMostrarAdd] = useState(false);
  const [demo, setDemo] = useState(null);        // exercício aberto na demonstração
  const [trocando, setTrocando] = useState(null); // índice do exercício sendo substituído
  const [crono, setCrono] = useState(null);       // isometria em andamento: { ei, si, fim }
  const [restaCrono, setRestaCrono] = useState(0);
  const [buscaEx, setBuscaEx] = useState("");
  const [fimDescanso, setFimDescanso] = useState(null);
  const [totalDescanso, setTotalDescanso] = useState(descanso);
  const [agora, setAgora] = useState(Date.now());
  const [avisou, setAvisou] = useState(false);
  const ultimoBipe = useRef(null);

  useEffect(() => {
    if (!fimDescanso) return;
    const iv = setInterval(() => setAgora(Date.now()), 250);
    return () => clearInterval(iv);
  }, [fimDescanso]);

  useEffect(() => { if (onDescansando) onDescansando(!!fimDescanso); }, [fimDescanso, onDescansando]);
  useEffect(() => () => { if (onDescansando) onDescansando(false); }, [onDescansando]);

  const restante = fimDescanso ? Math.max(0, Math.ceil((fimDescanso - agora) / 1000)) : 0;
  const acabou = fimDescanso && restante === 0;

  // Bipes de contagem regressiva (3, 2, 1)
  useEffect(() => {
    if (!fimDescanso || acabou) return;
    if (restante <= 3 && restante > 0 && ultimoBipe.current !== restante) {
      ultimoBipe.current = restante;
      if (som) beep(880, 0.12, 0.25);
    }
  }, [restante, fimDescanso, acabou, som]);

  // Som + vibração de finalização
  useEffect(() => {
    if (acabou && !avisou) {
      setAvisou(true);
      if (som) {
        beep(660, 0.22, 0.3);
        setTimeout(() => beep(990, 0.45, 0.3), 240);
      }
      try { if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch (e) {}
      // Com o celular no bolso, o bipe diz "acabou" mas não diz o que vem agora.
      // Essa é a frase que evita tirar o telefone do bolso entre as séries.
      if (vozAtiva && responderVoz) {
        const prox = alvo ? " Próxima: série " + (alvo.si + 1) + " de " + nomeDoItem(alvo.ei) + "." : "";
        responderVoz((vozAnimado ? animo(ANIMO_VOLTA, "volta") + " Descanso fechado." : "Descanso concluído.") + prox, true);
      }
    }
  }, [acabou, avisou, som]);

  // Cronômetro da isometria: conta os segundos da prancha e marca a série no fim.
  // Sem isso a pessoa precisa de um cronômetro à parte para fazer um exercício
  // que o próprio app manda "segurar pelo tempo definido".
  useEffect(() => {
    if (!crono) return;
    // Numa prancha de 60 segundos a pessoa está de cara para o chão e não vê a
    // tela. Saber que passou da metade é o que faz aguentar o resto.
    const total = Math.max(1, Math.round((crono.fim - crono.inicio) / 1000) || 0);
    const avisado = {};
    const tick = () => {
      const resta = Math.max(0, Math.ceil((crono.fim - Date.now()) / 1000));
      setRestaCrono(resta);
      if (vozAtiva && responderVoz) {
        const meio = Math.round(total / 2);
        if (total >= 24 && resta === meio && !avisado.meio) { avisado.meio = true; responderVoz("Metade.", true); }
        else if (total >= 16 && resta === 10 && !avisado.dez) { avisado.dez = true; responderVoz("Faltam 10 segundos. Segura.", true); }
      }
      if (resta <= 3 && resta > 0 && som) beep(880, 0.1, 0.22);
      if (resta === 0) {
        if (som) { beep(660, 0.2, 0.3); setTimeout(() => beep(990, 0.4, 0.3), 220); }
        try { if (navigator.vibrate) navigator.vibrate([250, 100, 250]); } catch (e) {}
        const alvo = crono;
        setCrono(null);
        marcarSerieRef.current(alvo.ei, alvo.si);
      }
    };
    tick();
    const iv = setInterval(tick, 1000);
    return () => clearInterval(iv);
  }, [crono, som, vozAtiva, responderVoz]);

  // Segura a tela acesa enquanto o descanso corre e devolve o controle ao terminar
  useEffect(() => {
    if (!fimDescanso || acabou) { desligarTravaTela(); return; }
    ligarTravaTela();
    // o sistema solta a trava sozinho quando o app vai para segundo plano: ao voltar, repõe
    const aoVoltar = () => {
      if (document.visibilityState === "visible") {
        ligarTravaTela();
        try { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); } catch (e) {}
      }
    };
    document.addEventListener("visibilitychange", aoVoltar);
    return () => {
      document.removeEventListener("visibilitychange", aoVoltar);
      desligarTravaTela();
    };
  }, [fimDescanso, acabou]);

  // Cada exercício pode ter seu próprio descanso: 45s numa rosca e 3min num
  // agachamento não são a mesma coisa. Sem valor próprio, vale o descanso geral.
  const descansoDe = (it) => (it && it.descanso ? it.descanso : descanso);
  const mudarDescansoDe = (ei, delta) => {
    const atual = descansoDe(sessao.itens[ei]);
    const novo = Math.max(15, Math.min(600, atual + delta));
    setSessao({ ...sessao, itens: sessao.itens.map((it, i) => (i === ei ? { ...it, descanso: novo } : it)) });
  };

  const iniciarDescanso = (segundos) => {
    const seg = segundos || descanso;
    setTotalDescanso(seg);
    setFimDescanso(Date.now() + seg * 1000);
    setAvisou(false);
    ultimoBipe.current = null;
    if (som) beep(520, 0.08, 0.15); // clique de início (também "desbloqueia" o áudio no celular)
  };
  const esticarDescanso = (seg) => {
    const s = Math.max(5, Math.round(seg || 15));
    setFimDescanso((f) => (f ? f + s * 1000 : Date.now() + s * 1000));
    setTotalDescanso((tt) => tt + s);
    setAvisou(false);
    ultimoBipe.current = null;
  };
  const mais15 = () => esticarDescanso(15);
  const fecharDescanso = () => { setFimDescanso(null); setAvisou(false); ultimoBipe.current = null; };

  const upSerie = (ei, si, campo, val) => {
    const itens = sessao.itens.map((it, i) =>
      i !== ei ? it : { ...it, series: it.series.map((s, j) => (j !== si ? s : { ...s, [campo]: val })) }
    );
    setSessao({ ...sessao, itens });
  };

  const upObs = (ei, val) => {
    const itens = sessao.itens.map((it, i) => (i !== ei ? it : { ...it, obs: val }));
    setSessao({ ...sessao, itens });
  };

  // Adiciona uma série extra no exercício, repetindo o peso/reps da última
  const addSerie = (ei) => {
    const itens = sessao.itens.map((it, i) => {
      if (i !== ei) return it;
      const ult = it.series[it.series.length - 1];
      // repete o formato da última série: segundos na isometria, peso/reps no resto
      if (ult && ehTempo(ult)) {
        return { ...it, series: [...it.series, { segundos: ult.segundos || "30", feito: false }] };
      }
      const base = ult || { peso: "", reps: "12" };
      return { ...it, series: [...it.series, { peso: base.peso || "", reps: base.reps || "12", feito: false }] };
    });
    setSessao({ ...sessao, itens });
  };

  // Remove a última série (não deixa ficar sem nenhuma)
  const rmSerie = (ei) => {
    const itens = sessao.itens.map((it, i) => {
      if (i !== ei || it.series.length <= 1) return it;
      return { ...it, series: it.series.slice(0, -1) };
    });
    setSessao({ ...sessao, itens });
  };

  // Adiciona um exercício novo no meio do treino (treino livre).
  // Já entra com a carga da última vez, para não precisar lembrar de nada.
  const addExercicio = (idEx) => {
    const sug = sugerirCarga(historico, idEx, 12);
    setSessao({
      ...sessao,
      itens: [...sessao.itens, {
        uid: novoUid(), exercicioId: idEx, obs: "",
        sugerido: sug || null,
        series: montarSeries(exPorId(idEx), 1, 12, sug),
      }],
    });
    setBuscaEx("");
    setMostrarAdd(false);
  };

  // Remove um exercício inteiro do treino
  const rmExercicio = (ei) => {
    const ex = exPorId(sessao.itens[ei].exercicioId);
    pedirConfirmacao("Remover " + (ex ? ex.nome : "este exercício") + " do treino?", () => {
      setSessao({ ...sessao, itens: sessao.itens.filter((_, i) => i !== ei) });
    });
  };

  // Aparelho ocupado? Troca o exercício por outro do mesmo grupo, preferindo
  // os que usam o mesmo equipamento, e mantém a estrutura de séries.
  const alternativasPara = (idEx) => {
    const ex = exPorId(idEx);
    if (!ex) return [];
    const jaNoTreino = {};
    sessao.itens.forEach((it) => { jaNoTreino[it.exercicioId] = true; });
    const mesmoEquip = (e) => (e.equip || "").toLowerCase() === (ex.equip || "").toLowerCase();
    return todos
      .filter((e) => e.grupo === ex.grupo && e.id !== idEx && !jaNoTreino[e.id])
      .sort((a, b) => (mesmoEquip(b) ? 1 : 0) - (mesmoEquip(a) ? 1 : 0) || a.nome.localeCompare(b.nome));
  };
  const substituirExercicio = (ei, novoId) => {
    const item = sessao.itens[ei];
    const sug = sugerirCarga(historico, novoId, parseInt(item.series[0] && item.series[0].reps) || 12);
    setSessao({
      ...sessao,
      itens: sessao.itens.map((it, i) => (i !== ei ? it : {
        ...it,
        exercicioId: novoId,
        obs: "",
        sugerido: sug || null,
        // as séries são mantidas em quantidade, mas a carga passa a ser a do exercício novo
        series: montarSeries(exPorId(novoId), it.series.length, (it.series[0] && it.series[0].reps) || 12, sug),
      })),
    });
    setTrocando(null);
  };

  const alternarAquecimento = (ei, si) => {
    const atual = !!sessao.itens[ei].series[si].aquec;
    upSerie(ei, si, "aquec", !atual);
  };
  const iniciarIsometria = (ei, si) => {
    const seg = parseInt(sessao.itens[ei].series[si].segundos) || 0;
    if (seg <= 0) return;
    if (som) beep(520, 0.08, 0.15);
    setRestaCrono(seg);
    setCrono({ ei, si, inicio: Date.now(), fim: Date.now() + seg * 1000 });
  };

  const marcarSerie = (ei, si) => {
    const item = sessao.itens[ei];
    const serie = item.series[si];
    const jaFeita = serie.feito;
    upSerie(ei, si, "feito", !jaFeita);
    if (jaFeita) return;
    // Em bi-set/tri-set não se descansa no meio: o cronômetro só começa depois
    // da série do último exercício do conjunto.
    const seguinte = sessao.itens[ei + 1];
    const noMeioDoConjunto = !!(item.conjunto && seguinte && seguinte.conjunto === item.conjunto);
    if (!noMeioDoConjunto) iniciarDescanso(descansoDe(item));
    // O ✓ na tela também merece a comemoração falada quando o Jarvis está ouvindo
    const recorde = conferirRecorde(item, serie);
    if (recorde && vozAtiva && responderVoz) responderVoz(recorde, true);
  };

  // Festeja o recorde no instante em que ele acontece. Fica numa função à parte
  // porque a série pode ser marcada pelo botão ✓ ou ditada ao Jarvis, e os dois
  // caminhos precisam festejar igual.
  // Devolve a frase do recorde (ou nada). Quem chamou decide se fala: ditar a
  // série e comemorar são duas falas que não podem atropelar uma à outra.
  const conferirRecorde = (item, serie) => {
    // Aquecimento não bate recorde: ele existe para preparar, não para medir.
    if (ehAquecimento(serie)) return null;

    const rec = recordes[item.exercicioId];
    const ex = exPorId(item.exercicioId);
    if (!rec) return null;

    // Isometria compara segundos; o resto compara carga.
    if (ehTempo(serie)) {
      const seg = segundosDe(serie);
      const chaveT = item.uid + ":t" + seg;
      if (seg > 0 && rec.segundos > 0 && seg > rec.segundos && !prFestejado.current[chaveT]) {
        prFestejado.current[chaveT] = true;
        if (som) setTimeout(() => { beep(784, 0.12, 0.28); setTimeout(() => beep(1175, 0.3, 0.28), 130); }, 120);
        celebrar({
          icone: "🏆",
          titulo: "Novo recorde pessoal",
          destaque: (ex ? ex.nome : "Exercício") + "\n" + seg + " segundos",
          detalhe: "Seu melhor era " + rec.segundos + "s. Você segurou " + (seg - rec.segundos) + "s mais!",
        });
        return "Recorde! " + seg + " segundos em " + (ex ? nomeFalado(ex.nome) : "isometria") + ". Seu melhor era " + rec.segundos + ".";
      }
      return null;
    }

    const peso = cargaDe(serie);
    const reps = repsDe(serie);
    const chave = item.uid + ":" + peso;
    if (peso > 0 && reps > 0 && rec.peso > 0 && peso > rec.peso && !prFestejado.current[chave]) {
      prFestejado.current[chave] = true;
      const ganho = Math.round((peso - rec.peso) * 10) / 10;
      if (som) setTimeout(() => { beep(784, 0.12, 0.28); setTimeout(() => beep(1175, 0.3, 0.28), 130); }, 120);
      celebrar({
        icone: "🏆",
        titulo: "Novo recorde pessoal",
        destaque: (ex ? ex.nome : "Exercício") + "\n" + peso + " kg × " + reps,
        detalhe: "Seu melhor era " + rec.peso + " kg. Você subiu " + ganho.toLocaleString("pt-BR") + " kg!",
      });
      return "Recorde pessoal! " + fmtNum(peso) + " quilos em " + (ex ? nomeFalado(ex.nome) : "exercício") +
        ". Seu melhor era " + fmtNum(rec.peso) + ". Subiu " + fmtNum(ganho) + ".";
    }
    return null;
  };
  marcarSerieRef.current = marcarSerie;

  // ---------- JARVIS DENTRO DO TREINO ----------
  // O ouvinte mora no componente raiz, mas marcar série, cronometrar o descanso
  // e trocar exercício só existe aqui. As funções são penduradas numa ref
  // durante o render — o mesmo caminho do marcarSerieRef logo acima.
  const [focoEi, setFocoEi] = useState(null);
  const [scanner, setScanner] = useState(false);   // câmera contando repetições
  const ultimoAnotado = useRef(null);

  // O "alvo" é onde a próxima frase vai cair: a primeira série não marcada.
  // É o que permite dizer só "Jarvis, 80 por 10", sem repetir o nome do exercício.
  const alvo = useMemo(() => {
    const pendente = (it) => it.series.findIndex((s) => !s.feito);
    if (focoEi !== null && sessao.itens[focoEi]) {
      const si = pendente(sessao.itens[focoEi]);
      return { ei: focoEi, si: si < 0 ? sessao.itens[focoEi].series.length : si };
    }
    for (let i = 0; i < sessao.itens.length; i++) {
      const si = pendente(sessao.itens[i]);
      if (si >= 0) return { ei: i, si: si };
    }
    if (!sessao.itens.length) return null;
    const ult = sessao.itens.length - 1;
    return { ei: ult, si: sessao.itens[ult].series.length };
  }, [sessao, focoEi]);

  const nomeDoItem = (ei) => {
    const it = sessao.itens[ei];
    const ex = it && exPorId(it.exercicioId);
    return ex ? nomeFalado(ex.nome) : "exercício";
  };
  const irPara = (ei) => {
    const it = sessao.itens[ei];
    if (!it) return;
    setFocoEi(ei);
    setTimeout(() => {
      try {
        const el = document.getElementById("item-" + it.uid);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      } catch (e) {}
    }, 60);
  };
  const descreverItem = (ei) => {
    const it = sessao.itens[ei];
    if (!it) return "";
    const falta = it.series.filter((s) => !s.feito).length;
    let txt = nomeDoItem(ei) + ". " + (falta ? falta + " " + plural(falta, "série", "séries") + " pela frente" : "todas as séries já marcadas");
    if (it.sugerido && it.sugerido.peso) txt += ". Comece com " + fmtNum(it.sugerido.peso) + " quilos";
    else if (it.sugerido && it.sugerido.segundos) txt += ". Tente " + it.sugerido.segundos + " segundos";
    else {
      const u = ultimas[it.exercicioId];
      if (u && u.length) {
        const s0 = u[0];
        txt += ". Última vez: " + (ehTempo(s0) ? segundosDe(s0) + " segundos" : fmtNum(s0.peso) + " quilos por " + repsDe(s0));
      }
    }
    return txt + ".";
  };

  // "40 de cada lado" só vira 2×40 + barra onde existe barra para somar.
  // No leg press ou na polia, a conta é só o dobro — e a resposta sempre diz a
  // soma em voz alta, para o erro aparecer na hora.
  const temBarraParaSomar = (ex) => {
    const eq = semAcento(ex && ex.equip);
    return eq.indexOf("barra") >= 0 && eq.indexOf("fixa") < 0;
  };

  const anotarPorVoz = (c) => {
    let itens = sessao.itens.slice();
    let ei = -1;
    const dito = acharExercicio(c.frase, todos, itens.map((it) => it.exercicioId));
    if (dito) {
      ei = itens.findIndex((it) => it.exercicioId === dito.id);
      if (ei < 0) {
        // Falou um exercício que não está no treino: entra agora, já com a série
        const sug = sugerirCarga(historico, dito.id, c.reps || 12);
        itens = itens.concat([{ uid: novoUid(), exercicioId: dito.id, obs: "", sugerido: sug || null, series: montarSeries(dito, 1, c.reps || 12, sug) }]);
        ei = itens.length - 1;
      }
    } else if (alvo) ei = alvo.ei;
    if (ei < 0) return { ok: false, fala: "O treino está vazio. Diga: Jarvis, adiciona supino reto." };

    const item = itens[ei];
    const ex = exPorId(item.exercicioId);
    const isometria = !!(ex && ex.tempo);
    let series = item.series.slice();
    let si = series.findIndex((s) => !s.feito);
    if (si < 0) {
      const ult = series[series.length - 1] || {};
      series = series.concat([isometria || ehTempo(ult)
        ? { segundos: ult.segundos || "", feito: false }
        : { peso: ult.peso || "", reps: ult.reps || "", feito: false }]);
      si = series.length - 1;
    }
    const base = series[si];
    const valores = {};
    let extra = "";
    if (isometria) {
      const seg = c.segundos != null ? c.segundos : (c.reps != null ? c.reps : parseInt(base.segundos) || 0);
      if (!seg) return { ok: false, fala: "Quantos segundos você segurou?" };
      valores.segundos = String(Math.round(seg));
    } else {
      let peso = c.peso;
      if (peso != null && c.porLado) {
        const barra = temBarraParaSomar(ex) ? (parseFloat(vozBarra) || 0) : 0;
        const total = peso * 2 + barra;
        extra = " " + fmtNum(peso) + " de cada lado" + (barra ? " mais a barra de " + fmtNum(barra) : "") + " dá " + fmtNum(total) + ".";
        peso = total;
      }
      const reps = c.reps != null ? c.reps : parseInt(base.reps) || 0;
      if (!reps) return { ok: false, fala: "Faltou a repetição. Diga, por exemplo: 80 por 10." };
      valores.reps = String(Math.round(reps));
      if (peso != null) valores.peso = String(Math.round(peso * 100) / 100);
    }
    if (c.aquecimento) valores.aquec = true;

    const nova = Object.assign({}, base, valores, { feito: true });
    series[si] = nova;
    itens[ei] = Object.assign({}, item, { series: series });
    setSessao(Object.assign({}, sessao, { itens: itens }));
    setFocoEi(ei);
    ultimoAnotado.current = { uid: item.uid, si: si };

    // Daqui em diante é o mesmo caminho do botão ✓: descanso e recorde.
    const seguinte = itens[ei + 1];
    const noMeioDoConjunto = !!(item.conjunto && seguinte && seguinte.conjunto === item.conjunto);
    const segDescanso = descansoDe(item);
    if (!noMeioDoConjunto) iniciarDescanso(segDescanso);
    const recorde = conferirRecorde(itens[ei], nova);

    const feito = isometria
      ? valores.segundos + " segundos"
      : (valores.peso ? fmtNum(valores.peso) + " quilos por " + valores.reps : valores.reps + " repetições");
    const restantes = series.filter((s) => !s.feito).length;
    // A confirmação diz SEMPRE o que entendeu — exercício, carga e repetições —
    // porque o reconhecimento erra e é ouvindo o número de volta que dá para pegar.
    const nomeEx = ex ? nomeFalado(ex.nome) : "exercício";
    let fala = vozAnimado
      ? animo(ANIMO_ANOTOU, "anotou") + " Anotei " + nomeEx + ", " + feito + "." + extra
      : "Anotei: " + nomeEx + ", " + feito + "." + extra;
    if (c.aquecimento) fala += " Contei como aquecimento.";
    // No modo direto a pessoa escolheu respostas enxutas: a posição da série já
    // está na tela, e ouvi-la vinte vezes por treino cansa.
    if (vozAnimado) fala += " Série " + (si + 1) + " de " + series.length + ".";
    if (noMeioDoConjunto) fala += " Emenda no próximo, sem descanso.";
    else fala += " Descanso de " + tempoFalado(segDescanso) + ".";
    if (!restantes && series.length > 1) fala += " Esse exercício terminou.";
    // O recorde vem na frente: é a notícia boa, e atrasá-la seria desperdiçá-la.
    if (recorde) fala = recorde + " " + fala;
    return { ok: true, fala: fala };
  };

  const desfazerPorVoz = () => {
    let ei = -1, si = -1;
    const marca = ultimoAnotado.current;
    if (marca) {
      const i = sessao.itens.findIndex((it) => it.uid === marca.uid);
      const s = i >= 0 && sessao.itens[i].series[marca.si];
      if (s && s.feito) { ei = i; si = marca.si; }
    }
    if (ei < 0) {
      for (let i = sessao.itens.length - 1; i >= 0 && ei < 0; i--) {
        for (let j = sessao.itens[i].series.length - 1; j >= 0; j--) {
          if (sessao.itens[i].series[j].feito) { ei = i; si = j; break; }
        }
      }
    }
    if (ei < 0) return { ok: false, fala: "Não há nenhuma série marcada para apagar." };
    upSerie(ei, si, "feito", false);
    fecharDescanso();
    ultimoAnotado.current = null;
    setFocoEi(ei);
    return { ok: true, fala: "Desmarquei a série " + (si + 1) + " de " + nomeDoItem(ei) + ". Pode ditar de novo." };
  };

  // O scanner conta; quem grava é o mesmo anotarPorVoz de sempre. A contagem
  // entra como repetições da série da vez, com o peso que estiver na barra.
  const registrarDoScanner = (repsContadas, pesoDito) => {
    const r = anotarPorVoz({
      tipo: "anotar",
      peso: pesoDito !== "" && pesoDito != null ? parseFloat(pesoDito) : null,
      reps: parseInt(repsContadas) || null,
      segundos: null, porLado: false, aquecimento: false, frase: "",
    });
    setScanner(false);
    if (r && responderVoz) responderVoz(r.fala, r.ok);
    return r;
  };

  const executarVoz = (c) => {
    const itens = sessao.itens;
    const idsNoTreino = itens.map((it) => it.exercicioId);
    switch (c.tipo) {
      case "descanso": {
        const padrao = alvo ? descansoDe(itens[alvo.ei]) : descanso;
        const seg = Math.max(5, Math.min(1800, c.segundos || padrao));
        iniciarDescanso(seg);
        return { ok: true, fala: "Descansando " + tempoFalado(seg) + ". Eu aviso na hora de voltar." };
      }
      case "pularDescanso":
        if (!fimDescanso) return { ok: false, fala: "Não tem descanso correndo agora." };
        fecharDescanso();
        return { ok: true, fala: "Descanso encerrado. Bora." };
      case "esticarDescanso": {
        const s = Math.max(5, Math.min(600, c.segundos || 15));
        esticarDescanso(s);
        return { ok: true, fala: "Mais " + tempoFalado(s) + "." };
      }
      case "anotar": return anotarPorVoz(c);
      case "desfazer": return desfazerPorVoz();
      case "maisSerie": {
        if (!itens.length) return { ok: false, fala: "O treino está vazio." };
        // "mais uma série de cadeira flexora" tem destino próprio
        const ditoS = c.frase ? acharExercicio(c.frase, todos, idsNoTreino) : null;
        let eiS = ditoS ? itens.findIndex((it) => it.exercicioId === ditoS.id) : -1;
        if (eiS < 0) eiS = alvo ? alvo.ei : itens.length - 1;
        addSerie(eiS);
        irPara(eiS);
        return { ok: true, fala: "Mais uma série em " + nomeDoItem(eiS) + "." };
      }
      case "irExercicio": {
        const destino = acharExercicio(c.frase, todos, idsNoTreino);
        if (!destino) return { ok: false, fala: "Para qual exercício? Diga o nome, por exemplo: Jarvis, vai para o leg press." };
        const jaTem = itens.findIndex((it) => it.exercicioId === destino.id);
        if (jaTem >= 0) { irPara(jaTem); return { ok: true, fala: descreverItem(jaTem) }; }
        // Pediu um exercício que não está na ficha: entra agora, no fim
        addExercicio(destino.id);
        setFocoEi(itens.length);
        return { ok: true, fala: nomeFalado(destino.nome) + " não estava no treino. Adicionei no fim e já estou nele." };
      }
      case "repetir": {
        if (!alvo) return { ok: false, fala: "O treino está vazio." };
        const itR = itens[alvo.ei];
        const ultR = itR.series.slice().reverse().find((s) => s.feito);
        if (!ultR) return { ok: false, fala: "Ainda não há série marcada aqui para repetir." };
        return anotarPorVoz({
          tipo: "anotar",
          peso: ehTempo(ultR) ? null : (ultR.peso !== "" && ultR.peso != null ? parseFloat(ultR.peso) : null),
          reps: ehTempo(ultR) ? null : (parseInt(ultR.reps) || null),
          segundos: ehTempo(ultR) ? segundosDe(ultR) : null,
          porLado: false, aquecimento: !!ultR.aquec, frase: "",
        });
      }
      case "observacao": {
        // Altura do banco, pegada, número do pino: o detalhe que se esquece entre
        // um treino e outro e que hoje só dá para escrever com o dedo.
        if (!alvo) return { ok: false, fala: "O treino está vazio." };
        const mObs = String(c.cru || "").match(/observa\S*\s*(?:que|:|,)?\s*(.+)$/i);
        const txtObs = (mObs && mObs[1] ? mObs[1] : "").trim().replace(/^[:,\s]+/, "");
        if (txtObs.length < 2) return { ok: false, fala: "O que eu anoto na observação?" };
        const atualObs = itens[alvo.ei].obs || "";
        upObs(alvo.ei, atualObs ? atualObs + " · " + txtObs : txtObs);
        irPara(alvo.ei);
        return { ok: true, fala: "Anotei em " + nomeDoItem(alvo.ei) + ": " + txtObs };
      }
      case "corrigir": {
        // Mexe na última série MARCADA, que é a que acabou de ser ditada errada.
        let eiC = -1, siC = -1;
        const marcaC = ultimoAnotado.current;
        if (marcaC) {
          const i = itens.findIndex((it) => it.uid === marcaC.uid);
          const s = i >= 0 && itens[i].series[marcaC.si];
          if (s && s.feito) { eiC = i; siC = marcaC.si; }
        }
        if (eiC < 0) {
          for (let i = itens.length - 1; i >= 0 && eiC < 0; i--) {
            for (let j = itens[i].series.length - 1; j >= 0; j--) {
              if (itens[i].series[j].feito) { eiC = i; siC = j; break; }
            }
          }
        }
        if (eiC < 0) return { ok: false, fala: "Não há série marcada para corrigir." };
        const campoC = c.campo || "peso";
        upSerie(eiC, siC, campoC, String(c.valor));
        irPara(eiC);
        const comoC = campoC === "peso" ? fmtNum(c.valor) + " quilos"
          : campoC === "reps" ? c.valor + " repetições" : c.valor + " segundos";
        return { ok: true, fala: "Corrigi para " + comoC + " na série " + (siC + 1) + " de " + nomeDoItem(eiC) + "." };
      }
      case "scanner": {
        if (!alvo) return { ok: false, fala: "O treino está vazio. Adicione um exercício primeiro." };
        irPara(alvo.ei);
        setScanner(true);
        return { ok: true, fala: "Scanner aberto. Apoie o celular de pé, com o corpo inteiro na tela." };
      }
      case "tempoDescanso": {
        if (!fimDescanso) return { ok: true, fala: "Não tem descanso correndo agora." };
        const resta = Math.max(0, Math.ceil((fimDescanso - Date.now()) / 1000));
        return { ok: true, fala: resta <= 0 ? "Acabou. Pode ir." : "Faltam " + tempoFalado(resta) + "." };
      }
      case "proximo": {
        if (!itens.length) return { ok: false, fala: "O treino está vazio." };
        const base = alvo ? alvo.ei : -1;
        const prox = Math.min(itens.length - 1, base + 1);
        if (prox === base) return { ok: false, fala: "Esse já é o último exercício do treino." };
        irPara(prox);
        return { ok: true, fala: "Agora: " + descreverItem(prox) };
      }
      case "anterior": {
        if (!itens.length) return { ok: false, fala: "O treino está vazio." };
        const base = alvo ? alvo.ei : 0;
        if (base <= 0) return { ok: false, fala: "Esse já é o primeiro exercício." };
        irPara(base - 1);
        return { ok: true, fala: "Voltando para: " + descreverItem(base - 1) };
      }
      case "adicionar": {
        const novo = acharExercicio(c.frase, todos, []);
        if (!novo) return { ok: false, fala: "Não achei esse exercício. Fale o nome como está na lista." };
        const ja = itens.findIndex((it) => it.exercicioId === novo.id);
        if (ja >= 0) { irPara(ja); return { ok: true, fala: nomeFalado(novo.nome) + " já está no treino. Pode ditar a série." }; }
        addExercicio(novo.id);
        setFocoEi(itens.length);
        const sug = sugerirCarga(historico, novo.id, 12);
        return { ok: true, fala: "Adicionei " + nomeFalado(novo.nome) + "." + (sug && sug.peso ? " Da última vez foram " + fmtNum(sug.anterior) + " quilos." : "") };
      }
      case "trocar": {
        if (!alvo) return { ok: false, fala: "Não há exercício para trocar." };
        const atual = itens[alvo.ei];
        const pedido = acharExercicio(c.frase, todos, []);
        if (pedido && pedido.id !== atual.exercicioId && !idsNoTreino.some((id) => id === pedido.id)) {
          substituirExercicio(alvo.ei, pedido.id);
          irPara(alvo.ei);
          return { ok: true, fala: "Troquei " + nomeDoItem(alvo.ei) + " por " + nomeFalado(pedido.nome) + "." };
        }
        const opcoes = alternativasPara(atual.exercicioId);
        if (!opcoes.length) return { ok: false, fala: "Não achei outro exercício desse grupo fora do treino." };
        setTrocando(alvo.ei);
        irPara(alvo.ei);
        const tres = opcoes.slice(0, 3).map((e) => nomeFalado(e.nome));
        return { ok: true, fala: "No lugar de " + nomeDoItem(alvo.ei) + ": " + tres.join(", ") + ". Diga: Jarvis, troca por " + tres[0] + "." };
      }
      case "recorde": {
        const ex = acharExercicio(c.frase, todos, idsNoTreino) || (alvo ? exPorId(itens[alvo.ei].exercicioId) : null);
        if (!ex) return { ok: false, fala: "Recorde de qual exercício?" };
        const r = recordes[ex.id];
        if (!r || (!r.peso && !r.segundos)) return { ok: true, fala: "Ainda não há recorde em " + nomeFalado(ex.nome) + ". O de hoje vai ser o primeiro." };
        if (ex.tempo || (r.tempo && !r.peso)) return { ok: true, fala: "Seu recorde em " + nomeFalado(ex.nome) + " é " + r.segundos + " segundos." };
        return { ok: true, fala: "Seu recorde em " + nomeFalado(ex.nome) + " é " + fmtNum(r.peso) + " quilos" + (r.reps ? " por " + r.reps + " repetições" : "") + "." };
      }
      case "ultimaVez": {
        const ex = acharExercicio(c.frase, todos, idsNoTreino) || (alvo ? exPorId(itens[alvo.ei].exercicioId) : null);
        if (!ex) return { ok: false, fala: "De qual exercício?" };
        const u = ultimas[ex.id];
        if (!u || !u.length) return { ok: true, fala: "Não encontrei " + nomeFalado(ex.nome) + " no seu histórico. Hoje é a estreia." };
        const txt = u.slice(0, 4).map((s) => (ehTempo(s) ? segundosDe(s) + " segundos" : fmtNum(s.peso) + " por " + repsDe(s))).join(", ");
        return { ok: true, fala: "Da última vez em " + nomeFalado(ex.nome) + ": " + txt + "." };
      }
      case "situacao": {
        const f = itens.reduce((a, it) => a + it.series.filter((s) => s.feito).length, 0);
        const t = itens.reduce((a, it) => a + it.series.length, 0);
        const exFalta = itens.filter((it) => it.series.some((s) => !s.feito)).length;
        return { ok: true, fala: f + " de " + t + " " + plural(t, "série", "séries") + " marcadas. " +
          plural(exFalta, "Falta ", "Faltam ") + exFalta + " " + plural(exFalta, "exercício", "exercícios") + "." };
      }
      case "tempo": {
        const min = Math.max(1, Math.round((Date.now() - sessao.inicio) / 60000));
        return { ok: true, fala: "Você está treinando há " + min + " " + plural(min, "minuto", "minutos") + "." };
      }
      case "finalizar": {
        // Finalizar sem nenhuma série marcada é recusado lá na frente; dizer
        // "finalizando" e abrir um aviso de erro logo depois seria mentir.
        const marcadas = itens.reduce((a, it) => a + it.series.filter((s) => s.feito).length, 0);
        if (!marcadas) return { ok: false, fala: "Nenhuma série marcada ainda. Dite uma série antes de encerrar." };
        onFinalizar();
        return { ok: true, fala: "Treino encerrado e salvo. Descanso merecido." };
      }
      default:
        return null;
    }
  };

  // Penduradas na ref a cada render, para o raiz sempre chamar a versão atual
  if (acoesVoz) {
    acoesVoz.current = {
      vivo: true,
      executar: executarVoz,
      descansando: !!fimDescanso,
      alvo: alvo ? nomeDoItem(alvo.ei) : null,
    };
  }
  useEffect(() => () => { if (acoesVoz) acoesVoz.current = {}; }, [acoesVoz]);


  const feitas = sessao.itens.reduce((a, it) => a + it.series.filter((s) => s.feito).length, 0);
  const total = sessao.itens.reduce((a, it) => a + it.series.length, 0);

  const fmt = (seg) => {
    const m = Math.floor(seg / 60);
    const ss = seg % 60;
    return m + ":" + (ss < 10 ? "0" : "") + ss;
  };

  const pct = fimDescanso && totalDescanso > 0 ? Math.max(0, Math.min(100, (restante / totalDescanso) * 100)) : 0;

  const btnSom = (
    <button onClick={() => { setSom(!som); if (!som) beep(700, 0.1, 0.2); }}
      title={som ? "Desligar som" : "Ligar som"}
      aria-label={som ? "Desligar o som do cronômetro" : "Ligar o som do cronômetro"} aria-pressed={som}
      style={{ width: 42, height: 42, borderRadius: 10, border: "1px solid " + (som ? "#E1306C66" : "var(--borda2)"), background: som ? "#E1306C22" : "transparent", color: "var(--texto)", fontSize: 18, cursor: "pointer" }}>
      {som ? "🔊" : "🔇"}
    </button>
  );

  return (
    <div style={{ padding: "0 18px", paddingBottom: (fimDescanso ? 210 : 20) + (vozAtiva ? 60 : 0) }}>
      <button style={S.voltar} onClick={onVoltar}>← Voltar (o treino continua salvo)</button>
      <div style={{ ...S.card, borderColor: "#E1306C44" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <div style={{ minWidth: 0 }}>
            <div style={S.label}>Treinando agora</div>
            <div style={{ fontWeight: 900, fontSize: 18 }}>{sessao.nome}</div>
          </div>
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            <div style={{ fontSize: 22, fontWeight: 900, color: "#E1306C" }}>{feitas}/{total}</div>
            <div style={{ fontSize: 12, color: "var(--cinza)" }}>
              ⏱ <CronometroSessao inicio={sessao.inicio} />
            </div>
          </div>
        </div>
        {/* barra de avanço do treino: dá a sensação de estar chegando ao fim */}
        <div style={{ height: 6, background: "var(--borda)", borderRadius: 3, marginTop: 12, overflow: "hidden" }}
          role="progressbar" aria-valuenow={total ? Math.round((feitas / total) * 100) : 0} aria-valuemin={0} aria-valuemax={100}
          aria-label="Progresso do treino">
          <div style={{ height: "100%", width: (total ? (feitas / total) * 100 : 0) + "%", background: GRAD_LINHA, borderRadius: 3, transition: "width .35s ease" }} />
        </div>
      </div>

      {/* Monitor cardíaco: aparece ligado quando há batimento, e some do caminho
          quando o navegador não fala Bluetooth — oferecer o que não existe cansa. */}
      {CARDIO_DISPONIVEL && (
        <div style={{ ...S.card, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
          borderColor: bpm ? "#ED495666" : "var(--borda)" }}>
          <div style={{ minWidth: 0 }}>
            <div style={S.label}>Frequência cardíaca</div>
            {bpm ? (
              <div style={{ fontSize: 26, fontWeight: 900, color: "#ED4956", lineHeight: 1.1, marginTop: 2 }}>
                {bpm} <span style={{ fontSize: 12, color: "var(--cinza)", fontWeight: 700 }}>bpm</span>
              </div>
            ) : (
              <div style={{ fontSize: 12, color: "var(--cinza)", marginTop: 3, lineHeight: 1.5 }}>
                {cardioEstado === "procurando" ? "Procurando o monitor..."
                  : cardioEstado === "caiu" ? "O monitor desconectou."
                  : "Cinta peitoral ou sensor com Bluetooth padrão."}
              </div>
            )}
          </div>
          <button onClick={bpm ? onDesconectarCardio : onConectarCardio}
            style={{ ...S.btnGhost, width: "auto", padding: "10px 14px", flexShrink: 0,
              color: bpm ? "var(--cinza)" : "#ED4956", borderColor: bpm ? "var(--borda2)" : "#ED495666" }}>
            {bpm ? "Desconectar" : "❤ Conectar"}
          </button>
        </div>
      )}

      {/* Configuração do descanso */}
      <div style={{ ...S.card, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <div style={{ flex: 1 }}>
          <div style={S.label}>Descanso entre séries</div>
          <div style={{ fontSize: 12, color: "var(--cinza)", marginTop: 2 }}>
            Inicia ao marcar uma série ✓ · a tela fica acesa até acabar
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={() => setDescanso(Math.max(15, descanso - 15))} aria-label="Diminuir 15 segundos de descanso"
            style={{ width: 36, height: 36, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 18, cursor: "pointer" }}>−</button>
          <div aria-live="polite" aria-label={"Descanso de " + fmt(descanso)}
            style={{ fontWeight: 900, fontSize: 17, color: "#E1306C", minWidth: 48, textAlign: "center" }}>{fmt(descanso)}</div>
          <button onClick={() => setDescanso(Math.min(600, descanso + 15))} aria-label="Aumentar 15 segundos de descanso"
            style={{ width: 36, height: 36, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 18, cursor: "pointer" }}>+</button>
          {btnSom}
        </div>
      </div>

      {sessao.itens.length === 0 && (
        <div style={{ ...S.card, textAlign: "center" }}>
          <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6 }}>Treino livre 🏋️</div>
          <div style={{ color: "var(--cinza)", fontSize: 14, lineHeight: 1.6 }}>
            Vá adicionando os exercícios conforme os aparelhos ficarem livres.
            Toque em <b>+ Adicionar exercício</b> abaixo para começar.
          </div>
        </div>
      )}

      {sessao.itens.map((it, ei) => {
        const ex = exPorId(it.exercicioId);
        const rec = recordes[it.exercicioId];
        const ult = ultimas[it.exercicioId];
        // Bi-set / tri-set: itens vizinhos com o mesmo "conjunto" sao feitos juntos
        const anterior = sessao.itens[ei - 1];
        const proximo = sessao.itens[ei + 1];
        const noConjunto = !!it.conjunto;
        const abreConjunto = noConjunto && (!anterior || anterior.conjunto !== it.conjunto);
        const fechaConjunto = noConjunto && (!proximo || proximo.conjunto !== it.conjunto);
        const tamConjunto = noConjunto ? sessao.itens.filter((x) => x.conjunto === it.conjunto).length : 0;
        const ehIsometria = !!(ex && ex.tempo);
        // Com o Jarvis ligado, este é o cartão que vai receber a próxima frase.
        // Sem essa marca, ditar "80 por 10" é torcer para cair no lugar certo.
        const ehAlvo = vozAtiva && alvo && alvo.ei === ei;
        return (
          <div key={it.uid || ei} id={"item-" + (it.uid || ei)}
            style={{
              ...S.card,
              ...(ehAlvo ? { borderColor: "#E1306C", boxShadow: "0 0 0 2px #E1306C33" } : {}),
              ...(noConjunto ? {
                borderLeft: "3px solid #E1306C",
                borderTopLeftRadius: abreConjunto ? 18 : 4,
                borderBottomLeftRadius: fechaConjunto ? 18 : 4,
                marginBottom: fechaConjunto ? 12 : 4,
              } : {}),
            }}>
            {abreConjunto && (
              <div style={{ ...S.label, color: "#E1306C", marginBottom: 10 }}>
                ⛓ {tamConjunto >= 3 ? "Tri-set" : "Bi-set"} — sem descanso entre eles
              </div>
            )}
            {ehAlvo && (
              <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 10, padding: "7px 10px",
                background: "#E1306C15", border: "1px solid #E1306C44", borderRadius: 10 }}>
                <span aria-hidden="true" style={{ fontSize: 13 }}>🎤</span>
                <span style={{ fontSize: 11.5, color: "#E1306C", fontWeight: 800, lineHeight: 1.4 }}>
                  O Jarvis anota aqui — diga “Jarvis, {ehIsometria ? "45 segundos" : "80 por 10"}”
                </span>
              </div>
            )}
            {ehAlvo && !ehIsometria && (
              <button onClick={() => setScanner(true)}
                aria-label={"Contar as repetições de " + (ex ? ex.nome : "este exercício") + " pela câmera"}
                style={{ width: "100%", marginBottom: 10, padding: "11px 12px", borderRadius: 12,
                  border: "1px solid #7CFF3C66", background: "#7CFF3C14", color: "#5FBF28",
                  fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
                👁 Contar pela câmera (Eyes Scan)
              </button>
            )}
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
              <MiniaturaExercicio ex={ex} onAbrir={() => setDemo(ex)} />
              <button type="button" onClick={() => setDemo(ex)}
                aria-label={"Ver como executar " + (ex ? ex.nome : "o exercício")}
                style={{ flex: 1, minWidth: 0, textAlign: "left", background: "none", border: "none", padding: 0, font: "inherit", color: "var(--texto)", cursor: "pointer" }}>
                <span style={{ display: "block", fontWeight: 800, fontSize: 16, lineHeight: 1.25 }}>{ex ? ex.nome : "Exercício"}</span>
                <span style={{ display: "block", fontSize: 11, color: "var(--cinza)", marginTop: 3 }}>
                  {(ex && ex.equip ? ex.equip + " · " : "")}<span style={{ color: "#E1306C", fontWeight: 700 }}>ver execução ›</span>
                </span>
              </button>
              <button onClick={() => setTrocando(trocando === ei ? null : ei)}
                title="Trocar por outro exercício" aria-expanded={trocando === ei}
                aria-label={"Trocar " + (ex ? ex.nome : "este exercício") + " por outro"}
                style={{ border: "1px solid var(--borda2)", background: trocando === ei ? "#E1306C22" : "transparent", color: trocando === ei ? "#E1306C" : "var(--texto)", borderRadius: 8, padding: "7px 9px", fontWeight: 800, fontSize: 14, cursor: "pointer" }}>
                ⇄
              </button>
              <button onClick={() => rmExercicio(ei)} title="Remover este exercício do treino"
                aria-label={"Remover " + (ex ? ex.nome : "este exercício") + " do treino"}
                style={{ border: "1px solid var(--perigo-borda)", background: "transparent", color: "var(--perigo)", borderRadius: 8, padding: "7px 9px", fontWeight: 900, fontSize: 13, cursor: "pointer" }}>
                ✕
              </button>
            </div>

            {/* Painel de substituicao: alternativas do mesmo grupo muscular */}
            {trocando === ei && (
              <div style={{ border: "1px solid #E1306C66", borderRadius: 12, padding: 12, marginBottom: 12 }}>
                <div style={{ ...S.label, marginBottom: 4 }}>Trocar por outro do mesmo grupo</div>
                <div style={{ fontSize: 12, color: "var(--cinza)", marginBottom: 10, lineHeight: 1.5 }}>
                  Os do mesmo equipamento aparecem primeiro. As séries continuam; só a carga volta a ser sugerida.
                </div>
                <div style={{ maxHeight: 260, overflowY: "auto" }}>
                  {alternativasPara(it.exercicioId).slice(0, 24).map((alt) => (
                    <button key={alt.id} type="button" onClick={() => substituirExercicio(ei, alt.id)}
                      aria-label={"Substituir por " + alt.nome}
                      style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, textAlign: "left", font: "inherit", color: "var(--texto)", background: "none", border: "none", borderBottom: "1px solid var(--borda)", padding: "8px 2px", cursor: "pointer" }}>
                      <MiniaturaExercicio ex={alt} tamanho={38} />
                      <span style={{ flex: 1, minWidth: 0 }}>
                        <span style={{ display: "block", fontSize: 14, fontWeight: 700 }}>{alt.nome}</span>
                        <span style={{ display: "block", fontSize: 11, color: "var(--cinza)" }}>{alt.equip || "Equipamento livre"}</span>
                      </span>
                      <span aria-hidden="true" style={{ color: "#E1306C", fontWeight: 900 }}>⇄</span>
                    </button>
                  ))}
                  {alternativasPara(it.exercicioId).length === 0 && (
                    <div style={{ fontSize: 13, color: "var(--cinza)" }}>Não há outro exercício deste grupo fora do treino.</div>
                  )}
                </div>
                <button style={{ ...S.btnGhost, marginTop: 10 }} onClick={() => setTrocando(null)}>Cancelar</button>
              </div>
            )}

            {/* Referência do exercício: recorde, como foi da última vez e a carga sugerida */}
            {(rec || ult || it.sugerido) && (
              <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8, marginBottom: 12, fontSize: 11, lineHeight: 1.5 }}>
                {rec && (ehIsometria ? rec.segundos > 0 : rec.peso > 0) && (
                  <span style={{ background: "#E1306C18", color: "#E1306C", border: "1px solid #E1306C44", borderRadius: 8, padding: "3px 8px", fontWeight: 800, whiteSpace: "nowrap" }}>
                    🏆 recorde {ehIsometria ? rec.segundos + "s" : fmtNum(rec.peso) + " kg"}
                  </span>
                )}
                {it.sugerido && it.sugerido.subiu && (
                  <span style={{ background: "var(--ok-bg)", color: "var(--ok)", border: "1px solid var(--ok)", borderRadius: 8, padding: "3px 8px", fontWeight: 800, whiteSpace: "nowrap" }}>
                    ↑ hora de subir para {it.sugerido.tempo ? it.sugerido.segundos + "s" : fmtNum(it.sugerido.peso) + " kg"}
                  </span>
                )}
                {ult && (
                  <span style={{ color: "var(--cinza)" }}>
                    última vez: {ult.slice(0, 5).map((s) => (ehTempo(s) ? segundosDe(s) + "s" : fmtNum(s.peso) + "×" + repsDe(s)) + (ehAquecimento(s) ? " (aq.)" : "")).join(" · ")}
                  </span>
                )}
              </div>
            )}

            {/* Descanso deste exercicio, independente do geral */}
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12 }}>
              <span style={{ fontSize: 11, color: "var(--cinza)" }}>⏱ descanso</span>
              <button onClick={() => mudarDescansoDe(ei, -15)} aria-label={"Diminuir o descanso de " + (ex ? ex.nome : "este exercício")}
                style={{ width: 26, height: 26, borderRadius: 7, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 14, cursor: "pointer", lineHeight: 1 }}>−</button>
              <span style={{ fontSize: 12, fontWeight: 900, color: it.descanso ? "#E1306C" : "var(--cinza)", minWidth: 40, textAlign: "center", fontVariantNumeric: "tabular-nums" }}>
                {fmt(descansoDe(it))}
              </span>
              <button onClick={() => mudarDescansoDe(ei, 15)} aria-label={"Aumentar o descanso de " + (ex ? ex.nome : "este exercício")}
                style={{ width: 26, height: 26, borderRadius: 7, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 14, cursor: "pointer", lineHeight: 1 }}>+</button>
              {!it.descanso && <span style={{ fontSize: 10, color: "var(--cinza2)" }}>(geral)</span>}
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
              <div style={{ width: 30 }} />
              {ehIsometria ? (
                <React.Fragment>
                  <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Segundos</div>
                  <div style={{ width: 44 }} />
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Peso (kg)</div>
                  <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Reps</div>
                </React.Fragment>
              )}
              <div style={{ width: 44 }} />
            </div>
            {it.series.map((s, si) => {
              const nomeEx = ex ? ex.nome : "exercício";
              const aquec = ehAquecimento(s);
              const contando = crono && crono.ei === ei && crono.si === si;
              return (
                <div key={si} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, opacity: s.feito ? 0.55 : 1 }}>
                  {/* O número da série também liga/desliga o aquecimento */}
                  <button onClick={() => alternarAquecimento(ei, si)} aria-pressed={aquec}
                    title={aquec ? "Série de aquecimento (fora do volume)" : "Marcar como aquecimento"}
                    aria-label={(aquec ? "Tirar" : "Marcar") + " a série " + (si + 1) + " de " + nomeEx + " como aquecimento"}
                    style={{ width: 30, height: 30, borderRadius: 8, flexShrink: 0, cursor: "pointer",
                      border: aquec ? "1px solid var(--obs)" : "1px solid transparent",
                      background: aquec ? "#C7A94B22" : "transparent",
                      color: aquec ? "var(--obs)" : "var(--cinza)", fontWeight: 900, fontSize: 13 }}>
                    {aquec ? "A" : si + 1}
                  </button>

                  {ehIsometria ? (
                    <React.Fragment>
                      {contando ? (
                        <div style={{ ...S.inputMini, flex: 1, background: "var(--ok-bg)", borderColor: "var(--ok)", color: "var(--ok)", fontWeight: 900, fontVariantNumeric: "tabular-nums", lineHeight: "20px" }}
                          role="timer" aria-live="off" aria-label={"Faltam " + restaCrono + " segundos"}>
                          {restaCrono}s
                        </div>
                      ) : (
                        <input type="number" inputMode="numeric" placeholder="30" style={{ ...S.inputMini, flex: 1 }} value={s.segundos || ""}
                          aria-label={"Segundos da série " + (si + 1) + " de " + nomeEx}
                          onChange={(e) => upSerie(ei, si, "segundos", e.target.value)} />
                      )}
                      <button onClick={() => (contando ? setCrono(null) : iniciarIsometria(ei, si))}
                        aria-label={(contando ? "Parar" : "Iniciar") + " a contagem da série " + (si + 1) + " de " + nomeEx}
                        style={{ width: 44, height: 42, borderRadius: 8, cursor: "pointer", fontWeight: 900, fontSize: 15,
                          border: "1px solid " + (contando ? "var(--perigo-borda)" : "#E1306C66"),
                          background: contando ? "transparent" : "#E1306C15",
                          color: contando ? "var(--perigo)" : "#E1306C" }}>
                        {contando ? "■" : "▶"}
                      </button>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <input type="number" inputMode="decimal" placeholder="0" style={{ ...S.inputMini, flex: 1 }} value={s.peso || ""}
                        aria-label={"Peso em quilos da série " + (si + 1) + " de " + nomeEx}
                        onChange={(e) => upSerie(ei, si, "peso", e.target.value)} />
                      <input type="number" inputMode="numeric" style={{ ...S.inputMini, flex: 1 }} value={s.reps || ""}
                        aria-label={"Repetições da série " + (si + 1) + " de " + nomeEx}
                        onChange={(e) => upSerie(ei, si, "reps", e.target.value)} />
                    </React.Fragment>
                  )}

                  <button onClick={() => marcarSerie(ei, si)} aria-pressed={!!s.feito}
                    aria-label={(s.feito ? "Desmarcar" : "Concluir") + " a série " + (si + 1) + " de " + nomeEx}
                    style={{ width: 44, height: 42, borderRadius: 8, border: "none", fontWeight: 900, fontSize: 18, cursor: "pointer",
                      background: s.feito ? GRAD : "var(--borda)", color: s.feito ? "#FFFFFF" : "var(--cinza)" }}>✓</button>
                </div>
              );
            })}
            {it.series.some(ehAquecimento) && (
              <div style={{ fontSize: 10, color: "var(--obs)", marginBottom: 6 }}>
                A = aquecimento: fica registrado, mas fora do volume e dos recordes.
              </div>
            )}

            <div style={{ display: "flex", gap: 8, marginTop: 4, marginBottom: 4 }}>
              <button onClick={() => addSerie(ei)}
                aria-label={"Adicionar uma série em " + (ex ? ex.nome : "este exercício")}
                style={{ ...S.btnGhost, flex: 3, padding: "11px 12px", color: "#E1306C", borderColor: "#E1306C66", fontWeight: 800 }}>
                + Adicionar série
              </button>
              {it.series.length > 1 && (
                <button onClick={() => rmSerie(ei)} title="Remover a última série"
                  aria-label={"Remover a última série de " + (ex ? ex.nome : "este exercício")}
                  style={{ ...S.btnGhost, flex: 1, padding: "11px 8px", fontSize: 18, fontWeight: 900 }}>
                  −
                </button>
              )}
            </div>

            <input style={{ ...S.input, marginTop: 4, fontSize: 14 }}
              placeholder="📝 Obs.: altura do banco, altura da polia, pegada..."
              aria-label={"Observação sobre " + (ex ? ex.nome : "este exercício") + ": altura do banco, pegada, etc."}
              value={it.obs || ""}
              onChange={(e) => upObs(ei, e.target.value)} />
          </div>
        );
      })}

      {mostrarAdd ? (
        <div style={{ ...S.card, borderColor: "#E1306C66" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={S.label}>Adicionar exercício ao treino</div>
            <button onClick={() => { setMostrarAdd(false); setBuscaEx(""); }} aria-label="Fechar a busca de exercícios"
              style={{ background: "none", border: "none", color: "var(--cinza)", fontSize: 20, fontWeight: 900, cursor: "pointer" }}>✕</button>
          </div>
          <input autoFocus style={{ ...S.input, marginBottom: 10 }} placeholder="Buscar exercício (ex.: leg press)..."
            aria-label="Buscar exercício para adicionar ao treino"
            value={buscaEx} onChange={(e) => setBuscaEx(e.target.value)} />
          <div style={{ maxHeight: 320, overflowY: "auto" }}>
            {(buscaEx.trim()
              ? todos.filter((e) => e.nome.toLowerCase().includes(buscaEx.trim().toLowerCase()))
              : todos
            ).slice(0, 40).map((e) => (
              <button key={e.id} type="button" onClick={() => addExercicio(e.id)}
                aria-label={"Adicionar " + e.nome + " ao treino"}
                style={{ width: "100%", textAlign: "left", font: "inherit", color: "var(--texto)", background: "none",
                  border: "none", borderBottom: "1px solid var(--borda)", display: "flex", justifyContent: "space-between",
                  alignItems: "center", padding: "10px 4px", cursor: "pointer" }}>
                <span>
                  <span style={{ display: "block", fontWeight: 700, fontSize: 14 }}>{e.nome}</span>
                  <span style={{ display: "block", fontSize: 12, color: corGrupo(grupoPorId(e.grupo)) }}>{grupoPorId(e.grupo).nome}</span>
                </span>
                <span aria-hidden="true" style={{ background: GRAD, color: "#FFFFFF", borderRadius: 10, width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 18, flexShrink: 0 }}>+</span>
              </button>
            ))}
          </div>
        </div>
      ) : (
        <button style={{ ...S.btnGhost, marginBottom: 12, color: "#E1306C", borderColor: "#E1306C66", fontWeight: 800 }}
          onClick={() => setMostrarAdd(true)}>
          + Adicionar exercício ao treino
        </button>
      )}

      <button style={{ ...S.btn, marginTop: 4 }} onClick={onFinalizar}>Finalizar treino</button>
      <button style={{ ...S.btnGhost, marginTop: 10, color: "var(--perigo)", borderColor: "var(--perigo-borda)" }}
        onClick={() => pedirConfirmacao("Descartar este treino sem salvar?", onDescartar)}>
        Descartar
      </button>

      {/* Barra do cronômetro de descanso */}
      {fimDescanso && (
        <div style={{ position: "fixed", bottom: "calc(64px + env(safe-area-inset-bottom))", left: 0, right: 0, background: acabou ? "var(--ok-bg)" : "var(--bg2)", borderTop: "2px solid " + (acabou ? "var(--ok)" : "#E1306C"), borderBottom: "1px solid var(--borda)", padding: "12px 18px 14px", zIndex: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ ...S.label, color: acabou ? "var(--ok)" : "var(--cinza)" }}>
                {acabou ? "Descanso concluído!" : "Descansando"}
              </div>
              <div role="timer" aria-live={acabou ? "assertive" : "off"}
                aria-label={acabou ? "Descanso concluído, bora treinar" : "Faltam " + fmt(restante)}
                style={{ fontSize: 30, fontWeight: 900, color: acabou ? "var(--ok)" : "#E1306C", fontVariantNumeric: "tabular-nums" }}>
                {acabou ? "Bora! 💪" : fmt(restante)}
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <button onClick={() => { setSom(!som); if (!som) beep(700, 0.1, 0.2); }}
                aria-label={som ? "Desligar o som do cronômetro" : "Ligar o som do cronômetro"} aria-pressed={som}
                style={{ width: 40, height: 40, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontSize: 16, cursor: "pointer" }}>
                {som ? "🔊" : "🔇"}
              </button>
              {!acabou && (
                <button onClick={mais15} aria-label="Adicionar 15 segundos ao descanso"
                  style={{ border: "1px solid #E1306C66", background: "transparent", color: "#E1306C", borderRadius: 8, padding: "10px 12px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
                  +15s
                </button>
              )}
              <button onClick={fecharDescanso} aria-label={acabou ? "Fechar o aviso de descanso" : "Pular o descanso"}
                style={{ border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", borderRadius: 8, padding: "10px 14px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
                {acabou ? "OK" : "Pular"}
              </button>
            </div>
          </div>
          {!acabou && (
            <div style={{ height: 5, background: "var(--borda)", borderRadius: 3, marginTop: 10, overflow: "hidden" }}>
              <div style={{ height: "100%", width: pct + "%", background: restante <= 3 ? "#ED4956" : "#E1306C", borderRadius: 3, transition: "width 0.25s linear" }} />
            </div>
          )}
        </div>
      )}

      <ModalDemonstracao ex={demo} onFechar={() => setDemo(null)} />

      <ScannerEyes
        aberto={scanner}
        ex={alvo ? exPorId(sessao.itens[alvo.ei].exercicioId) : null}
        repsAlvo={alvo && sessao.itens[alvo.ei].series[alvo.si] ? sessao.itens[alvo.ei].series[alvo.si].reps : ""}
        pesoAtual={alvo && sessao.itens[alvo.ei].series[alvo.si] ? sessao.itens[alvo.ei].series[alvo.si].peso : ""}
        pesoCorporal={pesoCorporal}
        bpm={bpm}
        vozCfg={vozCfg} contarAlto={contarAlto} onAlternarContagem={onAlternarContagem}
        serieNum={alvo ? alvo.si + 1 : 1}
        serieTotal={alvo ? sessao.itens[alvo.ei].series.length : 1}
        som={som}
        onRegistrar={registrarDoScanner}
        onFechar={() => setScanner(false)} />
    </div>
  );
}

function MiniStat({ valor, nome, cor }) {
  return (
    <div style={{ flex: "1 1 60px", minWidth: 60 }}>
      <div style={{ fontSize: 15, fontWeight: 900, color: cor || "var(--texto)" }}>{valor}</div>
      <div style={{ fontSize: 9, color: "var(--cinza)", textTransform: "uppercase", letterSpacing: 0.5 }}>{nome}</div>
    </div>
  );
}

function CardTreino({ h, exPorId, recordes, comparacao, onExcluir, onStory, onEditar, pedirConfirmacao }) {
  const [aberto, setAberto] = useState(false);
  const st = statsTreino(h);
  const pr = recordes[h.id] || {};
  const nPR = Object.keys(pr).filter((k) => pr[k].peso || pr[k].volume).length;
  const grupos = {};
  h.itens.forEach((it) => {
    const e = exPorId(it.exercicioId);
    const g = e ? e.grupo : null;
    if (g) grupos[g] = (grupos[g] || 0) + volumeItem(it);
  });
  const listaGrupos = Object.keys(grupos).filter((g) => grupos[g] > 0).sort((a, b) => grupos[b] - grupos[a]);
  const totalG = listaGrupos.reduce((a, g) => a + grupos[g], 0) || 1;

  return (
    <div style={S.card}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ fontWeight: 900, fontSize: 16, flex: 1 }}>{h.nome}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ color: "#E1306C", fontWeight: 800, fontSize: 13 }}>{h.duracaoMin} min</div>
          <button title="Excluir este treino do histórico" aria-label={"Excluir do histórico o treino " + h.nome}
            onClick={() => pedirConfirmacao("Excluir este treino do histórico?\n\nVocê terá alguns segundos para desfazer.", () => onExcluir(h.id))}
            style={{ background: "none", border: "1px solid var(--perigo-borda)", color: "var(--perigo)", borderRadius: 8, width: 30, height: 30, fontSize: 14, fontWeight: 900, cursor: "pointer" }}>
            🗑
          </button>
        </div>
      </div>
      <div style={{ color: "var(--cinza)", fontSize: 12, margin: "2px 0 12px" }}>
        {new Date(h.data).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" })}
      </div>

      {/* Números do treino */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, background: "var(--input)", border: "1px solid var(--borda)", borderRadius: 12, padding: "12px 14px" }}>
        {st.volume > 0 && <MiniStat valor={fmtKg(st.volume)} nome="volume" cor="#E1306C" />}
        <MiniStat valor={st.series} nome="séries" />
        <MiniStat valor={st.reps} nome="reps" />
        <MiniStat valor={st.exercicios} nome="exercícios" />
        {st.cargaMax > 0 && <MiniStat valor={st.cargaMax + "kg"} nome="carga máx." />}
        {st.densidade > 0 && <MiniStat valor={st.densidade + " kg/min"} nome="densidade" />}
      </div>

      {/* Comparação e recordes */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
        {comparacao && (
          <span style={{
            fontSize: 11, fontWeight: 800, borderRadius: 8, padding: "4px 8px",
            background: comparacao.pct >= 0 ? "var(--ok-bg)" : "var(--aviso-bg)",
            color: comparacao.pct >= 0 ? "var(--ok)" : "var(--perigo)",
          }}>
            {(comparacao.pct >= 0 ? "▲ +" : "▼ ") + comparacao.pct + "% de volume vs. treino anterior"}
          </span>
        )}
        {nPR > 0 && (
          <span style={{ fontSize: 11, fontWeight: 800, borderRadius: 8, padding: "4px 8px", background: "#E1306C22", color: "#E1306C" }}>
            🏆 {nPR} {plural(nPR, "recorde pessoal", "recordes pessoais")}
          </span>
        )}
      </div>

      {/* Divisão por músculo */}
      {listaGrupos.length > 0 && (
        <div style={{ marginTop: 12 }}>
          <div style={{ display: "flex", height: 8, borderRadius: 4, overflow: "hidden", background: "var(--borda)" }}>
            {listaGrupos.map((g) => (
              <div key={g} style={{ width: (grupos[g] / totalG) * 100 + "%", background: corGrupo(GRUPOS.find((x) => x.id === g)) }} />
            ))}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 6 }}>
            {listaGrupos.map((g) => {
              const info = GRUPOS.find((x) => x.id === g);
              return (
                <span key={g} style={{ fontSize: 10, color: "var(--cinza)" }}>
                  <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 2, background: corGrupo(info), marginRight: 4 }} />
                  {(info ? info.nome : g) + " " + Math.round((grupos[g] / totalG) * 100) + "%"}
                </span>
              );
            })}
          </div>
        </div>
      )}

      {/* Séries */}
      <button onClick={() => setAberto(!aberto)}
        style={{ background: "none", border: "none", color: "#E1306C", fontWeight: 800, fontSize: 12, padding: "12px 0 4px", cursor: "pointer" }}>
        {aberto ? "▲ Ocultar séries" : "▼ Ver séries de cada exercício"}
      </button>

      {aberto && h.itens.map((it, i) => {
        const e = exPorId(it.exercicioId);
        const p = pr[it.exercicioId] || {};
        const rm = melhor1RM(it);
        return (
          <div key={i} style={{ fontSize: 13, marginBottom: 8, lineHeight: 1.5 }}>
            <span style={{ fontWeight: 700 }}>{(e ? e.nome : "Exercício")}: </span>
            <span style={{ color: "var(--cinza)" }}>
              {it.series.map((s) =>
                (ehTempo(s) ? segundosDe(s) + "s" : fmtNum(s.peso) + "kg×" + repsDe(s)) + (ehAquecimento(s) ? " (aq.)" : "")
              ).join("  ·  ")}
            </span>
            {(p.peso || p.volume) && <span style={{ marginLeft: 4 }} title="Recorde pessoal">🏆</span>}
            {itemDeTempo(it) ? (
              tempoItem(it) > 0 && (
                <div style={{ color: "var(--cinza2)", fontSize: 11 }}>{tempoItem(it)}s no total</div>
              )
            ) : (
              volumeItem(it) > 0 && (
                <div style={{ color: "var(--cinza2)", fontSize: 11 }}>
                  {fmtKg(volumeItem(it))} de volume{rm ? " · 1RM estim. " + rm + "kg" : ""}
                </div>
              )
            )}
            {it.obs && <div style={{ color: "var(--obs)", fontSize: 12, fontStyle: "italic", marginTop: 2 }}>📝 {it.obs}</div>}
          </div>
        );
      })}

      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <button onClick={() => onStory(h)} style={{ ...S.btnGhost, flex: 2, color: "#E1306C", borderColor: "#E1306C66", fontSize: 13, padding: "10px 12px" }}>
          📸 Story
        </button>
        <button onClick={() => onEditar(h)} aria-label={"Corrigir o treino " + h.nome}
          style={{ ...S.btnGhost, flex: 1, fontSize: 13, padding: "10px 12px" }}>
          ✎ Corrigir
        </button>
      </div>
    </div>
  );
}

// ---------------- CORRIGIR UM TREINO DO HISTÓRICO ----------------
// Antes, um peso digitado errado só tinha uma saída: apagar o treino inteiro.
function TelaEditarHistorico({ registro, exPorId, onSalvar, onCancelar, avisar }) {
  const [r, setR] = useState(() => JSON.parse(JSON.stringify(registro)));

  const upSerie = (ei, si, campo, val) => setR({
    ...r,
    itens: r.itens.map((it, i) => (i !== ei ? it : {
      ...it, series: it.series.map((s, j) => (j !== si ? s : { ...s, [campo]: val })),
    })),
  });
  const rmSerie = (ei, si) => setR({
    ...r,
    itens: r.itens.map((it, i) => (i !== ei ? it : { ...it, series: it.series.filter((unused, j) => j !== si) })),
  });
  const addSerie = (ei) => setR({
    ...r,
    itens: r.itens.map((it, i) => {
      if (i !== ei) return it;
      const ult = it.series[it.series.length - 1];
      if (ult && ehTempo(ult)) return { ...it, series: [...it.series, { segundos: ult.segundos }] };
      const base = ult || { peso: "", reps: "12" };
      return { ...it, series: [...it.series, { peso: base.peso, reps: base.reps }] };
    }),
  });
  const rmItem = (ei) => setR({ ...r, itens: r.itens.filter((unused, i) => i !== ei) });
  const upObs = (ei, val) => setR({ ...r, itens: r.itens.map((it, i) => (i === ei ? { ...it, obs: val } : it)) });

  const salvar = () => {

    if (!limpo.itens.length) { avisar("Um treino precisa de pelo menos um exercício com uma série. Para remover tudo, apague o treino no histórico."); return; }
    onSalvar(limpo);

  const st = statsTreino(r);

          <div style={{ flex: 1 }}>
            <div style={{ ...S.label, fontSize: 10, marginBottom: 6 }}>Duração (min)</div>
            <input type="number" min={1} style={S.inputMini} value={r.duracaoMin} aria-label="Duração em minutos"

          <div style={{ flex: 2 }}>
            <div style={{ ...S.label, fontSize: 10, marginBottom: 6 }}>Volume recalculado</div>
            <div style={{ fontWeight: 900, fontSize: 17, color: "#E1306C", padding: "10px 0" }}>{fmtKg(st.volume)}</div>
          </div>
        </div>
      </div>

      {r.itens.map((it, ei) => {
        const ex = exPorId(it.exercicioId);
        const nomeEx = ex ? ex.nome : "Exercício";
        return (
          <div key={ei} style={S.card}>

              <button onClick={() => rmItem(ei)} aria-label={"Remover " + nomeEx + " deste treino"}

            </div>
            <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
              <div style={{ width: 26 }} />

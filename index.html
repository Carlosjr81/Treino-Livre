function TelaEditarTreino({ treinoInicial, todos, onSalvar, onCancelar, avisar }) {
  const [t, setT] = useState(treinoInicial);
  const [busca, setBusca] = useState("");

  const salvar = () => {
    if (!t.nome.trim()) { avisar("Dê um nome para a ficha (ex.: Treino A - Peito e Tríceps)"); return; }
    onSalvar(t);
  };
  const addEx = (id) => setT({ ...t, itens: [...t.itens, { exercicioId: id, series: 3, reps: 12, obs: "" }] });
  const rmEx = (i) => setT({ ...t, itens: t.itens.filter((_, idx) => idx !== i) });
  const upItem = (i, campo, val) => setT({ ...t, itens: t.itens.map((it, idx) => (idx === i ? { ...it, [campo]: val } : it)) });

  const filtrados = todos.filter((e) => e.nome.toLowerCase().includes(busca.toLowerCase()));
  const exPorId = (id) => todos.find((e) => e.id === id);

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onCancelar}>← Cancelar</button>
      <input style={{ ...S.input, marginBottom: 14, fontWeight: 800 }} placeholder="Nome da ficha (ex.: Treino A)"
        value={t.nome} onChange={(e) => setT({ ...t, nome: e.target.value })} />

      <div style={S.label}>Exercícios da ficha</div>
      <div style={{ margin: "8px 0 16px" }}>
        {t.itens.length === 0 && <div style={{ color: "var(--cinza)", fontSize: 14, padding: "8px 0" }}>Adicione exercícios da lista abaixo.</div>}
        {t.itens.map((it, i) => {
          const e = exPorId(it.exercicioId);
          return (
            <div key={i} style={{ ...S.card, padding: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ fontWeight: 800, fontSize: 15, flex: 1 }}>{e ? e.nome : "Exercício removido"}</div>
                <button style={{ background: "none", border: "none", color: "var(--perigo)", fontSize: 18, cursor: "pointer" }} onClick={() => rmEx(i)}>✕</button>
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ ...S.label, fontSize: 10 }}>Séries</div>
                  <input type="number" style={S.inputMini} value={it.series} min={1}
                    onChange={(ev) => upItem(i, "series", Math.max(1, parseInt(ev.target.value) || 1))} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ ...S.label, fontSize: 10 }}>Repetições</div>
                  <input type="number" style={S.inputMini} value={it.reps} min={1}
                    onChange={(ev) => upItem(i, "reps", Math.max(1, parseInt(ev.target.value) || 1))} />
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <button style={{ ...S.btn, marginBottom: 18 }} onClick={salvar}>Salvar ficha</button>

      <div style={S.label}>Adicionar exercício</div>
      <input style={{ ...S.input, margin: "8px 0 10px" }} placeholder="Buscar exercício..."
        value={busca} onChange={(e) => setBusca(e.target.value)} />
      {filtrados.map((ex) => (
        <div key={ex.id} style={{ ...S.card, padding: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 14 }}>
              {ex.nome}{ex.custom && <span style={S.tagCustom}>Meu</span>}
            </div>
            <div style={{ fontSize: 12, color: corGrupo(grupoPorId(ex.grupo)) }}>{grupoPorId(ex.grupo).nome}</div>
          </div>
          <button style={{ background: GRAD, color: "#FFFFFF", border: "none", borderRadius: 10, width: 34, height: 34, fontWeight: 900, fontSize: 18, cursor: "pointer" }}
            onClick={() => addEx(ex.id)}>+</button>
        </div>
      ))}
    </div>
  );
}

// ---------------- SESSÃO: registro + cronômetro com som + observações + vídeo ----------------
function TelaSessao({ sessao, setSessao, exPorId, descanso, setDescanso, som, setSom, onFinalizar, onDescartar, onVoltar, pedirConfirmacao }) {
  const [fimDescanso, setFimDescanso] = useState(null);
  const [totalDescanso, setTotalDescanso] = useState(descanso);
  const [agora, setAgora] = useState(Date.now());
  const [avisou, setAvisou] = useState(false);
  const ultimoBipe = useRef(null);

  useEffect(() => {
    if (!fimDescanso) return;
    const iv = setInterval(() => setAgora(Date.now()), 250);
    return () => clearInterval(iv);
  }, [fimDescanso]);

  const restante = fimDescanso ? Math.max(0, Math.ceil((fimDescanso - agora) / 1000)) : 0;
  const acabou = fimDescanso && restante === 0;

  // Bipes de contagem regressiva (3, 2, 1)
  useEffect(() => {
    if (!fimDescanso || acabou) return;
    if (restante <= 3 && restante > 0 && ultimoBipe.current !== restante) {
      ultimoBipe.current = restante;
      if (som) beep(880, 0.12, 0.25);
    }
  }, [restante, fimDescanso, acabou, som]);

  // Som + vibração de finalização
  useEffect(() => {
    if (acabou && !avisou) {
      setAvisou(true);
      if (som) {
        beep(660, 0.22, 0.3);
        setTimeout(() => beep(990, 0.45, 0.3), 240);
      }
      try { if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch (e) {}
    }
  }, [acabou, avisou, som]);

  const iniciarDescanso = () => {
    setTotalDescanso(descanso);
    setFimDescanso(Date.now() + descanso * 1000);
    setAvisou(false);
    ultimoBipe.current = null;
    if (som) beep(520, 0.08, 0.15); // clique de início (também "desbloqueia" o áudio no celular)
  };
  const mais15 = () => { setFimDescanso((f) => (f ? f + 15000 : Date.now() + 15000)); setTotalDescanso((tt) => tt + 15); setAvisou(false); ultimoBipe.current = null; };
  const fecharDescanso = () => { setFimDescanso(null); setAvisou(false); ultimoBipe.current = null; };

  const upSerie = (ei, si, campo, val) => {
    const itens = sessao.itens.map((it, i) =>
      i !== ei ? it : { ...it, series: it.series.map((s, j) => (j !== si ? s : { ...s, [campo]: val })) }
    );
    setSessao({ ...sessao, itens });
  };

  const upObs = (ei, val) => {
    const itens = sessao.itens.map((it, i) => (i !== ei ? it : { ...it, obs: val }));
    setSessao({ ...sessao, itens });
  };

  const marcarSerie = (ei, si) => {
    const jaFeita = sessao.itens[ei].series[si].feito;
    upSerie(ei, si, "feito", !jaFeita);
    if (!jaFeita) iniciarDescanso();
  };

  const feitas = sessao.itens.reduce((a, it) => a + it.series.filter((s) => s.feito).length, 0);
  const total = sessao.itens.reduce((a, it) => a + it.series.length, 0);

  const fmt = (seg) => {
    const m = Math.floor(seg / 60);
    const ss = seg % 60;
    return m + ":" + (ss < 10 ? "0" : "") + ss;
  };

  const pct = fimDescanso && totalDescanso > 0 ? Math.max(0, Math.min(100, (restante / totalDescanso) * 100)) : 0;

  const btnSom = (
    <button onClick={() => { setSom(!som); if (!som) beep(700, 0.1, 0.2); }}
      title={som ? "Desligar som" : "Ligar som"}
      style={{ width: 42, height: 42, borderRadius: 10, border: "1px solid " + (som ? "#E1306C66" : "var(--borda2)"), background: som ? "#E1306C22" : "transparent", fontSize: 18, cursor: "pointer" }}>
      {som ? "🔊" : "🔇"}
    </button>
  );

  return (
    <div style={{ padding: "0 18px", paddingBottom: fimDescanso ? 210 : 20 }}>
      <button style={S.voltar} onClick={onVoltar}>← Voltar (o treino continua salvo)</button>
      <div style={{ ...S.card, borderColor: "#E1306C44", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={S.label}>Treinando agora</div>
          <div style={{ fontWeight: 900, fontSize: 18 }}>{sessao.nome}</div>
        </div>
        <div style={{ fontSize: 22, fontWeight: 900, color: "#E1306C" }}>{feitas}/{total}</div>
      </div>

      {/* Configuração do descanso */}
      <div style={{ ...S.card, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <div style={{ flex: 1 }}>
          <div style={S.label}>Descanso entre séries</div>
          <div style={{ fontSize: 12, color: "var(--cinza)", marginTop: 2 }}>Inicia ao marcar uma série ✓</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={() => setDescanso(Math.max(15, descanso - 15))}
            style={{ width: 36, height: 36, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 18, cursor: "pointer" }}>−</button>
          <div style={{ fontWeight: 900, fontSize: 17, color: "#E1306C", minWidth: 48, textAlign: "center" }}>{fmt(descanso)}</div>
          <button onClick={() => setDescanso(Math.min(600, descanso + 15))}
            style={{ width: 36, height: 36, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 18, cursor: "pointer" }}>+</button>
          {btnSom}
        </div>
      </div>

      {sessao.itens.map((it, ei) => {
        const ex = exPorId(it.exercicioId);
        return (
          <div key={ei} style={S.card}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, gap: 8 }}>
              <div style={{ fontWeight: 800, fontSize: 16, flex: 1 }}>{ex ? ex.nome : "Exercício"}</div>
              <button onClick={() => abrirVideoDe(ex ? ex.nome : "")}
                title="Ver vídeo de como executar"
                style={{ border: "1px solid #E1306C66", background: "#E1306C15", color: "#E1306C", borderRadius: 8, padding: "7px 12px", fontWeight: 800, fontSize: 12, cursor: "pointer", whiteSpace: "nowrap" }}>
                ▶ Vídeo
              </button>
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
              <div style={{ width: 30 }} />
              <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Peso (kg)</div>
              <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Reps</div>
              <div style={{ width: 44 }} />
            </div>
            {it.series.map((s, si) => (
              <div key={si} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, opacity: s.feito ? 0.55 : 1 }}>
                <div style={{ width: 30, fontWeight: 900, color: "var(--cinza)", textAlign: "center" }}>{si + 1}</div>
                <input type="number" inputMode="decimal" placeholder="0" style={{ ...S.inputMini, flex: 1 }} value={s.peso}
                  onChange={(e) => upSerie(ei, si, "peso", e.target.value)} />
                <input type="number" inputMode="numeric" style={{ ...S.inputMini, flex: 1 }} value={s.reps}
                  onChange={(e) => upSerie(ei, si, "reps", e.target.value)} />
                <button onClick={() => marcarSerie(ei, si)}
                  style={{ width: 44, height: 42, borderRadius: 8, border: "none", fontWeight: 900, fontSize: 18, cursor: "pointer",
                    background: s.feito ? GRAD : "var(--borda)", color: s.feito ? "#FFFFFF" : "var(--cinza)" }}>✓</button>
              </div>
            ))}

            <input style={{ ...S.input, marginTop: 4, fontSize: 14 }}
              placeholder="📝 Obs.: altura do banco, altura da polia, pegada..."
              value={it.obs || ""}
              onChange={(e) => upObs(ei, e.target.value)} />
          </div>
        );
      })}

      <button style={{ ...S.btn, marginTop: 4 }} onClick={onFinalizar}>Finalizar treino</button>
      <button style={{ ...S.btnGhost, marginTop: 10, color: "var(--perigo)", borderColor: "var(--perigo-borda)" }}
        onClick={() => pedirConfirmacao("Descartar este treino sem salvar?", onDescartar)}>
        Descartar
      </button>

      {/* Barra do cronômetro de descanso */}
      {fimDescanso && (
        <div style={{ position: "fixed", bottom: "calc(64px + env(safe-area-inset-bottom))", left: 0, right: 0, background: acabou ? "var(--ok-bg)" : "var(--bg2)", borderTop: "2px solid " + (acabou ? "var(--ok)" : "#E1306C"), borderBottom: "1px solid var(--borda)", padding: "12px 18px 14px", zIndex: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ ...S.label, color: acabou ? "var(--ok)" : "var(--cinza)" }}>
                {acabou ? "Descanso concluído!" : "Descansando"}
              </div>
              <div style={{ fontSize: 30, fontWeight: 900, color: acabou ? "var(--ok)" : "#E1306C", fontVariantNumeric: "tabular-nums" }}>
                {acabou ? "Bora! 💪" : fmt(restante)}
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <button onClick={() => { setSom(!som); if (!som) beep(700, 0.1, 0.2); }}
                style={{ width: 40, height: 40, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", fontSize: 16, cursor: "pointer" }}>
                {som ? "🔊" : "🔇"}
              </button>
              {!acabou && (
                <button onClick={mais15}
                  style={{ border: "1px solid #E1306C66", background: "transparent", color: "#E1306C", borderRadius: 8, padding: "10px 12px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
                  +15s
                </button>
              )}
              <button onClick={fecharDescanso}
                style={{ border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", borderRadius: 8, padding: "10px 14px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
                {acabou ? "OK" : "Pular"}
              </button>
            </div>
          </div>
          {!acabou && (
            <div style={{ height: 5, background: "var(--borda)", borderRadius: 3, marginTop: 10, overflow: "hidden" }}>
              <div style={{ height: "100%", width: pct + "%", background: restante <= 3 ? "#ED4956" : "#E1306C", borderRadius: 3, transition: "width 0.25s linear" }} />
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function TelaHistorico({ historico, exPorId, onExcluir, pedirConfirmacao }) {
  return (
    <div style={{ padding: "0 18px" }}>
      <GraficoEvolucao historico={historico} exPorId={exPorId} />

      {historico.length === 0 && (
        <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)" }}>
          Seus treinos concluídos aparecem aqui, com as cargas de cada série.
        </div>
      )}
      {historico.map((h) => (
        <div key={h.id} style={S.card}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div style={{ fontWeight: 900, fontSize: 16, flex: 1 }}>{h.nome}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ color: "#E1306C", fontWeight: 800, fontSize: 13 }}>{h.duracaoMin} min</div>
              <button title="Excluir este treino do histórico"
                onClick={() => pedirConfirmacao("Excluir este treino do histórico? Essa ação não pode ser desfeita.", () => onExcluir(h.id))}
                style={{ background: "none", border: "1px solid var(--perigo-borda)", color: "var(--perigo)", borderRadius: 8, width: 30, height: 30, fontSize: 14, fontWeight: 900, cursor: "pointer" }}>
                🗑
              </button>
            </div>
          </div>
          <div style={{ color: "var(--cinza)", fontSize: 12, margin: "2px 0 10px" }}>
            {new Date(h.data).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" })}
          </div>
          {h.itens.map((it, i) => {
            const e = exPorId(it.exercicioId);
            return (
              <div key={i} style={{ fontSize: 13, marginBottom: 6, lineHeight: 1.5 }}>
                <span style={{ fontWeight: 700 }}>{(e ? e.nome : "Exercício")}: </span>
                <span style={{ color: "var(--cinza)" }}>
                  {it.series.map((s) => (s.peso || 0) + "kg×" + (s.reps || 0)).join("  ·  ")}
                </span>
                {it.obs && <div style={{ color: "var(--obs)", fontSize: 12, fontStyle: "italic", marginTop: 2 }}>📝 {it.obs}</div>}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ---------------- APP ----------------
function TreinoLivre() {
  const [aba, setAba] = useState("inicio");
  const [treinos, setTreinos] = useState([]);
  const [historico, setHistorico] = useState([]);
  const [customEx, setCustomEx] = useState([]);
  const [programas, setProgramas] = useState([]);
  const [progAberto, setProgAberto] = useState(null);
  const [descanso, setDescanso] = useState(90);
  const [som, setSom] = useState(true);
  const [tema, setTema] = useState("escuro");
  const [carregado, setCarregado] = useState(false);

  useEffect(() => {
    try { document.documentElement.setAttribute("data-tema", tema); } catch (e) {}
  }, [tema]);

  const [grupoAberto, setGrupoAberto] = useState(null);
  const [exercicioAberto, setExercicioAberto] = useState(null);
  const [editandoTreino, setEditandoTreino] = useState(null);
  const [sessao, setSessao] = useState(null);
  const [modal, setModal] = useState(null);
  const importRef = useRef("");
  const pedirConfirmacao = (msg, onSim) => setModal({ msg, onSim });
  const avisar = (msg) => setModal({ msg });

  const copiarLink = async () => {
    try {
      await navigator.clipboard.writeText(LINK_APP);
      avisar("Link copiado! Abra o Chrome, cole na barra de endereço e salve o app na tela inicial.");
    } catch (e) {
      avisar("Link do app: " + LINK_APP);
    }
  };

  const exportarDados = () => {
    const dados = JSON.stringify({ treinos, historico, customEx, descanso, som, tema, programas, seedV3: true });
    setModal({
      msg: "Backup dos seus dados. Toque em Copiar e guarde em local seguro (ex.: cole numa conversa sua no WhatsApp). Para restaurar, use Importar dados.",
      texto: dados,
    });
  };

  const importarDados = () => {
    importRef.current = "";
    setModal({
      msg: "Cole abaixo o código do backup e toque em Confirmar. Isso substitui os dados atuais deste aparelho.",
      importar: true,
      onSim: () => {
        try {
          const d = JSON.parse(importRef.current);
          if (!d || (!d.treinos && !d.historico && !d.customEx)) throw new Error("vazio");
          setTreinos(d.treinos || []);
          setHistorico(d.historico || []);
          setCustomEx(d.customEx || []);
          let pg2 = d.programas || [];
          if (!pg2.length && (d.treinos || []).length) {
            pg2 = [{ id: "prog-meus", nome: "Meus Treinos" }];
            setTreinos((d.treinos || []).map((t) => ({ ...t, programaId: t.programaId || "prog-meus" })));
          }
          setProgramas(pg2);
          if (d.descanso) setDescanso(d.descanso);
          if (d.som !== undefined) setSom(d.som);
          setTimeout(() => avisar("Backup restaurado com sucesso! 💪"), 100);
        } catch (e) {
          setTimeout(() => avisar("Não consegui ler esse código. Confira se copiou o backup completo e tente de novo."), 100);
        }
      },
    });
  };

  TEMA_APP = tema;
  const todos = [...EXERCICIOS, ...customEx];
  const exPorId = (id) => todos.find((e) => e.id === id);

  useEffect(() => {
    let tr = [], hi = [], ce = [], de = 90, so = true, seed = false, pg = null;
    try {
      const raw = store.get(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        tr = d.treinos || [];
        hi = d.historico || [];
        ce = d.customEx || [];
        de = d.descanso || 90;
        so = d.som !== undefined ? d.som : true;
        if (d.tema) setTema(d.tema);
        pg = d.programas || null;
        seed = !!d.seedV3;
      }
    } catch (e) {}
    // Insere/atualiza as fichas padrão (rotina semanal) uma única vez por versão
    if (!seed) {
      tr = tr.filter((t) => String(t.id).indexOf("padrao-") !== 0 && String(t.nome || "").trim().toLowerCase() !== "lucas koba");
      tr = [...FICHAS_PADRAO, ...tr];
    }
    // ---- Organização: "treinos" (programas) agrupam as fichas ----
    if (!pg) pg = [];
    if (tr.some((t) => String(t.id).indexOf("padrao-") === 0) && !pg.some((p) => p.id === "prog-avancado")) {
      pg.unshift({ id: "prog-avancado", nome: "Treino Avançado" });
    }
    tr = tr.map((t) => {
      if (t.programaId && pg.some((p) => p.id === t.programaId)) return t;
      if (String(t.id).indexOf("padrao-") === 0) return { ...t, programaId: "prog-avancado" };
      return { ...t, programaId: "prog-meus" };
    });
    if (tr.some((t) => t.programaId === "prog-meus") && !pg.some((p) => p.id === "prog-meus")) {
      pg.push({ id: "prog-meus", nome: "Meus Treinos" });
    }

    setTreinos(tr); setHistorico(hi); setCustomEx(ce); setDescanso(de); setSom(so); setProgramas(pg);
    setCarregado(true);

    // Se o app foi aberto por um link compartilhado (ficha, treino completo ou desafio)
    try {
      const hash = window.location.hash || "";
      const mF = hash.match(/#ficha=([^&]+)/);
      const mP = hash.match(/#prog=([^&]+)/);
      const mD = hash.match(/#desafio=([^&]+)/);
      if (mF || mP || mD) {
        try { window.history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e2) {}
      }
      if (mF) {
        const p = JSON.parse(decodeURIComponent(escape(atob(mF[1]))));
        if (p && p.n && p.i && p.i.length) {
          setModal({
            msg: 'Você recebeu a ficha de treino "' + p.n + '" com ' + p.i.length + " exercícios. Deseja adicionar às suas fichas?",
            positivo: true,
            onSim: () => aceitarFichaRecebida(p),
          });
        }
      } else if (mP) {
        const p = JSON.parse(decodeURIComponent(escape(atob(mP[1]))));
        if (p && p.pn && p.fs && p.fs.length) {
          setModal({
            msg: 'Você recebeu o treino completo "' + p.pn + '" com ' + p.fs.length + " ficha(s). Deseja adicionar aos seus treinos?",
            positivo: true,
            onSim: () => aceitarProgramaRecebido(p),
          });
        }
      } else if (mD) {
        const p = JSON.parse(decodeURIComponent(escape(atob(mD[1]))));
        if (p && p.nm) {
          const eu = calcularEstatisticas(hi);
          const naFrente = eu.total > (p.t || 0) || (eu.total === (p.t || 0) && eu.streak >= (p.s || 0));
          setModal({
            msg: "⚔️ " + p.nm + " te desafiou!\n\n" +
              p.nm + ": " + (p.t || 0) + " treinos · " + (p.s || 0) + " dia(s) seguidos · " + Math.round((p.v || 0) / 1000) + "t movidas\n" +
              "Você: " + eu.total + " treinos · " + eu.streak + " dia(s) seguidos · " + Math.round(eu.volumeTotal / 1000) + "t movidas\n\n" +
              (naFrente ? "Você está na frente! 🏆 Não deixa a vantagem cair." : "Bora virar esse jogo! 🔥 Escolhe uma ficha e treina hoje."),
          });
        }
      }
    } catch (e) {}
  }, []);

  useEffect(() => {
    if (!carregado) return;
    store.set(STORAGE_KEY, JSON.stringify({ treinos, historico, customEx, descanso, som, tema, programas, seedV3: true }));
  }, [treinos, historico, customEx, descanso, som, tema, programas, carregado]);

  const comecarSessao = (treino) => {
    setSessao({
      treinoId: treino.id,
      nome: treino.nome,
      inicio: Date.now(),
      itens: treino.itens.map((it) => ({
        exercicioId: it.exercicioId,
        obs: it.obs || "",
        series: Array.from({ length: it.series }, () => ({ peso: "", reps: String(it.reps || ""), feito: false })),
      })),
    });
    setAba("sessao");
  };

  const iniciarSessao = (treino) => {
    if (!treino.itens.length) { avisar("Esta ficha ainda não tem exercícios. Edite a ficha primeiro."); return; }
    if (sessao && sessao.treinoId === treino.id) { setAba("sessao"); return; }
    if (sessao) {
      pedirConfirmacao("Você já tem um treino em andamento (" + sessao.nome + "). Começar outro vai descartá-lo. Continuar?", () => comecarSessao(treino));
      return;
    }
    comecarSessao(treino);
  };

  const finalizarSessao = () => {
    const registro = {
      id: String(Date.now()),
      nome: sessao.nome,
      data: new Date().toISOString(),
      duracaoMin: Math.max(1, Math.round((Date.now() - sessao.inicio) / 60000)),
      itens: sessao.itens.map((it) => ({
        exercicioId: it.exercicioId,
        obs: it.obs || "",
        series: it.series.filter((s) => s.feito).map((s) => ({ peso: s.peso, reps: s.reps })),
      })).filter((it) => it.series.length > 0),
    };
    setHistorico([registro, ...historico]);
    // Salva as observações de volta na ficha (altura do banco, polia etc. ficam guardadas)
    setTreinos(treinos.map((t) => {
      if (t.id !== sessao.treinoId) return t;
      return { ...t, itens: t.itens.map((it, i) => (sessao.itens[i] ? { ...it, obs: sessao.itens[i].obs || "" } : it)) };
    }));
    setSessao(null);
    setAba("historico");
    const vol = Math.round(registro.itens.reduce((a, it) => a + it.series.reduce((b, s) => b + (parseFloat(s.peso) || 0) * (parseInt(s.reps) || 0), 0), 0));
    const nSeries = registro.itens.reduce((a, it) => a + it.series.length, 0);
    registrarEvento("treino-concluido");
    setTimeout(() => setModal({
      msg: "Treino concluído! 🎉\n\n" + nSeries + " séries · " + vol.toLocaleString("pt-BR") + " kg de volume · " + registro.duracaoMin + " min",
      storyTreino: { nome: registro.nome, series: nSeries, volume: vol, duracao: registro.duracaoMin },
    }), 250);
  };

  const excluirHistorico = (id) => setHistorico(historico.filter((h) => h.id !== id));

  // ---- Programas (treinos que agrupam fichas) ----
  const criarPrograma = () => {
    importRef.current = "";
    setModal({ msg: "Nome do novo treino (ex.: Treino Iniciante, Projeto Verão):", prompt: "Nome do treino", positivo: true, labelSim: "Criar", onSim: () => {
      const nome = (importRef.current || "").trim();
      if (!nome) { setTimeout(() => avisar("Digite um nome para o treino."), 100); return; }
      const pid = "prog-" + Date.now();
      setProgramas((prev) => [...prev, { id: pid, nome: nome }]);
      setProgAberto(pid);
      setAba("treinos");
    } });
  };
  const renomearPrograma = (p) => {
    importRef.current = p.nome;
    setModal({ msg: "Novo nome do treino:", prompt: "Nome do treino", valor: p.nome, positivo: true, labelSim: "Salvar", onSim: () => {
      const nome = (importRef.current || "").trim() || p.nome;
      setProgramas((prev) => prev.map((x) => (x.id === p.id ? { ...x, nome: nome } : x)));
    } });
  };
  const excluirPrograma = (p) => {
    const qtd = treinos.filter((t) => t.programaId === p.id).length;
    pedirConfirmacao('Excluir o treino "' + p.nome + '"' + (qtd ? " e suas " + qtd + " ficha(s)?" : "?"), () => {
      setProgramas((prev) => prev.filter((x) => x.id !== p.id));
      setTreinos((prev) => prev.filter((t) => t.programaId !== p.id));
      setProgAberto(null);
    });
  };
  const novaFicha = (progId) => {
    setEditandoTreino({ id: String(Date.now()), nome: "", programaId: progId, itens: [] });
    setAba("editarTreino");
  };

  // ---- Assistente: gera um treino completo em 3 respostas ----
  const gerarTreinoAssistente = (objetivo, dias, nivel) => {
    const reps = objetivo === "forca" ? 6 : objetivo === "definir" ? 15 : 10;
    const series = objetivo === "forca" ? 4 : 3;
    const qtd = nivel === "iniciante" ? 5 : nivel === "intermediario" ? 6 : 8;
    const modelo = SPLITS[dias] || SPLITS[3];
    const nomeObj = objetivo === "forca" ? "Força" : objetivo === "definir" ? "Definição" : "Hipertrofia";
    registrarEvento("treino-gerado-assistente");
    const pid = "prog-" + Date.now();
    setProgramas((prev) => [...prev, { id: pid, nome: "Meu Treino - " + nomeObj + " (" + dias + "x/sem)" }]);
    const fichas = modelo.map((m, i) => ({
      id: "gerada-" + Date.now() + "-" + i,
      nome: m[0],
      programaId: pid,
      itens: m[1].slice(0, qtd).map((idEx) => ({ exercicioId: idEx, series: series, reps: reps, obs: "" })),
    }));
    setTreinos((prev) => [...fichas, ...prev]);
    setProgAberto(pid);
    setAba("treinos");
    setTimeout(() => avisar("Treino gerado com " + fichas.length + " fichas! Pode editar tudo do seu jeito. 💪"), 150);
  };

  // ---- Story: imagem do progresso ----
  const storyProgresso = async () => {
    const est = calcularEstatisticas(historico);
    const ganhas = CONQUISTAS.filter((c) => c.cond(est));
    const blob = await gerarImagemStory([
      { t: "MEU PROGRESSO 💪", tam: 66, cor: "#E1306C", esp: 90 },
      { t: "🔥 " + est.streak + " dia(s) seguidos", tam: 74, esp: 70 },
      { t: est.total + " treinos concluídos", tam: 56, esp: 70 },
      { t: (est.volumeTotal >= 1000 ? Math.round(est.volumeTotal / 1000).toLocaleString("pt-BR") + " toneladas" : est.volumeTotal.toLocaleString("pt-BR") + " kg") + " movidas", tam: 56, cor: "#ED4956", esp: 100 },
      { t: "🏆 " + ganhas.length + " de " + CONQUISTAS.length + " conquistas", tam: 50, cor: "#E1306C", esp: 70 },
      { t: ganhas.slice(-5).map((c) => c.icone).join("  ") || "💪", tam: 92, esp: 40 },
    ]);
    compartilharImagem(blob, "Meu progresso no Treino Livre 💪 " + LINK_APP, avisar);
  };

  // ---- Desafio entre amigos ----
  const desafiarAmigo = () => {
    importRef.current = "";
    setModal({ msg: "Digite seu nome (vai aparecer para o amigo desafiado):", prompt: "Seu nome", positivo: true, labelSim: "Continuar", onSim: () => {
      const nome = ((importRef.current || "").trim() || "Atleta").slice(0, 20);
      const est = calcularEstatisticas(historico);
      const payload = { nm: nome, t: est.total, s: est.streak, v: est.volumeTotal, w: est.treinosSemana };
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
      const url = LINK_APP + "#desafio=" + b64;
      const texto = "⚔️ " + nome + " te desafiou no Treino Livre! " + est.total + " treinos e " + est.streak + " dia(s) seguidos. Aceita o desafio?";
      setTimeout(async () => {
        if (navigator.share) {
          try { await navigator.share({ text: texto, url: url }); return; }
          catch (e) { if (e && e.name === "AbortError") return; }
        }
        setModal({ msg: "Copie e envie o desafio para um amigo:", texto: texto + " " + url });
      }, 100);
    } });
  };

  // ---- Compartilhar um treino completo (programa com todas as fichas) ----
  const compartilharPrograma = async (p) => {
    const fichas = treinos.filter((t) => t.programaId === p.id && t.itens.length);
    if (!fichas.length) { avisar("Este treino ainda não tem fichas com exercícios."); return; }
    const usados = {};
    fichas.forEach((f) => f.itens.forEach((it) => { usados[it.exercicioId] = true; }));
    const custom = customEx.filter((e) => usados[e.id]);
    const payload = { v: 2, pn: p.nome, fs: fichas.map((f) => ({ n: f.nome, i: f.itens.map((it) => ({ e: it.exercicioId, s: it.series, r: it.reps })) })), x: custom };
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    const url = LINK_APP + "#prog=" + b64;
    registrarEvento("treino-compartilhado");
    const texto = 'Te enviei o treino completo "' + p.nome + '" (' + fichas.length + " fichas) no Treino Livre 💪 Toque no link para adicionar:";
    if (navigator.share) {
      try { await navigator.share({ text: texto, url: url }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    setModal({ msg: "Copie o link e envie. Quem abrir recebe o treino completo:", texto: url });
  };

  const aceitarProgramaRecebido = (p) => {
    const novosCustom = (p.x || []).filter((e) => e && e.id && !EXERCICIOS.some((x) => x.id === e.id));
    setCustomEx((prev) => [...prev, ...novosCustom.filter((e) => !prev.some((x) => x.id === e.id))]);
    const pid = "prog-" + Date.now();
    setProgramas((prev) => [...prev, { id: pid, nome: p.pn || "Treino recebido" }]);
    const idsValidos = {};
    EXERCICIOS.forEach((e) => { idsValidos[e.id] = true; });
    customEx.forEach((e) => { idsValidos[e.id] = true; });
    novosCustom.forEach((e) => { idsValidos[e.id] = true; });
    const fichas = (p.fs || []).map((f, i) => ({
      id: "recebida-" + Date.now() + "-" + i,
      nome: f.n || "Ficha",
      programaId: pid,
      itens: (f.i || []).filter((it) => it && idsValidos[it.e]).map((it) => ({ exercicioId: it.e, series: it.s || 3, reps: it.r || 12, obs: "" })),
    })).filter((f) => f.itens.length);
    setTreinos((prev) => [...fichas, ...prev]);
    setProgAberto(pid);
    setAba("treinos");
    setTimeout(() => avisar('Treino "' + (p.pn || "recebido") + '" adicionado com ' + fichas.length + " ficha(s)! 💪"), 150);
  };

  // ---- Compartilhar ficha: a ficha inteira viaja dentro do link ----
  const compartilharFicha = async (t) => {
    if (!t.itens.length) { avisar("Esta ficha está vazia. Adicione exercícios antes de enviar."); return; }
    const custom = customEx.filter((e) => t.itens.some((it) => it.exercicioId === e.id));
    const payload = {
      v: 1,
      n: t.nome,
      i: t.itens.map((it) => ({ e: it.exercicioId, s: it.series, r: it.reps })),
      x: custom,
    };
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    const url = LINK_APP + "#ficha=" + b64;
    registrarEvento("ficha-compartilhada");
    const texto = 'Te enviei a ficha de treino "' + t.nome + '" no Treino Livre 💪 Toque no link para adicionar:';
    if (navigator.share) {
      try { await navigator.share({ text: texto, url: url }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    setModal({ msg: "Copie o link e envie no WhatsApp. Quem abrir recebe a ficha pronta para adicionar:", texto: url });
  };

  const aceitarFichaRecebida = (p) => {
    const novosCustom = (p.x || []).filter((e) => e && e.id && !EXERCICIOS.some((x) => x.id === e.id));
    setCustomEx((prev) => [...prev, ...novosCustom.filter((e) => !prev.some((x) => x.id === e.id))]);
    const idsValidos = {};
    EXERCICIOS.forEach((e) => { idsValidos[e.id] = true; });
    customEx.forEach((e) => { idsValidos[e.id] = true; });
    novosCustom.forEach((e) => { idsValidos[e.id] = true; });
    const itens = (p.i || [])
      .filter((it) => it && idsValidos[it.e])
      .map((it) => ({ exercicioId: it.e, series: it.s || 3, reps: it.r || 12, obs: "" }));
    if (!itens.length) { avisar("Não consegui ler os exercícios desta ficha. Peça para enviarem o link de novo."); return; }
    setProgramas((prev) => (prev.some((x) => x.id === "prog-meus") ? prev : [...prev, { id: "prog-meus", nome: "Meus Treinos" }]));
    setTreinos((prev) => [{ id: "recebida-" + Date.now(), nome: p.n || "Ficha recebida", programaId: "prog-meus", itens: itens }, ...prev]);
    setAba("treinos");
    setTimeout(() => avisar('Ficha "' + (p.n || "recebida") + '" adicionada às suas fichas! 💪'), 150);
  };

  const salvarTreino = (t) => {
    const existe = treinos.some((x) => x.id === t.id);
    setTreinos(existe ? treinos.map((x) => (x.id === t.id ? t : x)) : [...treinos, t]);
    setEditandoTreino(null);
    setAba("treinos");
  };

  const salvarCustomEx = (ex) => {
    setCustomEx([...customEx, ex]);
    setAba("exercicios");
    setGrupoAberto(ex.grupo);
  };

  const excluirCustomEx = (id) => {
    pedirConfirmacao("Excluir este exercício criado por você? Ele sairá das fichas em que estiver.", () => {
      setCustomEx((prev) => prev.filter((e) => e.id !== id));
      setTreinos((prev) => prev.map((t) => ({ ...t, itens: t.itens.filter((it) => it.exercicioId !== id) })));
    });
  };

  const abas = [
    { id: "inicio", nome: "Início", icone: "⌂" },
    { id: "exercicios", nome: "Exercícios", icone: "💪" },
    { id: "treinos", nome: "Fichas", icone: "▤" },
    { id: "historico", nome: "Histórico", icone: "◷" },
  ];
  const titulos = { inicio: "Treino Livre", exercicios: "Exercícios", treinos: "Meus treinos", historico: "Histórico", editarTreino: "Editar ficha", sessao: "Treino", novoExercicio: "Novo exercício", assistente: "Assistente" };

  if (!carregado) {
    return <div style={{ ...S.app, display: "flex", alignItems: "center", justifyContent: "center" }}>Carregando...</div>;
  }

  return (
    <div style={S.app}>
      <Header titulo={titulos[aba]} tema={tema} onTema={() => setTema(tema === "escuro" ? "claro" : "escuro")} />
      <div style={{ paddingTop: 14 }}>
        {aba === "inicio" && (
          <TelaInicio programas={programas} treinos={treinos} historico={historico} totalEx={todos.length}
            onTreinar={iniciarSessao}
            onCriarPrograma={criarPrograma}
            onAssistente={() => setAba("assistente")}
            onStoryProgresso={storyProgresso}
            onDesafiar={desafiarAmigo}
            onCopiarLink={copiarLink}
            onExportar={exportarDados}
            onImportar={importarDados} />
        )}
        {aba === "assistente" && (
          <TelaAssistente onGerar={gerarTreinoAssistente} onCancelar={() => setAba("inicio")} />
        )}
        {aba === "exercicios" && (
          <TelaExercicios todos={todos} exPorId={exPorId}
            grupoAberto={grupoAberto} setGrupoAberto={setGrupoAberto}
            exercicioAberto={exercicioAberto} setExercicioAberto={setExercicioAberto}
            onNovoExercicio={() => setAba("novoExercicio")}
            onExcluirCustom={excluirCustomEx} />
        )}
        {aba === "novoExercicio" && (
          <FormNovoExercicio grupoSugerido={grupoAberto} avisar={avisar}
            onSalvar={salvarCustomEx}
            onCancelar={() => setAba("exercicios")} />
        )}
        {aba === "treinos" && (
          <TelaTreinos programas={programas} treinos={treinos} exPorId={exPorId}
            progAberto={progAberto} setProgAberto={setProgAberto}
            pedirConfirmacao={pedirConfirmacao}
            onTreinar={iniciarSessao}
            onNovaFicha={novaFicha}
            onEditar={(t) => { setEditandoTreino(JSON.parse(JSON.stringify(t))); setAba("editarTreino"); }}
            onExcluirFicha={(id) => setTreinos(treinos.filter((x) => x.id !== id))}
            onCompartilharFicha={compartilharFicha}
            onNovoPrograma={criarPrograma}
            onRenomearPrograma={renomearPrograma}
            onExcluirPrograma={excluirPrograma}
            onCompartilharPrograma={compartilharPrograma}
            onAssistente={() => setAba("assistente")} />
        )}
        {aba === "editarTreino" && editandoTreino && (
          <TelaEditarTreino key={editandoTreino.id} treinoInicial={editandoTreino} todos={todos} avisar={avisar}
            onSalvar={salvarTreino}
            onCancelar={() => { setEditandoTreino(null); setAba("treinos"); }} />
        )}
        {aba === "sessao" && sessao && (
          <TelaSessao sessao={sessao} setSessao={setSessao} exPorId={exPorId} pedirConfirmacao={pedirConfirmacao}
            descanso={descanso} setDescanso={setDescanso}
            som={som} setSom={setSom}
            onFinalizar={finalizarSessao}
            onVoltar={() => setAba("inicio")}
            onDescartar={() => { setSessao(null); setAba("inicio"); }} />
        )}
        {aba === "historico" && <TelaHistorico historico={historico} exPorId={exPorId} onExcluir={excluirHistorico} pedirConfirmacao={pedirConfirmacao} />}
      </div>

      {modal && (
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.75)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}
          onClick={() => setModal(null)}>
          <div style={{ ...S.card, width: "100%", maxWidth: 340, marginBottom: 0, borderColor: "var(--borda2)" }}
            onClick={(e) => e.stopPropagation()}>
            <div style={{ fontSize: 15, lineHeight: 1.6, marginBottom: 16, whiteSpace: "pre-line" }}>{modal.msg}</div>
            {modal.prompt && (
              <input placeholder={modal.prompt} defaultValue={modal.valor || ""}
                onChange={(e) => { importRef.current = e.target.value; }}
                style={{ ...S.input, marginBottom: 12 }} />
            )}
            {modal.storyTreino && (
              <button style={{ ...S.btn, marginBottom: 10 }} onClick={async () => {
                const st = modal.storyTreino;
                setModal(null);
                const blob = await gerarImagemStory([
                  { t: "TREINO CONCLUÍDO! 🎉", tam: 64, cor: "#E1306C", esp: 80 },
                  { t: st.nome, tam: 50, cor: "#F2F0EC", esp: 110 },
                  { t: String(st.series), tam: 150, cor: "#E1306C", esp: 30 },
                  { t: "séries concluídas", tam: 40, cor: "var(--cinza)", esp: 110 },
                  { t: st.volume.toLocaleString("pt-BR") + " kg", tam: 110, cor: "#ED4956", esp: 30 },
                  { t: "de volume movido", tam: 40, cor: "var(--cinza)", esp: 110 },
                  { t: "⏱ " + st.duracao + " min de treino", tam: 46, esp: 40 },
                ]);
                compartilharImagem(blob, "Treino concluído no Treino Livre! 💪 " + LINK_APP, avisar);
              }}>📸 Compartilhar no story</button>
            )}
            {modal.texto && (
              <React.Fragment>
                <textarea readOnly value={modal.texto} onFocus={(e) => e.target.select()}
                  style={{ ...S.input, minHeight: 130, fontSize: 11, marginBottom: 10, fontFamily: "monospace" }} />
                <button style={{ ...S.btnGhost, marginBottom: 12 }}
                  onClick={async (e) => {
                    try { await navigator.clipboard.writeText(modal.texto); e.target.textContent = "✓ Copiado!"; } catch (err) {}
                  }}>
                  📋 Copiar
                </button>
              </React.Fragment>
            )}
            {modal.importar && (
              <textarea placeholder="Cole o código do backup aqui..."
                onChange={(e) => { importRef.current = e.target.value; }}
                style={{ ...S.input, minHeight: 130, fontSize: 11, marginBottom: 12, fontFamily: "monospace" }} />
            )}
            <div style={{ display: "flex", gap: 10 }}>
              {modal.onSim ? (
                <React.Fragment>
                  <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => setModal(null)}>Cancelar</button>
                  <button style={{ ...S.btn, flex: 1, background: modal.positivo ? GRAD : "#ED4956", color: "#FFFFFF" }}
                    onClick={() => { const f = modal.onSim; setModal(null); f(); }}>{modal.labelSim || (modal.positivo ? "Adicionar" : "Confirmar")}</button>
                </React.Fragment>
              ) : (
                <button style={{ ...S.btn, flex: 1 }} onClick={() => setModal(null)}>OK</button>
              )}
            </div>
          </div>
        </div>
      )}

      {sessao && aba !== "sessao" && (
        <div style={{ position: "fixed", bottom: "calc(72px + env(safe-area-inset-bottom))", left: 12, right: 12, zIndex: 15 }}>
          <button onClick={() => setAba("sessao")}
            style={{ ...S.btn, boxShadow: "0 4px 16px rgba(0,0,0,0.5)", border: "2px solid var(--bg)" }}>
            ▶ Continuar treino — {sessao.nome}
          </button>
        </div>
      )}

      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "var(--bg2)", borderTop: "1px solid var(--borda)", display: "flex", padding: "8px 0", paddingBottom: "calc(14px + env(safe-area-inset-bottom))", zIndex: 10 }}>
        {abas.map((a) => (
          <button key={a.id} onClick={() => { setAba(a.id); setGrupoAberto(null); setExercicioAberto(null); setProgAberto(null); }}
            style={{ flex: 1, background: "none", border: "none", cursor: "pointer", color: aba === a.id ? "#E1306C" : "var(--cinza)", fontWeight: aba === a.id ? 900 : 600 }}>
            <div style={{ fontSize: 18 }}>{a.icone}</div>
            <div style={{ fontSize: 11, marginTop: 2 }}>{a.nome}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TreinoLivre />);

// Modo offline: depois da primeira visita, o app abre mesmo sem internet
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
<!-- Contador de visitas (GoatCounter): só o dono do painel vê os números. Sem cookies, compatível com LGPD. -->
<script data-goatcounter="https://treinolivre.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>

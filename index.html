}

// ---------------- ESTATÍSTICAS: CALENDÁRIO DO MÊS ----------------
function CalendarioTreinos({ historico }) {
  const [desl, setDesl] = useState(0);
  const hoje = new Date();
  const ref = new Date(hoje.getFullYear(), hoje.getMonth() + desl, 1);
  const porDia = {};
  historico.forEach((h) => {
    const d = new Date(h.data);
    if (d.getMonth() === ref.getMonth() && d.getFullYear() === ref.getFullYear()) {
      porDia[d.getDate()] = (porDia[d.getDate()] || 0) + statsTreino(h).volume;
    }
  });
  const vmax = Math.max(...Object.keys(porDia).map((k) => porDia[k]), 1);
  const nDias = new Date(ref.getFullYear(), ref.getMonth() + 1, 0).getDate();
  const inicio = (new Date(ref.getFullYear(), ref.getMonth(), 1).getDay() + 6) % 7;
  const celulas = [];
  for (let i = 0; i < inicio; i++) celulas.push(null);
  for (let d = 1; d <= nDias; d++) celulas.push(d);
  const treinosMes = Object.keys(porDia).length;
  return (
    <div style={S.card}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <button onClick={() => setDesl(desl - 1)} aria-label="Mês anterior"
          style={{ background: "none", border: "none", color: "#E1306C", fontSize: 20, fontWeight: 900, cursor: "pointer", padding: "0 8px" }}>‹</button>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontWeight: 900, fontSize: 14, textTransform: "capitalize" }}>
            {ref.toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}
          </div>
          <div style={{ color: "var(--cinza)", fontSize: 11 }}>{treinosMes} {plural(treinosMes, "dia", "dias")} de treino</div>
        </div>
        <button onClick={() => setDesl(Math.min(0, desl + 1))} disabled={desl >= 0} aria-label="Mês seguinte"
          style={{ background: "none", border: "none", color: desl >= 0 ? "var(--borda2)" : "#E1306C", fontSize: 20, fontWeight: 900, cursor: desl >= 0 ? "default" : "pointer", padding: "0 8px" }}>›</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginTop: 12 }}>
        {["S", "T", "Q", "Q", "S", "S", "D"].map((d, i) => (
          <div key={i} style={{ textAlign: "center", fontSize: 10, color: "var(--cinza2)", fontWeight: 700 }}>{d}</div>
        ))}
        {celulas.map((d, i) => {
          if (d === null) return <div key={i} />;
          const vol = porDia[d];
          const intens = vol ? 0.3 + (vol / vmax) * 0.7 : 0;
          const ehHoje = desl === 0 && d === hoje.getDate();
          return (
            <div key={i} title={vol ? fmtPeso(vol) : ""}
              style={{
                aspectRatio: "1", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 11, fontWeight: vol ? 900 : 500,
                background: vol ? "rgba(225,48,108," + intens + ")" : "var(--input)",
                color: vol ? "#FFFFFF" : "var(--cinza2)",
                border: ehHoje ? "1.5px solid #E1306C" : "1px solid var(--borda)",
              }}>
              {d}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------------- ESTATÍSTICAS: NÚMEROS GERAIS ----------------
function NumerosGerais({ historico }) {
  const est = calcularEstatisticas(historico);
  let minutos = 0, series = 0, reps = 0;
  historico.forEach((h) => {
    minutos += h.duracaoMin || 0;
    const s = statsTreino(h);
    series += s.series; reps += s.reps;
  });
  // Média das últimas 8 semanas: usa o MESMO período no numerador e no denominador.
  // Conta só a partir da primeira semana em que houve treino, para não penalizar quem começou agora.
  const ult8 = volumeSemanal(historico, 8);
  const treinos8 = ult8.reduce((a, s) => a + s.treinos, 0);
  const primeiraAtiva = ult8.findIndex((s) => s.treinos > 0);
  const semanas = primeiraAtiva < 0 ? 1 : ult8.length - primeiraAtiva;
  const eq = equivalencia(est.volumeTotal);
  const itens = [
    ["Treinos", est.total],
    ["Horas", (Math.round((minutos / 60) * 10) / 10).toLocaleString("pt-BR")],
    ["Séries", series.toLocaleString("pt-BR")],
    ["Repetições", reps.toLocaleString("pt-BR")],
    ["Volume total", fmtPeso(est.volumeTotal)],
    ["Sequência", est.streak + " " + plural(est.streak, "dia", "dias")],
    ["Média/semana", (() => {
      const m = Math.round((treinos8 / semanas) * 10) / 10;
      return m.toLocaleString("pt-BR") + " " + plural(m, "treino", "treinos");
    })()],
    ["Esta semana", fmtPeso(est.volumeSemana)],
  ];
  return (
    <div style={S.card}>
      <div style={{ ...S.label, marginBottom: 12 }}>Seus números</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {itens.map(([nome, val]) => (
          <div key={nome} style={{ background: "var(--input)", border: "1px solid var(--borda)", borderRadius: 12, padding: "10px 12px" }}>
            <div style={{ fontSize: 18, fontWeight: 900, color: "#E1306C" }}>{val}</div>
            <div style={{ fontSize: 10, color: "var(--cinza)", textTransform: "uppercase", letterSpacing: 0.5 }}>{nome}</div>
          </div>
        ))}
      </div>
      {eq && (
        <div style={{ marginTop: 12, fontSize: 12, color: "var(--cinza)", textAlign: "center" }}>
          Você já moveu {fmtPeso(est.volumeTotal)} — {eq}
        </div>
      )}
    </div>
  );
}

// ---------------- GRÁFICO DE EVOLUÇÃO ----------------
function GraficoEvolucao({ historico, exPorId }) {
  const idsComDados = [];
  const vistos = {};
  historico.forEach((h) => h.itens.forEach((it) => {
    const temPeso = it.series.some((s) => parseFloat(s.peso) > 0);
    if (temPeso && !vistos[it.exercicioId] && exPorId(it.exercicioId)) {
      vistos[it.exercicioId] = true;
      idsComDados.push(it.exercicioId);
    }
  }));

  const [exSel, setExSel] = useState(idsComDados[0] || "");
  const [metrica, setMetrica] = useState("max");

  useEffect(() => {
    if ((!exSel || !vistos[exSel]) && idsComDados.length) setExSel(idsComDados[0]);
  }, [historico.length]);

  if (idsComDados.length === 0) {
    return (
      <div style={S.card}>
        <div style={S.label}>Evolução</div>
        <div style={{ color: "var(--cinza)", fontSize: 14, marginTop: 8 }}>
          Conclua treinos registrando os pesos para ver seu gráfico de evolução aqui.
        </div>
      </div>
    );
  }

  const ordenado = [...historico].sort((a, b) => new Date(a.data) - new Date(b.data));
  const pontos = [];
  ordenado.forEach((h) => {
    const it = h.itens.find((x) => x.exercicioId === exSel);
    if (!it) return;
    let valor = 0;
    if (metrica === "max") {
      it.series.forEach((sr) => {
        if (!serieConta(sr)) return;
        const pz = ehTempo(sr) ? segundosDe(sr) : cargaDe(sr);
        if (pz > valor) valor = pz;
      });
    } else if (metrica === "1rm") {
      valor = melhor1RM(it);
    } else {
      valor = itemDeTempo(it) ? tempoItem(it) : volumeItem(it);
    }
    if (valor > 0) pontos.push({ data: new Date(h.data), valor });
  });

  const W = 320, H = 150, x0 = 34, x1 = 310, y0 = 118, y1 = 16;
  let svg = null;
  if (pontos.length >= 2) {
    const vmin = Math.min(...pontos.map((pt) => pt.valor));
    const vmax = Math.max(...pontos.map((pt) => pt.valor));
    const range = vmax - vmin || 1;
    const px = (i) => x0 + (i / (pontos.length - 1)) * (x1 - x0);
    const py = (v) => y0 - ((v - vmin) / range) * (y0 - y1);
    const linha = pontos.map((pt, i) => px(i).toFixed(1) + "," + py(pt.valor).toFixed(1)).join(" ");
    const fmtData = (d) => d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
    svg = (
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }}>
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={x0} x2={x1} y1={y0 - f * (y0 - y1)} y2={y0 - f * (y0 - y1)} stroke="var(--borda)" strokeWidth="1" />
        ))}
        <text x={x0 - 4} y={y1 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{vmax}</text>
        <text x={x0 - 4} y={y0 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{vmin}</text>
        <polyline points={linha} fill="none" stroke="#E1306C" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        {pontos.map((pt, i) => (
          <circle key={i} cx={px(i)} cy={py(pt.valor)} r="3.5" fill="#ED4956" stroke="var(--bg)" strokeWidth="1" />
        ))}
        <text x={x0} y={H - 4} fill="var(--cinza)" fontSize="10">{fmtData(pontos[0].data)}</text>
        <text x={x1} y={H - 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{fmtData(pontos[pontos.length - 1].data)}</text>
      </svg>
    );
  }

  const primeiro = pontos[0], ultimo = pontos[pontos.length - 1];
  const melhor = pontos.length ? Math.max(...pontos.map((pt) => pt.valor)) : 0;

  return (
    <div style={S.card}>
      <div style={{ ...S.label, marginBottom: 10 }}>Evolução do treino</div>

      <select value={exSel} onChange={(e) => setExSel(e.target.value)}
        style={{ ...S.input, marginBottom: 10, fontWeight: 700 }}>
        {idsComDados.map((id) => {
          const e = exPorId(id);
          return <option key={id} value={id}>{e ? e.nome : id}</option>;
        })}
      </select>

      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        {[["max", "Carga máx."], ["volume", "Volume"], ["1rm", "1RM estim."]].map(([m, nomeM]) => (
          <button key={m} onClick={() => setMetrica(m)}
            style={{
              flex: 1, border: "1px solid", borderColor: metrica === m ? "#E1306C" : "var(--borda2)",
              background: metrica === m ? "#E1306C22" : "transparent",
              color: metrica === m ? "#E1306C" : "var(--cinza)",
              borderRadius: 8, padding: "8px 10px", fontWeight: 800, fontSize: 12, cursor: "pointer",
            }}>
            {nomeM}
          </button>
        ))}
      </div>

      {pontos.length >= 2 ? (
        <React.Fragment>
          {svg}
          <div style={{ display: "flex", gap: 12, marginTop: 10 }}>
            <Resumo num={(primeiro ? primeiro.valor : 0) + unidadeCurta(metrica)} txt="início" />
            <Resumo num={(ultimo ? ultimo.valor : 0) + unidadeCurta(metrica)} txt="último" />
            <Resumo num={melhor + unidadeCurta(metrica)} txt="recorde" />
          </div>
          {metrica === "1rm" && (
            <div style={{ color: "var(--cinza2)", fontSize: 11, marginTop: 10, lineHeight: 1.4 }}>
              1RM estimado é a carga máxima que você levantaria em uma única repetição, calculada a partir das suas séries (fórmula de Epley). Serve para comparar treinos com repetições diferentes.
            </div>
          )}
        </React.Fragment>
      ) : (
        <div style={{ color: "var(--cinza)", fontSize: 13 }}>
          Registre pelo menos 2 treinos com este exercício para ver a linha de evolução.
        </div>
      )}
    </div>
  );
}
function unidadeCurta(metrica) { return metrica === "volume" ? "" : "kg"; }

// ---------------- CELEBRAÇÃO (recorde batido, novo nível) ----------------
const CORES_CONFETE = ["#F58529", "#DD2A7B", "#8134AF", "#4F5BD5", "#FEDA75", "#4ADE80"];
function Confete({ pecas = 44 }) {
  // Sorteado uma vez só: se recalculasse a cada render, o confete "pularia" na tela.
  const lista = useMemo(() => Array.from({ length: pecas }, (unused, i) => ({
    i,
    esq: Math.random() * 100,
    cor: CORES_CONFETE[Math.floor(Math.random() * CORES_CONFETE.length)],
    atraso: Math.random() * 450,
    duracao: 1700 + Math.random() * 1300,
    desvio: (Math.random() * 40 - 20).toFixed(1) + "vw",
    giro: Math.round(360 + Math.random() * 720) + "deg",
  })), [pecas]);
  return (
    <React.Fragment>
      {lista.map((p) => (
        <span key={p.i} className="confete-peca" aria-hidden="true"
          style={{
            left: p.esq + "vw", background: p.cor,
            animationDelay: p.atraso + "ms", animationDuration: p.duracao + "ms",
            "--desvio": p.desvio, "--giro": p.giro,
          }} />
      ))}
    </React.Fragment>
  );
}

function Celebracao({ festa, onFechar }) {
  useEffect(() => {
    if (!festa) return;
    const t = setTimeout(onFechar, 3400);
    return () => clearTimeout(t);
  }, [festa, onFechar]);
  if (!festa) return null;
  return (
    <div role="status" aria-live="assertive" onClick={onFechar}
      style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, zIndex: 55, display: "flex",
        alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.6)", padding: 24 }}>
      <Confete />
      <div className="celebra-cartao"
        style={{ ...S.card, marginBottom: 0, textAlign: "center", maxWidth: 330, width: "100%", border: "2px solid #E1306C" }}>
        <div className="celebra-icone" style={{ fontSize: 54, lineHeight: 1 }} aria-hidden="true">{festa.icone}</div>
        <div style={{ fontSize: 12, fontWeight: 900, letterSpacing: 1.5, textTransform: "uppercase", color: "#E1306C", marginTop: 10 }}>
          {festa.titulo}
        </div>
        <div style={{ fontSize: 19, fontWeight: 900, marginTop: 6, lineHeight: 1.35, whiteSpace: "pre-line" }}>{festa.destaque}</div>
        {festa.detalhe && (
          <div style={{ fontSize: 13, color: "var(--cinza)", marginTop: 8, lineHeight: 1.5 }}>{festa.detalhe}</div>
        )}

      </div>
    </div>
  );
}

// Cronômetro do treino. Componente separado de propósito: assim o relógio bate
// a cada segundo sem redesenhar a lista inteira de exercícios e campos.
function CronometroSessao({ inicio }) {
  const [agora, setAgora] = useState(Date.now());
  useEffect(() => {
    const iv = setInterval(() => setAgora(Date.now()), 1000);
    return () => clearInterval(iv);
  }, []);
  const seg = Math.max(0, Math.floor((agora - inicio) / 1000));
  const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60;
  const dois = (n) => (n < 10 ? "0" + n : String(n));
  return (
    <span style={{ fontVariantNumeric: "tabular-nums" }}>
      {h > 0 ? h + ":" + dois(m) + ":" + dois(s) : m + ":" + dois(s)}
    </span>
  );
}

// ---------------- MINIATURA E DEMONSTRAÇÃO DO EXERCÍCIO ----------------
// A miniatura ao lado do nome deixa claro qual aparelho é, sem precisar sair
// da tela de treino. Tocar nela abre a execução completa por cima da sessão.
function MiniaturaExercicio({ ex, tamanho = 54, onAbrir }) {
  const fotoPropria = useFotoExercicio(ex);
  const url = fotoPropria || (ex ? IMAGENS_WGER[ex.id] : null);
  const g = ex ? grupoPorId(ex.grupo) : null;
  // Desenho de catálogo pede "contain" (não cortar o boneco); foto de aparelho
  // pede "cover", senão fica uma tarja no meio de um quadrado vazio.
  const conteudo = url
    ? <img src={url} alt="" style={{ width: "100%", height: "100%", objectFit: fotoPropria ? "cover" : "contain", background: fotoPropria ? "var(--input)" : "#FFFFFF" }} />
    : <span aria-hidden="true" style={{ fontSize: tamanho * 0.42, fontWeight: 900, color: corGrupo(g) }}>{ex ? ex.nome[0] : "?"}</span>;
  const estilo = {
    width: tamanho, height: tamanho, borderRadius: 12, overflow: "hidden", flexShrink: 0,
    border: "1px solid var(--borda2)", background: url && !fotoPropria ? "#FFFFFF" : "var(--input)",
    display: "flex", alignItems: "center", justifyContent: "center", padding: 0,
  };
  if (!onAbrir) return <div style={estilo} aria-hidden="true">{conteudo}</div>;
  return (
    <button type="button" onClick={onAbrir} style={{ ...estilo, cursor: "pointer" }}
      aria-label={"Ver como executar " + (ex ? ex.nome : "o exercício")}>
      {conteudo}
    </button>
  );
}

function ModalDemonstracao({ ex, onFechar }) {
  useEffect(() => {
    const aoTeclar = (e) => { if (e.key === "Escape") onFechar(); };
    window.addEventListener("keydown", aoTeclar);
    return () => window.removeEventListener("keydown", aoTeclar);
  }, [onFechar]);
  if (!ex) return null;
  const g = grupoPorId(ex.grupo);
  const p = (ex.musc && ex.musc.p) || [];
  const s = (ex.musc && ex.musc.s) || [];
  return (
    <div onClick={onFechar}
      style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.75)", zIndex: 45, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div role="dialog" aria-modal="true" aria-label={"Como executar " + ex.nome} onClick={(e) => e.stopPropagation()}
        style={{ background: "var(--card)", borderTopLeftRadius: 20, borderTopRightRadius: 20, borderTop: "1px solid var(--borda2)", width: "100%", maxWidth: 520, maxHeight: "88vh", overflowY: "auto", padding: "8px 18px calc(24px + env(safe-area-inset-bottom))" }}>
        <div style={{ width: 42, height: 4, borderRadius: 2, background: "var(--borda2)", margin: "8px auto 14px" }} aria-hidden="true" />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ ...S.label, color: corGrupo(g) }}>{g.nome}{ex.equip ? " · " + ex.equip : ""}</div>
            <div style={{ fontSize: 20, fontWeight: 900, margin: "4px 0 0" }}>{ex.nome}</div>
          </div>
          <button onClick={onFechar} aria-label="Fechar"
            style={{ background: "none", border: "none", color: "var(--cinza)", fontSize: 24, fontWeight: 900, cursor: "pointer", lineHeight: 1, padding: 0 }}>×</button>
        </div>

        <div style={{ marginTop: 12 }}><ImagemExercicio ex={ex} /></div>

        {(p.length > 0 || s.length > 0) && (
          <div style={{ fontSize: 13, lineHeight: 1.6, margin: "10px 0 4px" }}>
            {p.length > 0 && <div><span style={{ color: corMuscTxt("p"), fontWeight: 800 }}>Direto: </span>{p.map((m) => MUSCULOS[m]).join(", ")}</div>}
            {s.length > 0 && <div><span style={{ color: corMuscTxt("s"), fontWeight: 800 }}>Indireto: </span>{s.map((m) => MUSCULOS[m]).join(", ")}</div>}
          </div>
        )}

        {ex.passos && ex.passos.length > 0 && (
          <React.Fragment>
            <div style={{ ...S.label, marginTop: 14 }}>Execução</div>
            <ol style={{ margin: "8px 0 12px", paddingLeft: 20, lineHeight: 1.6, fontSize: 15 }}>
              {ex.passos.map((pp, i) => <li key={i} style={{ marginBottom: 6 }}>{pp}</li>)}
            </ol>
          </React.Fragment>
        )}
        {ex.dica && (
          <div style={{ background: "var(--bg)", borderRadius: 10, padding: 12, fontSize: 14, lineHeight: 1.5 }}>
            <span style={{ color: "#E1306C", fontWeight: 800 }}>Dica: </span>{ex.dica}
          </div>
        )}
        <button style={{ ...S.btnGhost, marginTop: 14, borderColor: "#E1306C66", color: "#E1306C" }} onClick={() => abrirVideoDe(ex.nome)}>
          ▶ Ver demonstração em vídeo
        </button>
      </div>
    </div>
  );
}

// ---------------- NÍVEL DO ATLETA ----------------

// respondeu. A faixa existe porque voz sem retorno visual é um salto no

// ---------- ESCOLA DO JARVIS ----------
// Aprender comando de voz lendo uma lista não funciona: ninguém decora frase
// que nunca disse em voz alta. Aqui a pessoa fala de verdade e vê o que ele

// "90" na tela é claro; falado precisa virar "um minuto e meio".
// O que está entre parênteses no nome é detalhe de catálogo: ajuda a ler, atrapalha a ouvir.
// O que está entre parênteses, e o ângulo no nome do leg press, são detalhe de
// catálogo: ajudam a ler e atrapalham a ouvir. Quem dita "leg press" e escuta
// de volta "leg press quarenta e cinco graus" acha que ele entendeu errado.
const nomeFalado = (n) => String(n || "")
  .replace(/\s*\([^)]*\)/g, "")
  .replace(/\s*\d+\s*°/g, "")
  .trim() || String(n || "");

function tempoFalado(seg) {
  const s = Math.max(0, Math.round(seg || 0));
  const m = Math.floor(s / 60), r = s % 60;
  if (m && r === 30) return m + " " + plural(m, "minuto", "minutos") + " e meio";
  if (m && r) return m + " " + plural(m, "minuto", "minutos") + " e " + r + " segundos";
  if (m) return m + " " + plural(m, "minuto", "minutos");
  return r + " segundos";
}

function PainelJarvis({ disponivel, ligado, estado, parcial, ultima, descansando, naSessao, escondido, noToque, onAlternar, onAjuda }) {
  if (!disponivel) return null;
  const ouvindo = ligado && estado === "ouvindo";
  // Com o cronômetro de descanso na tela, o botão sobe para não cobrir o tempo
  const alturaBase = descansando && naSessao ? 190 : 76;
  return (
    <React.Fragment>
      {/* No modo toque a sessao acaba junto com o comando. Se a faixa dependesse
          de estar ouvindo, a resposta escrita sumiria no mesmo instante — e a
          pessoa nunca leria o que ele entendeu. */}
      {(ultima || (ligado && parcial)) && (
        <div className="jarvis-faixa" role="status" aria-live="polite"
          style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 45,
            background: "var(--bg2)", borderBottom: "2px solid " + (ultima && !ultima.ok ? "var(--obs)" : "#E1306C"),
            padding: "calc(10px + env(safe-area-inset-top)) 16px 11px", boxShadow: "0 6px 20px rgba(0,0,0,0.35)" }}>
          <div style={{ display: "flex", alignItems: "flex-start", gap: 10, maxWidth: 480, margin: "0 auto" }}>
            <span aria-hidden="true" style={{ fontSize: 17, lineHeight: 1.3 }}>{ultima && !ultima.ok ? "🤔" : "🎙"}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 12, color: "var(--cinza)", lineHeight: 1.4, fontStyle: "italic",
                overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {(ultima && ultima.ouvi) || parcial || "ouvindo..."}
              </div>
              {ultima && ultima.resposta && (
                <div style={{ fontSize: 14, fontWeight: 800, marginTop: 3, lineHeight: 1.4,
                  color: ultima.ok ? "var(--texto)" : "var(--obs)" }}>
                  {ultima.resposta}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Na escola o microfone já tem lugar na própria tela: um botão flutuante
          por cima do “Próxima lição” só atrapalharia quem está aprendendo. */}
      {!escondido && <div style={{ position: "fixed", right: 14, zIndex: 25,
        bottom: "calc(" + alturaBase + "px + env(safe-area-inset-bottom))",
        display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
        {/* O "?" nao pode depender de estar ouvindo: no modo toque a sessao acaba
            a cada comando, e a ajuda sumiria junto. */}
        {(
          <button onClick={onAjuda} aria-label="O que posso dizer ao Jarvis"
            style={{ width: 30, height: 30, borderRadius: 15, border: "1px solid var(--borda2)",
              background: "var(--card)", color: "var(--cinza)", fontSize: 14, fontWeight: 900, cursor: "pointer", lineHeight: 1 }}>
            ?
          </button>
        )}
        <div style={{ position: "relative", width: 58, height: 58 }}>
          {ouvindo && <span className="jarvis-onda" aria-hidden="true" />}
          {ouvindo && <span className="jarvis-onda atraso" aria-hidden="true" />}
          <button onClick={onAlternar} aria-pressed={ligado}
            aria-label={ligado ? (noToque ? "Parar de ouvir" : "Desligar o Jarvis (comandos por voz)") : (noToque ? "Tocar e falar com o Jarvis" : "Ligar o Jarvis (comandos por voz)")}
            title={ligado ? "Ouvindo — pode falar" : noToque ? "Toque e fale o comando" : "Ligar o Jarvis"}
            style={{ position: "relative", width: 58, height: 58, borderRadius: 29, cursor: "pointer",
              border: ligado ? "none" : "1px solid var(--borda2)",
              background: ligado ? GRAD : "var(--card)",
              color: ligado ? "#FFFFFF" : "var(--cinza)", fontSize: 24,
              boxShadow: "0 4px 16px rgba(0,0,0,0.45)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <span aria-hidden="true">{ligado ? "🎤" : "🎙"}</span>
          </button>
        </div>
        <span aria-hidden="true" style={{ fontSize: 9, fontWeight: 900, letterSpacing: 1,
          color: ligado ? "#E1306C" : "var(--cinza2)", textTransform: "uppercase", textAlign: "center", lineHeight: 1.3 }}>
          {noToque && !ligado ? "toque e fale" : "Jarvis"}
        </span>
      </div>}
    </React.Fragment>
  );
}

// Lista do que dá para falar. Aparece no "?" do painel e quando alguém pede ajuda.
// "Ele não responde" é um sintoma com cinco causas possíveis, e nenhuma delas
// aparece na tela. Isto mostra: se o microfone está vivo, o que ele ouviu
// palavra por palavra, e o que decidiu fazer com cada frase.
function ModalDiagnosticoJarvis({ aberto, ligado, estado, voz, noToque, onFechar }) {
  const [linhas, setLinhas] = useState([]);
  const [copiado, setCopiado] = useState(false);
  useEffect(() => {
    if (!aberto) return;
    const puxar = () => setLinhas(DIARIO_JARVIS.slice(0, 25));
    puxar();
    const iv = setInterval(puxar, 900);
    return () => clearInterval(iv);
  }, [aberto]);
  if (!aberto) return null;

  const vozAtual = VOZ_FALA ? escolherVozPtBr(voz.vozNome) : null;
  const resumo = [
    ["Versão do app", VERSAO_APP],
    ["Reconhecimento de voz", VOZ_OUVE ? "disponível" : "NÃO disponível neste navegador"],
    ["Como ele ouve", noToque ? "toque para falar" : "contínuo (mãos livres)"],
    ["Microfone", ligado ? (estado === "ouvindo" ? "ouvindo agora" : "religando") : noToque ? "pronto (toque e fale)" : "desligado"],
    ["Resposta falada", voz.falar ? (vozAtual ? "ligada (" + nomeCurtoVoz(vozAtual) + ")" : "ligada") : "desligada"],
    ["Frases ouvidas", String(DIARIO_JARVIS.length)],
  ];
  const texto = "TREINO LIVRE - diagnóstico do Jarvis\n" +
    resumo.map((x) => x[0] + ": " + x[1]).join("\n") + "\n\n" +
    (linhas.length ? linhas.map((l) => l.hora + "  \"" + l.ouvi + "\"\n          " + l.nota).join("\n")
      : "(nenhuma frase ouvida ainda)");

  return (
    <div onClick={onFechar}
      style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", zIndex: 56,
        display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div role="dialog" aria-modal="true" aria-label="Diagnóstico do Jarvis" onClick={(e) => e.stopPropagation()}
        style={{ ...S.card, width: "100%", maxWidth: 460, marginBottom: 0, borderRadius: "20px 20px 0 0",
          maxHeight: "88vh", overflowY: "auto", paddingBottom: "calc(18px + env(safe-area-inset-bottom))" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <div style={{ fontSize: 18, fontWeight: 900 }}>🩺 O que o Jarvis ouviu</div>
          <button onClick={onFechar} aria-label="Fechar"
            style={{ background: "none", border: "none", color: "var(--cinza)", fontSize: 24, fontWeight: 900, cursor: "pointer" }}>✕</button>
        </div>
        <div style={{ fontSize: 12.5, color: "var(--cinza)", lineHeight: 1.6, marginBottom: 14 }}>
          Fale com ele e volte aqui. Esta lista mostra cada frase que chegou ao microfone
          e o que ele decidiu fazer com ela.
        </div>

        <div style={{ border: "1px solid var(--borda2)", borderRadius: 12, padding: 12, marginBottom: 14 }}>
          {resumo.map((x) => (
            <div key={x[0]} style={{ display: "flex", justifyContent: "space-between", gap: 10, fontSize: 12.5, padding: "3px 0" }}>
              <span style={{ color: "var(--cinza)" }}>{x[0]}</span>
              <b style={{ textAlign: "right" }}>{x[1]}</b>
            </div>
          ))}
        </div>

        {linhas.length === 0 ? (
          <div style={{ fontSize: 13.5, lineHeight: 1.6, color: "var(--obs)", border: "1px solid var(--obs)", borderRadius: 12, padding: 12 }}>
            Nada chegou ao microfone ainda. Se você já falou e esta lista continua vazia,
            o problema é o microfone — não o entendimento. Confira a permissão no cadeado
            ao lado do endereço, e se outro aplicativo não está usando o microfone.
          </div>
        ) : (
          linhas.map((l, i) => (
            <div key={i} style={{ borderBottom: "1px solid var(--borda)", padding: "9px 0" }}>
              <div style={{ display: "flex", gap: 8, alignItems: "baseline" }}>
                <span style={{ fontSize: 10.5, color: "var(--cinza2)", fontVariantNumeric: "tabular-nums", flexShrink: 0 }}>{l.hora}</span>
                <span style={{ fontSize: 13.5, fontStyle: "italic", lineHeight: 1.4 }}>{l.ouvi ? "“" + l.ouvi + "”" : "—"}</span>
              </div>
              <div style={{ fontSize: 11.5, color: /ERRO|erro do/.test(l.nota) ? "var(--perigo)" : /ignorad|descartad/.test(l.nota) ? "var(--obs)" : "var(--ok)",
                fontWeight: 700, marginTop: 3, marginLeft: 44, lineHeight: 1.4 }}>
                {l.nota}
              </div>
            </div>
          ))
        )}

        <button style={{ ...S.btn, marginTop: 16 }}
          onClick={async () => {
            try { await navigator.clipboard.writeText(texto); setCopiado(true); setTimeout(() => setCopiado(false), 2500); }
            catch (e) {}
          }}>
          {copiado ? "✓ Copiado" : "📋 Copiar este diagnóstico"}
        </button>
        <div style={{ fontSize: 11, color: "var(--cinza2)", marginTop: 10, lineHeight: 1.5 }}>
          O diagnóstico fica só neste aparelho e some quando o app é fechado.
        </div>
      </div>
    </div>
  );
}

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginTop: 16 }}>
          <span style={{ fontSize: 14, fontWeight: 700 }}>Jarvis responde falando</span>
          <button onClick={onAlternarFala} aria-pressed={falaLigada}
            style={{ ...S.btnGhost, width: "auto", padding: "9px 14px" }}>
            {falaLigada ? "🔊 Sim" : "🔇 Só na tela"}
          </button>
        </div>
        {onDiagnostico && (
          <button style={{ ...S.btnGhost, marginTop: 10 }} onClick={onDiagnostico}>
            🩺 Ele não respondeu? Veja o que ele ouviu
          </button>
        )}
        <div style={{ fontSize: 11, color: "var(--cinza2)", lineHeight: 1.6, marginTop: 12 }}>
          <b>Fone com microfone ajuda muito:</b> o microfone fica perto da boca e longe da
          caixa de som da academia. Fale em tom normal, sem gritar — gritar distorce e
          atrapalha. Se o fone for Bluetooth, o som da música cai de qualidade enquanto o
          microfone está ligado; nesse caso vale usar o modo “Toque e fale”.
          <br /><br />
          O reconhecimento é o do próprio navegador: funciona melhor no Chrome do Android.
          Tudo o que ele entende vira texto nos mesmos campos de sempre — se errar, é só corrigir na mão.
        </div>
      </div>
    </div>
  );
}

// Escola do Jarvis: a pessoa fala de verdade e vê o que ele entendeu, sem
// nada ser gravado. Ler uma lista de comandos não ensina ninguém a falar com
// o app; errar de graça, sim.
function EscolaJarvis({ acoes, ouvindo, vozBarra, todos, onLigarVoz, onDesligarVoz, onFalar, onSair }) {
  const [i, setI] = useState(0);
  const [ouvido, setOuvido] = useState("");
  const [veredito, setVeredito] = useState(null);  // { ok, texto }
  const [digitado, setDigitado] = useState("");
  const [feitas, setFeitas] = useState({});
  const licao = LICOES_JARVIS[i];
  const ultima = i >= LICOES_JARVIS.length - 1;

  const avaliar = (bruto, corpo, comNome) => {
    setOuvido(bruto);
    const c = interpretarVoz(corpo, {});
    if (!c) {
      setVeredito({ ok: false, texto: "Não reconheci nenhum comando nessa frase. Fale um pouco mais devagar." });
      return;
    }
    const ex = c.frase ? acharExercicio(c.frase, todos, []) : null;
    const ctx = { comNome: comNome, barra: parseFloat(vozBarra) || 0, ex: ex };
    if (licao.confere(c, ctx)) {
      const resumo = licao.resumo ? licao.resumo(c, ctx) : (ROTULO_TIPO[c.tipo] || c.tipo);
      setVeredito({ ok: true, texto: "Entendi: " + resumo });
      setFeitas((f) => Object.assign({}, f, { [licao.id]: true }));
      if (onFalar) onFalar("Isso! Entendi: " + resumo);
      return;
    }
    const aviso = licao.errado && licao.errado(c, ctx);
    setVeredito({ ok: false, texto: aviso || ("Entendi como “" + (ROTULO_TIPO[c.tipo] || c.tipo) + "”. Não é o comando desta lição — tente de novo.") });
  };

  // O raiz entrega as frases ouvidas aqui, do mesmo jeito que entrega na sessão
  if (acoes) acoes.current = { receber: avaliar };
  useEffect(() => () => { if (acoes) acoes.current = {}; }, [acoes]);

  const irPara = (n) => { setI(n); setOuvido(""); setVeredito(null); setDigitado(""); };
  const testarDigitado = () => {
    const t = digitado.trim();
    if (!t) return;
    const norm = normalizarFala(t);
    const depois = depoisDeJarvis(norm);
    avaliar(t, depois === null ? norm : depois, depois !== null);
  };
  const quantas = Object.keys(feitas).length;

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onSair}>← Sair da escola</button>

      <div style={{ ...S.card, borderColor: "#E1306C44" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <div>
            <div style={S.label}>Escola do Jarvis</div>
            <div style={{ fontWeight: 900, fontSize: 18, marginTop: 2 }}>Lição {i + 1} de {LICOES_JARVIS.length}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 22, fontWeight: 900, color: "#E1306C" }}>{quantas}/{LICOES_JARVIS.length}</div>
            <div style={{ fontSize: 11, color: "var(--cinza)" }}>acertos</div>
          </div>
        </div>
        <div style={{ height: 6, background: "var(--borda)", borderRadius: 3, marginTop: 12, overflow: "hidden" }}
          role="progressbar" aria-valuenow={quantas} aria-valuemin={0} aria-valuemax={LICOES_JARVIS.length}
          aria-label="Comandos aprendidos">
          <div style={{ height: "100%", width: (quantas / LICOES_JARVIS.length) * 100 + "%", background: GRAD_LINHA, borderRadius: 3, transition: "width .35s ease" }} />
        </div>
        <div style={{ fontSize: 12, color: "var(--cinza)", lineHeight: 1.6, marginTop: 12 }}>
          Aqui nada é anotado e nenhum treino é alterado. É só para você ouvir como ele entende.
        </div>
        {ouvindo && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginTop: 12 }}>
            <span style={{ fontSize: 13, fontWeight: 800, color: "var(--ok)" }}>🎤 Ouvindo — pode falar</span>
            <button onClick={onDesligarVoz}
              style={{ background: "none", border: "none", color: "var(--cinza)", fontWeight: 800, fontSize: 12, cursor: "pointer", padding: 0 }}>
              desligar
            </button>
          </div>
        )}
      </div>

      {!ouvindo && (
        <div style={{ ...S.card, borderColor: "var(--obs)" }}>
          <div style={{ fontSize: 14, lineHeight: 1.6, marginBottom: 12 }}>
            O microfone está desligado. Ligue para praticar falando — ou use o campo de texto
            no fim da lição, que funciona igual.
          </div>
          <button style={S.btn} onClick={onLigarVoz}>🎤 Ligar o Jarvis</button>
        </div>
      )}

      <div style={S.card}>
        <div style={S.label}>{licao.titulo}</div>
        <div style={{ fontSize: 13, color: "var(--cinza)", lineHeight: 1.6, margin: "8px 0 16px" }}>{licao.porque}</div>

        <div style={{ ...S.label, marginBottom: 8 }}>Diga em voz alta</div>
        <div style={{ border: "2px solid #E1306C", background: "#E1306C15", borderRadius: 16, padding: "18px 16px", marginBottom: 10 }}>
          <div style={{ fontSize: 21, fontWeight: 900, color: "#E1306C", lineHeight: 1.35 }}>“{licao.diga}”</div>
          {licao.dica && <div style={{ fontSize: 12, color: "var(--obs)", fontWeight: 800, marginTop: 8 }}>{licao.dica}</div>}
        </div>
        <button style={{ ...S.btnGhost, marginBottom: 16 }} onClick={() => onFalar && onFalar(licao.diga)}>
          🔊 Ouvir como se diz
        </button>

        {ouvido && (
          <div style={{ marginBottom: 12 }}>
            <div style={S.label}>Ele ouviu</div>
            <div style={{ fontSize: 15, fontStyle: "italic", color: "var(--texto)", marginTop: 4, lineHeight: 1.5 }}>“{ouvido}”</div>
          </div>
        )}

        {veredito && (
          <div role="status" style={{
            border: "1px solid " + (veredito.ok ? "var(--ok)" : "var(--obs)"),
            background: veredito.ok ? "var(--ok-bg)" : "#C7A94B18",
            borderRadius: 14, padding: "14px 14px", marginBottom: 14,
          }}>
            <div style={{ fontSize: 15, fontWeight: 800, color: veredito.ok ? "var(--ok)" : "var(--obs)", lineHeight: 1.5 }}>
              {veredito.ok ? "✓ " : "🤔 "}{veredito.texto}
            </div>
          </div>
        )}

        {veredito && veredito.ok && !ultima && (
          <button style={{ ...S.btn, marginBottom: 10 }} onClick={() => irPara(i + 1)}>Próxima lição →</button>
        )}
        {veredito && veredito.ok && ultima && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 16, fontWeight: 900, marginBottom: 8 }}>🎓 Você passou por todos os comandos.</div>
            <div style={{ fontSize: 13, color: "var(--cinza)", lineHeight: 1.6, marginBottom: 12 }}>
              No treino, se esquecer algum, é só perguntar: <b>“Jarvis, quais são os principais comandos?”</b>
            </div>
            <button style={S.btn} onClick={onSair}>Voltar e treinar de verdade</button>
          </div>
        )}

        <div style={{ display: "flex", gap: 10 }}>
          <button style={{ ...S.btnGhost, flex: 1 }} disabled={i === 0}
            onClick={() => irPara(Math.max(0, i - 1))}>← Anterior</button>
          <button style={{ ...S.btnGhost, flex: 1 }} disabled={ultima}
            onClick={() => irPara(Math.min(LICOES_JARVIS.length - 1, i + 1))}>Pular →</button>
        </div>
      </div>

      {/* Sem microfone (iPhone, navegador antigo) ainda dá para aprender a forma da frase */}
      <div style={S.card}>
        <div style={S.label}>Ou escreva para testar</div>
        <div style={{ fontSize: 12, color: "var(--cinza)", lineHeight: 1.5, margin: "6px 0 10px" }}>
          Passa pelo mesmo interpretador da voz. Serve para conferir se uma frase sua seria entendida.
        </div>
        <input style={{ ...S.input, marginBottom: 10 }} value={digitado}
          placeholder={licao.diga}
          aria-label="Frase para testar"
          onChange={(e) => setDigitado(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") testarDigitado(); }} />
        <button style={S.btnGhost} onClick={testarDigitado}>Testar a frase</button>
      </div>

      <div style={{ ...S.card, borderStyle: "dashed" }}>
        <div style={S.label}>Todas as lições</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginTop: 10 }}>
          {LICOES_JARVIS.map((l, n) => (
            <button key={l.id} onClick={() => irPara(n)} aria-pressed={n === i}
              style={{ border: "1px solid " + (n === i ? "#E1306C" : feitas[l.id] ? "var(--ok)" : "var(--borda2)"),
                background: n === i ? "#E1306C22" : "transparent",
                color: n === i ? "#E1306C" : feitas[l.id] ? "var(--ok)" : "var(--cinza)",
                borderRadius: 20, padding: "7px 12px", fontWeight: 800, fontSize: 12, cursor: "pointer" }}>
              {feitas[l.id] ? "✓ " : ""}{l.titulo}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// A tela do scanner. Fica POR CIMA da tela de treino, e não numa aba própria:
// assim ela usa o mesmo caminho de registrar série que o botão ✓ e a voz usam —
// descanso, recorde e festa saem de graça, sem nenhuma lógica duplicada.
function ScannerEyes({ aberto, ex, repsAlvo, pesoAtual, pesoCorporal, serieNum, serieTotal, som, bpm,
  vozCfg, contarAlto, onAlternarContagem, onRegistrar, onFechar }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const fluxoRef = useRef(null);
  const contadorRef = useRef(null);
  const lacoRef = useRef(0);
  const [fase, setFase] = useState("carregando");   // carregando | pronto | erro
  const [erro, setErro] = useState("");
  const [reps, setReps] = useState(0);
  const [peso, setPeso] = useState(pesoAtual || "");
  const [vendo, setVendo] = useState(false);
  const [sinal, setSinal] = useState("");
  const [frente, setFrente] = useState(false);
  const inicioRef = useRef(0);
  const [segundos, setSegundos] = useState(0);
  // Em ref, e não em closure: o laço de contagem é montado uma vez, e ligar ou
  // desligar a voz no meio da série precisa valer na repetição seguinte.
  const contarAltoRef = useRef(contarAlto);
  contarAltoRef.current = contarAlto;
  const vozRef2 = useRef(vozCfg);
  vozRef2.current = vozCfg;
  const tecnicoRef = useRef(null);
  const [dica, setDica] = useState(null);     // { texto, tipo, em }
  const alvoRef = useRef(0);
  alvoRef.current = parseInt(repsAlvo) || 0;

  useEffect(() => { setPeso(pesoAtual || ""); }, [pesoAtual, aberto]);

  // ---- liga e desliga a câmera junto com a tela ----
  useEffect(() => {
    if (!aberto) return;
    let vivo = true;
    setFase("carregando");
    setErro("");
    setReps(0);
    inicioRef.current = Date.now();
    tecnicoRef.current = criarTecnico();
    setDica(null);
    contadorRef.current = criarContador({
      preferidos: (ex && EYES_PREFERENCIA[ex.grupo]) || [],
      aoContar: (n, q) => {
        // O bipe é o retorno que chega sem olhar: a pessoa está de costas para
        // o celular na maior parte dos exercícios.
        if (som) beep(1200, 0.05, 0.12);
        try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) {}

        // O comentário aparece na tela mesmo com o som desligado: quem treina
        // sem fone também merece saber que a amplitude está caindo.
        const alvoN = alvoRef.current;
        const frase = tecnicoRef.current ? tecnicoRef.current.comentar(n, q, alvoN) : null;
        if (frase) setDica({ texto: frase, tipo: q && (q.caindo || q.rapida) ? "corrige" : "elogia", em: Date.now() });

        if (!contarAltoRef.current) return;
        // Número seco e rápido, como um parceiro contando. A última ganha a
        // palavra que encerra a série, porque é a informação que muda o que fazer.
        const cfg = vozRef2.current || {};
        const fim = alvoN > 0 && n >= alvoN;
        const voz = {
          falar: true,
          vozNome: cfg.vozNome,
          velocidade: Math.min(1.6, (cfg.velocidade || 1.1) + 0.25),
          animado: cfg.animado,
        };
        jarvisFalar(fim ? n + ". Completou." : String(n), voz);
        // Em fila: entra depois do número em vez de cortá-lo. E num tom um
        // pouco mais calmo, porque é frase e não contagem.
        if (frase) {
          jarvisFalar(frase, {
            falar: true,
            vozNome: cfg.vozNome,
            velocidade: cfg.velocidade || 1.1,
            animado: cfg.animado,
            fila: true,
          });
        }
      },
    });

    (async () => {
      let detector;
      try {
        detector = await carregarEyes();
      } catch (e) {
        if (!vivo) return;
        setFase("erro");
        setErro("Não consegui baixar o reconhecimento de movimento. Ele tem uns 8 MB e precisa de internet só na primeira vez.");
        return;
      }
      if (!vivo) return;
      let fluxo;
      try {
        fluxo = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: frente ? "user" : { ideal: "environment" }, width: { ideal: 960 } },
          audio: false,
        });
      } catch (e) {
        if (!vivo) return;
        setFase("erro");
        setErro("Preciso da câmera para contar as repetições. Toque no cadeado ao lado do endereço e libere a câmera para este site.");
        return;
      }
      if (!vivo) { fluxo.getTracks().forEach((t) => t.stop()); return; }
      fluxoRef.current = fluxo;
      const v = videoRef.current;
      if (!v) return;
      v.srcObject = fluxo;
      try { await v.play(); } catch (e) {}
      setFase("pronto");
      ligarTravaTela();

      // ---- o laço: detecta, desenha, conta ----
      let ultimo = 0;
      const quadro = () => {
        if (!vivo) return;
        lacoRef.current = requestAnimationFrame(quadro);
        const agora = performance.now();
        // 24 quadros por segundo bastam para contar e poupam bateria
        if (agora - ultimo < 41) return;
        ultimo = agora;
        const vid = videoRef.current, cv = canvasRef.current;
        if (!vid || !cv || vid.readyState < 2) return;
        let res;
        try { res = detector.detectForVideo(vid, agora); } catch (e) { return; }
        const lm = res && res.landmarks && res.landmarks[0];
        const ctx = cv.getContext("2d");
        if (cv.width !== vid.videoWidth) { cv.width = vid.videoWidth; cv.height = vid.videoHeight; }
        ctx.clearRect(0, 0, cv.width, cv.height);
        if (!lm) { setVendo(false); return; }
        setVendo(true);

        // esqueleto
        ctx.lineWidth = Math.max(3, cv.width / 160);
        ctx.strokeStyle = "#7CFF3C";
        ctx.fillStyle = "#7CFF3C";
        EYES_OSSOS.forEach((o) => {
          const a = lm[o[0]], b = lm[o[1]];
          if (!visivel(a) || !visivel(b)) return;
          ctx.beginPath();
          ctx.moveTo(a.x * cv.width, a.y * cv.height);
          ctx.lineTo(b.x * cv.width, b.y * cv.height);
          ctx.stroke();
        });
        const r = Math.max(4, cv.width / 110);
        EYES_PONTOS.forEach((i) => {
          const p = lm[i];
          if (!visivel(p)) return;
          ctx.beginPath();
          ctx.arc(p.x * cv.width, p.y * cv.height, r, 0, Math.PI * 2);
          ctx.fill();
        });

        const info = contadorRef.current.processar(lm, agora);
        if (info.contou) setReps(info.total);
        if (info.sinal) setSinal(info.sinal);
      };
      lacoRef.current = requestAnimationFrame(quadro);
    })();

    return () => {
      vivo = false;
      cancelAnimationFrame(lacoRef.current);
      if (fluxoRef.current) {
        // Sem isto a luz da câmera fica acesa depois de fechar a tela — e com
        // razão a pessoa desinstala o app.
        fluxoRef.current.getTracks().forEach((t) => t.stop());
        fluxoRef.current = null;
      }
      desligarTravaTela();
    };
  }, [aberto, frente, ex, som]);

  // A dica fica cinco segundos e sai: é um aviso, não um letreiro.
  useEffect(() => {
    if (!dica) return;
    const t = setTimeout(() => setDica(null), 5000);
    return () => clearTimeout(t);
  }, [dica]);

  // cronômetro da série, para as calorias
  useEffect(() => {
    if (!aberto || fase !== "pronto") return;
    const iv = setInterval(() => setSegundos(Math.round((Date.now() - inicioRef.current) / 1000)), 1000);
    return () => clearInterval(iv);
  }, [aberto, fase]);

  if (!aberto) return null;

  const alvo = parseInt(repsAlvo) || 0;
  const completou = alvo > 0 && reps >= alvo;
  const ajustar = (d) => {
    const n = Math.max(0, reps + d);
    setReps(n);
    setDica(null);
    if (contadorRef.current) contadorRef.current.ajustar(n);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "#000000", zIndex: 60, display: "flex", flexDirection: "column" }}>
      {/* a imagem */}
      <div style={{ position: "relative", flex: 1, overflow: "hidden", background: "#000000" }}>
        <video ref={videoRef} playsInline muted
          style={{ width: "100%", height: "100%", objectFit: "cover", transform: frente ? "scaleX(-1)" : "none" }} />
        <canvas ref={canvasRef}
          style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover",
            transform: frente ? "scaleX(-1)" : "none", pointerEvents: "none" }} />

        {/* calorias e tempo, como no canto do aparelho */}
        <div style={{ position: "absolute", top: "calc(10px + env(safe-area-inset-top))", left: 12,
          background: "rgba(0,0,0,0.55)", borderRadius: 12, padding: "8px 12px" }}>
          <div style={{ fontSize: 20, fontWeight: 900, color: "#FFFFFF", lineHeight: 1.1 }}>
            {caloriasEstimadas(segundos, pesoCorporal)} <span style={{ fontSize: 12, color: "#FF6B6B" }}>kcal</span>
          </div>
          <div style={{ fontSize: 11, color: "rgba(255,255,255,0.75)" }}>{Math.floor(segundos / 60)}:{(segundos % 60) < 10 ? "0" : ""}{segundos % 60}</div>
          {bpm && (
            <div style={{ fontSize: 19, fontWeight: 900, color: "#FFFFFF", marginTop: 4 }}>
              {bpm} <span style={{ fontSize: 13, color: "#ED4956" }}>❤</span>
            </div>
          )}
        </div>

        <button onClick={onFechar} aria-label="Fechar o scanner"
          style={{ position: "absolute", top: "calc(10px + env(safe-area-inset-top))", right: 12,
            width: 42, height: 42, borderRadius: 21, border: "none", background: "rgba(0,0,0,0.55)",
            color: "#FFFFFF", fontSize: 20, fontWeight: 900, cursor: "pointer" }}>✕</button>

        <button onClick={() => setFrente((f) => !f)} aria-label="Virar a câmera"
          style={{ position: "absolute", top: "calc(60px + env(safe-area-inset-top))", right: 12,
            width: 42, height: 42, borderRadius: 21, border: "none", background: "rgba(0,0,0,0.55)",
            color: "#FFFFFF", fontSize: 17, cursor: "pointer" }}>⟲</button>

        {/* Contar alto é o retorno que serve de costas para a tela — mas em
            academia cheia nem sempre é bem-vindo. Por isso o botão fica aqui,
            à mão, e não escondido nos ajustes. */}
        <button onClick={onAlternarContagem}
          aria-pressed={!!contarAlto}
          aria-label={contarAlto ? "Desligar a contagem em voz alta" : "Ligar a contagem em voz alta"}
          style={{ position: "absolute", top: "calc(110px + env(safe-area-inset-top))", right: 12,
            minWidth: 42, height: 42, borderRadius: 21, border: "none",
            background: contarAlto ? "rgba(124,255,60,0.85)" : "rgba(0,0,0,0.55)",
            color: contarAlto ? "#0A2A00" : "#FFFFFF", fontSize: 15, fontWeight: 900,
            padding: "0 12px", cursor: "pointer" }}>
          {contarAlto ? "🔊 1,2,3" : "🔇"}
        </button>

        {/* o contador grande, que é o que a pessoa olha de longe */}
        {fase === "pronto" && (
          <div style={{ position: "absolute", right: 14, bottom: 14, textAlign: "center",
            background: completou ? "rgba(47,212,138,0.9)" : "rgba(0,0,0,0.6)",
            borderRadius: 60, width: 118, height: 118, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center", border: "3px solid " + (completou ? "#2FD48A" : "rgba(255,255,255,0.35)") }}>
            <div style={{ fontSize: 44, fontWeight: 900, color: "#FFFFFF", lineHeight: 1 }}>{reps}</div>
            {alvo > 0 && <div style={{ fontSize: 15, fontWeight: 800, color: "rgba(255,255,255,0.8)" }}>de {alvo}</div>}
          </div>
        )}

        {/* avisos de estado, sempre em linguagem de quem está treinando */}
        {fase === "carregando" && (

// ---------------- META DA SEMANA ----------------
function MetaSemanal({ historico, meta, setMeta }) {
  const feitos = volumeSemanal(historico, 1)[0].treinos;
  const pct = meta > 0 ? Math.min(100, (feitos / meta) * 100) : 0;
  const R = 34, C = 2 * Math.PI * R;
  const bateu = feitos >= meta;
  return (
    <div style={{ ...S.card, display: "flex", alignItems: "center", gap: 16 }}>
      <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true" style={{ flexShrink: 0 }}>
        <circle cx="42" cy="42" r={R} fill="none" stroke="var(--borda)" strokeWidth="9" />
        <circle cx="42" cy="42" r={R} fill="none" stroke={bateu ? "var(--ok)" : "#E1306C"} strokeWidth="9"
          strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C - (C * pct) / 100}
          transform="rotate(-90 42 42)" style={{ transition: "stroke-dashoffset .6s ease" }} />
        <text x="42" y="47" textAnchor="middle" fontSize="20" fontWeight="900" fill="var(--texto)">{feitos}</text>
      </svg>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={S.label}>Meta da semana</div>
        <div style={{ fontSize: 15, fontWeight: 800, margin: "4px 0 2px" }}>
          {bateu ? "Meta batida! 🎉" : feitos + " de " + meta + " " + plural(meta, "treino", "treinos")}
        </div>
        <div style={{ fontSize: 12, color: "var(--cinza)" }}>
          {bateu
            ? "Tudo que vier agora é lucro."
            : "Faltam " + (meta - feitos) + " " + plural(meta - feitos, "treino", "treinos") + " até domingo."}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10 }}>
          <button onClick={() => setMeta(Math.max(1, meta - 1))} aria-label="Diminuir a meta semanal"
            style={{ width: 32, height: 32, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 17, cursor: "pointer" }}>−</button>
          <span style={{ fontSize: 12, color: "var(--cinza)" }}>meta: <b style={{ color: "var(--texto)" }}>{meta}x</b> por semana</span>
          <button onClick={() => setMeta(Math.min(14, meta + 1))} aria-label="Aumentar a meta semanal"
            style={{ width: 32, height: 32, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 17, cursor: "pointer" }}>+</button>
        </div>
      </div>
    </div>
  );
}

// ---------------- LEMBRETE DE TREINO ----------------
function CartaoLembrete({ lembrete, setLembrete, avisar }) {
  const suportaNotificacao = typeof Notification !== "undefined";
  const [permissao, setPermissao] = useState(suportaNotificacao ? Notification.permission : "unsupported");

  const ligar = async () => {
    if (!suportaNotificacao) {
      avisar("Este navegador não permite avisos. O lembrete vai aparecer dentro do app quando você abrir.");
      setLembrete({ ...lembrete, ativo: true });
      return;
    }
    let p = Notification.permission;
    if (p === "default") p = await Notification.requestPermission();
    setPermissao(p);
    if (p !== "granted") {
      avisar("Você não autorizou os avisos. Para receber lembretes, libere as notificações do Treino Livre nas configurações do navegador.");
      return;
    }
    setLembrete({ ...lembrete, ativo: true });
    registrarEvento("lembrete-ativado");
  };

  const alternarDia = (n) => {
    const dias = lembrete.dias.includes(n) ? lembrete.dias.filter((d) => d !== n) : [...lembrete.dias, n].sort();
    setLembrete({ ...lembrete, dias });
  };

  return (
    <div style={S.card}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <div style={{ minWidth: 0 }}>
          <div style={S.label}>🔔 Lembrete de treino</div>

            {lembrete.ativo ? "Ligado para " + lembrete.hora : "Um empurrão nos dias que você escolher."}
          </div>
        </div>
        <button onClick={() => (lembrete.ativo ? setLembrete({ ...lembrete, ativo: false }) : ligar())}
          aria-pressed={lembrete.ativo} aria-label={lembrete.ativo ? "Desligar o lembrete" : "Ligar o lembrete"}
          style={{
            width: 54, height: 30, borderRadius: 15, flexShrink: 0, cursor: "pointer", position: "relative",
            border: "1px solid " + (lembrete.ativo ? "#E1306C" : "var(--borda2)"),
            background: lembrete.ativo ? GRAD : "var(--input)", transition: "background .2s",
          }}>
          <span aria-hidden="true" style={{
            position: "absolute", top: 3, left: lembrete.ativo ? 27 : 3, width: 22, height: 22,
            borderRadius: "50%", background: "#FFFFFF", transition: "left .2s", boxShadow: "0 1px 3px rgba(0,0,0,.3)",
          }} />
        </button>
      </div>

      {lembrete.ativo && (
        <React.Fragment>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 14 }}>
            <span style={{ fontSize: 13, color: "var(--cinza)" }}>Horário</span>

              onChange={(e) => setLembrete({ ...lembrete, hora: e.target.value || "18:00" })}
              style={{ ...S.input, width: "auto", flex: "0 0 auto", padding: "9px 12px", fontWeight: 800 }} />
          </div>
          <div style={{ ...S.label, fontSize: 10, margin: "14px 0 8px" }}>Dias</div>
          <div style={{ display: "flex", gap: 6 }}>
            {DIAS_SEMANA.map((d) => {
              const on = lembrete.dias.includes(d.n);
              return (
                <button key={d.n} onClick={() => alternarDia(d.n)} aria-pressed={on}

                  style={{

// ---------------- SÉRIES DA SEMANA POR GRUPO ----------------
// O app já sabia quantas séries de cada grupo você fez. Faltava dizer se isso
// é pouco ou suficiente — é o que transforma o dado em orientação.
const FAIXA_SERIES = { min: 10, max: 20 };
function seriesSemanaisPorGrupo(historico, exPorId) {
  const inicio = segundaDaSemana(new Date()).getTime();
  const acc = {};
  historico.forEach((h) => {
    if (new Date(h.data).getTime() < inicio) return;
    (h.itens || []).forEach((it) => {
      const e = exPorId(it.exercicioId);
      if (!e) return;
      // aquecimento não conta como série de trabalho
      const n = (it.series || []).filter(serieConta).length;
      acc[e.grupo] = (acc[e.grupo] || 0) + n;
    });
  });
  return GRUPOS.map((g) => ({ id: g.id, nome: g.nome, series: acc[g.id] || 0 }))
    .sort((a, b) => b.series - a.series);
}

function VolumeRecomendado({ historico, exPorId }) {
  const lista = seriesSemanaisPorGrupo(historico, exPorId);
  const teto = Math.max(FAIXA_SERIES.max + 4, ...lista.map((x) => x.series));
  const situacao = (n) => {
    if (n === 0) return { txt: "não treinou", cor: "var(--cinza2)" };
    if (n < FAIXA_SERIES.min) return { txt: "abaixo da faixa", cor: "var(--obs)" };
    if (n <= FAIXA_SERIES.max) return { txt: "na faixa", cor: "var(--ok)" };
    return { txt: "acima da faixa", cor: "var(--perigo)" };
  };
  return (
    <div style={S.card}>
      <div style={S.label}>Séries desta semana por grupo</div>
      <div style={{ fontSize: 12, color: "var(--cinza)", margin: "6px 0 14px", lineHeight: 1.5 }}>
        A faixa de <b>{FAIXA_SERIES.min} a {FAIXA_SERIES.max} séries por semana</b> é a referência mais citada
        para ganho de massa. É um guia, não uma regra: o que importa é a tendência ao longo das semanas.
      </div>
      {lista.map((g) => {
        const s = situacao(g.series);
        const cor = corGrupo(GRUPOS.find((x) => x.id === g.id));
        return (
          <div key={g.id} style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 5 }}>
              <span style={{ fontWeight: 700 }}>{g.nome}</span>
              <span style={{ color: s.cor, fontWeight: 700 }}>{g.series} {plural(g.series, "série", "séries")} · {s.txt}</span>
            </div>
            {/* a faixa recomendada aparece como uma zona clara atrás da barra */}
            <div style={{ position: "relative", height: 10, borderRadius: 5, background: "var(--borda)", overflow: "hidden" }}>
              <div aria-hidden="true" style={{
                position: "absolute", top: 0, bottom: 0,
                left: (FAIXA_SERIES.min / teto) * 100 + "%",
                width: ((FAIXA_SERIES.max - FAIXA_SERIES.min) / teto) * 100 + "%",
                background: "var(--ok)", opacity: 0.22,
              }} />
              <div style={{ position: "relative", height: "100%", width: Math.min(100, (g.series / teto) * 100) + "%", background: cor, borderRadius: 5 }} />
            </div>
          </div>
        );
      })}
      <div style={{ fontSize: 11, color: "var(--cinza2)", marginTop: 4, lineHeight: 1.5 }}>
        A zona verde clara marca a faixa recomendada. Séries de aquecimento não entram na conta.
      </div>
    </div>
  );
}

        <circle cx="27" cy="27" r={R} fill="none" stroke={bateu ? "var(--ok)" : "#E1306C"} strokeWidth="6"

          transform="rotate(-90 27 27)" />
        <text x="27" y="32" textAnchor="middle" fontSize="16" fontWeight="900" fill="var(--texto)">{feitos}</text>
      </svg>
    </button>
  );
}

// ---------------- AJUSTES ----------------
// Tudo que é configuração saiu da tela inicial e veio para cá, atrás da engrenagem.
// Escolher a voz importa mais do que parece: a voz padrão do Android lê
// "80 quilos por 10" de um jeito robótico, e a natural soa como alguém falando
// com você. Tocar num nome já faz a voz se apresentar — ninguém escolhe no escuro.
function SeletorVoz({ voz, setVoz }) {
  const [vozes, setVozes] = useState(() => vozesPtBr());
  useEffect(() => {
    if (!VOZ_FALA) return;
    const atualizar = () => setVozes(vozesPtBr().slice());
    atualizar();
    // A lista chega vazia na primeira chamada e o evento nem sempre dispara
    const t1 = setTimeout(atualizar, 300);
    const t2 = setTimeout(atualizar, 1200);
    try { window.speechSynthesis.addEventListener("voiceschanged", atualizar); } catch (e) {}
    return () => {
      clearTimeout(t1); clearTimeout(t2);
      try { window.speechSynthesis.removeEventListener("voiceschanged", atualizar); } catch (e) {}
    };
  }, []);

  const provar = (cfg) => jarvisFalar(cfg.animado !== false
    ? "Boa! Anotei supino reto, 80 quilos por 10. Descanso de um minuto e meio."
    : "Anotei: supino reto, 80 quilos por 10. Descanso de um minuto e meio.", cfg);
  const escolher = (nome) => {
    const nova = { ...voz, vozNome: nome };
    setVoz(nova);
    provar(nova);
  };
  const VELOCIDADES = [[0.9, "Devagar"], [1.1, "Normal"], [1.3, "Rápido"]];

  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ ...S.label, marginBottom: 8 }}>Voz do Jarvis</div>
      {vozes.length === 0 ? (
        <div style={{ fontSize: 12, color: "var(--cinza2)", lineHeight: 1.5 }}>
          Este aparelho só tem a voz padrão do sistema. No Android, dá para instalar outras
          em Configurações › Idioma › Saída de texto para voz.
        </div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
          {[{ name: null, rotulo: "Padrão" }].concat(vozes.map((v) => ({ name: v.name, rotulo: nomeCurtoVoz(v) })))
            .map((o) => {
              const on = (voz.vozNome || null) === o.name;
              return (
                <button key={o.name || "padrao"} onClick={() => escolher(o.name)} aria-pressed={on}
                  aria-label={"Usar a voz " + o.rotulo + " e ouvir uma amostra"}
                  style={{ border: "1px solid " + (on ? "#E1306C" : "var(--borda2)"),
                    background: on ? "#E1306C22" : "transparent",
                    color: on ? "#E1306C" : "var(--texto)",
                    borderRadius: 20, padding: "8px 13px", fontWeight: 800, fontSize: 12.5, cursor: "pointer" }}>
                  {on ? "🔊 " : ""}{o.rotulo}
                </button>
              );
            })}
        </div>
      )}
      <div style={{ fontSize: 11, color: "var(--cinza2)", marginTop: 8, lineHeight: 1.5 }}>
        Toque num nome para ouvir como ele confirma uma série.
      </div>

      <div style={{ ...S.label, margin: "14px 0 8px" }}>Velocidade da fala</div>
      <div style={{ display: "flex", gap: 7 }}>
        {VELOCIDADES.map((vv) => {
          const on = Math.abs((voz.velocidade || 1.1) - vv[0]) < 0.05;
          return (
            <button key={vv[0]} aria-pressed={on}
              onClick={() => { const nova = { ...voz, velocidade: vv[0] }; setVoz(nova); provar(nova); }}
              style={{ flex: 1, border: "1px solid " + (on ? "#E1306C" : "var(--borda2)"),
                background: on ? "#E1306C22" : "transparent",
                color: on ? "#E1306C" : "var(--texto)",
                borderRadius: 12, padding: "10px 8px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
              {vv[1]}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// Fica no fim do detalhe, depois de a pessoa ter visto o exercício: é ali que
// ela percebe "a máquina da minha academia é quase isto, mas não é".
function BotaoVariacao({ ex, onVariacao }) {
  if (!onVariacao) return null;
  return (
    <div style={{ ...S.card, borderStyle: "dashed" }}>
      <div style={S.label}>A sua academia tem uma parecida?</div>
      <div style={{ fontSize: 13, color: "var(--cinza)", lineHeight: 1.6, margin: "8px 0 12px" }}>
        Crie uma variação com a <b>foto da máquina daí</b>. Grupo, músculos e passos
        já vêm copiados — você só ajusta o nome e fotografa.
      </div>
      <button style={S.btnGhost} onClick={() => onVariacao(ex)}>
        ➕ Criar variação deste exercício
      </button>
    </div>
  );
}

              {s.length > 0 && (

function TelaExercicios({ todos, exPorId, grupoAberto, setGrupoAberto, exercicioAberto, setExercicioAberto, onNovoExercicio, onExcluirCustom, onVariacao, onTrocarFoto }) {
  const [busca, setBusca] = useState("");
  const [equip, setEquip] = useState(null);   // família de equipamento escolhida

  // Se o exercício aberto sumiu (custom excluído), cai de volta na lista em vez
  // de alterar estado durante o render.
  const exAberto = exercicioAberto ? exPorId(exercicioAberto) : null;
  if (exAberto) {
    return <DetalheExercicio ex={exAberto} onVoltar={() => setExercicioAberto(null)}
      onVariacao={onVariacao} onTrocarFoto={onTrocarFoto} />;
  }

  const fam = equip ? FAMILIAS_EQUIP.find((f) => f.id === equip) : null;
  const porEquip = (lista) => (fam ? lista.filter((e) => naFamilia(e, fam)) : lista);
  // A busca olha nome E equipamento: "halteres" e "polia" passam a achar coisa.
  const alvo = semAcento(busca.trim());
  const buscando = alvo.length > 0;
  const resultados = buscando
    ? porEquip(todos.filter((e) => semAcento(e.nome).includes(alvo) || semAcento(e.equip).includes(alvo)))
    : [];

  if (grupoAberto && !buscando) {
    const g = grupoPorId(grupoAberto);
    const lista = porEquip(todos.filter((e) => e.grupo === grupoAberto));
    return (
      <div style={{ padding: "0 18px" }}>
        <button style={S.voltar} onClick={() => setGrupoAberto(null)}>← Grupos</button>
        <div style={{ fontSize: 24, fontWeight: 900, textTransform: "uppercase", marginBottom: 12, color: corGrupo(g) }}>{g.nome}</div>
        {lista.map((ex) => (
          <CardExercicio key={ex.id} ex={ex} onAbrir={() => setExercicioAberto(ex.id)} onExcluir={onExcluirCustom} />
        ))}
        <button style={{ ...S.btnGhost, marginTop: 4 }} onClick={onNovoExercicio}>+ Criar exercício próprio</button>
      </div>
    );
  }

  return (
    <div style={{ padding: "0 18px" }}>
      <input style={{ ...S.input, marginBottom: 10 }} placeholder="Buscar por nome ou equipamento..."
        type="search" aria-label="Buscar exercício por nome ou equipamento"
        value={busca} onChange={(e) => setBusca(e.target.value)} />

      {/* Filtro por equipamento: serve para quem treina em casa ou tem a academia cheia.
          O título e o "exerc." ao lado do número existem porque, sem eles, a fileira
          de nomes com números soltos não diz do que se trata. */}
      <div style={{ ...S.card, padding: "14px 14px 10px", marginBottom: 14 }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 10 }}>
          <div style={S.label}>Filtrar por equipamento</div>
          {equip && (
            <button onClick={() => setEquip(null)} aria-label="Limpar o filtro de equipamento"
              style={{ background: "none", border: "none", color: "#E1306C", fontWeight: 800, fontSize: 12, cursor: "pointer", padding: 0, whiteSpace: "nowrap" }}>
              ✕ limpar filtro
            </button>
          )}
        </div>
        <div style={{ fontSize: 12, color: "var(--cinza)", margin: "6px 0 12px", lineHeight: 1.5 }}>
          {equip
            ? "Mostrando só os exercícios de " + (FAMILIAS_EQUIP.find((f) => f.id === equip) || {}).nome + "."
            : "Toque no que você tem disponível. Serve para treinar em casa ou quando o aparelho está ocupado."}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
          {FAMILIAS_EQUIP.map((f) => {
            const on = equip === f.id;
            const qtd = todos.filter((e) => naFamilia(e, f)).length;
            return (
              <button key={f.id} onClick={() => setEquip(on ? null : f.id)} aria-pressed={on}
                aria-label={f.nome + ", " + qtd + " " + plural(qtd, "exercício", "exercícios")}
                style={{
                  border: "1px solid " + (on ? "#E1306C" : "var(--borda2)"),
                  background: on ? "#E1306C22" : "transparent",
                  color: on ? "#E1306C" : "var(--texto)",
                  borderRadius: 20, padding: "8px 13px", fontWeight: 800, fontSize: 12.5, cursor: "pointer",
                }}>
                {f.nome}
                <span style={{ color: on ? "#E1306C" : "var(--cinza)", fontWeight: 700 }}> · {qtd} exerc.</span>
              </button>
            );
          })}
        </div>
      </div>

      <button style={{ ...S.btn, marginBottom: 14 }} onClick={onNovoExercicio}>+ Criar exercício próprio</button>

      {buscando ? (
        <React.Fragment>
          <div style={{ ...S.label, marginBottom: 8 }}>{resultados.length} resultado(s)</div>
          {resultados.map((ex) => (
            <CardExercicio key={ex.id} ex={ex} onAbrir={() => setExercicioAberto(ex.id)} onExcluir={onExcluirCustom} />
          ))}
          {resultados.length === 0 && (
            <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)" }}>
              Nenhum exercício com esse nome. Toque em "Criar exercício próprio" para adicioná-lo.
            </div>
          )}
        </React.Fragment>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 14, marginTop: 6 }}>
          {GRUPOS.map((g) => {
            const qtd = porEquip(todos.filter((e) => e.grupo === g.id)).length;
            return (
              <button key={g.id} type="button" onClick={() => setGrupoAberto(g.id)}
                aria-label={g.nome + ", " + qtd + " " + plural(qtd, "exercício", "exercícios")}
                style={{ cursor: "pointer", textAlign: "center", background: "none", border: "none", padding: 0, font: "inherit" }}>
                <span aria-hidden="true" style={{ display: "block", width: 82, height: 82, margin: "0 auto", borderRadius: "50%", padding: 3, background: "linear-gradient(45deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5)", boxSizing: "border-box" }}>
                  <span style={{ width: "100%", height: "100%", borderRadius: "50%", background: "var(--bg)", border: "3px solid var(--bg)", boxSizing: "border-box", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30, fontWeight: 900, color: corGrupo(g) }}>
                    {g.nome[0]}
                  </span>
                </span>
                <span aria-hidden="true" style={{ display: "block", fontSize: 12, fontWeight: 700, marginTop: 7, color: "var(--texto)" }}>{g.nome}</span>
                <span aria-hidden="true" style={{ display: "block", fontSize: 10, color: "var(--cinza)", marginTop: 1 }}>{qtd} exerc.</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

// "base" é um exercício parecido: tudo vem preenchido e só a foto e o nome
// precisam de ajuste. É o que torna viável cadastrar as três remadas da
// academia em vez de desistir na segunda.
// "Remada baixa" -> "Remada baixa 2" -> "Remada baixa 3". Sugerir o número
// seguinte poupa o trabalho de inventar nome para a segunda máquina igual.
function proximoNomeVariacao(nome) {
  const m = String(nome || "").match(/^(.*?)\s*(\d+)$/);
  if (m) return m[1] + " " + (parseInt(m[2]) + 1);
  return String(nome || "") + " 2";
}

function FormNovoExercicio({ grupoSugerido, base, onSalvar, onCancelar, avisar }) {
  const [nome, setNome] = useState(base ? proximoNomeVariacao(base.nome) : "");
  const [grupo, setGrupo] = useState((base && base.grupo) || grupoSugerido || "peito");
  const [equip, setEquip] = useState((base && base.equip) || "");
  const [passosTxt, setPassosTxt] = useState(base && base.passos ? base.passos.join("\n") : "");
  const [dica, setDica] = useState((base && base.dica) || "");
  const [musc, setMusc] = useState(() => {
    const m = {};
    if (base && base.musc) {
      (base.musc.p || []).forEach((k) => { m[k] = "p"; });
      (base.musc.s || []).forEach((k) => { m[k] = "s"; });
    }
    return m;
  });
  const [foto, setFoto] = useState(null);        // blob já reduzido
  const [previa, setPrevia] = useState(null);    // endereço só para mostrar
  const [ocupado, setOcupado] = useState(false);
  const camRef = useRef(null);

  // O endereço de prévia é temporário: sem devolver, cada foto trocada vaza
  useEffect(() => () => { if (previa) { try { URL.revokeObjectURL(previa); } catch (e) {} } }, [previa]);

  const aoEscolherFoto = async (ev) => {
    const arq = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!arq) return;
    setOcupado(true);
    try {
      // 720px e compressão maior: a foto só precisa ser reconhecível de
      // relance, e vão ser dezenas delas no aparelho e dentro do backup.
      const b = await reduzirImagem(arq, 720, 0.72);
      if (previa) { try { URL.revokeObjectURL(previa); } catch (e) {} }
      setFoto(b);
      setPrevia(URL.createObjectURL(b));
    } catch (e) {
      avisar("Não consegui usar essa imagem. Tente fotografar de novo.");
    }
    setOcupado(false);
  };

  const cicloMusc = (id) => {
    setMusc((m) => {
      const atual = m[id];
      const novo = { ...m };
      if (!atual) novo[id] = "p";
      else if (atual === "p") novo[id] = "s";
      else delete novo[id];
      return novo;
    });
  };

  const salvar = async () => {
    if (!nome.trim()) { avisar("Digite o nome do exercício."); return; }
    if (ocupado) return;
    const passos = passosTxt.split("\n").map((p) => p.trim()).filter(Boolean);
    const p = Object.keys(musc).filter((k) => musc[k] === "p");
    const s = Object.keys(musc).filter((k) => musc[k] === "s");
    const id = "custom-" + Date.now();
    // A foto vai para o IndexedDB ANTES de o exercício existir na lista: se
    // gravar ao contrário, um erro aqui deixaria um exercício prometendo uma
    // foto que não existe.
    let temFoto = false;
    if (foto) {
      setOcupado(true);
      try { await guardarFotoEx(id, foto); temFoto = true; }
      catch (e) { avisar("Não consegui guardar a foto, mas o exercício foi criado."); }
      setOcupado(false);
    }
    onSalvar({
      id: id,
      custom: true,
      nome: nome.trim(),
      grupo,
      equip: equip.trim(),
      musc: { p, s },
      passos,
      dica: dica.trim(),
      foto: temFoto,
    });
  };

  const p = Object.keys(musc).filter((k) => musc[k] === "p");
  const s = Object.keys(musc).filter((k) => musc[k] === "s");

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onCancelar}>← Cancelar</button>

      {base && (
        <div style={{ ...S.card, borderColor: "#E1306C44", marginBottom: 12 }}>
          <div style={S.label}>Variação de</div>
          <div style={{ fontSize: 15, fontWeight: 800, marginTop: 4 }}>{base.nome}</div>
          <div style={{ fontSize: 12, color: "var(--cinza)", marginTop: 6, lineHeight: 1.5 }}>
            Grupo, músculos e passos já vieram copiados. Ajuste o nome, bata a foto da
            máquina da sua academia e salve.
          </div>
        </div>
      )}

      {/* A foto fica em primeiro lugar porque é por ela que se reconhece o
          aparelho: a lista de exercícios vira um álbum das máquinas da academia. */}
      <div style={S.card}>
        <div style={{ ...S.label, marginBottom: 8 }}>📷 Foto do aparelho</div>
        {previa ? (
          <React.Fragment>
            <div style={{ background: "var(--input)", borderRadius: 12, overflow: "hidden", marginBottom: 10 }}>
              <img src={previa} alt="Prévia da foto do aparelho"
                style={{ width: "100%", maxHeight: 260, objectFit: "cover", display: "block" }} />
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => camRef.current && camRef.current.click()}>
                Trocar a foto
              </button>
              <button style={{ ...S.btnGhost, flex: 1, color: "var(--perigo)", borderColor: "var(--perigo-borda)" }}
                onClick={() => { setFoto(null); setPrevia(null); }}>
                Remover
              </button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div style={{ fontSize: 13, color: "var(--cinza)", lineHeight: 1.6, marginBottom: 12 }}>
              Nem todo aparelho está em catálogo nenhum. Fotografe a máquina e você reconhece
              na hora, mesmo entre três remadas parecidas.
            </div>
            <button style={S.btn} disabled={ocupado}
              onClick={() => camRef.current && camRef.current.click()}>
              {ocupado ? "Preparando..." : "📷 Fotografar o aparelho"}
            </button>
            <div style={{ fontSize: 11, color: "var(--cinza2)", marginTop: 8, lineHeight: 1.5 }}>
              Opcional. A foto fica só neste aparelho e vai junto no backup em arquivo.
            </div>
          </React.Fragment>
        )}
        <input ref={camRef} type="file" accept="image/*" capture="environment"
          onChange={aoEscolherFoto} style={{ display: "none" }} tabIndex={-1} aria-hidden="true" />
      </div>

      <div style={S.card}>
        <div style={{ ...S.label, marginBottom: 8 }}>Nome do exercício *</div>
        <input style={S.input} placeholder="Ex.: Remada articulada pegada neutra"
          value={nome} onChange={(e) => setNome(e.target.value)} />

        <div style={{ ...S.label, margin: "16px 0 8px" }}>Grupo muscular</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {GRUPOS.map((g) => (
            <button key={g.id} onClick={() => setGrupo(g.id)}
              style={{
                border: "1px solid", borderColor: grupo === g.id ? corGrupo(g) : "var(--borda2)",
                background: grupo === g.id ? corGrupo(g) + "22" : "transparent",
                color: grupo === g.id ? corGrupo(g) : "var(--cinza)",
                borderRadius: 8, padding: "8px 12px", fontWeight: 800, fontSize: 13, cursor: "pointer",
              }}>
              {g.nome}
            </button>
          ))}
        </div>

        <div style={{ ...S.label, margin: "16px 0 4px" }}>Músculos trabalhados (opcional)</div>
        <div style={{ fontSize: 12, color: "var(--cinza)", marginBottom: 8 }}>
          Toque 1x = direto (vermelho) · 2x = indireto (amarelo) · 3x = remove
        </div>

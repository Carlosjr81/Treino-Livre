        const f = itens.reduce((a, it) => a + it.series.filter((s) => s.feito).length, 0);
        const t = itens.reduce((a, it) => a + it.series.length, 0);
        const exFalta = itens.filter((it) => it.series.some((s) => !s.feito)).length;
        return { ok: true, fala: f + " de " + t + " " + plural(t, "série", "séries") + " marcadas. " +
          plural(exFalta, "Falta ", "Faltam ") + exFalta + " " + plural(exFalta, "exercício", "exercícios") + "." };
      }
      case "tempo": {
        const min = Math.max(1, Math.round((Date.now() - sessao.inicio) / 60000));
        return { ok: true, fala: "Você está treinando há " + min + " " + plural(min, "minuto", "minutos") + "." };
      }
      case "finalizar": {
        // Finalizar sem nenhuma série marcada é recusado lá na frente; dizer
        // "finalizando" e abrir um aviso de erro logo depois seria mentir.
        const marcadas = itens.reduce((a, it) => a + it.series.filter((s) => s.feito).length, 0);
        if (!marcadas) return { ok: false, fala: "Nenhuma série marcada ainda. Dite uma série antes de encerrar." };
        onFinalizar();
        return { ok: true, fala: "Treino encerrado e salvo. Descanso merecido." };
      }
      default:
        return null;
    }
  };

  // Penduradas na ref a cada render, para o raiz sempre chamar a versão atual
  if (acoesVoz) {
    acoesVoz.current = {
      vivo: true,
      executar: executarVoz,
      descansando: !!fimDescanso,
      alvo: alvo ? nomeDoItem(alvo.ei) : null,
    };
  }
  useEffect(() => () => { if (acoesVoz) acoesVoz.current = {}; }, [acoesVoz]);


  const feitas = sessao.itens.reduce((a, it) => a + it.series.filter((s) => s.feito).length, 0);
  const total = sessao.itens.reduce((a, it) => a + it.series.length, 0);

  const fmt = (seg) => {
    const m = Math.floor(seg / 60);
    const ss = seg % 60;
    return m + ":" + (ss < 10 ? "0" : "") + ss;
  };

  const pct = fimDescanso && totalDescanso > 0 ? Math.max(0, Math.min(100, (restante / totalDescanso) * 100)) : 0;

  const btnSom = (
    <button onClick={() => { setSom(!som); if (!som) beep(700, 0.1, 0.2); }}
      title={som ? "Desligar som" : "Ligar som"}
      aria-label={som ? "Desligar o som do cronômetro" : "Ligar o som do cronômetro"} aria-pressed={som}
      style={{ width: 42, height: 42, borderRadius: 10, border: "1px solid " + (som ? "#E1306C66" : "var(--borda2)"), background: som ? "#E1306C22" : "transparent", color: "var(--texto)", fontSize: 18, cursor: "pointer" }}>
      {som ? "🔊" : "🔇"}
    </button>
  );

  return (
    <div style={{ padding: "0 18px", paddingBottom: (fimDescanso ? 210 : 20) + (vozAtiva ? 60 : 0) }}>
      <button style={S.voltar} onClick={onVoltar}>← Voltar (o treino continua salvo)</button>
      <div style={{ ...S.card, borderColor: "#E1306C44" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <div style={{ minWidth: 0 }}>
            <div style={S.label}>Treinando agora</div>
            <div style={{ fontWeight: 900, fontSize: 18 }}>{sessao.nome}</div>
          </div>
          <div style={{ textAlign: "right", flexShrink: 0 }}>
            <div style={{ fontSize: 22, fontWeight: 900, color: "#E1306C" }}>{feitas}/{total}</div>
            <div style={{ fontSize: 12, color: "var(--cinza)" }}>
              ⏱ <CronometroSessao inicio={sessao.inicio} />
            </div>
          </div>
        </div>
        {/* barra de avanço do treino: dá a sensação de estar chegando ao fim */}
        <div style={{ height: 6, background: "var(--borda)", borderRadius: 3, marginTop: 12, overflow: "hidden" }}
          role="progressbar" aria-valuenow={total ? Math.round((feitas / total) * 100) : 0} aria-valuemin={0} aria-valuemax={100}
          aria-label="Progresso do treino">
          <div style={{ height: "100%", width: (total ? (feitas / total) * 100 : 0) + "%", background: GRAD_LINHA, borderRadius: 3, transition: "width .35s ease" }} />
        </div>
      </div>

      {/* As duas coisas que ninguém descobre sozinho. Uma de cada vez, e só
          fora do descanso — ali a tela já tem cronômetro e a pessoa está
          contando os segundos. */}
      {VOZ_OUVE && !dicas.voz && !fimDescanso && (
        <DicaInicial icone="🎤" titulo="Dá para ditar em vez de digitar"
          texto={"Diga “Jarvis, anote 80 por 10” e ele preenche a série, marca o ✓ e já começa o descanso. Suas mãos ficam no ferro."}
          onFechar={() => onDicaVista("voz")}
          acoes={
            <React.Fragment>
              <button style={{ ...S.btn, flex: 1 }}
                onClick={() => { onDicaVista("voz"); if (!vozAtiva && onLigarVoz) onLigarVoz(); }}>
                {vozAtiva ? "Já estou ouvindo" : "Ligar o Jarvis"}
              </button>
              <button style={{ ...S.btnGhost, flex: 1, fontWeight: 800 }}
                onClick={() => { onDicaVista("voz"); if (onEscolaVoz) onEscolaVoz(); }}>
                Ver os comandos
              </button>
            </React.Fragment>
          } />
      )}
      {dicas.voz && !dicas.scan && !fimDescanso && alvo && (
        <DicaInicial icone="👁" titulo="Ou deixe a câmera contar"
          texto="Apoie o celular de pé, uns 2 metros de distância. Ele conta as repetições, fala o número em voz alta, corrige a forma e registra a série sozinho."
          onFechar={() => onDicaVista("scan")}
          acoes={
            <button style={{ ...S.btn, flex: 1 }}
              onClick={() => { onDicaVista("scan"); setScanner(true); }}>
              Experimentar agora
            </button>
          } />
      )}

      {/* Monitor cardíaco: aparece ligado quando há batimento, e some do caminho
          quando o navegador não fala Bluetooth — oferecer o que não existe cansa. */}
      {CARDIO_DISPONIVEL && (
        <div style={{ ...S.card, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
          borderColor: bpm ? "#ED495666" : "var(--borda)" }}>
          <div style={{ minWidth: 0 }}>
            <div style={S.label}>Frequência cardíaca</div>
            {bpm ? (
              <div style={{ fontSize: 26, fontWeight: 900, color: "#ED4956", lineHeight: 1.1, marginTop: 2 }}>
                {bpm} <span style={{ fontSize: 12, color: "var(--cinza)", fontWeight: 700 }}>bpm</span>
              </div>
            ) : (
              <div style={{ fontSize: 12, color: "var(--cinza)", marginTop: 3, lineHeight: 1.5 }}>
                {cardioEstado === "procurando" ? "Procurando o monitor..."
                  : cardioEstado === "caiu" ? "O monitor desconectou."
                  : "Cinta peitoral ou sensor com Bluetooth padrão."}
              </div>
            )}
          </div>
          <button onClick={bpm ? onDesconectarCardio : onConectarCardio}
            style={{ ...S.btnGhost, width: "auto", padding: "10px 14px", flexShrink: 0,
              color: bpm ? "var(--cinza)" : "#ED4956", borderColor: bpm ? "var(--borda2)" : "#ED495666" }}>
            {bpm ? "Desconectar" : "❤ Conectar"}
          </button>
        </div>
      )}

      {/* Configuração do descanso */}
      <div style={{ ...S.card, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <div style={{ flex: 1 }}>
          <div style={S.label}>Descanso entre séries</div>
          <div style={{ fontSize: 12, color: "var(--cinza)", marginTop: 2 }}>
            Inicia ao marcar uma série ✓ · a tela fica acesa até acabar
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={() => setDescanso(Math.max(15, descanso - 15))} aria-label="Diminuir 15 segundos de descanso"
            style={{ width: 36, height: 36, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 18, cursor: "pointer" }}>−</button>
          <div aria-live="polite" aria-label={"Descanso de " + fmt(descanso)}
            style={{ fontWeight: 900, fontSize: 17, color: "#E1306C", minWidth: 48, textAlign: "center" }}>{fmt(descanso)}</div>
          <button onClick={() => setDescanso(Math.min(600, descanso + 15))} aria-label="Aumentar 15 segundos de descanso"
            style={{ width: 36, height: 36, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 18, cursor: "pointer" }}>+</button>
          {btnSom}
        </div>
      </div>

      {sessao.itens.length === 0 && (
        <div style={{ ...S.card, textAlign: "center" }}>
          <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6 }}>Treino livre 🏋️</div>
          <div style={{ color: "var(--cinza)", fontSize: 14, lineHeight: 1.6 }}>
            Vá adicionando os exercícios conforme os aparelhos ficarem livres.
            Toque em <b>+ Adicionar exercício</b> abaixo para começar.
          </div>
        </div>
      )}

      {sessao.itens.map((it, ei) => {
        const ex = exPorId(it.exercicioId);
        const rec = recordes[it.exercicioId];
        const ult = ultimas[it.exercicioId];
        // Bi-set / tri-set: itens vizinhos com o mesmo "conjunto" sao feitos juntos
        const anterior = sessao.itens[ei - 1];
        const proximo = sessao.itens[ei + 1];
        const noConjunto = !!it.conjunto;
        const abreConjunto = noConjunto && (!anterior || anterior.conjunto !== it.conjunto);
        const fechaConjunto = noConjunto && (!proximo || proximo.conjunto !== it.conjunto);
        const tamConjunto = noConjunto ? sessao.itens.filter((x) => x.conjunto === it.conjunto).length : 0;
        const ehIsometria = !!(ex && ex.tempo);
        const ehEsteira = exCardio(ex);
        // Com o Jarvis ligado, este é o cartão que vai receber a próxima frase.
        // Sem essa marca, ditar "80 por 10" é torcer para cair no lugar certo.
        // "É a vez deste exercício" e "o Jarvis está ouvindo" são coisas diferentes,
        // e tratá-las como uma só escondia a câmera: o botão de contar vivia dentro
        // da condição da voz, então quem nunca ligou o Jarvis nunca soube que o
        // Eyes Scan existia.
        const ehVez = !!(alvo && alvo.ei === ei);
        const ehAlvo = vozAtiva && ehVez;
        return (
          <div key={it.uid || ei} id={"item-" + (it.uid || ei)}
            style={{
              ...S.card,
              ...(ehAlvo ? { borderColor: "#E1306C", boxShadow: "0 0 0 2px #E1306C33" } : {}),
              ...(noConjunto ? {
                borderLeft: "3px solid #E1306C",
                borderTopLeftRadius: abreConjunto ? 18 : 4,
                borderBottomLeftRadius: fechaConjunto ? 18 : 4,
                marginBottom: fechaConjunto ? 12 : 4,
              } : {}),
            }}>
            {abreConjunto && (
              <div style={{ ...S.label, color: "#E1306C", marginBottom: 10 }}>
                ⛓ {tamConjunto >= 3 ? "Tri-set" : "Bi-set"} — sem descanso entre eles
              </div>
            )}
            {ehAlvo && (
              <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 10, padding: "7px 10px",
                background: "#E1306C15", border: "1px solid #E1306C44", borderRadius: 10 }}>
                <span aria-hidden="true" style={{ fontSize: 13 }}>🎤</span>
                <span style={{ fontSize: 11.5, color: "#E1306C", fontWeight: 800, lineHeight: 1.4 }}>
                  O Jarvis anota aqui — diga “Jarvis, {ehEsteira ? "30 minutos a 6 por hora" : ehIsometria ? "45 segundos" : "80 por 10"}”
                </span>
              </div>
            )}
            {ehVez && !ehIsometria && (
              <button onClick={() => setScanner(true)}
                aria-label={"Contar as repetições de " + (ex ? ex.nome : "este exercício") + " pela câmera"}
                style={{ width: "100%", marginBottom: 10, padding: "11px 12px", borderRadius: 12,
                  border: "1px solid #7CFF3C66", background: "#7CFF3C14", color: "#5FBF28",
                  fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
                👁 Contar pela câmera (Eyes Scan)
              </button>
            )}
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
              <MiniaturaExercicio ex={ex} onAbrir={() => setDemo(ex)} />
              <button type="button" onClick={() => setDemo(ex)}
                aria-label={"Ver como executar " + (ex ? ex.nome : "o exercício")}
                style={{ flex: 1, minWidth: 0, textAlign: "left", background: "none", border: "none", padding: 0, font: "inherit", color: "var(--texto)", cursor: "pointer" }}>
                <span style={{ display: "block", fontWeight: 800, fontSize: 16, lineHeight: 1.25 }}>{ex ? ex.nome : "Exercício"}</span>
                <span style={{ display: "block", fontSize: 11, color: "var(--cinza)", marginTop: 3 }}>
                  {(ex && ex.equip ? ex.equip + " · " : "")}<span style={{ color: "#E1306C", fontWeight: 700 }}>ver execução ›</span>
                </span>
              </button>
              <button onClick={() => setTrocando(trocando === ei ? null : ei)}
                title="Trocar por outro exercício" aria-expanded={trocando === ei}
                aria-label={"Trocar " + (ex ? ex.nome : "este exercício") + " por outro"}
                style={{ border: "1px solid var(--borda2)", background: trocando === ei ? "#E1306C22" : "transparent", color: trocando === ei ? "#E1306C" : "var(--texto)", borderRadius: 8, padding: "7px 9px", fontWeight: 800, fontSize: 14, cursor: "pointer" }}>
                ⇄
              </button>
              <button onClick={() => rmExercicio(ei)} title="Remover este exercício do treino"
                aria-label={"Remover " + (ex ? ex.nome : "este exercício") + " do treino"}
                style={{ border: "1px solid var(--perigo-borda)", background: "transparent", color: "var(--perigo)", borderRadius: 8, padding: "7px 9px", fontWeight: 900, fontSize: 13, cursor: "pointer" }}>
                ✕
              </button>
            </div>

            {/* Painel de substituicao: alternativas do mesmo grupo muscular */}
            {trocando === ei && (
              <div style={{ border: "1px solid #E1306C66", borderRadius: 12, padding: 12, marginBottom: 12 }}>
                <div style={{ ...S.label, marginBottom: 4 }}>Trocar por outro do mesmo grupo</div>
                <div style={{ fontSize: 12, color: "var(--cinza)", marginBottom: 10, lineHeight: 1.5 }}>
                  Os do mesmo equipamento aparecem primeiro. As séries continuam; só a carga volta a ser sugerida.
                </div>
                <div style={{ maxHeight: 260, overflowY: "auto" }}>
                  {alternativasPara(it.exercicioId).slice(0, 24).map((alt) => (
                    <button key={alt.id} type="button" onClick={() => substituirExercicio(ei, alt.id)}
                      aria-label={"Substituir por " + alt.nome}
                      style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, textAlign: "left", font: "inherit", color: "var(--texto)", background: "none", border: "none", borderBottom: "1px solid var(--borda)", padding: "8px 2px", cursor: "pointer" }}>
                      <MiniaturaExercicio ex={alt} tamanho={38} />
                      <span style={{ flex: 1, minWidth: 0 }}>
                        <span style={{ display: "block", fontSize: 14, fontWeight: 700 }}>{alt.nome}</span>
                        <span style={{ display: "block", fontSize: 11, color: "var(--cinza)" }}>{alt.equip || "Equipamento livre"}</span>
                      </span>
                      <span aria-hidden="true" style={{ color: "#E1306C", fontWeight: 900 }}>⇄</span>
                    </button>
                  ))}
                  {alternativasPara(it.exercicioId).length === 0 && (
                    <div style={{ fontSize: 13, color: "var(--cinza)" }}>Não há outro exercício deste grupo fora do treino.</div>
                  )}
                </div>
                <button style={{ ...S.btnGhost, marginTop: 10 }} onClick={() => setTrocando(null)}>Cancelar</button>
              </div>
            )}

            {/* Referência do exercício: recorde, como foi da última vez e a carga sugerida */}
            {(rec || ult || it.sugerido) && (
              <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8, marginBottom: 12, fontSize: 11, lineHeight: 1.5 }}>
                {rec && (ehIsometria ? rec.segundos > 0 : rec.peso > 0) && (
                  <span style={{ background: "#E1306C18", color: "#E1306C", border: "1px solid #E1306C44", borderRadius: 8, padding: "3px 8px", fontWeight: 800, whiteSpace: "nowrap" }}>
                    🏆 {ehEsteira ? "mais longo " + Math.round(rec.segundos / 60) + " min" : "recorde " + (ehIsometria ? rec.segundos + "s" : fmtNum(rec.peso) + " kg")}
                  </span>
                )}
                {it.sugerido && it.sugerido.subiu && (
                  <span style={{ background: "var(--ok-bg)", color: "var(--ok)", border: "1px solid var(--ok)", borderRadius: 8, padding: "3px 8px", fontWeight: 800, whiteSpace: "nowrap" }}>
                    ↑ hora de subir para {it.sugerido.tempo ? it.sugerido.segundos + "s" : fmtNum(it.sugerido.peso) + " kg"}
                  </span>
                )}
                {ult && (
                  <span style={{ color: "var(--cinza)" }}>
                    última vez: {ult.slice(0, 5).map((s) => (ehCardio(s) ? textoCardio(s) : ehTempo(s) ? segundosDe(s) + "s" : fmtNum(s.peso) + "×" + repsDe(s)) + (ehAquecimento(s) ? " (aq.)" : "")).join(" · ")}
                  </span>
                )}
              </div>
            )}

            {/* Descanso deste exercicio, independente do geral */}
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12 }}>
              <span style={{ fontSize: 11, color: "var(--cinza)" }}>⏱ descanso</span>
              <button onClick={() => mudarDescansoDe(ei, -15)} aria-label={"Diminuir o descanso de " + (ex ? ex.nome : "este exercício")}
                style={{ width: 26, height: 26, borderRadius: 7, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 14, cursor: "pointer", lineHeight: 1 }}>−</button>
              <span style={{ fontSize: 12, fontWeight: 900, color: it.descanso ? "#E1306C" : "var(--cinza)", minWidth: 40, textAlign: "center", fontVariantNumeric: "tabular-nums" }}>
                {fmt(descansoDe(it))}
              </span>
              <button onClick={() => mudarDescansoDe(ei, 15)} aria-label={"Aumentar o descanso de " + (ex ? ex.nome : "este exercício")}
                style={{ width: 26, height: 26, borderRadius: 7, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 14, cursor: "pointer", lineHeight: 1 }}>+</button>
              {!it.descanso && <span style={{ fontSize: 10, color: "var(--cinza2)" }}>(geral)</span>}
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
              <div style={{ width: 30 }} />
              {ehEsteira ? (
                <React.Fragment>
                  <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Min</div>
                  <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>km/h</div>
                  <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Incl. %</div>
                  <div style={{ width: 44 }} />
                </React.Fragment>
              ) : ehIsometria ? (
                <React.Fragment>
                  <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Segundos</div>
                  <div style={{ width: 44 }} />
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Peso (kg)</div>
                  <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Reps</div>
                </React.Fragment>
              )}
              <div style={{ width: 44 }} />
            </div>
            {it.series.map((s, si) => {
              const nomeEx = ex ? ex.nome : "exercício";
              const aquec = ehAquecimento(s);
              const contando = crono && crono.ei === ei && crono.si === si;
              return (
                <div key={si} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, opacity: s.feito ? 0.55 : 1 }}>
                  {/* O número da série também liga/desliga o aquecimento */}
                  <button onClick={() => alternarAquecimento(ei, si)} aria-pressed={aquec}
                    title={aquec ? "Série de aquecimento (fora do volume)" : "Marcar como aquecimento"}
                    aria-label={(aquec ? "Tirar" : "Marcar") + " a série " + (si + 1) + " de " + nomeEx + " como aquecimento"}
                    style={{ width: 30, height: 30, borderRadius: 8, flexShrink: 0, cursor: "pointer",
                      border: aquec ? "1px solid var(--obs)" : "1px solid transparent",
                      background: aquec ? "#C7A94B22" : "transparent",
                      color: aquec ? "var(--obs)" : "var(--cinza)", fontWeight: 900, fontSize: 13 }}>
                    {aquec ? "A" : si + 1}
                  </button>

                  {ehEsteira ? (
                    <React.Fragment>
                      {contando ? (
                        <div style={{ ...S.inputMini, flex: 1, minWidth: 0, padding: "10px 2px", background: "var(--ok-bg)", borderColor: "var(--ok)", color: "var(--ok)", fontWeight: 900, fontVariantNumeric: "tabular-nums", lineHeight: "20px" }}
                          role="timer" aria-live="off" aria-label={"Faltam " + textoDuracao(restaCrono)}>
                          {Math.floor(restaCrono / 60) + ":" + String(restaCrono % 60).padStart(2, "0")}
                        </div>
                      ) : (
                        <input type="number" inputMode="numeric" placeholder="30" style={{ ...S.inputMini, flex: 1, minWidth: 0 }}
                          value={segundosDe(s) ? Math.round(segundosDe(s) / 60) : ""}
                          aria-label={"Minutos da série " + (si + 1) + " de " + nomeEx}
                          onChange={(e) => upSerie(ei, si, "segundos", String(Math.max(0, parseInt(e.target.value) || 0) * 60))} />
                      )}
                      <input type="number" inputMode="decimal" step="0.1" placeholder="6" style={{ ...S.inputMini, flex: 1, minWidth: 0 }} value={s.vel || ""}
                        aria-label={"Velocidade em km por hora da série " + (si + 1) + " de " + nomeEx}
                        onChange={(e) => upSerie(ei, si, "vel", e.target.value)} />
                      <input type="number" inputMode="decimal" step="0.5" placeholder="0" style={{ ...S.inputMini, flex: 1, minWidth: 0 }} value={s.incl || ""}
                        aria-label={"Inclinação em porcentagem da série " + (si + 1) + " de " + nomeEx}
                        onChange={(e) => upSerie(ei, si, "incl", e.target.value)} />
                      <button onClick={() => (contando ? setCrono(null) : iniciarIsometria(ei, si))}
                        aria-label={(contando ? "Parar" : "Iniciar") + " o cronômetro da série " + (si + 1) + " de " + nomeEx}
                        style={{ width: 44, height: 42, borderRadius: 8, cursor: "pointer", fontWeight: 900, fontSize: 15, flexShrink: 0,
                          border: "1px solid " + (contando ? "var(--perigo-borda)" : "#E1306C66"),
                          background: contando ? "transparent" : "#E1306C15",
                          color: contando ? "var(--perigo)" : "#E1306C" }}>
                        {contando ? "■" : "▶"}
                      </button>
                    </React.Fragment>
                  ) : ehIsometria ? (
                    <React.Fragment>
                      {contando ? (
                        <div style={{ ...S.inputMini, flex: 1, background: "var(--ok-bg)", borderColor: "var(--ok)", color: "var(--ok)", fontWeight: 900, fontVariantNumeric: "tabular-nums", lineHeight: "20px" }}
                          role="timer" aria-live="off" aria-label={"Faltam " + restaCrono + " segundos"}>
                          {restaCrono}s
                        </div>
                      ) : (
                        <input type="number" inputMode="numeric" placeholder="30" style={{ ...S.inputMini, flex: 1 }} value={s.segundos || ""}
                          aria-label={"Segundos da série " + (si + 1) + " de " + nomeEx}
                          onChange={(e) => upSerie(ei, si, "segundos", e.target.value)} />
                      )}
                      <button onClick={() => (contando ? setCrono(null) : iniciarIsometria(ei, si))}
                        aria-label={(contando ? "Parar" : "Iniciar") + " a contagem da série " + (si + 1) + " de " + nomeEx}
                        style={{ width: 44, height: 42, borderRadius: 8, cursor: "pointer", fontWeight: 900, fontSize: 15,
                          border: "1px solid " + (contando ? "var(--perigo-borda)" : "#E1306C66"),
                          background: contando ? "transparent" : "#E1306C15",
                          color: contando ? "var(--perigo)" : "#E1306C" }}>
                        {contando ? "■" : "▶"}
                      </button>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <input type="number" inputMode="decimal" placeholder="0" style={{ ...S.inputMini, flex: 1 }} value={s.peso || ""}
                        aria-label={"Peso em quilos da série " + (si + 1) + " de " + nomeEx}
                        onChange={(e) => upSerie(ei, si, "peso", e.target.value)} />
                      <input type="number" inputMode="numeric" style={{ ...S.inputMini, flex: 1 }} value={s.reps || ""}
                        aria-label={"Repetições da série " + (si + 1) + " de " + nomeEx}
                        onChange={(e) => upSerie(ei, si, "reps", e.target.value)} />
                    </React.Fragment>
                  )}

                  <button onClick={() => marcarSerie(ei, si)} aria-pressed={!!s.feito}
                    aria-label={(s.feito ? "Desmarcar" : "Concluir") + " a série " + (si + 1) + " de " + nomeEx}
                    style={{ width: 44, height: 42, borderRadius: 8, border: "none", fontWeight: 900, fontSize: 18, cursor: "pointer",
                      background: s.feito ? GRAD : "var(--borda)", color: s.feito ? "#FFFFFF" : "var(--cinza)" }}>✓</button>
                </div>
              );
            })}
            {ehEsteira && (
              <PainelCardio it={it} ex={ex} historico={historico} exPorId={exPorId} pesoCorporal={pesoCorporal} />
            )}
            {it.series.some(ehAquecimento) && (
              <div style={{ fontSize: 10, color: "var(--obs)", marginBottom: 6 }}>
                A = aquecimento: fica registrado, mas fora do volume e dos recordes.
              </div>
            )}

            <div style={{ display: "flex", gap: 8, marginTop: 4, marginBottom: 4 }}>
              <button onClick={() => addSerie(ei)}
                aria-label={"Adicionar uma série em " + (ex ? ex.nome : "este exercício")}
                style={{ ...S.btnGhost, flex: 3, padding: "11px 12px", color: "#E1306C", borderColor: "#E1306C66", fontWeight: 800 }}>
                + Adicionar série
              </button>
              {it.series.length > 1 && (
                <button onClick={() => rmSerie(ei)} title="Remover a última série"
                  aria-label={"Remover a última série de " + (ex ? ex.nome : "este exercício")}
                  style={{ ...S.btnGhost, flex: 1, padding: "11px 8px", fontSize: 18, fontWeight: 900 }}>
                  −
                </button>
              )}
            </div>

            <input style={{ ...S.input, marginTop: 4, fontSize: 14 }}
              placeholder="📝 Obs.: altura do banco, altura da polia, pegada..."
              aria-label={"Observação sobre " + (ex ? ex.nome : "este exercício") + ": altura do banco, pegada, etc."}
              value={it.obs || ""}
              onChange={(e) => upObs(ei, e.target.value)} />
          </div>
        );
      })}

      {mostrarAdd ? (
        <div style={{ ...S.card, borderColor: "#E1306C66" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={S.label}>Adicionar exercício ao treino</div>
            <button onClick={() => { setMostrarAdd(false); setBuscaEx(""); }} aria-label="Fechar a busca de exercícios"
              style={{ background: "none", border: "none", color: "var(--cinza)", fontSize: 20, fontWeight: 900, cursor: "pointer" }}>✕</button>
          </div>
          <input autoFocus style={{ ...S.input, marginBottom: 10 }} placeholder="Buscar exercício (ex.: leg press)..."
            aria-label="Buscar exercício para adicionar ao treino"
            value={buscaEx} onChange={(e) => setBuscaEx(e.target.value)} />
          <div style={{ maxHeight: 320, overflowY: "auto" }}>
            {(buscaEx.trim()
              ? todos.filter((e) => e.nome.toLowerCase().includes(buscaEx.trim().toLowerCase()))
              : todos
            ).slice(0, 40).map((e) => (
              <button key={e.id} type="button" onClick={() => addExercicio(e.id)}
                aria-label={"Adicionar " + e.nome + " ao treino"}
                style={{ width: "100%", textAlign: "left", font: "inherit", color: "var(--texto)", background: "none",
                  border: "none", borderBottom: "1px solid var(--borda)", display: "flex", justifyContent: "space-between",
                  alignItems: "center", padding: "10px 4px", cursor: "pointer" }}>
                <span>
                  <span style={{ display: "block", fontWeight: 700, fontSize: 14 }}>{e.nome}</span>
                  <span style={{ display: "block", fontSize: 12, color: corGrupo(grupoPorId(e.grupo)) }}>{grupoPorId(e.grupo).nome}</span>
                </span>
                <span aria-hidden="true" style={{ background: GRAD, color: "#FFFFFF", borderRadius: 10, width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 18, flexShrink: 0 }}>+</span>
              </button>
            ))}
          </div>
        </div>
      ) : (
        <button style={{ ...S.btnGhost, marginBottom: 12, color: "#E1306C", borderColor: "#E1306C66", fontWeight: 800 }}
          onClick={() => setMostrarAdd(true)}>
          + Adicionar exercício ao treino
        </button>
      )}

      <button style={{ ...S.btn, marginTop: 4 }} onClick={onFinalizar}>Finalizar treino</button>
      <button style={{ ...S.btnGhost, marginTop: 10, color: "var(--perigo)", borderColor: "var(--perigo-borda)" }}
        onClick={() => pedirConfirmacao("Descartar este treino sem salvar?", onDescartar)}>
        Descartar
      </button>

      {/* Barra do cronômetro de descanso */}
      {fimDescanso && (
        <div style={{ position: "fixed", bottom: "calc(64px + env(safe-area-inset-bottom))", left: 0, right: 0, background: acabou ? "var(--ok-bg)" : "var(--bg2)", borderTop: "2px solid " + (acabou ? "var(--ok)" : "#E1306C"), borderBottom: "1px solid var(--borda)", padding: "12px 18px 14px", zIndex: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ ...S.label, color: acabou ? "var(--ok)" : "var(--cinza)" }}>
                {acabou ? "Descanso concluído!" : "Descansando"}
              </div>
              <div role="timer" aria-live={acabou ? "assertive" : "off"}
                aria-label={acabou ? "Descanso concluído, bora treinar" : "Faltam " + fmt(restante)}
                style={{ fontSize: 30, fontWeight: 900, color: acabou ? "var(--ok)" : "#E1306C", fontVariantNumeric: "tabular-nums" }}>
                {acabou ? "Bora! 💪" : fmt(restante)}
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <button onClick={() => { setSom(!som); if (!som) beep(700, 0.1, 0.2); }}
                aria-label={som ? "Desligar o som do cronômetro" : "Ligar o som do cronômetro"} aria-pressed={som}
                style={{ width: 40, height: 40, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontSize: 16, cursor: "pointer" }}>
                {som ? "🔊" : "🔇"}
              </button>
              {!acabou && (
                <button onClick={mais15} aria-label="Adicionar 15 segundos ao descanso"
                  style={{ border: "1px solid #E1306C66", background: "transparent", color: "#E1306C", borderRadius: 8, padding: "10px 12px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
                  +15s
                </button>
              )}
              <button onClick={fecharDescanso} aria-label={acabou ? "Fechar o aviso de descanso" : "Pular o descanso"}
                style={{ border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", borderRadius: 8, padding: "10px 14px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
                {acabou ? "OK" : "Pular"}
              </button>
            </div>
          </div>
          {acabou && calouNoFundo && typeof Notification !== "undefined" && Notification.permission === "default" && (
            <div style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 10, fontSize: 12, color: "var(--cinza)", lineHeight: 1.4 }}>
              <span style={{ flex: 1 }}>Com a tela apagada o celular cala a voz. A notificação avisa mesmo assim.</span>
              <button onClick={() => {
                try { Notification.requestPermission().then(() => setCalouNoFundo(false)); } catch (e) { setCalouNoFundo(false); }
              }}
                style={{ border: "1px solid var(--ok)", background: "transparent", color: "var(--ok)", borderRadius: 8, padding: "8px 10px", fontWeight: 800, fontSize: 12, cursor: "pointer", whiteSpace: "nowrap" }}>
                🔔 Ativar aviso
              </button>
            </div>
          )}
          {!acabou && (
            <div style={{ height: 5, background: "var(--borda)", borderRadius: 3, marginTop: 10, overflow: "hidden" }}>
              <div style={{ height: "100%", width: pct + "%", background: restante <= 3 ? "#ED4956" : "#E1306C", borderRadius: 3, transition: "width 0.25s linear" }} />
            </div>
          )}
        </div>
      )}

      <ModalDemonstracao ex={demo} onFechar={() => setDemo(null)} />

      <ScannerEyes
        aberto={scanner}
        ex={alvo ? exPorId(sessao.itens[alvo.ei].exercicioId) : null}
        repsAlvo={alvo && sessao.itens[alvo.ei].series[alvo.si] ? sessao.itens[alvo.ei].series[alvo.si].reps : ""}
        pesoAtual={alvo && sessao.itens[alvo.ei].series[alvo.si] ? sessao.itens[alvo.ei].series[alvo.si].peso : ""}
        pesoCorporal={pesoCorporal}
        bpm={bpm}
        vozCfg={vozCfg} contarAlto={contarAlto} onAlternarContagem={onAlternarContagem}
        autoSerie={autoSerie} onAlternarAuto={onAlternarAuto}
        serieNum={alvo ? alvo.si + 1 : 1}
        serieTotal={alvo ? sessao.itens[alvo.ei].series.length : 1}
        som={som}
        onRegistrar={registrarDoScanner}
        onFechar={() => setScanner(false)} />
    </div>
  );
}

function MiniStat({ valor, nome, cor }) {
  return (
    <div style={{ flex: "1 1 60px", minWidth: 60 }}>
      <div style={{ fontSize: 15, fontWeight: 900, color: cor || "var(--texto)" }}>{valor}</div>
      <div style={{ fontSize: 9, color: "var(--cinza)", textTransform: "uppercase", letterSpacing: 0.5 }}>{nome}</div>
    </div>
  );
}

function CardTreino({ h, exPorId, recordes, comparacao, onExcluir, onStory, onEditar, pedirConfirmacao }) {
  const [aberto, setAberto] = useState(false);
  const st = statsTreino(h);
  const pr = recordes[h.id] || {};
  const nPR = Object.keys(pr).filter((k) => pr[k].peso || pr[k].volume).length;
  const grupos = {};
  h.itens.forEach((it) => {
    const e = exPorId(it.exercicioId);
    const g = e ? e.grupo : null;
    if (g) grupos[g] = (grupos[g] || 0) + volumeItem(it);
  });
  const listaGrupos = Object.keys(grupos).filter((g) => grupos[g] > 0).sort((a, b) => grupos[b] - grupos[a]);
  const totalG = listaGrupos.reduce((a, g) => a + grupos[g], 0) || 1;

  return (
    <div style={S.card}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ fontWeight: 900, fontSize: 16, flex: 1 }}>{h.nome}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ color: "#E1306C", fontWeight: 800, fontSize: 13 }}>{h.duracaoMin} min</div>
          <button title="Excluir este treino do histórico" aria-label={"Excluir do histórico o treino " + h.nome}
            onClick={() => pedirConfirmacao("Excluir este treino do histórico?\n\nVocê terá alguns segundos para desfazer.", () => onExcluir(h.id))}
            style={{ background: "none", border: "1px solid var(--perigo-borda)", color: "var(--perigo)", borderRadius: 8, width: 30, height: 30, fontSize: 14, fontWeight: 900, cursor: "pointer" }}>
            🗑
          </button>
        </div>
      </div>
      <div style={{ color: "var(--cinza)", fontSize: 12, margin: "2px 0 12px" }}>
        {new Date(h.data).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" })}
      </div>

      {/* Números do treino */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, background: "var(--input)", border: "1px solid var(--borda)", borderRadius: 12, padding: "12px 14px" }}>
        {st.volume > 0 && <MiniStat valor={fmtKg(st.volume)} nome="volume" cor="#E1306C" />}
        <MiniStat valor={st.series} nome="séries" />
        <MiniStat valor={st.reps} nome="reps" />
        <MiniStat valor={st.exercicios} nome="exercícios" />
        {st.cargaMax > 0 && <MiniStat valor={st.cargaMax + "kg"} nome="carga máx." />}
        {st.densidade > 0 && <MiniStat valor={st.densidade + " kg/min"} nome="densidade" />}
      </div>

      {/* Comparação e recordes */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
        {comparacao && (
          <span style={{
            fontSize: 11, fontWeight: 800, borderRadius: 8, padding: "4px 8px",
            background: comparacao.pct >= 0 ? "var(--ok-bg)" : "var(--aviso-bg)",
            color: comparacao.pct >= 0 ? "var(--ok)" : "var(--perigo)",
          }}>
            {(comparacao.pct >= 0 ? "▲ +" : "▼ ") + comparacao.pct + "% de volume vs. treino anterior"}
          </span>
        )}
        {nPR > 0 && (
          <span style={{ fontSize: 11, fontWeight: 800, borderRadius: 8, padding: "4px 8px", background: "#E1306C22", color: "#E1306C" }}>
            🏆 {nPR} {plural(nPR, "recorde pessoal", "recordes pessoais")}
          </span>
        )}
      </div>

      {/* Divisão por músculo */}
      {listaGrupos.length > 0 && (
        <div style={{ marginTop: 12 }}>
          <div style={{ display: "flex", height: 8, borderRadius: 4, overflow: "hidden", background: "var(--borda)" }}>
            {listaGrupos.map((g) => (
              <div key={g} style={{ width: (grupos[g] / totalG) * 100 + "%", background: corGrupo(GRUPOS.find((x) => x.id === g)) }} />
            ))}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 6 }}>
            {listaGrupos.map((g) => {
              const info = GRUPOS.find((x) => x.id === g);
              return (
                <span key={g} style={{ fontSize: 10, color: "var(--cinza)" }}>
                  <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 2, background: corGrupo(info), marginRight: 4 }} />
                  {(info ? info.nome : g) + " " + Math.round((grupos[g] / totalG) * 100) + "%"}
                </span>
              );
            })}
          </div>
        </div>
      )}

      {/* Séries */}
      <button onClick={() => setAberto(!aberto)}
        style={{ background: "none", border: "none", color: "#E1306C", fontWeight: 800, fontSize: 12, padding: "12px 0 4px", cursor: "pointer" }}>
        {aberto ? "▲ Ocultar séries" : "▼ Ver séries de cada exercício"}
      </button>

      {aberto && h.itens.map((it, i) => {
        const e = exPorId(it.exercicioId);
        const p = pr[it.exercicioId] || {};
        const rm = melhor1RM(it);
        return (
          <div key={i} style={{ fontSize: 13, marginBottom: 8, lineHeight: 1.5 }}>
            <span style={{ fontWeight: 700 }}>{(e ? e.nome : "Exercício")}: </span>
            <span style={{ color: "var(--cinza)" }}>
              {it.series.map((s) =>
                (ehCardio(s) ? textoCardio(s) : ehTempo(s) ? segundosDe(s) + "s" : fmtNum(s.peso) + "kg×" + repsDe(s)) + (ehAquecimento(s) ? " (aq.)" : "")
              ).join("  ·  ")}
            </span>
            {(p.peso || p.volume) && <span style={{ marginLeft: 4 }} title="Recorde pessoal">🏆</span>}
            {itemDeTempo(it) ? (
              tempoItem(it) > 0 && (
                <div style={{ color: "var(--cinza2)", fontSize: 11 }}>{tempoItem(it)}s no total</div>
              )
            ) : (
              volumeItem(it) > 0 && (
                <div style={{ color: "var(--cinza2)", fontSize: 11 }}>
                  {fmtKg(volumeItem(it))} de volume{rm ? " · 1RM estim. " + rm + "kg" : ""}
                </div>
              )
            )}
            {it.obs && <div style={{ color: "var(--obs)", fontSize: 12, fontStyle: "italic", marginTop: 2 }}>📝 {it.obs}</div>}
          </div>
        );
      })}

      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <button onClick={() => onStory(h)} style={{ ...S.btnGhost, flex: 2, color: "#E1306C", borderColor: "#E1306C66", fontSize: 13, padding: "10px 12px" }}>
          📸 Story
        </button>
        <button onClick={() => onEditar(h)} aria-label={"Corrigir o treino " + h.nome}
          style={{ ...S.btnGhost, flex: 1, fontSize: 13, padding: "10px 12px" }}>
          ✎ Corrigir
        </button>
      </div>
    </div>
  );
}

// ---------------- CORRIGIR UM TREINO DO HISTÓRICO ----------------
// Antes, um peso digitado errado só tinha uma saída: apagar o treino inteiro.
function TelaEditarHistorico({ registro, exPorId, onSalvar, onCancelar, avisar }) {
  const [r, setR] = useState(() => JSON.parse(JSON.stringify(registro)));

  const upSerie = (ei, si, campo, val) => setR({
    ...r,
    itens: r.itens.map((it, i) => (i !== ei ? it : {
      ...it, series: it.series.map((s, j) => (j !== si ? s : { ...s, [campo]: val })),
    })),
  });
  const rmSerie = (ei, si) => setR({
    ...r,
    itens: r.itens.map((it, i) => (i !== ei ? it : { ...it, series: it.series.filter((unused, j) => j !== si) })),
  });
  const addSerie = (ei) => setR({
    ...r,
    itens: r.itens.map((it, i) => {
      if (i !== ei) return it;
      const ult = it.series[it.series.length - 1];
      if (ult && ehTempo(ult)) return { ...it, series: [...it.series, ehCardio(ult) ? { segundos: ult.segundos, vel: ult.vel, incl: ult.incl } : { segundos: ult.segundos }] };
      const base = ult || { peso: "", reps: "12" };
      return { ...it, series: [...it.series, { peso: base.peso, reps: base.reps }] };
    }),
  });
  const rmItem = (ei) => setR({ ...r, itens: r.itens.filter((unused, i) => i !== ei) });
  const upObs = (ei, val) => setR({ ...r, itens: r.itens.map((it, i) => (i === ei ? { ...it, obs: val } : it)) });

  const salvar = () => {
    const limpo = {
      ...r,
      nome: (r.nome || "").trim() || "Treino",
      duracaoMin: Math.max(1, Math.min(300, parseInt(r.duracaoMin) || 1)),
      itens: r.itens.filter((it) => (it.series || []).length > 0),
    };
    if (!limpo.itens.length) { avisar("Um treino precisa de pelo menos um exercício com uma série. Para remover tudo, apague o treino no histórico."); return; }
    onSalvar(limpo);
  };

  const st = statsTreino(r);
  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onCancelar}>← Cancelar</button>
      <div style={{ ...S.card, borderColor: "#E1306C44" }}>
        <div style={S.label}>Corrigindo o treino de {new Date(r.data).toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" })}</div>
        <div style={{ ...S.label, fontSize: 10, margin: "12px 0 6px" }}>Nome</div>
        <input style={S.input} value={r.nome} aria-label="Nome do treino"
          onChange={(e) => setR({ ...r, nome: e.target.value })} />
        <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
          <div style={{ flex: 1 }}>
            <div style={{ ...S.label, fontSize: 10, marginBottom: 6 }}>Duração (min)</div>
            <input type="number" min={1} style={S.inputMini} value={r.duracaoMin} aria-label="Duração em minutos"
              onChange={(e) => setR({ ...r, duracaoMin: e.target.value })} />
          </div>
          <div style={{ flex: 2 }}>
            <div style={{ ...S.label, fontSize: 10, marginBottom: 6 }}>Volume recalculado</div>
            <div style={{ fontWeight: 900, fontSize: 17, color: "#E1306C", padding: "10px 0" }}>{fmtKg(st.volume)}</div>
          </div>
        </div>
      </div>

      {r.itens.map((it, ei) => {
        const ex = exPorId(it.exercicioId);
        const nomeEx = ex ? ex.nome : "Exercício";
        return (
          <div key={ei} style={S.card}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <MiniaturaExercicio ex={ex} tamanho={40} />
              <div style={{ fontWeight: 800, fontSize: 15, flex: 1, minWidth: 0 }}>{nomeEx}</div>
              <button onClick={() => rmItem(ei)} aria-label={"Remover " + nomeEx + " deste treino"}
                style={{ border: "1px solid var(--perigo-borda)", background: "transparent", color: "var(--perigo)", borderRadius: 8, padding: "6px 9px", fontWeight: 900, fontSize: 13, cursor: "pointer" }}>✕</button>
            </div>
            <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
              <div style={{ width: 26 }} />
              <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Peso (kg)</div>
              <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Reps</div>
              <div style={{ width: 36 }} />
            </div>
            {it.series.map((s, si) => (
              <div key={si} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
                <div style={{ width: 26, fontWeight: 900, textAlign: "center", fontSize: 13,
                  color: ehAquecimento(s) ? "var(--obs)" : "var(--cinza)" }}>{ehAquecimento(s) ? "A" : si + 1}</div>
                {ehCardio(s) ? (
                  <React.Fragment>
                    <input type="number" inputMode="numeric" style={{ ...S.inputMini, flex: 1, minWidth: 0 }} value={Math.round(segundosDe(s) / 60) || ""}
                      aria-label={"Minutos da série " + (si + 1) + " de " + nomeEx}
                      onChange={(e) => upSerie(ei, si, "segundos", String(Math.max(0, parseInt(e.target.value) || 0) * 60))} />
                    <input type="number" inputMode="decimal" style={{ ...S.inputMini, flex: 1, minWidth: 0 }} value={s.vel}
                      aria-label={"Velocidade em km por hora da série " + (si + 1) + " de " + nomeEx}
                      onChange={(e) => upSerie(ei, si, "vel", e.target.value)} />
                    <input type="number" inputMode="decimal" style={{ ...S.inputMini, flex: 1, minWidth: 0 }} value={s.incl || ""}
                      aria-label={"Inclinação em porcentagem da série " + (si + 1) + " de " + nomeEx}
                      onChange={(e) => upSerie(ei, si, "incl", e.target.value)} />
                  </React.Fragment>
                ) : ehTempo(s) ? (
                  <input type="number" inputMode="numeric" style={{ ...S.inputMini, flex: 2 }} value={s.segundos}
                    aria-label={"Segundos da série " + (si + 1) + " de " + nomeEx}
                    onChange={(e) => upSerie(ei, si, "segundos", e.target.value)} />
                ) : (
                  <React.Fragment>
                    <input type="number" inputMode="decimal" style={{ ...S.inputMini, flex: 1 }} value={s.peso}
                      aria-label={"Peso da série " + (si + 1) + " de " + nomeEx}
                      onChange={(e) => upSerie(ei, si, "peso", e.target.value)} />
                    <input type="number" inputMode="numeric" style={{ ...S.inputMini, flex: 1 }} value={s.reps}
                      aria-label={"Repetições da série " + (si + 1) + " de " + nomeEx}
                      onChange={(e) => upSerie(ei, si, "reps", e.target.value)} />
                  </React.Fragment>
                )}
                <button onClick={() => rmSerie(ei, si)} aria-label={"Remover a série " + (si + 1) + " de " + nomeEx}
                  style={{ width: 36, height: 40, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--perigo)", fontWeight: 900, cursor: "pointer" }}>−</button>
              </div>
            ))}
            <button onClick={() => addSerie(ei)}
              style={{ ...S.btnGhost, padding: "9px 12px", color: "#E1306C", borderColor: "#E1306C66", fontWeight: 800, marginTop: 2 }}>
              + Adicionar série
            </button>

function GraficoMedida({ medidas, campo, unidade }) {
  const pontos = [...medidas]
    .filter((m) => parseFloat(m[campo]) > 0)
    .sort((a, b) => new Date(a.data) - new Date(b.data))
    .map((m) => ({ data: new Date(m.data), valor: parseFloat(m[campo]) }));
  if (pontos.length < 2) {
    return (
      <div style={{ fontSize: 13, color: "var(--cinza)", padding: "6px 0" }}>
        Registre pelo menos 2 medições para ver a linha de evolução.
      </div>
    );
  }
  const W = 320, H = 140, x0 = 40, x1 = 310, y0 = 108, y1 = 14;
  const vals = pontos.map((p) => p.valor);
  const vmin = Math.min(...vals), vmax = Math.max(...vals);
  const faixa = vmax - vmin || 1;
  const px = (i) => x0 + (i / (pontos.length - 1)) * (x1 - x0);
  const py = (v) => y0 - ((v - vmin) / faixa) * (y0 - y1);
  const linha = pontos.map((p, i) => px(i).toFixed(1) + "," + py(p.valor).toFixed(1)).join(" ");
  const fmtData = (d) => d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  const variacao = Math.round((pontos[pontos.length - 1].valor - pontos[0].valor) * 10) / 10;
  return (
    <React.Fragment>
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }} aria-hidden="true">
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={x0} x2={x1} y1={y0 - f * (y0 - y1)} y2={y0 - f * (y0 - y1)} stroke="var(--borda)" strokeWidth="1" />
        ))}
        <text x={x0 - 5} y={y1 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{fmtNum(vmax)}</text>
        <text x={x0 - 5} y={y0 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{fmtNum(vmin)}</text>
        <polyline points={linha} fill="none" stroke="#E1306C" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        {pontos.map((p, i) => (
          <circle key={i} cx={px(i)} cy={py(p.valor)} r="3.5" fill="#ED4956" stroke="var(--bg)" strokeWidth="1" />
        ))}
        <text x={x0} y={H - 3} fill="var(--cinza)" fontSize="10">{fmtData(pontos[0].data)}</text>
        <text x={x1} y={H - 3} fill="var(--cinza)" fontSize="10" textAnchor="end">{fmtData(pontos[pontos.length - 1].data)}</text>
      </svg>
      <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
        <Resumo num={fmtNum(pontos[0].valor) + unidade} txt="primeira" />
        <Resumo num={fmtNum(pontos[pontos.length - 1].valor) + unidade} txt="agora" />
        <Resumo num={(variacao > 0 ? "+" : "") + fmtNum(variacao) + unidade} txt="variação" />
      </div>
    </React.Fragment>
  );
}

function PainelFotos({ fotos, onAdicionar, onExcluir, pedirConfirmacao }) {
  const [urls, setUrls] = useState({});
  const [aberta, setAberta] = useState(null);
  const entradaRef = useRef(null);

  // Carrega as miniaturas do IndexedDB e devolve os endereços temporários no fim,
  // senão cada visita à tela vaza memória.
  useEffect(() => {
    let vivo = true;
    const criados = [];
    (async () => {
      const novo = {};
      for (const f of fotos) {
        try {
          const blob = await lerFoto(f.id);
          if (!blob) continue;
          const u = URL.createObjectURL(blob);
          criados.push(u);
          novo[f.id] = u;
        } catch (e) {}
      }
      if (vivo) setUrls(novo); else criados.forEach((u) => URL.revokeObjectURL(u));
    })();
    return () => { vivo = false; criados.forEach((u) => URL.revokeObjectURL(u)); };
  }, [fotos]);

  const ordenadas = [...fotos].sort((a, b) => new Date(b.data) - new Date(a.data));
  return (
    <div style={S.card}>
      <div style={S.label}>Fotos de progresso</div>
      <div style={{ fontSize: 12, color: "var(--cinza)", margin: "6px 0 12px", lineHeight: 1.5 }}>
        Sempre no mesmo lugar, na mesma luz e de manhã. É o registro que mostra mudança
        quando a balança não mostra. As fotos ficam neste aparelho e entram no backup em arquivo.
      </div>
      <input ref={entradaRef} type="file" accept="image/*" style={{ display: "none" }}
        aria-hidden="true" tabIndex={-1}
        onChange={(e) => { const a = e.target.files && e.target.files[0]; e.target.value = ""; if (a) onAdicionar(a); }} />
      <button style={S.btn} onClick={() => entradaRef.current && entradaRef.current.click()}>
        📷 Adicionar foto de hoje
      </button>

      {ordenadas.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 14 }}>
          {ordenadas.map((f) => (
            <button key={f.id} type="button" onClick={() => setAberta(f)}
              aria-label={"Ver a foto de " + new Date(f.data).toLocaleDateString("pt-BR")}
              style={{ padding: 0, border: "1px solid var(--borda2)", borderRadius: 12, overflow: "hidden", background: "var(--input)", cursor: "pointer", aspectRatio: "3/4" }}>
              {urls[f.id]
                ? <img src={urls[f.id]} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
                : <span style={{ fontSize: 11, color: "var(--cinza2)" }}>...</span>}
              <span style={{ display: "block", fontSize: 9, color: "var(--cinza)", padding: "3px 0" }}>
                {new Date(f.data).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit" })}
              </span>
            </button>
          ))}
        </div>
      )}

      {aberta && (
        <div onClick={() => setAberta(null)} role="dialog" aria-modal="true" aria-label="Foto de progresso"
          style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.9)", zIndex: 48, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20, gap: 14 }}>
          {urls[aberta.id] && (
            <img src={urls[aberta.id]} alt={"Foto de " + new Date(aberta.data).toLocaleDateString("pt-BR")}
              style={{ maxWidth: "100%", maxHeight: "72vh", borderRadius: 12 }} />
          )}
          <div style={{ color: "#F2F0EC", fontWeight: 800 }}>
            {new Date(aberta.data).toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" })}
          </div>
          <div style={{ display: "flex", gap: 10 }} onClick={(e) => e.stopPropagation()}>
            <button style={{ ...S.btnGhost, width: "auto", padding: "10px 18px", color: "#FFFFFF", borderColor: "#FFFFFF55" }}
              onClick={() => setAberta(null)}>Fechar</button>
            <button style={{ ...S.btnGhost, width: "auto", padding: "10px 18px", color: "var(--perigo)", borderColor: "var(--perigo-borda)" }}
              onClick={() => pedirConfirmacao("Excluir esta foto? Não há como recuperar.", () => { onExcluir(aberta.id); setAberta(null); })}>
              🗑 Excluir
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function TelaCorpo({ medidas, historico, fotos, onAdicionarFoto, onExcluirFoto, onSalvar, onExcluir, pedirConfirmacao, avisar }) {
  const [form, setForm] = useState({});
  const [campoGrafico, setCampoGrafico] = useState("peso");

  const ordenadas = [...medidas].sort((a, b) => new Date(b.data) - new Date(a.data));
  const ultima = ordenadas[0];

  const salvar = () => {
    const algum = CAMPOS_MEDIDA.some((c) => parseFloat(form[c.id]) > 0);
    if (!algum) { avisar("Preencha pelo menos um campo para registrar a medição."); return; }
    const registro = { id: "md" + Date.now(), data: new Date().toISOString() };
    CAMPOS_MEDIDA.forEach((c) => {
      const v = parseFloat(form[c.id]);
      if (v > 0) registro[c.id] = v;
    });
    onSalvar(registro);
    setForm({});
  };

  const info = CAMPOS_MEDIDA.find((c) => c.id === campoGrafico) || CAMPOS_MEDIDA[0];
  const temAlgum = medidas.some((m) => parseFloat(m[campoGrafico]) > 0);

    <React.Fragment>
      <div style={{ ...S.card, borderColor: "#8134AF55" }}>
        <div style={S.label}>Nova medição</div>
        <div style={{ fontSize: 12, color: "var(--cinza)", margin: "6px 0 12px", lineHeight: 1.5 }}>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {CAMPOS_MEDIDA.map((c) => (

              <div style={{ ...S.label, fontSize: 10, marginBottom: 5 }}>{c.nome} ({c.unidade})</div>
              <input type="number" inputMode="decimal" step={c.passo} style={S.inputMini}
                placeholder={ultima && ultima[c.id] ? String(ultima[c.id]) : "—"}

                value={form[c.id] || ""}
                onChange={(e) => setForm({ ...form, [c.id]: e.target.value })} />
            </div>
          ))}
        </div>
        <button style={{ ...S.btn, marginTop: 16 }} onClick={salvar}>Registrar medição de hoje</button>
      </div>

      {medidas.length > 0 && (
        <div style={S.card}>
          <div style={{ ...S.label, marginBottom: 10 }}>Evolução</div>

                  background: campoGrafico === c.id ? "#E1306C22" : "transparent",
                  color: campoGrafico === c.id ? "#E1306C" : "var(--cinza)",
                  borderRadius: 8, padding: "7px 11px", fontWeight: 800, fontSize: 12, cursor: "pointer",
                }}>
                {c.nome}
              </button>
            ))}
          </div>
          {temAlgum
            ? <GraficoMedida medidas={medidas} campo={campoGrafico} unidade={info.unidade} />
            : <div style={{ fontSize: 13, color: "var(--cinza)" }}>Nenhum registro de {info.nome.toLowerCase()} ainda.</div>}
        </div>
      )}

      {medidas.length > 0 && (
        <div style={S.card}>
          <div style={{ ...S.label, marginBottom: 10 }}>Histórico de medições</div>
          {ordenadas.map((m) => (
            <div key={m.id} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "9px 0", borderBottom: "1px solid var(--borda)" }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 800 }}>
                  {new Date(m.data).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" })}

// oferece isso num diálogo; o iPhone **nunca** oferece, e sem instrução
// ninguém adivinha que está escondido no botão de compartilhar. Era a maior
// parte do "não consegui instalar".
const EH_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || "") ||
  (/Mac/.test(navigator.userAgent || "") && navigator.maxTouchPoints > 1);
const EH_ANDROID = /Android/i.test(navigator.userAgent || "");

function ComoInstalar({ onFechar, onCopiarLink }) {
  const passos = NAVEGADOR_INAPP
    ? ["Toque nos ⋮ (ou ···) no canto desta tela.",
       "Escolha “Abrir no navegador” ou “Abrir no Chrome”.",

    : EH_IOS
      ? ["Toque no botão de compartilhar (o quadrado com a seta para cima), embaixo da tela.",
         "Role a lista e escolha “Adicionar à Tela de Início”.",
         "Confirme em “Adicionar”. Pronto: o ícone fica junto dos outros apps."]
      : EH_ANDROID
        ? ["Toque nos ⋮ no canto do Chrome.",
           "Escolha “Instalar aplicativo” (ou “Adicionar à tela inicial”).",
           "Confirme. O ícone aparece junto dos outros apps."]
        : ["Na barra de endereço, procure o ícone de instalar (uma telinha com uma seta).",
           "Clique nele e confirme em “Instalar”.",
           "O app abre em janela própria, sem as abas do navegador."];
  return (

}

// ---------------- PORTARIA ----------------
// A tela que pede para seguir antes de entrar.
//
// **Ela não verifica nada**, e isso é uma decisão tomada com o dono: saber se
// alguém segue uma conta exige servidor e uma API que o Instagram não oferece
// nem ao dono do perfil. O que existe é o pedido feito na cara limpa, no único
// lugar por onde todo mundo passa.
//
// Quatro regras, e as quatro nasceram de gente que não conseguiu entrar:
//
// 1. **Tocar em "seguir" já libera a entrada, antes de sair da tela.** O link
//    do Instagram leva a pessoa para fora do navegador. Quando ela voltava pelo
//    link da bio, caía na portaria de novo — e de novo, e de novo. Era um
//    looping fechado: o único jeito de sair era desistir do app.
// 2. **O botão de entrar aparece desde o primeiro segundo.** Ele já ficou
//    escondido atrás de um prazo de 14 s e de um toque no botão de seguir, e as
//    duas coisas pareciam uma porta sem maçaneta.
// 3. **No navegador embutido do Instagram não há portaria nenhuma.** Ali os
//    dados salvos somem sozinhos, então nada do que a pessoa responder vai ser
//    lembrado — e ela voltaria para a mesma tela na próxima vez. O que importa
//    naquele contexto é tirá-la de lá, e é só isso que a tela diz.
// 4. **"Seguir e baixar" faz as duas coisas**: dispara a instalação e abre o
//    perfil. Instalado, o app passa a abrir pelo ícone, e o caminho do Instagram
//    deixa de ser a única porta de entrada.
function Portaria({ temDados, podeInstalar, onInstalar, onCopiarLink, onEntrar }) {
  const [ajuda, setAjuda] = useState(false);

  const seguir = () => {
    // Libera ANTES de sair: é isto que impede o looping de quem volta pela bio.
    onEntrar({ seguiu: true });
    if (podeInstalar) { try { onInstalar(); } catch (e) {} }
    setTimeout(() => {
      try { window.open(LINK_INSTAGRAM, "_blank", "noopener"); }
      catch (e) { window.location.href = LINK_INSTAGRAM; }
    }, podeInstalar ? 700 : 0);
  };

  if (NAVEGADOR_INAPP) {
    return (
      <div style={{ ...S.app, minHeight: "100vh", display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center", padding: "32px 22px", textAlign: "center" }}>
        <div style={{ ...S.logo, fontSize: 32, marginBottom: 6 }}>Treino Livre</div>
        <div style={{ height: 4, width: 90, background: GRAD_LINHA, borderRadius: 2, margin: "10px 0 24px" }} />
        <div style={{ fontSize: 18, fontWeight: 900, lineHeight: 1.4, marginBottom: 12, maxWidth: 340 }}>
          Abra no Chrome para não perder seus treinos
        </div>
        <div style={{ fontSize: 14, color: "var(--cinza)", lineHeight: 1.65, maxWidth: 340, marginBottom: 24 }}>
          Você está no navegador de dentro do Instagram, que apaga os dados salvos sozinho.
          Toque nos <b>⋮</b> (ou <b>···</b>) no canto da tela e escolha <b>“Abrir no navegador”</b>.
        </div>
        <button style={{ ...S.btn, width: "100%", maxWidth: 340, marginBottom: 10 }} onClick={onCopiarLink}>
          📋 Copiar o link do app
        </button>
        <button style={{ ...S.btnGhost, width: "100%", maxWidth: 340, fontWeight: 800 }}
          onClick={() => onEntrar({ seguiu: false })}>
          Continuar assim mesmo
        </button>
        <div style={{ fontSize: 12, color: "var(--cinza2)", marginTop: 20, lineHeight: 1.6, maxWidth: 320 }}>
          Feito por @{INSTAGRAM}
        </div>
      </div>
    );
  }

  return (
    <div style={{ ...S.app, minHeight: "100vh", display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center", padding: "32px 22px", textAlign: "center" }}>
      <div style={{ ...S.logo, fontSize: 32, marginBottom: 6 }}>Treino Livre</div>
      <div style={{ height: 4, width: 90, background: GRAD_LINHA, borderRadius: 2, margin: "10px 0 24px" }} />

      <div style={{ fontSize: 19, fontWeight: 900, lineHeight: 1.4, marginBottom: 12, maxWidth: 350 }}>
        Siga e baixe o app
      </div>
      <div style={{ fontSize: 14.5, color: "var(--cinza)", lineHeight: 1.7, maxWidth: 350, marginBottom: 24 }}>
        Siga para ter sempre acesso ao app e acompanhar as novidades. É por lá que saem as
        atualizações e os treinos novos. Tudo de graça, sem anúncio e sem cadastro.
      </div>

      <button style={{ ...S.btn, width: "100%", maxWidth: 340, marginBottom: 10, fontSize: 16 }} onClick={seguir}>
        Seguir e baixar o app
      </button>
      <button style={{ ...S.btnGhost, width: "100%", maxWidth: 340, fontWeight: 800 }}
        onClick={() => onEntrar({ seguiu: false })}>
        Entrar no app →
      </button>

      <button onClick={() => setAjuda(true)}
        style={{ border: "none", background: "transparent", color: "#E1306C", fontSize: 13,
          fontWeight: 800, textDecoration: "underline", cursor: "pointer", marginTop: 18, padding: 6 }}>
        Como instalar no meu celular?
      </button>

      <div style={{ fontSize: 12, color: "var(--cinza2)", marginTop: 14, lineHeight: 1.6, maxWidth: 320 }}>
        {temDados
          ? "Seus treinos continuam salvos neste aparelho. Esta tela aparece uma vez só."
          : "Esta tela aparece uma vez só. Depois o app abre direto."}
      </div>

      {ajuda && <ComoInstalar onFechar={() => setAjuda(false)} onCopiarLink={onCopiarLink} />}
    </div>
  );
}
function TreinoLivre() {
  const [aba, setAba] = useState("inicio");
  const [treinos, setTreinos] = useState([]);
  const [historico, setHistorico] = useState([]);
  const [customEx, setCustomEx] = useState([]);
  const [programas, setProgramas] = useState([]);
  const [progAberto, setProgAberto] = useState(null);
  const [descanso, setDescanso] = useState(90);
  const [som, setSom] = useState(true);
  const [tema, setTema] = useState("escuro");
  const [meta, setMeta] = useState(3);
  const [medidas, setMedidas] = useState([]);
  const [fotos, setFotos] = useState([]);   // só as datas; a imagem vive no IndexedDB
  const [lembrete, setLembrete] = useState({ ativo: false, hora: "18:00", dias: [1, 2, 3, 4, 5] });
  const [ultimoBackup, setUltimoBackup] = useState(null);
  const [editandoHistorico, setEditandoHistorico] = useState(null);
  // Quando a faixa de progresso da tela inicial é tocada, o histórico abre já
  // na aba de números em vez de na lista de treinos.
  const [secaoHistorico, setSecaoHistorico] = useState("treinos");
  const [festa, setFesta] = useState(null);
  // ---- Jarvis ----
  // "preferido" fica gravado (é a escolha de usar comandos por voz); "ativa" é
  // só desta visita, porque ligar um microfone sozinho ao abrir o app seria
  // uma surpresa desagradável.
  const [voz, setVoz] = useState({ preferido: false, falar: true, barra: 20, vozNome: null, velocidade: 1.1, animado: true, modo: "continuo", botaoFone: false, contarAlto: true, autoSerie: true, narrar: true });
  const [vozAtiva, setVozAtiva] = useState(false);
  const [vozEstado, setVozEstado] = useState("desligado");
  const noToque = voz.modo === "toque";
  const [vozParcial, setVozParcial] = useState("");
  const [vozUltima, setVozUltima] = useState(null);
  const [descansando, setDescansando] = useState(false);
  const [bpm, setBpm] = useState(null);           // batimento ao vivo
  const [cardioEstado, setCardioEstado] = useState("desligado");
  const cardioRef = useRef(null);
  const resumoCardioRef = useRef(null);
  const [ajudaVoz, setAjudaVoz] = useState(false);
  const [diagVoz, setDiagVoz] = useState(false);
  const [avisoToque, setAvisoToque] = useState(false);
  const [versaoNova, setVersaoNova] = useState(null);
  const acoesVoz = useRef({});
  const acoesEscola = useRef({});
  const ouvinte = useRef(null);
  const tratarFalaRef = useRef(null);
  // O ouvinte vive fora do React e precisa enxergar a configuração atual
  const vozRef = useRef(voz);
  const somRef = useRef(true);
  // Depois de uma resposta, dá para emendar o próximo comando sem repetir o
  // nome: entre duas séries ninguém quer dizer "Jarvis" quatro vezes seguidas.
  const janelaSeguir = useRef(0);
  const arquivoRef = useRef(null);
  const fotoExRef = useRef(null);
  const [carregado, setCarregado] = useState(false);

  // O monitor é escolhido pela pessoa na janela do navegador; nada é pareado
  // por conta própria. O resumo do treino acumula a partir daí.
  const conectarCardio = useCallback(async () => {
    if (!CARDIO_DISPONIVEL) {
      avisar("Este navegador não fala Bluetooth. No celular, use o Chrome do Android — e o monitor precisa ser de frequência cardíaca padrão (cinta peitoral, por exemplo).");
      return;
    }
    if (!cardioRef.current) {
      cardioRef.current = criarCardio({
        aoBpm: (v) => {
          setBpm(v);
          if (resumoCardioRef.current) resumoCardioRef.current.somar(v);
        },
        aoEstado: (e) => { setCardioEstado(e); if (e !== "ligado") setBpm(null); },
      });
    }
    try {
      if (!resumoCardioRef.current) resumoCardioRef.current = criarResumoCardio();
      const nome = await cardioRef.current.conectar();
      registrarEvento("cardio-conectado");
      setTimeout(() => avisar("Conectado a " + nome + ". O batimento aparece no treino e a média entra no histórico."), 100);
    } catch (e) {
      setCardioEstado("desligado");
      if (e && e.name === "NotFoundError") return;   // a pessoa fechou a lista
      avisar("Não consegui conectar. Confira se o monitor está ligado, perto, e não pareado com outro app.");
    }
  }, []);
  const desconectarCardio = useCallback(() => { if (cardioRef.current) cardioRef.current.desconectar(); }, []);

  const celebrar = useCallback((dados) => setFesta(dados), []);
  const fecharFesta = useCallback(() => setFesta(null), []);

  useEffect(() => {
    try { document.documentElement.setAttribute("data-tema", tema); } catch (e) {}
  }, [tema]);

  const [grupoAberto, setGrupoAberto] = useState(null);
  // A aula escolhida pela voz: a tela funcional abre o player já com ela.
  const [aulaPedida, setAulaPedida] = useState(null);
  // O convite para seguir aparece UMA vez, depois do terceiro treino, e some
  // para sempre quando respondido. Pedir antes disso é pedir a alguém que ainda
  // não sabe se o app presta; pedir de novo depois é insistência.
  const [convite, setConvite] = useState(true);
  // A portaria passou. Fica no mesmo registro do resto, então sobrevive a
  // recarga e a fechar o app, e acompanha o backup.
  const [entrou, setEntrou] = useState(false);
  // A abertura roda uma vez por carregamento. Não fica guardada: é a marca do
  // app, não um aviso a ser dispensado.
  const [abertura, setAbertura] = useState(true);
  // Quais dicas de primeiro contato já foram vistas. Some para sempre: dica que
  // volta não é dica, é propaganda.
  const [dicas, setDicas] = useState({});
  // Onde a pessoa pôs o botão do Jarvis. Guardado: quem o tirou da frente uma
  // vez não quer encontrá-lo de volta no caminho na próxima abertura.
  const [botaoVoz, setBotaoVoz] = useState(null);
  // A última gravação falhou? Vira faixa vermelha fixa, e não some sozinha.
  const [semGravar, setSemGravar] = useState(false);
  const marcarDica = (k) => setDicas((d) => (d[k] ? d : { ...d, [k]: 1 }));
  const [exercicioAberto, setExercicioAberto] = useState(null);
  const [editandoTreino, setEditandoTreino] = useState(null);
  const [baseNovoEx, setBaseNovoEx] = useState(null);   // exercício copiado ao criar variação
  const trocaFotoRef = useRef(null);                    // qual exercício está trocando a foto
  const [sessao, setSessao] = useState(null);
  const [modal, setModal] = useState(null);
  const [copiado, setCopiado] = useState(false);
  const [desfazer, setDesfazer] = useState(null);
  const importRef = useRef("");
  const pedirConfirmacao = (msg, onSim) => setModal({ msg, onSim });
  // Um aviso nunca atropela uma pergunta. A ficha recebida por link abre um
  // "deseja adicionar?", e o aviso do microfone — que chega sozinho logo depois,
  // para quem deixou a voz ligada — trocava a pergunta pelo aviso. A ficha se
  // perdia sem ninguém saber: o link compartilhado morria em silêncio.
  const avisar = (msg) => setModal((m) => (m && m.onSim ? m : { msg: msg }));

  // ---------- JARVIS: ouvir, responder e encaminhar ----------
  const mostrarVoz = useCallback((ouvi, resposta, ok) => {
    setVozParcial("");
    setVozUltima({ ouvi: ouvi || "", resposta: resposta || "", ok: ok !== false, t: Date.now() });
    // Um blip curto e uma vibração: na academia, com fone ou sem, é o jeito de
    // saber que o comando entrou sem esperar a frase inteira ser falada.
    if (ok !== false) {
      if (somRef.current) beep(1046, 0.06, 0.1);
      try { if (navigator.vibrate) navigator.vibrate(35); } catch (e) {}
    }
    if (resposta) jarvisFalar(resposta, vozRef.current);
    // A janela se renova a cada comando aceito. Um "não entendi" não renova,
    // mas também não encurta o que já estava valendo: fechar a janela por causa
    // de uma frase mal ouvida é tirar o chão de quem está no meio de um comando.
    if (ok !== false) janelaSeguir.current = Date.now() + 15000;
  }, []);
  const responderVoz = useCallback((texto, ok) => mostrarVoz("", texto, ok), [mostrarVoz]);
  // A escola fala por conta própria: o retorno dela já está na tela, e abrir a
  // faixa do painel por cima da lição só atrapalharia.
  const falarJarvis = useCallback((texto) => jarvisFalar(texto, vozRef.current), []);

  const ligarVoz = useCallback(() => {
    if (!VOZ_OUVE) {
      avisar("Este navegador não reconhece voz. No celular, abra o app pelo Chrome — é onde o Jarvis funciona melhor.");
      return;
    }
    if (!ouvinte.current) {
      ouvinte.current = criarOuvinte({
        aoParcial: (t) => setVozParcial(t),
        aoFinal: (t, alts) => { if (tratarFalaRef.current) tratarFalaRef.current(t, alts); },
        aoEstado: (e) => {
          setVozEstado(e);
          // No modo toque cada comando é uma sessão: quando ela acaba, o botão
          // volta a ser um convite para falar de novo.
          if (e === "desligado" && ouvinte.current && ouvinte.current.noModoToque()) setVozAtiva(false);
        },
        // O Android encerra a sessão a cada silêncio: religar sem parar faz o

        aoTumulto: () => {

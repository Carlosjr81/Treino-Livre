// ---------------- FREQUÊNCIA CARDÍACA (Bluetooth) ----------------
// O que dá para fazer de dentro de um site, e o que não dá — vale deixar escrito
// aqui, porque a pergunta volta:
//
//   FUNCIONA: qualquer monitor que exponha o serviço padrão de frequência
//   cardíaca do Bluetooth (0x180D) — cintas peitorais Polar/Garmin/Wahoo,
//   sensores de braço, e alguns relógios. O navegador fala direto com ele, sem
//   app nenhum no meio e sem servidor.
//
//   NÃO FUNCIONA: ler o Google Fit, o Health Connect ou o Apple Health. São APIs
//   de sistema operacional, só alcançáveis por um aplicativo instalado pela
//   loja. A API REST do Google Fit, que permitiria algo parecido, foi
//   descontinuada pelo próprio Google. Não é limitação do aparelho: é o que a
//   web tem permissão de fazer. Anéis inteligentes, no geral, também não
//   expõem o serviço padrão — guardam os dados para o app da marca.

const CARDIO_DISPONIVEL = typeof navigator !== "undefined" && !!navigator.bluetooth;

// Lê o padrão 0x2A37: o primeiro byte diz se o valor vem em 1 ou 2 bytes.
function lerBpm(dv) {
  if (!dv || dv.byteLength < 2) return null;
  const flags = dv.getUint8(0);
  return flags & 0x01 ? dv.getUint16(1, true) : dv.getUint8(1);
}

function criarCardio(opcoes) {
  const o = opcoes || {};
  let dispositivo = null;
  let caracteristica = null;

  const aoMudar = (ev) => {
    const bpm = lerBpm(ev.target.value);
    if (bpm && bpm > 25 && bpm < 240 && o.aoBpm) o.aoBpm(bpm);
  };
  const aoCair = () => {
    caracteristica = null;
    if (o.aoEstado) o.aoEstado("caiu");
  };

  return {
    async conectar() {
      if (!CARDIO_DISPONIVEL) throw new Error("sem bluetooth");
      if (o.aoEstado) o.aoEstado("procurando");
      // O navegador abre a lista de aparelhos e a pessoa escolhe. Sem escolha
      // explícita não há conexão — e é assim que tem de ser.
      dispositivo = await navigator.bluetooth.requestDevice({ filters: [{ services: ["heart_rate"] }] });
      dispositivo.addEventListener("gattserverdisconnected", aoCair);
      const servidor = await dispositivo.gatt.connect();
      const servico = await servidor.getPrimaryService("heart_rate");
      caracteristica = await servico.getCharacteristic("heart_rate_measurement");
      await caracteristica.startNotifications();
      caracteristica.addEventListener("characteristicvaluechanged", aoMudar);
      if (o.aoEstado) o.aoEstado("ligado");
      return dispositivo.name || "Monitor";
    },
    desconectar() {
      try { if (caracteristica) caracteristica.removeEventListener("characteristicvaluechanged", aoMudar); } catch (e) {}
      try { if (dispositivo && dispositivo.gatt.connected) dispositivo.gatt.disconnect(); } catch (e) {}
      caracteristica = null;
      if (o.aoEstado) o.aoEstado("desligado");
    },
    ligado() { return !!caracteristica; },
  };
}

// Acumula os batimentos do treino para virar média e máximo no histórico.
// Um número por treino diz mais do que o gráfico que ninguém abre.
function criarResumoCardio() {
  let soma = 0, n = 0, max = 0;
  return {
    somar(bpm) { soma += bpm; n++; if (bpm > max) max = bpm; },
    fechar() { return n ? { medio: Math.round(soma / n), max: max, amostras: n } : null; },
  };
}

// ---------------- JARVIS EYES SCAN: CONTAR REPETIÇÃO PELA CÂMERA ----------------
// Apoia o celular, o app enxerga o corpo inteiro e conta as repetições sozinho.
// No fim da série, o número já vai para a ficha — nem falar é preciso.
//
// O reconhecimento de pose roda INTEIRO no aparelho (MediaPipe, 33 pontos, na
// GPU). Nenhuma imagem sai do celular: não há servidor para onde mandar, e não
// haveria mesmo que houvesse.
//
// A biblioteca e o modelo pesam uns 8 MB e são baixados SÓ quando esta tela é
// aberta pela primeira vez. O app continua abrindo com meio mega como sempre —
// quem nunca usar o scanner não paga nada por ele.

const EYES_LIB = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const EYES_WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const EYES_MODELO = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

let eyesDetector = null;
let eyesCarregando = null;
// Carrega sob demanda e uma vez só. Trocar de exercício ou sair e voltar à tela
// não pode baixar 8 MB de novo.
function carregarEyes() {
  if (eyesDetector) return Promise.resolve(eyesDetector);
  if (eyesCarregando) return eyesCarregando;
  eyesCarregando = (async () => {
    const vision = await import(EYES_LIB);
    const fileset = await vision.FilesetResolver.forVisionTasks(EYES_WASM);
    eyesDetector = await vision.PoseLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: EYES_MODELO, delegate: "GPU" },
      runningMode: "VIDEO",
      numPoses: 1,
      minPoseDetectionConfidence: 0.5,
      minPosePresenceConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });
    return eyesDetector;
  })();
  eyesCarregando.catch(() => { eyesCarregando = null; });
  return eyesCarregando;
}

// Os ossos que ligam os 33 pontos do MediaPipe. Só o tronco e os membros: o
// rosto tem 11 pontos que não dizem nada sobre agachamento e poluem a tela.
const EYES_OSSOS = [
  [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
  [11, 23], [12, 24], [23, 24],
  [23, 25], [25, 27], [27, 31], [24, 26], [26, 28], [28, 32],
];
const EYES_PONTOS = [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];

// Ângulo em graus no vértice b. É daqui que sai todo o resto: a repetição é uma
// ida e volta de algum ângulo do corpo.
function anguloEntre(a, b, c) {
  if (!a || !b || !c) return null;
  const v1x = a.x - b.x, v1y = a.y - b.y;
  const v2x = c.x - b.x, v2y = c.y - b.y;
  const n1 = Math.hypot(v1x, v1y), n2 = Math.hypot(v2x, v2y);
  if (n1 < 1e-6 || n2 < 1e-6) return null;
  let cos = (v1x * v2x + v1y * v2y) / (n1 * n2);
  cos = Math.max(-1, Math.min(1, cos));
  return (Math.acos(cos) * 180) / Math.PI;
}
// Ponto só vale se o modelo tiver alguma confiança nele. Membro escondido atrás
// do corpo devolve coordenada inventada, e contar por cima disso é contar lixo.
const visivel = (p) => p && (p.visibility === undefined || p.visibility > 0.5);
const pt = (lm, i) => (visivel(lm[i]) ? lm[i] : null);

// Os candidatos a "sinal da repetição". Em vez de exigir configuração por
// exercício — impossível com 204 exercícios e as máquinas que ninguém catalogou —
// o scanner mede todos e fica com o que mais se mexe.
const EYES_SINAIS = [
  { id: "cotovelo-e", nome: "cotovelo esquerdo", calc: (l) => anguloEntre(pt(l, 11), pt(l, 13), pt(l, 15)) },
  { id: "cotovelo-d", nome: "cotovelo direito", calc: (l) => anguloEntre(pt(l, 12), pt(l, 14), pt(l, 16)) },
  { id: "joelho-e", nome: "joelho esquerdo", calc: (l) => anguloEntre(pt(l, 23), pt(l, 25), pt(l, 27)) },
  { id: "joelho-d", nome: "joelho direito", calc: (l) => anguloEntre(pt(l, 24), pt(l, 26), pt(l, 28)) },
  { id: "quadril-e", nome: "quadril esquerdo", calc: (l) => anguloEntre(pt(l, 11), pt(l, 23), pt(l, 25)) },
  { id: "quadril-d", nome: "quadril direito", calc: (l) => anguloEntre(pt(l, 12), pt(l, 24), pt(l, 26)) },
  { id: "ombro-e", nome: "ombro esquerdo", calc: (l) => anguloEntre(pt(l, 23), pt(l, 11), pt(l, 13)) },
  { id: "ombro-d", nome: "ombro direito", calc: (l) => anguloEntre(pt(l, 24), pt(l, 12), pt(l, 14)) },
];

// Qual sinal o grupo muscular sugere. Não decide sozinho — só desempata quando
// dois sinais se mexem parecido, o que acontece sempre (o corpo é inteiro).
const EYES_PREFERENCIA = {
  peito: ["cotovelo-e", "cotovelo-d"],
  costas: ["cotovelo-e", "cotovelo-d"],
  biceps: ["cotovelo-e", "cotovelo-d"],
  triceps: ["cotovelo-e", "cotovelo-d"],
  ombros: ["ombro-e", "ombro-d", "cotovelo-e", "cotovelo-d"],
  pernas: ["joelho-e", "joelho-d", "quadril-e", "quadril-d"],
  gluteos: ["quadril-e", "quadril-d", "joelho-e", "joelho-d"],
  abdomen: ["quadril-e", "quadril-d"],
};

// ---- O contador ----
// Uma repetição é uma ida e volta: o sinal sai de "em baixo", passa de "em
// cima" e volta. Contar no cruzamento simples contaria dez vezes o tremor da
// mão no meio do caminho — daí os dois limiares separados (histerese) e o tempo
// mínimo entre repetições.
// Quatro segundos: cobre duas repetições no ritmo normal e uma repetição bem
// lenta. Menos que isso e uma repetição de 4s se normalizaria contra si mesma;
// mais que isso e o contador demora a perceber a amplitude caindo.
const JANELA_MS = 4000;
function criarContador(opcoes) {
  const o = opcoes || {};
  const preferidos = o.preferidos || [];
  const aoContar = o.aoContar;
  const minMs = o.minMs || 550;      // repetição mais rápida que isso é ruído
  const amostras = {};               // id -> { min, max, valor }
  let escolhido = null;
  let estado = "baixo";
  let ultimaRep = 0;
  let total = 0;
  let desde = 0;
  let amplitude = 0;
  // O percurso de CADA repetição, medido entre uma contagem e a seguinte.
  // É com isso que dá para dizer se esta foi mais completa que as anteriores.
  let repMin = Infinity, repMax = -Infinity;
  let melhorAmp = 0, somaAmp = 0, nAmp = 0, somaDur = 0, nDur = 0;

  const faixaDe = (s) => (s && s.max > s.min && isFinite(s.min) ? s.max - s.min : 0);

  return {
    // Devolve o que mudou, para a tela desenhar sem recalcular nada
    processar(lm, agora) {
      if (!desde) desde = agora;
      // 1. mede todos os sinais e guarda os últimos 4 segundos de cada um.
      // A janela corrida é o que faz o contador acompanhar a amplitude quando
      // ela encolhe — e ela encolhe sempre, porque é isso que o cansaço faz.
      // Com bordas que cediam devagar, ele parava de contar justamente nas
      // últimas repetições, as que mais custam.
      EYES_SINAIS.forEach((s) => {
        const v = s.calc(lm);
        if (v === null) return;
        const a = amostras[s.id] || (amostras[s.id] = { hist: [], valor: v, suave: v, min: v, max: v });
        // um pouco de suavização antes de guardar: um quadro ruim do modelo não
        // pode esticar a janela inteira por quatro segundos
        a.suave = a.suave + (v - a.suave) * 0.4;
        a.valor = a.suave;
        a.hist.push(agora, a.suave);
        while (a.hist.length > 2 && agora - a.hist[0] > JANELA_MS) a.hist.splice(0, 2);
        let mn = Infinity, mx = -Infinity;
        for (let i = 1; i < a.hist.length; i += 2) {
          const x = a.hist[i];
          if (x < mn) mn = x;
          if (x > mx) mx = x;
        }
        a.min = mn; a.max = mx;
      });

      // 2. escolhe o sinal: o de maior amplitude, com desempate pelo grupo
      const candidatos = EYES_SINAIS.map((s) => ({ id: s.id, nome: s.nome, faixa: faixaDe(amostras[s.id]) }))
        .filter((c) => c.faixa > 0)
        .sort((a, b) => b.faixa - a.faixa);
      if (candidatos.length) {
        const topo = candidatos[0];
        // Entre sinais parecidos (dentro de 20%), o que o grupo muscular indica ganha
        const perto = candidatos.filter((c) => c.faixa >= topo.faixa * 0.8);
        const pref = perto.find((c) => preferidos.indexOf(c.id) >= 0);
        const novo = (pref || topo).id;
        // Só troca de sinal antes de começar a contar: trocar no meio da série
        // zeraria a referência e perderia a conta.
        if (!escolhido || (total === 0 && novo !== escolhido)) escolhido = novo;
      }
      if (!escolhido) return { total: total, pronto: false };

      const a = amostras[escolhido];
      amplitude = faixaDe(a);
      // 3. amplitude pequena demais é a pessoa parada enquanto o modelo treme
      if (amplitude < 22) return { total: total, pronto: false, amplitude: amplitude, sinal: escolhido };

      // 4. normaliza para 0..1 e conta a ida e volta
      const n = (a.valor - a.min) / amplitude;
      // o percurso desta repetição, em graus de verdade e não normalizado
      if (a.valor < repMin) repMin = a.valor;
      if (a.valor > repMax) repMax = a.valor;
      let contou = false;
      let qualidade = null;
      if (estado === "baixo" && n > 0.72) estado = "cima";
      else if (estado === "cima" && n < 0.28) {
        estado = "baixo";
        if (agora - ultimaRep > minMs) {
          const amp = repMax > repMin ? repMax - repMin : 0;
          const dur = ultimaRep ? agora - ultimaRep : 0;
          ultimaRep = agora;
          total++;
          contou = true;
          // Comparações só valem a partir da segunda repetição: a primeira é a
          // própria referência, e elogiar a primeira por ser a melhor é bobagem.
          const mediaAmp = nAmp ? somaAmp / nAmp : 0;
          const mediaDur = nDur ? somaDur / nDur : 0;
          qualidade = {
            amplitude: Math.round(amp),
            duracao: Math.round(dur),
            melhor: nAmp > 0 && amp > melhorAmp * 1.04,
            caindo: nAmp > 1 && amp < mediaAmp * 0.84,
            rapida: nDur > 1 && dur > 0 && dur < mediaDur * 0.68,
            constante: nAmp > 1 && Math.abs(amp - mediaAmp) < mediaAmp * 0.08,
          };
          if (amp > 0) { if (amp > melhorAmp) melhorAmp = amp; somaAmp += amp; nAmp++; }
          if (dur > 0) { somaDur += dur; nDur++; }
          repMin = Infinity; repMax = -Infinity;
          if (aoContar) aoContar(total, qualidade);
        }
      }
      return { total: total, pronto: true, contou: contou, qualidade: qualidade, n: n, amplitude: amplitude, sinal: escolhido };
    },
    zerar() {
      total = 0; estado = "baixo"; ultimaRep = 0;
      repMin = Infinity; repMax = -Infinity;
      melhorAmp = 0; somaAmp = 0; nAmp = 0; somaDur = 0; nDur = 0;
    },
    // Serve ao "desfazer" quando o scanner conta uma a mais
    ajustar(n) { total = Math.max(0, n); },
    estado() {
      const s = EYES_SINAIS.find((x) => x.id === escolhido);
      return { total: total, sinal: escolhido, nomeSinal: s ? s.nome : null, amplitude: Math.round(amplitude) };
    },
  };
}

// ---- O técnico ----
// Um parceiro de treino não comenta todas as repetições: isso vira ruído e
// atropela a contagem. Ele fica quieto, e quando fala é porque viu alguma
// coisa. Aqui é a mesma regra — no máximo um comentário a cada três
// repetições, correção antes de elogio, e nunca a mesma frase duas vezes.
const FRASES_TECNICO = {
  melhor: [
    "Essa foi mais completa.",
    "Amplitude melhor que as anteriores.",
    "Isso. Assim mesmo.",
    "Essa saiu melhor executada.",
  ],
  caindo: [
    "Desce mais um pouco.",
    "A amplitude está caindo. Abre o movimento.",
    "Completa o movimento até o fim.",
    "Está encurtando. Vai até embaixo.",
  ],
  rapida: [
    "Controla a descida.",
    "Mais devagar. Não joga o peso.",
    "Segura a volta.",
  ],
  constante: [
    "Continue assim.",
    "Ritmo bom.",
    "Firme nesse ritmo.",
    "Está controlado. Mantém.",
  ],
  animo: [
    "Continue assim.",
    "Boa. Não para.",
    "Firme.",
    "Aguenta mais um pouco.",
  ],
};
function criarTecnico() {
  let ultimaEm = -99;      // em qual repetição falou pela última vez
  let ditas = {};          // última frase de cada tipo, para não repetir
  const escolher = (tipo) => {
    const lista = FRASES_TECNICO[tipo] || [];
    if (!lista.length) return null;
    let i = Math.floor(Math.random() * lista.length);
    if (lista[i] === ditas[tipo] && lista.length > 1) i = (i + 1) % lista.length;
    ditas[tipo] = lista[i];
    return lista[i];
  };
  return {
    // Devolve a frase a dizer depois do número, ou null para ficar calado.
    comentar(n, q, alvo) {
      // A última e a penúltima falam sempre: é a informação que muda o que fazer.
      if (alvo > 0 && n === alvo - 1) { ultimaEm = n; return "Última. Segura."; }
      if (alvo > 0 && n >= alvo) return null;   // o “completou” já vem com o número
      if (!q) return null;
      if (n - ultimaEm < 3) return null;        // o silêncio entre comentários é parte do método
      // Correção vem antes de elogio: quem está errando precisa saber primeiro.
      let tipo = q.rapida ? "rapida" : q.caindo ? "caindo" : q.melhor ? "melhor" : null;
      if (!tipo && q.constante && n % 4 === 0) tipo = "constante";
      if (!tipo && n % 6 === 0) tipo = "animo";
      if (!tipo) return null;
      ultimaEm = n;
      return escolher(tipo);
    },
    zerar() { ultimaEm = -99; ditas = {}; },
  };
}

// Calorias é sempre estimativa, e dizer isso é parte da honestidade do número.
// MET médio de musculação (5.0) sobre o tempo, com o peso do usuário quando ele
// já registrou uma medida.
function caloriasEstimadas(segundos, pesoKg) {
  const peso = parseFloat(pesoKg) || 75;
  return Math.round((5.0 * 3.5 * peso / 200) * (segundos / 60));
}

// ---------------- JARVIS: O ASSISTENTE DE VOZ ----------------
// Digitar peso e repetições com a mão suada, entre uma série e outra, é o que
// mais atrapalha o registro do treino. O Jarvis resolve isso ouvindo: a pessoa
// fala, o app anota, marca a série, começa o descanso e avisa no fim.
//
// Tudo roda no próprio aparelho, pela Web Speech API do navegador — sem
// servidor e sem chave de API, que é a restrição do projeto. Em troca, a
// qualidade depende do navegador: é boa no Chrome (Android e computador) e
// irregular no iPhone. Por isso os campos digitáveis continuam todos lá: o
// Jarvis é um atalho, nunca o único caminho.

const ReconhecedorVoz = typeof window !== "undefined" ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
const VOZ_OUVE = !!ReconhecedorVoz;
const VOZ_FALA = typeof window !== "undefined" && !!window.speechSynthesis;

// ---- Fala (resposta do Jarvis) ----
// Enquanto o Jarvis fala, o microfone continua ligado e ouve a própria voz.
// Parar o reconhecimento a cada frase faria o Android apitar o tempo todo, então
// em vez disso marcamos uma janela em que tudo o que chega é descartado.
// Um assistente de voz que falha falha em silêncio: a pessoa fala, nada
// acontece, e não há como saber se o microfone morreu, se o nome não foi
// reconhecido ou se a frase não virou comando. Este diário responde isso — e
// é copiável, para poder ser mostrado a quem conserta.
const DIARIO_JARVIS = [];
function anotarDiario(ouvi, nota) {
  DIARIO_JARVIS.unshift({ hora: new Date().toLocaleTimeString("pt-BR"), ouvi: ouvi || "", nota: nota || "" });
  if (DIARIO_JARVIS.length > 40) DIARIO_JARVIS.length = 40;
}

let jarvisFalandoAte = 0;
// O que ele está dizendo neste instante, para separar o eco da própria voz de
// uma interrupção de verdade.
let jarvisDizendo = "";
// A lista de vozes chega vazia na primeira chamada em quase todo navegador e
// só se preenche depois. Guardar a última lista boa evita o seletor piscar.
let vozesGuardadas = [];
function vozesPtBr() {
  try {
    const vs = window.speechSynthesis.getVoices() || [];
    const pt = vs.filter((v) => /^pt/i.test(v.lang));
    if (pt.length) vozesGuardadas = pt;
  } catch (e) {}
  return vozesGuardadas;
}
// "Microsoft Francisca Online (Natural) - Portuguese (Brazil)" não cabe num botão.
function nomeCurtoVoz(v) {
  const n = String((v && v.name) || "")
    .replace(/^microsoft\s+/i, "")
    .replace(/^google\s+/i, "")
    .replace(/\s*online\s*\(natural\)/i, "")
    .replace(/\s*[-–]\s*portugu(ê|e)s.*$/i, "")
    .replace(/\s*\([^)]*\)\s*$/, "")
    .trim();
  return n || (v && v.name) || "Voz";
}
function escolherVozPtBr(nome) {
  const vs = vozesPtBr();
  if (!vs.length) return null;
  if (nome) {
    const achada = vs.find((v) => v.name === nome);
    if (achada) return achada;
  }
  return vs.find((v) => /pt[-_]BR/i.test(v.lang) && /google|natural/i.test(v.name)) ||
    vs.find((v) => /pt[-_]BR/i.test(v.lang)) || vs[0];
}
// O texto das respostas é escrito para a tela. Lido em voz alta, o "×" de
// "80 kg × 10" simplesmente não é pronunciado (vira "80 kg 10", que soa como
// se ele não tivesse entendido as repetições) e "kg" sai soletrado.
function textoParaFala(t) {
  return String(t || "")
    .replace(/\s*×\s*/g, " por ")
    .replace(/(\d)\s*°/g, "$1 graus")
    .replace(/\s*·\s*/g, ", ")
    .replace(/\bkg\b/g, "quilos")
    .replace(/\s+/g, " ")
    .trim();
}

// cfg é a configuração de voz do app: { falar, vozNome, velocidade }
function jarvisFalar(texto, cfg) {
  if (!texto) return;
  // A janela de silêncio vale mesmo com a voz desligada: sem ela, o bipe e o
  // barulho logo depois da resposta viram comando.
  jarvisFalandoAte = Date.now() + 500;
  if (!cfg || !cfg.falar || !VOZ_FALA) return;
  try {
    // Em fila, o comentário do técnico entra DEPOIS do número em vez de
    // cortá-lo no meio. Sem isto, "sete" virava "se-" e o resto se perdia.
    if (!cfg.fila) window.speechSynthesis.cancel();
    const dito = textoParaFala(texto);
    const u = new SpeechSynthesisUtterance(dito);
    u.lang = "pt-BR";
    // Um parceiro de treino não fala como quem lê um extrato bancário. Tom mais
    // alto e ritmo um pouco acima do normal é o que separa "80 quilos por 10"
    // dito com energia de um aviso de aeroporto.
    const animado = cfg.animado !== false;
    u.rate = (cfg.velocidade || 1.1) + (animado ? 0.06 : 0);
    u.pitch = animado ? 1.22 : 1;
    u.volume = 1;
    const v = escolherVozPtBr(cfg.vozNome);
    if (v) { u.voice = v; u.lang = v.lang; }
    // Estimativa de duração como rede de segurança: em alguns navegadores o
    // "onend" simplesmente não dispara.
    // Na fila, a janela de silêncio soma ao que já estava previsto
    const base = cfg.fila ? Math.max(jarvisFalandoAte, Date.now()) : Date.now();
    jarvisFalandoAte = base + Math.min(16000, 1000 + (dito.length * 95) / u.rate);
    jarvisDizendo = (cfg.fila ? jarvisDizendo : " ") + normalizarFala(dito) + " ";
    u.onend = () => { jarvisFalandoAte = Date.now() + 400; jarvisDizendo = ""; };
    u.onerror = () => { jarvisFalandoAte = Date.now() + 400; jarvisDizendo = ""; };
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function calarJarvis() {
  try { if (VOZ_FALA) window.speechSynthesis.cancel(); } catch (e) {}
  jarvisFalandoAte = 0;
  jarvisDizendo = "";
}
// É a voz dele voltando pelo microfone, ou a pessoa falando por cima?
// Comparar com o que ele está dizendo separa os dois casos.
function ecoDaPropriaVoz(txt) {
  if (!jarvisDizendo) return false;
  const p = normalizarFala(txt).split(" ").filter((x) => x.length > 2);
  if (!p.length) return true;
  let dentro = 0;
  p.forEach((x) => { if (jarvisDizendo.indexOf(" " + x + " ") >= 0) dentro++; });
  return dentro / p.length >= 0.6;
}

// ---- Jeito de falar ----
// A mesma palavra toda série cansa em dez minutos. Estas listas giram, e nunca
// repetem a de antes — é o que faz o Jarvis soar como alguém, e não como um
// aviso gravado.
const ANIMO_ANOTOU = ["Boa!", "Isso!", "Show!", "Mandou bem!", "É isso aí!", "Firme!", "Pegou bem!"];
const ANIMO_VOLTA = ["Bora!", "Vamos que vamos!", "Hora de voltar!", "Partiu a próxima!", "Tá na hora!"];
const ultimoAnimo = {};
function animo(lista, chave) {
  if (!lista.length) return "";
  let i = Math.floor(Math.random() * lista.length);
  if (i === ultimoAnimo[chave] && lista.length > 1) i = (i + 1) % lista.length;
  ultimoAnimo[chave] = i;
  return lista[i];
}

// ---- Números por extenso ----
// O reconhecimento às vezes devolve "quarenta e cinco" e às vezes "45". Aqui
// tudo vira dígito antes de qualquer outra leitura.
const NUM_UNIDADE = {
  zero: 0, um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6,
  sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12, treze: 13, catorze: 14,
  quatorze: 14, quinze: 15, dezesseis: 16, dezessete: 17, dezoito: 18, dezenove: 19,
};
const NUM_DEZENA = { vinte: 20, trinta: 30, quarenta: 40, cinquenta: 50, sessenta: 60, setenta: 70, oitenta: 80, noventa: 90 };
const NUM_CENTENA = { cem: 100, cento: 100, duzentos: 200, trezentos: 300, quatrocentos: 400, quinhentos: 500, seiscentos: 600, setecentos: 700, oitocentos: 800, novecentos: 900 };
const ehPalavraNumero = (p) => NUM_UNIDADE[p] !== undefined || NUM_DEZENA[p] !== undefined || NUM_CENTENA[p] !== undefined;
const ehMetade = (p) => p === "meio" || p === "meia";

function numerosPorExtenso(txt) {
  const t = String(txt).split(" ");
  const saida = [];
  let i = 0;
  while (i < t.length) {
    if (!ehPalavraNumero(t[i]) && !ehMetade(t[i])) { saida.push(t[i]); i++; continue; }
    let soma = 0, j = i, achou = false;
    if (ehMetade(t[i])) { soma = 0.5; j = i + 1; achou = true; }
    while (j < t.length) {
      const p = t[j];
      if (NUM_CENTENA[p] !== undefined) { soma += NUM_CENTENA[p]; achou = true; j++; }
      else if (NUM_DEZENA[p] !== undefined) { soma += NUM_DEZENA[p]; achou = true; j++; }
      else if (NUM_UNIDADE[p] !== undefined) { soma += NUM_UNIDADE[p]; achou = true; j++; }
      else if (p === "e" && achou && (ehPalavraNumero(t[j + 1]) || ehMetade(t[j + 1]))) { j++; }
      else if (ehMetade(p) && achou) { soma += 0.5; j++; }
      else break;
    }
    if (!achou) { saida.push(t[i]); i++; continue; }
    saida.push(String(Math.round(soma * 100) / 100));
    i = j;
  }
  return saida.join(" ");
}

// ---- Normalização da frase ouvida ----
function normalizarFala(bruto) {
  let s = String(bruto || "").toLowerCase();
  s = s.replace(/(\d)[,.](\d)/g, "$1.$2");          // 42,5 e 42.5 viram o mesmo número
  s = semAcento(s).replace(/[^a-z0-9. ]+/g, " ");
  s = s.replace(/(\d)\s*(kgs|kg|k)\b/g, "$1 kg");   // "40kg" -> "40 kg"
  s = s.replace(/(\d)([a-z])/g, "$1 $2").replace(/([a-z])(\d)/g, "$1 $2");
  s = s.replace(/\s+/g, " ").trim();
  s = numerosPorExtenso(s);
  // Sinônimos: tudo cai num vocabulário único, para as expressões ficarem simples
  s = s
    .replace(/\b(quilos|quilo|kilos|kilo|quilogramas|kgs|kg)\b/g, "kg")
    .replace(/\b(repeticoes|repeticao|repeticos|reps|rep|repts|vezes|vez)\b/g, "reps")
    .replace(/\b(segundos|segundo|segs|seg)\b/g, "seg")
    .replace(/\b(minutos|minuto|mins|min|minutinhos|minutinho)\b/g, "min")
    .replace(/\b(series|serie|seria)\b/g, "serie")
    .replace(/\b(exercicios|exercicio)\b/g, "exercicio")
    .replace(/\s+/g, " ")
    .trim();
  return s;
}

// ---- Palavra de ativação ----
// O reconhecimento erra o nome com frequência ("jarves", "javis", "charles").
// Aceitar as variantes é a diferença entre um assistente que responde e um que
// faz a pessoa repetir três vezes no meio da academia.
// Colhidos de diagnósticos reais: o reconhecimento devolveu todos estes no
// lugar de "Jarvis". "James" e "Charles" são os campeões.
const APELIDOS_JARVIS = ["jarvis", "jarves", "jarvez", "jarvi", "jarbas", "jarvas", "javis", "javes",
  "jervis", "jarvix", "jaivis", "garvis", "harvis", "charles", "charlies", "charlie", "jarbes",
  "darvis", "arvis", "jarvisi", "james", "jamis", "jaime", "travis", "tarvis", "harvey", "jarvys"];
function distanciaTexto(a, b) {
  // Levenshtein com teto baixo: só interessa saber se é "praticamente a mesma palavra"
  if (Math.abs(a.length - b.length) > 2) return 9;
  const n = b.length;
  let linha = Array.from({ length: n + 1 }, (_, k) => k);
  for (let i = 1; i <= a.length; i++) {
    let ant = linha[0];
    linha[0] = i;
    for (let j = 1; j <= n; j++) {
      const tmp = linha[j];
      linha[j] = Math.min(linha[j] + 1, linha[j - 1] + 1, ant + (a[i - 1] === b[j - 1] ? 0 : 1));
      ant = tmp;
    }
  }
  return linha[n];
}
// No celular, num ginásio barulhento, o nome sai com mais estrago do que num
// teste de mesa. Uma letra de tolerância não bastava.
const pareceJarvis = (p) => APELIDOS_JARVIS.indexOf(p) >= 0 || (p.length >= 5 && p.length <= 8 && distanciaTexto(p, "jarvis") <= 2);
// Devolve o que vem DEPOIS do nome, ou null se o nome não foi dito
function depoisDeJarvis(frase) {
  const t = String(frase || "").split(" ");
  for (let i = 0; i < t.length; i++) {
    if (pareceJarvis(t[i])) return t.slice(i + 1).join(" ").trim();
    // "jar vis": o reconhecimento às vezes parte o nome em duas palavras
    if (i + 1 < t.length && pareceJarvis(t[i] + t[i + 1])) return t.slice(i + 2).join(" ").trim();
  }
  return null;
}

// ---- Encontrar o exercício dito ----
const PALAVRAS_VAZIAS = ["com", "de", "da", "do", "na", "no", "em", "para", "pelo", "pela", "sem", "ao", "aos", "e", "a", "o", "os", "as", "um", "uma"];
// Como as pessoas realmente chamam os exercícios na academia
const APELIDOS_EXERCICIO = [
  ["supino", "supino-reto"], ["supino reto", "supino-reto"], ["supino inclinado", "supino-inclinado"],
  ["agacho", "agachamento"], ["leg", "leg-press"], ["leg press", "leg-press"],
  ["terra", "levantamento-terra"], ["rosca", "rosca-direta"], ["rosca direta", "rosca-direta"],
  ["triceps", "triceps-polia"], ["triceps na polia", "triceps-polia"], ["triceps corda", "triceps-corda"],
  ["puxada", "puxada-frente"], ["pulley", "puxada-frente"], ["polia alta", "puxada-frente"],
  ["remada", "remada-baixa"], ["cavalinho", "remada-cavalinho"],
  ["elevacao lateral", "elevacao-lateral"], ["lateral", "elevacao-lateral"],
  ["extensora", "cadeira-extensora"], ["cadeira extensora", "cadeira-extensora"],
  ["flexora", "mesa-flexora"], ["mesa flexora", "mesa-flexora"], ["adutora", "cadeira-adutora"],
  ["panturrilha", "panturrilha"], ["gemeos", "panturrilha"], ["abdominal", "abdominal-supra"],
  ["abdominal supra", "abdominal-supra"], ["crucifixo", "crucifixo"],
  ["peck deck", "peck-deck"], ["voador", "peck-deck"], ["crossover", "crossover"],
  ["barra fixa", "barra-fixa"], ["flexao", "flexao"], ["stiff", "stiff"], ["afundo", "afundo"],
  ["bulgaro", "agachamento-bulgaro"], ["hack", "agachamento-hack"], ["encolhimento", "encolhimento"],
  ["face pull", "face-pull"], ["martelo", "rosca-martelo"], ["scott", "rosca-scott"],
  ["testa", "triceps-testa"], ["frances", "triceps-frances"], ["paralela", "paralelas-peito"],
  ["mergulho", "mergulho-banco"], ["arnold", "desenvolvimento-arnold"], ["elevacao frontal", "elevacao-frontal"],
  ["remada alta", "remada-alta"], ["remada baixa", "remada-baixa"], ["remada curvada", "remada-curvada"],
  ["prancha", "prancha"], ["abdominal infra", "abdominal-infra"], ["ponte", "ponte-gluteo"], ["pelvica", "elevacao-pelvica-halter"],
];
function pontuarExercicio(ex, frase) {
  const nome = semAcento(ex.nome);
  if (frase.indexOf(" " + nome + " ") >= 0) return { inteiro: true, achados: 9, letras: nome.length, cobertura: 1 };
  const toks = nome.split(/[^a-z0-9]+/).filter((p) => p.length > 2 && PALAVRAS_VAZIAS.indexOf(p) < 0);
  if (!toks.length) return null;
  let achados = 0, letras = 0, total = 0;
  toks.forEach((p) => {
    total += p.length;
    if (frase.indexOf(p) >= 0) { achados++; letras += p.length; }
  });
  // Metade das palavras do nome precisa aparecer: sem isso "remada" casaria com
  // "remada alta com barra W" tão bem quanto com "remada baixa".
  if (!achados || achados / toks.length < 0.5) return null;
  return { inteiro: false, achados: achados, letras: letras, cobertura: letras / total };
}
// Procura numa lista só. Quem acerta MAIS palavras do nome ganha de quem acerta
// uma só: "rosca direta" tem de vencer "Rosca 21", que casa 100% de uma palavra.
function melhorDaLista(limpa, lista) {
  let melhor = null, m = null;
  lista.forEach((ex) => {
    const r = pontuarExercicio(ex, limpa);
    if (!r) return;
    if (!m || r.achados > m.achados || (r.achados === m.achados && r.cobertura > m.cobertura)) { m = r; melhor = ex; }
  });
  return melhor ? { ex: melhor, r: m } : null;
}
// Apelido de academia: o nome curto que todo mundo usa ("agacho", "extensora").
function porApelido(limpa, lista) {
  let id = null, tamanho = 0;
  APELIDOS_EXERCICIO.forEach((par) => {
    if (limpa.indexOf(" " + par[0] + " ") >= 0 && par[0].length > tamanho) { tamanho = par[0].length; id = par[1]; }
  });
  if (!id) return null;
  const ex = lista.find((e) => e.id === id);
  return ex ? { ex: ex, letras: tamanho } : null;
}
// "candidatos" são os exercícios que já estão no treino de hoje. Durante o
// treino, quem fala "supino" quase sempre quer o supino que está na ficha —
// por isso a busca começa restrita a eles e só depois abre para os 204.
function acharExercicio(frase, todos, candidatos) {
  if (!frase) return null;
  const limpa = " " + String(frase).replace(/\b\d+(\.\d+)?\b/g, " ").replace(/\s+/g, " ").trim() + " ";
  if (candidatos && candidatos.length) {
    const lista = todos.filter((e) => candidatos.indexOf(e.id) >= 0);
    const ap = porApelido(limpa, lista);
    const b = melhorDaLista(limpa, lista);
    if (ap && (!b || ap.letras >= b.r.letras)) return ap.ex;
    if (b) return b.ex;
  }
  const b = melhorDaLista(limpa, todos);
  if (b && b.r.inteiro) return b.ex;
  const ap = porApelido(limpa, todos);
  // O apelido vence quando explica pelo menos tanto da frase quanto o nome
  // completo explicaria: "supino" é o supino reto, não o "Supino na máquina".
  if (ap && (!b || ap.letras >= b.r.letras)) return ap.ex;
  if (b && (b.r.achados >= 2 || b.r.cobertura >= 0.55)) return b.ex;
  return ap ? ap.ex : null;
}

// Como se fala de grupo muscular em voz alta, que nem sempre é o nome do app
const TERMOS_GRUPO = [
  ["peitoral", "peito"], ["peito", "peito"],
  ["costas", "costas"], ["dorsal", "costas"], ["dorsais", "costas"],
  ["pernas", "pernas"], ["perna", "pernas"], ["quadriceps", "pernas"], ["coxa", "pernas"],
  ["ombros", "ombros"], ["ombro", "ombros"], ["deltoide", "ombros"],
  ["biceps", "biceps"], ["triceps", "triceps"], ["braco", "biceps"], ["bracos", "biceps"],
  ["abdomen", "abdomen"], ["abdominal", "abdomen"], ["barriga", "abdomen"], ["core", "abdomen"],
  ["gluteos", "gluteos"], ["gluteo", "gluteos"], ["bumbum", "gluteos"],
];
function grupoDito(f) {
  for (let i = 0; i < TERMOS_GRUPO.length; i++) {
    if (f.indexOf(" " + TERMOS_GRUPO[i][0]) >= 0) return TERMOS_GRUPO[i][1];
  }
  return null;
}

// ---- Interpretação do comando ----
// Devolve { tipo, ... } ou null quando a frase não é um comando conhecido.
const achaNum = (f, re) => { const m = f.match(re); return m ? parseFloat(m[1]) : null; };

function duracaoDita(f) {
  // "e meio" vira " e 0.5" na conversao dos numeros, e precisa virar 30 segundos
  const min = f.match(/(\d+(?:\.\d+)?)\s*min(\s*e\s*0\.5)?/);
  const seg = f.match(/(\d+(?:\.\d+)?)\s*seg/);
  const meio = min && min[2] ? 30 : 0;
  if (min && seg) return Math.round(parseFloat(min[1]) * 60 + meio + parseFloat(seg[1]));
  if (min) return Math.round(parseFloat(min[1]) * 60 + meio);
  if (seg) return Math.round(parseFloat(seg[1]));
  // "descanso de 2" sem unidade: número pequeno é minuto, grande é segundo
  const cru = f.match(/(?:descans\w*|cronometr\w*|timer|pausa)\s*(?:de|por)?\s*(\d+(?:\.\d+)?)/);
  if (cru) {
    const v = parseFloat(cru[1]);
    return Math.round(v <= 10 ? v * 60 : v);
  }
  return null;
}

// Toda forma de "pare" que o reconhecimento devolve. A lista é longa de
// propósito: errar aqui faz o app começar um descanso quando pediram para parar.
const PARADA = /\b(pula|pular|pule|pulo|cancela|cancelar|cancele|encerra|encerrar|encerre|para|parar|pare|parou|pararam|param|interrompe|interromper|interrompa|interrompeu|corta|cortar|corte|chega|acabou|termina|terminar|termine|finaliza|finalizar|desliga|tira)\b/;
function interpretarVoz(fala, ctx) {
  const f = " " + String(fala || "").trim() + " ";
  if (!f.trim()) return null;
  const ctxt = ctx || {};
  const tem = (re) => re.test(f);

  // "quais sao os principais comandos" não casava com uma lista fechada de
  // frases: quem pede ajuda pergunta de mil jeitos. Melhor procurar os sinais.
  if (tem(/\b(modo treino|modo aprendiz|treinar os comandos|praticar os comandos|quero praticar|me ensina|aprender os comandos|escola do jarvis|escola de comandos)\b/)) return { tipo: "escola" };
  // "nenhum comando mesmo" abria a ajuda: a palavra sozinha não é um pedido.
  // Agora precisa vir acompanhada de quem pergunta.
  if (tem(/\b(ajuda|socorro|me ajuda)\b/) ||
      (tem(/\bcomandos?\b/) && tem(/\b(quais|qual|lista|listar|ver|mostra|mostrar|principais|todos|ensina|diz|fala|sao|existem|conhece)\b/)) ||
      tem(/\bo que (voce|vc) (faz|sabe)\b/) || tem(/\bo que (eu )?posso (dizer|falar|pedir)\b/) ||
      tem(/\bcomo (voce |vc )?(funciona|uso|usa)\b/) || tem(/\bcomo (eu )?(falo|peco|anoto|uso)\b/)) {
    let assunto = null;
    if (tem(/\banot|\bregistr|\bmarc/)) assunto = "anotar";
    else if (tem(/\bdescans|\bcronometr/)) assunto = "descanso";
    else if (tem(/\bcorrig|\bapag|\berrei|\bdesfaz/)) assunto = "corrigir";
    else if (tem(/\brecorde|\bconsult|\bultima vez/)) assunto = "consultar";
    else if (tem(/\btroca|\bsubstitui|\bocupad/)) assunto = "trocar";
    else if (tem(/\bproximo|\bnaveg|\bexercicio\b/)) assunto = "navegar";
    return { tipo: "ajuda", assunto: assunto };
  }
  if (tem(/\b(para de ouvir|pare de ouvir|desliga o jarvis|desliga o microfone|pode parar|modo silencioso|dorme)\b/)) return { tipo: "desligar" };
  if (tem(/\b(fica quieto|fica calado|nao fala|sem voz|voz desligada)\b/)) return { tipo: "mudo" };

  // --- descanso ---
  // Classificar "pare o descanso" como COMEÇAR o descanso é o pior erro
  // possível: faz o contrário do pedido, no momento em que a pessoa está com
  // pressa. O reconhecimento devolve o verbo conjugado de todo jeito —
  // "pare", "pararam", "interrompeu" — e a lista curta deixava tudo passar.
  if (tem(/\bdescans/) && tem(/\b(quanto|quantos|quanta|falta|faltam|resta|restam|sobrou)\b/)) return { tipo: "tempoDescanso" };
  if (tem(/\bdescans/) && PARADA.test(f) && !/\b\d+(\.\d+)?\s*(min|seg)\b/.test(f)) return { tipo: "pularDescanso" };
  if (ctxt.descansando && tem(/\b(mais|adiciona|soma|aumenta)\b/) && tem(/\b\d+(\.\d+)?\s*(seg|min)\b/)) {
    return { tipo: "esticarDescanso", segundos: duracaoDita(f) || 15 };
  }
  if (tem(/\b(descans\w*|cronometr\w*|timer|pausa)\b/)) return { tipo: "descanso", segundos: duracaoDita(f) };

  // --- bora ---
  // Depois de ouvir a sugestão do dia, "bora" é o jeito natural de aceitar.
  // Só vale sozinho: dentro de uma frase maior, "bora" é só empolgação.
  if (/^\s*(bora|partiu|vamos|vamo)\s*(treinar|nessa|pra cima|la)?\s*$/.test(f)) return { tipo: "boraTreinar" };

  // --- vida da sessão ---
  if (tem(/\b(finaliza|finalizar|termina|terminar|encerra|encerrar|acabei|fim do treino|salva o treino)\b/)) return { tipo: "finalizar" };
  if (tem(/\b(comeca|comecar|iniciar|inicia|bora|vamos|abre)\b/) && tem(/\btreino\b/)) {
    // "treino A" tem de ser lido ANTES de tirar os artigos, senão o \"a\" do nome
    // da ficha é removido junto com o artigo e sobra um pedido sem destino.
    const letra = f.match(/\btreino\s+([a-e])\b/);
    let nome = f.replace(/.*\b(?:comeca|comecar|iniciar|inicia|bora|vamos|abre)\b/, "")
      .replace(/\b(o|a|meu|minha|ficha|treino|de|do|da)\b/g, " ").replace(/\s+/g, " ").trim();
    if (!nome && letra) nome = letra[1];
    return { tipo: "iniciarTreino", nome: nome };
  }

  // --- navegação entre exercícios ---
  if (tem(/\b(proximo|proxima|seguinte)\b/) || tem(/\bpula\b.*\bexercicio\b/)) return { tipo: "proximo" };
  if (tem(/\banterior\b/) || tem(/\bvolta\b.*\bexercicio\b/)) return { tipo: "anterior" };
  // "Jarvis, ir para o agachamento sumô" e "Jarvis, você pulou o agachamento"
  // são o mesmo pedido: me leva até aquele exercício. Foi pedido de quatro
  // jeitos diferentes num treino só, e nenhum existia. Vem depois de
  // próximo/anterior para não roubar "ir para o próximo exercício".
  if (!tem(/\bserie\b/) && (
    tem(/\b(ir para|ir pro|vai para|vai pro|vamos para|voltar para|volta para|passa para|passar para|pula para|pular para|ir no|vai no|abre o|abrir o|mostra o|mostrar o|quero fazer|agora o|agora a|ir exercicio|ir ao)\b/) ||
    tem(/\b(pulou|pulamos|esqueceu|esquecemos|faltou|deixou de fora|esqueci)\b/)
  )) return { tipo: "irExercicio", frase: f };

  // --- correções ---
  if (tem(/\b(apaga|apagar|desfaz|desfazer|errei|erramos|desconsidera|cancela a ultima|tira a ultima)\b/)) return { tipo: "desfazer" };

  // --- perguntas sobre o próprio histórico ---
  // Vêm antes de "quanto tempo" (tempo de treino) porque "quanto tempo faz que
  // treinei peito" é outra pergunta, e a mais específica tem de ganhar.
  const gr = grupoDito(f);
  if (tem(/\b(treino hoje|treinar hoje|o que fazer hoje|sugest\w*|que treino|qual treino|qual ficha|o que (eu )?faco hoje)\b/)) return { tipo: "sugestaoHoje", amanha: tem(/\bamanha\b/) };
  if (gr && tem(/\bquant\w* serie/)) return { tipo: "seriesGrupo", grupo: gr };
  if (gr && tem(/\b(quanto tempo|ha quanto tempo|quantos dias|quando (eu )?treinei|descansad\w*|ja posso)\b/)) return { tipo: "recuperacaoGrupo", grupo: gr };
  if (gr && tem(/\b(treinar|treino|fazer|faco)\b/)) return { tipo: "sugestaoHoje", grupo: gr, amanha: tem(/\bamanha\b/) };
  if (tem(/\b(ultimo treino|quando (eu )?treinei|quando foi o ultimo)\b/)) return { tipo: "ultimoTreino" };
  if (tem(/\b(meu nivel|qual nivel|quantos treinos|minha sequencia|meu volume|quanto (eu )?levantei|minha meta|quantas conquistas|meus numeros|meu progresso)\b/)) return { tipo: "progresso", frase: f };
  if (tem(/\b(quanto (eu )?peso|meu peso|minha cintura|meu braco|minha coxa|meu quadril|minhas medidas)\b/)) return { tipo: "medida", frase: f };

  // --- consultas ---
  if (tem(/\b(recorde|meu melhor|maior peso|maior carga)\b/)) return { tipo: "recorde", frase: f };
  if (tem(/\b(ultima vez|quanto eu fiz|quanto fiz|como foi|da outra vez)\b/)) return { tipo: "ultimaVez", frase: f };
  if (tem(/\b(quantas serie|quantos serie|quanto falta|falta quanto|faltam quanta|como estou|como to)\b/)) return { tipo: "situacao" };
  if (tem(/\b(quanto tempo|ha quanto tempo|tempo de treino)\b/)) return { tipo: "tempo" };

  // --- corrigir o que acabou de ser anotado ---
  // Ouvir "80" e anotar "18" acontece. Hoje a saída era apagar e ditar tudo de
  // novo; aqui é só dizer o número certo.
  const mCorrige = f.match(/\b(?:corrige|corrigir|corrija|ajusta|ajustar|ajuste|muda|mudar|mude|troca para|era)\b[^0-9]*(\d+(?:\.\d+)?)/);
  if (mCorrige && !tem(/\bexercicio\b/)) {
    return {
      tipo: "corrigir",
      valor: parseFloat(mCorrige[1]),
      // "corrige as repetições para 8" muda outra coisa que não a carga
      campo: tem(/\breps\b/) ? "reps" : tem(/\bseg\b/) ? "segundos" : "peso",
    };
  }

  // --- observação ditada ---
  // "Jarvis, observação: banco na altura 4". Altura do banco, pegada, número do
  // pino: o detalhe que se esquece entre um treino e outro e que, até aqui, só
  // dava para escrever com o dedo.
  if (tem(/\bobserva/)) return { tipo: "observacao", frase: f };

  // --- o scanner da câmera ---
  if (tem(/\b(scanner|escaner|camera|eyes|conta (pra|para) mim|contar (pra|para) mim|me conta as reps|olha e conta)\b/)) return { tipo: "scanner" };

  // --- repetir a última ---
  // Na prática, metade das séries sai igual à anterior. Ditar os mesmos dois
  // números de novo é trabalho que o app pode poupar.
  if (tem(/\b(repete|repetir|repita|de novo|mais (uma|1) igual|outra igual|mesma coisa|mesmo peso|igual a ultima|igual a anterior)\b/)) return { tipo: "repetir" };

  // --- montagem do treino ---
  if (tem(/\b(troca|trocar|substitui|substituir|ocupado|ocupada|em uso)\b/)) return { tipo: "trocar", frase: f };
  if (tem(/\bmais (uma|1) serie\b/) || (tem(/\b(adiciona|poe|coloca)\b/) && tem(/\bserie\b/))) return { tipo: "maisSerie", frase: f };
  if (tem(/\b(adiciona|adicionar|poe|poem|coloca|colocar|inclui|incluir|acrescenta)\b/)) return { tipo: "adicionar", frase: f };

  // --- anotar a série: o comando principal ---
  const verboAnotar = tem(/\b(anota|anote|anotar|registra|registrar|marca|marcar|guarda|salva|fiz|feito|fechei|completei|consegui|peguei|levantei|mandei)\b/);
  const porLado = tem(/\b(cada lado|por lado|de lado|em cada|cada ponta|por ponta)\b/);
  const aquecimento = tem(/\baquec/);
  let peso = achaNum(f, /(\d+(?:\.\d+)?)\s*kg/);
  let reps = achaNum(f, /(\d+(?:\.\d+)?)\s*reps/);
  const segundos = achaNum(f, /(\d+(?:\.\d+)?)\s*seg/);
  // "80 por 10", "80 x 12", "80 vezes 10"
  const parMul = f.match(/(\d+(?:\.\d+)?)\s*(?:kg\s*)?(?:por|x)\s*(\d+(?:\.\d+)?)/);
  if (parMul) {
    if (peso === null) peso = parseFloat(parMul[1]);
    if (reps === null) reps = parseFloat(parMul[2]);
  }
  if (verboAnotar || peso !== null || reps !== null || segundos !== null) {
    // Dois números soltos depois do verbo são peso e repetições, nessa ordem.
    // Com a palavra "série" na frase, não: "anota 3 séries de 12" é um plano de
    // treino, e viraria 3 kg por 12 repetições.
    if (peso === null && reps === null && segundos === null && verboAnotar && !tem(/\bserie\b/)) {
      const soltos = (f.match(/\b\d+(?:\.\d+)?\b/g) || []).map(parseFloat);
      if (soltos.length >= 2) { peso = soltos[0]; reps = soltos[1]; }
      else if (soltos.length === 1) reps = soltos[0];
    }
    // "45 de cada lado, 8 repetições" não traz "kg" nem "por": o peso é o outro
    // número da frase. Vale só com "de cada lado", onde não há o que confundir.
    if (peso === null && reps !== null && porLado) {
      const sobra = (f.match(/\b\d+(?:\.\d+)?\b/g) || []).map(parseFloat);
      const i = sobra.indexOf(reps);
      if (i >= 0) sobra.splice(i, 1);
      if (sobra.length === 1) peso = sobra[0];
    }
    if (peso !== null || reps !== null || segundos !== null) {
      return { tipo: "anotar", peso: peso, reps: reps, segundos: segundos, porLado: porLado, aquecimento: aquecimento, frase: f };
    }
    if (verboAnotar && tem(/\bserie\b/)) {
      return { tipo: "anotar", peso: null, reps: null, segundos: null, porLado: false, aquecimento: aquecimento, frase: f };
    }
  }

  return null;
}

// ---- Perguntas sobre o histórico ----
// Valem em qualquer tela: perguntar "qual meu recorde no supino" não devia
// exigir um treino aberto. Devolve { ok, fala } ou null quando o comando não é
// uma pergunta deste tipo — aí quem chamou decide o que fazer.
function descreverDescanso(g) {
  if (g.dias === null) return g.nome + ", sem registro ainda";
  if (g.dias === 0) return g.nome + ", treinado hoje";
  return g.nome + ", " + g.dias + " " + plural(g.dias, "dia", "dias") + " de descanso";
}
function responderConsulta(c, ctx) {
  const hist = ctx.historico || [];
  const todos = ctx.todos || [];
  switch (c.tipo) {
    case "recorde": {
      const ex = acharExercicio(c.frase, todos, []);
      if (!ex) return { ok: false, fala: "Recorde de qual exercício? Pergunte assim: Jarvis, qual meu recorde no supino." };
      const r = recordesPorExercicio(hist)[ex.id];
      const nome = nomeFalado(ex.nome);
      if (!r || (!r.peso && !r.segundos)) return { ok: true, fala: "Você ainda não registrou " + nome + ". O primeiro recorde está esperando." };
      if (ex.tempo || (r.tempo && !r.peso)) return { ok: true, fala: "Seu recorde em " + nome + " é " + r.segundos + " segundos." };
      return { ok: true, fala: "Seu recorde em " + nome + " é " + fmtNum(r.peso) + " quilos" +
        (r.reps ? " por " + r.reps + " repetições" : "") + "." };
    }
    case "ultimaVez": {
      const ex = acharExercicio(c.frase, todos, []);
      if (!ex) return { ok: false, fala: "De qual exercício? Pergunte assim: Jarvis, quanto fiz da última vez no supino." };
      const u = ultimaExecucao(hist, ex.id);
      const nome = nomeFalado(ex.nome);
      if (!u) return { ok: true, fala: "Não encontrei " + nome + " no seu histórico." };
      const dias = Math.floor((Date.now() - new Date(u.data).getTime()) / 86400000);
      const txt = u.series.slice(0, 4).map((s) => (ehTempo(s) ? segundosDe(s) + " segundos" : fmtNum(s.peso) + " por " + repsDe(s))).join(", ");
      return { ok: true, fala: "Em " + nome + ", " + (dias <= 0 ? "hoje" : "há " + dias + " " + plural(dias, "dia", "dias")) + ": " + txt + "." };
    }
    case "sugestaoHoje": {
      if (!hist.length) {
        const f0 = (ctx.treinos || []).find((t) => t.itens && t.itens.length);
        return { ok: true, fala: "Você ainda não tem treino registrado. " +
          (f0 ? "Comece pela ficha " + f0.nome + ". Diga: Jarvis, começa o treino " + f0.nome + "." : "Monte uma ficha no assistente e me chame.") };
      }
      // "para amanhã" é uma pergunta diferente: um dia a mais de descanso muda
      // quem está pronto, e responder com os números de hoje seria responder outra coisa.
      const rec = recuperacaoMuscular(hist, ctx.exPorId).map((g) => {
        if (!c.amanha || g.dias === null) return g;
        const d = g.dias + 1;
        return { id: g.id, nome: g.nome, dias: d, estado: d < 1 ? "descansando" : d < 2 ? "quase" : "pronto" };
      });
      // Quando a pessoa já disse o grupo ("quero treinar peito hoje"), a resposta
      // é sobre ele: se está descansado e qual ficha o cobre.
      const pedido = c.grupo ? rec.filter((g) => g.id === c.grupo) : null;
      const prontos = rec.filter((g) => g.estado === "pronto").slice(0, 2);
      const alvo = (pedido && pedido.length) ? pedido : (prontos.length ? prontos : rec.slice(0, 2));
      let melhor = null, melhorP = 0;
      (ctx.treinos || []).forEach((t) => {
        if (!t.itens || !t.itens.length) return;
        let p = 0;
        t.itens.forEach((it) => {
          const e = ctx.exPorId(it.exercicioId);
          if (e && alvo.some((g) => g.id === e.grupo)) p++;
        });
        if (p > melhorP) { melhorP = p; melhor = t; }
      });
      const quando = c.amanha ? "Amanhã. " : "";
      let fala = c.grupo
        ? alvo.map(descreverDescanso).join("; ") + ". " +
          (alvo[0].estado === "descansando" ? "Ainda está se recuperando — se puder, escolha outro grupo. "
            : alvo[0].estado === "quase" ? "Dá para ir, mas mais um dia seria melhor. " : "Pode ir. ")
        : "Quem está mais descansado: " + alvo.map(descreverDescanso).join("; ") + ". ";
      fala += melhor
        ? "Sugiro a ficha " + melhor.nome + ". Diga: Jarvis, começa o treino " + melhor.nome + "."
        : "Escolha uma ficha que pegue esses grupos, ou diga: Jarvis, treino livre.";
      return { ok: true, fala: quando + fala };
    }
    case "recuperacaoGrupo": {
      const rec = recuperacaoMuscular(hist, ctx.exPorId);
      const g = rec.find((x) => x.id === c.grupo);
      if (!g) return { ok: false, fala: "Não achei esse grupo muscular." };
      if (g.dias === null) return { ok: true, fala: g.nome + " não aparece no seu histórico ainda. Pode treinar à vontade." };
      const estado = g.estado === "pronto" ? "Já pode treinar." : g.estado === "quase" ? "Quase lá — mais um dia seria melhor." : "Ainda está descansando.";
      return { ok: true, fala: g.nome + ": " + (g.dias === 0 ? "você treinou hoje" : g.dias + " " + plural(g.dias, "dia", "dias") + " desde a última vez") + ". " + estado };
    }
    case "seriesGrupo": {
      const lista = seriesSemanaisPorGrupo(hist, ctx.exPorId);
      const g = lista.find((x) => x.id === c.grupo);
      if (!g) return { ok: false, fala: "Não achei esse grupo muscular." };
      const faixa = " A referência para crescer é de " + FAIXA_SERIES.min + " a " + FAIXA_SERIES.max + " séries por semana.";
      const onde = g.series === 0 ? "nenhuma série" : g.series + " " + plural(g.series, "série", "séries");
      const juizo = g.series === 0 ? " Ainda dá tempo." : g.series < FAIXA_SERIES.min ? " Está abaixo da faixa." :
        g.series <= FAIXA_SERIES.max ? " Está na faixa." : " Já passou da faixa — cuidado com a recuperação.";
      return { ok: true, fala: "Esta semana você fez " + onde + " de " + g.nome + "." + juizo + faixa };
    }
    case "ultimoTreino": {
      if (!hist.length) return { ok: true, fala: "Você ainda não tem nenhum treino no histórico." };
      const ult = [...hist].sort((a, b) => new Date(b.data) - new Date(a.data))[0];
      const dias = Math.floor((Date.now() - new Date(ult.data).getTime()) / 86400000);
      const st = statsTreino(ult);
      const quando = dias <= 0 ? "hoje" : dias === 1 ? "ontem" : "há " + dias + " dias";
      return { ok: true, fala: "Seu último treino foi " + quando + ": " + ult.nome + ". " +
        st.series + " " + plural(st.series, "série", "séries") + " em " + ult.duracaoMin + " " + plural(ult.duracaoMin, "minuto", "minutos") +
        (st.volume > 0 ? ", " + fmtKg(st.volume) + " de volume" : "") + "." };
    }
    case "progresso": {
      const est = calcularEstatisticas(hist);
      const f = c.frase || "";
      if (/\bnivel\b/.test(f)) {
        const nv = nivelDe(est);
        return { ok: true, fala: "Você está no nível " + nv.indice + ", " + nv.nome + ". " +
          (nv.proximo ? "Faltam " + nv.faltam + " pontos para " + nv.proximo.nome + "." : "É o topo da tabela.") };
      }
      if (/\bsequencia\b/.test(f)) {
        return { ok: true, fala: est.streak > 0
          ? "Sua sequência é de " + est.streak + " " + plural(est.streak, "dia", "dias") + " seguidos. Não deixa cair."
          : "Sua sequência está zerada. O treino de hoje recomeça a conta." };
      }
      if (/\bmeta\b/.test(f)) {
        const meta = ctx.meta || 3;
        const faltam = Math.max(0, meta - est.treinosSemana);
        return { ok: true, fala: "Esta semana você treinou " + est.treinosSemana + " de " + meta + ". " +
          (faltam ? "Faltam " + faltam + "." : "Meta batida!") };
      }
      if (/\bconquista/.test(f)) {
        const g2 = CONQUISTAS.filter((x) => x.cond(est)).length;
        return { ok: true, fala: "Você tem " + g2 + " de " + CONQUISTAS.length + " conquistas." };
      }
      if (/\bvolume\b|levantei/.test(f)) {
        return { ok: true, fala: "Você já moveu " + fmtPeso(est.volumeTotal) + " desde o começo." };
      }
      const nv = nivelDe(est);
      return { ok: true, fala: est.total + " " + plural(est.total, "treino", "treinos") + " registrados, " +
        "sequência de " + est.streak + " " + plural(est.streak, "dia", "dias") + ", nível " + nv.indice + ", " + nv.nome +
        ", e " + fmtPeso(est.volumeTotal) + " movidos." };
    }
    case "medida": {
      const lista = [...(ctx.medidas || [])].sort((a, b) => new Date(b.data) - new Date(a.data));
      if (!lista.length) return { ok: true, fala: "Você ainda não registrou medidas. Elas ficam em Histórico, aba Corpo." };
      const f = c.frase || "";
      const campo = /cintura/.test(f) ? ["cintura", "cintura", "cm"] : /braco/.test(f) ? ["braco", "braço", "cm"] :
        /coxa/.test(f) ? ["coxa", "coxa", "cm"] : /quadril/.test(f) ? ["quadril", "quadril", "cm"] : ["peso", "peso", "kg"];
      const atual = lista.find((m) => m[campo[0]]);
      if (!atual) return { ok: true, fala: "Você ainda não registrou " + campo[1] + "." };
      const anterior = lista.find((m) => m[campo[0]] && m !== atual && new Date(m.data) < new Date(atual.data));
      let fala = "Seu " + campo[1] + ": " + fmtNum(atual[campo[0]]) + " " + campo[2] +
        ", medido em " + new Date(atual.data).toLocaleDateString("pt-BR") + ".";
      if (anterior) {
        const dif = Math.round((parseFloat(atual[campo[0]]) - parseFloat(anterior[campo[0]])) * 10) / 10;
        fala += dif === 0 ? " Igual à medição anterior."
          : " " + (dif > 0 ? "Subiu " : "Desceu ") + fmtNum(Math.abs(dif)) + " " + campo[2] + " desde a medição anterior.";
      }
      return { ok: true, fala: fala };
    }
    default: return null;
  }
}

// WAV de um segundo em silêncio, montado na hora. Serve só para o aparelho
// considerar que há mídia tocando — é a condição para o sistema entregar as
// teclas do fone de ouvido à página. Montar em vez de embutir evita vinte
// quilobytes de base64 no arquivo.
function urlSilencio() {
  const taxa = 8000, n = taxa;
  const buf = new ArrayBuffer(44 + n);
  const dv = new DataView(buf);
  const txt = (p, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(p + i, s.charCodeAt(i)); };
  txt(0, "RIFF"); dv.setUint32(4, 36 + n, true); txt(8, "WAVEfmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, taxa, true); dv.setUint32(28, taxa, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
  txt(36, "data"); dv.setUint32(40, n, true);
  for (let i = 0; i < n; i++) dv.setUint8(44 + i, 128);  // 128 é o silêncio em 8 bits
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}

// ---- O ouvinte ----
// O navegador encerra o reconhecimento sozinho depois de alguns segundos de
// silêncio, mesmo com "continuous". Religar no "onend" é o jeito que funciona —
// com freio, porque religar em laço trava a aba.
function criarOuvinte(opcoes) {
  if (!VOZ_OUVE) return null;
  const aoParcial = opcoes.aoParcial, aoFinal = opcoes.aoFinal;
  const aoEstado = opcoes.aoEstado, aoErro = opcoes.aoErro;
  const aoTumulto = opcoes.aoTumulto;
  let rec = null;
  let querendo = false;
  let rodando = false;
  let umaVez = false;      // modo "toque para falar": uma sessão por comando
  let religadas = [];
  let semResultado = 0;    // religadas seguidas sem nenhuma frase
  let desdeQuando = 0;     // quando essa sequencia comecou
  let avisouTumulto = false;
  let timer = null;

  const agendarReligar = () => {
    const agora = Date.now();
    religadas = religadas.filter((t) => agora - t < 12000);
    // Mais de 10 religadas em 12 segundos é sinal de que algo está errado;
    // dar um respiro evita a aba travar em laço.
    let espera = religadas.length > 10 ? 2500 : 600;
    // Religar enquanto ele fala é desperdício puro: o microfone só ia ouvir a
    // própria voz dele — e, no Android, cada religada apita por cima da resposta.
    const falta = jarvisFalandoAte - agora;
    if (falta > 0) espera = Math.max(espera, falta + 200);
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (!querendo || rodando) return;
      religadas.push(Date.now());
      try { rec.start(); } catch (e) { /* já estava começando */ }
    }, espera);
    // Religar sem parar e sem nunca ouvir nada é o sintoma do Android encerrando
    // a sessão a cada silêncio. Quem está na academia só percebe os bipes.
    // Seis encerramentos EM SEQUENCIA E EM POUCOS SEGUNDOS. Espacados, sao o
    // comportamento normal de quem fica calado entre uma serie e outra.
    if (semResultado >= 6 && agora - desdeQuando < 15000 && !avisouTumulto) {
      avisouTumulto = true;
      anotarDiario("", "o microfone reiniciou " + semResultado + " vezes em " + Math.round((agora - desdeQuando) / 1000) + "s sem ouvir nada");
      if (aoTumulto) aoTumulto();
    }
  };

  // A frase só é entregue quando para de crescer. Sem isto, "anota aí cadeira
  // abdutora 90 kg 12" vira vinte comandos, todos pela metade.
  let frasePendente = "";
  let altPendente = null;
  let timerFrase = null;
  let ultimaEntregue = "";
  let quandoEntregue = 0;
  const entregarFrase = () => {
    clearTimeout(timerFrase);
    timerFrase = null;
    const t = frasePendente, a = altPendente;
    frasePendente = "";
    altPendente = null;
    if (!t) return;
    ultimaEntregue = t;
    quandoEntregue = Date.now();
    if (aoFinal) aoFinal(t, a || [t]);
  };
  // Mesma frase crescendo, ou outra frase? Comparar por prefixo de texto não
  // basta: o reconhecedor REVISA o fim da frase enquanto escuta ("90 kg 12"
  // virou "90 kg de repetição"), e aí o prefixo deixa de bater. Comparar por
  // palavras, tolerando a última, resolve.
  // Usada tanto para juntar os pedaços quanto para reconhecer a continuação
  // O reconhecedor larga e repõe o "Jarvis" da frente entre uma revisão e
  // outra. Comparar com ele no meio fazia "Jarvis ir para o próximo" e "ir
  // para o próximo" parecerem frases diferentes — e o comando era executado
  // duas vezes, pulando um exercício.
  const semNomeNaFrente = (p) => (p.length && pareceJarvis(p[0]) ? p.slice(1) : p);
  const mesmaFrase = (a, b) => {
    const pa = semNomeNaFrente(a.toLowerCase().split(/\s+/).filter(Boolean));
    const pb = semNomeNaFrente(b.toLowerCase().split(/\s+/).filter(Boolean));
    let k = 0;
    while (k < pa.length && k < pb.length && pa[k] === pb[k]) k++;
    return k >= 1 && k >= Math.min(pa.length, pb.length) - 1;
  };
  const acumularFrase = (t, alts) => {
    const novo = String(t || "").trim();
    if (!novo) return;
    if (frasePendente && !mesmaFrase(frasePendente, novo)) entregarFrase();
    if (!frasePendente || novo.length >= frasePendente.length) {
      frasePendente = novo;
      altPendente = alts;
    }
    clearTimeout(timerFrase);
    // O tempo precisa caber a frase inteira chegando em pedaços num aparelho
    // ocupado. Agir cedo demais é agir na frase pela metade.
    timerFrase = setTimeout(entregarFrase, 1100);
  };

  const montar = () => {
    const r = new ReconhecedorVoz();
    r.lang = "pt-BR";
    // No modo toque, uma sessão por comando: é o próprio sistema que decide
    // quando a pessoa parou de falar, e ele faz isso melhor do que um relógio nosso.
    r.continuous = !umaVez;
    r.interimResults = true;
    // Em ambiente barulhento a transcrição certa costuma não ser a primeira.
    // Pedir mais alternativas não custa nada e é o único ganho de precisão que
    // a API do navegador oferece.
    r.maxAlternatives = 5;
    r.onstart = () => { rodando = true; if (aoEstado) aoEstado("ouvindo"); };
    r.onaudiostart = () => { rodando = true; };
    r.onresult = (ev) => {
      const falandoAgora = Date.now() < jarvisFalandoAte;
      let parcial = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        if (res.isFinal) {
          const t = res[0].transcript;
          // Ainda é a frase que acabou de ser tratada, só que estendida ou
          // corrigida. O prazo é curto de propósito: a frase já esperou 1,1s para
          // assentar, então o que vem depois é retardatário. Mais folga do que
          // isso engoliria quem repete a mesma série de propósito — e ditar
          // "40 por 15" duas vezes seguidas é das coisas mais comuns do treino.
          if (ultimaEntregue && Date.now() - quandoEntregue < 1200 && mesmaFrase(ultimaEntregue, t)) {
            anotarDiario(t, "continuação do que já foi tratado — ignorado");
            continue;
          }
          if (falandoAgora) {
            // Antes, TUDO o que chegava enquanto ele falava era descartado — e a
            // pergunta que a pessoa emendava na resposta sumia sem deixar rastro.
            // Agora só o eco da própria voz é descartado: falar por cima dele
            // cala o assistente, que é o que se faz com quem está falando demais.
            if (ecoDaPropriaVoz(t)) { anotarDiario(t, "eco da própria voz — descartado"); continue; }
            anotarDiario(t, "você falou por cima — calei para ouvir");
            semResultado = 0;
            calarJarvis();
          }
          const alts = [];
          for (let k = 0; k < res.length; k++) alts.push(res[k].transcript);
          semResultado = 0;
          avisouTumulto = false;
          acumularFrase(t, alts);
        } else if (!falandoAgora) {
          parcial += res[0].transcript;
        }
      }
      if (parcial && aoParcial) aoParcial(parcial);
    };
    r.onerror = (ev) => {
      const erro = ev && ev.error;
      if (erro && erro !== "no-speech" && erro !== "aborted") anotarDiario("", "erro do microfone: " + erro);
      if (erro === "not-allowed" || erro === "service-not-allowed") {
        querendo = false; rodando = false;
        if (aoErro) aoErro("permissao");
        if (aoEstado) aoEstado("desligado");
        return;
      }
      if (erro === "audio-capture") {
        querendo = false; rodando = false;
        if (aoErro) aoErro("microfone");
        if (aoEstado) aoEstado("desligado");
      }
      // "no-speech", "aborted" e "network" são rotina: o onend religa
    };
    r.onend = () => {
      rodando = false;
      // A sessão acabou: o que estava sendo juntado já é a frase inteira
      if (frasePendente) entregarFrase();
      if (semResultado === 0) desdeQuando = Date.now();
      semResultado++;
      // No modo toque a sessão acaba e pronto: quem recomeça é o dedo.
      if (umaVez) { querendo = false; if (aoEstado) aoEstado("desligado"); return; }
      if (!querendo) { if (aoEstado) aoEstado("desligado"); return; }
      agendarReligar();
    };
    return r;
  };

  return {
    // modo: "continuo" (mãos livres) ou "toque" (uma sessão por comando)
    ligar(modo) {
      const toque = modo === "toque";
      // Trocar de modo exige um reconhecedor novo: "continuous" só pode ser
      // definido antes de começar.
      if (rec && toque !== umaVez) { try { rec.abort(); } catch (e) {} rec = null; }
      umaVez = toque;
      if (!rec) rec = montar();
      querendo = true;
      semResultado = 0;
      avisouTumulto = false;
      if (rodando) return;
      try { rec.start(); religadas.push(Date.now()); }
      catch (e) { agendarReligar(); }
    },
    desligar() {
      querendo = false;
      clearTimeout(timer);
      clearTimeout(timerFrase);
      frasePendente = "";
      altPendente = null;
      calarJarvis();
      try { if (rec) rec.abort(); } catch (e) {}
      rodando = false;
      if (aoEstado) aoEstado("desligado");
    },
    // Chamado por um relógio de fora: o "onend" nem sempre dispara, e sem esta
    // conferência o microfone morre calado no meio do treino.
    conferir() { if (querendo && !rodando && !umaVez) agendarReligar(); },
    noModoToque() { return umaVez; },
    ligado() { return querendo; },
  };
}

// Devolve o endereço da foto do aparelho, ou null. O estado inicial já vem do
// cache quando a foto foi resolvida antes: assim a lista não pisca ao rolar.
function useFotoExercicio(ex) {
  const temFoto = !!(ex && ex.foto);
  const id = ex ? ex.id : null;
  const [url, setUrl] = useState(() => (temFoto && FOTOS_EX[id] ? FOTOS_EX[id] : null));
  useEffect(() => {
    if (!temFoto || !id) { setUrl(null); return; }
    let vivo = true;
    carregarFotoEx(id).then((u) => { if (vivo) setUrl(u || null); });
    return () => { vivo = false; };
  }, [temFoto, id]);
  return url;
}

function ImagemExercicio({ ex }) {
  // A foto que o dono tirou do aparelho vem antes de tudo: é a imagem mais
  // fiel possível, porque é a máquina daquela academia.
  const fotoPropria = useFotoExercicio(ex);
  const url = IMAGENS_WGER[ex.id] || null;
  const [falhou, setFalhou] = useState(false);

  // Trocar de exercício precisa limpar a falha do anterior
  useEffect(() => { setFalhou(false); }, [ex.id]);

  if (fotoPropria) {
    return (
      <div style={{ margin: "4px 0 6px" }}>
        <div style={{ background: "var(--input)", borderRadius: 12, padding: 6, textAlign: "center" }}>
          <img src={fotoPropria} alt={"Foto do aparelho de " + ex.nome}
            style={{ maxWidth: "100%", maxHeight: 280, borderRadius: 8 }} />
        </div>
        <div style={{ fontSize: 11, color: "var(--cinza)", marginTop: 6 }}>📷 Sua foto do aparelho</div>
      </div>
    );
  }

  if (!url || falhou) {
    return (
      <div style={{ fontSize: 13, color: "var(--cinza)", padding: "8px 0", lineHeight: 1.6 }}>
        {ex.custom
          ? "Sem foto deste aparelho. Toque em “Trocar a foto” abaixo para fotografar a máquina da sua academia."
          : "Sem imagem disponível para este exercício — use o botão de vídeo abaixo."}
      </div>
    );
  }
  return (
    <div style={{ margin: "4px 0 6px" }}>
      <div style={{ background: "#FFFFFF", borderRadius: 12, padding: 8, textAlign: "center" }}>
        {/* sem loading="lazy": é a única imagem da tela e o conteúdo principal dela */}
        <img src={url} alt={"Demonstração do exercício " + ex.nome}
          style={{ maxWidth: "100%", maxHeight: 240, borderRadius: 8 }}
          onError={() => setFalhou(true)} />
      </div>
      <div style={{ fontSize: 11, color: "var(--cinza)", marginTop: 6, lineHeight: 1.5 }}>
        Imagem: comunidade <a href="https://wger.de" target="_blank" rel="noreferrer">wger.de</a> · Licença{" "}
        <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.pt-br" target="_blank" rel="noreferrer">CC BY-SA 4.0</a>
      </div>
    </div>
  );
}

function GraficoSemanal({ historico }) {
  const semanas = volumeSemanal(historico, 8);
  const vmax = Math.max(...semanas.map((s) => s.volume), 1);
  const W = 320, H = 130, base = 104, larg = 26;
  const passo = (W - 20) / semanas.length;
  const media = Math.round(semanas.reduce((a, s) => a + s.volume, 0) / semanas.length);
  return (
    <div style={S.card}>
      <div style={S.label}>Tonelagem por semana</div>
      <div style={{ color: "var(--cinza)", fontSize: 12, margin: "4px 0 12px" }}>
        Últimas 8 semanas · média de {fmtPeso(media)} por semana
      </div>
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }}>
        <line x1="10" x2={W - 10} y1={base} y2={base} stroke="var(--borda)" strokeWidth="1" />
        {semanas.map((s, i) => {
          const alt = s.volume ? Math.max(3, (s.volume / vmax) * 82) : 0;
          const x = 10 + i * passo + (passo - larg) / 2;
          const atual = i === semanas.length - 1;
          return (
            <g key={i}>
              {alt > 0 && (
                <rect x={x} y={base - alt} width={larg} height={alt} rx="5"
                  fill={atual ? "#E1306C" : "#E1306C66"} />
              )}
              {s.volume > 0 && (
                <text x={x + larg / 2} y={base - alt - 5} fill="var(--cinza)" fontSize="9" textAnchor="middle">
                  {s.volume >= 1000 ? Math.round(s.volume / 1000) + "t" : s.volume}
                </text>
              )}
              <text x={x + larg / 2} y={base + 14} fill="var(--cinza2)" fontSize="9" textAnchor="middle">
                {s.ini.getDate() + "/" + (s.ini.getMonth() + 1)}
              </text>
              <text x={x + larg / 2} y={base + 25} fill="var(--cinza2)" fontSize="8" textAnchor="middle">
                {s.treinos ? s.treinos + "x" : ""}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// ---------------- ESTATÍSTICAS: VOLUME POR MÚSCULO ----------------
function VolumeMusculos({ historico, exPorId }) {
  const [dias, setDias] = useState(30);
  const desde = dias ? Date.now() - dias * 86400000 : 0;
  const lista = volumePorGrupo(historico, exPorId, desde);
  const total = lista.reduce((a, x) => a + x.volume, 0);
  const vmax = lista.length ? lista[0].volume : 1;
  return (
    <div style={S.card}>
      <div style={S.label}>Volume por músculo</div>
      <div style={{ display: "flex", gap: 8, margin: "10px 0 14px" }}>
        {[[7, "7 dias"], [30, "30 dias"], [0, "Sempre"]].map(([d, nome]) => (
          <button key={d} onClick={() => setDias(d)}
            style={{
              flex: 1, border: "1px solid", borderColor: dias === d ? "#E1306C" : "var(--borda2)",
              background: dias === d ? "#E1306C22" : "transparent",
              color: dias === d ? "#E1306C" : "var(--cinza)",
              borderRadius: 8, padding: "8px 6px", fontWeight: 800, fontSize: 12, cursor: "pointer",
            }}>
            {nome}
          </button>
        ))}
      </div>

          Nenhum treino registrado nesse período. Conclua um treino para ver a divisão por músculo.
        </div>
      ) : (
        lista.map((g) => {
          const cor = corGrupo(GRUPOS.find((x) => x.id === g.id));
          const pct = total ? Math.round((g.volume / total) * 100) : 0;
          return (
            <div key={g.id} style={{ marginBottom: 10 }}>

                <span style={{ fontWeight: 700 }}>{g.nome}</span>

              </div>

          );
        })

// ---------------- SOM (Web Audio) ----------------
let audioCtx = null;
function beep(freq, dur, vol) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.value = vol || 0.25;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

// ---------------- IMAGENS DO WGER (banco aberto, licença CC BY-SA 4.0) ----------------
const cacheImg = {};
async function buscarImagemWger(termo) {
  const r = await fetch("https://wger.de/api/v2/exercise/search/?language=english&format=json&term=" + encodeURIComponent(termo));
  const j = await r.json();
  const sugestoes = j.suggestions || [];
  const hit = sugestoes.find((s) => s.data && s.data.image) || sugestoes[0];
  if (!hit || !hit.data) return null;
  let url = hit.data.image ? "https://wger.de" + hit.data.image : null;
  if (hit.data.base_id) {
    try {
      const r2 = await fetch("https://wger.de/api/v2/exerciseimage/?format=json&exercise_base=" + hit.data.base_id);
      const j2 = await r2.json();
      const main = (j2.results || []).find((i) => i.is_main) || (j2.results || [])[0];
      if (main && main.image) url = main.image;
    } catch (e) {}
  }
  return url;
}

function ImagemExercicio({ ex }) {
  const [url, setUrl] = useState(cacheImg[ex.id] !== undefined ? cacheImg[ex.id] : null);
  const [status, setStatus] = useState(cacheImg[ex.id] !== undefined ? (cacheImg[ex.id] ? "ok" : "erro") : "carregando");

  useEffect(() => {
    let vivo = true;
    if (cacheImg[ex.id] !== undefined) {
      setUrl(cacheImg[ex.id]);
      setStatus(cacheImg[ex.id] ? "ok" : "erro");
      return;
    }
    (async () => {
      try {
        const u = await buscarImagemWger(ex.en || ex.nome);
        cacheImg[ex.id] = u;
        if (vivo) { setUrl(u); setStatus(u ? "ok" : "erro"); }
      } catch (e) {
        cacheImg[ex.id] = null;
        if (vivo) setStatus("erro");
      }
    })();
    return () => { vivo = false; };
  }, [ex.id]);

  if (status === "carregando") {
    return <div style={{ fontSize: 13, color: "#8A8F98", padding: "8px 0" }}>Carregando imagem de demonstração...</div>;
  }
  if (status === "erro" || !url) {
    return (
      <div style={{ fontSize: 13, color: "#8A8F98", padding: "8px 0" }}>
        Sem imagem disponível para este exercício — use o botão de vídeo abaixo.
      </div>
    );
  }
  return (
    <div style={{ margin: "4px 0 6px" }}>
      <div style={{ background: "#FFFFFF", borderRadius: 12, padding: 8, textAlign: "center" }}>
        <img src={url} alt={"Demonstração: " + ex.nome} style={{ maxWidth: "100%", maxHeight: 240, borderRadius: 8 }}
          onError={() => { cacheImg[ex.id] = null; setStatus("erro"); }} />
      </div>
      <div style={{ fontSize: 11, color: "#8A8F98", marginTop: 6, lineHeight: 1.5 }}>
        Imagem: comunidade <a href="https://wger.de" target="_blank" rel="noreferrer">wger.de</a> · Licença{" "}
        <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.pt-br" target="_blank" rel="noreferrer">CC BY-SA 4.0</a>
      </div>
    </div>
  );
}

// ---------------- GRÁFICO DE EVOLUÇÃO ----------------
function GraficoEvolucao({ historico, exPorId }) {
  const idsComDados = [];
  const vistos = {};
  historico.forEach((h) => h.itens.forEach((it) => {
    const temPeso = it.series.some((s) => parseFloat(s.peso) > 0);
    if (temPeso && !vistos[it.exercicioId] && exPorId(it.exercicioId)) {
      vistos[it.exercicioId] = true;
      idsComDados.push(it.exercicioId);
    }
  }));

  const [exSel, setExSel] = useState(idsComDados[0] || "");
  const [metrica, setMetrica] = useState("max");

  useEffect(() => {
    if ((!exSel || !vistos[exSel]) && idsComDados.length) setExSel(idsComDados[0]);
  }, [historico.length]);

  if (idsComDados.length === 0) {
    return (
      <div style={S.card}>
        <div style={S.label}>Evolução</div>
        <div style={{ color: "#8A8F98", fontSize: 14, marginTop: 8 }}>
          Conclua treinos registrando os pesos para ver seu gráfico de evolução aqui.
        </div>
      </div>
    );
  }

  const ordenado = [...historico].sort((a, b) => new Date(a.data) - new Date(b.data));
  const pontos = [];
  ordenado.forEach((h) => {
    const it = h.itens.find((x) => x.exercicioId === exSel);
    if (!it) return;
    let valor = 0;
    if (metrica === "max") {
      it.series.forEach((sr) => { const pz = parseFloat(sr.peso) || 0; if (pz > valor) valor = pz; });
    } else {
      it.series.forEach((sr) => { valor += (parseFloat(sr.peso) || 0) * (parseInt(sr.reps) || 0); });
    }
    if (valor > 0) pontos.push({ data: new Date(h.data), valor });
  });

  const W = 320, H = 150, x0 = 34, x1 = 310, y0 = 118, y1 = 16;
  let svg = null;
  if (pontos.length >= 2) {
    const vmin = Math.min(...pontos.map((pt) => pt.valor));
    const vmax = Math.max(...pontos.map((pt) => pt.valor));
    const range = vmax - vmin || 1;
    const px = (i) => x0 + (i / (pontos.length - 1)) * (x1 - x0);
    const py = (v) => y0 - ((v - vmin) / range) * (y0 - y1);
    const linha = pontos.map((pt, i) => px(i).toFixed(1) + "," + py(pt.valor).toFixed(1)).join(" ");
    const fmtData = (d) => d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
    svg = (
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }}>
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={x0} x2={x1} y1={y0 - f * (y0 - y1)} y2={y0 - f * (y0 - y1)} stroke="#23262D" strokeWidth="1" />
        ))}
        <text x={x0 - 4} y={y1 + 4} fill="#8A8F98" fontSize="10" textAnchor="end">{vmax}</text>
        <text x={x0 - 4} y={y0 + 4} fill="#8A8F98" fontSize="10" textAnchor="end">{vmin}</text>
        <polyline points={linha} fill="none" stroke="#FFD60A" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        {pontos.map((pt, i) => (
          <circle key={i} cx={px(i)} cy={py(pt.valor)} r="3.5" fill="#FF453A" stroke="#0E0F12" strokeWidth="1" />
        ))}
        <text x={x0} y={H - 4} fill="#8A8F98" fontSize="10">{fmtData(pontos[0].data)}</text>
        <text x={x1} y={H - 4} fill="#8A8F98" fontSize="10" textAnchor="end">{fmtData(pontos[pontos.length - 1].data)}</text>
      </svg>
    );
  }

  const primeiro = pontos[0], ultimo = pontos[pontos.length - 1];
  const melhor = pontos.length ? Math.max(...pontos.map((pt) => pt.valor)) : 0;
  const unidade = metrica === "max" ? "kg" : "kg (vol.)";

  return (
    <div style={S.card}>
      <div style={{ ...S.label, marginBottom: 10 }}>Evolução do treino</div>

      <select value={exSel} onChange={(e) => setExSel(e.target.value)}
        style={{ ...S.input, marginBottom: 10, fontWeight: 700 }}>
        {idsComDados.map((id) => {
          const e = exPorId(id);
          return <option key={id} value={id}>{e ? e.nome : id}</option>;
        })}
      </select>

      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        {[["max", "Carga máxima"], ["volume", "Volume total"]].map(([m, nomeM]) => (
          <button key={m} onClick={() => setMetrica(m)}
            style={{
              flex: 1, border: "1px solid", borderColor: metrica === m ? "#FFD60A" : "#33363E",
              background: metrica === m ? "#FFD60A22" : "transparent",
              color: metrica === m ? "#FFD60A" : "#8A8F98",
              borderRadius: 8, padding: "8px 10px", fontWeight: 800, fontSize: 12, cursor: "pointer",
            }}>
            {nomeM}
          </button>
        ))}
      </div>

      {pontos.length >= 2 ? (
        <React.Fragment>
          {svg}
          <div style={{ display: "flex", gap: 12, marginTop: 10 }}>
            <Resumo num={(primeiro ? primeiro.valor : 0) + unidadeCurta(metrica)} txt="início" />
            <Resumo num={(ultimo ? ultimo.valor : 0) + unidadeCurta(metrica)} txt="último" />
            <Resumo num={melhor + unidadeCurta(metrica)} txt="recorde" />
          </div>
        </React.Fragment>
      ) : (
        <div style={{ color: "#8A8F98", fontSize: 13 }}>
          Registre pelo menos 2 treinos com este exercício para ver a linha de evolução.
        </div>
      )}
    </div>
  );
}
function unidadeCurta(metrica) { return metrica === "max" ? "kg" : ""; }

function FormNovoExercicio({ grupoSugerido, onSalvar, onCancelar, avisar }) {
  const [nome, setNome] = useState("");
  const [grupo, setGrupo] = useState(grupoSugerido || "peito");
  const [equip, setEquip] = useState("");
  const [passosTxt, setPassosTxt] = useState("");
  const [dica, setDica] = useState("");
  const [musc, setMusc] = useState({});

  const cicloMusc = (id) => {
    setMusc((m) => {
      const atual = m[id];
      const novo = { ...m };
      if (!atual) novo[id] = "p";
      else if (atual === "p") novo[id] = "s";
      else delete novo[id];
      return novo;
    });
  };

  const salvar = () => {
    if (!nome.trim()) { avisar("Digite o nome do exercício."); return; }
    const passos = passosTxt.split("\n").map((p) => p.trim()).filter(Boolean);
    const p = Object.keys(musc).filter((k) => musc[k] === "p");
    const s = Object.keys(musc).filter((k) => musc[k] === "s");
    onSalvar({
      id: "custom-" + Date.now(),
      custom: true,

        <textarea style={{ ...S.input, minHeight: 90, resize: "vertical", fontFamily: "inherit" }}

  );
}

// ---------------- SESSÃO: registro + cronômetro com som + observações + vídeo ----------------
function TelaSessao({ sessao, setSessao, exPorId, descanso, setDescanso, som, setSom, onFinalizar, onDescartar, onVoltar, pedirConfirmacao }) {
  const [fimDescanso, setFimDescanso] = useState(null);
  const [totalDescanso, setTotalDescanso] = useState(descanso);
  const [agora, setAgora] = useState(Date.now());
  const [avisou, setAvisou] = useState(false);
  const ultimoBipe = useRef(null);

  useEffect(() => {
    if (!fimDescanso) return;
    const iv = setInterval(() => setAgora(Date.now()), 250);
    return () => clearInterval(iv);
  }, [fimDescanso]);

  const restante = fimDescanso ? Math.max(0, Math.ceil((fimDescanso - agora) / 1000)) : 0;
  const acabou = fimDescanso && restante === 0;

  // Bipes de contagem regressiva (3, 2, 1)
  useEffect(() => {
    if (!fimDescanso || acabou) return;
    if (restante <= 3 && restante > 0 && ultimoBipe.current !== restante) {
      ultimoBipe.current = restante;
      if (som) beep(880, 0.12, 0.25);
    }
  }, [restante, fimDescanso, acabou, som]);

  // Som + vibração de finalização
  useEffect(() => {
    if (acabou && !avisou) {
      setAvisou(true);
      if (som) {
        beep(660, 0.22, 0.3);
        setTimeout(() => beep(990, 0.45, 0.3), 240);
      }
      try { if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch (e) {}
    }
  }, [acabou, avisou, som]);

  const iniciarDescanso = () => {
    setTotalDescanso(descanso);
    setFimDescanso(Date.now() + descanso * 1000);
    setAvisou(false);
    ultimoBipe.current = null;
    if (som) beep(520, 0.08, 0.15); // clique de início (também "desbloqueia" o áudio no celular)
  };
  const mais15 = () => { setFimDescanso((f) => (f ? f + 15000 : Date.now() + 15000)); setTotalDescanso((tt) => tt + 15); setAvisou(false); ultimoBipe.current = null; };
  const fecharDescanso = () => { setFimDescanso(null); setAvisou(false); ultimoBipe.current = null; };

  const upSerie = (ei, si, campo, val) => {
    const itens = sessao.itens.map((it, i) =>
      i !== ei ? it : { ...it, series: it.series.map((s, j) => (j !== si ? s : { ...s, [campo]: val })) }
    );
    setSessao({ ...sessao, itens });
  };

  const upObs = (ei, val) => {
    const itens = sessao.itens.map((it, i) => (i !== ei ? it : { ...it, obs: val }));
    setSessao({ ...sessao, itens });
  };

  const marcarSerie = (ei, si) => {
    const jaFeita = sessao.itens[ei].series[si].feito;
    upSerie(ei, si, "feito", !jaFeita);
    if (!jaFeita) iniciarDescanso();
  };

  const feitas = sessao.itens.reduce((a, it) => a + it.series.filter((s) => s.feito).length, 0);
  const total = sessao.itens.reduce((a, it) => a + it.series.length, 0);

  const fmt = (seg) => {
    const m = Math.floor(seg / 60);
    const ss = seg % 60;
    return m + ":" + (ss < 10 ? "0" : "") + ss;
  };

  const pct = fimDescanso && totalDescanso > 0 ? Math.max(0, Math.min(100, (restante / totalDescanso) * 100)) : 0;

  const btnSom = (
    <button onClick={() => { setSom(!som); if (!som) beep(700, 0.1, 0.2); }}
      title={som ? "Desligar som" : "Ligar som"}
      style={{ width: 42, height: 42, borderRadius: 10, border: "1px solid " + (som ? "#FFD60A66" : "#33363E"), background: som ? "#FFD60A22" : "transparent", fontSize: 18, cursor: "pointer" }}>
      {som ? "🔊" : "🔇"}
    </button>
  );

  return (
    <div style={{ padding: "0 18px", paddingBottom: fimDescanso ? 210 : 20 }}>
      <button style={S.voltar} onClick={onVoltar}>← Voltar (o treino continua salvo)</button>
      <div style={{ ...S.card, borderColor: "#FFD60A44", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={S.label}>Treinando agora</div>
          <div style={{ fontWeight: 900, fontSize: 18 }}>{sessao.nome}</div>
        </div>
        <div style={{ fontSize: 22, fontWeight: 900, color: "#FFD60A" }}>{feitas}/{total}</div>
      </div>

      {/* Configuração do descanso */}
      <div style={{ ...S.card, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <div style={{ flex: 1 }}>
          <div style={S.label}>Descanso entre séries</div>
          <div style={{ fontSize: 12, color: "#8A8F98", marginTop: 2 }}>Inicia ao marcar uma série ✓</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={() => setDescanso(Math.max(15, descanso - 15))}
            style={{ width: 36, height: 36, borderRadius: 8, border: "1px solid #33363E", background: "transparent", color: "#F2F0EB", fontWeight: 900, fontSize: 18, cursor: "pointer" }}>−</button>
          <div style={{ fontWeight: 900, fontSize: 17, color: "#FFD60A", minWidth: 48, textAlign: "center" }}>{fmt(descanso)}</div>
          <button onClick={() => setDescanso(Math.min(600, descanso + 15))}
            style={{ width: 36, height: 36, borderRadius: 8, border: "1px solid #33363E", background: "transparent", color: "#F2F0EB", fontWeight: 900, fontSize: 18, cursor: "pointer" }}>+</button>
          {btnSom}
        </div>
      </div>

      {sessao.itens.map((it, ei) => {
        const ex = exPorId(it.exercicioId);
        return (
          <div key={ei} style={S.card}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, gap: 8 }}>
              <div style={{ fontWeight: 800, fontSize: 16, flex: 1 }}>{ex ? ex.nome : "Exercício"}</div>
              <button onClick={() => abrirVideoDe(ex ? ex.nome : "")}
                title="Ver vídeo de como executar"
                style={{ border: "1px solid #FFD60A66", background: "#FFD60A15", color: "#FFD60A", borderRadius: 8, padding: "7px 12px", fontWeight: 800, fontSize: 12, cursor: "pointer", whiteSpace: "nowrap" }}>
                ▶ Vídeo
              </button>
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
              <div style={{ width: 30 }} />
              <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Peso (kg)</div>
              <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Reps</div>
              <div style={{ width: 44 }} />
            </div>
            {it.series.map((s, si) => (
              <div key={si} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, opacity: s.feito ? 0.55 : 1 }}>
                <div style={{ width: 30, fontWeight: 900, color: "#8A8F98", textAlign: "center" }}>{si + 1}</div>
                <input type="number" inputMode="decimal" placeholder="0" style={{ ...S.inputMini, flex: 1 }} value={s.peso}
                  onChange={(e) => upSerie(ei, si, "peso", e.target.value)} />
                <input type="number" inputMode="numeric" style={{ ...S.inputMini, flex: 1 }} value={s.reps}
                  onChange={(e) => upSerie(ei, si, "reps", e.target.value)} />
                <button onClick={() => marcarSerie(ei, si)}
                  style={{ width: 44, height: 42, borderRadius: 8, border: "none", fontWeight: 900, fontSize: 18, cursor: "pointer",
                    background: s.feito ? "#FFD60A" : "#23262D", color: s.feito ? "#0E0F12" : "#8A8F98" }}>✓</button>
              </div>
            ))}

            <input style={{ ...S.input, marginTop: 4, fontSize: 14 }}
              placeholder="📝 Obs.: altura do banco, altura da polia, pegada..."
              value={it.obs || ""}
              onChange={(e) => upObs(ei, e.target.value)} />
          </div>
        );
      })}

      <button style={{ ...S.btn, marginTop: 4 }} onClick={onFinalizar}>Finalizar treino</button>
      <button style={{ ...S.btnGhost, marginTop: 10, color: "#F58E8E", borderColor: "#F58E8E55" }}
        onClick={() => pedirConfirmacao("Descartar este treino sem salvar?", onDescartar)}>
        Descartar
      </button>

      {/* Barra do cronômetro de descanso */}
      {fimDescanso && (
        <div style={{ position: "fixed", bottom: "calc(64px + env(safe-area-inset-bottom))", left: 0, right: 0, background: acabou ? "#173B1E" : "#141519", borderTop: "2px solid " + (acabou ? "#4ADE80" : "#FFD60A"), borderBottom: "1px solid #23262D", padding: "12px 18px 14px", zIndex: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ ...S.label, color: acabou ? "#4ADE80" : "#8A8F98" }}>
                {acabou ? "Descanso concluído!" : "Descansando"}
              </div>
              <div style={{ fontSize: 30, fontWeight: 900, color: acabou ? "#4ADE80" : "#FFD60A", fontVariantNumeric: "tabular-nums" }}>
                {acabou ? "Bora! 💪" : fmt(restante)}
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <button onClick={() => { setSom(!som); if (!som) beep(700, 0.1, 0.2); }}
                style={{ width: 40, height: 40, borderRadius: 8, border: "1px solid #33363E", background: "transparent", fontSize: 16, cursor: "pointer" }}>
                {som ? "🔊" : "🔇"}
              </button>
              {!acabou && (
                <button onClick={mais15}
                  style={{ border: "1px solid #FFD60A66", background: "transparent", color: "#FFD60A", borderRadius: 8, padding: "10px 12px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
                  +15s
                </button>
              )}
              <button onClick={fecharDescanso}
                style={{ border: "1px solid #33363E", background: "transparent", color: "#F2F0EB", borderRadius: 8, padding: "10px 14px", fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
                {acabou ? "OK" : "Pular"}
              </button>
            </div>
          </div>
          {!acabou && (
            <div style={{ height: 5, background: "#23262D", borderRadius: 3, marginTop: 10, overflow: "hidden" }}>
              <div style={{ height: "100%", width: pct + "%", background: restante <= 3 ? "#FF453A" : "#FFD60A", borderRadius: 3, transition: "width 0.25s linear" }} />
            </div>
          )}
        </div>
      )}
    </div>
  );
}

  const [customEx, setCustomEx] = useState([]);

  const [som, setSom] = useState(true);
  const [carregado, setCarregado] = useState(false);

  const [grupoAberto, setGrupoAberto] = useState(null);
  const [exercicioAberto, setExercicioAberto] = useState(null);
  const [editandoTreino, setEditandoTreino] = useState(null);
  const [sessao, setSessao] = useState(null);
  const [modal, setModal] = useState(null);
  const importRef = useRef("");
  const pedirConfirmacao = (msg, onSim) => setModal({ msg, onSim });
  const avisar = (msg) => setModal({ msg });

  const copiarLink = async () => {
    try {
      await navigator.clipboard.writeText(LINK_APP);

    } catch (e) {

  };

  const exportarDados = () => {
    const dados = JSON.stringify({ treinos, historico, customEx, descanso, som, seedV3: true });
    setModal({
      msg: "Backup dos seus dados. Toque em Copiar e guarde em local seguro (ex.: cole numa conversa sua no WhatsApp). Para restaurar, use Importar dados.",
      texto: dados,
    });
  };

  const importarDados = () => {
    importRef.current = "";
    setModal({
      msg: "Cole abaixo o código do backup e toque em Confirmar. Isso substitui os dados atuais deste aparelho.",
      importar: true,
      onSim: () => {
        try {
          const d = JSON.parse(importRef.current);
          if (!d || (!d.treinos && !d.historico && !d.customEx)) throw new Error("vazio");
          setTreinos(d.treinos || []);
          setHistorico(d.historico || []);
          setCustomEx(d.customEx || []);
          if (d.descanso) setDescanso(d.descanso);
          if (d.som !== undefined) setSom(d.som);
          setTimeout(() => avisar("Backup restaurado com sucesso! 💪"), 100);
        } catch (e) {
          setTimeout(() => avisar("Não consegui ler esse código. Confira se copiou o backup completo e tente de novo."), 100);
        }
      },
    });
  };

  const todos = [...EXERCICIOS, ...customEx];
  const exPorId = (id) => todos.find((e) => e.id === id);

  useEffect(() => {
    let tr = [], hi = [], ce = [], de = 90, so = true, seed = false;
    try {
      const raw = store.get(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        tr = d.treinos || [];
        hi = d.historico || [];
        ce = d.customEx || [];
        de = d.descanso || 90;
        so = d.som !== undefined ? d.som : true;
        seed = !!d.seedV3;
      }
    } catch (e) {}
    // Insere/atualiza as fichas padrão (rotina semanal) uma única vez por versão
    if (!seed) {
      tr = tr.filter((t) => String(t.id).indexOf("padrao-") !== 0 && String(t.nome || "").trim().toLowerCase() !== "lucas koba");
      tr = [...FICHAS_PADRAO, ...tr];
    }
    setTreinos(tr); setHistorico(hi); setCustomEx(ce); setDescanso(de); setSom(so);
    setCarregado(true);
  }, []);

  useEffect(() => {
    if (!carregado) return;
    store.set(STORAGE_KEY, JSON.stringify({ treinos, historico, customEx, descanso, som, seedV3: true }));
  }, [treinos, historico, customEx, descanso, som, carregado]);

  const comecarSessao = (treino) => {
    setSessao({
      treinoId: treino.id,
      nome: treino.nome,
      inicio: Date.now(),
      itens: treino.itens.map((it) => ({
        exercicioId: it.exercicioId,
        obs: it.obs || "",
        series: Array.from({ length: it.series }, () => ({ peso: "", reps: String(it.reps || ""), feito: false })),
      })),
    });
    setAba("sessao");
  };

  const iniciarSessao = (treino) => {
    if (!treino.itens.length) { avisar("Esta ficha ainda não tem exercícios. Edite a ficha primeiro."); return; }
    if (sessao && sessao.treinoId === treino.id) { setAba("sessao"); return; }
    if (sessao) {
      pedirConfirmacao("Você já tem um treino em andamento (" + sessao.nome + "). Começar outro vai descartá-lo. Continuar?", () => comecarSessao(treino));
      return;
    }
    comecarSessao(treino);
  };

  const finalizarSessao = () => {
    const registro = {
      id: String(Date.now()),
      nome: sessao.nome,
      data: new Date().toISOString(),
      duracaoMin: Math.max(1, Math.round((Date.now() - sessao.inicio) / 60000)),
      itens: sessao.itens.map((it) => ({
        exercicioId: it.exercicioId,
        obs: it.obs || "",
        series: it.series.filter((s) => s.feito).map((s) => ({ peso: s.peso, reps: s.reps })),
      })).filter((it) => it.series.length > 0),
    };
    setHistorico([registro, ...historico]);
    // Salva as observações de volta na ficha (altura do banco, polia etc. ficam guardadas)
    setTreinos(treinos.map((t) => {
      if (t.id !== sessao.treinoId) return t;
      return { ...t, itens: t.itens.map((it, i) => (sessao.itens[i] ? { ...it, obs: sessao.itens[i].obs || "" } : it)) };
    }));
    setSessao(null);
    setAba("historico");
  };

  const excluirHistorico = (id) => setHistorico(historico.filter((h) => h.id !== id));

  const salvarTreino = (t) => {
    const existe = treinos.some((x) => x.id === t.id);
    setTreinos(existe ? treinos.map((x) => (x.id === t.id ? t : x)) : [...treinos, t]);
    setEditandoTreino(null);
    setAba("treinos");
  };

  const salvarCustomEx = (ex) => {
    setCustomEx([...customEx, ex]);
    setAba("exercicios");
    setGrupoAberto(ex.grupo);
  };

  const excluirCustomEx = (id) => {
    pedirConfirmacao("Excluir este exercício criado por você? Ele sairá das fichas em que estiver.", () => {
      setCustomEx((prev) => prev.filter((e) => e.id !== id));
      setTreinos((prev) => prev.map((t) => ({ ...t, itens: t.itens.filter((it) => it.exercicioId !== id) })));
    });
  };

  const abas = [
    { id: "inicio", nome: "Início", icone: "⌂" },
    { id: "exercicios", nome: "Exercícios", icone: "💪" },
    { id: "treinos", nome: "Fichas", icone: "▤" },
    { id: "historico", nome: "Histórico", icone: "◷" },
  ];
  const titulos = { inicio: "Treino Livre", exercicios: "Exercícios", treinos: "Minhas fichas", historico: "Histórico", editarTreino: "Editar ficha", sessao: "Treino", novoExercicio: "Novo exercício" };

  if (!carregado) {
    return <div style={{ ...S.app, display: "flex", alignItems: "center", justifyContent: "center" }}>Carregando...</div>;
  }

  return (
    <div style={S.app}>
      <Header titulo={titulos[aba]} />
      <div style={{ paddingTop: 14 }}>
        {aba === "inicio" && (
          <TelaInicio treinos={treinos} historico={historico} totalEx={todos.length}
            onTreinar={iniciarSessao}
            onCopiarLink={copiarLink}
            onExportar={exportarDados}
            onImportar={importarDados}
            onNovaFicha={() => { setEditandoTreino({ id: String(Date.now()), nome: "", itens: [] }); setAba("editarTreino"); }} />
        )}
        {aba === "exercicios" && (
          <TelaExercicios todos={todos} exPorId={exPorId}
            grupoAberto={grupoAberto} setGrupoAberto={setGrupoAberto}
            exercicioAberto={exercicioAberto} setExercicioAberto={setExercicioAberto}
            onNovoExercicio={() => setAba("novoExercicio")}
            onExcluirCustom={excluirCustomEx} />
        )}
        {aba === "novoExercicio" && (
          <FormNovoExercicio grupoSugerido={grupoAberto} avisar={avisar}
            onSalvar={salvarCustomEx}
            onCancelar={() => setAba("exercicios")} />
        )}
        {aba === "treinos" && (
          <TelaTreinos treinos={treinos} exPorId={exPorId} pedirConfirmacao={pedirConfirmacao}
            onTreinar={iniciarSessao}
            onNova={() => { setEditandoTreino({ id: String(Date.now()), nome: "", itens: [] }); setAba("editarTreino"); }}
            onEditar={(t) => { setEditandoTreino(JSON.parse(JSON.stringify(t))); setAba("editarTreino"); }}
            onExcluir={(id) => setTreinos(treinos.filter((x) => x.id !== id))} />
        )}
        {aba === "editarTreino" && editandoTreino && (
          <TelaEditarTreino key={editandoTreino.id} treinoInicial={editandoTreino} todos={todos} avisar={avisar}
            onSalvar={salvarTreino}
            onCancelar={() => { setEditandoTreino(null); setAba("treinos"); }} />
        )}
        {aba === "sessao" && sessao && (
          <TelaSessao sessao={sessao} setSessao={setSessao} exPorId={exPorId} pedirConfirmacao={pedirConfirmacao}
            descanso={descanso} setDescanso={setDescanso}
            som={som} setSom={setSom}
            onFinalizar={finalizarSessao}
            onVoltar={() => setAba("inicio")}
            onDescartar={() => { setSessao(null); setAba("inicio"); }} />
        )}
        {aba === "historico" && <TelaHistorico historico={historico} exPorId={exPorId} onExcluir={excluirHistorico} pedirConfirmacao={pedirConfirmacao} />}
      </div>

      {modal && (
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.75)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}
          onClick={() => setModal(null)}>
          <div style={{ ...S.card, width: "100%", maxWidth: 340, marginBottom: 0, borderColor: "#33363E" }}
            onClick={(e) => e.stopPropagation()}>
            <div style={{ fontSize: 15, lineHeight: 1.6, marginBottom: 16 }}>{modal.msg}</div>
            {modal.texto && (
              <React.Fragment>
                <textarea readOnly value={modal.texto} onFocus={(e) => e.target.select()}
                  style={{ ...S.input, minHeight: 130, fontSize: 11, marginBottom: 10, fontFamily: "monospace" }} />
                <button style={{ ...S.btnGhost, marginBottom: 12 }}
                  onClick={async (e) => {
                    try { await navigator.clipboard.writeText(modal.texto); e.target.textContent = "✓ Copiado!"; } catch (err) {}
                  }}>
                  📋 Copiar
                </button>
              </React.Fragment>
            )}
            {modal.importar && (
              <textarea placeholder="Cole o código do backup aqui..."
                onChange={(e) => { importRef.current = e.target.value; }}
                style={{ ...S.input, minHeight: 130, fontSize: 11, marginBottom: 12, fontFamily: "monospace" }} />
            )}
            <div style={{ display: "flex", gap: 10 }}>
              {modal.onSim ? (
                <React.Fragment>
                  <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => setModal(null)}>Cancelar</button>
                  <button style={{ ...S.btn, flex: 1, background: "#FF453A", color: "#FFFFFF" }}
                    onClick={() => { const f = modal.onSim; setModal(null); f(); }}>Confirmar</button>
                </React.Fragment>
              ) : (
                <button style={{ ...S.btn, flex: 1 }} onClick={() => setModal(null)}>OK</button>
              )}
            </div>
          </div>
        </div>
      )}

      {sessao && aba !== "sessao" && (
        <div style={{ position: "fixed", bottom: "calc(72px + env(safe-area-inset-bottom))", left: 12, right: 12, zIndex: 15 }}>
          <button onClick={() => setAba("sessao")}
            style={{ ...S.btn, boxShadow: "0 4px 16px rgba(0,0,0,0.5)", border: "2px solid #0E0F12" }}>
            ▶ Continuar treino — {sessao.nome}
          </button>
        </div>
      )}

      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#141519", borderTop: "1px solid #23262D", display: "flex", padding: "8px 0", paddingBottom: "calc(14px + env(safe-area-inset-bottom))", zIndex: 10 }}>
        {abas.map((a) => (
          <button key={a.id} onClick={() => { setAba(a.id); setGrupoAberto(null); setExercicioAberto(null); }}
            style={{ flex: 1, background: "none", border: "none", cursor: "pointer", color: aba === a.id ? "#FFD60A" : "#8A8F98", fontWeight: aba === a.id ? 900 : 600 }}>
            <div style={{ fontSize: 18 }}>{a.icone}</div>
            <div style={{ fontSize: 11, marginTop: 2 }}>{a.nome}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TreinoLivre />);

// Modo offline: depois da primeira visita, o app abre mesmo sem internet
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>

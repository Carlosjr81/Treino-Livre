// ---------------- ESTATÍSTICAS: TONELAGEM SEMANAL ----------------
function GraficoSemanal({ historico }) {
  const semanas = volumeSemanal(historico, 8);
  const vmax = Math.max(...semanas.map((s) => s.volume), 1);
  const W = 320, H = 130, base = 104, larg = 26;
  const passo = (W - 20) / semanas.length;
  const media = Math.round(semanas.reduce((a, s) => a + s.volume, 0) / semanas.length);
  return (
    <div style={S.card}>
      <div style={S.label}>Tonelagem por semana</div>
      <div style={{ color: "var(--cinza)", fontSize: 12, margin: "4px 0 12px" }}>
        Últimas 8 semanas · média de {fmtPeso(media)} por semana
      </div>
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }}>
        <line x1="10" x2={W - 10} y1={base} y2={base} stroke="var(--borda)" strokeWidth="1" />
        {semanas.map((s, i) => {
          const alt = s.volume ? Math.max(3, (s.volume / vmax) * 82) : 0;
          const x = 10 + i * passo + (passo - larg) / 2;
          const atual = i === semanas.length - 1;
          return (
            <g key={i}>
              {alt > 0 && (
                <rect x={x} y={base - alt} width={larg} height={alt} rx="5"
                  fill={atual ? "#E1306C" : "#E1306C66"} />
              )}
              {s.volume > 0 && (
                <text x={x + larg / 2} y={base - alt - 5} fill="var(--cinza)" fontSize="9" textAnchor="middle">
                  {s.volume >= 1000 ? Math.round(s.volume / 1000) + "t" : s.volume}
                </text>
              )}
              <text x={x + larg / 2} y={base + 14} fill="var(--cinza2)" fontSize="9" textAnchor="middle">
                {s.ini.getDate() + "/" + (s.ini.getMonth() + 1)}
              </text>
              <text x={x + larg / 2} y={base + 25} fill="var(--cinza2)" fontSize="8" textAnchor="middle">
                {s.treinos ? s.treinos + "x" : ""}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// ---------------- ESTATÍSTICAS: VOLUME POR MÚSCULO ----------------
function VolumeMusculos({ historico, exPorId }) {
  const [dias, setDias] = useState(30);
  const desde = dias ? Date.now() - dias * 86400000 : 0;
  const lista = volumePorGrupo(historico, exPorId, desde);
  const total = lista.reduce((a, x) => a + x.volume, 0);
  const vmax = lista.length ? lista[0].volume : 1;
  return (
    <div style={S.card}>
      <div style={S.label}>Volume por músculo</div>
      <div style={{ display: "flex", gap: 8, margin: "10px 0 14px" }}>
        {[[7, "7 dias"], [30, "30 dias"], [0, "Sempre"]].map(([d, nome]) => (
          <button key={d} onClick={() => setDias(d)}
            style={{
              flex: 1, border: "1px solid", borderColor: dias === d ? "#E1306C" : "var(--borda2)",
              background: dias === d ? "#E1306C22" : "transparent",
              color: dias === d ? "#E1306C" : "var(--cinza)",
              borderRadius: 8, padding: "8px 6px", fontWeight: 800, fontSize: 12, cursor: "pointer",
            }}>
            {nome}
          </button>
        ))}
      </div>
      {lista.length === 0 ? (
        <div style={{ color: "var(--cinza)", fontSize: 13 }}>
          Nenhum treino registrado nesse período. Conclua um treino para ver a divisão por músculo.
        </div>
      ) : (
        lista.map((g) => {
          const cor = corGrupo(GRUPOS.find((x) => x.id === g.id));
          const pct = total ? Math.round((g.volume / total) * 100) : 0;
          return (
            <div key={g.id} style={{ marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4 }}>
                <span style={{ fontWeight: 700 }}>{g.nome}</span>
                <span style={{ color: "var(--cinza)" }}>{fmtPeso(g.volume)} · {pct}%</span>
              </div>
              <div style={{ height: 8, borderRadius: 4, background: "var(--borda)" }}>
                <div style={{ height: 8, borderRadius: 4, width: Math.max(3, (g.volume / vmax) * 100) + "%", background: cor }} />
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

// ---------------- ESTATÍSTICAS: CALENDÁRIO DO MÊS ----------------
function CalendarioTreinos({ historico }) {
  const [desl, setDesl] = useState(0);
  const hoje = new Date();
  const ref = new Date(hoje.getFullYear(), hoje.getMonth() + desl, 1);
  const porDia = {};
  historico.forEach((h) => {
    const d = new Date(h.data);
    if (d.getMonth() === ref.getMonth() && d.getFullYear() === ref.getFullYear()) {
      porDia[d.getDate()] = (porDia[d.getDate()] || 0) + statsTreino(h).volume;
    }
  });
  const vmax = Math.max(...Object.keys(porDia).map((k) => porDia[k]), 1);
  const nDias = new Date(ref.getFullYear(), ref.getMonth() + 1, 0).getDate();
  const inicio = (new Date(ref.getFullYear(), ref.getMonth(), 1).getDay() + 6) % 7;
  const celulas = [];
  for (let i = 0; i < inicio; i++) celulas.push(null);
  for (let d = 1; d <= nDias; d++) celulas.push(d);
  const treinosMes = Object.keys(porDia).length;
  return (
    <div style={S.card}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <button onClick={() => setDesl(desl - 1)} aria-label="Mês anterior"
          style={{ background: "none", border: "none", color: "#E1306C", fontSize: 20, fontWeight: 900, cursor: "pointer", padding: "0 8px" }}>‹</button>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontWeight: 900, fontSize: 14, textTransform: "capitalize" }}>
            {ref.toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}
          </div>
          <div style={{ color: "var(--cinza)", fontSize: 11 }}>{treinosMes} {plural(treinosMes, "dia", "dias")} de treino</div>
        </div>
        <button onClick={() => setDesl(Math.min(0, desl + 1))} disabled={desl >= 0} aria-label="Mês seguinte"
          style={{ background: "none", border: "none", color: desl >= 0 ? "var(--borda2)" : "#E1306C", fontSize: 20, fontWeight: 900, cursor: desl >= 0 ? "default" : "pointer", padding: "0 8px" }}>›</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginTop: 12 }}>
        {["S", "T", "Q", "Q", "S", "S", "D"].map((d, i) => (
          <div key={i} style={{ textAlign: "center", fontSize: 10, color: "var(--cinza2)", fontWeight: 700 }}>{d}</div>
        ))}
        {celulas.map((d, i) => {
          if (d === null) return <div key={i} />;
          const vol = porDia[d];
          const intens = vol ? 0.3 + (vol / vmax) * 0.7 : 0;
          const ehHoje = desl === 0 && d === hoje.getDate();
          return (
            <div key={i} title={vol ? fmtPeso(vol) : ""}
              style={{
                aspectRatio: "1", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 11, fontWeight: vol ? 900 : 500,
                background: vol ? "rgba(225,48,108," + intens + ")" : "var(--input)",
                color: vol ? "#FFFFFF" : "var(--cinza2)",
                border: ehHoje ? "1.5px solid #E1306C" : "1px solid var(--borda)",
              }}>
              {d}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------------- ESTATÍSTICAS: NÚMEROS GERAIS ----------------
function NumerosGerais({ historico }) {
  const est = calcularEstatisticas(historico);
  let minutos = 0, series = 0, reps = 0;
  historico.forEach((h) => {
    minutos += h.duracaoMin || 0;
    const s = statsTreino(h);
    series += s.series; reps += s.reps;
  });
  // Média das últimas 8 semanas: usa o MESMO período no numerador e no denominador.
  // Conta só a partir da primeira semana em que houve treino, para não penalizar quem começou agora.
  const ult8 = volumeSemanal(historico, 8);
  const treinos8 = ult8.reduce((a, s) => a + s.treinos, 0);
  const primeiraAtiva = ult8.findIndex((s) => s.treinos > 0);
  const semanas = primeiraAtiva < 0 ? 1 : ult8.length - primeiraAtiva;
  const eq = equivalencia(est.volumeTotal);
  const itens = [
    ["Treinos", est.total],
    ["Horas", (Math.round((minutos / 60) * 10) / 10).toLocaleString("pt-BR")],
    ["Séries", series.toLocaleString("pt-BR")],
    ["Repetições", reps.toLocaleString("pt-BR")],
    ["Volume total", fmtPeso(est.volumeTotal)],
    ["Sequência", est.streak + " " + plural(est.streak, "dia", "dias")],
    ["Média/semana", (() => {
      const m = Math.round((treinos8 / semanas) * 10) / 10;
      return m.toLocaleString("pt-BR") + " " + plural(m, "treino", "treinos");
    })()],
    ["Esta semana", fmtPeso(est.volumeSemana)],
  ];
  return (
    <div style={S.card}>
      <div style={{ ...S.label, marginBottom: 12 }}>Seus números</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {itens.map(([nome, val]) => (
          <div key={nome} style={{ background: "var(--input)", border: "1px solid var(--borda)", borderRadius: 12, padding: "10px 12px" }}>
            <div style={{ fontSize: 18, fontWeight: 900, color: "#E1306C" }}>{val}</div>
            <div style={{ fontSize: 10, color: "var(--cinza)", textTransform: "uppercase", letterSpacing: 0.5 }}>{nome}</div>
          </div>
        ))}
      </div>
      {eq && (
        <div style={{ marginTop: 12, fontSize: 12, color: "var(--cinza)", textAlign: "center" }}>
          Você já moveu {fmtPeso(est.volumeTotal)} — {eq}
        </div>
      )}
    </div>
  );
}

// ---------------- GRÁFICO DE EVOLUÇÃO ----------------
function GraficoEvolucao({ historico, exPorId }) {
  const idsComDados = [];
  const vistos = {};
  historico.forEach((h) => h.itens.forEach((it) => {
    const temPeso = it.series.some((s) => parseFloat(s.peso) > 0);
    if (temPeso && !vistos[it.exercicioId] && exPorId(it.exercicioId)) {
      vistos[it.exercicioId] = true;
      idsComDados.push(it.exercicioId);
    }
  }));

  const [exSel, setExSel] = useState(idsComDados[0] || "");
  const [metrica, setMetrica] = useState("max");

  useEffect(() => {
    if ((!exSel || !vistos[exSel]) && idsComDados.length) setExSel(idsComDados[0]);
  }, [historico.length]);

  if (idsComDados.length === 0) {
    return (
      <div style={S.card}>
        <div style={S.label}>Evolução</div>
        <div style={{ color: "var(--cinza)", fontSize: 14, marginTop: 8 }}>
          Conclua treinos registrando os pesos para ver seu gráfico de evolução aqui.
        </div>
      </div>
    );
  }

  const ordenado = [...historico].sort((a, b) => new Date(a.data) - new Date(b.data));
  const pontos = [];
  ordenado.forEach((h) => {
    const it = h.itens.find((x) => x.exercicioId === exSel);
    if (!it) return;
    let valor = 0;
    if (metrica === "max") {
      it.series.forEach((sr) => {
        if (!serieConta(sr)) return;
        const pz = ehTempo(sr) ? segundosDe(sr) : cargaDe(sr);
        if (pz > valor) valor = pz;
      });
    } else if (metrica === "1rm") {
      valor = melhor1RM(it);
    } else {
      valor = itemDeTempo(it) ? tempoItem(it) : volumeItem(it);
    }
    if (valor > 0) pontos.push({ data: new Date(h.data), valor });
  });

  const W = 320, H = 150, x0 = 34, x1 = 310, y0 = 118, y1 = 16;
  let svg = null;
  if (pontos.length >= 2) {
    const vmin = Math.min(...pontos.map((pt) => pt.valor));
    const vmax = Math.max(...pontos.map((pt) => pt.valor));
    const range = vmax - vmin || 1;
    const px = (i) => x0 + (i / (pontos.length - 1)) * (x1 - x0);
    const py = (v) => y0 - ((v - vmin) / range) * (y0 - y1);
    const linha = pontos.map((pt, i) => px(i).toFixed(1) + "," + py(pt.valor).toFixed(1)).join(" ");
    const fmtData = (d) => d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
    svg = (
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }}>
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={x0} x2={x1} y1={y0 - f * (y0 - y1)} y2={y0 - f * (y0 - y1)} stroke="var(--borda)" strokeWidth="1" />
        ))}
        <text x={x0 - 4} y={y1 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{vmax}</text>
        <text x={x0 - 4} y={y0 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{vmin}</text>
        <polyline points={linha} fill="none" stroke="#E1306C" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        {pontos.map((pt, i) => (
          <circle key={i} cx={px(i)} cy={py(pt.valor)} r="3.5" fill="#ED4956" stroke="var(--bg)" strokeWidth="1" />
        ))}
        <text x={x0} y={H - 4} fill="var(--cinza)" fontSize="10">{fmtData(pontos[0].data)}</text>
        <text x={x1} y={H - 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{fmtData(pontos[pontos.length - 1].data)}</text>
      </svg>
    );
  }

  const primeiro = pontos[0], ultimo = pontos[pontos.length - 1];
  const melhor = pontos.length ? Math.max(...pontos.map((pt) => pt.valor)) : 0;

  return (
    <div style={S.card}>
      <div style={{ ...S.label, marginBottom: 10 }}>Evolução do treino</div>

      <select value={exSel} onChange={(e) => setExSel(e.target.value)}
        style={{ ...S.input, marginBottom: 10, fontWeight: 700 }}>
        {idsComDados.map((id) => {
          const e = exPorId(id);
          return <option key={id} value={id}>{e ? e.nome : id}</option>;
        })}
      </select>

      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        {[["max", "Carga máx."], ["volume", "Volume"], ["1rm", "1RM estim."]].map(([m, nomeM]) => (
          <button key={m} onClick={() => setMetrica(m)}
            style={{
              flex: 1, border: "1px solid", borderColor: metrica === m ? "#E1306C" : "var(--borda2)",
              background: metrica === m ? "#E1306C22" : "transparent",
              color: metrica === m ? "#E1306C" : "var(--cinza)",
              borderRadius: 8, padding: "8px 10px", fontWeight: 800, fontSize: 12, cursor: "pointer",
            }}>
            {nomeM}
          </button>
        ))}
      </div>

      {pontos.length >= 2 ? (
        <React.Fragment>
          {svg}
          <div style={{ display: "flex", gap: 12, marginTop: 10 }}>
            <Resumo num={(primeiro ? primeiro.valor : 0) + unidadeCurta(metrica)} txt="início" />
            <Resumo num={(ultimo ? ultimo.valor : 0) + unidadeCurta(metrica)} txt="último" />
            <Resumo num={melhor + unidadeCurta(metrica)} txt="recorde" />
          </div>
          {metrica === "1rm" && (
            <div style={{ color: "var(--cinza2)", fontSize: 11, marginTop: 10, lineHeight: 1.4 }}>
              1RM estimado é a carga máxima que você levantaria em uma única repetição, calculada a partir das suas séries (fórmula de Epley). Serve para comparar treinos com repetições diferentes.
            </div>
          )}
        </React.Fragment>
      ) : (
        <div style={{ color: "var(--cinza)", fontSize: 13 }}>
          Registre pelo menos 2 treinos com este exercício para ver a linha de evolução.
        </div>
      )}
    </div>
  );
}
function unidadeCurta(metrica) { return metrica === "volume" ? "" : "kg"; }

// Cronômetro do treino. Componente separado de propósito: assim o relógio bate
// a cada segundo sem redesenhar a lista inteira de exercícios e campos.
function CronometroSessao({ inicio }) {
  const [agora, setAgora] = useState(Date.now());
  useEffect(() => {
    const iv = setInterval(() => setAgora(Date.now()), 1000);
    return () => clearInterval(iv);
  }, []);
  const seg = Math.max(0, Math.floor((agora - inicio) / 1000));
  const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60;
  const dois = (n) => (n < 10 ? "0" + n : String(n));
  return (
    <span style={{ fontVariantNumeric: "tabular-nums" }}>
      {h > 0 ? h + ":" + dois(m) + ":" + dois(s) : m + ":" + dois(s)}
    </span>
  );
}

function MetaSemanal({ historico, meta, setMeta }) {
  const feitos = volumeSemanal(historico, 1)[0].treinos;

  const R = 34, C = 2 * Math.PI * R;

  return (
    <div style={{ ...S.card, display: "flex", alignItems: "center", gap: 16 }}>
      <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true" style={{ flexShrink: 0 }}>

        <circle cx="42" cy="42" r={R} fill="none" stroke={bateu ? "var(--ok)" : "#E1306C"} strokeWidth="9"
          strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C - (C * pct) / 100}
          transform="rotate(-90 42 42)" style={{ transition: "stroke-dashoffset .6s ease" }} />
        <text x="42" y="47" textAnchor="middle" fontSize="20" fontWeight="900" fill="var(--texto)">{feitos}</text>
      </svg>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={S.label}>Meta da semana</div>
        <div style={{ fontSize: 15, fontWeight: 800, margin: "4px 0 2px" }}>
          {bateu ? "Meta batida! 🎉" : feitos + " de " + meta + " " + plural(meta, "treino", "treinos")}
        </div>
        <div style={{ fontSize: 12, color: "var(--cinza)" }}>
          {bateu
            ? "Tudo que vier agora é lucro."
            : "Faltam " + (meta - feitos) + " " + plural(meta - feitos, "treino", "treinos") + " até domingo."}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10 }}>
          <button onClick={() => setMeta(Math.max(1, meta - 1))} aria-label="Diminuir a meta semanal"
            style={{ width: 32, height: 32, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 17, cursor: "pointer" }}>−</button>
          <span style={{ fontSize: 12, color: "var(--cinza)" }}>meta: <b style={{ color: "var(--texto)" }}>{meta}x</b> por semana</span>

            style={{ width: 32, height: 32, borderRadius: 8, border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", fontWeight: 900, fontSize: 17, cursor: "pointer" }}>+</button>
        </div>
      </div>
    </div>
  );
}

// ---------------- O QUE TREINAR HOJE ----------------
function OQueTreinarHoje({ historico, exPorId, onAbrirGrupo }) {
  const lista = recuperacaoMuscular(historico, exPorId);
  if (!historico.length) return null;
  const rotulo = (r) => {
    if (r.dias === null) return "nunca treinado";
    if (r.dias === 0) return "hoje";
    return "há " + r.dias + " " + plural(r.dias, "dia", "dias");

// ---------------- LEMBRETE DE TREINO ----------------
function CartaoLembrete({ lembrete, setLembrete, avisar }) {
  const suportaNotificacao = typeof Notification !== "undefined";
  const [permissao, setPermissao] = useState(suportaNotificacao ? Notification.permission : "unsupported");

  const ligar = async () => {
    if (!suportaNotificacao) {
      avisar("Este navegador não permite avisos. O lembrete vai aparecer dentro do app quando você abrir.");
      setLembrete({ ...lembrete, ativo: true });
      return;
    }
    let p = Notification.permission;
    if (p === "default") p = await Notification.requestPermission();
    setPermissao(p);
    if (p !== "granted") {
      avisar("Você não autorizou os avisos. Para receber lembretes, libere as notificações do Treino Livre nas configurações do navegador.");
      return;
    }
    setLembrete({ ...lembrete, ativo: true });
    registrarEvento("lembrete-ativado");
  };

  const alternarDia = (n) => {
    const dias = lembrete.dias.includes(n) ? lembrete.dias.filter((d) => d !== n) : [...lembrete.dias, n].sort();
    setLembrete({ ...lembrete, dias });
  };

  return (
    <div style={S.card}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <div style={{ minWidth: 0 }}>
          <div style={S.label}>🔔 Lembrete de treino</div>
          <div style={{ fontSize: 13, color: "var(--cinza)", marginTop: 4, lineHeight: 1.5 }}>
            {lembrete.ativo ? "Ligado para " + lembrete.hora : "Um empurrão nos dias que você escolher."}
          </div>
        </div>
        <button onClick={() => (lembrete.ativo ? setLembrete({ ...lembrete, ativo: false }) : ligar())}
          aria-pressed={lembrete.ativo} aria-label={lembrete.ativo ? "Desligar o lembrete" : "Ligar o lembrete"}
          style={{
            width: 54, height: 30, borderRadius: 15, flexShrink: 0, cursor: "pointer", position: "relative",
            border: "1px solid " + (lembrete.ativo ? "#E1306C" : "var(--borda2)"),
            background: lembrete.ativo ? GRAD : "var(--input)", transition: "background .2s",
          }}>
          <span aria-hidden="true" style={{
            position: "absolute", top: 3, left: lembrete.ativo ? 27 : 3, width: 22, height: 22,
            borderRadius: "50%", background: "#FFFFFF", transition: "left .2s", boxShadow: "0 1px 3px rgba(0,0,0,.3)",
          }} />
        </button>
      </div>

      {lembrete.ativo && (
        <React.Fragment>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 14 }}>
            <span style={{ fontSize: 13, color: "var(--cinza)" }}>Horário</span>
            <input type="time" value={lembrete.hora} aria-label="Horário do lembrete"
              onChange={(e) => setLembrete({ ...lembrete, hora: e.target.value || "18:00" })}
              style={{ ...S.input, width: "auto", flex: "0 0 auto", padding: "9px 12px", fontWeight: 800 }} />
          </div>
          <div style={{ ...S.label, fontSize: 10, margin: "14px 0 8px" }}>Dias</div>
          <div style={{ display: "flex", gap: 6 }}>
            {DIAS_SEMANA.map((d) => {
              const on = lembrete.dias.includes(d.n);
              return (
                <button key={d.n} onClick={() => alternarDia(d.n)} aria-pressed={on}
                  aria-label={(on ? "Desmarcar " : "Marcar ") + d.nome}
                  style={{
                    flex: 1, aspectRatio: "1", borderRadius: 10, cursor: "pointer", fontWeight: 900, fontSize: 13,
                    border: "1px solid " + (on ? "#E1306C" : "var(--borda2)"),
                    background: on ? "#E1306C22" : "transparent",
                    color: on ? "#E1306C" : "var(--cinza)",
                  }}>
                  {d.curto}
                </button>
              );
            })}
          </div>
          <div style={{ fontSize: 11, color: "var(--cinza2)", marginTop: 12, lineHeight: 1.5 }}>
            {permissao === "granted"
              ? "Com o app instalado no Android, o aviso pode chegar mesmo fechado. Em outros aparelhos ele aparece quando você abre o app."
              : "Sem autorização de notificação, o lembrete só aparece dentro do app."}
            {" "}O aviso não vem se você já treinou naquele dia.
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// ---------------- SÉRIES DA SEMANA POR GRUPO ----------------
// O app já sabia quantas séries de cada grupo você fez. Faltava dizer se isso
// é pouco ou suficiente — é o que transforma o dado em orientação.
const FAIXA_SERIES = { min: 10, max: 20 };
function seriesSemanaisPorGrupo(historico, exPorId) {
  const inicio = segundaDaSemana(new Date()).getTime();
  const acc = {};
  historico.forEach((h) => {
    if (new Date(h.data).getTime() < inicio) return;
    (h.itens || []).forEach((it) => {
      const e = exPorId(it.exercicioId);
      if (!e) return;
      // aquecimento não conta como série de trabalho
      const n = (it.series || []).filter(serieConta).length;
      acc[e.grupo] = (acc[e.grupo] || 0) + n;
    });
  });
  return GRUPOS.map((g) => ({ id: g.id, nome: g.nome, series: acc[g.id] || 0 }))
    .sort((a, b) => b.series - a.series);
}

function VolumeRecomendado({ historico, exPorId }) {
  const lista = seriesSemanaisPorGrupo(historico, exPorId);
  const teto = Math.max(FAIXA_SERIES.max + 4, ...lista.map((x) => x.series));
  const situacao = (n) => {
    if (n === 0) return { txt: "não treinou", cor: "var(--cinza2)" };
    if (n < FAIXA_SERIES.min) return { txt: "abaixo da faixa", cor: "var(--obs)" };
    if (n <= FAIXA_SERIES.max) return { txt: "na faixa", cor: "var(--ok)" };
    return { txt: "acima da faixa", cor: "var(--perigo)" };
  };
  return (
    <div style={S.card}>
      <div style={S.label}>Séries desta semana por grupo</div>
      <div style={{ fontSize: 12, color: "var(--cinza)", margin: "6px 0 14px", lineHeight: 1.5 }}>
        A faixa de <b>{FAIXA_SERIES.min} a {FAIXA_SERIES.max} séries por semana</b> é a referência mais citada
        para ganho de massa. É um guia, não uma regra: o que importa é a tendência ao longo das semanas.
      </div>
      {lista.map((g) => {
        const s = situacao(g.series);
        const cor = corGrupo(GRUPOS.find((x) => x.id === g.id));
        return (
          <div key={g.id} style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 5 }}>
              <span style={{ fontWeight: 700 }}>{g.nome}</span>
              <span style={{ color: s.cor, fontWeight: 700 }}>{g.series} {plural(g.series, "série", "séries")} · {s.txt}</span>
            </div>
            {/* a faixa recomendada aparece como uma zona clara atrás da barra */}
            <div style={{ position: "relative", height: 10, borderRadius: 5, background: "var(--borda)", overflow: "hidden" }}>
              <div aria-hidden="true" style={{
                position: "absolute", top: 0, bottom: 0,
                left: (FAIXA_SERIES.min / teto) * 100 + "%",
                width: ((FAIXA_SERIES.max - FAIXA_SERIES.min) / teto) * 100 + "%",
                background: "var(--ok)", opacity: 0.22,
              }} />
              <div style={{ position: "relative", height: "100%", width: Math.min(100, (g.series / teto) * 100) + "%", background: cor, borderRadius: 5 }} />
            </div>
          </div>
        );
      })}
      <div style={{ fontSize: 11, color: "var(--cinza2)", marginTop: 4, lineHeight: 1.5 }}>
        A zona verde clara marca a faixa recomendada. Séries de aquecimento não entram na conta.
      </div>
    </div>
  );
}

// ---------------- FAIXA COMPACTA DE PROGRESSO ----------------
// A tela inicial tinha 14 cartões e virou uma parede. O progresso detalhado
// mudou para Histórico > Números; aqui fica só o resumo, que leva até lá.
function FaixaProgresso({ est, historico, meta, onAbrirProgresso }) {
  const n = nivelDe(est);
  const feitos = volumeSemanal(historico, 1)[0].treinos;
  const bateu = feitos >= meta;
  const R = 22, C = 2 * Math.PI * R;
  const pct = meta > 0 ? Math.min(100, (feitos / meta) * 100) : 0;
  return (
    <button type="button" onClick={onAbrirProgresso}
      aria-label={"Ver seu progresso. Nível " + n.indice + ", " + n.nome + ". " + feitos + " de " + meta + " treinos nesta semana."}
      style={{ ...S.card, width: "100%", textAlign: "left", font: "inherit", color: "var(--texto)", cursor: "pointer", display: "flex", alignItems: "center", gap: 14 }}>
      <span aria-hidden="true" style={{ fontSize: 30, lineHeight: 1, flexShrink: 0 }}>{n.icone}</span>
      <span style={{ flex: 1, minWidth: 0 }}>
        <span style={{ display: "block", ...S.label }}>Nível {n.indice}</span>
        <span style={{ display: "block", fontSize: 16, fontWeight: 900, marginTop: 2 }}>{n.nome}</span>
        <span style={{ display: "block", height: 6, background: "var(--borda)", borderRadius: 3, marginTop: 8, overflow: "hidden" }}>
          <span style={{ display: "block", height: "100%", width: Math.max(3, n.pct) + "%", background: GRAD_LINHA, borderRadius: 3 }} />
        </span>
        <span style={{ display: "block", fontSize: 11, color: "var(--cinza)", marginTop: 6 }}>
          🔥 {est.streak} {plural(est.streak, "dia", "dias")} · ver progresso ›
        </span>
      </span>
      <svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true" style={{ flexShrink: 0 }}>
        <circle cx="27" cy="27" r={R} fill="none" stroke="var(--borda)" strokeWidth="6" />
        <circle cx="27" cy="27" r={R} fill="none" stroke={bateu ? "var(--ok)" : "#E1306C"} strokeWidth="6"
          strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C - (C * pct) / 100}
          transform="rotate(-90 27 27)" />
        <text x="27" y="32" textAnchor="middle" fontSize="16" fontWeight="900" fill="var(--texto)">{feitos}</text>
      </svg>
    </button>
  );
}

function CardExercicio({ ex, onAbrir, onExcluir }) {
  // O cartão inteiro é um botão de verdade (acessível pelo teclado), com o
  // excluir como botão irmão — botão dentro de botão não é HTML válido.
  return (
    <div style={{ ...S.card, padding: 0, display: "flex", justifyContent: "space-between", alignItems: "stretch", overflow: "hidden" }}>
      <button type="button" onClick={onAbrir} aria-label={"Abrir " + ex.nome}
        style={{ flex: 1, textAlign: "left", font: "inherit", color: "var(--texto)", background: "none", border: "none", padding: 16, cursor: "pointer" }}>
        <span style={{ display: "block", fontWeight: 800, fontSize: 16 }}>
          {ex.nome}
          {ex.custom && <span style={S.tagCustom}>Meu</span>}
        </span>
        <span style={{ display: "block", color: "var(--cinza)", fontSize: 13, marginTop: 2 }}>{ex.equip || "Equipamento livre"}</span>
      </button>
      {ex.custom && (
        <button type="button" aria-label={"Excluir o exercício " + ex.nome}
          style={{ background: "none", border: "none", color: "var(--perigo)", fontSize: 18, cursor: "pointer", padding: "0 16px" }}
          onClick={() => onExcluir(ex.id)}>✕</button>
      )}
    </div>
  );
}

  const g = grupoPorId(ex.grupo);
  const p = (ex.musc && ex.musc.p) || [];
  const s = (ex.musc && ex.musc.s) || [];

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onVoltar}>← Voltar</button>
      <div style={{ ...S.card, borderLeft: "4px solid " + corGrupo(g) }}>
        <div style={{ ...S.label, color: corGrupo(g) }}>{g.nome}{ex.equip ? " · " + ex.equip : ""}</div>
        <div style={{ fontSize: 22, fontWeight: 900, margin: "6px 0 14px" }}>
          {ex.nome}
          {ex.custom && <span style={S.tagCustom}>Meu</span>}
        </div>

        <ImagemExercicio ex={ex} />

        {temMapa && (
          <React.Fragment>
            <div style={{ ...S.label, margin: "14px 0 10px" }}>Músculos trabalhados</div>
            <MapaMuscular p={p} s={s} />
            <div style={{ fontSize: 13, lineHeight: 1.6, margin: "12px 0 16px" }}>
              {p.length > 0 && (
                <div><span style={{ color: corMuscTxt("p"), fontWeight: 800 }}>Direto: </span>{p.map((m) => MUSCULOS[m]).join(", ")}</div>
              )}
              {s.length > 0 && (
                <div><span style={{ color: corMuscTxt("s"), fontWeight: 800 }}>Indireto: </span>{s.map((m) => MUSCULOS[m]).join(", ")}</div>
              )}
            </div>
          </React.Fragment>
        )}

        <button style={{ ...S.btnGhost, marginBottom: 16, borderColor: "#E1306C66", color: "#E1306C" }} onClick={() => abrirVideoDe(ex.nome)}>
          ▶ Ver demonstração em vídeo
        </button>

        {ex.passos && ex.passos.length > 0 && (
          <React.Fragment>
            <div style={S.label}>Execução</div>
            <ol style={{ margin: "8px 0 16px", paddingLeft: 20, lineHeight: 1.6, fontSize: 15 }}>
              {ex.passos.map((pp, i) => <li key={i} style={{ marginBottom: 6 }}>{pp}</li>)}
            </ol>
          </React.Fragment>

          <div style={{ background: "var(--bg)", borderRadius: 10, padding: 12, fontSize: 14, lineHeight: 1.5 }}>

        )}

    </div>

}

function TelaExercicios({ todos, exPorId, grupoAberto, setGrupoAberto, exercicioAberto, setExercicioAberto, onNovoExercicio, onExcluirCustom }) {
  const [busca, setBusca] = useState("");
  const [equip, setEquip] = useState(null);   // família de equipamento escolhida

  // Se o exercício aberto sumiu (custom excluído), cai de volta na lista em vez
  // de alterar estado durante o render.
  const exAberto = exercicioAberto ? exPorId(exercicioAberto) : null;
  if (exAberto) {
    return <DetalheExercicio ex={exAberto} onVoltar={() => setExercicioAberto(null)} />;
  }

  const fam = equip ? FAMILIAS_EQUIP.find((f) => f.id === equip) : null;
  const porEquip = (lista) => (fam ? lista.filter((e) => naFamilia(e, fam)) : lista);
  // A busca olha nome E equipamento: "halteres" e "polia" passam a achar coisa.
  const alvo = semAcento(busca.trim());
  const buscando = alvo.length > 0;
  const resultados = buscando
    ? porEquip(todos.filter((e) => semAcento(e.nome).includes(alvo) || semAcento(e.equip).includes(alvo)))
    : [];

  if (grupoAberto && !buscando) {
    const g = grupoPorId(grupoAberto);
    const lista = porEquip(todos.filter((e) => e.grupo === grupoAberto));
    return (
      <div style={{ padding: "0 18px" }}>
        <button style={S.voltar} onClick={() => setGrupoAberto(null)}>← Grupos</button>
        <div style={{ fontSize: 24, fontWeight: 900, textTransform: "uppercase", marginBottom: 12, color: corGrupo(g) }}>{g.nome}</div>
        {lista.map((ex) => (
          <CardExercicio key={ex.id} ex={ex} onAbrir={() => setExercicioAberto(ex.id)} onExcluir={onExcluirCustom} />
        ))}
        <button style={{ ...S.btnGhost, marginTop: 4 }} onClick={onNovoExercicio}>+ Criar exercício próprio</button>
      </div>
    );
  }

  return (
    <div style={{ padding: "0 18px" }}>
      <input style={{ ...S.input, marginBottom: 10 }} placeholder="Buscar por nome ou equipamento..."
        type="search" aria-label="Buscar exercício por nome ou equipamento"
        value={busca} onChange={(e) => setBusca(e.target.value)} />

      {/* Filtro por equipamento: serve para quem treina em casa ou tem a academia cheia */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
        {FAMILIAS_EQUIP.map((f) => {
          const on = equip === f.id;
          const qtd = todos.filter((e) => naFamilia(e, f)).length;
          return (
            <button key={f.id} onClick={() => setEquip(on ? null : f.id)} aria-pressed={on}
              aria-label={f.nome + ", " + qtd + " " + plural(qtd, "exercício", "exercícios")}
              style={{
                border: "1px solid " + (on ? "#E1306C" : "var(--borda2)"),
                background: on ? "#E1306C22" : "transparent",
                color: on ? "#E1306C" : "var(--cinza)",
                borderRadius: 20, padding: "7px 12px", fontWeight: 800, fontSize: 12, cursor: "pointer",
              }}>
              {f.nome} <span style={{ opacity: 0.7 }}>{qtd}</span>
            </button>
          );
        })}
        {equip && (
          <button onClick={() => setEquip(null)} aria-label="Limpar o filtro de equipamento"
            style={{ border: "1px solid var(--borda2)", background: "transparent", color: "var(--texto)", borderRadius: 20, padding: "7px 12px", fontWeight: 800, fontSize: 12, cursor: "pointer" }}>
            ✕ limpar
          </button>
        )}
      </div>

      <button style={{ ...S.btn, marginBottom: 14 }} onClick={onNovoExercicio}>+ Criar exercício próprio</button>

      {buscando ? (
        <React.Fragment>
          <div style={{ ...S.label, marginBottom: 8 }}>{resultados.length} resultado(s)</div>
          {resultados.map((ex) => (
            <CardExercicio key={ex.id} ex={ex} onAbrir={() => setExercicioAberto(ex.id)} onExcluir={onExcluirCustom} />
          ))}
          {resultados.length === 0 && (
            <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)" }}>
              Nenhum exercício com esse nome. Toque em "Criar exercício próprio" para adicioná-lo.
            </div>
          )}
        </React.Fragment>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 14, marginTop: 6 }}>
          {GRUPOS.map((g) => {
            const qtd = porEquip(todos.filter((e) => e.grupo === g.id)).length;
            return (
              <button key={g.id} type="button" onClick={() => setGrupoAberto(g.id)}
                aria-label={g.nome + ", " + qtd + " " + plural(qtd, "exercício", "exercícios")}
                style={{ cursor: "pointer", textAlign: "center", background: "none", border: "none", padding: 0, font: "inherit" }}>
                <span aria-hidden="true" style={{ display: "block", width: 82, height: 82, margin: "0 auto", borderRadius: "50%", padding: 3, background: "linear-gradient(45deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5)", boxSizing: "border-box" }}>
                  <span style={{ width: "100%", height: "100%", borderRadius: "50%", background: "var(--bg)", border: "3px solid var(--bg)", boxSizing: "border-box", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30, fontWeight: 900, color: corGrupo(g) }}>
                    {g.nome[0]}
                  </span>
                </span>
                <span aria-hidden="true" style={{ display: "block", fontSize: 12, fontWeight: 700, marginTop: 7, color: "var(--texto)" }}>{g.nome}</span>
                <span aria-hidden="true" style={{ display: "block", fontSize: 10, color: "var(--cinza)", marginTop: 1 }}>{qtd} exerc.</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function FormNovoExercicio({ grupoSugerido, onSalvar, onCancelar, avisar }) {
  const [nome, setNome] = useState("");
  const [grupo, setGrupo] = useState(grupoSugerido || "peito");
  const [equip, setEquip] = useState("");
  const [passosTxt, setPassosTxt] = useState("");
  const [dica, setDica] = useState("");
  const [musc, setMusc] = useState({});

  const cicloMusc = (id) => {
    setMusc((m) => {
      const atual = m[id];
      const novo = { ...m };
      if (!atual) novo[id] = "p";
      else if (atual === "p") novo[id] = "s";
      else delete novo[id];
      return novo;
    });
  };

  const salvar = () => {
    if (!nome.trim()) { avisar("Digite o nome do exercício."); return; }
    const passos = passosTxt.split("\n").map((p) => p.trim()).filter(Boolean);
    const p = Object.keys(musc).filter((k) => musc[k] === "p");
    const s = Object.keys(musc).filter((k) => musc[k] === "s");
    onSalvar({
      id: "custom-" + Date.now(),
      custom: true,
      nome: nome.trim(),
      grupo,
      equip: equip.trim(),
      musc: { p, s },
      passos,
      dica: dica.trim(),
    });
  };

  const p = Object.keys(musc).filter((k) => musc[k] === "p");
  const s = Object.keys(musc).filter((k) => musc[k] === "s");

  return (
    <div style={{ padding: "0 18px" }}>
      <button style={S.voltar} onClick={onCancelar}>← Cancelar</button>
      <div style={S.card}>
        <div style={{ ...S.label, marginBottom: 8 }}>Nome do exercício *</div>
        <input style={S.input} placeholder="Ex.: Remada na barra fixa australiana"
          value={nome} onChange={(e) => setNome(e.target.value)} />

        <div style={{ ...S.label, margin: "16px 0 8px" }}>Grupo muscular</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {GRUPOS.map((g) => (
            <button key={g.id} onClick={() => setGrupo(g.id)}
              style={{
                border: "1px solid", borderColor: grupo === g.id ? corGrupo(g) : "var(--borda2)",
                background: grupo === g.id ? corGrupo(g) + "22" : "transparent",
                color: grupo === g.id ? corGrupo(g) : "var(--cinza)",
                borderRadius: 8, padding: "8px 12px", fontWeight: 800, fontSize: 13, cursor: "pointer",
              }}>
              {g.nome}
            </button>
          ))}
        </div>

        <div style={{ ...S.label, margin: "16px 0 4px" }}>Músculos trabalhados (opcional)</div>
        <div style={{ fontSize: 12, color: "var(--cinza)", marginBottom: 8 }}>
          Toque 1x = direto (vermelho) · 2x = indireto (amarelo) · 3x = remove
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {Object.keys(MUSCULOS).map((id) => {
            const estado = musc[id];
            const cor = estado ? corMuscTxt(estado) : "var(--cinza)";
            return (
              <button key={id} onClick={() => cicloMusc(id)}
                style={{
                  border: "1px solid", borderColor: estado ? cor : "var(--borda2)",
                  background: estado ? cor + "22" : "transparent",
                  color: cor, borderRadius: 8, padding: "7px 10px", fontWeight: 700, fontSize: 12, cursor: "pointer",
                }}>
                {MUSCULOS[id]}
              </button>
            );
          })}
        </div>
        {(p.length > 0 || s.length > 0) && (
          <div style={{ marginTop: 14 }}>
            <MapaMuscular p={p} s={s} />
          </div>
        )}

        <div style={{ ...S.label, margin: "16px 0 8px" }}>Equipamento (opcional)</div>
        <input style={S.input} placeholder="Ex.: Halteres, máquina, elástico..."
          value={equip} onChange={(e) => setEquip(e.target.value)} />

        <div style={{ ...S.label, margin: "16px 0 8px" }}>Como executar (opcional, um passo por linha)</div>
        <textarea style={{ ...S.input, minHeight: 90, resize: "vertical", fontFamily: "inherit" }}
          placeholder={"Posicione-se...\nExecute o movimento...\nRetorne controlado..."}
          value={passosTxt} onChange={(e) => setPassosTxt(e.target.value)} />

        <div style={{ ...S.label, margin: "16px 0 8px" }}>Dica (opcional)</div>
        <input style={S.input} placeholder="Ex.: Mantenha o core firme"
          value={dica} onChange={(e) => setDica(e.target.value)} />

        <button style={{ ...S.btn, marginTop: 18 }} onClick={salvar}>Salvar exercício</button>
      </div>
    </div>
  );
}

function TelaTreinos({ programas, treinos, exPorId, progAberto, setProgAberto, onTreinar, onNovaFicha,
  onEditar, onExcluirFicha, onCompartilharFicha, onNovoPrograma, onRenomearPrograma, onExcluirPrograma,
  onCompartilharPrograma, onDuplicarFicha, onDuplicarPrograma, onAssistente, onTreinoLivre, pedirConfirmacao }) {
  // Dentro de um treino: lista de fichas. Se o programa aberto foi excluído,
  // cai de volta na lista em vez de alterar estado durante o render.
  const prog = progAberto ? programas.find((p) => p.id === progAberto) : null;
  if (prog) {
    const fichas = treinos.filter((t) => t.programaId === prog.id);
    return (
      <div style={{ padding: "0 18px" }}>
        <button style={S.voltar} onClick={() => setProgAberto(null)}>← Todos os treinos</button>
        <div style={{ fontSize: 24, fontWeight: 900, marginBottom: 12 }}>{prog.nome}</div>
        <button style={{ ...S.btn, marginBottom: 14 }} onClick={() => onNovaFicha(prog.id)}>+ Nova ficha neste treino</button>
        {fichas.length === 0 && (
          <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)" }}>
            Nenhuma ficha aqui ainda. Crie a primeira (ex.: Treino A - Peito).
          </div>
        )}
        {fichas.map((t) => (
          <div key={t.id} style={S.card}>
            <div style={{ fontWeight: 900, fontSize: 18 }}>{t.nome}</div>
            <div style={{ color: "var(--cinza)", fontSize: 13, margin: "4px 0 12px" }}>
              {t.itens.map((it) => { const e = exPorId(it.exercicioId); return e ? e.nome : null; }).filter(Boolean).join(" · ") || "Sem exercícios"}
            </div>
            <button style={{ ...S.btn, marginBottom: 8 }} onClick={() => onTreinar(t)}>▶ Treinar</button>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => onEditar(t)}>Editar</button>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => onDuplicarFicha(t)}
                aria-label={"Duplicar a ficha " + t.nome}>⧉ Duplicar</button>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...S.btnGhost, flex: 1, color: "#E1306C", borderColor: "#E1306C66" }} onClick={() => onCompartilharFicha(t)}>📤 Enviar</button>
              <button style={{ ...S.btnGhost, flex: 1, color: "var(--perigo)", borderColor: "var(--perigo-borda)" }}
                onClick={() => pedirConfirmacao("Excluir esta ficha?", () => onExcluirFicha(t.id))}>Excluir</button>
            </div>
          </div>
        ))}
      </div>
    );
  }

  // Lista de treinos (programas)
  return (
    <div style={{ padding: "0 18px" }}>
      <button style={{ ...S.btn, marginBottom: 10 }} onClick={onNovoPrograma}>+ Novo treino</button>
      <button style={{ ...S.btnGhost, marginBottom: 10, color: "#E1306C", borderColor: "#E1306C66" }} onClick={onAssistente}>
        🧭 Montar treino pra mim (assistente)
      </button>
      <button style={{ ...S.btnGhost, marginBottom: 14, fontWeight: 800 }} onClick={onTreinoLivre}>
        🏋️ Treino livre (montar na hora)
      </button>
      {programas.length === 0 && (
        <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)" }}>
          Crie seu primeiro treino: ele agrupa suas fichas (ex.: "Treino Iniciante" com fichas A, B e C).
        </div>
      )}
      {programas.map((p) => {
        const fichas = treinos.filter((t) => t.programaId === p.id);
        return (
          <div key={p.id} style={S.card}>
            <div style={{ fontWeight: 900, fontSize: 19 }}>📋 {p.nome}</div>
            <div style={{ color: "var(--cinza)", fontSize: 13, margin: "4px 0 12px" }}>
              {fichas.length} ficha(s){fichas.length ? ": " + fichas.map((f) => f.nome).join(" · ") : ""}
            </div>
            <button style={{ ...S.btn, marginBottom: 8 }} onClick={() => setProgAberto(p.id)}>Abrir fichas</button>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => onRenomearPrograma(p)}>Renomear</button>
              <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => onDuplicarPrograma(p)}
                aria-label={"Duplicar o treino " + p.nome}>⧉ Duplicar</button>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...S.btnGhost, flex: 1, color: "#E1306C", borderColor: "#E1306C66" }} onClick={() => onCompartilharPrograma(p)}>📤 Enviar</button>
              <button style={{ ...S.btnGhost, flex: 1, color: "var(--perigo)", borderColor: "var(--perigo-borda)" }} onClick={() => onExcluirPrograma(p)}>Excluir</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ---------------- MANTER A TELA LIGADA NO DESCANSO ----------------
// Com o celular no bolso a tela apaga, o navegador suspende o áudio e o aviso de
// "descanso concluído" nunca toca. A trava de tela resolve isso justamente no
// único momento em que o aparelho fica parado.
let travaTela = null;
async function ligarTravaTela() {
  try {
    if (!navigator.wakeLock || travaTela) return;
    travaTela = await navigator.wakeLock.request("screen");
    travaTela.addEventListener("release", () => { travaTela = null; });
  } catch (e) { travaTela = null; }
}
async function desligarTravaTela() {
  try { if (travaTela) await travaTela.release(); } catch (e) {}
  travaTela = null;
}

// ---------------- FREQUÊNCIA CARDÍACA (Bluetooth) ----------------
// O que dá para fazer de dentro de um site, e o que não dá — vale deixar escrito
// aqui, porque a pergunta volta:
//
//   FUNCIONA: qualquer monitor que exponha o serviço padrão de frequência
//   cardíaca do Bluetooth (0x180D) — cintas peitorais Polar/Garmin/Wahoo,
//   sensores de braço, e alguns relógios. O navegador fala direto com ele, sem
//   app nenhum no meio e sem servidor.
//
//   NÃO FUNCIONA: ler o Google Fit, o Health Connect ou o Apple Health. São APIs
//   de sistema operacional, só alcançáveis por um aplicativo instalado pela
//   loja. A API REST do Google Fit, que permitiria algo parecido, foi
//   descontinuada pelo próprio Google. Não é limitação do aparelho: é o que a
//   web tem permissão de fazer. Anéis inteligentes, no geral, também não
//   expõem o serviço padrão — guardam os dados para o app da marca.

const CARDIO_DISPONIVEL = typeof navigator !== "undefined" && !!navigator.bluetooth;

// Lê o padrão 0x2A37: o primeiro byte diz se o valor vem em 1 ou 2 bytes.
function lerBpm(dv) {
  if (!dv || dv.byteLength < 2) return null;
  const flags = dv.getUint8(0);
  return flags & 0x01 ? dv.getUint16(1, true) : dv.getUint8(1);
}

function criarCardio(opcoes) {
  const o = opcoes || {};
  let dispositivo = null;
  let caracteristica = null;

  const aoMudar = (ev) => {
    const bpm = lerBpm(ev.target.value);
    if (bpm && bpm > 25 && bpm < 240 && o.aoBpm) o.aoBpm(bpm);
  };
  const aoCair = () => {
    caracteristica = null;
    if (o.aoEstado) o.aoEstado("caiu");
  };

  return {
    async conectar() {
      if (!CARDIO_DISPONIVEL) throw new Error("sem bluetooth");
      if (o.aoEstado) o.aoEstado("procurando");
      // O navegador abre a lista de aparelhos e a pessoa escolhe. Sem escolha
      // explícita não há conexão — e é assim que tem de ser.
      dispositivo = await navigator.bluetooth.requestDevice({ filters: [{ services: ["heart_rate"] }] });
      dispositivo.addEventListener("gattserverdisconnected", aoCair);
      const servidor = await dispositivo.gatt.connect();
      const servico = await servidor.getPrimaryService("heart_rate");
      caracteristica = await servico.getCharacteristic("heart_rate_measurement");
      await caracteristica.startNotifications();
      caracteristica.addEventListener("characteristicvaluechanged", aoMudar);
      if (o.aoEstado) o.aoEstado("ligado");
      return dispositivo.name || "Monitor";
    },
    desconectar() {
      try { if (caracteristica) caracteristica.removeEventListener("characteristicvaluechanged", aoMudar); } catch (e) {}
      try { if (dispositivo && dispositivo.gatt.connected) dispositivo.gatt.disconnect(); } catch (e) {}
      caracteristica = null;
      if (o.aoEstado) o.aoEstado("desligado");
    },
    ligado() { return !!caracteristica; },
  };
}

// Acumula os batimentos do treino para virar média e máximo no histórico.
// Um número por treino diz mais do que o gráfico que ninguém abre.
function criarResumoCardio() {
  let soma = 0, n = 0, max = 0;
  return {
    somar(bpm) { soma += bpm; n++; if (bpm > max) max = bpm; },
    fechar() { return n ? { medio: Math.round(soma / n), max: max, amostras: n } : null; },
  };
}

// ---------------- JARVIS EYES SCAN: CONTAR REPETIÇÃO PELA CÂMERA ----------------
// Apoia o celular, o app enxerga o corpo inteiro e conta as repetições sozinho.
// No fim da série, o número já vai para a ficha — nem falar é preciso.
//
// O reconhecimento de pose roda INTEIRO no aparelho (MediaPipe, 33 pontos, na
// GPU). Nenhuma imagem sai do celular: não há servidor para onde mandar, e não
// haveria mesmo que houvesse.
//
// A biblioteca e o modelo pesam uns 8 MB e são baixados SÓ quando esta tela é
// aberta pela primeira vez. O app continua abrindo com meio mega como sempre —
// quem nunca usar o scanner não paga nada por ele.

const EYES_LIB = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const EYES_WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const EYES_MODELO = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

let eyesDetector = null;
let eyesCarregando = null;
// Carrega sob demanda e uma vez só. Trocar de exercício ou sair e voltar à tela
// não pode baixar 8 MB de novo.
function carregarEyes() {
  if (eyesDetector) return Promise.resolve(eyesDetector);
  if (eyesCarregando) return eyesCarregando;
  eyesCarregando = (async () => {
    const vision = await import(EYES_LIB);
    const fileset = await vision.FilesetResolver.forVisionTasks(EYES_WASM);
    eyesDetector = await vision.PoseLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: EYES_MODELO, delegate: "GPU" },
      runningMode: "VIDEO",
      numPoses: 1,
      minPoseDetectionConfidence: 0.5,
      minPosePresenceConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });
    return eyesDetector;
  })();
  eyesCarregando.catch(() => { eyesCarregando = null; });
  return eyesCarregando;
}

// Os ossos que ligam os 33 pontos do MediaPipe. Só o tronco e os membros: o
// rosto tem 11 pontos que não dizem nada sobre agachamento e poluem a tela.
const EYES_OSSOS = [
  [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
  [11, 23], [12, 24], [23, 24],
  [23, 25], [25, 27], [27, 31], [24, 26], [26, 28], [28, 32],
];
const EYES_PONTOS = [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];

// Ângulo em graus no vértice b. É daqui que sai todo o resto: a repetição é uma
// ida e volta de algum ângulo do corpo.
function anguloEntre(a, b, c) {
  if (!a || !b || !c) return null;
  const v1x = a.x - b.x, v1y = a.y - b.y;
  const v2x = c.x - b.x, v2y = c.y - b.y;
  const n1 = Math.hypot(v1x, v1y), n2 = Math.hypot(v2x, v2y);
  if (n1 < 1e-6 || n2 < 1e-6) return null;
  let cos = (v1x * v2x + v1y * v2y) / (n1 * n2);
  cos = Math.max(-1, Math.min(1, cos));
  return (Math.acos(cos) * 180) / Math.PI;
}
// Ponto só vale se o modelo tiver alguma confiança nele. Membro escondido atrás
// do corpo devolve coordenada inventada, e contar por cima disso é contar lixo.
const visivel = (p) => p && (p.visibility === undefined || p.visibility > 0.5);
const pt = (lm, i) => (visivel(lm[i]) ? lm[i] : null);

// Os candidatos a "sinal da repetição". Em vez de exigir configuração por
// exercício — impossível com 204 exercícios e as máquinas que ninguém catalogou —
// o scanner mede todos e fica com o que mais se mexe.
const EYES_SINAIS = [
  { id: "cotovelo-e", nome: "cotovelo esquerdo", calc: (l) => anguloEntre(pt(l, 11), pt(l, 13), pt(l, 15)) },
  { id: "cotovelo-d", nome: "cotovelo direito", calc: (l) => anguloEntre(pt(l, 12), pt(l, 14), pt(l, 16)) },
  { id: "joelho-e", nome: "joelho esquerdo", calc: (l) => anguloEntre(pt(l, 23), pt(l, 25), pt(l, 27)) },
  { id: "joelho-d", nome: "joelho direito", calc: (l) => anguloEntre(pt(l, 24), pt(l, 26), pt(l, 28)) },
  { id: "quadril-e", nome: "quadril esquerdo", calc: (l) => anguloEntre(pt(l, 11), pt(l, 23), pt(l, 25)) },
  { id: "quadril-d", nome: "quadril direito", calc: (l) => anguloEntre(pt(l, 12), pt(l, 24), pt(l, 26)) },
  { id: "ombro-e", nome: "ombro esquerdo", calc: (l) => anguloEntre(pt(l, 23), pt(l, 11), pt(l, 13)) },
  { id: "ombro-d", nome: "ombro direito", calc: (l) => anguloEntre(pt(l, 24), pt(l, 12), pt(l, 14)) },
];

// Qual sinal o grupo muscular sugere. Não decide sozinho — só desempata quando
// dois sinais se mexem parecido, o que acontece sempre (o corpo é inteiro).

// ---- Sinais de posição, para o movimento funcional ----
// Exercício de máquina é sempre um ângulo que abre e fecha. Funcional não: salto
// é a ALTURA do quadril, polichinelo é a ABERTURA dos pés e das mãos, soco é o
// ALCANCE do braço. Sem esses sinais, o contador não tem o que medir.
//
// Tudo é dividido pelo comprimento do tronco e multiplicado por 100. Assim o
// número não muda se a pessoa estiver perto ou longe da câmera, e fica na mesma
// escala dos ângulos — os mesmos limiares servem para os dois.
function escalaTorso(l) {
  const oE = pt(l, 11), oD = pt(l, 12), qE = pt(l, 23), qD = pt(l, 24);
  if (!oE || !oD || !qE || !qD) return null;
  const d = Math.hypot((oE.x + oD.x) / 2 - (qE.x + qD.x) / 2, (oE.y + oD.y) / 2 - (qE.y + qD.y) / 2);
  return d > 0.02 ? d : null;
}
// y cresce para baixo na imagem: o sinal é invertido para "mais alto" virar
// "número maior", que é como a histerese espera.
function alturaDe(l, iAlto, iBaixo) {
  const e = escalaTorso(l), a = pt(l, iAlto), b = pt(l, iBaixo);
  if (!e || !a || !b) return null;
  return ((a.y - b.y) / e) * 100;
}
function aberturaDe(l, iE, iD) {
  const e = escalaTorso(l), a = pt(l, iE), b = pt(l, iD);
  if (!e || !a || !b) return null;
  return (Math.abs(a.x - b.x) / e) * 100;
}
function alcanceDe(l, iOmbro, iPunho) {
  const e = escalaTorso(l), o = pt(l, iOmbro), p = pt(l, iPunho);
  if (!e || !o || !p) return null;
  return (Math.hypot(o.x - p.x, o.y - p.y) / e) * 100;
}

const EYES_SINAIS_POS = [

// O rodape do scanner diz o que ele esta medindo: sem isso, contagem errada

// ---- Enquadramento: pôr a pessoa na posição antes de contar ----
// Com a câmera de trás — que é a boa, porque é a que enxerga melhor — a pessoa
// **não vê a tela**. Ela apoia o celular, anda para trás e não tem como saber se
// está dentro do quadro. Antes disso existir, o jeito de descobrir era fazer a
// série inteira e ver que não contou nada.
//
// Então a contagem só começa depois do enquadramento confirmado, e até lá a voz
// guia: esquerda, direita, aproxime, afaste. Quem usa a câmera da frente vê
// ainda as setas e a moldura verde da confirmação.
//
// Esquerda e direita são **da pessoa**, não da imagem. A câmera vê quem está de
// frente para ela espelhado em significado: a mão esquerda dela aparece do lado
// direito do quadro. Então "o corpo precisa ir para a direita da imagem"
// significa "ande para a sua esquerda" — e errar esse sinal manda a pessoa para
// fora do quadro em vez de para dentro.
const EYES_PONTOS_ENQUADRA = [11, 12, 23, 24, 25, 26, 27, 28];

function avaliarEnquadramento(lm) {
  if (!lm) return { chave: "corpo", texto: "Não estou te vendo", fala: "Não estou te vendo. Fique de frente para a câmera." };
  const faltando = EYES_PONTOS_ENQUADRA.some((i) => !visivel(lm[i]));
  if (faltando) {
    return {
      chave: "corpo", texto: "Apareça de corpo inteiro",
      fala: "Não estou te vendo inteiro. Preciso ver dos ombros aos pés.",
    };
  }
  const xs = EYES_PONTOS_ENQUADRA.map((i) => lm[i].x);
  const ys = EYES_PONTOS_ENQUADRA.map((i) => lm[i].y);
  const topo = Math.min.apply(null, ys), base = Math.max.apply(null, ys);
  const altura = base - topo;

  // Cortado: o resto da conta não vale nada se faltar pedaço. A medida é dos
  // OMBROS aos pés, e acima dos ombros ainda tem cabeça — por isso a folga de
  // cima é maior que a de baixo, e o nariz confirma quando dá para vê-lo.
  const nariz = lm[0];
  if (base > 0.985 || (visivel(nariz) && nariz.y < 0.025)) {
    return { chave: "afaste", texto: "Afaste-se", fala: "Você está cortado. Dê uns passos para trás.", seta: "afasta" };
  }

  // Centralizar vem antes da distância: quem está na beirada precisa entrar no
  // quadro primeiro, e aí a distância volta a fazer sentido.
  const cx = (lm[11].x + lm[12].x + lm[23].x + lm[24].x) / 4;
  if (cx < 0.38 || cx > 0.62) {
    const precisaMais = cx < 0.5;    // o corpo tem de ir para a direita da imagem
    return {
      chave: precisaMais ? "esq" : "dir",
      texto: precisaMais ? "Vá para a sua esquerda" : "Vá para a sua direita",
      fala: precisaMais ? "Ande para a sua esquerda." : "Ande para a sua direita.",
      seta: precisaMais ? "maisX" : "menosX",
    };
  }

  if (altura < 0.45) {
    return { chave: "aproxime", texto: "Aproxime-se", fala: "Você está longe. Chegue mais perto.", seta: "aproxima" };
  }
  if (altura > 0.80) {
    return { chave: "afaste", texto: "Afaste-se", fala: "Você está muito perto. Dê um passo para trás.", seta: "afasta" };
  }
  return { chave: "ok", texto: "Enquadrado", fala: "Enquadrado. Pode começar.", ok: true };
}

// ---- O narrador ----
// Falar não precisa do microfone. Quem treina com o celular no bolso e fone
// bluetooth não vê frase nenhuma na tela — e, até aqui, metade das confirmações
// do app só existia escrita, ou só saía com o Jarvis ouvindo. São duas coisas
// diferentes: `voz.falar` é ele falar, `vozAtiva` é ele ouvir.
//
// `voz.narrar` liga os avisos do treino (série anotada, descanso, troca de
// exercício). Fica separado de `contarAlto`, que é a contagem do scanner: numa
// academia cheia a pessoa pode querer um e não o outro.
// "90 segundos" é como se escreve; "um minuto e meio" é como se fala.
function textoDuracao(seg) {
  const s = Math.round(seg || 0);
  if (s < 60) return s + " segundos";
  const m = Math.floor(s / 60), r = s % 60;
  const base = m + (m === 1 ? " minuto" : " minutos");
  if (!r) return base;
  if (r === 30) return base + " e meio";
  return base + " e " + r + " segundos";
}

function narrarVoz(texto, cfg, fila) {
  if (!texto || !cfg || cfg.falar === false || cfg.narrar === false) return;
  jarvisFalar(texto, {
    falar: true,
    vozNome: cfg.vozNome,
    velocidade: cfg.velocidade || 1.1,
    animado: cfg.animado,
    fila: !!fila,
  });
}

// Com o celular no bolso e a tela apagada, o navegador pode engolir o áudio do
// fim do descanso. A notificação é o aviso que atravessa isso — e só entra
// quando o app NÃO está na frente, senão vira aviso duplicado.
// No Android, `new Notification()` lança "Illegal constructor": lá a notificação
// só sai pelo service worker. O erro era engolido, e o aviso nunca chegava
// justamente no aparelho em que ele mais importa.
function avisarEmSegundoPlano(titulo, corpo) {
  try {
    if (typeof document !== "undefined" && document.visibilityState === "visible") return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    const opcoes = {
      body: corpo, icon: "icon-192.png", badge: "icon-192.png",
      tag: "treino-livre-descanso", renotify: true, vibrate: [300, 120, 300],
    };
    const direto = () => { try { new Notification(titulo, opcoes); } catch (e) {} };
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
      navigator.serviceWorker.getRegistration()
        .then((reg) => (reg && reg.showNotification ? reg.showNotification(titulo, opcoes) : direto()))
        .catch(direto);
    } else direto();
  } catch (e) {}
}

// ---- Postura: a correção que não pode errar ----
// Contar errado custa uma repetição. Corrigir errado custa a confiança: quem
// ouve "joelho para dentro" fazendo o movimento certo aprende a ignorar o app —
// e aí a correção boa também deixa de valer. Por isso tudo aqui é conservador:
//
//   1. Só mede quando a câmera está no ângulo que permite ver aquilo. Valgo de
//      joelho não existe de perfil; quadril caindo não existe de frente.
//   2. Só fala depois de ver a mesma falha em DUAS repetições seguidas. Uma
//      repetição ruim é uma repetição ruim; duas são um padrão.
//   3. Só fala se os pontos estiverem bem visíveis. O modelo inventa posição de
//      ponto escondido, e ponto inventado vira correção inventada.
//   4. São dois defeitos, não doze. Os dois que aparecem em quase todo mundo e
//      que dá para ver com confiança numa câmera de celular.
//
// Isto não é avaliação física. É o que um parceiro de treino atento falaria.

// De frente os ombros ficam largos; de perfil eles quase se sobrepõem. A razão
// entre a largura dos ombros e o comprimento do tronco separa os dois casos.
function vistaDe(l) {
  const e = escalaTorso(l);
  const a = aberturaDe(l, 11, 12);
  if (!e || a === null) return null;
  if (a > 70) return "frente";
  if (a < 45) return "perfil";
  return null;              // de três quartos não dá para afirmar nada
}

const visivelBem = (p) => !!(p && (p.visibility === undefined || p.visibility > 0.65));

// Joelho para dentro: a distância entre o joelho e a linha reta que vai do
// quadril ao tornozelo, medida na direção do meio do corpo. É o sinal clássico
// do valgo dinâmico, e o que mais aparece em agachamento e aterrissagem.
function desvioJoelho(l, iQuadril, iJoelho, iTornozelo, meioX) {
  const q = pt(l, iQuadril), j = pt(l, iJoelho), t = pt(l, iTornozelo), e = escalaTorso(l);
  if (!e || !q || !j || !t) return null;
  if (!visivelBem(l[iQuadril]) || !visivelBem(l[iJoelho]) || !visivelBem(l[iTornozelo])) return null;
  const alturaPerna = t.y - q.y;
  if (Math.abs(alturaPerna) < 0.04) return null;           // perna de lado: não dá para ler
  const f = (j.y - q.y) / alturaPerna;
  if (f < 0.15 || f > 0.85) return null;                   // joelho fora do trecho: leitura sem sentido
  const esperado = q.x + (t.x - q.x) * f;
  const lado = q.x >= meioX ? 1 : -1;                      // medial é na direção do meio
  return (((esperado - j.x) * lado) / e) * 100;
}

// Quadril fora da linha: distância do quadril até a reta ombro–tornozelo.
// Positivo = quadril caindo (lombar arqueada na prancha e na flexão);
// negativo = quadril empinado, o jeito de fugir do esforço.
function desvioQuadril(l) {
  const e = escalaTorso(l);
  const o = pt(l, 11), q = pt(l, 23), t = pt(l, 27);
  if (!e || !o || !q || !t) return null;
  if (!visivelBem(l[11]) || !visivelBem(l[23]) || !visivelBem(l[27])) return null;
  const dx = t.x - o.x, dy = t.y - o.y;
  const comp = Math.hypot(dx, dy);
  if (comp < e * 1.4) return null;                         // corpo dobrado: não é prancha
  // o sinal do produto vetorial diz de que lado da linha o quadril está; o que
  // interessa é se ele está para baixo na imagem, e y cresce para baixo
  const cruz = (dx * (q.y - o.y) - dy * (q.x - o.x)) / comp;
  const paraBaixo = dx >= 0 ? 1 : -1;
  return ((cruz * paraBaixo) / e) * 100;
}

const FALHAS_POSTURA = {
  "valgo": { frase: "Joelho caindo para dentro. Empurra os joelhos para fora.", vista: "frente" },
  "quadril-caido": { frase: "Quadril caindo. Aperta o abdômen e o glúteo.", vista: "perfil" },
  "quadril-alto": { frase: "Quadril empinado. Desce o quadril para a linha do corpo.", vista: "perfil" },
};

// Quais exercícios admitem qual checagem. Fora desta lista não se mede nada:
// quadril fora da linha é defeito na prancha e é o movimento certo no afundo.
const POSTURA_POR_MOV = {
  "agachamento-salto": ["valgo"],
  "salto-vertical": ["valgo"],
  "skater": ["valgo"],
  "polichinelo": ["valgo"],
  "afundo-alternado": ["valgo"],
  "flexao": ["quadril-caido", "quadril-alto"],
  "escalador": ["quadril-caido", "quadril-alto"],
  "burpee": ["quadril-caido"],
};
// Exercício de máquina não tem perfil, mas agachamento livre e leg press têm o
// mesmo valgo. O grupo muscular responde por eles.
const POSTURA_POR_GRUPO = { pernas: ["valgo"], gluteos: ["valgo"] };

function criarPostura(ex) {
  const perm = (ex && ex.func && POSTURA_POR_MOV[ex.func]) ||
    (ex && POSTURA_POR_GRUPO[ex.grupo]) || [];
  // Um corpo parado no chão não tem postura errada: só mede quem se mexe.
  let piorValgo = 0, somaQuadril = 0, nQuadril = 0, quadros = 0, vistaVista = null;
  let seguidas = { valgo: 0, "quadril-caido": 0, "quadril-alto": 0 };
  let ultimaDita = -9;

  const zerarCiclo = () => { piorValgo = 0; somaQuadril = 0; nQuadril = 0; quadros = 0; vistaVista = null; };

  return {
    ativo: perm.length > 0,
    medir(l) {
      if (!perm.length) return;
      const v = vistaDe(l);
      if (!v) return;
      vistaVista = v;
      quadros++;
      if (v === "frente" && perm.indexOf("valgo") >= 0) {
        const qE = pt(l, 23), qD = pt(l, 24);
        if (!qE || !qD) return;
        const meio = (qE.x + qD.x) / 2;
        const a = desvioJoelho(l, 23, 25, 27, meio);
        const b = desvioJoelho(l, 24, 26, 28, meio);
        [a, b].forEach((d) => { if (d !== null && d > piorValgo) piorValgo = d; });
      } else if (v === "perfil") {
        const d = desvioQuadril(l);
        if (d !== null) { somaQuadril += d; nQuadril++; }
      }
    },
    // Chamada quando o contador fecha uma repetição. Devolve a frase só quando a
    // mesma falha apareceu duas vezes seguidas e faz três repetições que ele não
    // comenta nada — correção repetida a cada movimento é sermão, não ajuda.
    fecharRepeticao(n) {
      if (!perm.length || quadros < 6) { zerarCiclo(); return null; }
      let achada = null;
      if (vistaVista === "frente" && perm.indexOf("valgo") >= 0 && piorValgo > 11) achada = "valgo";
      else if (vistaVista === "perfil" && nQuadril >= 4) {
        const m = somaQuadril / nQuadril;
        if (m > 13 && perm.indexOf("quadril-caido") >= 0) achada = "quadril-caido";
        else if (m < -16 && perm.indexOf("quadril-alto") >= 0) achada = "quadril-alto";
      }
      Object.keys(seguidas).forEach((k) => { seguidas[k] = k === achada ? seguidas[k] + 1 : 0; });
      zerarCiclo();
      if (!achada || seguidas[achada] < 2) return null;
      if (n - ultimaDita < 3) return null;
      ultimaDita = n;
      seguidas[achada] = 0;
      return FALHAS_POSTURA[achada].frase;
    },
    zerar() {
      zerarCiclo();
      seguidas = { valgo: 0, "quadril-caido": 0, "quadril-alto": 0 };
      ultimaDita = -9;
    },
  };
}

// ---- "O que estou fazendo?" ----
// Escolher o exercício antes de começar é o último passo de configuração que
// sobrou no funcional. Como cada perfil já diz em que sinais olhar, dá para
// virar a pergunta: medir tudo por alguns segundos e ver de qual perfil aquilo
// mais se parece.
//
// O palpite NUNCA é aplicado calado. Ele aparece escrito, com o nome do
// movimento e um botão para trocar — errar o palpite e contar escondido seria
// pior que não adivinhar nada.
function adivinharMovimento(faixas) {
  const notas = Object.keys(MOV_FUNCIONAIS).map((id) => {
    const p = MOV_FUNCIONAIS[id];
    const sinais = p.par || p.sinais || [];
    if (!sinais.length) return { id: id, nota: 0 };
    // A nota é quantas vezes a amplitude passou do mínimo que aquele movimento
    // exige. Dividir pelo mínimo é o que põe soco (14) e burpee (26) na mesma
    // régua — senão o movimento de amplitude grande ganharia sempre.
    const minimo = p.minAmp || 22;
    const vals = sinais.map((s) => faixas[s] || 0);
    // No alternado os dois lados contam: um braço só movendo é outra coisa.
    const base = p.par ? Math.min.apply(null, vals) : vals.reduce((a, b) => a + b, 0) / vals.length;
    return { id: id, nota: base / minimo };
  });
  notas.sort((a, b) => b.nota - a.nota);
  const topo = notas[0];
  if (!topo || topo.nota < 1.1) return null;
  const segundo = notas[1] || { nota: 0, id: null };
  return {
    id: topo.id,
    nota: Math.round(topo.nota * 100) / 100,
    // Destacar do segundo é o que separa "é isso" de "pode ser isso". Sem folga,
    // o palpite aparece como dúvida e não como afirmação.
    seguro: topo.nota > segundo.nota * 1.3,
    segundo: segundo.id,
  };
}

// ---- O contador ----
// Uma repetição é uma ida e volta: o sinal sai de "em baixo", passa de "em
// cima" e volta. Contar no cruzamento simples contaria dez vezes o tremor da
// mão no meio do caminho — daí os dois limiares separados (histerese) e o tempo
// mínimo entre repetições.
//
// Três modos, nesta ordem de preferência:
//   1. perfil "alternado": soco, chute, afundo alternado. Cada lado tem o seu
//      contador e os dois se somam — contar um lado só daria metade.
//   2. perfil "simples": o movimento é conhecido e já diz em quais sinais olhar.
//   3. automático: não há perfil (é uma máquina qualquer, ou um aparelho que o
//      dono fotografou). Mede todos os sinais e fica com o que mais se mexe.
const JANELA_MS = 4000;
function criarContador(opcoes) {
  const o = opcoes || {};
  const perfil = o.perfil || null;
  const preferidos = o.preferidos || [];
  const aoContar = o.aoContar;
  const minMs = (perfil && perfil.minMs) || o.minMs || 550;
  const minAmp = (perfil && perfil.minAmp) || 22;
  const alternado = !!(perfil && perfil.par);
  const TODOS = EYES_SINAIS.concat(EYES_SINAIS_POS);
  const amostras = {};
  let total = 0;
  let amplitude = 0;
  let melhorAmp = 0, somaAmp = 0, nAmp = 0, somaDur = 0, nDur = 0;

  // Uma máquina de estados por sinal contado. No modo alternado são duas.
  function criarMaquina(id) {
    return { id: id, estado: "baixo", ultima: 0, conta: 0, repMin: Infinity, repMax: -Infinity };
  }
  const maquinas = alternado ? perfil.par.map(criarMaquina) : [criarMaquina(null)];
  let escolhido = null;

  const faixaDe = (s) => (s && s.max > s.min && isFinite(s.min) ? s.max - s.min : 0);

  // Decide se a máquina m, lendo o sinal id, acabou de completar uma repetição
  function passo(m, id, agora) {
    const a = amostras[id];
    if (!a) return null;
    const faixa = faixaDe(a);
    if (faixa < minAmp) return null;
    if (a.valor < m.repMin) m.repMin = a.valor;
    if (a.valor > m.repMax) m.repMax = a.valor;
    const n = (a.valor - a.min) / faixa;
    if (m.estado === "baixo" && n > 0.72) { m.estado = "cima"; return null; }
    if (m.estado === "cima" && n < 0.28) {
      m.estado = "baixo";
      if (agora - m.ultima <= minMs) return null;
      const amp = m.repMax > m.repMin ? m.repMax - m.repMin : 0;
      const dur = m.ultima ? agora - m.ultima : 0;
      m.ultima = agora;
      m.repMin = Infinity; m.repMax = -Infinity;
      return { amp: amp, dur: dur };
    }
    return null;
  }

  return {
    processar(lm, agora) {
      // 1. mede todos os sinais e guarda os últimos 4 segundos de cada um.
      // A janela corrida é o que faz o contador acompanhar a amplitude quando
      // ela encolhe — e ela encolhe sempre, porque é isso que o cansaço faz.
      TODOS.forEach((s) => {
        const v = s.calc(lm);
        if (v === null) return;
        const a = amostras[s.id] || (amostras[s.id] = { hist: [], valor: v, suave: v, min: v, max: v });
        // um pouco de suavização antes de guardar: um quadro ruim do modelo não
        // pode esticar a janela inteira por quatro segundos
        a.suave = a.suave + (v - a.suave) * 0.4;
        a.valor = a.suave;
        a.hist.push(agora, a.suave);
        while (a.hist.length > 2 && agora - a.hist[0] > JANELA_MS) a.hist.splice(0, 2);
        let mn = Infinity, mx = -Infinity;
        for (let i = 1; i < a.hist.length; i += 2) {
          const x = a.hist[i];
          if (x < mn) mn = x;
          if (x > mx) mx = x;
        }
        a.min = mn; a.max = mx;
      });

      // 2. escolhe em qual sinal contar
      if (alternado) {
        // no alternado cada lado já tem o seu sinal, definido pelo perfil
        escolhido = perfil.par.join(" + ");
      } else {
        const candidatos = (perfil && perfil.sinais ? perfil.sinais : TODOS.map((s) => s.id))
          .map((id) => ({ id: id, faixa: faixaDe(amostras[id]) }))
          .filter((c) => c.faixa > 0)
          .sort((a, b) => b.faixa - a.faixa);
        if (candidatos.length) {
          const topo = candidatos[0];
          // Entre sinais parecidos (dentro de 20%), o que o grupo muscular indica ganha
          const perto = candidatos.filter((c) => c.faixa >= topo.faixa * 0.8);
          const pref = perto.find((c) => preferidos.indexOf(c.id) >= 0);
          const novo = (pref || topo).id;
          // Só troca de sinal antes de começar a contar: trocar no meio da série
          // zeraria a referência e perderia a conta.
          if (!escolhido || (total === 0 && novo !== escolhido)) escolhido = novo;
          maquinas[0].id = escolhido;
        }
        if (!maquinas[0].id) return { total: total, pronto: false };
      }

      // 3. roda a histerese em cada máquina
      let contou = false, qualidade = null;
      const ids = alternado ? perfil.par : [maquinas[0].id];
      let maiorFaixa = 0;
      ids.forEach((id, k) => {
        maiorFaixa = Math.max(maiorFaixa, faixaDe(amostras[id]));
        const r = passo(maquinas[k], id, agora);
        if (!r) return;
        total++;
        maquinas[k].conta++;
        contou = true;
        // Comparações só valem a partir da segunda repetição: a primeira é a
        // própria referência, e elogiar a primeira por ser a melhor é bobagem.
        const mediaAmp = nAmp ? somaAmp / nAmp : 0;
        const mediaDur = nDur ? somaDur / nDur : 0;
        qualidade = {
          amplitude: Math.round(r.amp),
          duracao: Math.round(r.dur),
          melhor: nAmp > 0 && r.amp > melhorAmp * 1.04,
          caindo: nAmp > 1 && r.amp < mediaAmp * 0.84,
          rapida: nDur > 1 && r.dur > 0 && r.dur < mediaDur * 0.68,
          constante: nAmp > 1 && Math.abs(r.amp - mediaAmp) < mediaAmp * 0.08,
        };
        if (r.amp > 0) { if (r.amp > melhorAmp) melhorAmp = r.amp; somaAmp += r.amp; nAmp++; }
        if (r.dur > 0) { somaDur += r.dur; nDur++; }
        if (aoContar) aoContar(total, qualidade);
      });
      amplitude = maiorFaixa;
      if (amplitude < minAmp) return { total: total, pronto: false, amplitude: amplitude, sinal: escolhido };
      return { total: total, pronto: true, contou: contou, qualidade: qualidade, amplitude: amplitude, sinal: escolhido };
    },
    zerar() {
      total = 0;
      maquinas.forEach((m) => { m.estado = "baixo"; m.ultima = 0; m.conta = 0; m.repMin = Infinity; m.repMax = -Infinity; });
      melhorAmp = 0; somaAmp = 0; nAmp = 0; somaDur = 0; nDur = 0;
    },
    // Serve ao "desfazer" quando o scanner conta uma a mais
    ajustar(n) { total = Math.max(0, n); },
    // O quanto cada sinal se mexeu na janela. É o que permite perguntar "de
    // qual movimento isto mais se parece" sem um segundo medidor rodando junto.
    faixas() {
      const r = {};
      TODOS.forEach((s) => { r[s.id] = Math.round(faixaDe(amostras[s.id])); });
      return r;
    },
    estado() {
      const s = TODOS.find((x) => x.id === escolhido);
      return {
        total: total,
        sinal: escolhido,
        nomeSinal: s ? s.nome : (alternado ? "os dois lados" : null),
        alternado: alternado,
        amplitude: Math.round(amplitude),
        // Ritmo e tempo sob tensão saem de graça: o contador já media a duração de
        // cada repetição para o técnico saber quando a pessoa estava acelerando.
        // Repetição de 1 segundo e de 4 segundos treinam coisas diferentes, e até
        // aqui ninguém media isso sem filmar a série e contar no olho.
        ritmo: nDur ? Math.round(somaDur / nDur / 100) / 10 : 0,
        tut: Math.round(somaDur / 1000),
        // No alternado dá para saber se um lado está fazendo mais que o outro —
        // o desequilíbrio que ninguém percebe sozinho, porque o lado forte
        // compensa sem avisar.
        lados: alternado
          ? perfil.par.map((id, k) => ({ nome: nomeDoSinal(id), total: maquinas[k].conta }))
          : null,
      };
    },
  };
}
// ---- O técnico ----
// Um parceiro de treino não comenta todas as repetições: isso vira ruído e
// atropela a contagem. Ele fica quieto, e quando fala é porque viu alguma
// coisa. Aqui é a mesma regra — no máximo um comentário a cada três
// repetições, correção antes de elogio, e nunca a mesma frase duas vezes.
const FRASES_TECNICO = {
  melhor: [
    "Essa foi mais completa.",
    "Amplitude melhor que as anteriores.",
    "Isso. Assim mesmo.",
    "Essa saiu melhor executada.",
  ],
  caindo: [
    "Desce mais um pouco.",
    "A amplitude está caindo. Abre o movimento.",
    "Completa o movimento até o fim.",
    "Está encurtando. Vai até embaixo.",
  ],
  rapida: [
    "Controla a descida.",
    "Mais devagar. Não joga o peso.",
    "Segura a volta.",
  ],
  constante: [
    "Continue assim.",
    "Ritmo bom.",
    "Firme nesse ritmo.",
    "Está controlado. Mantém.",
  ],
  animo: [
    "Continue assim.",
    "Boa. Não para.",
    "Firme.",
    "Aguenta mais um pouco.",

          if (e && alvo.some((g) => g.id === e.grupo)) p++;
        });
        if (p > melhorP) { melhorP = p; melhor = t; }
      });
      const quando = c.amanha ? "Amanhã. " : "";
      let fala = c.grupo
        ? alvo.map(descreverDescanso).join("; ") + ". " +
          (alvo[0].estado === "descansando" ? "Ainda está se recuperando — se puder, escolha outro grupo. "
            : alvo[0].estado === "quase" ? "Dá para ir, mas mais um dia seria melhor. " : "Pode ir. ")
        : "Quem está mais descansado: " + alvo.map(descreverDescanso).join("; ") + ". ";
      fala += melhor
        ? "Sugiro a ficha " + melhor.nome + ". Diga: Jarvis, começa o treino " + melhor.nome + "."
        : "Escolha uma ficha que pegue esses grupos, ou diga: Jarvis, treino livre.";
      return { ok: true, fala: quando + fala };
    }
    case "recuperacaoGrupo": {
      const rec = recuperacaoMuscular(hist, ctx.exPorId);
      const g = rec.find((x) => x.id === c.grupo);
      if (!g) return { ok: false, fala: "Não achei esse grupo muscular." };
      if (g.dias === null) return { ok: true, fala: g.nome + " não aparece no seu histórico ainda. Pode treinar à vontade." };
      const estado = g.estado === "pronto" ? "Já pode treinar." : g.estado === "quase" ? "Quase lá — mais um dia seria melhor." : "Ainda está descansando.";
      return { ok: true, fala: g.nome + ": " + (g.dias === 0 ? "você treinou hoje" : g.dias + " " + plural(g.dias, "dia", "dias") + " desde a última vez") + ". " + estado };
    }
    case "seriesGrupo": {
      const lista = seriesSemanaisPorGrupo(hist, ctx.exPorId);
      const g = lista.find((x) => x.id === c.grupo);
      if (!g) return { ok: false, fala: "Não achei esse grupo muscular." };
      const faixa = " A referência para crescer é de " + FAIXA_SERIES.min + " a " + FAIXA_SERIES.max + " séries por semana.";
      const onde = g.series === 0 ? "nenhuma série" : g.series + " " + plural(g.series, "série", "séries");
      const juizo = g.series === 0 ? " Ainda dá tempo." : g.series < FAIXA_SERIES.min ? " Está abaixo da faixa." :
        g.series <= FAIXA_SERIES.max ? " Está na faixa." : " Já passou da faixa — cuidado com a recuperação.";
      return { ok: true, fala: "Esta semana você fez " + onde + " de " + g.nome + "." + juizo + faixa };
    }
    case "ultimoTreino": {
      if (!hist.length) return { ok: true, fala: "Você ainda não tem nenhum treino no histórico." };
      const ult = [...hist].sort((a, b) => new Date(b.data) - new Date(a.data))[0];
      const dias = Math.floor((Date.now() - new Date(ult.data).getTime()) / 86400000);
      const st = statsTreino(ult);
      const quando = dias <= 0 ? "hoje" : dias === 1 ? "ontem" : "há " + dias + " dias";
      return { ok: true, fala: "Seu último treino foi " + quando + ": " + ult.nome + ". " +
        st.series + " " + plural(st.series, "série", "séries") + " em " + ult.duracaoMin + " " + plural(ult.duracaoMin, "minuto", "minutos") +
        (st.volume > 0 ? ", " + fmtKg(st.volume) + " de volume" : "") + "." };
    }
    case "progresso": {
      const est = calcularEstatisticas(hist);
      const f = c.frase || "";
      if (/\bnivel\b/.test(f)) {
        const nv = nivelDe(est);
        return { ok: true, fala: "Você está no nível " + nv.indice + ", " + nv.nome + ". " +
          (nv.proximo ? "Faltam " + nv.faltam + " pontos para " + nv.proximo.nome + "." : "É o topo da tabela.") };
      }
      if (/\bsequencia\b/.test(f)) {
        return { ok: true, fala: est.streak > 0
          ? "Sua sequência é de " + est.streak + " " + plural(est.streak, "dia", "dias") + " seguidos. Não deixa cair."
          : "Sua sequência está zerada. O treino de hoje recomeça a conta." };
      }
      if (/\bmeta\b/.test(f)) {
        const meta = ctx.meta || 3;
        const faltam = Math.max(0, meta - est.treinosSemana);
        return { ok: true, fala: "Esta semana você treinou " + est.treinosSemana + " de " + meta + ". " +
          (faltam ? "Faltam " + faltam + "." : "Meta batida!") };
      }
      if (/\bconquista/.test(f)) {
        const g2 = CONQUISTAS.filter((x) => x.cond(est)).length;
        return { ok: true, fala: "Você tem " + g2 + " de " + CONQUISTAS.length + " conquistas." };
      }
      if (/\bvolume\b|levantei/.test(f)) {
        return { ok: true, fala: "Você já moveu " + fmtPeso(est.volumeTotal) + " desde o começo." };
      }
      const nv = nivelDe(est);
      return { ok: true, fala: est.total + " " + plural(est.total, "treino", "treinos") + " registrados, " +
        "sequência de " + est.streak + " " + plural(est.streak, "dia", "dias") + ", nível " + nv.indice + ", " + nv.nome +
        ", e " + fmtPeso(est.volumeTotal) + " movidos." };
    }
    case "medida": {
      const lista = [...(ctx.medidas || [])].sort((a, b) => new Date(b.data) - new Date(a.data));
      if (!lista.length) return { ok: true, fala: "Você ainda não registrou medidas. Elas ficam em Histórico, aba Corpo." };
      const f = c.frase || "";
      const campo = /cintura/.test(f) ? ["cintura", "cintura", "cm"] : /braco/.test(f) ? ["braco", "braço", "cm"] :
        /coxa/.test(f) ? ["coxa", "coxa", "cm"] : /quadril/.test(f) ? ["quadril", "quadril", "cm"] : ["peso", "peso", "kg"];
      const atual = lista.find((m) => m[campo[0]]);
      if (!atual) return { ok: true, fala: "Você ainda não registrou " + campo[1] + "." };
      const anterior = lista.find((m) => m[campo[0]] && m !== atual && new Date(m.data) < new Date(atual.data));
      let fala = "Seu " + campo[1] + ": " + fmtNum(atual[campo[0]]) + " " + campo[2] +
        ", medido em " + new Date(atual.data).toLocaleDateString("pt-BR") + ".";
      if (anterior) {
        const dif = Math.round((parseFloat(atual[campo[0]]) - parseFloat(anterior[campo[0]])) * 10) / 10;
        fala += dif === 0 ? " Igual à medição anterior."
          : " " + (dif > 0 ? "Subiu " : "Desceu ") + fmtNum(Math.abs(dif)) + " " + campo[2] + " desde a medição anterior.";
      }
      return { ok: true, fala: fala };
    }
    default: return null;
  }
}

// WAV de um segundo em silêncio, montado na hora. Serve só para o aparelho
// considerar que há mídia tocando — é a condição para o sistema entregar as
// teclas do fone de ouvido à página. Montar em vez de embutir evita vinte
// quilobytes de base64 no arquivo.
function urlSilencio() {
  const taxa = 8000, n = taxa;
  const buf = new ArrayBuffer(44 + n);
  const dv = new DataView(buf);
  const txt = (p, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(p + i, s.charCodeAt(i)); };
  txt(0, "RIFF"); dv.setUint32(4, 36 + n, true); txt(8, "WAVEfmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, taxa, true); dv.setUint32(28, taxa, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
  txt(36, "data"); dv.setUint32(40, n, true);
  for (let i = 0; i < n; i++) dv.setUint8(44 + i, 128);  // 128 é o silêncio em 8 bits
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}

// ---- O ouvinte ----
// O navegador encerra o reconhecimento sozinho depois de alguns segundos de
// silêncio, mesmo com "continuous". Religar no "onend" é o jeito que funciona —
// com freio, porque religar em laço trava a aba.
function criarOuvinte(opcoes) {
  if (!VOZ_OUVE) return null;
  const aoParcial = opcoes.aoParcial, aoFinal = opcoes.aoFinal;
  const aoEstado = opcoes.aoEstado, aoErro = opcoes.aoErro;
  const aoTumulto = opcoes.aoTumulto;
  let rec = null;
  let querendo = false;
  let rodando = false;
  let umaVez = false;      // modo "toque para falar": uma sessão por comando
  let religadas = [];
  let semResultado = 0;    // religadas seguidas sem nenhuma frase
  let desdeQuando = 0;     // quando essa sequencia comecou
  let avisouTumulto = false;
  let timer = null;

  const agendarReligar = () => {
    const agora = Date.now();
    religadas = religadas.filter((t) => agora - t < 12000);
    // Mais de 10 religadas em 12 segundos é sinal de que algo está errado;
    // dar um respiro evita a aba travar em laço.
    let espera = religadas.length > 10 ? 2500 : 600;
    // Religar enquanto ele fala é desperdício puro: o microfone só ia ouvir a
    // própria voz dele — e, no Android, cada religada apita por cima da resposta.
    const falta = jarvisFalandoAte - agora;
    if (falta > 0) espera = Math.max(espera, falta + 200);
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (!querendo || rodando) return;
      religadas.push(Date.now());
      try { rec.start(); } catch (e) { /* já estava começando */ }
    }, espera);
    // Religar sem parar e sem nunca ouvir nada é o sintoma do Android encerrando
    // a sessão a cada silêncio. Quem está na academia só percebe os bipes.
    // Seis encerramentos EM SEQUENCIA E EM POUCOS SEGUNDOS. Espacados, sao o
    // comportamento normal de quem fica calado entre uma serie e outra.
    if (semResultado >= 6 && agora - desdeQuando < 15000 && !avisouTumulto) {
      avisouTumulto = true;
      anotarDiario("", "o microfone reiniciou " + semResultado + " vezes em " + Math.round((agora - desdeQuando) / 1000) + "s sem ouvir nada");
      if (aoTumulto) aoTumulto();
    }
  };

  // A frase só é entregue quando para de crescer. Sem isto, "anota aí cadeira
  // abdutora 90 kg 12" vira vinte comandos, todos pela metade.
  let frasePendente = "";
  let altPendente = null;
  let timerFrase = null;
  let ultimaEntregue = "";
  let quandoEntregue = 0;
  const entregarFrase = () => {
    clearTimeout(timerFrase);
    timerFrase = null;
    const t = frasePendente, a = altPendente;
    frasePendente = "";
    altPendente = null;
    if (!t) return;
    ultimaEntregue = t;
    quandoEntregue = Date.now();
    if (aoFinal) aoFinal(t, a || [t]);
  };
  // Mesma frase crescendo, ou outra frase? Comparar por prefixo de texto não
  // basta: o reconhecedor REVISA o fim da frase enquanto escuta ("90 kg 12"
  // virou "90 kg de repetição"), e aí o prefixo deixa de bater. Comparar por
  // palavras, tolerando a última, resolve.
  // Usada tanto para juntar os pedaços quanto para reconhecer a continuação
  // O reconhecedor larga e repõe o "Jarvis" da frente entre uma revisão e
  // outra. Comparar com ele no meio fazia "Jarvis ir para o próximo" e "ir
  // para o próximo" parecerem frases diferentes — e o comando era executado
  // duas vezes, pulando um exercício.
  const semNomeNaFrente = (p) => (p.length && pareceJarvis(p[0]) ? p.slice(1) : p);
  const mesmaFrase = (a, b) => {
    const pa = semNomeNaFrente(a.toLowerCase().split(/\s+/).filter(Boolean));
    const pb = semNomeNaFrente(b.toLowerCase().split(/\s+/).filter(Boolean));
    let k = 0;
    while (k < pa.length && k < pb.length && pa[k] === pb[k]) k++;
    return k >= 1 && k >= Math.min(pa.length, pb.length) - 1;
  };
  const acumularFrase = (t, alts) => {
    const novo = String(t || "").trim();
    if (!novo) return;
    if (frasePendente && !mesmaFrase(frasePendente, novo)) entregarFrase();
    if (!frasePendente || novo.length >= frasePendente.length) {
      frasePendente = novo;
      altPendente = alts;
    }
    clearTimeout(timerFrase);
    // O tempo precisa caber a frase inteira chegando em pedaços num aparelho
    // ocupado. Agir cedo demais é agir na frase pela metade.
    timerFrase = setTimeout(entregarFrase, 1100);
  };

  const montar = () => {
    const r = new ReconhecedorVoz();
    r.lang = "pt-BR";
    // No modo toque, uma sessão por comando: é o próprio sistema que decide
    // quando a pessoa parou de falar, e ele faz isso melhor do que um relógio nosso.
    r.continuous = !umaVez;
    r.interimResults = true;
    // Em ambiente barulhento a transcrição certa costuma não ser a primeira.
    // Pedir mais alternativas não custa nada e é o único ganho de precisão que
    // a API do navegador oferece.
    r.maxAlternatives = 5;
    r.onstart = () => { rodando = true; if (aoEstado) aoEstado("ouvindo"); };
    r.onaudiostart = () => { rodando = true; };
    r.onresult = (ev) => {
      const falandoAgora = Date.now() < jarvisFalandoAte;
      let parcial = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        if (res.isFinal) {
          const t = res[0].transcript;
          // Ainda é a frase que acabou de ser tratada, só que estendida ou
          // corrigida. O prazo é curto de propósito: a frase já esperou 1,1s para
          // assentar, então o que vem depois é retardatário. Mais folga do que
          // isso engoliria quem repete a mesma série de propósito — e ditar
          // "40 por 15" duas vezes seguidas é das coisas mais comuns do treino.
          if (ultimaEntregue && Date.now() - quandoEntregue < 1200 && mesmaFrase(ultimaEntregue, t)) {
            anotarDiario(t, "continuação do que já foi tratado — ignorado");
            continue;
          }
          if (falandoAgora) {
            // Antes, TUDO o que chegava enquanto ele falava era descartado — e a
            // pergunta que a pessoa emendava na resposta sumia sem deixar rastro.
            // Agora só o eco da própria voz é descartado: falar por cima dele
            // cala o assistente, que é o que se faz com quem está falando demais.
            if (ecoDaPropriaVoz(t)) { anotarDiario(t, "eco da própria voz — descartado"); continue; }
            anotarDiario(t, "você falou por cima — calei para ouvir");
            semResultado = 0;
            calarJarvis();
          }
          const alts = [];
          for (let k = 0; k < res.length; k++) alts.push(res[k].transcript);
          semResultado = 0;
          avisouTumulto = false;
          acumularFrase(t, alts);
        } else if (!falandoAgora) {
          parcial += res[0].transcript;
        }
      }
      if (parcial && aoParcial) aoParcial(parcial);
    };
    r.onerror = (ev) => {
      const erro = ev && ev.error;
      if (erro && erro !== "no-speech" && erro !== "aborted") anotarDiario("", "erro do microfone: " + erro);
      if (erro === "not-allowed" || erro === "service-not-allowed") {
        querendo = false; rodando = false;
        if (aoErro) aoErro("permissao");
        if (aoEstado) aoEstado("desligado");
        return;
      }
      if (erro === "audio-capture") {
        querendo = false; rodando = false;
        if (aoErro) aoErro("microfone");
        if (aoEstado) aoEstado("desligado");
      }
      // "no-speech", "aborted" e "network" são rotina: o onend religa
    };
    r.onend = () => {
      rodando = false;
      // A sessão acabou: o que estava sendo juntado já é a frase inteira
      if (frasePendente) entregarFrase();
      if (semResultado === 0) desdeQuando = Date.now();
      semResultado++;
      // No modo toque a sessão acaba e pronto: quem recomeça é o dedo.
      if (umaVez) { querendo = false; if (aoEstado) aoEstado("desligado"); return; }
      if (!querendo) { if (aoEstado) aoEstado("desligado"); return; }
      agendarReligar();
    };
    return r;
  };

  return {
    // modo: "continuo" (mãos livres) ou "toque" (uma sessão por comando)
    ligar(modo) {
      const toque = modo === "toque";
      // Trocar de modo exige um reconhecedor novo: "continuous" só pode ser
      // definido antes de começar.
      if (rec && toque !== umaVez) { try { rec.abort(); } catch (e) {} rec = null; }
      umaVez = toque;
      if (!rec) rec = montar();
      querendo = true;
      semResultado = 0;
      avisouTumulto = false;
      if (rodando) return;
      try { rec.start(); religadas.push(Date.now()); }
      catch (e) { agendarReligar(); }
    },
    desligar() {
      querendo = false;
      clearTimeout(timer);
      clearTimeout(timerFrase);
      frasePendente = "";
      altPendente = null;
      calarJarvis();
      try { if (rec) rec.abort(); } catch (e) {}
      rodando = false;
      if (aoEstado) aoEstado("desligado");
    },
    // Chamado por um relógio de fora: o "onend" nem sempre dispara, e sem esta
    // conferência o microfone morre calado no meio do treino.
    conferir() { if (querendo && !rodando && !umaVez) agendarReligar(); },
    noModoToque() { return umaVez; },
    ligado() { return querendo; },
  };
}

// Devolve o endereço da foto do aparelho, ou null. O estado inicial já vem do
// cache quando a foto foi resolvida antes: assim a lista não pisca ao rolar.
function useFotoExercicio(ex) {
  const temFoto = !!(ex && ex.foto);
  const id = ex ? ex.id : null;
  const [url, setUrl] = useState(() => (temFoto && FOTOS_EX[id] ? FOTOS_EX[id] : null));
  useEffect(() => {
    if (!temFoto || !id) { setUrl(null); return; }
    let vivo = true;
    carregarFotoEx(id).then((u) => { if (vivo) setUrl(u || null); });
    return () => { vivo = false; };
  }, [temFoto, id]);
  return url;
}

function ImagemExercicio({ ex }) {
  // A foto que o dono tirou do aparelho vem antes de tudo: é a imagem mais
  // fiel possível, porque é a máquina daquela academia.
  const fotoPropria = useFotoExercicio(ex);
  const url = IMAGENS_WGER[ex.id] || null;
  const [falhou, setFalhou] = useState(false);

  // Trocar de exercício precisa limpar a falha do anterior
  useEffect(() => { setFalhou(false); }, [ex.id]);

  if (fotoPropria) {

        <div style={{ fontSize: 11, color: "var(--cinza)", marginTop: 6 }}>📷 Sua foto do aparelho</div>

  // Movimento funcional não tem figura no acervo do wger — tem boneco desenhado

      <div style={{ fontSize: 13, color: "var(--cinza)", padding: "8px 0", lineHeight: 1.6 }}>
        {ex.custom
          ? "Sem foto deste aparelho. Toque em “Trocar a foto” abaixo para fotografar a máquina da sua academia."

        {/* sem loading="lazy": é a única imagem da tela e o conteúdo principal dela */}

        <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.pt-br" target="_blank" rel="noreferrer">CC BY-SA 4.0</a>
      </div>
    </div>
  );
}

// ---------------- ESTATÍSTICAS: TONELAGEM SEMANAL ----------------
function GraficoSemanal({ historico }) {
  const semanas = volumeSemanal(historico, 8);
  const vmax = Math.max(...semanas.map((s) => s.volume), 1);
  const W = 320, H = 130, base = 104, larg = 26;
  const passo = (W - 20) / semanas.length;
  const media = Math.round(semanas.reduce((a, s) => a + s.volume, 0) / semanas.length);
  return (
    <div style={S.card}>
      <div style={S.label}>Tonelagem por semana</div>
      <div style={{ color: "var(--cinza)", fontSize: 12, margin: "4px 0 12px" }}>
        Últimas 8 semanas · média de {fmtPeso(media)} por semana
      </div>
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }}>
        <line x1="10" x2={W - 10} y1={base} y2={base} stroke="var(--borda)" strokeWidth="1" />
        {semanas.map((s, i) => {
          const alt = s.volume ? Math.max(3, (s.volume / vmax) * 82) : 0;
          const x = 10 + i * passo + (passo - larg) / 2;
          const atual = i === semanas.length - 1;
          return (
            <g key={i}>
              {alt > 0 && (
                <rect x={x} y={base - alt} width={larg} height={alt} rx="5"
                  fill={atual ? "#E1306C" : "#E1306C66"} />
              )}
              {s.volume > 0 && (
                <text x={x + larg / 2} y={base - alt - 5} fill="var(--cinza)" fontSize="9" textAnchor="middle">
                  {s.volume >= 1000 ? Math.round(s.volume / 1000) + "t" : s.volume}
                </text>
              )}
              <text x={x + larg / 2} y={base + 14} fill="var(--cinza2)" fontSize="9" textAnchor="middle">
                {s.ini.getDate() + "/" + (s.ini.getMonth() + 1)}
              </text>
              <text x={x + larg / 2} y={base + 25} fill="var(--cinza2)" fontSize="8" textAnchor="middle">
                {s.treinos ? s.treinos + "x" : ""}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// ---------------- ESTATÍSTICAS: CALENDÁRIO DO MÊS ----------------
function CalendarioTreinos({ historico }) {
  const [desl, setDesl] = useState(0);
  const hoje = new Date();
  const ref = new Date(hoje.getFullYear(), hoje.getMonth() + desl, 1);
  const porDia = {};
  historico.forEach((h) => {
    const d = new Date(h.data);
    if (d.getMonth() === ref.getMonth() && d.getFullYear() === ref.getFullYear()) {
      porDia[d.getDate()] = (porDia[d.getDate()] || 0) + statsTreino(h).volume;
    }
  });
  const vmax = Math.max(...Object.keys(porDia).map((k) => porDia[k]), 1);
  const nDias = new Date(ref.getFullYear(), ref.getMonth() + 1, 0).getDate();
  const inicio = (new Date(ref.getFullYear(), ref.getMonth(), 1).getDay() + 6) % 7;
  const celulas = [];
  for (let i = 0; i < inicio; i++) celulas.push(null);
  for (let d = 1; d <= nDias; d++) celulas.push(d);
  const treinosMes = Object.keys(porDia).length;
  return (
    <div style={S.card}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <button onClick={() => setDesl(desl - 1)} aria-label="Mês anterior"
          style={{ background: "none", border: "none", color: "#E1306C", fontSize: 20, fontWeight: 900, cursor: "pointer", padding: "0 8px" }}>‹</button>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontWeight: 900, fontSize: 14, textTransform: "capitalize" }}>
            {ref.toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}
          </div>
          <div style={{ color: "var(--cinza)", fontSize: 11 }}>{treinosMes} {plural(treinosMes, "dia", "dias")} de treino</div>
        </div>
        <button onClick={() => setDesl(Math.min(0, desl + 1))} disabled={desl >= 0} aria-label="Mês seguinte"
          style={{ background: "none", border: "none", color: desl >= 0 ? "var(--borda2)" : "#E1306C", fontSize: 20, fontWeight: 900, cursor: desl >= 0 ? "default" : "pointer", padding: "0 8px" }}>›</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginTop: 12 }}>
        {["S", "T", "Q", "Q", "S", "S", "D"].map((d, i) => (
          <div key={i} style={{ textAlign: "center", fontSize: 10, color: "var(--cinza2)", fontWeight: 700 }}>{d}</div>
        ))}
        {celulas.map((d, i) => {
          if (d === null) return <div key={i} />;
          const vol = porDia[d];
          const intens = vol ? 0.3 + (vol / vmax) * 0.7 : 0;
          const ehHoje = desl === 0 && d === hoje.getDate();
          return (
            <div key={i} title={vol ? fmtPeso(vol) : ""}
              style={{
                aspectRatio: "1", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 11, fontWeight: vol ? 900 : 500,
                background: vol ? "rgba(225,48,108," + intens + ")" : "var(--input)",
                color: vol ? "#FFFFFF" : "var(--cinza2)",
                border: ehHoje ? "1.5px solid #E1306C" : "1px solid var(--borda)",
              }}>
              {d}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------------- ESTATÍSTICAS: NÚMEROS GERAIS ----------------
function NumerosGerais({ historico }) {
  const est = calcularEstatisticas(historico);
  let minutos = 0, series = 0, reps = 0;
  historico.forEach((h) => {
    minutos += h.duracaoMin || 0;
    const s = statsTreino(h);
    series += s.series; reps += s.reps;
  });
  // Média das últimas 8 semanas: usa o MESMO período no numerador e no denominador.
  // Conta só a partir da primeira semana em que houve treino, para não penalizar quem começou agora.
  const ult8 = volumeSemanal(historico, 8);
  const treinos8 = ult8.reduce((a, s) => a + s.treinos, 0);
  const primeiraAtiva = ult8.findIndex((s) => s.treinos > 0);
  const semanas = primeiraAtiva < 0 ? 1 : ult8.length - primeiraAtiva;
  const eq = equivalencia(est.volumeTotal);
  const itens = [
    ["Treinos", est.total],
    ["Horas", (Math.round((minutos / 60) * 10) / 10).toLocaleString("pt-BR")],
    ["Séries", series.toLocaleString("pt-BR")],
    ["Repetições", reps.toLocaleString("pt-BR")],
    ["Volume total", fmtPeso(est.volumeTotal)],
    ["Sequência", est.streak + " " + plural(est.streak, "dia", "dias")],
    ["Média/semana", (() => {
      const m = Math.round((treinos8 / semanas) * 10) / 10;
      return m.toLocaleString("pt-BR") + " " + plural(m, "treino", "treinos");
    })()],
    ["Esta semana", fmtPeso(est.volumeSemana)],
  ];
  return (
    <div style={S.card}>
      <div style={{ ...S.label, marginBottom: 12 }}>Seus números</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {itens.map(([nome, val]) => (
          <div key={nome} style={{ background: "var(--input)", border: "1px solid var(--borda)", borderRadius: 12, padding: "10px 12px" }}>
            <div style={{ fontSize: 18, fontWeight: 900, color: "#E1306C" }}>{val}</div>
            <div style={{ fontSize: 10, color: "var(--cinza)", textTransform: "uppercase", letterSpacing: 0.5 }}>{nome}</div>
          </div>
        ))}
      </div>
      {eq && (
        <div style={{ marginTop: 12, fontSize: 12, color: "var(--cinza)", textAlign: "center" }}>
          Você já moveu {fmtPeso(est.volumeTotal)} — {eq}
        </div>
      )}
    </div>
  );
}

// ---------------- GRÁFICO DE EVOLUÇÃO ----------------
function GraficoEvolucao({ historico, exPorId }) {
  const idsComDados = [];
  const vistos = {};
  historico.forEach((h) => h.itens.forEach((it) => {
    const temPeso = it.series.some((s) => parseFloat(s.peso) > 0);
    if (temPeso && !vistos[it.exercicioId] && exPorId(it.exercicioId)) {
      vistos[it.exercicioId] = true;
      idsComDados.push(it.exercicioId);
    }
  }));

  const [exSel, setExSel] = useState(idsComDados[0] || "");
  const [metrica, setMetrica] = useState("max");

  useEffect(() => {
    if ((!exSel || !vistos[exSel]) && idsComDados.length) setExSel(idsComDados[0]);
  }, [historico.length]);

  if (idsComDados.length === 0) {
    return (
      <div style={S.card}>
        <div style={S.label}>Evolução</div>
        <div style={{ color: "var(--cinza)", fontSize: 14, marginTop: 8 }}>
          Conclua treinos registrando os pesos para ver seu gráfico de evolução aqui.
        </div>
      </div>
    );
  }

  const ordenado = [...historico].sort((a, b) => new Date(a.data) - new Date(b.data));
  const pontos = [];
  ordenado.forEach((h) => {
    const it = h.itens.find((x) => x.exercicioId === exSel);
    if (!it) return;
    let valor = 0;
    if (metrica === "max") {
      it.series.forEach((sr) => {
        if (!serieConta(sr)) return;
        const pz = ehTempo(sr) ? segundosDe(sr) : cargaDe(sr);
        if (pz > valor) valor = pz;
      });
    } else if (metrica === "1rm") {
      valor = melhor1RM(it);
    } else {
      valor = itemDeTempo(it) ? tempoItem(it) : volumeItem(it);
    }
    if (valor > 0) pontos.push({ data: new Date(h.data), valor });
  });

  const W = 320, H = 150, x0 = 34, x1 = 310, y0 = 118, y1 = 16;
  let svg = null;
  if (pontos.length >= 2) {
    const vmin = Math.min(...pontos.map((pt) => pt.valor));
    const vmax = Math.max(...pontos.map((pt) => pt.valor));
    const range = vmax - vmin || 1;
    const px = (i) => x0 + (i / (pontos.length - 1)) * (x1 - x0);
    const py = (v) => y0 - ((v - vmin) / range) * (y0 - y1);
    const linha = pontos.map((pt, i) => px(i).toFixed(1) + "," + py(pt.valor).toFixed(1)).join(" ");
    const fmtData = (d) => d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
    svg = (
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }}>
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={x0} x2={x1} y1={y0 - f * (y0 - y1)} y2={y0 - f * (y0 - y1)} stroke="var(--borda)" strokeWidth="1" />
        ))}
        <text x={x0 - 4} y={y1 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{vmax}</text>
        <text x={x0 - 4} y={y0 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{vmin}</text>
        <polyline points={linha} fill="none" stroke="#E1306C" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        {pontos.map((pt, i) => (
          <circle key={i} cx={px(i)} cy={py(pt.valor)} r="3.5" fill="#ED4956" stroke="var(--bg)" strokeWidth="1" />
        ))}
        <text x={x0} y={H - 4} fill="var(--cinza)" fontSize="10">{fmtData(pontos[0].data)}</text>
        <text x={x1} y={H - 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{fmtData(pontos[pontos.length - 1].data)}</text>
      </svg>
    );
  }

  const primeiro = pontos[0], ultimo = pontos[pontos.length - 1];
  const melhor = pontos.length ? Math.max(...pontos.map((pt) => pt.valor)) : 0;

  return (
    <div style={S.card}>
      <div style={{ ...S.label, marginBottom: 10 }}>Evolução do treino</div>

            <div style={{ color: "var(--cinza2)", fontSize: 11, marginTop: 10, lineHeight: 1.4 }}>

}
function unidadeCurta(metrica) { return metrica === "volume" ? "" : "kg"; }

const CORES_CONFETE = ["#F58529", "#DD2A7B", "#8134AF", "#4F5BD5", "#FEDA75", "#4ADE80"];
function Confete({ pecas = 44 }) {
  // Sorteado uma vez só: se recalculasse a cada render, o confete "pularia" na tela.
  const lista = useMemo(() => Array.from({ length: pecas }, (unused, i) => ({
    i,
    esq: Math.random() * 100,
    cor: CORES_CONFETE[Math.floor(Math.random() * CORES_CONFETE.length)],
    atraso: Math.random() * 450,
    duracao: 1700 + Math.random() * 1300,
    desvio: (Math.random() * 40 - 20).toFixed(1) + "vw",
    giro: Math.round(360 + Math.random() * 720) + "deg",
  })), [pecas]);
  return (
    <React.Fragment>
      {lista.map((p) => (
        <span key={p.i} className="confete-peca" aria-hidden="true"
          style={{
            left: p.esq + "vw", background: p.cor,
            animationDelay: p.atraso + "ms", animationDuration: p.duracao + "ms",
            "--desvio": p.desvio, "--giro": p.giro,
          }} />
      ))}
    </React.Fragment>
  );
}

// Cronômetro do treino. Componente separado de propósito: assim o relógio bate
// a cada segundo sem redesenhar a lista inteira de exercícios e campos.
function CronometroSessao({ inicio }) {
  const [agora, setAgora] = useState(Date.now());
  useEffect(() => {
    const iv = setInterval(() => setAgora(Date.now()), 1000);
    return () => clearInterval(iv);
  }, []);
  const seg = Math.max(0, Math.floor((agora - inicio) / 1000));
  const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60;
  const dois = (n) => (n < 10 ? "0" + n : String(n));
  return (
    <span style={{ fontVariantNumeric: "tabular-nums" }}>
      {h > 0 ? h + ":" + dois(m) + ":" + dois(s) : m + ":" + dois(s)}
    </span>
  );
}

// "90" na tela é claro; falado precisa virar "um minuto e meio".
// O que está entre parênteses no nome é detalhe de catálogo: ajuda a ler, atrapalha a ouvir.
// O que está entre parênteses, e o ângulo no nome do leg press, são detalhe de
// catálogo: ajudam a ler e atrapalham a ouvir. Quem dita "leg press" e escuta
// de volta "leg press quarenta e cinco graus" acha que ele entendeu errado.
const nomeFalado = (n) => String(n || "")
  .replace(/\s*\([^)]*\)/g, "")
  .replace(/\s*\d+\s*°/g, "")
  // "Mesa/cadeira flexora" saía "mesa barra cadeira flexora"
  .replace(/\s*\/\s*/g, " ou ")
  .trim() || String(n || "");

function tempoFalado(seg) {
  const s = Math.max(0, Math.round(seg || 0));
  const m = Math.floor(s / 60), r = s % 60;
  if (m && r === 30) return m + " " + plural(m, "minuto", "minutos") + " e meio";
  if (m && r) return m + " " + plural(m, "minuto", "minutos") + " e " + r + " segundos";
  if (m) return m + " " + plural(m, "minuto", "minutos");
  return r + " segundos";
}

// aparelho e nunca combina com o resto — aqui ele é vetor, na mesma espessura

      <line x1="12" y1="17.8" x2="12" y2="21" stroke={cor} strokeWidth="2.1" strokeLinecap="round" />
      <line x1="8.4" y1="21.4" x2="15.6" y2="21.4" stroke={cor} strokeWidth="2.1" strokeLinecap="round" />

function PainelJarvis({ disponivel, ligado, estado, parcial, ultima, descansando, naSessao, escondido, noToque,
  pos, onMover, onAlternar, onAjuda }) {
  if (!disponivel) return null;
  const ouvindo = ligado && estado === "ouvindo";
  // Com o cronômetro de descanso na tela, o botão sobe para não cobrir o tempo
  const alturaBase = descansando && naSessao ? 190 : 76;
  // ---- tirar o botão da frente ----
  // A queixa era sempre a mesma: ele cobre o ✕ do exercício, o ✓ da série, o
  // número do descanso. Arrastar resolve de vez; ficar translúcido quando
  // parado resolve a leitura sem precisar mover nada.
  const caixaRef = useRef(null);
  const arrastouRef = useRef(false);
  const agiuRef = useRef(0);
  const inicioRef = useRef(null);
  const [arrasto, setArrasto] = useState(null);   // posição em px durante o arrasto
  const [apagado, setApagado] = useState(false);
  const podeAprender = !pos && !noToque;

  useEffect(() => {
    if (ouvindo || arrasto) { setApagado(false); return; }
    const t = setTimeout(() => setApagado(true), 4000);
    return () => clearTimeout(t);
  }, [ouvindo, arrasto, ligado, ultima]);

  const aoPegar = (e) => {
    arrastouRef.current = false;
    setApagado(false);
    const r = caixaRef.current ? caixaRef.current.getBoundingClientRect() : null;
    if (!r) return;
    const alvo = e.target && e.target.closest ? e.target.closest("[data-acao]") : null;
    inicioRef.current = {
      px: e.clientX, py: e.clientY, x: r.left, y: r.top, w: r.width, h: r.height,
      acao: alvo ? alvo.getAttribute("data-acao") : null,
    };
    // A captura precisa valer desde já, senão um arrasto rápido perde os eventos
    // assim que o dedo sai de cima do botão. Em troca, o navegador passa a mandar
    // o clique para a caixa e não para o botão — por isso o toque é resolvido no
    // soltar, logo abaixo, e o onClick fica só para o teclado.
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  };
  const aoMover = (e) => {
    const i = inicioRef.current;
    if (!i) return;
    const dx = e.clientX - i.px, dy = e.clientY - i.py;
    // Oito pixels de folga: sem isso, o tremor do dedo no toque viraria arrasto
    // e o botão nunca ligaria o microfone.
    if (!arrastouRef.current && Math.hypot(dx, dy) < 8) return;
    arrastouRef.current = true;
    setArrasto({
      x: Math.max(6, Math.min(window.innerWidth - i.w - 6, i.x + dx)),
      y: Math.max(8, Math.min(window.innerHeight - i.h - 8, i.y + dy)),
    });
  };
  const aoSoltar = (e) => {
    const i = inicioRef.current;
    inicioRef.current = null;
    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
    if (!arrastouRef.current || !arrasto || !i) {
      setArrasto(null);
      // Foi um toque, não um arrasto: age aqui, porque o clique vai para a caixa.
      agiuRef.current = Date.now();
      if (i && i.acao === "ajuda") onAjuda();
      else if (i && i.acao === "mic") onAlternar();
      return;
    }
    // Encosta na borda mais perto: largado no meio da tela ele voltaria a cobrir
    // conteúdo, que é exatamente o problema que se está resolvendo.
    const lado = arrasto.x + i.w / 2 < window.innerWidth / 2 ? "esq" : "dir";
    const deBaixo = Math.round(window.innerHeight - (arrasto.y + i.h));
    if (onMover) onMover({ lado: lado, y: Math.max(16, Math.min(window.innerHeight - 150, deBaixo)) });
    setArrasto(null);
    // A marca de "foi arrasto" fica de pé até o próximo toque. Com prazo, o
    // clique que chegasse depois dele passava — e arrastar o botão ligava o
    // microfone junto, toda vez.
  };
  return (
    <React.Fragment>
      {/* No modo toque a sessao acaba junto com o comando. Se a faixa dependesse
          de estar ouvindo, a resposta escrita sumiria no mesmo instante — e a
          pessoa nunca leria o que ele entendeu. */}
      {(ultima || (ligado && parcial)) && (
        <div className="jarvis-faixa" role="status" aria-live="polite"
          style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 45,
            background: "var(--bg2)", borderBottom: "2px solid " + (ultima && !ultima.ok ? "var(--obs)" : "#E1306C"),
            padding: "calc(10px + env(safe-area-inset-top)) 16px 11px", boxShadow: "0 6px 20px rgba(0,0,0,0.35)" }}>
          <div style={{ display: "flex", alignItems: "flex-start", gap: 10, maxWidth: 480, margin: "0 auto" }}>
            <span aria-hidden="true" style={{ fontSize: 17, lineHeight: 1.3 }}>{ultima && !ultima.ok ? "🤔" : "🎙"}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 12, color: "var(--cinza)", lineHeight: 1.4, fontStyle: "italic",
                overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {(ultima && ultima.ouvi) || parcial || "ouvindo..."}
              </div>
              {ultima && ultima.resposta && (
                <div style={{ fontSize: 14, fontWeight: 800, marginTop: 3, lineHeight: 1.4,
                  color: ultima.ok ? "var(--texto)" : "var(--obs)" }}>
                  {ultima.resposta}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Na escola o microfone já tem lugar na própria tela: um botão flutuante
          por cima do “Próxima lição” só atrapalharia quem está aprendendo. */}
      {!escondido && (
        <div ref={caixaRef}
          style={{
            position: "fixed", zIndex: 25,
            ...(arrasto
              ? { left: arrasto.x, top: arrasto.y, right: "auto", bottom: "auto" }
              : pos && pos.lado === "esq"
                ? { left: 14, bottom: "calc(" + pos.y + "px + env(safe-area-inset-bottom))" }
                : pos
                  ? { right: 14, bottom: "calc(" + pos.y + "px + env(safe-area-inset-bottom))" }
                  : { right: 14, bottom: "calc(" + alturaBase + "px + env(safe-area-inset-bottom))" }),
            display: "flex", flexDirection: "column", alignItems: "center", gap: 6,
            // Parado e sem ouvir, ele fica translúcido e menor: dá para ler o que
            // está atrás sem precisar tirá-lo do lugar. Um toque o traz de volta.
            opacity: arrasto ? 1 : apagado ? 0.34 : 1,
            transform: arrasto ? "scale(1.08)" : apagado ? "scale(0.88)" : "scale(1)",
            transition: arrasto ? "none" : "opacity .35s ease, transform .35s ease",
            touchAction: "none",
          }}
          onPointerDown={aoPegar} onPointerMove={aoMover} onPointerUp={aoSoltar} onPointerCancel={aoSoltar}>

          {/* O "?" nao pode depender de estar ouvindo: no modo toque a sessao acaba
              a cada comando, e a ajuda sumiria junto. */}
          <button data-acao="ajuda" onFocus={() => { arrastouRef.current = false; }} onClick={() => { if (!arrastouRef.current && Date.now() - agiuRef.current > 400) onAjuda(); }}
            aria-label="O que posso dizer ao Jarvis"
            style={{ width: 30, height: 30, borderRadius: 15, border: "1px solid var(--borda2)",
              background: "var(--card)", color: "var(--cinza)", fontSize: 14, fontWeight: 900,
              cursor: "pointer", lineHeight: 1 }}>
            ?
          </button>

          <div style={{ position: "relative", width: 58, height: 58 }}>
            {ouvindo && <span className="jarvis-onda" aria-hidden="true" />}
            {ouvindo && <span className="jarvis-onda atraso" aria-hidden="true" />}
            <button data-acao="mic" onFocus={() => { arrastouRef.current = false; }} onClick={() => { if (!arrastouRef.current && Date.now() - agiuRef.current > 400) onAlternar(); }}
              aria-pressed={ligado}
              aria-label={ligado ? (noToque ? "Parar de ouvir" : "Desligar o Jarvis (comandos por voz)") : (noToque ? "Tocar e falar com o Jarvis" : "Ligar o Jarvis (comandos por voz)")}
              title={ligado ? "Ouvindo — pode falar. Arraste para mover." : noToque ? "Toque e fale o comando. Arraste para mover." : "Ligar o Jarvis. Arraste para mover."}
              style={{ position: "relative", width: 58, height: 58, borderRadius: 29, cursor: "grab",
                border: "none", padding: 0,
                background: ligado ? GRAD : "var(--card)",
                boxShadow: ligado
                  ? "0 6px 20px rgba(225,48,108,0.45), 0 0 0 1px rgba(255,255,255,0.14) inset"
                  : "0 4px 16px rgba(0,0,0,0.45), 0 0 0 1px var(--borda2) inset",
                display: "flex", alignItems: "center", justifyContent: "center" }}>
              <IconeMicrofone ligado={ligado} />
            </button>
          </div>

          <span aria-hidden="true" style={{ fontSize: 9, fontWeight: 900, letterSpacing: 1,
            color: ligado ? "#E1306C" : "var(--cinza2)", textTransform: "uppercase",
            textAlign: "center", lineHeight: 1.3, whiteSpace: "nowrap" }}>
            {podeAprender ? "arraste p/ mover" : noToque && !ligado ? "toque e fale" : "Jarvis"}
          </span>
        </div>
      )}
    </React.Fragment>
  );
}

// Lista do que dá para falar. Aparece no "?" do painel e quando alguém pede ajuda.
// "Ele não responde" é um sintoma com cinco causas possíveis, e nenhuma delas
// aparece na tela. Isto mostra: se o microfone está vivo, o que ele ouviu
// palavra por palavra, e o que decidiu fazer com cada frase.
function ModalDiagnosticoJarvis({ aberto, ligado, estado, voz, noToque, onFechar }) {
  const [linhas, setLinhas] = useState([]);
  const [copiado, setCopiado] = useState(false);
  useEffect(() => {
    if (!aberto) return;
    const puxar = () => setLinhas(DIARIO_JARVIS.slice(0, 25));
    puxar();
    const iv = setInterval(puxar, 900);
    return () => clearInterval(iv);
  }, [aberto]);
  if (!aberto) return null;

  const vozAtual = VOZ_FALA ? escolherVozPtBr(voz.vozNome) : null;
  const resumo = [
    ["Versão do app", VERSAO_APP],
    ["Reconhecimento de voz", VOZ_OUVE ? "disponível" : "NÃO disponível neste navegador"],
    ["Como ele ouve", noToque ? "toque para falar" : "contínuo (mãos livres)"],
    ["Microfone", ligado ? (estado === "ouvindo" ? "ouvindo agora" : "religando") : noToque ? "pronto (toque e fale)" : "desligado"],
    ["Resposta falada", voz.falar ? (vozAtual ? "ligada (" + nomeCurtoVoz(vozAtual) + ")" : "ligada") : "desligada"],
    ["Frases ouvidas", String(DIARIO_JARVIS.length)],
  ];
  const texto = "TREINO LIVRE - diagnóstico do Jarvis\n" +
    resumo.map((x) => x[0] + ": " + x[1]).join("\n") + "\n\n" +
    (linhas.length ? linhas.map((l) => l.hora + "  \"" + l.ouvi + "\"\n          " + l.nota).join("\n")
      : "(nenhuma frase ouvida ainda)");

  return (
    <div onClick={onFechar}
      style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", zIndex: 56,
        display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div role="dialog" aria-modal="true" aria-label="Diagnóstico do Jarvis" onClick={(e) => e.stopPropagation()}
        style={{ ...S.card, width: "100%", maxWidth: 460, marginBottom: 0, borderRadius: "20px 20px 0 0",
          maxHeight: "88vh", overflowY: "auto", paddingBottom: "calc(18px + env(safe-area-inset-bottom))" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <div style={{ fontSize: 18, fontWeight: 900 }}>🩺 O que o Jarvis ouviu</div>
          <button onClick={onFechar} aria-label="Fechar"
            style={{ background: "none", border: "none", color: "var(--cinza)", fontSize: 24, fontWeight: 900, cursor: "pointer" }}>✕</button>
        </div>
        <div style={{ fontSize: 12.5, color: "var(--cinza)", lineHeight: 1.6, marginBottom: 14 }}>
          Fale com ele e volte aqui. Esta lista mostra cada frase que chegou ao microfone
          e o que ele decidiu fazer com ela.
        </div>

        <div style={{ border: "1px solid var(--borda2)", borderRadius: 12, padding: 12, marginBottom: 14 }}>
          {resumo.map((x) => (
            <div key={x[0]} style={{ display: "flex", justifyContent: "space-between", gap: 10, fontSize: 12.5, padding: "3px 0" }}>
              <span style={{ color: "var(--cinza)" }}>{x[0]}</span>
              <b style={{ textAlign: "right" }}>{x[1]}</b>
            </div>
          ))}
        </div>

        {linhas.length === 0 ? (
          <div style={{ fontSize: 13.5, lineHeight: 1.6, color: "var(--obs)", border: "1px solid var(--obs)", borderRadius: 12, padding: 12 }}>
            Nada chegou ao microfone ainda. Se você já falou e esta lista continua vazia,
            o problema é o microfone — não o entendimento. Confira a permissão no cadeado
            ao lado do endereço, e se outro aplicativo não está usando o microfone.
          </div>
        ) : (
          linhas.map((l, i) => (
            <div key={i} style={{ borderBottom: "1px solid var(--borda)", padding: "9px 0" }}>
              <div style={{ display: "flex", gap: 8, alignItems: "baseline" }}>
                <span style={{ fontSize: 10.5, color: "var(--cinza2)", fontVariantNumeric: "tabular-nums", flexShrink: 0 }}>{l.hora}</span>
                <span style={{ fontSize: 13.5, fontStyle: "italic", lineHeight: 1.4 }}>{l.ouvi ? "“" + l.ouvi + "”" : "—"}</span>
              </div>
              <div style={{ fontSize: 11.5, color: /ERRO|erro do/.test(l.nota) ? "var(--perigo)" : /ignorad|descartad/.test(l.nota) ? "var(--obs)" : "var(--ok)",
                fontWeight: 700, marginTop: 3, marginLeft: 44, lineHeight: 1.4 }}>
                {l.nota}
              </div>
            </div>
          ))
        )}

        <button style={{ ...S.btn, marginTop: 16 }}
          onClick={async () => {
            try { await navigator.clipboard.writeText(texto); setCopiado(true); setTimeout(() => setCopiado(false), 2500); }
            catch (e) {}
          }}>
          {copiado ? "✓ Copiado" : "📋 Copiar este diagnóstico"}
        </button>
        <div style={{ fontSize: 11, color: "var(--cinza2)", marginTop: 10, lineHeight: 1.5 }}>
          O diagnóstico fica só neste aparelho e some quando o app é fechado.
        </div>
      </div>
    </div>
  );
}

      <div role="dialog" aria-modal="true" aria-label="Comandos do Jarvis" onClick={(e) => e.stopPropagation()}

          microfone está ligado; nesse caso vale usar o modo “Toque e fale”.
          <br /><br />
          O reconhecimento é o do próprio navegador: funciona melhor no Chrome do Android.
          Tudo o que ele entende vira texto nos mesmos campos de sempre — se errar, é só corrigir na mão.
        </div>
      </div>
    </div>

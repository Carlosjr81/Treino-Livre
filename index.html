              <div style={{ flex: 1, ...S.label, fontSize: 10, textAlign: "center" }}>Reps</div>

                <div style={{ width: 26, fontWeight: 900, textAlign: "center", fontSize: 13,

                ) : (

                    <input type="number" inputMode="decimal" style={{ ...S.inputMini, flex: 1 }} value={s.peso}

                    <input type="number" inputMode="numeric" style={{ ...S.inputMini, flex: 1 }} value={s.reps}
                      aria-label={"Repetições da série " + (si + 1) + " de " + nomeEx}
                      onChange={(e) => upSerie(ei, si, "reps", e.target.value)} />
                  </React.Fragment>

const CAMPOS_MEDIDA = [
  { id: "peso", nome: "Peso", unidade: "kg", passo: "0.1" },
  { id: "cintura", nome: "Cintura", unidade: "cm", passo: "0.5" },

];

function GraficoMedida({ medidas, campo, unidade }) {
  const pontos = [...medidas]
    .filter((m) => parseFloat(m[campo]) > 0)
    .sort((a, b) => new Date(a.data) - new Date(b.data))
    .map((m) => ({ data: new Date(m.data), valor: parseFloat(m[campo]) }));
  if (pontos.length < 2) {
    return (
      <div style={{ fontSize: 13, color: "var(--cinza)", padding: "6px 0" }}>
        Registre pelo menos 2 medições para ver a linha de evolução.
      </div>
    );
  }
  const W = 320, H = 140, x0 = 40, x1 = 310, y0 = 108, y1 = 14;
  const vals = pontos.map((p) => p.valor);
  const vmin = Math.min(...vals), vmax = Math.max(...vals);
  const faixa = vmax - vmin || 1;
  const px = (i) => x0 + (i / (pontos.length - 1)) * (x1 - x0);
  const py = (v) => y0 - ((v - vmin) / faixa) * (y0 - y1);
  const linha = pontos.map((p, i) => px(i).toFixed(1) + "," + py(p.valor).toFixed(1)).join(" ");
  const fmtData = (d) => d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  const variacao = Math.round((pontos[pontos.length - 1].valor - pontos[0].valor) * 10) / 10;
  return (
    <React.Fragment>
      <svg viewBox={"0 0 " + W + " " + H} style={{ width: "100%", height: "auto" }} aria-hidden="true">
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={x0} x2={x1} y1={y0 - f * (y0 - y1)} y2={y0 - f * (y0 - y1)} stroke="var(--borda)" strokeWidth="1" />
        ))}
        <text x={x0 - 5} y={y1 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{fmtNum(vmax)}</text>
        <text x={x0 - 5} y={y0 + 4} fill="var(--cinza)" fontSize="10" textAnchor="end">{fmtNum(vmin)}</text>
        <polyline points={linha} fill="none" stroke="#E1306C" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
        {pontos.map((p, i) => (
          <circle key={i} cx={px(i)} cy={py(p.valor)} r="3.5" fill="#ED4956" stroke="var(--bg)" strokeWidth="1" />
        ))}
        <text x={x0} y={H - 3} fill="var(--cinza)" fontSize="10">{fmtData(pontos[0].data)}</text>
        <text x={x1} y={H - 3} fill="var(--cinza)" fontSize="10" textAnchor="end">{fmtData(pontos[pontos.length - 1].data)}</text>
      </svg>
      <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
        <Resumo num={fmtNum(pontos[0].valor) + unidade} txt="primeira" />
        <Resumo num={fmtNum(pontos[pontos.length - 1].valor) + unidade} txt="agora" />
        <Resumo num={(variacao > 0 ? "+" : "") + fmtNum(variacao) + unidade} txt="variação" />
      </div>
    </React.Fragment>
  );
}

// ---------------- FOTOS DE PROGRESSO (interface) ----------------
function PainelFotos({ fotos, onAdicionar, onExcluir, pedirConfirmacao }) {
  const [urls, setUrls] = useState({});
  const [aberta, setAberta] = useState(null);
  const entradaRef = useRef(null);

  // Carrega as miniaturas do IndexedDB e devolve os endereços temporários no fim,
  // senão cada visita à tela vaza memória.
  useEffect(() => {
    let vivo = true;
    const criados = [];
    (async () => {
      const novo = {};
      for (const f of fotos) {
        try {
          const blob = await lerFoto(f.id);
          if (!blob) continue;
          const u = URL.createObjectURL(blob);
          criados.push(u);
          novo[f.id] = u;
        } catch (e) {}
      }
      if (vivo) setUrls(novo); else criados.forEach((u) => URL.revokeObjectURL(u));
    })();
    return () => { vivo = false; criados.forEach((u) => URL.revokeObjectURL(u)); };
  }, [fotos]);

  const ordenadas = [...fotos].sort((a, b) => new Date(b.data) - new Date(a.data));
  return (
    <div style={S.card}>
      <div style={S.label}>Fotos de progresso</div>
      <div style={{ fontSize: 12, color: "var(--cinza)", margin: "6px 0 12px", lineHeight: 1.5 }}>
        Sempre no mesmo lugar, na mesma luz e de manhã. É o registro que mostra mudança
        quando a balança não mostra. As fotos ficam neste aparelho e entram no backup em arquivo.
      </div>
      <input ref={entradaRef} type="file" accept="image/*" style={{ display: "none" }}
        aria-hidden="true" tabIndex={-1}
        onChange={(e) => { const a = e.target.files && e.target.files[0]; e.target.value = ""; if (a) onAdicionar(a); }} />
      <button style={S.btn} onClick={() => entradaRef.current && entradaRef.current.click()}>
        📷 Adicionar foto de hoje
      </button>

      {ordenadas.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 14 }}>
          {ordenadas.map((f) => (
            <button key={f.id} type="button" onClick={() => setAberta(f)}
              aria-label={"Ver a foto de " + new Date(f.data).toLocaleDateString("pt-BR")}
              style={{ padding: 0, border: "1px solid var(--borda2)", borderRadius: 12, overflow: "hidden", background: "var(--input)", cursor: "pointer", aspectRatio: "3/4" }}>
              {urls[f.id]
                ? <img src={urls[f.id]} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
                : <span style={{ fontSize: 11, color: "var(--cinza2)" }}>...</span>}
              <span style={{ display: "block", fontSize: 9, color: "var(--cinza)", padding: "3px 0" }}>
                {new Date(f.data).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit" })}
              </span>
            </button>
          ))}
        </div>
      )}

      {aberta && (
        <div onClick={() => setAberta(null)} role="dialog" aria-modal="true" aria-label="Foto de progresso"
          style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.9)", zIndex: 48, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20, gap: 14 }}>
          {urls[aberta.id] && (
            <img src={urls[aberta.id]} alt={"Foto de " + new Date(aberta.data).toLocaleDateString("pt-BR")}
              style={{ maxWidth: "100%", maxHeight: "72vh", borderRadius: 12 }} />
          )}
          <div style={{ color: "#F2F0EC", fontWeight: 800 }}>
            {new Date(aberta.data).toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" })}
          </div>
          <div style={{ display: "flex", gap: 10 }} onClick={(e) => e.stopPropagation()}>
            <button style={{ ...S.btnGhost, width: "auto", padding: "10px 18px", color: "#FFFFFF", borderColor: "#FFFFFF55" }}
              onClick={() => setAberta(null)}>Fechar</button>
            <button style={{ ...S.btnGhost, width: "auto", padding: "10px 18px", color: "var(--perigo)", borderColor: "var(--perigo-borda)" }}
              onClick={() => pedirConfirmacao("Excluir esta foto? Não há como recuperar.", () => { onExcluir(aberta.id); setAberta(null); })}>
              🗑 Excluir
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function TelaCorpo({ medidas, historico, fotos, onAdicionarFoto, onExcluirFoto, onSalvar, onExcluir, pedirConfirmacao, avisar }) {
  const [form, setForm] = useState({});
  const [campoGrafico, setCampoGrafico] = useState("peso");

  const ordenadas = [...medidas].sort((a, b) => new Date(b.data) - new Date(a.data));
  const ultima = ordenadas[0];

  const salvar = () => {
    const algum = CAMPOS_MEDIDA.some((c) => parseFloat(form[c.id]) > 0);
    if (!algum) { avisar("Preencha pelo menos um campo para registrar a medição."); return; }
    const registro = { id: "md" + Date.now(), data: new Date().toISOString() };
    CAMPOS_MEDIDA.forEach((c) => {
      const v = parseFloat(form[c.id]);
      if (v > 0) registro[c.id] = v;
    });
    onSalvar(registro);
    setForm({});
  };

  const info = CAMPOS_MEDIDA.find((c) => c.id === campoGrafico) || CAMPOS_MEDIDA[0];
  const temAlgum = medidas.some((m) => parseFloat(m[campoGrafico]) > 0);

  return (
    <React.Fragment>
      <div style={{ ...S.card, borderColor: "#8134AF55" }}>
        <div style={S.label}>Nova medição</div>
        <div style={{ fontSize: 12, color: "var(--cinza)", margin: "6px 0 12px", lineHeight: 1.5 }}>
          Preencha só o que quiser acompanhar. Medidas de fita em centímetros, sempre no mesmo ponto e de manhã, para comparar direito.
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {CAMPOS_MEDIDA.map((c) => (
            <div key={c.id}>
              <div style={{ ...S.label, fontSize: 10, marginBottom: 5 }}>{c.nome} ({c.unidade})</div>
              <input type="number" inputMode="decimal" step={c.passo} style={S.inputMini}
                placeholder={ultima && ultima[c.id] ? String(ultima[c.id]) : "—"}
                aria-label={c.nome + " em " + c.unidade}
                value={form[c.id] || ""}
                onChange={(e) => setForm({ ...form, [c.id]: e.target.value })} />
            </div>
          ))}
        </div>
        <button style={{ ...S.btn, marginTop: 16 }} onClick={salvar}>Registrar medição de hoje</button>
      </div>

      {medidas.length > 0 && (
        <div style={S.card}>
          <div style={{ ...S.label, marginBottom: 10 }}>Evolução</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
            {CAMPOS_MEDIDA.filter((c) => medidas.some((m) => parseFloat(m[c.id]) > 0)).map((c) => (
              <button key={c.id} onClick={() => setCampoGrafico(c.id)}
                style={{
                  border: "1px solid", borderColor: campoGrafico === c.id ? "#E1306C" : "var(--borda2)",
                  background: campoGrafico === c.id ? "#E1306C22" : "transparent",
                  color: campoGrafico === c.id ? "#E1306C" : "var(--cinza)",
                  borderRadius: 8, padding: "7px 11px", fontWeight: 800, fontSize: 12, cursor: "pointer",
                }}>
                {c.nome}
              </button>
            ))}
          </div>
          {temAlgum
            ? <GraficoMedida medidas={medidas} campo={campoGrafico} unidade={info.unidade} />
            : <div style={{ fontSize: 13, color: "var(--cinza)" }}>Nenhum registro de {info.nome.toLowerCase()} ainda.</div>}
        </div>
      )}

      {medidas.length > 0 && (
        <div style={S.card}>
          <div style={{ ...S.label, marginBottom: 10 }}>Histórico de medições</div>
          {ordenadas.map((m) => (
            <div key={m.id} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "9px 0", borderBottom: "1px solid var(--borda)" }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 800 }}>
                  {new Date(m.data).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" })}
                </div>
                <div style={{ fontSize: 12, color: "var(--cinza)", marginTop: 2, lineHeight: 1.5 }}>
                  {CAMPOS_MEDIDA.filter((c) => m[c.id]).map((c) => c.nome + " " + fmtNum(m[c.id]) + c.unidade).join(" · ")}
                </div>
              </div>
              <button onClick={() => pedirConfirmacao("Excluir esta medição?", () => onExcluir(m.id))}
                aria-label="Excluir esta medição"
                style={{ background: "none", border: "1px solid var(--perigo-borda)", color: "var(--perigo)", borderRadius: 8, width: 30, height: 30, fontSize: 13, cursor: "pointer", flexShrink: 0 }}>🗑</button>
            </div>
          ))}
        </div>
      )}

      <PainelFotos fotos={fotos} onAdicionar={onAdicionarFoto} onExcluir={onExcluirFoto} pedirConfirmacao={pedirConfirmacao} />

      {medidas.length === 0 && (
        <div style={{ ...S.card, textAlign: "center", color: "var(--cinza)", fontSize: 14, lineHeight: 1.6 }}>
          Registre seu peso e suas medidas de tempo em tempo para ver a evolução ao lado do que você levanta.
        </div>
      )}
    </React.Fragment>
  );
}

  const [ultimoBackup, setUltimoBackup] = useState(null);
  const [editandoHistorico, setEditandoHistorico] = useState(null);
  // Quando a faixa de progresso da tela inicial é tocada, o histórico abre já

  const [secaoHistorico, setSecaoHistorico] = useState("treinos");
  const [festa, setFesta] = useState(null);
  // ---- Jarvis ----
  // "preferido" fica gravado (é a escolha de usar comandos por voz); "ativa" é

  const [voz, setVoz] = useState({ preferido: false, falar: true, barra: 20, vozNome: null, velocidade: 1.1, animado: true, modo: "continuo", botaoFone: false, contarAlto: true });
  const [vozAtiva, setVozAtiva] = useState(false);
  const [vozEstado, setVozEstado] = useState("desligado");
  const noToque = voz.modo === "toque";
  const [vozParcial, setVozParcial] = useState("");
  const [vozUltima, setVozUltima] = useState(null);
  const [descansando, setDescansando] = useState(false);
  const [bpm, setBpm] = useState(null);           // batimento ao vivo
  const [cardioEstado, setCardioEstado] = useState("desligado");
  const cardioRef = useRef(null);
  const resumoCardioRef = useRef(null);
  const [ajudaVoz, setAjudaVoz] = useState(false);
  const [diagVoz, setDiagVoz] = useState(false);
  const [avisoToque, setAvisoToque] = useState(false);
  const [versaoNova, setVersaoNova] = useState(null);
  const acoesVoz = useRef({});
  const acoesEscola = useRef({});
  const ouvinte = useRef(null);
  const tratarFalaRef = useRef(null);

  const somRef = useRef(true);
  // Depois de uma resposta, dá para emendar o próximo comando sem repetir o

  const janelaSeguir = useRef(0);
  const arquivoRef = useRef(null);
  const fotoExRef = useRef(null);
  const [carregado, setCarregado] = useState(false);

  // O monitor é escolhido pela pessoa na janela do navegador; nada é pareado
  // por conta própria. O resumo do treino acumula a partir daí.
  const conectarCardio = useCallback(async () => {
    if (!CARDIO_DISPONIVEL) {
      avisar("Este navegador não fala Bluetooth. No celular, use o Chrome do Android — e o monitor precisa ser de frequência cardíaca padrão (cinta peitoral, por exemplo).");
      return;
    }
    if (!cardioRef.current) {
      cardioRef.current = criarCardio({
        aoBpm: (v) => {
          setBpm(v);
          if (resumoCardioRef.current) resumoCardioRef.current.somar(v);
        },
        aoEstado: (e) => { setCardioEstado(e); if (e !== "ligado") setBpm(null); },
      });
    }
    try {
      if (!resumoCardioRef.current) resumoCardioRef.current = criarResumoCardio();
      const nome = await cardioRef.current.conectar();
      registrarEvento("cardio-conectado");
      setTimeout(() => avisar("Conectado a " + nome + ". O batimento aparece no treino e a média entra no histórico."), 100);
    } catch (e) {
      setCardioEstado("desligado");
      if (e && e.name === "NotFoundError") return;   // a pessoa fechou a lista
      avisar("Não consegui conectar. Confira se o monitor está ligado, perto, e não pareado com outro app.");
    }
  }, []);
  const desconectarCardio = useCallback(() => { if (cardioRef.current) cardioRef.current.desconectar(); }, []);

  const celebrar = useCallback((dados) => setFesta(dados), []);
  const fecharFesta = useCallback(() => setFesta(null), []);

  useEffect(() => {
    try { document.documentElement.setAttribute("data-tema", tema); } catch (e) {}
  }, [tema]);

  const [grupoAberto, setGrupoAberto] = useState(null);
  const [exercicioAberto, setExercicioAberto] = useState(null);
  const [editandoTreino, setEditandoTreino] = useState(null);
  const [baseNovoEx, setBaseNovoEx] = useState(null);   // exercício copiado ao criar variação
  const trocaFotoRef = useRef(null);                    // qual exercício está trocando a foto
  const [sessao, setSessao] = useState(null);
  const [modal, setModal] = useState(null);
  const [copiado, setCopiado] = useState(false);
  const [desfazer, setDesfazer] = useState(null);
  const importRef = useRef("");
  const pedirConfirmacao = (msg, onSim) => setModal({ msg, onSim });
  const avisar = (msg) => setModal({ msg });

  // ---------- JARVIS: ouvir, responder e encaminhar ----------
  const mostrarVoz = useCallback((ouvi, resposta, ok) => {
    setVozParcial("");
    setVozUltima({ ouvi: ouvi || "", resposta: resposta || "", ok: ok !== false, t: Date.now() });
    // Um blip curto e uma vibração: na academia, com fone ou sem, é o jeito de
    // saber que o comando entrou sem esperar a frase inteira ser falada.
    if (ok !== false) {
      if (somRef.current) beep(1046, 0.06, 0.1);
      try { if (navigator.vibrate) navigator.vibrate(35); } catch (e) {}
    }
    if (resposta) jarvisFalar(resposta, vozRef.current);
    // A janela se renova a cada comando aceito. Um "não entendi" não renova,
    // mas também não encurta o que já estava valendo: fechar a janela por causa
    // de uma frase mal ouvida é tirar o chão de quem está no meio de um comando.
    if (ok !== false) janelaSeguir.current = Date.now() + 15000;
  }, []);
  const responderVoz = useCallback((texto, ok) => mostrarVoz("", texto, ok), [mostrarVoz]);
  // A escola fala por conta própria: o retorno dela já está na tela, e abrir a
  // faixa do painel por cima da lição só atrapalharia.
  const falarJarvis = useCallback((texto) => jarvisFalar(texto, vozRef.current), []);

  const ligarVoz = useCallback(() => {
    if (!VOZ_OUVE) {
      avisar("Este navegador não reconhece voz. No celular, abra o app pelo Chrome — é onde o Jarvis funciona melhor.");
      return;
    }
    if (!ouvinte.current) {
      ouvinte.current = criarOuvinte({
        aoParcial: (t) => setVozParcial(t),
        aoFinal: (t, alts) => { if (tratarFalaRef.current) tratarFalaRef.current(t, alts); },
        aoEstado: (e) => {
          setVozEstado(e);
          // No modo toque cada comando é uma sessão: quando ela acaba, o botão
          // volta a ser um convite para falar de novo.
          if (e === "desligado" && ouvinte.current && ouvinte.current.noModoToque()) setVozAtiva(false);
        },
        // O Android encerra a sessão a cada silêncio: religar sem parar faz o
        // aparelho apitar sem descanso e corta as frases longas no meio.
        aoTumulto: () => {
          setVoz((v) => (v.modo === "toque" ? v : { ...v, modo: "toque" }));
          setAvisoToque(true);
        },
        aoErro: (tipo) => {
          setVozAtiva(false);
          avisar(tipo === "permissao"
            ? "Preciso da permissão do microfone para ouvir. Toque no cadeado ao lado do endereço e libere o microfone para este site."
            : "Não consegui abrir o microfone. Confira se outro app não está usando.");
        },
      });
    }
    ouvinte.current.ligar(vozRef.current.modo);
    anotarDiario("", "microfone ligado (" + (vozRef.current.modo === "toque" ? "toque e fale" : "contínuo") + ")");
    setVozAtiva(true);
    setVoz((v) => (v.preferido ? v : { ...v, preferido: true }));
  }, []);

  const desligarVoz = useCallback(() => {
    anotarDiario("", "microfone desligado");
    if (ouvinte.current) ouvinte.current.desligar();
    setVozAtiva(false);
    setVozParcial("");
    setVozUltima(null);
  }, []);

  // Botão do fone: o play/pause do fone passa a acionar o microfone, e o
  // comando sai sem tirar o celular do bolso. Depende de o sistema entregar as
  // teclas de mídia à página, o que só acontece com mídia tocando — daí o áudio
  // em silêncio. Em alguns aparelhos isso pausa a música, e é por isso que a
  // opção vem desligada e diz exatamente o que pode acontecer.
  const vozAtivaRef = useRef(false);
  vozAtivaRef.current = vozAtiva;
  useEffect(() => {
    if (!voz.botaoFone || typeof navigator === "undefined" || !("mediaSession" in navigator)) return;
    const el = document.createElement("audio");
    const url = urlSilencio();
    el.loop = true; el.volume = 0; el.src = url;
    const acionar = () => {
      anotarDiario("", "botão do fone acionado");
      if (!vozAtivaRef.current) ligarVoz();
      else if (ouvinte.current && ouvinte.current.noModoToque()) ligarVoz();
    };
    el.play().then(() => {
      try {
        navigator.mediaSession.playbackState = "playing";
        navigator.mediaSession.setActionHandler("play", acionar);
        navigator.mediaSession.setActionHandler("pause", acionar);
        navigator.mediaSession.setActionHandler("nexttrack", acionar);
      } catch (e) {}
    }).catch(() => {});
    return () => {
      try { el.pause(); el.removeAttribute("src"); el.load(); } catch (e) {}
      try { URL.revokeObjectURL(url); } catch (e) {}
      try {
        navigator.mediaSession.setActionHandler("play", null);
        navigator.mediaSession.setActionHandler("pause", null);
        navigator.mediaSession.setActionHandler("nexttrack", null);
      } catch (e) {}
    };
  }, [voz.botaoFone, ligarVoz]);

  // O navegador encerra o reconhecimento sozinho e nem sempre avisa. Esta
  // conferência periódica é o que mantém o microfone vivo o treino inteiro.
  // Trocar de modo com o microfone ligado só vale depois de reabrir a sessão
  useEffect(() => {
    if (!vozAtiva || !ouvinte.current) return;
    ouvinte.current.desligar();
    const t = setTimeout(() => ouvinte.current && ouvinte.current.ligar(voz.modo), 250);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [voz.modo]);

  useEffect(() => {
    if (!vozAtiva) return;
    const iv = setInterval(() => { if (ouvinte.current) ouvinte.current.conferir(); }, 4000);
    const aoVoltar = () => { if (document.visibilityState === "visible" && ouvinte.current) ouvinte.current.conferir(); };
    document.addEventListener("visibilitychange", aoVoltar);
    return () => { clearInterval(iv); document.removeEventListener("visibilitychange", aoVoltar); };
  }, [vozAtiva]);
  useEffect(() => () => { if (ouvinte.current) ouvinte.current.desligar(); }, []);

  // Confere se há versão nova. O "no-store" e o carimbo de tempo existem porque
  // o GitHub Pages manda max-age=600 e o navegador devolveria a cópia velha.
  useEffect(() => {
    if (!carregado) return;
    let vivo = true;
    const conferir = () => {
      fetch("versao.json?t=" + Date.now(), { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((j) => {
          if (!vivo || !j || !j.versao) return;
          if (j.versao !== VERSAO_APP) setVersaoNova(j.versao);
        })
        .catch(() => {});
    };
    const t = setTimeout(conferir, 2500);
    // e de novo quando o app volta do segundo plano
    const aoVoltar = () => { if (document.visibilityState === "visible") conferir(); };
    document.addEventListener("visibilitychange", aoVoltar);
    return () => { vivo = false; clearTimeout(t); document.removeEventListener("visibilitychange", aoVoltar); };
  }, [carregado]);

  // Limpa o que o navegador guardou e recarrega. É o único caminho confiável:
  // pedir "recarregar" ao usuário não vence um cache de service worker.
  const atualizarApp = useCallback(async () => {
    try {
      const ks = await caches.keys();
      await Promise.all(ks.filter((k) => k !== "treinolivre-config").map((k) => caches.delete(k)));
    } catch (e) {}
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.update().catch(() => {})));
    } catch (e) {}
    try { window.location.replace(window.location.pathname + "?v=" + Date.now()); }
    catch (e) { window.location.reload(); }
  }, []);

  // A faixa do que foi ouvido some sozinha: é um aviso, não um histórico.
  useEffect(() => {
    if (!vozUltima) return;
    const t = setTimeout(() => setVozUltima(null), 9000);
    return () => clearTimeout(t);
  }, [vozUltima]);

  // Fechar com Esc, como em qualquer caixa de diálogo
  useEffect(() => {
    if (!modal) return;
    setCopiado(false);
    const aoTeclar = (e) => { if (e.key === "Escape") setModal(null); };
    window.addEventListener("keydown", aoTeclar);
    return () => window.removeEventListener("keydown", aoTeclar);
  }, [modal]);

  // O navegador avisa quando o app pode ser instalado na tela inicial.

  const [promptInstalar, setPromptInstalar] = useState(null);
  useEffect(() => {
    const aoPoderInstalar = (e) => { e.preventDefault(); setPromptInstalar(e); };
    const aoInstalar = () => { setPromptInstalar(null); registrarEvento("app-instalado"); };
    window.addEventListener("beforeinstallprompt", aoPoderInstalar);
    window.addEventListener("appinstalled", aoInstalar);
    return () => {
      window.removeEventListener("beforeinstallprompt", aoPoderInstalar);
      window.removeEventListener("appinstalled", aoInstalar);
    };
  }, []);
  const instalarApp = async () => {
    if (!promptInstalar) return;
    registrarEvento("instalacao-oferecida");
    promptInstalar.prompt();
    try { await promptInstalar.userChoice; } catch (e) {}
    setPromptInstalar(null);
  };

  const copiarLink = async () => {
    try {
      await navigator.clipboard.writeText(LINK_APP);

    } catch (e) {
      avisar("Link do app: " + LINK_APP);
    }
  };

  const exportarDados = () => {
    // O backup não leva a sessão em andamento de propósito: restaurar num outro

    const dados = JSON.stringify({ treinos, historico, customEx, descanso, som, tema, programas, meta, medidas, lembrete, voz, seedV3: true });
    setModal({
      msg: "Backup dos seus dados. Toque em Copiar e guarde em local seguro (ex.: cole numa conversa sua no WhatsApp). Para restaurar, use Importar dados.",
      texto: dados,
    });
  };

  const importarDados = () => {
    importRef.current = "";
    setModal({
      msg: "Cole abaixo o código do backup e toque em Confirmar. Isso substitui os dados atuais deste aparelho.",
      importar: true,
      onSim: () => {
        try {
          const d = JSON.parse(importRef.current);
          if (!d || (!d.treinos && !d.historico && !d.customEx)) throw new Error("vazio");
          // Decide os programas ANTES de gravar as fichas, para não escrever
          // "treinos" duas vezes seguidas com conteúdos diferentes.
          let fichas = d.treinos || [];
          let pg2 = d.programas || [];
          if (!pg2.length && fichas.length) {
            pg2 = [{ id: "prog-meus", nome: "Meus Treinos" }];
            fichas = fichas.map((t) => ({ ...t, programaId: t.programaId || "prog-meus" }));
          }
          setTreinos(fichas);
          setHistorico(d.historico || []);
          setCustomEx(d.customEx || []);
          setProgramas(pg2);
          if (d.descanso) setDescanso(d.descanso);
          if (d.som !== undefined) setSom(d.som);
          if (d.tema) setTema(d.tema);
          if (d.meta) setMeta(d.meta);
          if (d.medidas) setMedidas(d.medidas);
          if (d.lembrete) setLembrete(d.lembrete);
          if (d.voz) setVoz({ preferido: !!d.voz.preferido, falar: d.voz.falar !== false, barra: d.voz.barra === undefined ? 20 : d.voz.barra,
            vozNome: d.voz.vozNome || null, velocidade: d.voz.velocidade || 1.1, animado: d.voz.animado !== false,
            modo: d.voz.modo === "toque" ? "toque" : "continuo", botaoFone: !!d.voz.botaoFone,
            contarAlto: d.voz.contarAlto !== false });
          setSessao(null);
          setAba("inicio");
          setTimeout(() => avisar("Backup restaurado com sucesso! 💪"), 100);
        } catch (e) {
          setTimeout(() => avisar("Não consegui ler esse código. Confira se copiou o backup completo e tente de novo."), 100);
        }
      },
    });
  };

  TEMA_APP = tema;
  vozRef.current = voz;
  somRef.current = som;
  const todos = useMemo(() => [...EXERCICIOS, ...customEx], [customEx]);
  // Busca por id via índice. Antes era uma varredura da lista inteira, chamada
  // uma vez por série ao montar o histórico — ou seja, lento na proporção do quadrado.
  const indiceEx = useMemo(() => {
    const m = new Map();
    todos.forEach((e) => m.set(e.id, e));
    return m;
  }, [todos]);
  const exPorId = useCallback((id) => indiceEx.get(id), [indiceEx]);

  useEffect(() => {
    let tr = [], hi = [], ce = [], de = 90, so = true, seed = false, pg = null, ss = null, mt = 3;
    let md = [], lb = null, ub = null, ft = [], vz = null;
    try {
      const raw = store.get(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        tr = d.treinos || [];
        hi = d.historico || [];
        ce = d.customEx || [];
        de = d.descanso || 90;
        so = d.som !== undefined ? d.som : true;
        if (d.tema) setTema(d.tema);
        pg = d.programas || null;
        seed = !!d.seedV3;
        if (d.meta) mt = d.meta;
        md = d.medidas || [];
        ft = d.fotos || [];
        if (d.lembrete) lb = d.lembrete;
        ub = d.ultimoBackup || null;
        if (d.voz) vz = d.voz;
        // Retoma o treino que ficou pela metade (app fechado, página recarregada,
        // bateria acabou). Passadas 12 horas presumimos que aquele treino não volta.
        if (d.sessao && d.sessao.inicio && Date.now() - d.sessao.inicio < 12 * 3600000) {
          ss = d.sessao;
        }
      }
    } catch (e) {}
    // Insere/atualiza as fichas padrão (rotina semanal) uma única vez por versão
    if (!seed) {
      tr = tr.filter((t) => String(t.id).indexOf("padrao-") !== 0);
      tr = [...FICHAS_PADRAO, ...tr];
    }
    // ---- Organização: "treinos" (programas) agrupam as fichas ----
    if (!pg) pg = [];
    if (tr.some((t) => String(t.id).indexOf("padrao-") === 0) && !pg.some((p) => p.id === "prog-avancado")) {
      pg.unshift({ id: "prog-avancado", nome: "Treino Avançado" });
    }
    tr = tr.map((t) => {
      if (t.programaId && pg.some((p) => p.id === t.programaId)) return t;
      if (String(t.id).indexOf("padrao-") === 0) return { ...t, programaId: "prog-avancado" };
      return { ...t, programaId: "prog-meus" };
    });
    if (tr.some((t) => t.programaId === "prog-meus") && !pg.some((p) => p.id === "prog-meus")) {
      pg.push({ id: "prog-meus", nome: "Meus Treinos" });
    }

    setTreinos(tr); setHistorico(hi); setCustomEx(ce); setDescanso(de); setSom(so); setProgramas(pg); setMeta(mt);
    setMedidas(md); setFotos(ft); setUltimoBackup(ub);
    if (lb) setLembrete({ ativo: !!lb.ativo, hora: lb.hora || "18:00", dias: Array.isArray(lb.dias) ? lb.dias : [1, 2, 3, 4, 5] });
    if (vz) setVoz({ preferido: !!vz.preferido, falar: vz.falar !== false, barra: vz.barra === undefined ? 20 : vz.barra,
      vozNome: vz.vozNome || null, velocidade: vz.velocidade || 1.1, animado: vz.animado !== false,
      modo: vz.modo === "toque" ? "toque" : "continuo", botaoFone: !!vz.botaoFone, contarAlto: vz.contarAlto !== false });
    if (ss) { setSessao(ss); setAba("sessao"); }
    // Recarregou no meio do treino (ou o sistema descarregou o app): quem já
    // escolheu treinar por voz volta ouvindo. A permissão do microfone já foi
    // dada antes para este site, então não há caixa nova de permissão aqui.
    if (ss && vz && vz.preferido) setTimeout(() => ligarVoz(), 500);
    setCarregado(true);

    // Se o app foi aberto por um link compartilhado (ficha, treino completo ou desafio)
    try {
      const hash = window.location.hash || "";
      const mF = hash.match(/#ficha=([^&]+)/);
      const mP = hash.match(/#prog=([^&]+)/);
      const mD = hash.match(/#desafio=([^&]+)/);
      const mA = hash.match(/#atalho=([a-z]+)/);
      if (mF || mP || mD || mA) {
        try { window.history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e2) {}
      }
      // Atalhos do ícone do app na tela inicial (definidos no manifest.json)
      if (mA && !ss) {
        if (mA[1] === "historico") setAba("historico");
        else if (mA[1] === "livre") setTimeout(() => iniciarTreinoLivre(), 0);
      }
      if (mF) {
        const p = JSON.parse(b64Decodificar(mF[1]));
        if (p && p.n && p.i && p.i.length) {
          setModal({
            msg: 'Você recebeu a ficha de treino "' + p.n + '" com ' + p.i.length + " exercícios. Deseja adicionar às suas fichas?",
            positivo: true,
            onSim: () => aceitarFichaRecebida(p),
          });
        }
      } else if (mP) {
        const p = JSON.parse(b64Decodificar(mP[1]));
        if (p && p.pn && p.fs && p.fs.length) {
          setModal({
            msg: 'Você recebeu o treino completo "' + p.pn + '" com ' + p.fs.length + " ficha(s). Deseja adicionar aos seus treinos?",
            positivo: true,
            onSim: () => aceitarProgramaRecebido(p),
          });
        }
      } else if (mD) {
        const p = JSON.parse(b64Decodificar(mD[1]));
        if (p && p.nm) {
          const eu = calcularEstatisticas(hi);
          const naFrente = eu.total > (p.t || 0) || (eu.total === (p.t || 0) && eu.streak >= (p.s || 0));
          setModal({
            msg: "⚔️ " + p.nm + " te desafiou!\n\n" +
              p.nm + ": " + (p.t || 0) + " treinos · " + (p.s || 0) + " dia(s) seguidos · " + Math.round((p.v || 0) / 1000) + "t movidas\n" +
              "Você: " + eu.total + " treinos · " + eu.streak + " dia(s) seguidos · " + Math.round(eu.volumeTotal / 1000) + "t movidas\n\n" +
              (naFrente ? "Você está na frente! 🏆 Não deixa a vantagem cair." : "Bora virar esse jogo! 🔥 Escolhe uma ficha e treina hoje."),
          });
        }
      }
    } catch (e) {}
  }, []);

  // Gravação com um respiro de 400ms: durante o treino cada tecla digitada muda o
  // estado, e escrever o histórico inteiro a cada tecla trava o aparelho.
  const dadosRef = useRef("");
  useEffect(() => {
    if (!carregado) return;
    dadosRef.current = JSON.stringify({ treinos, historico, customEx, descanso, som, tema, programas, sessao, meta, medidas, fotos, lembrete, ultimoBackup, voz, seedV3: true });
    const t = setTimeout(() => store.set(STORAGE_KEY, dadosRef.current), 400);
    return () => clearTimeout(t);
  }, [treinos, historico, customEx, descanso, som, tema, programas, sessao, meta, medidas, fotos, lembrete, ultimoBackup, voz, carregado]);

  // Fechou o app ou trocou de aba no meio do treino? Grava na hora, sem esperar o respiro.
  useEffect(() => {
    const gravarJa = () => { if (dadosRef.current) store.set(STORAGE_KEY, dadosRef.current); };
    const aoEsconder = () => { if (document.visibilityState === "hidden") gravarJa(); };
    document.addEventListener("visibilitychange", aoEsconder);
    window.addEventListener("pagehide", gravarJa);
    return () => {
      document.removeEventListener("visibilitychange", aoEsconder);
      window.removeEventListener("pagehide", gravarJa);
    };
  }, []);

  // Mantém a configuração do lembrete onde o service worker consegue ler, e pede
  // ao sistema a verificação periódica (só o Android com o app instalado atende).
  useEffect(() => {
    if (!carregado) return;
    const ultimoTreino = historico.length
      ? [...historico].sort((a, b) => new Date(b.data) - new Date(a.data))[0].data
      : null;
    guardarConfigLembrete({ ...lembrete, ultimoTreino });
    if ("serviceWorker" in navigator) pedirVerificacaoPeriodica(lembrete.ativo);
  }, [carregado, lembrete, historico]);

  // Aviso enquanto o app está aberto: confere de meio em meio minuto se chegou a
  // hora, se hoje é dia e se o treino ainda não aconteceu.
  useEffect(() => {
    if (!carregado || !lembrete.ativo) return;
    const conferir = () => {
      const agora = new Date();
      if (!lembrete.dias.includes(agora.getDay())) return;
      const partes = String(lembrete.hora || "18:00").split(":");
      const alvo = new Date();
      alvo.setHours(parseInt(partes[0]) || 18, parseInt(partes[1]) || 0, 0, 0);
      if (agora < alvo) return;
      const chave = "treinolivre:lembrou:" + diaStr(agora);
      if (store.get(chave)) return;
      if (historico.some((x) => diaStr(x.data) === diaStr(agora))) return;
      store.set(chave, "1");
      const texto = "Seus músculos já descansaram. Escolhe uma ficha e vamos. 💪";
      try {
        if (typeof Notification !== "undefined" && Notification.permission === "granted") {
          new Notification("Hora do treino!", { body: texto, icon: "icon-192.png", badge: "icon-192.png", tag: "treino-livre-lembrete" });
          return;
        }
      } catch (e) {}
      avisar("🔔 Hora do treino!\n\n" + texto);
    };
    conferir();
    const iv = setInterval(conferir, 30000);
    return () => clearInterval(iv);
  }, [carregado, lembrete, historico]);

  const comecarSessao = (treino) => {
    setSessao({
      treinoId: treino.id,
      nome: treino.nome,
      inicio: Date.now(),
      itens: treino.itens.map((it) => {
        // A carga já vem preenchida com a da última vez, e sobe sozinha quando
        // todas as séries fecharam as repetições combinadas. É a sobrecarga
        // progressiva acontecendo sem ninguém precisar consultar o histórico.
        const sug = sugerirCarga(historico, it.exercicioId, it.reps);
        const ex = exPorId(it.exercicioId);
        return {
          uid: novoUid(),
          exercicioId: it.exercicioId,
          obs: it.obs || "",
          conjunto: it.conjunto || null,   // bi-set/tri-set definido na ficha
          descanso: it.descanso || null,   // descanso próprio deste exercício
          sugerido: sug || null,
          series: montarSeries(ex, it.series, it.reps, sug),
        };
      }),
    });
    setAba("sessao");
    // Quem já usou o Jarvis não quer ligar o microfone a cada treino. O toque em
    // "Treinar" é o gesto que o navegador exige para abrir o microfone.
    if (vozRef.current.preferido && !vozAtiva) ligarVoz();
  };

  const iniciarSessao = (treino) => {
    if (!treino.itens.length) { avisar("Esta ficha ainda não tem exercícios. Edite a ficha primeiro."); return; }
    if (sessao && sessao.treinoId === treino.id) { setAba("sessao"); return; }
    if (sessao) {
      pedirConfirmacao("Você já tem um treino em andamento (" + sessao.nome + "). Começar outro vai descartá-lo. Continuar?", () => comecarSessao(treino));
      return;
    }
    comecarSessao(treino);
  };

  const iniciarTreinoLivre = () => {
    const comecar = () => {
      const hoje = new Date().toLocaleDateString("pt-BR", { weekday: "long" });
      setSessao({
        treinoId: "livre-" + Date.now(),
        nome: "Treino livre (" + hoje + ")",
        inicio: Date.now(),
        itens: [],
      });
      setAba("sessao");
      registrarEvento("treino-livre-iniciado");
      if (vozRef.current.preferido && !vozAtiva) ligarVoz();
    };
    if (sessao) {
      pedirConfirmacao("Você já tem um treino em andamento (" + sessao.nome + "). Começar um treino livre vai descartá-lo. Continuar?", comecar);
      return;
    }
    comecar();
  };

  // Cada frase ouvida passa por aqui: nome do assistente, interpretação e
  // encaminhamento. Fica depois de iniciarSessao de propósito — comandos de
  // voz podem começar um treino.
  const tratarFala = (bruto, alternativas) => {
    // Sem isto, qualquer exceção no caminho deixa o Jarvis mudo sem explicação,
    // e quem está na academia não tem como saber se o microfone morreu.
    try { tratarFalaInterno(bruto, alternativas); }
    catch (e) { anotarDiario(bruto, "ERRO: " + (e && e.message)); mostrarVoz(bruto, "Tive um problema para processar isso. Pode repetir?", false); }
  };
  const tratarFalaInterno = (bruto, alternativas) => {
    const norm = normalizarFala(bruto);
    if (!norm) return;
    // Na escola tudo é exercício de laboratório: a frase chega inteira, com ou
    // sem o nome dele, e nada é gravado em treino nenhum.
    if (aba === "escolaVoz" && acoesEscola.current.receber) {
      const d0 = depoisDeJarvis(norm);
      anotarDiario(bruto, "escola: avaliando a lição");
      acoesEscola.current.receber(bruto, d0 === null ? norm : d0, d0 !== null);
      return;
    }

    const naSessao = !!(sessao && acoesVoz.current && acoesVoz.current.vivo);
    const ctxVoz = { descansando: descansando, naSessao: naSessao };

    // Com música alta e ferro batendo, a transcrição certa raramente é a
    // primeira. O reconhecedor manda até cinco palpites e, até aqui, quatro
    // iam para o lixo. Vale mais o palpite que vira comando COM o nome dele.
    const palpites = [norm];
    (alternativas || []).slice(1).forEach((a) => {
      const n = normalizarFala(a);
      if (n && palpites.indexOf(n) < 0) palpites.push(n);
    });
    let depois = depoisDeJarvis(norm);
    let corpo = depois === null ? norm : depois;
    let c = corpo ? interpretarVoz(corpo, ctxVoz) : null;
    let ouvido = bruto;
    if (!(c && depois !== null)) {
      for (let k = 1; k < palpites.length; k++) {
        const d = depoisDeJarvis(palpites[k]);
        const corpoK = d === null ? palpites[k] : d;
        const cK = corpoK ? interpretarVoz(corpoK, ctxVoz) : null;
        if (!cK) continue;
        const melhor = !c || (d !== null && depois === null);
        if (!melhor) continue;
        c = cK; depois = d; corpo = corpoK; ouvido = (alternativas || [])[k] || palpites[k];
        anotarDiario(ouvido, "entendido por outra alternativa do microfone");
        if (depois !== null) break;
      }
    }
    const comNome = depois !== null;
    const naJanela = Date.now() <= janelaSeguir.current;

    // Só o nome, sem comando. Ele fica de orelha em pé, mas CALADO: se
    // respondesse falando, a pergunta que vem logo em seguida cairia dentro da
    // janela em que o microfone ignora a própria voz dele — e sumiria.
    if (!c && comNome && !corpo) {
      anotarDiario(bruto, "só o nome — janela aberta por 25s");
      setVozParcial("");
      setVozUltima({ ouvi: bruto, resposta: "Estou ouvindo. Pode perguntar.", ok: true, t: Date.now() });
      janelaSeguir.current = Date.now() + 25000;
      return;
    }

    if (!c) {
      // Sem o nome dele, frase que não é comando é conversa de academia:
      // fecha a janela e fica quieto, em vez de responder a quem não falou com ele.
      // A janela NÃO se fecha aqui. Era o que matava o comando seguinte: o
      // primeiro pedaço da frase ("anota", "anota aí") não é comando, fechava a
      // janela, e a frase completa chegava depois, já trancada do lado de fora.
      if (!comNome) { anotarDiario(bruto, "sem o nome e não é comando — ignorado (conversa)"); return; }
      anotarDiario(bruto, "nome reconhecido, mas não virou comando");
      mostrarVoz(bruto, "Não entendi. Toque no ? do microfone para ver o que dá para falar.", false);
      return;
    }
    // Fora da janela e sem o nome, só pergunta passa (ver PERGUNTA_SEGURA)
    if (!comNome && !naJanela && !PERGUNTA_SEGURA[c.tipo]) {
      anotarDiario(bruto, "“" + (ROTULO_TIPO[c.tipo] || c.tipo) + "” precisa do nome dele — ignorado");
      return;
    }
    // A observação é texto para ler depois: precisa dos acentos e das maiúsculas
    // que a normalização tirou.
    c.cru = ouvido;
    anotarDiario(ouvido, "entendido: " + (ROTULO_TIPO[c.tipo] || c.tipo) + (comNome ? " (com o nome)" : " (sem o nome)"));
    registrarEvento("jarvis-comando");

    if (c.tipo === "ajuda") {
      // Quem pergunta no meio do treino está com o celular no bolso: a resposta
      // principal é falada, e a lista na tela é o complemento.
      if (!c.assunto) setAjudaVoz(true);
      mostrarVoz(bruto, AJUDA_FALADA[c.assunto || "geral"] || AJUDA_FALADA.geral, true);
      return;
    }
    if (c.tipo === "escola") {
      setAjudaVoz(false);
      setAba("escolaVoz");
      mostrarVoz(bruto, "Vamos praticar. Eu mostro a frase, você repete, e eu digo o que entendi. Nada é anotado aqui.", true);
      return;
    }
    if (c.tipo === "mudo") { setVoz((v) => ({ ...v, falar: false })); mostrarVoz(bruto, "Certo, respondo só na tela.", true); return; }
    if (c.tipo === "desligar") {
      mostrarVoz(bruto, "Até logo.", true);
      setTimeout(desligarVoz, 1600);
      return;
    }
    if (c.tipo === "boraTreinar") {
      // Aceitar a sugestão do dia sem repetir o nome da ficha. Se já houver
      // treino em andamento, "bora" é só voltar para ele.
      if (sessao) {
        setAba("sessao");
        mostrarVoz(bruto, "Voltando para " + sessao.nome + ".", true);
        return;
      }
      const sug = responderConsulta({ tipo: "sugestaoHoje" }, {
        historico: historico, todos: todos, exPorId: exPorId,
        treinos: treinos, medidas: medidas, meta: meta,
      });
      const rec = recuperacaoMuscular(historico, exPorId);
      const prontos = rec.filter((g) => g.estado === "pronto").slice(0, 2);
      const alvoG = prontos.length ? prontos : rec.slice(0, 2);
      let melhorF = null, melhorP = 0;
      treinos.forEach((t) => {
        if (!t.itens || !t.itens.length) return;
        let p = 0;
        t.itens.forEach((it) => {
          const e = exPorId(it.exercicioId);
          if (e && alvoG.some((g) => g.id === e.grupo)) p++;
        });
        if (p > melhorP) { melhorP = p; melhorF = t; }
      });
      if (!melhorF) {
        iniciarTreinoLivre();
        mostrarVoz(bruto, "Não achei ficha para hoje. Comecei um treino livre.", true);
        return;
      }
      iniciarSessao(melhorF);
      mostrarVoz(bruto, "Bora! " + melhorF.nome + ". " + (sug ? sug.fala.split(". ")[0] + "." : ""), true);
      return;
    }
    if (c.tipo === "iniciarTreino") {
      const pedido = (c.nome || "").trim();
      if (/\blivre\b/.test(pedido) || (!pedido && !treinos.length)) {
        iniciarTreinoLivre();
        mostrarVoz(bruto, "Treino livre começando. Vá ditando os exercícios.", true);
        return;
      }
      const fichas = treinos.filter((t) => t.itens && t.itens.length);
      if (!fichas.length) { mostrarVoz(bruto, "Você ainda não tem ficha com exercícios. Diga: Jarvis, treino livre.", false); return; }
      let escolhida = null;
      if (pedido) {
        const alvoN = semAcento(pedido);
        escolhida = fichas.find((t) => semAcento(t.nome) === alvoN) ||
          fichas.find((t) => semAcento(t.nome).indexOf(alvoN) >= 0) ||
          fichas.find((t) => alvoN.indexOf(semAcento(t.nome)) >= 0) ||
          (alvoN.length === 1 ? fichas.find((t) => new RegExp("\\b" + alvoN + "\\b").test(semAcento(t.nome))) : null);
      }
      if (!escolhida) {
        mostrarVoz(bruto, "Qual ficha? Você tem: " + fichas.slice(0, 4).map((t) => t.nome).join(", ") + ".", false);
        setAba("treinos");
        return;
      }
      iniciarSessao(escolhida);
      mostrarVoz(bruto, "Começando " + escolhida.nome + ". Pode ditar as séries.", true);
      return;
    }

    if (naSessao) {
      if (aba !== "sessao") setAba("sessao");
      const r = acoesVoz.current.executar(c);
      if (r) { mostrarVoz(bruto, r.fala, r.ok); return; }
      // o que a sessão não resolve pode ser uma pergunta sobre o histórico
    }

    // Perguntar "qual meu recorde no supino" ou "o que eu treino hoje" não
    // devia exigir um treino aberto — são perguntas sobre o que já aconteceu.
    const resposta = responderConsulta(c, {
      historico: historico, todos: todos, exPorId: exPorId,
      treinos: treinos, medidas: medidas, meta: meta,
    });
    if (resposta) { anotarDiario("", "respondi: " + resposta.fala.slice(0, 70)); mostrarVoz(bruto, resposta.fala, resposta.ok); return; }

    const primeira = treinos.find((t) => t.itens && t.itens.length);
    mostrarVoz(bruto, "Para isso preciso de um treino em andamento. Diga: Jarvis, começa o treino " +
      (primeira ? primeira.nome : "livre") + ".", false);
  };
  tratarFalaRef.current = tratarFala;

  const finalizarSessao = () => {
    const feitas = sessao.itens.reduce((a, it) => a + it.series.filter((s) => s.feito).length, 0);
    if (!feitas) {
      avisar("Marque pelo menos uma série com ✓ antes de finalizar o treino.");
      return;
    }
    const registro = {
      id: String(Date.now()),
      nome: sessao.nome,
      data: new Date().toISOString(),
      // O relógio conta desde o início da sessão; o teto de 5h evita que um treino
      // esquecido aberto vire "480 min" e distorça as médias.
      duracaoMin: Math.max(1, Math.min(300, Math.round((Date.now() - sessao.inicio) / 60000))),
      itens: sessao.itens.map((it) => ({
        exercicioId: it.exercicioId,
        obs: it.obs || "",
        // preserva o formato: isometria grava segundos, e o aquecimento fica
        // marcado para continuar fora do volume e dos recordes no histórico
        series: it.series.filter((s) => s.feito).map((s) => {
          const nova = ehTempo(s) ? { segundos: s.segundos } : { peso: s.peso, reps: s.reps };
          if (ehAquecimento(s)) nova.aquec = true;
          return nova;
        }),
      })).filter((it) => it.series.length > 0),
    };
    // O batimento do treino entra no registro. Um número por treino diz mais do
    // que o gráfico minuto a minuto que ninguém abre depois.
    const resumoBpm = resumoCardioRef.current ? resumoCardioRef.current.fechar() : null;
    if (resumoBpm) registro.bpm = resumoBpm;
    resumoCardioRef.current = criarResumoCardio();
    setHistorico([registro, ...historico]);
    // Salva as observações de volta na ficha (altura do banco, polia etc. ficam guardadas).
    // Casa pelo exercício, e não pela posição: dá para adicionar e remover exercícios
    // durante o treino, o que desalinharia os índices e gravaria a obs no lugar errado.
    const obsPorEx = {}, descansoPorEx = {};
    sessao.itens.forEach((it) => {
      obsPorEx[it.exercicioId] = it.obs || "";
      if (it.descanso) descansoPorEx[it.exercicioId] = it.descanso;
    });
    setTreinos(treinos.map((t) => {
      if (t.id !== sessao.treinoId) return t;
      return {
        ...t,
        itens: t.itens.map((it) => {
          if (!Object.prototype.hasOwnProperty.call(obsPorEx, it.exercicioId)) return it;
          const novo = { ...it, obs: obsPorEx[it.exercicioId] };
          // o descanso ajustado durante o treino fica valendo para as próximas vezes
          if (descansoPorEx[it.exercicioId]) novo.descanso = descansoPorEx[it.exercicioId];
          return novo;
        }),
      };
    }));
    setSessao(null);
    setAba("historico");
    const st = statsTreino(registro);
    const nRec = contarRecordesNovos(historico, registro);
    const comp = compararAnterior([registro, ...historico], registro);
    registrarEvento("treino-concluido");
    let msg = "Treino concluído! 🎉\n\n";
    if (st.volume > 0) msg += "🏋️ " + fmtKg(st.volume) + " de volume total\n";
    msg += st.series + " " + plural(st.series, "série", "séries") + " · " + st.reps + " " + plural(st.reps, "repetição", "repetições") + " · " + st.exercicios + " " + plural(st.exercicios, "exercício", "exercícios") + "\n";
    if (st.segundos > 0) msg += "⏳ " + st.segundos + "s de isometria\n";
    if (st.seriesAquec > 0) msg += "(mais " + st.seriesAquec + " " + plural(st.seriesAquec, "série", "séries") + " de aquecimento, fora da conta)\n";
    msg += "⏱ " + registro.duracaoMin + " min";
    if (st.densidade > 0) msg += " · " + st.densidade + " kg/min · carga máx. " + st.cargaMax + " kg";
    if (comp) msg += "\n" + (comp.pct >= 0 ? "▲ +" : "▼ ") + comp.pct + "% de volume vs. o treino anterior";
    if (nRec > 0) msg += "\n🏆 " + nRec + " " + plural(nRec, "recorde pessoal batido", "recordes pessoais batidos") + "!";
    // Conquistas destravadas por este treino (antes só apareciam caladas na tela inicial)
    const antes = calcularEstatisticas(historico);
    const depois = calcularEstatisticas([registro, ...historico]);
    const novas = CONQUISTAS.filter((c) => c.cond(depois) && !c.cond(antes));
    if (novas.length) {
      msg += "\n\n🎖 " + plural(novas.length, "Nova conquista", "Novas conquistas") + ": " +
        novas.map((c) => c.icone + " " + c.nome).join(", ");
    }
    // O resumo na tela exige parar e ler. Falado, chega enquanto a pessoa guarda
    // a anilha — e é o momento em que o número do volume significa alguma coisa.
    if (vozAtiva) {
      let dito = "Treino fechado. " + st.series + " " + plural(st.series, "série", "séries") +
        " em " + registro.duracaoMin + " " + plural(registro.duracaoMin, "minuto", "minutos") + ". ";
      if (st.volume > 0) dito += fmtPeso(st.volume) + " movidos. ";
      if (comp) dito += (comp.pct >= 0 ? "Mais " : "Menos ") + Math.abs(comp.pct) + " por cento de volume que o treino anterior. ";
      if (nRec > 0) dito += nRec + " " + plural(nRec, "recorde pessoal", "recordes pessoais") + "! ";
      if (novas.length) dito += plural(novas.length, "Nova conquista", "Novas conquistas") + ": " + novas.map((x) => x.nome).join(", ") + ". ";
      setTimeout(() => responderVoz(dito, true), 600);
    }

    const abrirResumo = () => setModal({
      msg: msg,
      storyTreino: {
        nome: registro.nome, series: st.series, reps: st.reps, volume: st.volume,
        duracao: registro.duracaoMin, densidade: st.densidade, cargaMax: st.cargaMax, recordes: nRec,
      },
    });

    // Subir de nível merece o palco só para ele: o resumo entra depois da festa.
    const nvAntes = nivelDe(antes), nvDepois = nivelDe(depois);
    if (nvDepois.indice > nvAntes.indice) {
      registrarEvento("subiu-de-nivel");
      celebrar({
        icone: nvDepois.icone,
        titulo: "Você subiu de nível",
        destaque: "Nível " + nvDepois.indice + "\n" + nvDepois.nome,
        detalhe: nvDepois.proximo
          ? "Próxima parada: " + nvDepois.proximo.icone + " " + nvDepois.proximo.nome
          : "Você chegou ao topo da tabela. 👑",
      });
      setTimeout(abrirResumo, 3600);
    } else {
      setTimeout(abrirResumo, 250);
    }
  };

  // ---- backup em arquivo: um toque, e o arquivo vai para o Downloads ----
  const baixarBackup = async () => {
    // As fotos vão dentro do arquivo: um backup que não leva tudo é uma armadilha.
    // Isso engorda o arquivo, e é por isso que o texto copiável não as inclui.
    const fotosDados = {};
    for (const f of fotos) {
      try {
        const blob = await lerFoto(f.id);
        if (blob) fotosDados[f.id] = await blobParaBase64(blob);
      } catch (e) {}
    }
    // As fotos dos aparelhos vão junto: é o dado que não existe em catálogo
    // nenhum, e trocar de celular sem elas apagaria o álbum da academia.
    const fotosEx = {};
    for (const e of customEx) {
      if (!e.foto) continue;
      try {
        const blob = await lerFoto(chaveFotoEx(e.id));
        if (blob) fotosEx[e.id] = await blobParaBase64(blob);
      } catch (err) {}
    }
    const dados = JSON.stringify({ treinos, historico, customEx, descanso, som, tema, programas, meta, medidas, fotos, fotosDados, fotosEx, lembrete, voz, seedV3: true });
    try {
      const blob = new Blob([dados], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "treino-livre-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      setUltimoBackup(Date.now());
      registrarEvento("backup-baixado");
      const nFotos = Object.keys(fotosDados).length + Object.keys(fotosEx).length;
      avisar("Backup salvo nos seus downloads" + (nFotos ? ", com " + nFotos + " " + plural(nFotos, "foto", "fotos") : "") +
        ". Guarde no Google Drive ou envie para você mesmo — é a sua garantia se perder o aparelho.");
    } catch (e) {
      avisar("Não consegui gerar o arquivo neste navegador. Use \"Copiar texto\" e guarde o código.");
    }
  };

  const restaurarDeArquivo = () => { if (arquivoRef.current) arquivoRef.current.click(); };
  const aoEscolherArquivo = (ev) => {
    const arq = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!arq) return;
    const leitor = new FileReader();
    leitor.onload = () => {
      try {
        const d = JSON.parse(String(leitor.result));
        if (!d || (!d.treinos && !d.historico && !d.customEx)) throw new Error("vazio");
        pedirConfirmacao(
          "Restaurar o backup de " + arq.name + "?\n\n" +
            (d.historico || []).length + " treinos no histórico e " + (d.treinos || []).length + " fichas.\n" +
            "Isso substitui os dados atuais deste aparelho.",
          () => {
            let fichas = d.treinos || [];
            let pg2 = d.programas || [];
            if (!pg2.length && fichas.length) {
              pg2 = [{ id: "prog-meus", nome: "Meus Treinos" }];
              fichas = fichas.map((t) => ({ ...t, programaId: t.programaId || "prog-meus" }));
            }
            setTreinos(fichas);
            setHistorico(d.historico || []);
            setCustomEx(d.customEx || []);
            setProgramas(pg2);
            setMedidas(d.medidas || []);
            // repõe as imagens no IndexedDB antes de anunciar a lista
            (async () => {
              const dados = d.fotosDados || {};
              const ok = [];
              for (const f of (d.fotos || [])) {
                if (!dados[f.id]) continue;
                try { await guardarFoto(f.id, base64ParaBlob(dados[f.id])); ok.push(f); } catch (e) {}
              }
              setFotos(ok);
              // E as fotos dos aparelhos. O cache é esvaziado junto, senão a tela
              // continuaria mostrando o que havia antes da restauração.
              const fx = d.fotosEx || {};
              for (const id of Object.keys(fx)) {
                try { await guardarFotoEx(id, base64ParaBlob(fx[id])); esquecerFotoEx(id); } catch (e) {}
              }
            })();
            if (d.descanso) setDescanso(d.descanso);
            if (d.som !== undefined) setSom(d.som);
            if (d.tema) setTema(d.tema);
            if (d.meta) setMeta(d.meta);
            if (d.lembrete) setLembrete(d.lembrete);
            if (d.voz) setVoz({ preferido: !!d.voz.preferido, falar: d.voz.falar !== false, barra: d.voz.barra === undefined ? 20 : d.voz.barra,
              vozNome: d.voz.vozNome || null, velocidade: d.voz.velocidade || 1.1, animado: d.voz.animado !== false,
              modo: d.voz.modo === "toque" ? "toque" : "continuo", botaoFone: !!d.voz.botaoFone,
              contarAlto: d.voz.contarAlto !== false });
            setSessao(null);
            setAba("inicio");
            setTimeout(() => avisar("Backup restaurado com sucesso! 💪"), 120);
          }
        );
      } catch (e) {
        avisar("Não consegui ler esse arquivo. Escolha o .json que o próprio app gerou.");
      }
    };
    leitor.onerror = () => avisar("Não consegui abrir o arquivo.");
    leitor.readAsText(arq);
  };

  // Aviso de backup pendente: aparece quando há o que perder e faz tempo que não se salva.
  // Última pesagem registrada, para a estimativa de calorias do scanner.
  // Sem medida, o cálculo usa 75 kg e o número é claramente uma estimativa.
  const pesoCorporal = useMemo(() => {
    const comPeso = [...medidas].filter((m) => m.peso).sort((a, b) => new Date(b.data) - new Date(a.data));
    return comPeso.length ? parseFloat(comPeso[0].peso) : null;
  }, [medidas]);

  const avisoBackup = useMemo(() => {
    if (historico.length < 5) return null;
    const dias = ultimoBackup ? Math.floor((Date.now() - ultimoBackup) / 86400000) : null;
    if (dias === null) {
      return "Você já tem " + historico.length + " treinos registrados e nenhum backup. Se limpar os dados do navegador ou trocar de celular, tudo isso se perde.";
    }
    if (dias >= 30) {
      return "Seu último backup foi há " + dias + " dias. Vale baixar um novo para não perder o que veio depois.";
    }
    return null;
  }, [historico.length, ultimoBackup]);

  // ---- medidas do corpo ----
  const salvarMedida = (reg) => {
    setMedidas((prev) => [...prev, reg]);
    registrarEvento("medida-registrada");
    setTimeout(() => avisar("Medição registrada! Repita a cada 2 ou 4 semanas para a linha ficar útil."), 120);
  };
  const excluirMedida = (id) => setMedidas((prev) => prev.filter((m) => m.id !== id));

  // ---- fotos de progresso ----
  const adicionarFoto = async (arquivo) => {
    try {
      const blob = await reduzirImagem(arquivo, 1080);

    } catch (e) {

  };
  const excluirFoto = async (id) => {

    setFotos((prev) => prev.filter((f) => f.id !== id));
  };

  // ---- correcao de um treino do historico ----
  const salvarHistoricoEditado = (reg) => {

    setEditandoHistorico(null);

  // Excluir do histórico agora dá alguns segundos de arrependimento antes de sumir de vez
  const excluirHistorico = (id) => {
    const indice = historico.findIndex((h) => h.id === id);
    if (indice < 0) return;
    setDesfazer({ registro: historico[indice], indice });
    setHistorico(historico.filter((h) => h.id !== id));

  const restaurarExcluido = () => {
    if (!desfazer) return;
    setHistorico((prev) => {
      const copia = [...prev];
      copia.splice(Math.min(desfazer.indice, copia.length), 0, desfazer.registro);

    });

  useEffect(() => {
    if (!desfazer) return;

  // ---- Programas (treinos que agrupam fichas) ----
  const criarPrograma = () => {
    importRef.current = "";
    setModal({ msg: "Nome do novo treino (ex.: Treino Iniciante, Projeto Verão):", prompt: "Nome do treino", positivo: true, labelSim: "Criar", onSim: () => {
      const nome = (importRef.current || "").trim();

      const pid = "prog-" + Date.now();
      setProgramas((prev) => [...prev, { id: pid, nome: nome }]);

      setAba("treinos");
    } });
  };
  const renomearPrograma = (p) => {
    importRef.current = p.nome;
    setModal({ msg: "Novo nome do treino:", prompt: "Nome do treino", valor: p.nome, positivo: true, labelSim: "Salvar", onSim: () => {
      const nome = (importRef.current || "").trim() || p.nome;
      setProgramas((prev) => prev.map((x) => (x.id === p.id ? { ...x, nome: nome } : x)));
    } });
  };
  const excluirPrograma = (p) => {
    const qtd = treinos.filter((t) => t.programaId === p.id).length;
    pedirConfirmacao('Excluir o treino "' + p.nome + '"' + (qtd ? " e suas " + qtd + " ficha(s)?" : "?"), () => {
      setProgramas((prev) => prev.filter((x) => x.id !== p.id));
      setTreinos((prev) => prev.filter((t) => t.programaId !== p.id));
      setProgAberto(null);
    });
  };
  // Duplicar existe porque a necessidade real é "variar um treino que já funciona",
   // e refazer a ficha do zero para isso é trabalho perdido.
  const clonarItens = (itens) => {
    // os ids de conjunto são regerados para a cópia não compartilhar bi-set com o original
    const mapaConjunto = {};
    return (itens || []).map((it) => {
      const novo = { ...it, uid: novoUid() };
      if (it.conjunto) {
        if (!mapaConjunto[it.conjunto]) mapaConjunto[it.conjunto] = "cj" + novoUid();
        novo.conjunto = mapaConjunto[it.conjunto];
      }
      return novo;
    });
  };
  const duplicarFicha = (t) => {
    const nova = { ...t, id: "ficha-" + Date.now(), nome: t.nome + " (cópia)", itens: clonarItens(t.itens) };
    setTreinos((prev) => [nova, ...prev]);
    registrarEvento("ficha-duplicada");
    setTimeout(() => avisar('Ficha copiada como "' + nova.nome + '". Edite o que quiser mudar.'), 120);
  };
  const duplicarPrograma = (p) => {
    const fichas = treinos.filter((t) => t.programaId === p.id);
    const pid = "prog-" + Date.now();
    setProgramas((prev) => [...prev, { id: pid, nome: p.nome + " (cópia)" }]);
    const copias = fichas.map((t, i) => ({
      ...t, id: "ficha-" + Date.now() + "-" + i, programaId: pid, itens: clonarItens(t.itens),
    }));
    setTreinos((prev) => [...copias, ...prev]);
    setProgAberto(pid);
    registrarEvento("programa-duplicado");
    setTimeout(() => avisar('Treino copiado com ' + copias.length + ' ' + plural(copias.length, "ficha", "fichas") + '. Os nomes ganharam "(cópia)".'), 150);
  };

  const novaFicha = (progId) => {
    setEditandoTreino({ id: String(Date.now()), nome: "", programaId: progId, itens: [] });
    setAba("editarTreino");
  };

  // ---- Assistente: gera um treino completo em 3 respostas ----
  const gerarTreinoAssistente = (objetivo, dias, nivel) => {
    const reps = objetivo === "forca" ? 6 : objetivo === "definir" ? 15 : 10;
    const series = objetivo === "forca" ? 4 : 3;
    const qtd = nivel === "iniciante" ? 5 : nivel === "intermediario" ? 6 : 8;
    const modelo = SPLITS[dias] || SPLITS[3];
    const nomeObj = objetivo === "forca" ? "Força" : objetivo === "definir" ? "Definição" : "Hipertrofia";
    registrarEvento("treino-gerado-assistente");
    const pid = "prog-" + Date.now();
    setProgramas((prev) => [...prev, { id: pid, nome: "Meu Treino - " + nomeObj + " (" + dias + "x/sem)" }]);
    const fichas = modelo.map((m, i) => ({
      id: "gerada-" + Date.now() + "-" + i,
      nome: m[0],
      programaId: pid,
      itens: m[1].slice(0, qtd).map((idEx) => ({ exercicioId: idEx, series: series, reps: reps, obs: "" })),
    }));
    setTreinos((prev) => [...fichas, ...prev]);
    setProgAberto(pid);
    setAba("treinos");
    setTimeout(() => avisar("Treino gerado com " + fichas.length + " fichas! Pode editar tudo do seu jeito. 💪"), 150);
  };

  // ---- Story: imagem de um treino do histórico ----
  const storyDeTreino = async (h) => {
    const st = statsTreino(h);
    const anteriores = historico.filter((x) => new Date(x.data) < new Date(h.data));
    const nRec = contarRecordesNovos(anteriores, h);
    const blob = await gerarImagemStory(linhasStoryTreino({
      nome: h.nome, series: st.series, reps: st.reps, volume: st.volume,
      duracao: h.duracaoMin, densidade: st.densidade, cargaMax: st.cargaMax, recordes: nRec,
    }));

  };

  // ---- Story: imagem do progresso ----
  const storyProgresso = async () => {

    const blob = await gerarImagemStory([
      { t: "MEU PROGRESSO 💪", tam: 66, cor: "#E1306C", esp: 90 },

      { t: "🏆 " + ganhas.length + " de " + CONQUISTAS.length + " conquistas", tam: 50, cor: "#E1306C", esp: 70 },

  // ---- Compartilhar um treino completo (programa com todas as fichas) ----
  const compartilharPrograma = async (p) => {
    const fichas = treinos.filter((t) => t.programaId === p.id && t.itens.length);
    if (!fichas.length) { avisar("Este treino ainda não tem fichas com exercícios."); return; }

  const aceitarProgramaRecebido = (p) => {

  // ---- Compartilhar ficha: a ficha inteira viaja dentro do link ----

  const aceitarFichaRecebida = (p) => {

      .map((e) => ({ ...e, foto: false }));

    novosCustom.forEach((e) => { idsValidos[e.id] = true; });

      .filter((it) => it && idsValidos[it.e])

    setTreinos((prev) => [{ id: "recebida-" + Date.now(), nome: p.n || "Ficha recebida", programaId: "prog-meus", itens: itens }, ...prev]);
    setAba("treinos");
